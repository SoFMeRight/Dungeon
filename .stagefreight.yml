version: 1

forges:
  - id: gitlab
    provider: gitlab
    url: "https://gitlab.prplanit.com"

repos:
  - id: primary
    forge: gitlab
    project: "SoFMeRight/dungeon"
    roles: [primary, publish-origin]
    branches:
      default: main
    worktree: "."

ci:
  image: docker.cr.pcfae.com/prplanit/stagefreight:latest-dev
  routing:
    perform:
      labels: [k8s-dungeon-production]

lifecycle:
  mode: gitops

gitops:
  backend: flux
  cluster:
    name: dungeon
    server: https://172.22.144.105:6443
    exposure:
      rules:
        - level: internet
          gateways: [phloem-gateway, cell-membrane-gateway]
        - level: intranet
          gateways: [xylem-gateway]
        - level: cluster
          service_types: [ClusterIP]
        - level: intranet
          service_types: [NodePort]
  oidc:
    audience: stagefreight

commit:
  conventional: true

glossary:
  types:
    feat:
      aliases: [f, feature]
      priority: 90
      release_visible: true
    fix:
      aliases: [fx, bugfix]
      priority: 80
      release_visible: true
    refactor:
      aliases: [rf]
      priority: 50
      release_visible: true
    chore:
      aliases: [c]
      priority: 20
      release_visible: false
    docs:
      aliases: [d]
      priority: 10
      release_visible: false

versioning:
  tag_sources:
    - id: stable
      pattern: "^v\\d+\\.\\d+\\.\\d+$"

narrate:
  badges:
    - id: build
      text: build
      value: "{env:BUILD_STATUS}"
      color: auto
      output: ".stagefreight/badges/build.svg"
      link: "https://gitlab.prplanit.com/SoFMeRight/dungeon/-/pipelines"
    - id: license
      text: license
      value: "AGPL-3.0"
      color: "#310937"
      output: ".stagefreight/badges/license.svg"
      link: LICENSE
    - id: updated
      text: updated
      value: "{env:BUILD_DATE}"
      color: "#236144"
      output: ".stagefreight/badges/updated.svg"
  patches:
    - file: "README.md"
      items:
        - id: badge.build
          kind: badge_ref
          ref: build
          placement:
            between: ["<!-- sf:badges:start -->", "<!-- sf:badges:end -->"]
            mode: replace
            inline: true
        - id: badge.license
          kind: badge_ref
          ref: license
          placement:
            between: ["<!-- sf:badges:start -->", "<!-- sf:badges:end -->"]
            mode: replace
            inline: true
        - id: badge.updated
          kind: badge_ref
          ref: updated
          placement:
            between: ["<!-- sf:badges:start -->", "<!-- sf:badges:end -->"]
            mode: replace
            inline: true
    - file: "docs/Apps_&_Services-Overview.md"
      items:
        - id: cluster-inventory
          kind: k8s-inventory
          placement:
            between: ["<!-- sf:k8s-inventory:start -->", "<!-- sf:k8s-inventory:end -->"]
            mode: replace
  commit:
    type: docs
    message: "refresh generated docs and badges"
    add:
      - "README.md"
      - "docs/Apps_&_Services-Overview.md"
      - ".stagefreight/badges"
      - ".stagefreight/manifests"
    push: true
    skip_ci: false

lint:
  level: full
  exclude:
    - "docs/assets/595775375_10215519096368048_5029737080243258222_n.jpg"
    - "docs/assets/dungeon-banner.png"
  modules:
    secrets:
      enabled: true
      exclude:
        - "fluxcd/infrastructure/services/base/vaultwarden/externalsecret.yaml"

toolchains:
  desired:
    trivy:
      version: "0.69.3"
    syft:
      version: "1.42.3"
    grype:
      version: "0.110.0"
    osv-scanner:
      version: "2.3.5"
    cosign:
      version: "3.0.6"
    flux:
      version: "2.8.3"
    kubectl:
      version: "1.34.2"
