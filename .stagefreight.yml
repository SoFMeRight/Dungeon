version: 1

forges:
  gitlab:
    provider: gitlab
    url: "https://gitlab.prplanit.com"

  github:
    provider: github
    url: "https://github.com"
    credentials: GITHUB              # → GITHUB_TOKEN (PROTECTED forge variable) for the mirror push

repos:
  primary:
    forge: gitlab
    project: "SoFMeRight/dungeon"
    roles: [primary, publish-origin]
    branches:
      default: main
    worktree: "."

  # Public mirror on GitHub — GitLab stays authoritative; git refs replicate one way.
  github-mirror:
    forge: github
    project: "sofmeright/Dungeon"
    roles: [mirror]
    sync:
      branches: all
      tags: all

ci:
  image: docker.cr.pcfae.com/prplanit/stagefreight:latest-dev
  routing:
    perform:
      labels: [k8s-dungeon-production]
    # publish runs scribe (badges + the k8s-inventory region + docs auto-commit)
    # — it needs cluster access (in-cluster auth on the production runner), or
    # the inventory silently stays stale ("no kubeconfig available").
    publish:
      labels: [k8s-dungeon-production]

lifecycle:
  mode: gitops

gitops:
  dungeon:
    backend: flux
    endpoint: https://172.22.144.105:6443
    exposure:
      - level: internet
        gateways: [phloem-gateway, cell-membrane-gateway]
      - level: intranet
        gateways: [xylem-gateway]
      - level: cluster
        service_types: [ClusterIP]
      - level: intranet
        service_types: [NodePort]
    oidc:
      audience: stagefreight

ansible:
  image: docker.io/hlhd/ansible:2.20.4-v1
  inventory: ansible/inventory
  ssh:
    user: kai
    credentials: DUNGEON              # → DUNGEON_SSH_KEY (PROTECTED forge variable)
    known_hosts: ansible/known_hosts  # committed fleet host keys — verification is always strict
  playbooks:
    provision-hosts:                  # node runtime convergence (cri-o + bundled crun)
      path: ansible/k8s/provision-hosts.yml
      groups: [k8s_worker, k8s_master]
      converge: true
    kubelet-provision:                # kubernetes component convergence (kubelet/kubeadm/kubectl)
      path: ansible/k8s/kubelet-provision.yml
      groups: [k8s_master, k8s_worker]
      converge: true

commit:
  conventional: true

glossary:
  types:
    feat:
      aliases: [f, feature]
      priority: 90
      release_visible: true
    fix:
      aliases: [fx, bugfix]
      priority: 80
      release_visible: true
    refactor:
      aliases: [rf]
      priority: 50
      release_visible: true
    chore:
      aliases: [c]
      priority: 20
      release_visible: false
    docs:
      aliases: [d]
      priority: 10
      release_visible: false

git:
  tags:
    stable: {pattern: "^v\\d+\\.\\d+\\.\\d+$"}

llms:
  # Model endpoint library — referenced by type: llm stencils via llm: <id>.
  # AI output is dispatch-only (stdout cards, notifications), never committed.
  glicynia: {provider: ollama, url: "http://glicynia:11434", model: "deepseek-r1:1.5b"}

stencils:
  # badges write to scribe.store/{id}.svg (default .stagefreight/scribe) — no output: needed

  # ── Row 1: identity / meta ──
  github: {render: shield, label: GitHub, message: mirror, color: "#181717", logo: github, logo_color: white, link: "https://github.com/sofmeright/Dungeon"}
  gitlab: {render: shield, label: GitLab, message: source, color: "#FC6D26", logo: gitlab, logo_color: white, link: "https://gitlab.prplanit.com/SoFMeRight/dungeon"}
  updated:
    label: updated
    message: "{commit.date}"        # YYYY-MM-DD — only churns the README when the date changes
    color: "#236144"
  license:
    label: license
    message: "AGPL-3.0"
    color: "#310937"
    link: LICENSE

  # ── Row 2: pipeline / tooling ──
  stagefreight: {render: shield, label: "managed by StageFreight", message: "{stagefreight.version}", color: "#310937", link: "https://github.com/sofmeright/stagefreight"}
  pipeline:
    label: pipeline
    message: "{env:BUILD_STATUS}"
    color: auto
    link: "https://gitlab.prplanit.com/SoFMeRight/dungeon/-/pipelines"
  security: {render: shield, label: Security, message: report, color: "#4B275F", link: "docs/container-security-audit.md"}

  # ── Row 3: stack at a glance ──
  ansible: {render: shield, label: Ansible, message: playbooks, color: "#EE0000", logo: ansible, logo_color: white, link: "ansible"}
  kubernetes: {render: shield, label: Kubernetes, message: "v1.35", color: "#326CE5", logo: kubernetes, logo_color: white, link: "docs/Hardware.md"}
  fluxcd: {render: shield, label: FluxCD, message: gitops, color: "#5468FF", logo: flux, logo_color: white, link: "fluxcd"}
  applications: {render: shield, label: Applications, message: "{inventory.dungeon.count}", color: "#0F1689", logo: kubernetes, logo_color: white, link: "docs/Apps_&_Services-Overview.md"}
  docker-compose: {render: shield, label: Docker-Compose, message: stacks, color: "#2496ED", logo: docker, logo_color: white, link: "docker-compose"}

  cluster-inventory: {type: k8s-inventory, catalog: .stagefreight-catalog.yml}

  # ── AI stencils (lazy — ollama is only called when a notification dispatches) ──
  ci-detail:
    type: text
    body: |
      {commit_title}
      {status} · {project} {ref}
      Failed in {failure.subsystem} — {failure.reason}
      {failures}
      Converged {reconcile.succeeded}/{reconcile.total} {reconcile.units} on {reconcile.cluster}
      Commits since {changelog.range} — {changelog.count}
  triage:
    type: llm
    llm: glicynia
    body: |
      {ci-detail}

      In 2-3 sentences: which kustomizations broke, the likely cause, and the
      first thing to check on the cluster.
  recap:
    type: llm
    llm: glicynia
    body: |
      {summary}

      In one or two sentences, recap this GitOps reconcile for a team chat —
      plain and direct, lead with what converged. No markdown, no preamble.

notifications:
  # Phone pings via the in-cluster ntfy (delivery-bag). credentials: NTFY resolves
  # the NTFY_TOKEN CI variable (write-only token, topic Dungeon-CI).
  phone:
    provider: ntfy
    url: https://ntfy.pcfae.com/Dungeon-CI
    credentials: NTFY
  triage:
    provider: ntfy
    url: https://ntfy.pcfae.com/Dungeon-CI
    credentials: NTFY
    body: "{triage}"
    when: {outcomes: [failure]}
  recap:
    provider: ntfy
    url: https://ntfy.pcfae.com/Dungeon-CI
    credentials: NTFY
    body: "🤖 {recap}"
    when: {outcomes: [success]}

scribe:
  files:
    readme.badges:       # Row 1 — identity / meta
      file: "README.md"
      between: ["<!-- sf:badges:start -->", "<!-- sf:badges:end -->"]
      inline: true
      items: [github, gitlab, updated, license]
    readme.tooling:      # Row 2 — pipeline / tooling
      file: "README.md"
      between: ["<!-- sf:tooling:start -->", "<!-- sf:tooling:end -->"]
      inline: true
      items: [stagefreight, pipeline, security]
    readme.stack:        # Row 3 — stack at a glance
      file: "README.md"
      between: ["<!-- sf:stack:start -->", "<!-- sf:stack:end -->"]
      inline: true
      items: [ansible, kubernetes, fluxcd, applications, docker-compose]
    apps.inventory:
      file: "docs/Apps_&_Services-Overview.md"
      between: ["<!-- sf:k8s-inventory:start -->", "<!-- sf:k8s-inventory:end -->"]
      items: [cluster-inventory]
  commit:
    type: docs
    message: "refresh generated docs and badges"
    add:
      - "README.md"
      - "docs/Apps_&_Services-Overview.md"
      - ".stagefreight/scribe"
      - ".stagefreight/manifests"
    push: true
    skip_ci: false

lint:
  level: full
  exclude:
    - "docs/assets/595775375_10215519096368048_5029737080243258222_n.jpg"
    - "docs/assets/dungeon-banner.png"
  modules:
    secrets:
      enabled: true
      exclude:
        - "fluxcd/infrastructure/services/base/vaultwarden/externalsecret.yaml"
    ansible:
      enabled: true

toolchains:
  trivy: "0.x"
  syft: "1.x"
  grype: "0.x"
  osv-scanner: "2.x"
  cosign: "3.x"
  flux: "2.x"
  kubectl: "1.35.x"
