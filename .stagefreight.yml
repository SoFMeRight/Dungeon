      docker: sofmeright
      ghcr: sofmeright
      github: SoFMeRight
      handle: sofmeright
    maintainer: SoFMeRight <sofmeright@gmail.com>
repos:
  github-mirror:
    forge: github
    project: SoFMeRight/dungeon
    roles:
      - mirror
      - publish-origin
    sync:
      git: true
      releases: true
  primary:
    branches:
      default: main
    forge: gitlab
    project: SoFMeRight/dungeon
    roles:
      - primary
    worktree: .
stencils:
  ci-detail:
    body: |
      {commit_title}
      {status} · {project} {ref}
      Failed in {failure.subsystem} — {failure.reason}
      {failures}
      Converged {reconcile.succeeded}/{reconcile.total} {reconcile.units} on {reconcile.cluster}
      Commits since {changelog.range} — {changelog.count}
    type: text
  presets:
    - https://gitlab.prplanit.com/PrPlanIT/MaintenancePolicy//preset/stencils-base.yml
    - https://gitlab.prplanit.com/PrPlanIT/MaintenancePolicy//preset/stencils-status.yml
    - https://gitlab.prplanit.com/PrPlanIT/MaintenancePolicy//preset/stencils-pipeline.yml
    - https://gitlab.prplanit.com/PrPlanIT/MaintenancePolicy//preset/stencils-gitops.yml
  recap:
    body: |
      {summary}

      In one or two sentences, recap this GitOps reconcile for a team chat —
      plain and direct, lead with what converged. No markdown, no preamble.
    llm: glicynia
    type: llm
  triage:
    body: |
      {ci-detail}

      In 2-3 sentences: which kustomizations broke, the likely cause, and the
      first thing to check on the cluster.
    llm: glicynia
    type: llm
toolchains:
  preset: https://gitlab.prplanit.com/PrPlanIT/MaintenancePolicy//preset/toolchains.yml
