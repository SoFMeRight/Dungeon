    credentials: NTFY
    provider: ntfy
    url: https://ntfy.pcfae.com/Dungeon-CI
  recap:
    body: "\U0001F916 {recap}"
    credentials: NTFY
    provider: ntfy
    url: https://ntfy.pcfae.com/Dungeon-CI
    when:
      outcomes:
        - success
  triage:
    body: '{triage}'
    credentials: NTFY
    provider: ntfy
    url: https://ntfy.pcfae.com/Dungeon-CI
    when:
      outcomes:
        - failure
orgs:
