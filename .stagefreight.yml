ansible:
  image: ghcr.io/homelabhd/ansible:v2.21.6
  inventory: ansible/inventory
  playbooks:
    kubelet-provision:
      converge: true
      groups:
        - k8s_master
        - k8s_worker
      path: ansible/k8s/kubelet-provision.yml
    provision-hosts:
      converge: true
      groups:
        - k8s_worker
        - k8s_master
      path: ansible/k8s/provision-hosts.yml
  ssh:
    credentials: DUNGEON
    known_hosts: ansible/known_hosts
    user: kai
ci:
