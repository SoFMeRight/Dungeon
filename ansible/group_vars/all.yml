# Node runtime pins — the single source of truth the convergence playbooks read
# (ansible/k8s/provision-hosts.yml) and Renovate tracks (k8s-nodes group: patch
# bumps auto-PR within the minor; a minor bump is a deliberate, approved move in
# lockstep with the cluster's kubernetes minor).
crio_version: "1.35.6"
kubernetes_version: "1.35.7"

# ── Fleet OS-patch wiring ────────────────────────────────────────────────────
# Environment-specific values the maintenance play reads — override per-inventory
# (a group_vars file) or per-run (Semaphore extra-vars / ansible-playbook -e).
# Nothing in the task logic hardcodes the environment.

kubectl_admin: "kubectl --kubeconfig /etc/kubernetes/admin.conf"   # kubectl on the control-plane delegate (cordon/drain/Ready)
control_plane_group: k8s_master        # its FIRST host is the kubectl delegate

# The host-class targets for maintenance/update-hosts.yml (k8s / proxmox /
# standalone) are NOT set here: a play's `hosts:` is resolved before group_vars
# load, so they live as inline defaults in that play and are overridden per-run
# with Semaphore extra-vars / -e (e.g. -e os_patch_k8s_group=my_nodes). See the
# play header for the three names.

# ── Kubelet configuration pins ───────────────────────────────────────────────
# Every KubeletConfiguration value the fleet pins, in one place. Applied by
# k8s/tuning/kubelet-config.yaml, which writes them to kube-system/kubelet-config
# first (the source of truth kubeadm regenerates each node file from) and then to
# each running node for immediate effect.
#
# Add a setting by adding a line here. Override for one run with
#   -e '{"kubelet_settings": {"maxPods": 300}}'
# noting that an override REPLACES the whole map rather than merging into it.

kubelet_settings:
  # Headroom for N+2 failover plus velero data-mover pods. The kubeadm default
  # is 110, which this fleet exceeds on several workers.
  maxPods: 250

  # Renovate churns images faster than pressure-based collection reclaims them,
  # so nodes filled up. imageMaximumGCAge is what fixes that: it evicts images
  # unused for a week whether or not the disk is under pressure, which is the
  # churn problem stated precisely.
  #
  # The thresholds are only the emergency backstop, and they must sit ABOVE the
  # fleet's irreducible footprint or they cannot function. At 60/50 they were
  # below it -- steady state is 62-66% of 155GiB with ~55GiB free -- so the high
  # threshold was permanently tripped, the low one permanently unreachable, and
  # kubelet collected continuously, freed 0 bytes because every remaining image
  # was in use, and logged FreeDiskSpaceFailed on a loop. An unsatisfiable
  # threshold protects nothing and buries the warning that would matter.
  imageGCHighThresholdPercent: 80
  imageGCLowThresholdPercent: 70
  imageMaximumGCAge: "168h0m0s"

  # Graceful Node Shutdown. At 0s the feature is OFF: kubelet registers no
  # systemd inhibitor and pods are killed rather than sent SIGTERM, so Postgres
  # never checkpoints and Galera never writes safe_to_bootstrap — every recovery
  # is a recovery from an unclean stop.
  #
  # The total is the budget for stopping every pod on the node. Critical pods are
  # stopped last and get the portion named below; ORDINARY PODS GET THE
  # DIFFERENCE — 150 - 30 = 120s here, and that 120s is the number that has to be
  # large enough, not the 150.
  #
  # 120s is where it sits because Harbor's core, registry and jobservice ask for
  # exactly that, and the registry can be mid-upload. Everything above it on this
  # fleet - gitlab-kas at 300s, the TURN relays and backup agents at 3600s - is
  # unreachable on a 7m41s battery at any setting, and is built to be interrupted.
  #
  # The ordinary budget must cover the slowest thing that has to finish writing,
  # which on this fleet is CNPG: a Postgres instance is SIGKILLed at its
  # `stopDelay`, and it only reaches the checkpoint after `smartShutdownTimeout`
  # elapses waiting for clients. So the chain that must hold is
  #
  #     smartShutdownTimeout <= stopDelay <= (shutdownGracePeriod - critical)
  #
  # and the whole per-host guest sequence must still fit the UPS battery. A pod
  # whose terminationGracePeriodSeconds exceeds the ordinary budget is killed at
  # the budget, not at its own value.
  shutdownGracePeriod: "150s"
  shutdownGracePeriodCriticalPods: "30s"

# systemd caps how long ANY delay inhibitor may hold a shutdown, and defaults to
# 5 seconds. Left at the default, shutdownGracePeriod above is decorative — it
# looks configured and gives you five seconds. Must be >= shutdownGracePeriod;
# the playbook refuses to run if it is not.
inhibit_delay_max: 180

# How long a node may take to come back Ready after its kubelet is restarted,
# and how patiently to wait for the unit itself.
kubelet_ready_timeout: 300s
kubelet_active_retries: 6
kubelet_active_delay: 10
# ============================================================================
# netconsole - kernel console mirrored to the network
# ============================================================================
# A panic never reaches journald: journald buffers and the kernel stops before
# the write lands, which is why `journalctl -k -b -1` is empty on a node that
# just panicked. netconsole writes printk straight to the NIC from inside the
# kernel, so the dying words leave the machine.
#
# The target is the netconsole-collector's LoadBalancer VIP, and the MAC is the
# DEFAULT GATEWAY's, not the collector's node. netpoll needs a literal IP and MAC
# at module insertion, and the VIP sits on a different subnet to the nodes - so
# the frame goes to the router, which delivers it to whichever node holds the
# VIP. That is what lets the collector be scheduled anywhere without touching
# any sender, and it means a node can capture its own panic too.
#
# Only messages at or above the console loglevel (currently 4, warn) are
# mirrored. A panic is level 0, so it is always sent; an info-level write to
# /dev/kmsg is not, which makes it a misleading way to test this.
netconsole_target_ip: "172.22.30.240"      # netconsole-collector LoadBalancer VIP
netconsole_target_mac: "00:00:5e:00:01:28" # default gateway (VRRP virtual MAC)
netconsole_port: 6666
netconsole_dev: enp6s18
