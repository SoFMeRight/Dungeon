---
# Post-reboot health gate for a Proxmox hypervisor: block until the rebooted
# host has rejoined PVE quorum AND Ceph has recovered what the reboot took down,
# before the serial roll moves to the next host. The bar is the standard rolling
# OSD-host one: every mon in quorum, every in OSD up, every PG active+clean —
# otherwise the next reboot risks min_size violations. Not HEALTH_OK: warnings
# a reboot neither causes nor clears (fragmentation, nearfull, slow-op alerts)
# would hold the roll forever.
# Runs on the just-rebooted host (root); no migration, no drain.

- name: Wait for Proxmox cluster quorum on {{ inventory_hostname }}
  ansible.builtin.command: pvecm status
  register: pvecm
  until: pvecm.stdout is search('Quorate:\s+Yes')
  retries: 30
  delay: 10
  changed_when: false
  check_mode: false

- name: Wait for Ceph to recover (mons quorate, in OSDs up, PGs active+clean)
  ansible.builtin.command: ceph -s -f json
  register: ceph_status
  until:
    - ceph_status.rc == 0
    - (ceph_status.stdout | from_json).quorum_names | length == (ceph_status.stdout | from_json).monmap.num_mons
    - (ceph_status.stdout | from_json).osdmap.num_up_osds == (ceph_status.stdout | from_json).osdmap.num_in_osds
    - >-
      (ceph_status.stdout | from_json).pgmap.pgs_by_state
      | selectattr('state_name', 'equalto', 'active+clean')
      | map(attribute='count') | sum == (ceph_status.stdout | from_json).pgmap.num_pgs
  retries: 60
  delay: 15
  changed_when: false
  check_mode: false
