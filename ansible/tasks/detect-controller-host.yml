---
# Sets hosts_ansible_controller=true when THIS proxmox host is currently running
# the guest that the ansible controller executes from. Detected LIVE against the
# guest's real hostname, so it follows the VM/CT wherever it has migrated — no
# hardcoded node, no drift. Covers QEMU VMs (guest agent) and LXC (pct exec).
# The controller's own host must never be rebooted mid-run — that kills the run.

- name: Resolve the ansible controller's hostname (evaluated on the control node)
  ansible.builtin.set_fact:
    controller_hostname: "{{ lookup('pipe', 'hostname') }}"

- name: Does this hypervisor run the controller guest?
  ansible.builtin.shell: |
    set -o pipefail
    target="{{ controller_hostname }}"
    found=no
    # QEMU VMs — ask the guest agent its hostname
    for id in $(qm list 2>/dev/null | awk 'NR>1 && $3=="running"{print $1}'); do
      hn=$(qm agent "$id" get-host-name 2>/dev/null \
        | python3 -c 'import sys,json; print(json.load(sys.stdin)["result"]["host-name"])' 2>/dev/null || true)
      if [ "$hn" = "$target" ]; then found=yes; break; fi
    done
    # LXC containers — exec hostname directly
    if [ "$found" = "no" ]; then
      for id in $(pct list 2>/dev/null | awk 'NR>1 && $2=="running"{print $1}'); do
        hn=$(pct exec "$id" -- hostname 2>/dev/null || true)
        if [ "$hn" = "$target" ]; then found=yes; break; fi
      done
    fi
    echo "$found"
  register: controller_probe
  changed_when: false

- name: Record whether this host runs the controller
  ansible.builtin.set_fact:
    hosts_ansible_controller: "{{ 'yes' in controller_probe.stdout }}"
