---
# Reboot the node only when os-upgrade.yml set node_reboot_required. On a
# clustered node this runs INSIDE the drain window (node already emptied); on
# an unclustered node it runs directly. ansible.builtin.reboot waits for the
# host to come back before continuing.
#
# reboot_timeout_s bounds the wait for the host to go down and come back. A guest
# is back within a few minutes, so a shutdown that never completes fails the roll
# instead of holding it for an hour. A caller whose hosts legitimately take longer
# (a hypervisor halting its guests, then POST) sets its own.

- name: Reboot {{ ansible_facts['hostname'] }} (kernel/library update pending)
  ansible.builtin.reboot:
    msg: "Reboot initiated by ansible after OS update"
    reboot_timeout: "{{ reboot_timeout_s | default(900) }}"
    test_command: uptime
  when: node_reboot_required | default(false) | bool
