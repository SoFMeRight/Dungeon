---
# Applies the declared startup policy to every Proxmox guest, over the API.
#
# Over the API rather than `qm set` over SSH, because that needs root on five
# hypervisors and root can do anything. This token is narrower than root but not
# as narrow as it looks — see Sys.Modify below. What it decisively cannot do is
# power anything: Sys.PowerMgmt and VM.PowerMgmt are both absent, so the
# credential that edits shutdown policy cannot perform a shutdown.
#
# Create the token once, on any node:
#
#   pveum role add GitOps -privs "VM.Config.Options,VM.Audit,Sys.Modify"
#   pveum user add stagefreight@pve
#   pveum acl modify / --users stagefreight@pve --roles GitOps
#   pveum user token add stagefreight@pve guest-config --privsep 1
#   pveum acl modify / --tokens 'stagefreight@pve!guest-config' --roles GitOps
#
# Sys.Modify is what actually writes this field. Proxmox treats `startup` as host
# configuration rather than guest configuration — order= changes what the
# hypervisor does at shutdown, not what the guest does — so it checks Sys.Modify
# on `/` and ignores VM.Config.Options here entirely. Without it every GET
# succeeds and every PUT is 403 "Permission check failed (/, Sys.Modify)", so
# this play reads the whole cluster and then dies on its first write.
# VM.Config.Options stays because the read path uses it.
#
# The cost is real: Sys.Modify also permits node network, DNS, time and
# datacenter settings. Accepted because this is a dedicated user with one token,
# held in OpenBao, driving one playbook that writes one field — and because the
# alternative was root SSH on five hypervisors.
#
# With privsep 1 a token's effective permissions are the intersection of its own
# ACL and the owning user's, so both entries are required — ACL the token alone
# and every call is a 403.
#
# VM.Audit is not optional either. Reading a guest config is gated on it, and
# /cluster/resources filters to what the caller may audit rather than refusing —
# so without it this play enumerates zero guests, reports nothing to change, and
# looks like a clean run.
#
# and give the play PVE_API_TOKEN_ID and PVE_API_TOKEN_SECRET. Nothing is
# hardcoded here; the endpoint and credential are environment, not logic.
#
# Declares order, up and down together because they are one Proxmox field.
# Writing one without reading the others is how an order gets silently discarded.
- name: Ad Arbitorium 🔐 - GitOps - Infrastructure - Proxmox guest startup policy
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - ../vars/pve-guest-startup.yml

  vars:
    pve_api_url: "{{ lookup('env', 'PVE_API_URL') }}"
    pve_api_token_id: "{{ lookup('env', 'PVE_API_TOKEN_ID') }}"
    pve_api_token_secret: "{{ lookup('env', 'PVE_API_TOKEN_SECRET') }}"
    pve_api_validate_certs: true
    # Report without changing. The default, because a play that edits shutdown
    # policy across a cluster should be asked twice.
    pve_startup_check_only: true

  tasks:
    - name: Refusing to run without an endpoint and a token...
      ansible.builtin.assert:
        that:
          - pve_api_url | length > 0
          - pve_api_token_id | length > 0
          - pve_api_token_secret | length > 0
        fail_msg: >-
          PVE_API_URL, PVE_API_TOKEN_ID and PVE_API_TOKEN_SECRET must be set.
          The token needs VM.Config.Options and VM.Audit, and nothing else.

    - name: Listing every guest in the cluster...
      ansible.builtin.uri:
        url: "{{ pve_api_url }}/api2/json/cluster/resources?type=vm"
        method: GET
        headers:
          Authorization: "PVEAPIToken={{ pve_api_token_id }}={{ pve_api_token_secret }}"
        validate_certs: "{{ pve_api_validate_certs }}"
        status_code: 200
      register: resources

    - name: Refusing to run against an empty inventory...
      ansible.builtin.assert:
        that:
          - resources.json.data | length > 0
          - resources.json.data | selectattr('name', 'defined')
            | map(attribute='name') | select('in', pve_guest_startup.keys() | list)
            | list | length > 0
        fail_msg: >-
          The API returned no guests, or none that the policy declares.
          /cluster/resources filters to what the token may audit rather than
          refusing, so a token without VM.Audit reaches this point looking
          healthy and would then report nothing to change. Check the token's
          role before assuming the cluster is empty.

    - name: Refusing to act on a name that is not unique...
      ansible.builtin.assert:
        that: >-
          resources.json.data
          | selectattr('name', 'defined')
          | map(attribute='name')
          | select('in', pve_guest_startup.keys() | list)
          | list | unique | length
          ==
          resources.json.data
          | selectattr('name', 'defined')
          | map(attribute='name')
          | select('in', pve_guest_startup.keys() | list)
          | list | length
        fail_msg: >-
          A declared name matches more than one guest. Policy is keyed by name so
          that it can be read; an ambiguous name would silently apply to the
          wrong machine.

    - name: Reading each guest's current startup setting...
      ansible.builtin.uri:
        url: "{{ pve_api_url }}/api2/json/nodes/{{ item.node }}/{{ item.type }}/{{ item.vmid }}/config"
        method: GET
        headers:
          Authorization: "PVEAPIToken={{ pve_api_token_id }}={{ pve_api_token_secret }}"
        validate_certs: "{{ pve_api_validate_certs }}"
        status_code: 200
      register: configs
      loop: "{{ resources.json.data | sort(attribute='vmid') }}"
      loop_control:
        label: "{{ item.vmid }} {{ item.name | default('') }}"

    - name: Reporting declared guests that will never be sequenced...
      # Proxmox only sequences guests it starts. order= on an onboot=0 guest is
      # inert, so declaring one is a claim the hypervisor will never honour.
      # Reported rather than fatal: a guest may be legitimately parked.
      ansible.builtin.debug:
        msg: >-
          {{ inert | join(', ') }} — declared in policy but onboot is not set, so
          Proxmox will never start them and the order they are given is inert.
          Either set onboot on them or drop them from the policy.
      vars:
        inert: >-
          {{ configs.results
             | selectattr('json.data.name', 'defined')
             | selectattr('json.data.name', 'in', pve_guest_startup.keys() | list)
             | rejectattr('json.data.onboot', 'defined')
             | map(attribute='json.data.name') | list
             +
             configs.results
             | selectattr('json.data.name', 'defined')
             | selectattr('json.data.name', 'in', pve_guest_startup.keys() | list)
             | selectattr('json.data.onboot', 'defined')
             | selectattr('json.data.onboot', 'equalto', 0)
             | map(attribute='json.data.name') | list }}
      when: inert | length > 0

    - name: Reporting running guests that will not come back...
      # Not policy's business to fix, but a power event is exactly when this bites:
      # a guest that is up with onboot=0 stays down after the hosts return.
      ansible.builtin.debug:
        msg: >-
          {{ orphans | join(', ') }} — running now, but onboot is not set, so they
          will not return after a power event.
      vars:
        orphans: >-
          {{ resources.json.data
             | selectattr('status', 'equalto', 'running')
             | map(attribute='name') | list
             | intersect(
                 configs.results
                 | selectattr('json.data.name', 'defined')
                 | rejectattr('json.data.onboot', 'defined')
                 | map(attribute='json.data.name') | list
                 +
                 configs.results
                 | selectattr('json.data.name', 'defined')
                 | selectattr('json.data.onboot', 'defined')
                 | selectattr('json.data.onboot', 'equalto', 0)
                 | map(attribute='json.data.name') | list) }}
      when: orphans | length > 0

    - name: Working out what each guest should declare...
      ansible.builtin.set_fact:
        startup_plan: >-
          {{ startup_plan | default([]) + [{
               'vmid':    item.item.vmid,
               'node':    item.item.node,
               'type':    item.item.type,
               'name':    item.item.name | default(''),
               'current': item.json.data.startup | default(''),
               'onboot':  item.json.data.onboot | default(0) | int,
               'desired': (
                   ( ['order=' ~ (pve_guest_startup[item.item.name | default('')].order)]
                     if (item.item.name | default('')) in pve_guest_startup
                        and pve_guest_startup[item.item.name | default('')].order is defined
                     else [] )
                 + ( ['up=' ~ (pve_guest_startup[item.item.name | default('')].up)]
                     if (item.item.name | default('')) in pve_guest_startup
                        and pve_guest_startup[item.item.name | default('')].up is defined
                     else [] )
                 + ( ['down=' ~ (pve_guest_startup[item.item.name | default('')].down
                                 | default(pve_startup_default_down))] )
               ) | join(',')
             }] }}
      loop: "{{ configs.results }}"
      loop_control:
        label: "{{ item.item.vmid }}"

    - name: Setting aside the guests that differ...
      ansible.builtin.set_fact:
        startup_diff: >-
          {{ startup_diff | default([])
             + ([item] if item.current != item.desired else []) }}
      loop: "{{ startup_plan }}"
      loop_control:
        label: "{{ item.vmid }}"

    # Declarative means undeclared is a statement, so a guest carrying an order
    # this file does not mention would have it erased. That is how a router stops
    # in the same wave as the guests depending on it. Stop instead and say which,
    # because an order nobody wrote down is still an order somebody meant.
    #
    # Bounded to onboot=1. Proxmox only sequences guests it starts, so an order on
    # a guest that never autostarts is one nothing will ever read — there is no
    # intent there to preserve, and demanding it be declared would mean declaring
    # every parked spare to describe a boot it takes no part in.
    - name: Refusing to erase an order the policy does not mention...
      ansible.builtin.assert:
        that: undeclared_orders | length == 0
        fail_msg: >-
          These guests declare order= or up= that this policy does not mention,
          and applying it would erase them: {{ undeclared_orders | join(', ') }}.
          Add them to ansible/vars/pve-guest-startup.yml, deliberately, or remove
          the setting from the guest first.
      vars:
        undeclared_orders: >-
          {{ startup_plan
             | selectattr('onboot', 'equalto', 1)
             | selectattr('current', 'search', '(order|up)=')
             | rejectattr('name', 'in', pve_guest_startup.keys() | list)
             | map(attribute='name') | list }}

    - name: Reporting what would change...
      ansible.builtin.debug:
        msg: >-
          {{ startup_plan | selectattr('current', 'ne', '') | list | length }} of
          {{ startup_plan | length }} guests already declare something;
          {{ startup_diff | default([]) | length }} differ from the policy

    - name: Showing each guest that differs...
      ansible.builtin.debug:
        msg: "{{ item.vmid }} {{ item.name }} on {{ item.node }}: '{{ item.current }}' -> '{{ item.desired }}'"
      loop: "{{ startup_diff | default([]) }}"
      loop_control:
        label: "{{ item.vmid }}"

    - name: Declaring the policy on each guest that differs...
      ansible.builtin.uri:
        url: "{{ pve_api_url }}/api2/json/nodes/{{ item.node }}/{{ item.type }}/{{ item.vmid }}/config"
        method: PUT
        headers:
          Authorization: "PVEAPIToken={{ pve_api_token_id }}={{ pve_api_token_secret }}"
        body_format: form-urlencoded
        body:
          startup: "{{ item.desired }}"
        validate_certs: "{{ pve_api_validate_certs }}"
        status_code: 200
      loop: "{{ startup_diff | default([]) }}"
      loop_control:
        label: "{{ item.vmid }} {{ item.name }}"
      when: not pve_startup_check_only | bool
