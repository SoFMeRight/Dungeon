---
# Declared shutdown and startup policy for every Proxmox guest.
#
# `startup` is one Proxmox field holding three things:
#   order=N   lower starts earlier and stops LATER. order=1 is first up, last down.
#   up=N      seconds to wait after this guest starts before starting the next.
#   down=N    seconds to wait for this guest to stop before killing it.
#
# Anything not named here gets the default budget and no order, which means it
# stops in the first wave alongside its unordered peers. That is correct for a
# peer — a Kubernetes node has nothing waiting on it — and wrong for anything
# others depend on while they are still shutting down.
#
# Order is per-host. Proxmox sequences each hypervisor's own guests and cannot
# express "wait for a guest on another node", so a dependency that crosses hosts
# is not something this file can state. Keep such guests on the same host, or
# accept that the ordering is advisory across the cluster.

# Every guest gets at least this long to stop. Proxmox's own default is 180s and
# a graceful Kubernetes guest measured 185s on 2026-09-24, so the default is
# deliberately above both.
pve_startup_default_down: 240

# name -> what it declares. Names are used rather than vmids because a policy
# nobody can read is a policy nobody maintains; the play refuses to run if a name
# is ambiguous across the cluster.
pve_guest_startup:

  # Tiers, in Proxmox's convention: a lower order starts earlier and stops later,
  # so tier 1 is first up and last down. Read the list downwards for startup and
  # upwards for shutdown.
  #
  #   1  routers      nothing else has a network without them
  #   2  DNS          up once there is a network, down just before it goes
  #   4  storage      the archive outlives the workloads that write to it
  #   5  kubernetes   up once it can resolve and store; down before either goes
  #   9  late         declared this way already; first down among the ordered
  #      unordered    everything else: up last, down first

  # ── 1. Routers ──────────────────────────────────────────────────────────────
  # First up, last down. Everything else is reachable only through these.
  shield-generator-pfSense: {order: 1}
  shield-regenerator-pfSense: {order: 1}
  # The OPNsense pair (199 Avocado, 299 Bamboo) is deliberately absent. Both are
  # stopped with onboot=0 and carry no startup field, so Proxmox never sequences
  # them: they are spares, not live routers.

  # ── 2. DNS ──────────────────────────────────────────────────────────────────
  # Up immediately after the routers, down immediately before them. Everything
  # that resolves a name while it is stopping depends on these still being there.
  The-Usual-Suspect: {order: 2}
  Homing-Pigeon: {order: 2}

  # ── 3. Storage and backup targets ───────────────────────────────────────────
  # Both receive writes from things that stop later, so both must still be there
  # when those stop. Gringotts holds the CNPG archive; Priscilla is the PBS the
  # hypervisors back up to.
  #
  # up=200 on Gringotts is the only real delay in the whole boot: every later
  # tier waits for it. order= alone costs nothing, up= costs seconds.
  Gringotts: {order: 3, up: 200}
  Priscilla: {order: 3}

  # ── 4. Kubernetes ───────────────────────────────────────────────────────────
  # After network, name resolution and storage; before everything that is not
  # infrastructure. Note the limit: order is per-host, and these ten are spread
  # across all five hypervisors.
  Dungeon-Map-001: {order: 4}
  Dungeon-Map-002: {order: 4}
  Dungeon-Map-003: {order: 4}
  Dungeon-Map-004: {order: 4}
  Dungeon-Map-005: {order: 4}
  Dungeon-Chest-001: {order: 4}
  Dungeon-Chest-002: {order: 4}
  Dungeon-Chest-003: {order: 4}
  Dungeon-Chest-004: {order: 4}
  Dungeon-Chest-005: {order: 4}

  # ── 5. Telephony ────────────────────────────────────────────────────────────
  Bluebell: {order: 5}

  # ── 6. Platform ─────────────────────────────────────────────────────────────
  # Nothing depends on these, so they stop early. Dungeon-Pedestal is the
  # Boundary/SSH bastion: move it to 2 if it is ever the break-glass path into a
  # bad boot, because order 2 is the last thing standing after the routers.
  Ant-Parade: {order: 6}
  Dungeon-Pedestal: {order: 6}
  Freightyard: {order: 6}

  # ── 7. Docker services ──────────────────────────────────────────────────────
  # Moor runs mailcow and Bitwarden. Not mission critical: up after the phones
  # and the platform, down before both.
  Moor: {order: 7}

  # ── 9. Windows Server forest ────────────────────────────────────────────────
  # Late on purpose: nothing in the estate authenticates against these, so they
  # buy nothing by starting early and would only delay what does matter. First
  # down among the ordered. Lancifolia had no startup field at all while the
  # other two sat at 9; the forest now agrees with itself.
  Zebrina: {order: 9}
  Tradescantia: {order: 9, up: 0}
  Lancifolia: {order: 9}

  # ── Unordered ───────────────────────────────────────────────────────────────
  # Up last, down first. Deliberate for two groups:
  #   nginx proxies (Cell-Membrane, Xylem, Phloem) — superseded by Gateway API,
  #     and ingress should stop before its backends in any case;
  #   end devices and every stopped guest — nothing waits on them.
