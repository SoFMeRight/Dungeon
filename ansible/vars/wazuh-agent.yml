---
# Wazuh agent enrollment. A host's tenant (its agent group, which labels every alert
# agent.labels.tenant) is `wazuh_tenant` from group_vars; a host without one is refused.
wazuh_manager: wazuh-manager.prplanit.com
# Agents may not be newer than the manager; keep this on the manager's version.
wazuh_agent_version: "4.14.8-1"
wazuh_apt_repo: https://packages.wazuh.com/4.x/apt/
wazuh_apt_key: https://packages.wazuh.com/key/GPG-KEY-WAZUH
# optcp's root CA (OpenBao optcp-pki), which signs the manager's enrollment certificate
# through optcp-pki-int. Enrolled agents never use it again; it is checked at enrollment.
wazuh_manager_ca_file: ../files/optcp-pki-ca.pem
# Seconds an apt step may take before the host fails instead of stalling the run.
wazuh_apt_timeout: 600
# Windows installs the same version from its MSI.
wazuh_windows_msi_url: "https://packages.wazuh.com/4.x/windows/wazuh-agent-{{ wazuh_agent_version }}.msi"
