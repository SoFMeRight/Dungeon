---
# rbd-rook-migration.yml — re-adopt existing RBD PVCs from the standalone ceph-csi Helm driver
# (rbd.csi.ceph.com) onto the Rook ceph-csi-operator driver (gorons-bracelet.rbd.csi.ceph.com),
# ONE volume at a time. ZERO-COPY: the rbd image never moves — a new PV points the operator driver
# at the SAME image. No data copy, no new space. Each volume is a brief blip; the cluster stays up.
#
# WHY re-adoption and not `rbd cp`: both drivers are the same ceph-csi RBD binary against the same
# external ceph (clusterID 0985467c…, pool dungeon). The volumeHandle encodes clusterID+pool+UUID —
# NOT the driver name — and the ceph-csi journal lives in the pool, so the operator driver mounts
# the existing image unchanged, keeping full dynamic management (expand/delete). Proven end-to-end.
#
# SCOPE (v1 — deliberately low-risk). The discovery script tiers every RBD PV:
#   auto   : mounted by exactly one running Deployment, RWO  -> swept by default (scale 0->N = a blip)
#   review : bound + unused + standalone-looking             -> migrated ONLY if named in targets_list
#   skip   : StatefulSet / CNPG / RWX / orphaned / ordinal   -> NEVER touched here (needs the
#            deliberate per-StatefulSet cascade=orphan procedure — the DB crown jewels)
#
# SAFETY RAILS (no data loss is the invariant):
#   - dry_run defaults TRUE — prints the plan, mutates nothing. Add -e confirm=true to execute.
#   - Per volume: reclaimPolicy forced to Retain BEFORE anything is deleted (the rbd image is never
#     destroyed), the image's existence is verified in ceph, and the old PV + PVC are ESCROWed to
#     {{ escrow_dir }} as re-appliable manifests.
#   - block/rescue ROLLBACK: on ANY failure the new PV/PVC are removed and the old PVC+PV are
#     recreated from escrow (image was Retain-preserved) and the workload scaled back up. Lossless.
#   - Serial, one volume at a time; verifies Bound + Deployment Ready before moving on.
#
# USAGE (same container pattern as postgres-major-upgrade.yml):
#   docker run --rm -v ~/.kube:/root/.kube:ro -v /srv/dungeon:/dungeon -v ~/backups/_rbd-rook:/escrow \
#     prplanit/ansible-oci:<tag> \
#     ansible-playbook /dungeon/ansible/k8s/rbd-rook-migration.yml [flags]
#
#   # See the full tiered plan (safe, no changes):        (no flags; add -e include_sts=true to list STSs)
#   # Execute the auto tier (Deployment/standalone):       -e confirm=true
#   # Also migrate specific review volumes:                -e confirm=true -e 'targets_list=["tingle-tuner/searxng-redis-data"]'
#   # Migrate specific StatefulSets (only those):          -e confirm=true -e 'sts_targets=["temple-of-time/ghost-mysql"]'
#   # Migrate everything in one namespace (auto+review+sts):-e confirm=true -e targets=lens-of-truth -e include_sts=true
#   # Migrate ALL StatefulSets (big — every DB, serial):   -e confirm=true -e include_sts=true
#   # Roll a volume back from escrow (old driver):         -e confirm=true -e rollback=NS/PVC

- name: Migrate RBD PVCs onto the Rook operator driver (zero-copy re-adoption)
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    old_driver: rbd.csi.ceph.com
    new_driver: gorons-bracelet.rbd.csi.ceph.com
    operator_ns: gorons-bracelet
    node_secret: csi-rbd-node
    provisioner_secret: csi-rbd-provisioner
    new_storageclass: ceph-rbd
    escrow_dir: /escrow
    confirm: false            # dry_run is the inverse; nothing mutates unless this is true
    targets: ""               # limit to a single namespace (applies to both tiers)
    targets_list: []          # explicit ["ns/pvc", …] — may include review-tier volumes
    include_sts: false        # also migrate whole StatefulSets (each: scale 0 -> swap PVCs -> scale up)
    sts_targets: []           # explicit ["ns/sts", …] StatefulSets to migrate (implies include_sts)
    rollback: ""              # "ns/pvc" — restore that volume to the old driver from escrow

  tasks:
    - name: Set run mode
      set_fact:
        dry_run: "{{ not (confirm | bool) }}"

    # `-e list=[a,b]` arrives as a STRING; Jinja's `in` test then substring-matches (e.g. "ghost"
    # would match "ghost-mysql"). Coerce to real lists so membership is exact.
    - name: Normalize list inputs
      set_fact:
        tl: "{{ targets_list if (targets_list is not string) else (targets_list | from_yaml) }}"
        stg: "{{ sts_targets if (sts_targets is not string) else (sts_targets | from_yaml) }}"

    - name: Locate the ceph toolbox pod (for rbd image checks)
      ansible.builtin.command: kubectl get pods -n {{ operator_ns }} -o jsonpath={.items[*].metadata.name}
      register: tb_raw
      changed_when: false

    - name: Set toolbox pod
      set_fact:
        toolbox_pod: "{{ (tb_raw.stdout.split() | select('search', 'rbd-toolbox|rook-ceph-tools') | list | first) | default('', true) }}"

    - name: Ensure escrow dir exists
      ansible.builtin.file:
        path: "{{ escrow_dir }}"
        state: directory
        mode: "0700"

    # ---------------------------------------------------------------- rollback path
    - name: Roll back one volume from escrow
      when: rollback | length > 0
      block:
        - name: Rollback
          ansible.builtin.include_tasks: tasks/rbd-rook-rollback.yml
          vars:
            rb_ns: "{{ rollback.split('/')[0] }}"
            rb_pvc: "{{ rollback.split('/')[1] }}"
        - name: End play after rollback
          ansible.builtin.meta: end_play

    # ---------------------------------------------------------------- discovery + plan
    - name: Discover + classify RBD volumes
      ansible.builtin.command: python3 {{ playbook_dir }}/files/rbd-migration-discover.py
      register: discover_raw
      changed_when: false

    - name: Parse candidates
      set_fact:
        candidates: "{{ discover_raw.stdout | from_json }}"

    # Base pool: the auto tier always, plus any review-tier volume explicitly named in targets_list.
    - name: Build base selectable pool
      set_fact:
        base_pool: >-
          {{ (candidates | selectattr('tier', 'equalto', 'auto') | list)
             + (candidates | selectattr('tier', 'equalto', 'review')
                           | selectattr('key', 'in', tl) | list) }}

    # Then narrow: explicit targets_list wins; else a namespace filter; else — if the run is scoped
    # to specific StatefulSets (sts_targets) — nothing (an STS-only run must NOT also sweep auto);
    # else the whole base pool (the default auto sweep when no scope is given).
    - name: Narrow the selection
      set_fact:
        selected: >-
          {{ (base_pool | selectattr('key', 'in', tl) | list) if (tl | length > 0)
             else ((base_pool | selectattr('namespace', 'equalto', targets) | list) if (targets | length > 0)
             else ([] if (stg | length > 0) else base_pool)) }}

    # StatefulSet selection: sts-tier records, enabled by include_sts or sts_targets, optionally
    # scoped by namespace (targets) or by "ns/sts" (sts_targets), then grouped per StatefulSet.
    - name: Select StatefulSet volumes
      set_fact:
        sts_pool: >-
          {{ [] if not (include_sts | bool) and (stg | length == 0)
             else ((candidates | selectattr('tier', 'equalto', 'sts')
                               | selectattr('sts_group', 'in', stg) | list) if (stg | length > 0)
             else ((candidates | selectattr('tier', 'equalto', 'sts')
                               | selectattr('namespace', 'equalto', targets) | list) if (targets | length > 0)
             else (candidates | selectattr('tier', 'equalto', 'sts') | list))) }}

    - name: Group StatefulSet volumes by StatefulSet
      set_fact:
        sts_groups: "{{ sts_pool | groupby('sts_group') }}"

    - name: Print the tiered plan
      ansible.builtin.debug:
        msg: |
          ── RBD → Rook migration plan ──────────────────────────────
          mode        : {{ 'DRY-RUN (no changes)' if dry_run else 'EXECUTE' }}
          toolbox     : {{ toolbox_pod | default('NONE — image check will be skipped', true) }}
          totals      : auto={{ candidates | selectattr('tier','equalto','auto') | list | length }}
                        review={{ candidates | selectattr('tier','equalto','review') | list | length }}
                        sts={{ candidates | selectattr('tier','equalto','sts') | list | length }}
                        skip={{ candidates | selectattr('tier','equalto','skip') | list | length }}
          selected (Deployment/standalone): {{ selected | length }}
          {% for r in selected %}
            • {{ r.namespace }}/{{ r.pvc }}  ({{ r.capacity }}, tier={{ r.tier }}, owner={{ r.owner_kind }}{{ ':' ~ r.owner_name if r.owner_name else '' }})
          {% endfor %}
          selected StatefulSets: {{ sts_groups | length }} ({{ sts_pool | length }} volume(s))
          {% for grp in sts_groups %}
            ▸ {{ grp.0 }}  ({{ grp.1 | length }} PVC(s): {{ grp.1 | map(attribute='pvc') | join(', ') }})
          {% endfor %}
          {% if not selected and not sts_groups %}(nothing selected — pass -e targets / -e targets_list / -e include_sts / -e sts_targets){% endif %}

    - name: Migrate each selected Deployment/standalone volume (serial)
      ansible.builtin.include_tasks: tasks/rbd-rook-migrate-one.yml
      loop: "{{ selected }}"
      loop_control:
        loop_var: vol
        label: "{{ vol.namespace }}/{{ vol.pvc }}"
      when: not dry_run and selected | length > 0

    - name: Migrate each selected StatefulSet (serial, one STS at a time)
      ansible.builtin.include_tasks: tasks/rbd-rook-migrate-sts.yml
      loop: "{{ sts_groups }}"
      loop_control:
        loop_var: grp
        label: "{{ grp.0 }}"
      vars:
        sts_vols: "{{ grp.1 }}"
      when: not dry_run and sts_groups | length > 0
