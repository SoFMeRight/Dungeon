---
# Converges each kubernetes node's cri-o (and its bundled crun) to the pinned
# crio_version from group_vars/all.yml. Per-host idempotent: a node already at
# the pin is skipped without cordon/drain, so the play is safe on every
# reconcile. Workers roll first, then control-plane, one node at a time; a
# failed node stops the play before the next node is touched.
#
# After the workers converge, re-renders the proton-fsync and buildkitd seccomp
# profiles from their new runtime (tuning/seccomp-proton-fsync.yaml,
# tuning/seccomp-buildkitd.yaml).
#
# Then installs the pinned kernel flavour (k8s_kernel_package) on every node,
# without rebooting; maintenance/update-hosts.yml boots it inside a drain.
#
# The first play makes every node trust optcp's SSH CA (../tasks/ssh-ca-trust.yml),
# which node-converge signs its per-run certificate with. The second leaves package
# upgrades to maintenance/update-hosts.yml's drain-wrapped roll.

- name: Trust optcp's SSH CA
  hosts: k8s_worker:k8s_master
  become: true
  tasks:
    - ansible.builtin.import_tasks: ../tasks/ssh-ca-trust.yml
  handlers:
    - name: Reload sshd
      ansible.builtin.systemd_service:
        name: ssh
        state: reloaded

- name: Upgrade packages only inside a drain
  hosts: k8s_worker:k8s_master
  become: true
  tasks:
    - name: Turn off apt's timer-driven unattended upgrades
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/90unattended-upgrades-off
        owner: root
        group: root
        mode: "0644"
        content: |
          APT::Periodic::Unattended-Upgrade "0";

    # An apt run outside the roll lists stale daemons instead of restarting kubelet,
    # cri-o and the network under live pods.
    - name: Keep needrestart to listing
      ansible.builtin.copy:
        dest: /etc/needrestart/conf.d/list-only.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          $nrconf{restart} = 'l';

- name: Converge cri-o on workers
  hosts: k8s_worker
  serial: 1
  become: true
  tasks:
    - ansible.builtin.import_tasks: tasks/crio-converge.yml

# The proton-fsync seccomp profile is CRI-O's default plus one syscall, so it
# is re-rendered from the runtime just converged.
- ansible.builtin.import_playbook: tuning/seccomp-proton-fsync.yaml

# The buildkitd seccomp profile is CRI-O's default with namespace creation
# allowed, re-rendered the same way.
- ansible.builtin.import_playbook: tuning/seccomp-buildkitd.yaml

- name: Converge cri-o on control-plane
  hosts: k8s_master
  serial: 1
  become: true
  tasks:
    - ansible.builtin.import_tasks: tasks/crio-converge.yml

- name: Install the pinned kernel flavour
  hosts: "{{ kernel_converge_group | default('k8s_worker:k8s_master') }}"
  serial: 1
  become: true
  tasks:
    - ansible.builtin.import_tasks: tasks/kernel-converge.yml
