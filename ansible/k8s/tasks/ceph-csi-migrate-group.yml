---
# Migrate ONE quiesce group (grp_vols: the ceph-csi-discover.py records sharing a `group`) onto the
# new drivers. Every workload in the group stops together (scaled to 0; a CronJob suspended), every
# volume is swapped, every workload starts again: one outage per group.
#
# Flux is suspended from the group's start to the end of the run (ceph-csi-migrate.yml resumes it
# once, after the last group), on every Kustomization/HelmRelease that manages one of the group's
# workloads, PVs or PVCs, and on everything above those up to flux-system (groupManagers, root
# first). Otherwise a reconcile mid-swap would scale a workload back up, and a StatefulSet whose PVC
# is momentarily gone would provision a new, empty one. The chain matters: flux-system re-applies
# every Kustomization and strips a kubectl-set suspend on its next reconcile, and a Kustomization
# does the same to its HelmReleases. So the chain is suspended top-down and resumed bottom-up,
# flux-system last. Suspending doesn't stop a reconcile already running, which would still re-apply
# the replica counts, so each suspend waits for that reconcile to finish before anything is scaled.
# Resuming per group would start a fresh reconcile under the next group's feet; that's why it waits
# for the end of the run. Managers are marked with the suspended_by annotation, so only what this run
# suspended is ever resumed. A manager that declares a migrated static PV, and the chain above it,
# stays suspended (held) until git carries that PV's new driver: see ceph-csi-migrate.yml.
#
# rescue: puts every volume of the group back on its old driver from escrow (the data never moved),
# restores the reclaim policies, starts the workloads (only once every volume is restored), records
# the failure and moves on.

- name: "[{{ g_key }}] facts"
  ansible.builtin.set_fact:
    g_ns: "{{ grp_vols[0].namespace }}"
    g_workloads: "{{ grp_vols[0].workloadInfo }}"
    g_managers: "{{ grp_vols[0].groupManagers }}"
    g_esc: "{{ grp_vols | map(attribute='key') | map('regex_replace', '[^A-Za-z0-9_.-]', '_') | list }}"

- name: "[{{ g_key }}] suspend its Flux managers, top-down"
  ansible.builtin.shell: |
    set -e
    IFS=/ read -r kind ns name <<< "{{ item }}"
    res=$([ "$kind" = Kustomization ] && echo kustomizations.kustomize.toolkit.fluxcd.io || echo helmreleases.helm.toolkit.fluxcd.io)
    cur=$(kubectl get $res $name -n $ns -o jsonpath='{.spec.suspend}/{.metadata.annotations.{{ suspended_by_jsonpath }}}')
    case "$cur" in
      true/{{ run_marker }}) echo "already suspended by this migration" ;;
      true/*) echo "suspended by someone else: left as it is, never resumed by this run" ;;
      *) kubectl annotate $res $name -n $ns {{ suspended_by }}={{ run_marker }} --overwrite >/dev/null
         kubectl patch $res $name -n $ns --type=merge -p '{"spec":{"suspend":true}}' >/dev/null
         echo suspended ;;
    esac
    for i in $(seq 1 120); do
      [ "$(kubectl get $res $name -n $ns -o jsonpath='{.status.conditions[?(@.type=="Reconciling")].status}')" = True ] || exit 0
      sleep 5
    done
    echo "$kind $ns/$name still reconciling after 10m"; exit 1
  args:
    executable: /bin/bash
  loop: "{{ g_managers }}"
  changed_when: true

- name: "[{{ g_key }}] force Retain on every PV (no step can delete data)"
  ansible.builtin.command: >-
    kubectl patch pv {{ item.pv }} --type=merge -p '{"spec":{"persistentVolumeReclaimPolicy":"Retain"}}'
  loop: "{{ grp_vols }}"
  loop_control:
    label: "{{ item.pv }}"

- name: "[{{ g_key }}] escrow every PV, PVC and discovery record"
  ansible.builtin.shell: >-
    set -o pipefail;
    kubectl get pv {{ item.0.pv }} -o json | python3 {{ playbook_dir }}/files/k8s-strip.py > {{ escrow_dir }}/{{ item.1 }}.pv.json &&
    kubectl get pvc {{ item.0.pvc }} -n {{ g_ns }} -o json | python3 {{ playbook_dir }}/files/k8s-strip.py > {{ escrow_dir }}/{{ item.1 }}.pvc.json &&
    printf '%s' {{ item.0 | to_json | quote }} > {{ escrow_dir }}/{{ item.1 }}.record.json
  args:
    executable: /bin/bash
  loop: "{{ grp_vols | zip(g_esc) | list }}"
  loop_control:
    label: "{{ item.0.key }}"

- name: "[{{ g_key }}] migrate {{ grp_vols | length }} volume(s), {{ g_workloads | length }} workload(s)"
  block:
    - name: "[{{ g_key }}] stop every workload"
      ansible.builtin.shell: |
        if [ "{{ item.ref.split('/')[0] }}" = CronJob ]; then
          kubectl patch -n {{ g_ns }} {{ item.ref | lower }} --type=merge -p '{"spec":{"suspend":true}}'
        else
          kubectl scale -n {{ g_ns }} {{ item.ref | lower }} --replicas=0
        fi
      args:
        executable: /bin/bash
      loop: "{{ g_workloads }}"
      loop_control:
        label: "{{ item.ref }}"

    # A finished pod holds no mount, but PVC protection won't let a PVC go while any pod object
    # names it. These are completed Job runs (a CronJob's history); the CronJob itself is suspended.
    - name: "[{{ g_key }}] delete finished pods that still reference the group's volumes"
      ansible.builtin.shell: >-
        set -o pipefail;
        kubectl get pods -n {{ g_ns }} -o json |
        python3 {{ playbook_dir }}/files/count-pvc-consumers.py --finished {{ grp_vols | map(attribute='pvc') | map('quote') | join(' ') }} |
        xargs -r kubectl delete pod -n {{ g_ns }} --ignore-not-found --wait=true --timeout=120s
      args:
        executable: /bin/bash
      register: finished_pods
      changed_when: finished_pods.stdout | length > 0

    - name: "[{{ g_key }}] wait until no pod references any of the group's volumes"
      ansible.builtin.shell: >-
        set -o pipefail;
        kubectl get pods -n {{ g_ns }} -o json |
        python3 {{ playbook_dir }}/files/count-pvc-consumers.py {{ grp_vols | map(attribute='pvc') | map('quote') | join(' ') }}
      args:
        executable: /bin/bash
      register: consumers
      changed_when: false
      until: consumers.stdout | trim == "0"
      retries: 120
      delay: 5

    - name: "[{{ g_key }}] swap each volume"
      ansible.builtin.include_tasks: ceph-csi-swap.yml
      loop: "{{ grp_vols | zip(g_esc) | list }}"
      loop_control:
        loop_var: pair
        label: "{{ pair.0.key }}"
      vars:
        vol: "{{ pair.0 }}"
        esc: "{{ pair.1 }}"

    - name: "[{{ g_key }}] start every workload again"
      ansible.builtin.shell: |
        if [ "{{ item.ref.split('/')[0] }}" = CronJob ]; then
          kubectl patch -n {{ g_ns }} {{ item.ref | lower }} --type=merge -p '{"spec":{"suspend":{{ item.replicas | string | lower }}}}'
        else
          kubectl scale -n {{ g_ns }} {{ item.ref | lower }} --replicas={{ item.replicas }}
        fi
      args:
        executable: /bin/bash
      loop: "{{ g_workloads }}"
      loop_control:
        label: "{{ item.ref }} → {{ item.replicas }}"

    # Not fatal: the swap is already verified (bound, on the new driver). A slow or unrelated failure
    # to start must not roll a good migration back; it is reported instead.
    - name: "[{{ g_key }}] wait for the workloads to be Ready (best-effort)"
      ansible.builtin.command: kubectl rollout status -n {{ g_ns }} {{ item.ref | lower }} --timeout=300s
      loop: "{{ g_workloads | rejectattr('ref', 'match', '^CronJob/') | list }}"
      loop_control:
        label: "{{ item.ref }}"
      register: rollout
      changed_when: false
      failed_when: false

    - name: "[{{ g_key }}] record"
      ansible.builtin.set_fact:
        migrated_ok: "{{ migrated_ok + grp_vols }}"
        not_ready: "{{ not_ready + (rollout.results | rejectattr('rc', 'equalto', 0) | map(attribute='item.ref') | map('regex_replace', '^', g_ns ~ '/') | list) }}"
        held: "{{ (held + (grp_vols | selectattr('static') | map(attribute='pvManagers') | flatten)) | unique }}"

  rescue:
    - name: "[{{ g_key }}] ROLLBACK"
      ansible.builtin.debug:
        msg: "✗ {{ g_key }}: {{ ansible_failed_result.msg | default('see above') }}. Putting every volume back on its old driver from escrow."

    - name: "[{{ g_key }}] restore each volume from escrow"
      ansible.builtin.shell: |
        set -e
        e={{ escrow_dir }}/{{ item.1 }}
        pv={{ item.0.pv }}; pvc={{ item.0.pvc }}; ns={{ g_ns }}
        drv=$(kubectl get pv $pv -o jsonpath='{.spec.csi.driver}' 2>/dev/null || true)
        state=$(kubectl get pvc $pvc -n $ns -o jsonpath='{.spec.volumeName}/{.status.phase}/{.metadata.deletionTimestamp}' 2>/dev/null || true)
        if [ "$drv" = "{{ item.0.oldDriver }}" ] && [ "$state" = "$pv/Bound/" ]; then
          echo untouched
        else
          case "$state" in */*/?*) echo "PVC $ns/$pvc is terminating: still mounted, restore it by hand from $e.*.json"; exit 1 ;; esac
          kubectl delete pvc $pvc -n $ns --ignore-not-found --wait=true --timeout=120s
          kubectl delete pv $pv --ignore-not-found --wait=true --timeout=120s
          # As on the way in: the PV comes back pre-bound to the claim, and the claim is built from
          # the record exactly as the swap builds it (files/ceph-csi-manifests.py), not from the
          # escrowed PVC, whose binder annotations would leave the new claim Lost.
          kubectl create -f $e.pv.json
          kubectl patch pv $pv --type=merge -p '{"spec":{"claimRef":{"apiVersion":"v1","kind":"PersistentVolumeClaim","namespace":"'$ns'","name":"'$pvc'"}}}'
          # The binder sets Available once it has seen the PV; a claim created before then may be
          # provisioned a new volume instead.
          kubectl wait pv/$pv --for=jsonpath='{.status.phase}'=Available --timeout=120s
          python3 {{ playbook_dir }}/files/ceph-csi-manifests.py $e.record.json {{ new_secret_ns }} pvc | kubectl create -f -
          kubectl wait pvc/$pvc -n $ns --for=jsonpath='{.status.phase}'=Bound --timeout=300s
          [ "$(kubectl get pvc $pvc -n $ns -o jsonpath='{.spec.volumeName}')" = "$pv" ] || { echo "PVC $ns/$pvc bound to the wrong PV"; exit 1; }
          echo restored
        fi
        kubectl patch pv $pv --type=merge -p '{"spec":{"persistentVolumeReclaimPolicy":"{{ item.0.reclaimPolicy }}"}}' >/dev/null
      args:
        executable: /bin/bash
      loop: "{{ grp_vols | zip(g_esc) | list }}"
      loop_control:
        label: "{{ item.0.key }}"
      register: restored
      ignore_errors: true

    # Only after a complete restore: a StatefulSet started while one of its PVCs is missing would
    # provision a new, empty volume in its place. An incomplete restore leaves the workloads at 0.
    - name: "[{{ g_key }}] start the workloads again on the old drivers"
      ansible.builtin.shell: |
        if [ "{{ item.ref.split('/')[0] }}" = CronJob ]; then
          kubectl patch -n {{ g_ns }} {{ item.ref | lower }} --type=merge -p '{"spec":{"suspend":{{ item.replicas | string | lower }}}}'
        else
          kubectl scale -n {{ g_ns }} {{ item.ref | lower }} --replicas={{ item.replicas }}
        fi
      args:
        executable: /bin/bash
      loop: "{{ g_workloads }}"
      loop_control:
        label: "{{ item.ref }}"
      when: not (restored.failed | default(false))
      ignore_errors: true

    - name: "[{{ g_key }}] record the rollback"
      ansible.builtin.set_fact:
        failed_groups: >-
          {{ failed_groups + [g_key ~ (' (rolled back)' if not (restored.failed | default(false))
             else ' (ROLLBACK INCOMPLETE: see the restore task above; workloads left at 0, managers suspended)')] }}
        held: "{{ (held + (g_managers if (restored.failed | default(false)) else [])) | unique }}"
