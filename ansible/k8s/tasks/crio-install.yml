---
# Moves cri-o to the pinned crio_version on a node that is ALREADY drained: apt
# repo for the pinned line → stop kubelet → install → hold → restart → verify →
# start kubelet. No drain of its own: crio-converge.yml wraps it in one, and
# kubelet-converge.yml runs it inside the kubelet drain, so a coupled kubernetes and
# cri-o bump empties each node once.
#
# kubelet is stopped across the runtime swap. A drain leaves DaemonSet pods on the
# node; with kubelet running, it re-creates their sandboxes while cri-o is shutting
# down, and the half-made sandboxes hold the pod names ("name is reserved") until
# kubelet's cleanup clears them minutes later. dungeon-map-001's istio-cni, ztunnel
# and meshmedic sat that way for 4.5 minutes on the 1.36 roll (2026-11-22), past the
# mesh restart's wait.

- name: Install cri-o {{ crio_version }}
  vars:
    crio_minor: "{{ crio_version.split('.')[0] }}.{{ crio_version.split('.')[1] }}"
  block:
    - name: Install the cri-o {{ crio_minor }} apt keyring
      ansible.builtin.shell: >-
        curl -fsSL https://download.opensuse.org/repositories/isv:/cri-o:/stable:/v{{ crio_minor }}/deb/Release.key
        | gpg --dearmor --yes -o /etc/apt/keyrings/cri-o-apt-keyring.gpg

    - name: Point the cri-o apt repo at the {{ crio_minor }} line
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/cri-o.list
        content: >
          deb [signed-by=/etc/apt/keyrings/cri-o-apt-keyring.gpg]
          https://download.opensuse.org/repositories/isv:/cri-o:/stable:/v{{ crio_minor }}/deb/ /
        mode: "0644"

    - name: Stop kubelet across the runtime swap
      ansible.builtin.systemd_service:
        name: kubelet
        state: stopped

    - name: Install cri-o {{ crio_version }}
      ansible.builtin.apt:
        name: "cri-o={{ crio_version }}*"
        update_cache: true
        allow_change_held_packages: true

    - name: Hold cri-o
      ansible.builtin.dpkg_selections:
        name: cri-o
        selection: hold

    - name: Restart cri-o
      ansible.builtin.systemd_service:
        name: crio
        state: restarted

    - name: Verify the live cri-o version converged
      ansible.builtin.command: crio --version
      register: crio_after
      changed_when: false
      failed_when: crio_version not in crio_after.stdout
      when: not ansible_check_mode

  # kubelet comes back on the new runtime whether or not the swap succeeded, so a
  # failure here still leaves a running node for the caller's fail-open rescue.
  always:
    - name: Start kubelet on the new runtime
      ansible.builtin.systemd_service:
        name: kubelet
        state: started

# A cri-o minor swap does not keep the node's sandboxes: every pod the drain left
# (the DaemonSets) gets a new one, and on a busy worker cri-o takes minutes to catch
# up (RunPodSandbox: DeadlineExceeded) — dungeon-chest-001 took 8 minutes on the 1.36
# roll, past the mesh restart's 180s wait in node-undrain. Wait for no pod on the node
# to be Pending before the caller carries on; a pod still Pending after 15 minutes is
# named and the roll continues, so a pod stuck for its own reasons can't wedge it.
- name: Wait for the node's pods to come back on the new runtime
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf get pods -A
    --field-selector spec.nodeName={{ ansible_facts['hostname'] }},status.phase=Pending
    -o name
  register: crio_pending_pods
  until: crio_pending_pods.stdout | length == 0
  retries: 90
  delay: 10
  changed_when: false
  failed_when: false
  delegate_to: "{{ groups['k8s_master'][0] }}"
  when: not ansible_check_mode

- name: Name the pods still Pending after the runtime swap
  ansible.builtin.debug:
    msg: "still Pending on {{ ansible_facts['hostname'] }}: {{ crio_pending_pods.stdout_lines | join(', ') }}"
  when: not ansible_check_mode and crio_pending_pods.stdout | length > 0
