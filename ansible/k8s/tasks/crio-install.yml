---
# Moves cri-o to the pinned crio_version on a node that is ALREADY drained: apt
# repo for the pinned line → install → hold → restart → verify. No drain of its
# own: crio-converge.yml wraps it in one, and kubelet-converge.yml runs it inside
# the kubelet drain, so a coupled kubernetes and cri-o bump empties each node once.

- name: Install cri-o {{ crio_version }}
  vars:
    crio_minor: "{{ crio_version.split('.')[0] }}.{{ crio_version.split('.')[1] }}"
  block:
    - name: Install the cri-o {{ crio_minor }} apt keyring
      ansible.builtin.shell: >-
        curl -fsSL https://download.opensuse.org/repositories/isv:/cri-o:/stable:/v{{ crio_minor }}/deb/Release.key
        | gpg --dearmor --yes -o /etc/apt/keyrings/cri-o-apt-keyring.gpg

    - name: Point the cri-o apt repo at the {{ crio_minor }} line
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/cri-o.list
        content: >
          deb [signed-by=/etc/apt/keyrings/cri-o-apt-keyring.gpg]
          https://download.opensuse.org/repositories/isv:/cri-o:/stable:/v{{ crio_minor }}/deb/ /
        mode: "0644"

    - name: Install cri-o {{ crio_version }}
      ansible.builtin.apt:
        name: "cri-o={{ crio_version }}*"
        update_cache: true
        allow_change_held_packages: true

    - name: Hold cri-o
      ansible.builtin.dpkg_selections:
        name: cri-o
        selection: hold

    - name: Restart cri-o
      ansible.builtin.systemd_service:
        name: crio
        state: restarted

    - name: Verify the live cri-o version converged
      ansible.builtin.command: crio --version
      register: crio_after
      changed_when: false
      failed_when: crio_version not in crio_after.stdout
      when: not ansible_check_mode
