---
# Per-host kubelet/kubeadm/kubectl convergence to the pinned kubernetes_version
# from group_vars/all.yml: a patch within the live minor (1.35.6 → 1.35.7), or
# exactly one minor up (1.35 → 1.36). The version gate below refuses a downgrade
# or a skipped minor. Before the first apply of a new minor, the applying node
# snapshots etcd and runs kubeadm's preflight (`kubeadm upgrade plan`).
#
# A converge task, gated the same way crio-converge is: read the live version,
# skip a matched node with no drain. A converged fleet is a full no-op.
#
# kubeadm ordering constraint (why this is NOT a clone of crio-converge):
#   One control-plane node runs `kubeadm upgrade apply <ver>`, which writes the
#   target version into the cluster's kubeadm-config. EVERY other node
#   (remaining masters AND workers) then runs `kubeadm upgrade node`, which
#   reads that config. Each node decides from the live control plane, not from
#   a fixed host or the kubeadm-config version: Flux owns that ConfigMap and the
#   same change bumps its kubernetesVersion, so it names the target before any
#   node has applied. A control-plane node applies while no kube-apiserver runs
#   the target yet, every later node runs upgrade node, and a worker refuses
#   until every kube-apiserver does (a kubelet must never be newer than the
#   apiserver). So the order holds however a run is limited (CI, node-converge
#   excluding its own host, or a single-node hand-off).
#
# The drain and the return to service are tasks/node-drain.yml and
# tasks/node-undrain.yml, shared with crio-converge.yml and update-hosts.yml.
#
# cri-o's minor moves with kubernetes' (the k8s-nodes pins), so a node whose
# cri-o is behind its pin moves it here, inside the same drain and ahead of the
# kubelet: one drain per node, and no kubelet on an older runtime minor.

- name: Read live kubelet version
  ansible.builtin.command: kubelet --version
  register: kubelet_live
  changed_when: false
  check_mode: false

- name: Read live cri-o version for the kubelet converge
  ansible.builtin.command: crio --version
  register: crio_live_kubelet
  changed_when: false
  check_mode: false

- name: Converge kubernetes node components to {{ kubernetes_version }}
  when: kubernetes_version not in kubelet_live.stdout
  vars:
    k8s_minor: "{{ kubernetes_version.split('.')[0] }}.{{ kubernetes_version.split('.')[1] }}"
    kubectl_admin: kubectl --kubeconfig /etc/kubernetes/admin.conf
    is_control_plane: "{{ 'k8s_master' in group_names }}"
    apiserver_tags: "{{ apiserver_images.stdout.split() | map('regex_replace', '^.*:', '') | list }}"
    control_plane_applied: "{{ ('v' ~ kubernetes_version) in apiserver_tags }}"
    control_plane_at_target: "{{ apiserver_tags | length > 0 and apiserver_tags | reject('equalto', 'v' ~ kubernetes_version) | list | length == 0 }}"
    live_minor: "{{ kubelet_live.stdout | regex_search('v(\\d+\\.\\d+)', '\\1') | first }}"
    minor_upgrade: "{{ live_minor != k8s_minor }}"
    next_minor: "{{ live_minor.split('.')[0] }}.{{ (live_minor.split('.')[1] | int) + 1 }}"
    # Flux owns the CoreDNS Corefile (fluxcd/infrastructure/configs/base/coredns) and
    # reverts any rewrite, so kubeadm must not migrate it: its migration tool fails
    # preflight on the template plugin the Corefile uses. kubeadm still moves the
    # CoreDNS image, so the Corefile must parse on the CoreDNS the target ships.
    kubeadm_coredns_owned_by_flux: CoreDNSUnsupportedPlugins,CoreDNSMigration
  block:
    # kubeadm supports one minor per upgrade, and never a downgrade. A minor
    # upgrade is declared like a patch (header); a skip or a downgrade is refused.
    - name: Refuse a downgrade or a skipped minor
      ansible.builtin.fail:
        msg: >-
          live kubelet {{ live_minor }} -> target {{ kubernetes_version }}: only a patch
          within {{ live_minor }} or a move to {{ next_minor }} is supported.
      when: minor_upgrade | bool and k8s_minor != next_minor

    # The live kube-apiservers decide apply vs upgrade node (header). Read
    # through the delegate's admin.conf, so a worker can see them too.
    - name: Read the control plane's kube-apiserver versions
      ansible.builtin.command: >-
        {{ kubectl_admin }} -n kube-system get pods -l component=kube-apiserver
        -o jsonpath={.items[*].spec.containers[0].image}
      register: apiserver_images
      changed_when: false
      check_mode: false
      delegate_to: "{{ groups['k8s_master'][0] }}"

    - name: Refuse a worker ahead of the control plane
      ansible.builtin.fail:
        msg: >-
          the control plane's kube-apiservers run {{ apiserver_tags | unique | join(', ') }},
          not only v{{ kubernetes_version }}: the control plane converges first, so this
          worker waits for the next run.
      when: not (is_control_plane | bool) and not (control_plane_at_target | bool)

    # kubeadm binary FIRST (before the upgrade command that uses it), pinned to
    # the target patch. kubelet/kubectl come AFTER the drain so the node keeps
    # serving until it is emptied.
    - name: Install the kubernetes {{ k8s_minor }} apt keyring
      ansible.builtin.shell: >-
        curl -fsSL https://pkgs.k8s.io/core:/stable:/v{{ k8s_minor }}/deb/Release.key
        | gpg --dearmor --yes -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg

    - name: Point the kubernetes apt repo at the {{ k8s_minor }} line
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/kubernetes.list
        content: >
          deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg]
          https://pkgs.k8s.io/core:/stable:/v{{ k8s_minor }}/deb/ /
        mode: "0644"

    - name: Install kubeadm {{ kubernetes_version }}
      ansible.builtin.apt:
        name: "kubeadm={{ kubernetes_version }}*"
        update_cache: true
        allow_change_held_packages: true

    # A new minor's first apply is the one step that changes the whole cluster at
    # once: a restore point first, then kubeadm's preflight. Both fail closed, and
    # the rescue below leaves the node schedulable. The snapshot is kept beside
    # kubeadm's own upgrade backups. `kubeadm upgrade plan` exits non-zero only on
    # a preflight failure (it accepts a skipped minor), so the gate above stays.
    - name: Snapshot etcd before the first {{ k8s_minor }} apply
      ansible.builtin.shell: |
        set -euo pipefail
        snap=etcd-pre-v{{ kubernetes_version }}-$(date -u +%Y%m%dT%H%M%SZ).db
        {{ kubectl_admin }} -n kube-system exec etcd-{{ ansible_facts['hostname'] }} -- etcdctl \
          --endpoints=https://127.0.0.1:2379 --cacert=/etc/kubernetes/pki/etcd/ca.crt \
          --cert=/etc/kubernetes/pki/etcd/healthcheck-client.crt \
          --key=/etc/kubernetes/pki/etcd/healthcheck-client.key \
          snapshot save /var/lib/etcd/$snap
        install -d -m 0700 /etc/kubernetes/tmp
        mv /var/lib/etcd/$snap /etc/kubernetes/tmp/$snap
        test -s /etc/kubernetes/tmp/$snap
        echo /etc/kubernetes/tmp/$snap
      args:
        executable: /bin/bash
      when: is_control_plane | bool and not (control_plane_applied | bool) and minor_upgrade | bool

    - name: Run kubeadm's preflight for v{{ kubernetes_version }}
      ansible.builtin.command: >-
        kubeadm upgrade plan v{{ kubernetes_version }}
        --ignore-preflight-errors={{ kubeadm_coredns_owned_by_flux }}
      changed_when: false
      when: is_control_plane | bool and not (control_plane_applied | bool) and minor_upgrade | bool

    # The cluster-state write. The first control-plane node of the roll sets the
    # target version for the whole cluster; every other node adopts it.
    # --certificate-renewal=false keeps a patch roll from rotating certs as a side effect.
    - name: Upgrade cluster config (first control-plane of the roll — kubeadm upgrade apply)
      ansible.builtin.command: >-
        kubeadm upgrade apply v{{ kubernetes_version }} --yes --certificate-renewal=false
        --ignore-preflight-errors={{ kubeadm_coredns_owned_by_flux }}
      when: is_control_plane | bool and not (control_plane_applied | bool)

    - name: Upgrade node config (every other node — kubeadm upgrade node)
      ansible.builtin.command: kubeadm upgrade node
      when: not (is_control_plane | bool and not (control_plane_applied | bool))

    - name: Empty {{ ansible_facts['hostname'] }}
      ansible.builtin.include_tasks: node-drain.yml
      vars:
        drain_grace_period: 90

    - name: Move cri-o to {{ crio_version }} in the same drain
      ansible.builtin.include_tasks: crio-install.yml
      when: crio_version not in crio_live_kubelet.stdout

    - name: Install kubelet + kubectl {{ kubernetes_version }}
      ansible.builtin.apt:
        name:
          - "kubelet={{ kubernetes_version }}*"
          - "kubectl={{ kubernetes_version }}*"
        update_cache: true
        allow_change_held_packages: true

    - name: Hold kubeadm, kubelet, kubectl
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubeadm
        - kubelet
        - kubectl

    - name: Reload systemd and restart kubelet
      ansible.builtin.systemd_service:
        name: kubelet
        state: restarted
        daemon_reload: true

    - name: Verify the live version converged
      ansible.builtin.command: kubelet --version
      register: kubelet_after
      changed_when: false
      failed_when: kubernetes_version not in kubelet_after.stdout
      when: not ansible_check_mode

    # kubeadm writes a dated etcd data copy, manifests and kubelet config backup to
    # /etc/kubernetes/tmp on every upgrade and never prunes them, and the snapshot
    # above lands there too: 7-13 GB per control-plane node after the 1.36 roll, on
    # 45 GB roots. Once this node's upgrade has verified, keep only the newest of each
    # kind (the restore point for the upgrade just made) and drop the temp dirs
    # kubeadm leaves behind (kubeadm-kubelet-env*, kubeadm-upgraded-manifests*).
    - name: Prune kubeadm's upgrade backups to the newest of each kind
      ansible.builtin.shell: |
        set -euo pipefail
        cd /etc/kubernetes/tmp 2>/dev/null || exit 0
        shopt -s nullglob
        for kind in kubeadm-backup-etcd- kubeadm-backup-manifests- kubeadm-kubelet-config-20 etcd-pre-; do
          set -- "$kind"*
          [ $# -gt 1 ] || continue
          ls -1dt -- "$@" | tail -n +2 | while IFS= read -r old; do rm -rf -- "$old"; echo "$old"; done
        done
        for stray in kubeadm-kubelet-env[0-9]* kubeadm-kubelet-config[0-9]* kubeadm-upgraded-manifests[0-9]*; do
          rm -rf -- "$stray"; echo "$stray"
        done
      args:
        executable: /bin/bash
      register: kubeadm_tmp_pruned
      changed_when: kubeadm_tmp_pruned.stdout | length > 0
      when: not ansible_check_mode

    - name: Return {{ ansible_facts['hostname'] }} to service
      ansible.builtin.include_tasks: node-undrain.yml

  # Fail OPEN, exactly as crio-converge: a failed roll must never freeze the
  # node's capacity behind a cordon and cascade into the rest of the fleet.
  rescue:
    - name: Fail open — uncordon {{ ansible_facts['hostname'] }}
      ansible.builtin.command: "{{ kubectl_admin }} uncordon {{ ansible_facts['hostname'] }}"
      delegate_to: "{{ groups['k8s_master'][0] }}"
      changed_when: false

    - name: Surface the converge failure
      ansible.builtin.fail:
        msg: >-
          kubelet converge failed on {{ ansible_facts['hostname'] }} — node left
          schedulable (fail-open); see the failed task above for the cause
