---
# Per-host kubelet/kubeadm/kubectl convergence to the pinned kubernetes_version
# from group_vars/all.yml. PATCH upgrades within one minor only (1.35.6 →
# 1.35.7); a minor bump (1.35 → 1.36) is a deliberate, staged operation and is
# NOT this task's job — the version gate below refuses a minor mismatch.
#
# A converge task, gated the same way crio-converge is: read the live version,
# skip a matched node with no drain. A converged fleet is a full no-op.
#
# kubeadm ordering constraint (why this is NOT a clone of crio-converge):
#   The FIRST control-plane node runs `kubeadm upgrade apply <ver>`, which
#   writes the target version into the cluster's kubeadm-config. EVERY other
#   node (remaining masters AND workers) then runs `kubeadm upgrade node`,
#   which reads that config. So the first control-plane MUST converge before
#   any other node — the inverse of crio-converge's workers-first ordering.
#   The calling play (kubelet-provision.yml) enforces this with three phases.
#
# The drain and the return to service are tasks/node-drain.yml and
# tasks/node-undrain.yml, shared with crio-converge.yml and update-hosts.yml.

- name: Read live kubelet version
  ansible.builtin.command: kubelet --version
  register: kubelet_live
  changed_when: false
  check_mode: false

- name: Converge kubernetes node components to {{ kubernetes_version }}
  when: kubernetes_version not in kubelet_live.stdout
  vars:
    k8s_minor: "{{ kubernetes_version.split('.')[0] }}.{{ kubernetes_version.split('.')[1] }}"
    kubectl_admin: kubectl --kubeconfig /etc/kubernetes/admin.conf
    is_first_control_plane: "{{ inventory_hostname == groups['k8s_master'][0] }}"
    live_minor: "{{ kubelet_live.stdout | regex_search('v(\\d+\\.\\d+)', '\\1') | first }}"
  block:
    # A patch task must never straddle a minor. kubeadm upgrade across minors
    # has extra steps (component config migration, staged skew) this task does
    # not perform — refuse rather than half-upgrade.
    - name: Refuse a minor-version straddle
      ansible.builtin.fail:
        msg: >-
          live kubelet {{ live_minor }} != target minor {{ k8s_minor }} — a minor
          upgrade is a staged operation, not a patch converge; do it deliberately.
      when: live_minor != k8s_minor

    # kubeadm binary FIRST (before the upgrade command that uses it), pinned to
    # the target patch. kubelet/kubectl come AFTER the drain so the node keeps
    # serving until it is emptied.
    - name: Install the kubernetes {{ k8s_minor }} apt keyring
      ansible.builtin.shell: >-
        curl -fsSL https://pkgs.k8s.io/core:/stable:/v{{ k8s_minor }}/deb/Release.key
        | gpg --dearmor --yes -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg

    - name: Point the kubernetes apt repo at the {{ k8s_minor }} line
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/kubernetes.list
        content: >
          deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg]
          https://pkgs.k8s.io/core:/stable:/v{{ k8s_minor }}/deb/ /
        mode: "0644"

    - name: Install kubeadm {{ kubernetes_version }}
      ansible.builtin.apt:
        name: "kubeadm={{ kubernetes_version }}*"
        update_cache: true
        allow_change_held_packages: true

    # The cluster-state write. First control-plane sets the target version for
    # the whole cluster; every other node adopts it. --certificate-renewal=false
    # keeps a patch roll from rotating certs as a side effect.
    - name: Upgrade cluster config (first control-plane — kubeadm upgrade apply)
      ansible.builtin.command: >-
        kubeadm upgrade apply v{{ kubernetes_version }} --yes --certificate-renewal=false
      when: is_first_control_plane | bool

    - name: Upgrade node config (every other node — kubeadm upgrade node)
      ansible.builtin.command: kubeadm upgrade node
      when: not (is_first_control_plane | bool)

    - name: Empty {{ ansible_facts['hostname'] }}
      ansible.builtin.include_tasks: node-drain.yml
      vars:
        drain_grace_period: 90

    - name: Install kubelet + kubectl {{ kubernetes_version }}
      ansible.builtin.apt:
        name:
          - "kubelet={{ kubernetes_version }}*"
          - "kubectl={{ kubernetes_version }}*"
        update_cache: true
        allow_change_held_packages: true

    - name: Hold kubeadm, kubelet, kubectl
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubeadm
        - kubelet
        - kubectl

    - name: Reload systemd and restart kubelet
      ansible.builtin.systemd_service:
        name: kubelet
        state: restarted
        daemon_reload: true

    - name: Verify the live version converged
      ansible.builtin.command: kubelet --version
      register: kubelet_after
      changed_when: false
      failed_when: kubernetes_version not in kubelet_after.stdout
      when: not ansible_check_mode

    - name: Return {{ ansible_facts['hostname'] }} to service
      ansible.builtin.include_tasks: node-undrain.yml

  # Fail OPEN, exactly as crio-converge: a failed roll must never freeze the
  # node's capacity behind a cordon and cascade into the rest of the fleet.
  rescue:
    - name: Fail open — uncordon {{ ansible_facts['hostname'] }}
      ansible.builtin.command: "{{ kubectl_admin }} uncordon {{ ansible_facts['hostname'] }}"
      delegate_to: "{{ groups['k8s_master'][0] }}"
      changed_when: false

    - name: Surface the converge failure
      ansible.builtin.fail:
        msg: >-
          kubelet converge failed on {{ ansible_facts['hostname'] }} — node left
          schedulable (fail-open); see the failed task above for the cause
