---
# Return a drained node to service: Ready → mesh dataplane restart → uncordon →
# CNPG strand check. node-drain.yml is the other half; same variables, plus:
#
#   ready_timeout       seconds to wait for Ready (default: 300)

- name: Return {{ drain_node | default(ansible_facts['hostname']) }} to service
  vars:
    _drain_node: "{{ drain_node | default(ansible_facts['hostname']) }}"
    _k8s_delegate: "{{ k8s_delegate | default(groups['k8s_master'][0]) }}"
  block:
    - name: Wait for {{ _drain_node }} Ready
      ansible.builtin.command: >-
        {{ kubectl_admin }} wait --for=condition=Ready
        node/{{ _drain_node }} --timeout={{ ready_timeout | default(300) }}s
      delegate_to: "{{ _k8s_delegate }}"
      changed_when: false

    # Daemonset pods survive the drain, so the node's mesh dataplane (ztunnel,
    # istio-cni) runs atop a runtime or kubelet it wasn't started under — pods
    # created afterwards get broken enrollment. Restart it BEFORE workloads land,
    # but only when istiod is there to reprogram it: a dataplane restart with no
    # control plane turns a limp into an outage.
    - name: Check the mesh control plane can reprogram a restarted dataplane
      ansible.builtin.command: >-
        {{ kubectl_admin }} -n {{ mesh_namespace }} get deploy istiod
        -o jsonpath={.status.readyReplicas}
      register: istiod_ready
      delegate_to: "{{ _k8s_delegate }}"
      changed_when: false
      failed_when: false

    - name: Restart the mesh dataplane on {{ _drain_node }}
      ansible.builtin.shell: |
        set -o pipefail
        pods=$({{ kubectl_admin }} -n {{ mesh_namespace }} get pods \
          --field-selector spec.nodeName={{ _drain_node }} -o name | grep -E 'ztunnel|istio-cni' || true)
        if [ -n "$pods" ]; then
          echo "$pods" | xargs {{ kubectl_admin }} -n {{ mesh_namespace }} delete --wait=false
        fi
      args:
        executable: /bin/bash
      when: (istiod_ready.stdout | default('0')) | int > 0
      delegate_to: "{{ _k8s_delegate }}"

    # Wait via daemonset rollout, NOT `kubectl wait` on pods by node: right after the
    # bounce the old pods are Terminating but still match a node selector, so a
    # pod-Ready wait latches onto doomed pods and times out (ztunnel/istio-cni linger
    # in Terminating well past 180s on graceful shutdown). rollout status tracks the
    # DS reaching desired/available and ignores the terminating ones.
    - name: Wait for the mesh dataplane to resync
      ansible.builtin.command: >-
        {{ kubectl_admin }} -n {{ mesh_namespace }} rollout status {{ item }} --timeout=180s
      loop:
        - daemonset/ztunnel
        - daemonset/istio-cni-node
      when: (istiod_ready.stdout | default('0')) | int > 0
      delegate_to: "{{ _k8s_delegate }}"
      changed_when: false

    - name: Uncordon {{ _drain_node }}
      ansible.builtin.command: "{{ kubectl_admin }} uncordon {{ _drain_node }}"
      delegate_to: "{{ _k8s_delegate }}"

    # CNPG can't always re-attach an instance the drain evicted; fail loud naming any
    # that stranded so a human repairs it deliberately — never auto-repaired.
    - name: Surface any CNPG instances that stranded after the drain
      ansible.builtin.include_tasks: post-drain-reconcile.yml
