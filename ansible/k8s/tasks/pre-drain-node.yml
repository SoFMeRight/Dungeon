---
# Pre-drain guard, included by node-drain.yml
# AFTER the node is cordoned and BEFORE it is drained. It runs
# files/pre-drain-guard.py on a control-plane host, which:
#   - switches every CNPG primary off this node (status.targetPrimary patch) and waits
#     until the primary role has moved — CNPG will NOT do this for a drain on its own,
#     so a primary would otherwise block the drain on its always-zero -primary PDB; and
#   - classifies every remaining (non-CNPG) zero-disruption PDB covering a pod here:
#     a structurally un-evictable one (desiredHealthy >= expectedPods) fails fast by
#     name, while one merely closed by an unhealthy pod is waited out, then the pods it
#     covers are drained FIRST with the drain's own retrying --timeout. If they can't go
#     the guard fails before anything else on the node was evicted (the caller's rescue
#     fail-opens), so a budget that never opens no longer churns the whole node.
# It does NOT wait for a demoted instance to rejoin — CNPG's rejoin is unreliable here,
# so anything that strands is re-cloned after the drain by post-drain-reconcile.yml.

- name: Switch CNPG primaries off the node + PDB audit before draining
  ansible.builtin.script: "../files/pre-drain-guard.py {{ _drain_node }} {{ drain_grace_period | default(300) }}"
  args:
    executable: python3
  register: pre_drain_guard
  changed_when: "'switching over' in pre_drain_guard.stdout"
  when: not ansible_check_mode
  delegate_to: "{{ _k8s_delegate }}"

# The guard's waits (a switchover CNPG already started, a budget held shut by an
# unhealthy pod) are what makes it slow, and ansible hides a passing task's stdout:
# dungeon-chest-004 sat 9.5 minutes here on the 1.36 roll with no record of why.
- name: Report what the pre-drain guard did on {{ _drain_node }}
  ansible.builtin.debug:
    msg: "{{ pre_drain_guard.stdout_lines }}"
  when: not ansible_check_mode and pre_drain_guard.stdout | default('') | length > 0
