---
# Shared pre-drain guard, included by crio-converge.yml and kubelet-converge.yml
# AFTER the node is cordoned and BEFORE it is drained. It runs
# files/pre-drain-guard.py on a control-plane host, which:
#   - switches every CNPG primary off this node (status.targetPrimary patch) and waits
#     until the primary role has moved — CNPG will NOT do this for a drain on its own,
#     so a primary would otherwise block the drain on its always-zero -primary PDB; and
#   - fails fast by name on any remaining genuine (non-CNPG) zero-disruption PDB.
# It does NOT wait for a demoted instance to rejoin — CNPG's rejoin is unreliable here,
# so anything that strands is re-cloned after the drain by post-drain-reconcile.yml.

- name: Switch CNPG primaries off the node + PDB audit before draining
  ansible.builtin.script: "{{ playbook_dir }}/files/pre-drain-guard.py {{ ansible_facts['hostname'] }}"
  args:
    executable: python3
  register: pre_drain_guard
  changed_when: "'switching over' in pre_drain_guard.stdout"
  when: not ansible_check_mode
  delegate_to: "{{ groups['k8s_master'][0] }}"
