---
# Per-host cri-o convergence: version gate, then the safe roll — cordon → drain
# (grace 300s) → apt upgrade within the pinned line → restart → Ready → uncordon.
# kubectl steps delegate to the first control-plane host, which holds the admin
# kubeconfig; the node's kubernetes name is its hostname.

- name: Read live cri-o version
  ansible.builtin.command: crio --version
  register: crio_live
  changed_when: false
  check_mode: false

- name: Converge cri-o to {{ crio_version }}
  when: crio_version not in crio_live.stdout
  vars:
    crio_minor: "{{ crio_version.split('.')[0] }}.{{ crio_version.split('.')[1] }}"
    kubectl_admin: kubectl --kubeconfig /etc/kubernetes/admin.conf
    mesh_namespace: king-of-red-lions
  block:
    # A drain blocked by an unsatisfiable PDB wedges for the full timeout and
    # fails the roll. Surface those as a NAMED failure before touching the
    # node: every zero-disruption PDB whose pods live here is listed, so the
    # operator fixes the budget (or the degraded workload behind it) instead
    # of diagnosing a stall. matchLabels only — the fleet's PDBs use nothing
    # else.
    - name: Audit PDBs — drain blockers fail fast by name
      ansible.builtin.shell: |
        set -o pipefail
        python3 - <<'PYEOF'
        import json, subprocess, sys
        ka = "{{ kubectl_admin }}".split()
        node = "{{ ansible_facts['hostname'] }}"
        pods = json.loads(subprocess.check_output(ka + ["get", "pods", "-A",
            "--field-selector", f"spec.nodeName={node},status.phase=Running", "-o", "json"]))["items"]
        pdbs = json.loads(subprocess.check_output(ka + ["get", "pdb", "-A", "-o", "json"]))["items"]
        blockers = []
        for pdb in pdbs:
            if pdb.get("status", {}).get("disruptionsAllowed", 1) != 0:
                continue
            ns = pdb["metadata"]["namespace"]
            sel = pdb.get("spec", {}).get("selector", {}).get("matchLabels", {})
            for p in pods:
                if p["metadata"]["namespace"] != ns:
                    continue
                labels = p["metadata"].get("labels", {})
                if sel and all(labels.get(k) == v for k, v in sel.items()):
                    blockers.append(f"{ns}/{p['metadata']['name']} (pdb {pdb['metadata']['name']} allows 0 disruptions)")
        if blockers:
            print("drain would wedge on:", file=sys.stderr)
            for b in blockers:
                print(f"  {b}", file=sys.stderr)
            sys.exit(1)
        PYEOF
      delegate_to: "{{ groups['k8s_master'][0] }}"
      changed_when: false

    - name: Cordon {{ ansible_facts['hostname'] }}
      ansible.builtin.command: "{{ kubectl_admin }} cordon {{ ansible_facts['hostname'] }}"
      delegate_to: "{{ groups['k8s_master'][0] }}"

    - name: Drain {{ ansible_facts['hostname'] }}
      ansible.builtin.command: >-
        {{ kubectl_admin }} drain {{ ansible_facts['hostname'] }}
        --ignore-daemonsets --delete-emptydir-data
        --grace-period=300 --timeout=600s
      delegate_to: "{{ groups['k8s_master'][0] }}"

    - name: Install the cri-o {{ crio_minor }} apt keyring
      ansible.builtin.shell: >-
        curl -fsSL https://download.opensuse.org/repositories/isv:/cri-o:/stable:/v{{ crio_minor }}/deb/Release.key
        | gpg --dearmor --yes -o /etc/apt/keyrings/cri-o-apt-keyring.gpg

    - name: Point the cri-o apt repo at the {{ crio_minor }} line
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/cri-o.list
        content: >
          deb [signed-by=/etc/apt/keyrings/cri-o-apt-keyring.gpg]
          https://download.opensuse.org/repositories/isv:/cri-o:/stable:/v{{ crio_minor }}/deb/ /
        mode: "0644"

    - name: Install cri-o {{ crio_version }}
      ansible.builtin.apt:
        name: "cri-o={{ crio_version }}*"
        update_cache: true
        allow_change_held_packages: true

    - name: Hold cri-o
      ansible.builtin.dpkg_selections:
        name: cri-o
        selection: hold

    - name: Restart cri-o
      ansible.builtin.systemd_service:
        name: crio
        state: restarted

    - name: Verify the live version converged
      ansible.builtin.command: crio --version
      register: crio_after
      changed_when: false
      failed_when: crio_version not in crio_after.stdout
      when: not ansible_check_mode

    - name: Wait for {{ ansible_facts['hostname'] }} Ready
      ansible.builtin.command: >-
        {{ kubectl_admin }} wait --for=condition=Ready
        node/{{ ansible_facts['hostname'] }} --timeout=300s
      delegate_to: "{{ groups['k8s_master'][0] }}"

    # Daemonset pods survive the drain, so the node's mesh dataplane
    # (ztunnel, istio-cni) runs atop a runtime it wasn't started under —
    # pods created after the upgrade get broken enrollment. Restart it under
    # the new runtime BEFORE workloads land, but only when istiod is there
    # to reprogram it: a dataplane restart with no control plane turns a
    # limp into an outage.
    - name: Check the mesh control plane can reprogram a restarted dataplane
      ansible.builtin.command: >-
        {{ kubectl_admin }} -n {{ mesh_namespace }} get deploy istiod
        -o jsonpath={.status.readyReplicas}
      register: istiod_ready
      delegate_to: "{{ groups['k8s_master'][0] }}"
      changed_when: false
      failed_when: false

    - name: Restart the node's mesh dataplane under the new runtime
      ansible.builtin.shell: |
        set -o pipefail
        pods=$({{ kubectl_admin }} -n {{ mesh_namespace }} get pods \
          --field-selector spec.nodeName={{ ansible_facts['hostname'] }} -o name | grep -E 'ztunnel|istio-cni' || true)
        if [ -n "$pods" ]; then
          echo "$pods" | xargs {{ kubectl_admin }} -n {{ mesh_namespace }} delete --wait=false
        fi
      when: (istiod_ready.stdout | default('0')) | int > 0
      delegate_to: "{{ groups['k8s_master'][0] }}"

    - name: Wait for the node's mesh dataplane to resync
      ansible.builtin.command: >-
        {{ kubectl_admin }} -n {{ mesh_namespace }} wait --for=condition=Ready pod
        --field-selector spec.nodeName={{ ansible_facts['hostname'] }} --timeout=180s
      when: (istiod_ready.stdout | default('0')) | int > 0
      delegate_to: "{{ groups['k8s_master'][0] }}"

    - name: Uncordon {{ ansible_facts['hostname'] }}
      ansible.builtin.command: "{{ kubectl_admin }} uncordon {{ ansible_facts['hostname'] }}"
      delegate_to: "{{ groups['k8s_master'][0] }}"

  # Fail OPEN: a failed roll must never freeze the node's capacity behind a
  # cordon — a frozen worker starves the pool and cascades (control-plane
  # singletons go homeless, storage gateways go Pending). The node stays on
  # its current runtime, schedulable, and the failure is surfaced.
  rescue:
    - name: Fail open — uncordon {{ ansible_facts['hostname'] }}
      ansible.builtin.command: "{{ kubectl_admin }} uncordon {{ ansible_facts['hostname'] }}"
      delegate_to: "{{ groups['k8s_master'][0] }}"
      changed_when: false

    - name: Surface the converge failure
      ansible.builtin.fail:
        msg: >-
          cri-o converge failed on {{ ansible_facts['hostname'] }} — node left
          schedulable (fail-open); see the failed task above for the cause

# Desired state includes schedulability: an interrupted earlier roll can leave a
# node converged but cordoned (killed between upgrade and uncordon), which the
# version gate would otherwise skip forever. Uncordon is idempotent.
- name: Ensure {{ ansible_facts['hostname'] }} is schedulable
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf
    uncordon {{ ansible_facts['hostname'] }}
  delegate_to: "{{ groups['k8s_master'][0] }}"
  changed_when: false
  when: not ansible_check_mode
