---
# Migrate ONE RBD volume owned by a single Deployment. Quiesce the Deployment (scale to 0), run the
# shared swap-core, scale back up. block/rescue: on any failure remove the new objects, restore the
# old PVC+PV from escrow (image was Retain-preserved), scale the Deployment back up — lossless.

- name: "[{{ vol.key }}] escrow old PV + PVC (re-appliable) — before any mutation"
  ansible.builtin.shell: >
    set -o pipefail;
    kubectl get pv {{ vol.pv }} -o json | python3 {{ playbook_dir }}/files/k8s-strip.py > {{ escrow_dir }}/{{ esc0 }}.pv.json &&
    kubectl get pvc {{ vol.pvc }} -n {{ vol.namespace }} -o json | python3 {{ playbook_dir }}/files/k8s-strip.py > {{ escrow_dir }}/{{ esc0 }}.pvc.json
  args:
    executable: /bin/bash
  vars:
    esc0: "{{ (vol.namespace ~ '_' ~ vol.pvc) | regex_replace('[^A-Za-z0-9_.-]', '_') }}"
  changed_when: true

- name: "[{{ vol.key }}] migrate (Deployment {{ vol.owner_name }})"
  block:
    - name: "[{{ vol.key }}] scale owning Deployment to 0"
      ansible.builtin.command: kubectl scale -n {{ vol.namespace }} deployment/{{ vol.owner_name }} --replicas=0
      when: vol.owner_kind == 'Deployment'

    - name: "[{{ vol.key }}] wait for consumers to unmount"
      ansible.builtin.shell: >
        set -o pipefail;
        kubectl get pods -n {{ vol.namespace }} -o json |
        python3 {{ playbook_dir }}/files/count-pvc-consumers.py {{ vol.pvc | quote }}
      args:
        executable: /bin/bash
      register: consumers
      changed_when: false
      until: consumers.stdout | trim == "0"
      retries: 90
      delay: 5

    - name: "[{{ vol.key }}] swap the volume onto the operator driver"
      ansible.builtin.include_tasks: rbd-rook-swap-core.yml

    - name: "[{{ vol.key }}] scale owning Deployment back up"
      ansible.builtin.command: kubectl scale -n {{ vol.namespace }} deployment/{{ vol.owner_name }} --replicas={{ vol.replicas }}
      when: vol.owner_kind == 'Deployment'

    # Readiness is BEST-EFFORT and NON-fatal: the swap is already verified (PVC bound + driver
    # check in swap-core), so a slow-starting or independently-broken workload must NOT roll back a
    # good migration. On timeout we LEAVE IT MIGRATED and warn loudly instead of triggering rescue.
    - name: "[{{ vol.key }}] wait for the Deployment to be Ready again (best-effort)"
      ansible.builtin.command: kubectl rollout status -n {{ vol.namespace }} deployment/{{ vol.owner_name }} --timeout=180s
      register: rollout_one
      changed_when: false
      failed_when: false
      when: vol.owner_kind == 'Deployment'

    - name: "[{{ vol.key }}] MIGRATED but NOT Ready in time — LEFT MIGRATED (no rollback)"
      ansible.builtin.debug:
        msg: >-
          ⚠ {{ vol.key }} re-adopted onto {{ new_driver }} (bind+driver verified) but not Ready
          within 180s — LEFT MIGRATED, NOT rolled back. The swap is confirmed good; investigate
          the workload (slow start / unrelated issue).
      when: vol.owner_kind == 'Deployment' and (rollout_one.rc | default(0)) != 0

    - name: "[{{ vol.key }}] MIGRATED"
      ansible.builtin.debug:
        msg: >-
          ✓ {{ vol.key }} re-adopted onto {{ new_driver }} (zero-copy){{
          ' [pod not yet Ready — see warning]' if (rollout_one.rc | default(0)) != 0 else '' }}

  rescue:
    - name: "[{{ vol.key }}] ROLLBACK — restoring the old driver from escrow"
      ansible.builtin.debug:
        msg: "✗ {{ vol.key }} failed ({{ ansible_failed_result.msg | default('see above') }}) — rolling back. Image was Retain-preserved."

    # Deployment is still at 0 here (scaled up only below), so removing the PVC cannot trigger fresh
    # provisioning. Force-clear finalizers so nothing hangs.
    - name: "[{{ vol.key }}] remove any new objects (free the image)"
      ansible.builtin.shell: |
        kubectl delete pvc {{ vol.pvc }} -n {{ vol.namespace }} --ignore-not-found --wait=false
        kubectl patch pvc {{ vol.pvc }} -n {{ vol.namespace }} -p '{"metadata":{"finalizers":null}}' >/dev/null 2>&1 || true
        kubectl delete pv {{ vol.pv }}-rook --ignore-not-found --wait=false
        kubectl patch pv {{ vol.pv }}-rook -p '{"metadata":{"finalizers":null}}' >/dev/null 2>&1 || true
        for i in $(seq 1 30); do kubectl get pvc {{ vol.pvc }} -n {{ vol.namespace }} >/dev/null 2>&1 || break; sleep 2; done
        true
      args:
        executable: /bin/bash

    - name: "[{{ vol.key }}] recreate old PV + PVC from escrow"
      ansible.builtin.command: "kubectl apply -f {{ escrow_dir }}/{{ item }}"
      loop:
        - "{{ (vol.namespace ~ '_' ~ vol.pvc) | regex_replace('[^A-Za-z0-9_.-]', '_') }}.pv.json"
        - "{{ (vol.namespace ~ '_' ~ vol.pvc) | regex_replace('[^A-Za-z0-9_.-]', '_') }}.pvc.json"

    - name: "[{{ vol.key }}] scale the workload back up on the old driver"
      ansible.builtin.command: kubectl scale -n {{ vol.namespace }} deployment/{{ vol.owner_name }} --replicas={{ vol.replicas }}
      when: vol.owner_kind == 'Deployment'

    # Record + continue (see rbd-rook-migrate-sts.yml) — don't let one rollback abort the namespace.
    - name: "[{{ vol.key }}] record rollback (continue; do not abort the namespace)"
      ansible.builtin.set_fact:
        migrate_failures: "{{ (migrate_failures | default([])) + [vol.key ~ ' (deploy, rolled back to ' ~ old_driver ~ ')'] }}"
