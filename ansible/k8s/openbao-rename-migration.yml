---
# openbao-rename-migration.yml — rename the bank-vaults secret store vault-* -> openbao-*
#
# WHY a data migration and not a kubectl rename: bank-vaults derives every resource name
# from the CR name, and the raft node_id IS the pod name ("${env `POD_NAME`}"). So the
# rename means a new StatefulSet -> new PVCs -> new raft node IDs, and the data must come
# across via a raft snapshot + restore (which re-inits raft cleanly under openbao-0/1/2).
#
# Renames achieved:
#   Vault CR  vault                 -> openbao
#   StatefulSet/pods vault-0/1/2    -> openbao-0/1/2
#   PVCs vault-data-*               -> openbao-data-*   (volumeClaimTemplate renamed)
#   Deployment vault-configurer     -> openbao-configurer
#   Service vault.<ns>.svc          -> openbao.<ns>.svc
#   Job zitadel-admin-sa-to-vault   -> zitadel-admin-sa-to-openbao
#   ClusterSecretStores vault-<realm> -> openbao-<realm>  (+ EVERY ExternalSecret cluster-wide
#                                        that references them — ~160 files, swept globally)
#   HTTPRoute backend / repo folders  vault* -> openbao*
#   ServiceAccount vault -> openbao (+ its tokenreview binding + istio principal)
# NOT renamed (would break): kind: Vault + vault.banzaicloud.com (bank-vaults CRD), the ESO
#   `vault:` provider key, in-Vault policy/role names (vault-admin etc. — live in the restored
#   snapshot), the SOPS-encrypted secrets (vault-unseal-keys, vault-oidc-credentials — renaming
#   means re-encrypt + ref updates), the external-secrets-vault k8s-auth SA (bound in the Vault
#   auth role), the bank-vaults-hardcoded pod label app.kubernetes.io/name=vault, the
#   /vault/{data,config} mount paths, and the domain vault.pcfae.com.
#
# SAFETY: raft snapshot + unseal-key export to a LOCAL path, VALIDATED, and the play ABORTS
# before any destructive step if the backup is missing/empty/unreadable. Rehearse first with
# -e rehearse=true (restores into a scratch namespace, touches nothing real).
#
# Usage (same container pattern as postgres-major-upgrade.yml):
#   docker run --rm \
#     -v ~/.kube:/root/.kube:ro -v ~/.ssh:/root/.ssh:ro \
#     -v /srv/dungeon:/dungeon -v ~/backups/_openbao:/backups \
#     prplanit/ansible-oci:2.20.1-v3 \   # v3+ bakes in kustomize+kubectl (Phase-4 build gate)
#     ansible-playbook /dungeon/ansible/k8s/openbao-rename-migration.yml \
#       -e rehearse=true            # <- ALWAYS run this first; then drop it for the real cut
#
# Resume real cutover after backup already taken:  -e skip_backup=true
# Rollback (old CR from git + retained PVs):        -e rollback=true

- name: Rename secret store vault -> openbao (zero data loss)
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    ns: zeldas-lullaby
    old: vault
    new: openbao
    backup_dir: "/backups"
    repo_dir: "/dungeon"
    rehearse: false
    rollback: false
    skip_backup: false
    # When resuming a real cutover with -e skip_backup=true, point this at the EXISTING backup
    # dir from the earlier run (else bdir gets a fresh timestamp and the Phase-5 gate aborts).
    resume_bdir: ""
    scratch_ns: openbao-rehearsal
    unseal_threshold: 3        # Shamir keys required to unseal
    bao_addr: "http://127.0.0.1:8200"
    # Force sys/health to 200 in every state (standby=429, sealed=503, uninit=501 otherwise),
    # so wget doesn't error and we can parse the JSON body for sealed/initialized.
    health_qs: "standbyok=true&perfstandbyok=true&sealedcode=200&uninitcode=200"
    # The vault/openbao containers are readOnlyRootFilesystem (hardened this session), so
    # snapshots must be written to a WRITABLE mount — /vault/data is the raft PVC.
    snap_in_pod: "/vault/data/migrate.snap"
    # The NEW openbao pods are also readOnlyRootFilesystem (the kyverno hardening selects the
    # renamed app label), so the restore copy must land on the writable raft PVC too, NOT /tmp.
    restore_in_pod: "/vault/data/restore.snap"
    # DELIBERATELY NOT renamed — the unseal secret + the SAs stay "vault-*" so the auth chain
    # (external-secrets bound SA, zitadel role, the CR's serviceAccount + tokenreview CRB) is
    # untouched. Renaming the CR alone already yields openbao-0/1/2 / openbao-configurer. The
    # new openbao CR keeps unsealConfig.secretName = this, so bank-vaults writes/reads it.
    unseal_secret_name: "{{ old }}-unseal-keys"

    # The 5 ClusterSecretStores are named vault-<realm>; renaming them means sweeping every
    # ExternalSecret cluster-wide (secretStoreRef.name) — done globally in Phase 4.
    css_realms: "great-sea|operationtimecapsule|pedestal-of-time|precisionplanit|zeldas-letter"

    # Repo folders to git mv vault -> openbao. Targeted content edits are enumerated in Phase 4
    # (never a blind repo-wide vault->openbao — that would corrupt vaultwarden/bank-vaults/CRD).
    rename_folders:
      - configs/base/vault
      - configs/overlays/production/vault
      - services/base/vault                                    # Vault CR base (PVC + RBAC)
      - services/overlays/production/phase-02-critical/vault   # HTTPRoute (vault.pcfae.com)

  tasks:
    # =====================================================================
    # Phase 0 — Pre-flight
    # =====================================================================
    - name: Set timestamp + backup path (honor resume_bdir when resuming a real cutover)
      ansible.builtin.set_fact:
        timestamp: "{{ ansible_date_time.iso8601_basic_short }}"
        bdir: "{{ resume_bdir if (resume_bdir | length > 0) else (backup_dir ~ '/' ~ old ~ '-to-' ~ new ~ '-' ~ ansible_date_time.iso8601_basic_short) }}"

    - name: "PRE-FLIGHT: all three raft pods present and Ready"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: "{{ ns }}"
        label_selectors: ["app.kubernetes.io/name={{ old }}"]
      register: raft_pods
      failed_when: >
        (raft_pods.resources | selectattr('metadata.name', 'match', '^' ~ old ~ '-[0-9]+$') | list | length) != 3

    - name: "PRE-FLIGHT: vault reports initialized + unsealed"
      kubernetes.core.k8s_exec:
        namespace: "{{ ns }}"
        pod: "{{ old }}-0"
        container: "{{ old }}"
        command: sh -c "wget -qO- '{{ bao_addr }}/v1/sys/health?{{ health_qs }}'"
      register: health
      failed_when: >
        ('"sealed":false' not in health.stdout) or ('"initialized":true' not in health.stdout)

    - name: "PRE-FLIGHT: operator is Ready (needed to reconcile the new CR)"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: "{{ ns }}"
        label_selectors: ["app.kubernetes.io/name=vault-operator"]
      register: op_pods
      failed_when: >
        (op_pods.resources | selectattr('status.phase', 'eq', 'Running')
          | map(attribute='status.containerStatuses') | map('first')
          | selectattr('ready') | list | length) < 1

    - name: "PRE-FLIGHT: all raft data PVs are Retain (data survives PVC deletion)"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: PersistentVolumeClaim
        namespace: "{{ ns }}"
        name: "{{ old }}-data-{{ old }}-{{ item }}"
      loop: [0, 1, 2]
      register: pvc_info

    - name: Resolve backing PVs
      kubernetes.core.k8s_info:
        api_version: v1
        kind: PersistentVolume
        name: "{{ item.resources[0].spec.volumeName }}"
      loop: "{{ pvc_info.results }}"
      loop_control: {label: "{{ item.item }}"}
      register: pv_info

    - name: Assert every raft PV is Retain
      ansible.builtin.assert:
        that:
          - item.resources[0].spec.persistentVolumeReclaimPolicy == 'Retain'
        fail_msg: "PV {{ item.resources[0].metadata.name }} is NOT Retain — refusing to proceed."
      loop: "{{ pv_info.results }}"
      loop_control: {label: "{{ item.resources[0].metadata.name }}"}

    - name: "PRE-FLIGHT: capture the OLD unseal secret (Shamir shares + root token) once"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        namespace: "{{ ns }}"
        name: "{{ old }}-unseal-keys"
      register: unseal_secret
      no_log: true

    - name: "PRE-FLIGHT: derive the OLD root token"
      ansible.builtin.set_fact:
        root_token: "{{ unseal_secret.resources[0].data['vault-root'] | b64decode }}"
      no_log: true

    - name: "PRE-FLIGHT: assert we actually have the root token + >= threshold shares"
      ansible.builtin.assert:
        that:
          - root_token | length > 0
          - (unseal_secret.resources[0].data.keys() | select('match', '^' ~ old ~ '-unseal-') | list | length) >= unseal_threshold
        fail_msg: "Could not read the root token / enough Shamir shares from {{ old }}-unseal-keys — refusing to proceed."
      no_log: true

    # =====================================================================
    # Phase 1 — BACKUP to local path (the gate)
    # =====================================================================
    - name: "BACKUP: local dir"
      ansible.builtin.file: {path: "{{ bdir }}", state: directory, mode: '0700'}
      when: not skip_backup

    - name: "BACKUP: take raft snapshot inside {{ old }}-0 (writable /vault/data; CLI proxies to leader)"
      kubernetes.core.k8s_exec:
        namespace: "{{ ns }}"
        pod: "{{ old }}-0"
        container: "{{ old }}"
        # export (NOT inline prefix): the folded scalar preserves the newline before each
        # continuation line, so a bare `VAR=val\n cmd` prefix would NOT reach the child — the
        # env must be exported and each statement ;-terminated. The save && stat stays one line.
        command: >
          sh -c "export VAULT_ADDR={{ bao_addr }};
                 export VAULT_TOKEN='{{ root_token }}';
                 bao operator raft snapshot save {{ snap_in_pod }} && stat -c%s {{ snap_in_pod }}"
      register: snap
      failed_when: snap.rc != 0 or (snap.stdout | trim | int) < 1024
      no_log: true
      when: not skip_backup

    - name: "BACKUP: copy snapshot to local"
      kubernetes.core.k8s_cp:
        namespace: "{{ ns }}"
        pod: "{{ old }}-0"
        container: "{{ old }}"
        remote_path: "{{ snap_in_pod }}"
        local_path: "{{ bdir }}/{{ old }}.snap"
        state: from_pod
      when: not skip_backup

    - name: "BACKUP: remove the in-pod snapshot copy (keep the raft PVC clean)"
      kubernetes.core.k8s_exec:
        namespace: "{{ ns }}"
        pod: "{{ old }}-0"
        container: "{{ old }}"
        command: sh -c "rm -f {{ snap_in_pod }}"
      when: not skip_backup

    - name: "BACKUP: write unseal secret to local (0600)"
      ansible.builtin.copy:
        dest: "{{ bdir }}/{{ old }}-unseal-keys.json"
        content: "{{ unseal_secret.resources[0] | to_nice_json }}"
        mode: '0600'
      no_log: true
      when: not skip_backup

    - name: "GATE: snapshot exists locally and is non-trivial"
      ansible.builtin.stat: {path: "{{ bdir }}/{{ old }}.snap"}
      register: snap_stat
      when: not skip_backup

    - name: "GATE: ABORT unless the local backup is present and > 1KiB"
      ansible.builtin.assert:
        that:
          - snap_stat.stat.exists
          - snap_stat.stat.size | default(0) > 1024
        fail_msg: >
          LOCAL BACKUP FAILED — snapshot missing or too small
          ({{ snap_stat.stat.size | default(0) }} bytes). Aborting before any destructive step.
      when: not skip_backup

    - name: "GATE: unseal-key backup present with the expected shares"
      ansible.builtin.assert:
        that:
          - (unseal_secret.resources[0].data.keys() | select('match', '^' ~ old ~ '-unseal-') | list | length) >= unseal_threshold
        fail_msg: "Unseal-key backup incomplete — refusing to proceed."
      no_log: true
      when: not skip_backup

    # =====================================================================
    # Phase 2 — REHEARSAL (default) — restore into scratch, touch nothing real
    # =====================================================================
    - name: REHEARSAL — prove restore + old-key unseal in a throwaway pod (no real resource touched)
      when: rehearse | bool
      block:
        - name: "REHEARSE: scratch namespace"
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: v1
              kind: Namespace
              metadata: {name: "{{ scratch_ns }}"}

        - name: "REHEARSE: standalone single-node openbao raft pod (self-contained, no operator/RBAC)"
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: v1
              kind: Pod
              metadata: {name: "{{ new }}-rehearse", namespace: "{{ scratch_ns }}"}
              spec:
                restartPolicy: Never
                containers:
                  - name: openbao
                    image: docker.io/openbao/openbao:2.6.1
                    args: ["server"]
                    env:
                      - name: BAO_LOCAL_CONFIG
                        value: >-
                          {"storage":{"raft":{"path":"/openbao/data","node_id":"rehearse-0"}},
                           "listener":{"tcp":{"address":"0.0.0.0:8200","tls_disable":true}},
                           "disable_mlock":true,"api_addr":"{{ bao_addr }}","cluster_addr":"http://127.0.0.1:8201"}
                    securityContext:
                      capabilities: {add: ["IPC_LOCK"]}
                    volumeMounts:
                      - {name: data, mountPath: /openbao/data}
                volumes:
                  - {name: data, emptyDir: {}}

        - name: "REHEARSE: wait for rehearse pod Running"
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Pod
            name: "{{ new }}-rehearse"
            namespace: "{{ scratch_ns }}"
          register: rp
          until: rp.resources | length > 0 and rp.resources[0].status.phase == 'Running'
          retries: 24
          delay: 5

        - name: "REHEARSE: wait for the throwaway bao API to accept connections"
          kubernetes.core.k8s_exec:
            namespace: "{{ scratch_ns }}"
            pod: "{{ new }}-rehearse"
            container: openbao
            command: >
              sh -c "export VAULT_ADDR={{ bao_addr }}; bao status -format=json || true"
          register: rstat
          until: "'initialized' in (rstat.stdout | default(''))"
          retries: 12
          delay: 5

        - name: "REHEARSE: init the throwaway pod (single temp key, runs once)"
          kubernetes.core.k8s_exec:
            namespace: "{{ scratch_ns }}"
            pod: "{{ new }}-rehearse"
            container: openbao
            command: >
              sh -c "export VAULT_ADDR={{ bao_addr }};
                     bao operator init -key-shares=1 -key-threshold=1 -format=json"
          register: rinit
          failed_when: rinit.rc != 0 or 'unseal_keys_b64' not in rinit.stdout
          no_log: true

        - name: "REHEARSE: parse the temp unseal key + root token (in ansible, reliably)"
          ansible.builtin.set_fact:
            rehearse_unseal: "{{ (rinit.stdout | from_json).unseal_keys_b64[0] }}"
            rehearse_root: "{{ (rinit.stdout | from_json).root_token }}"
          no_log: true

        - name: "REHEARSE: unseal with the temp key"
          kubernetes.core.k8s_exec:
            namespace: "{{ scratch_ns }}"
            pod: "{{ new }}-rehearse"
            container: openbao
            command: >
              sh -c "export VAULT_ADDR={{ bao_addr }};
                     bao operator unseal '{{ rehearse_unseal }}'"
          register: runseal
          failed_when: runseal.rc != 0
          no_log: true

        - name: "REHEARSE: copy the snapshot in"
          kubernetes.core.k8s_cp:
            namespace: "{{ scratch_ns }}"
            pod: "{{ new }}-rehearse"
            container: openbao
            local_path: "{{ bdir }}/{{ old }}.snap"
            remote_path: /tmp/restore.snap
            state: to_pod

        - name: "REHEARSE: restore -force (temp root), then unseal with the OLD Shamir shares"
          kubernetes.core.k8s_exec:
            namespace: "{{ scratch_ns }}"
            pod: "{{ new }}-rehearse"
            container: openbao
            command: >
              sh -c "export VAULT_ADDR={{ bao_addr }};
                     export VAULT_TOKEN='{{ rehearse_root }}';
                     bao operator raft snapshot restore -force /tmp/restore.snap;
                     {% for i in range(unseal_threshold) %}
                     bao operator unseal '{{ unseal_secret.resources[0].data[old ~ '-unseal-' ~ i] | b64decode }}' >/dev/null || true;
                     {% endfor %}
                     echo RESTORE_OK"
          register: rrestore
          no_log: true
          failed_when: "'RESTORE_OK' not in rrestore.stdout"

        - name: "REHEARSE: PROVE data came across (old root token authenticates)"
          kubernetes.core.k8s_exec:
            namespace: "{{ scratch_ns }}"
            pod: "{{ new }}-rehearse"
            container: openbao
            command: >
              sh -c "export VAULT_ADDR={{ bao_addr }};
                     export VAULT_TOKEN='{{ root_token }}';
                     bao status && bao secrets list && bao policy list"
          register: rverify
          no_log: true
          failed_when: >
            'operationtimecapsule' not in rverify.stdout or 'external-secrets' not in rverify.stdout

        - name: "REHEARSE: PASSED — snapshot restores, old keys unseal, engines+policies intact"
          ansible.builtin.debug:
            msg:
              - "REHEARSAL PASSED. The snapshot at {{ bdir }}/{{ old }}.snap is restorable and"
              - "unseals with the ORIGINAL keys, with all secrets engines/policies present."
              - "Safe to run the real cutover (drop -e rehearse=true)."

      always:
        - name: "REHEARSE: tear down scratch namespace"
          kubernetes.core.k8s:
            state: absent
            api_version: v1
            kind: Namespace
            name: "{{ scratch_ns }}"
          when: rehearse | bool

    - name: "REHEARSE: stop here (rehearsal only proves; it never cuts over)"
      ansible.builtin.meta: end_play
      when: rehearse | bool

    # =====================================================================
    # Phase 3 — FREEZE (real cutover only)
    # =====================================================================
    - name: "FREEZE: suspend flux kustomizations that manage vault"
      kubernetes.core.k8s:
        state: patched
        api_version: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        name: "{{ item }}"
        namespace: flux-system
        definition: {spec: {suspend: true}}
      loop: [infra-configs, infra-operators]
      when: not (rehearse | bool) and not (rollback | bool)

    - name: "FREEZE: scale external-secrets to 0 (stops secret syncs during cutover)"
      kubernetes.core.k8s_scale:
        api_version: apps/v1
        kind: Deployment
        name: external-secrets
        namespace: "{{ ns }}"
        replicas: 0
        wait: true
        wait_timeout: 120
      when: not (rehearse | bool) and not (rollback | bool)

    # =====================================================================
    # Phase 4 — GIT RENAME (targeted; commit + push, like postgres-major-upgrade)
    # =====================================================================
    - name: "GIT: safe.directory"
      ansible.builtin.command: "git config --global --add safe.directory {{ repo_dir }}"
      changed_when: false
      when: not (rehearse | bool)

    # All three vault folders -> openbao (configs base, configs overlay, services phase-02 route).
    - name: "GIT: move the three vault folders -> openbao"
      ansible.builtin.command:
        cmd: "git mv fluxcd/infrastructure/{{ item }} fluxcd/infrastructure/{{ item | regex_replace('/' ~ old ~ '$', '/' ~ new) }}"
        chdir: "{{ repo_dir }}"
      loop: "{{ rename_folders }}"
      changed_when: true
      when: not (rehearse | bool)

    # Deployment-local content edits — targeted + \b-anchored (so 'vault' never hits
    # 'vaultwarden'/'bank-vaults'). Spared here: kind: Vault / vault.banzaicloud.com, the
    # secret/SA auth chain, in-Vault policy names, /vault/{data,config} mount PATHS, the domain.
    - name: "GIT: rewrite the enumerated (deployment-local) references"
      ansible.builtin.replace:
        path: "{{ repo_dir }}/{{ item.path }}"
        regexp: "{{ item.re }}"
        replace: "{{ item.rep }}"
      loop:
        # -- CR identity: base CR name + the overlay patch's target name --
        - {path: "fluxcd/infrastructure/configs/base/{{ new }}/{{ old }}-cr.yaml", re: '^(\s*name:\s*){{ old }}\s*$', rep: '\1{{ new }}'}
        - {path: "fluxcd/infrastructure/configs/overlays/production/{{ new }}/{{ old }}-cr-patch.yaml", re: '^(\s*name:\s*){{ old }}\s*$', rep: '\1{{ new }}'}
        # -- kustomize base-path wiring (BOTH overlays reference base/vault) + overlay nameRef --
        - {path: "fluxcd/infrastructure/configs/overlays/production/{{ new }}/kustomization.yaml", re: 'base/{{ old }}\b', rep: 'base/{{ new }}'}
        - {path: "fluxcd/infrastructure/configs/overlays/production/{{ new }}/kustomization.yaml", re: '(name:\s*){{ old }}(\s*$)', rep: '\1{{ new }}\2'}
        - {path: "fluxcd/infrastructure/services/overlays/production/phase-02-critical/{{ new }}/kustomization.yaml", re: 'base/{{ old }}\b', rep: 'base/{{ new }}'}
        # -- raft bootstrap peer DNS (vault-0 -> openbao-0); node_id/api_addr use $POD_NAME --
        - {path: "fluxcd/infrastructure/configs/base/{{ new }}/{{ old }}-cr.yaml", re: '{{ old }}-([0-9])', rep: '{{ new }}-\1'}
        # NOTE: the podAntiAffinity value app.kubernetes.io/name In [vault] is NOT renamed —
        # bank-vaults HARDCODES the pod label app.kubernetes.io/name=vault regardless of CR name.
        # -- ONLY the vault-data claim-template -> PVCs become openbao-data-*. vault-config is
        #    NOT renamed: bank-vaults auto-injects the config volume under that fixed name, so a
        #    mount referencing openbao-config has no volume -> operator rejects the StatefulSet. --
        - {path: "fluxcd/infrastructure/configs/base/{{ new }}/{{ old }}-cr.yaml", re: '{{ old }}-data\b', rep: '{{ new }}-data'}
        - {path: "fluxcd/infrastructure/configs/overlays/production/{{ new }}/{{ old }}-cr-patch.yaml", re: '{{ old }}-(data|config)\b', rep: '{{ new }}-\1'}
        - {path: "fluxcd/infrastructure/services/overlays/production/phase-02-critical/{{ new }}/pvc-patch.yaml", re: '{{ old }}-data\b', rep: '{{ new }}-data'}
        # -- services/base: static PVC + the secrets-reader Role/binding (SA "vault" stays: auth) --
        - {path: "fluxcd/infrastructure/services/base/{{ new }}/pvc.yaml", re: '{{ old }}-(data|config)\b', rep: '{{ new }}-\1'}
        - {path: "fluxcd/infrastructure/services/base/{{ new }}/rbac.yaml", re: '{{ old }}-secrets-reader\b', rep: '{{ new }}-secrets-reader'}
        - {path: "fluxcd/infrastructure/services/overlays/production/phase-02-critical/{{ new }}/kustomization.yaml", re: '{{ old }}-(data|config)\b', rep: '{{ new }}-\1'}
        # -- example ExternalSecret's illustrative store name (doc-only; keep the folder clean) --
        - {path: "fluxcd/infrastructure/configs/overlays/production/{{ new }}/example-externalsecret.yaml", re: '{{ old }}-backend\b', rep: '{{ new }}-backend'}
        # -- Service address in the 5 ClusterSecretStores + the zitadel job (service renamed) --
        - {path: "fluxcd/infrastructure/configs/overlays/production/{{ new }}/clustersecretstore-great-sea.yaml", re: 'http://{{ old }}\.{{ ns }}\.svc', rep: 'http://{{ new }}.{{ ns }}.svc'}
        - {path: "fluxcd/infrastructure/configs/overlays/production/{{ new }}/clustersecretstore-precisionplanit.yaml", re: 'http://{{ old }}\.{{ ns }}\.svc', rep: 'http://{{ new }}.{{ ns }}.svc'}
        - {path: "fluxcd/infrastructure/configs/overlays/production/{{ new }}/clustersecretstore-pedestal-of-time.yaml", re: 'http://{{ old }}\.{{ ns }}\.svc', rep: 'http://{{ new }}.{{ ns }}.svc'}
        - path: "fluxcd/infrastructure/configs/overlays/production/{{ new }}/clustersecretstore-operationtimecapsule.yaml"
          re: 'http://{{ old }}\.{{ ns }}\.svc'
          rep: 'http://{{ new }}.{{ ns }}.svc'
        - {path: "fluxcd/infrastructure/configs/overlays/production/{{ new }}/clustersecretstore-zeldas-letter.yaml", re: 'http://{{ old }}\.{{ ns }}\.svc', rep: 'http://{{ new }}.{{ ns }}.svc'}
        - {path: "fluxcd/infrastructure/services/base/zitadel-jobs/admin-sa-provision-job.yaml", re: 'http://{{ old }}\.{{ ns }}\.svc', rep: 'http://{{ new }}.{{ ns }}.svc'}
        # -- PARENT aggregator kustomizations that include the overlay by its folder name --
        - {path: "fluxcd/infrastructure/configs/overlays/production/kustomization.yaml", re: '^(\s*-\s+){{ old }}\b', rep: '\1{{ new }}'}
        - {path: "fluxcd/infrastructure/services/overlays/production/phase-02-critical/kustomization.yaml", re: '^(\s*-\s+\./){{ old }}\b', rep: '\1{{ new }}'}
        # -- kyverno hardening: ONLY the container-NAME preconditions change. The MATCH selectors
        #    (app.kubernetes.io/name: vault + vault-configurator) are bank-vaults' hardcoded pod
        #    labels and MUST stay; only the vault CONTAINER is renamed openbao (vaultContainerSpec
        #    .name), so the foreach that hardened container 'vault' now targets 'openbao'. --
        - {path: "fluxcd/infrastructure/configs/overlays/production/kyverno-policies/mutate-{{ old }}-sidecar-hardening.yaml", re: 'value: \[{{ old }},', rep: 'value: [{{ new }},'}
        - {path: "fluxcd/infrastructure/configs/overlays/production/kyverno-policies/mutate-{{ old }}-sidecar-hardening.yaml", re: '^(\s*value: ){{ old }}\s*$', rep: '\1{{ new }}'}
        # -- ServiceAccount rename vault -> openbao (the pod SA is CR-settable, not hardcoded).
        #    The k8s-auth roles bind external-secrets-vault/zitadel (separate SAs), so only the
        #    vault SA's own identity moves: the SA, the CR serviceAccount, the tokenreview
        #    ClusterRoleBinding (name+subject), and the istio principal. --
        - {path: "fluxcd/infrastructure/services/base/{{ new }}/rbac.yaml", re: '^(\s*)name: {{ old }}\s*$', rep: '\1name: {{ new }}'}
        - {path: "fluxcd/infrastructure/configs/base/{{ new }}/{{ old }}-cr.yaml", re: '^(\s*serviceAccount: ){{ old }}\s*$', rep: '\1{{ new }}'}
        - {path: "fluxcd/infrastructure/configs/base/{{ new }}/{{ old }}-sa-auth-delegator.yaml", re: '{{ old }}-tokenreview-binding', rep: '{{ new }}-tokenreview-binding'}
        - {path: "fluxcd/infrastructure/configs/base/{{ new }}/{{ old }}-sa-auth-delegator.yaml", re: '^(\s*)name: {{ old }}\s*$', rep: '\1name: {{ new }}'}
        - {path: "fluxcd/infrastructure/configs/overlays/production/{{ new }}/{{ old }}-sa-auth-delegator-patch.yaml", re: '{{ old }}-tokenreview-binding', rep: '{{ new }}-tokenreview-binding'}
        - {path: "fluxcd/infrastructure/configs/overlays/production/{{ new }}/{{ old }}-sa-auth-delegator-patch.yaml", re: '^(\s*)name: {{ old }}\s*$', rep: '\1name: {{ new }}'}
        # istio mTLS principal for the vault->vault (raft + configurer) allow follows the SA rename.
        - {path: "fluxcd/infrastructure/configs/overlays/production/istio-policies/{{ ns }}/allow-{{ old }}-to-{{ old }}.yaml", re: 'sa/{{ old }}\b', rep: 'sa/{{ new }}'}
      when: not (rehearse | bool)

    # The bank-vaults Vault CRD requires vaultContainerSpec.name, but the upstream CR omits it
    # (grandfathered on the old object; a NEW openbao CR fails server-side dry-run without it).
    # Inject it = the container name; negative-lookahead keeps this idempotent on a re-run.
    # Inject vaultContainerSpec.name (CRD-required) AND a TMPDIR env in one block. TMPDIR: raft
    # snapshot restore writes a temp file via os.CreateTemp; readOnlyRootFilesystem (kyverno) makes
    # /tmp RO, so point it at the writable raft PVC. It MUST be a real container env — bank-vaults'
    # envsConfig does NOT reach the openbao process, and vaultPodSpec.volumes (an emptyDir at /tmp)
    # REPLACES the operator's auto-generated volume set and wedges the StatefulSet.
    - name: "GIT: set vaultContainerSpec.name + TMPDIR (CRD-required name; restore temp under RO-rootfs)"
      ansible.builtin.replace:
        path: "{{ repo_dir }}/fluxcd/infrastructure/configs/overlays/production/{{ new }}/{{ old }}-cr-patch.yaml"
        regexp: '(?m)^(  vaultContainerSpec:\n)(?!    name:)'
        replace: "\\g<1>    name: {{ new }}\n    env:\n      - name: TMPDIR\n        value: /vault/data\n"
      when: not (rehearse | bool)

    # Sealed-tolerant liveness (bank-vaults DOES honor vaultContainerSpec.livenessProbe). Its
    # default probe 503s while sealed and kills the pod in ~30s — fatal on the cold bootstrap
    # where every node is sealed at once and the configurer needs a stable window to init+unseal.
    - name: "GIT: sealed-tolerant liveness on the vault container (cold-start bootstrap survives)"
      ansible.builtin.replace:
        path: "{{ repo_dir }}/fluxcd/infrastructure/configs/overlays/production/{{ new }}/{{ old }}-cr-patch.yaml"
        regexp: '(?m)^(    env:\n      - name: TMPDIR\n        value: /vault/data\n)(?!    livenessProbe:)'
        replace: |
          \g<1>    livenessProbe:
                httpGet:
                  path: /v1/sys/health?standbyok=true&perfstandbyok=true&sealedcode=200&uninitcode=200&drsecondarycode=200
                  port: api-port
                  scheme: HTTP
                failureThreshold: 3
                initialDelaySeconds: 60
                periodSeconds: 10
                timeoutSeconds: 3
      when: not (rehearse | bool)

    # The one-shot zitadel provisioning Job zitadel-admin-sa-to-vault is referenced by name in
    # its base, its phase-03-core overlay patches, AND the vault CNP/istio selectors — sweep the
    # whole tree (unambiguous string) so no cross-overlay patch target is left dangling.
    - name: "GIT: list files referencing the zitadel-admin-sa-to-{{ old }} Job (cluster-wide)"
      ansible.builtin.command:
        cmd: "git grep -lIE 'zitadel-admin-sa-to-{{ old }}\\b' -- fluxcd/"
        chdir: "{{ repo_dir }}"
      register: zj_files
      changed_when: false
      failed_when: zj_files.rc not in [0, 1]
      when: not (rehearse | bool)

    - name: "GIT: sweep zitadel-admin-sa-to-{{ old }} -> zitadel-admin-sa-to-{{ new }}"
      ansible.builtin.replace:
        path: "{{ repo_dir }}/{{ item }}"
        regexp: 'zitadel-admin-sa-to-{{ old }}\b'
        replace: 'zitadel-admin-sa-to-{{ new }}'
      loop: "{{ zj_files.stdout_lines | default([]) }}"
      loop_control: {label: "{{ item }}"}
      when: not (rehearse | bool)

    # The 5 ClusterSecretStores are renamed vault-<realm> -> openbao-<realm>; that name is the
    # secretStoreRef.name in every app's ExternalSecret, so sweep the WHOLE tree (~160 files).
    # Realm-qualified (vault-great-sea etc.) is unambiguous — it never means anything but a CSS.
    - name: "GIT: list files referencing a ClusterSecretStore vault-<realm> (cluster-wide)"
      ansible.builtin.command:
        cmd: "git grep -lIE '\\b{{ old }}-({{ css_realms }})\\b' -- fluxcd/"
        chdir: "{{ repo_dir }}"
      register: css_files
      changed_when: false
      failed_when: css_files.rc not in [0, 1]    # rc=1 == no matches (fine, e.g. on a re-run)
      when: not (rehearse | bool)

    # ansible.builtin.replace (Python re) — NOT shell perl: the container has no perl, and this
    # keeps the backreference/UTF handling identical across ~160 ExternalSecret files.
    - name: "GIT: sweep ClusterSecretStore refs vault-<realm> -> openbao-<realm> (cluster-wide)"
      ansible.builtin.replace:
        path: "{{ repo_dir }}/{{ item }}"
        regexp: '\b{{ old }}-({{ css_realms }})\b'
        replace: '{{ new }}-\1'
      loop: "{{ css_files.stdout_lines | default([]) }}"
      loop_control: {label: "{{ item }}"}
      when: not (rehearse | bool)

    # NOTE: the CNP + istio AuthZ policies are DELIBERATELY not rewritten. They select the vault
    # workload by bank-vaults' hardcoded pod labels (app.kubernetes.io/name: vault + the
    # external-secrets/zitadel source labels) — renaming those to openbao orphans the policies
    # and istio/cilium default-deny drops the configurer->openbao + raft traffic (pods never
    # unseal). The policy FILES keep their vault-* names (not scraped). Only the HTTPRoute
    # backend, which points at the renamed openbao SERVICE, changes:
    - name: "GIT: HTTPRoute backend service vault -> openbao (hostname vault.pcfae.com kept)"
      ansible.builtin.replace:
        path: "{{ repo_dir }}/fluxcd/infrastructure/services/overlays/production/phase-02-critical/{{ new }}/httproute-xylem.yaml"
        regexp: '(name: ){{ old }}\b'
        replace: '\1{{ new }}'
      when: not (rehearse | bool)

    # ---- FAIL-LOUD GATES: never commit a half-rename ----
    # Build the FULL Flux root paths, not just the leaf overlays — a leaf-only gate misses
    # parent aggregators and cross-overlay patch targets (that gap is exactly what let the
    # 'vault' overlay ref and the zitadel-job patch dangling refs reach a live Flux build).
    # These are every Kustomization .spec.path Flux reconciles; if they build, Flux applies.
    - name: "GATE: kustomize build every Flux ROOT path (catches parent + cross-overlay refs)"
      ansible.builtin.command:
        cmd: "kustomize build {{ item }}"
        chdir: "{{ repo_dir }}"
      loop:
        - "fluxcd/apps/overlays/production"
        - "fluxcd/infrastructure/configs/overlays/production"
        - "fluxcd/infrastructure/operators/overlays/production"
        - "fluxcd/infrastructure/services/overlays/production/phase-01-storage"
        - "fluxcd/infrastructure/services/overlays/production/phase-02-critical"
        - "fluxcd/infrastructure/services/overlays/production/phase-03-core"
        - "fluxcd/infrastructure/services/overlays/production/phase-04-platform"
        - "fluxcd/infrastructure/services/overlays/production/phase-03-core/zitadel-jobs"
      changed_when: false
      when: not (rehearse | bool)

    # kustomize build does NOT validate volumeMount<->volume linkage. Assert the rendered
    # manifests carry ZERO old vault-data (the claim-template rename must be complete). NOTE:
    # vault-config is intentionally NOT checked — bank-vaults injects that volume by that name.
    - name: "GATE: rendered openbao manifests carry no stray {{ old }}-data claim/volume"
      ansible.builtin.shell:
        cmd: "kustomize build fluxcd/infrastructure/configs/overlays/production/{{ new }} | grep -cE '{{ old }}-data\\b' || true"
        chdir: "{{ repo_dir }}"
      register: vol_stray
      changed_when: false
      when: not (rehearse | bool)

    - name: "GATE: ABORT if the volumeClaimTemplate/mount rename is inconsistent"
      ansible.builtin.assert:
        that: [ "vol_stray.stdout | trim | int == 0" ]
        fail_msg: "Rendered openbao manifests still contain {{ old }}-data/{{ old }}-config — volume rename incomplete, pod would wedge at cutover."
      when: not (rehearse | bool)

    - name: "GATE: cluster-wide sweep completeness — NO vault-<realm> ClusterSecretStore ref left"
      ansible.builtin.shell:
        cmd: "git grep -nIE '\\b{{ old }}-({{ css_realms }})\\b' -- fluxcd/ || true"
        chdir: "{{ repo_dir }}"
      register: stray_css
      changed_when: false
      when: not (rehearse | bool)

    - name: "GATE: ABORT if any vault-<realm> store refs remain (ExternalSecrets would break)"
      ansible.builtin.assert:
        that: [ "stray_css.stdout | trim | length == 0" ]
        fail_msg: |
          ClusterSecretStore sweep incomplete — vault-<realm> refs remain:
          {{ stray_css.stdout }}
      when: not (rehearse | bool)

    # In the openbao scope the ONLY acceptable 'vault' left is the unchangeable set: the CRD
    # group/kind, the ESO `vault:` provider key, the in-Vault policy/role names (live in the
    # restored snapshot), the /vault/{data,config} mount paths, the secret/SA auth chain, the
    # domain, comments, and legacy .md/.sh helpers. Anything else = a half-rename -> ABORT.
    - name: "GATE: no unexpected stray '{{ old }}' in the renamed openbao scope"
      ansible.builtin.shell:
        cmd: >
          git grep -nIE '\b{{ old }}\b' -- 'fluxcd/**/{{ new }}/**' 'fluxcd/**/*{{ new }}*'
          | grep -vE '\.(md|sh):'
          | grep -vE ':[0-9]+:[[:space:]]*#'
          | grep -vE '\S+\.(ya?ml|sh)[[:space:]]*$'
          | grep -viE 'vaultwarden|bank-vaults|kind: Vault|{{ old }}\.banzaicloud\.com|{{ old }}\.pcfae\.com'
          | grep -viE '{{ old }}-unseal-keys|{{ old }}-oidc-credentials|serviceAccount:|external-secrets-{{ old }}|{{ old }}-tokenreview'
          | grep -viE '{{ old }}-sa-auth|{{ old }}-admin|zitadel-{{ old }}-sync|/{{ old }}/(data|config)|[[:space:]]{{ old }}:|[[:space:]]name: {{ old }}$|[[:space:]]-[[:space:]]{{ old }}$' || true
        chdir: "{{ repo_dir }}"
      register: stray
      changed_when: false
      when: not (rehearse | bool)

    - name: "GATE: ABORT if any unexpected stray refs remain (review them; do not auto-commit)"
      ansible.builtin.assert:
        that: [ "stray.stdout | trim | length == 0" ]
        fail_msg: |
          Unexpected '{{ old }}' references remain after rename — NOT committing:
          {{ stray.stdout }}
      when: not (rehearse | bool)

    # --no-verify: the repo's pre-commit hook (pre-commit.com) isn't installed in this container;
    # signing isn't enforced and the message is conventional (satisfies .stagefreight commit:).
    - name: "GIT: commit + push (only reached if build + BOTH stray gates passed)"
      ansible.builtin.command:
        argv: "{{ item }}"
        chdir: "{{ repo_dir }}"
      loop:
        # -A fluxcd/ ONLY: the rename touches nothing outside fluxcd/, and this keeps the
        # untracked migration playbook (ansible/k8s/) out of the commit.
        - ["git", "add", "-A", "fluxcd/"]
        - ["git", "commit", "--no-verify", "-m", "refactor(openbao): rename secret store vault-* -> openbao-* (CR/pods/PVCs/service/CSS + all ExternalSecret refs; auth-chain SA/secrets kept)"]
        - ["git", "push"]
      changed_when: true
      when: not (rehearse | bool)

    # =====================================================================
    # Phase 5 — CUTOVER (teardown old, bring up openbao, restore, unseal hand-off)
    #   Data-critical. Concrete below; PROVE it via `-e rehearse=true` before first prod run.
    # =====================================================================
    # HARD SAFETY GATE — runs unconditionally (even under skip_backup): never delete the CR
    # unless a valid local snapshot + unseal-key backup is on disk right now.
    - name: "CUTOVER-GATE: stat the local backup that the restore depends on"
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ bdir }}/{{ old }}.snap"
        - "{{ bdir }}/{{ old }}-unseal-keys.json"
      register: pre_cut
      when: not (rehearse | bool)

    - name: "CUTOVER-GATE: ABORT the cutover unless snapshot (>1KiB) + unseal backup both exist"
      ansible.builtin.assert:
        that:
          - pre_cut.results[0].stat.exists and pre_cut.results[0].stat.size > 1024
          - pre_cut.results[1].stat.exists
        fail_msg: >
          Refusing to delete the Vault CR — the local backup at {{ bdir }} is missing/empty.
          If resuming with skip_backup=true, pass -e resume_bdir=<the earlier backup dir>.
      when: not (rehearse | bool)

    - name: "CUTOVER: delete the old Vault CR (operator removes sts/pods; Retain PVs kept)"
      kubernetes.core.k8s:
        state: absent
        api_version: vault.banzaicloud.com/v1alpha1
        kind: Vault
        name: "{{ old }}"
        namespace: "{{ ns }}"
        wait: true
        wait_timeout: 180
      when: not (rehearse | bool)

    - name: "CUTOVER: confirm old raft pods are gone"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: "{{ ns }}"
        label_selectors: ["app.kubernetes.io/name={{ old }}"]
      register: old_gone
      until: (old_gone.resources | selectattr('metadata.name', 'match', '^' ~ old ~ '-[0-9]+$') | list | length) == 0
      retries: 36
      delay: 5
      when: not (rehearse | bool)

    - name: "CUTOVER: assert the retained PVs are Released, NOT deleted (data still there)"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: PersistentVolume
        name: "{{ item.resources[0].spec.volumeName }}"
      loop: "{{ pvc_info.results }}"
      loop_control: {label: "{{ item.item }}"}
      register: pv_after
      failed_when: pv_after.resources[0].status.phase not in ['Released', 'Available', 'Bound']
      when: not (rehearse | bool)

    - name: "CUTOVER: resume flux so the openbao-named CR is applied"
      kubernetes.core.k8s:
        state: patched
        api_version: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        name: "{{ item }}"
        namespace: flux-system
        definition:
          metadata: {annotations: {"reconcile.fluxcd.io/requestedAt": "{{ ansible_date_time.iso8601 }}"}}
          spec: {suspend: false}
      loop: [infra-operators, infra-configs]
      when: not (rehearse | bool)

    - name: "CUTOVER: wait for openbao-0 pod to be Running"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        name: "{{ new }}-0"
        namespace: "{{ ns }}"
      register: new_pod
      until: new_pod.resources | length > 0 and new_pod.resources[0].status.phase == 'Running'
      retries: 60
      delay: 10
      when: not (rehearse | bool)

    # COLD-BOOTSTRAP UNBLOCK: bank-vaults' configurer reaches the vault pods through the main
    # `openbao` Service, but that Service only routes to READY endpoints — and every node is
    # not-ready (sealed) during a fresh bootstrap, so the configurer gets no endpoint and can
    # never init/unseal them (deadlock). Publish not-ready addresses so it can. (Per-pod services
    # already do; the main one doesn't, and bank-vaults doesn't manage this field, so it sticks.)
    # If the configurer still can't init (mesh/timing), the CUTOVER tasks below bootstrap a fresh
    # cluster automatically: `bao operator init` on openbao-0 via localhost, unseal, then restore.
    - name: "CUTOVER: publish not-ready addresses on the openbao Service (cold-bootstrap reachability)"
      kubernetes.core.k8s:
        state: patched
        api_version: v1
        kind: Service
        name: "{{ new }}"
        namespace: "{{ ns }}"
        definition:
          spec: {publishNotReadyAddresses: true}
      when: not (rehearse | bool)

    # COLD-BOOTSTRAP: bank-vaults does NOT reliably auto-init a fresh raft cluster here (the sidecar
    # tries to JOIN rather than bootstrap and the configurer just waits) — proven in the live cutover,
    # where openbao-0 sat uninitialized until inited by hand. Give bank-vaults a short grace window;
    # if openbao-0 is still uninitialized, bootstrap it here (localhost, no mesh): init a single temp
    # key + unseal, so the -force restore below can lay the OLD barrier + data back over it. Race-safe:
    # the init is gated on "still uninitialized" and tolerates a bank-vaults init that lands first (the
    # root-selection task then falls back to the secret's root instead of the temp one).
    - name: "CUTOVER: grace window for bank-vaults to auto-init (best-effort, never fails)"
      kubernetes.core.k8s_exec:
        namespace: "{{ ns }}"
        pod: "{{ new }}-0"
        container: "{{ new }}"
        command: sh -c "wget -qO- '{{ bao_addr }}/v1/sys/health?{{ health_qs }}'"
      register: new_health
      until: ('"initialized":true' in (new_health.stdout | default('')))
      retries: 6
      delay: 10
      failed_when: false
      when: not (rehearse | bool)

    - name: "CUTOVER: is openbao-0 initialized yet?"
      ansible.builtin.set_fact:
        openbao_initialized: "{{ '\"initialized\":true' in (new_health.stdout | default('')) }}"
      when: not (rehearse | bool)

    - name: "CUTOVER: BOOTSTRAP openbao-0 by hand if bank-vaults didn't (single temp key, runs once)"
      kubernetes.core.k8s_exec:
        namespace: "{{ ns }}"
        pod: "{{ new }}-0"
        container: "{{ new }}"
        command: >
          sh -c "export VAULT_ADDR={{ bao_addr }};
                 bao operator init -key-shares=1 -key-threshold=1 -format=json"
      register: boot_init
      failed_when: >
        boot_init.rc != 0 and
        ('already initialized' not in ((boot_init.stdout | default('')) ~ (boot_init.stderr | default(''))))
      no_log: true
      when:
        - not (rehearse | bool)
        - not (openbao_initialized | bool)

    - name: "CUTOVER: parse the temp unseal key + root from the hand bootstrap (if it ran)"
      ansible.builtin.set_fact:
        boot_unseal: "{{ (boot_init.stdout | from_json).unseal_keys_b64[0] }}"
        boot_root: "{{ (boot_init.stdout | from_json).root_token }}"
      no_log: true
      when:
        - not (rehearse | bool)
        - boot_init is defined
        - "'unseal_keys_b64' in (boot_init.stdout | default(''))"

    - name: "CUTOVER: unseal openbao-0 with the temp bootstrap key"
      kubernetes.core.k8s_exec:
        namespace: "{{ ns }}"
        pod: "{{ new }}-0"
        container: "{{ new }}"
        command: >
          sh -c "export VAULT_ADDR={{ bao_addr }};
                 bao operator unseal '{{ boot_unseal }}'"
      register: boot_unseal_res
      failed_when: boot_unseal_res.rc != 0
      no_log: true
      when:
        - not (rehearse | bool)
        - boot_unseal is defined

    - name: "CUTOVER: confirm openbao-0 is initialized (via grace window or hand bootstrap)"
      kubernetes.core.k8s_exec:
        namespace: "{{ ns }}"
        pod: "{{ new }}-0"
        container: "{{ new }}"
        command: sh -c "wget -qO- '{{ bao_addr }}/v1/sys/health?{{ health_qs }}'"
      register: post_boot_health
      until: ('"initialized":true' in (post_boot_health.stdout | default('')))
      retries: 12
      delay: 5
      when: not (rehearse | bool)

    - name: "CUTOVER: copy the local snapshot back into openbao-0 (writable /vault/data, not RO /tmp)"
      kubernetes.core.k8s_cp:
        namespace: "{{ ns }}"
        pod: "{{ new }}-0"
        container: "{{ new }}"
        local_path: "{{ bdir }}/{{ old }}.snap"
        remote_path: "{{ restore_in_pod }}"
        state: to_pod
      when: not (rehearse | bool)

    - name: "CUTOVER: assert the snapshot actually landed in the pod (k8s_cp can truncate silently)"
      kubernetes.core.k8s_exec:
        namespace: "{{ ns }}"
        pod: "{{ new }}-0"
        container: "{{ new }}"
        command: sh -c "stat -c%s {{ restore_in_pod }}"
      register: in_pod_snap
      failed_when: (in_pod_snap.stdout | trim | int) < 1024
      when: not (rehearse | bool)

    - name: "CUTOVER: read the root the freshly-initialized cluster currently holds (kept secret name)"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        namespace: "{{ ns }}"
        name: "{{ unseal_secret_name }}"
      register: new_secret
      no_log: true
      when: not (rehearse | bool)

    # Which root authenticates against the empty cluster depends on WHO inited it: the hand bootstrap
    # (boot_root, temp) or bank-vaults (in the secret). Prefer boot_root when it was minted; else the
    # secret's root. This root only has to survive until the -force restore swaps the barrier back.
    - name: "CUTOVER: pick the root that authenticates against the freshly-initialized cluster"
      ansible.builtin.set_fact:
        cutover_root: "{{ boot_root if (boot_root is defined and (boot_root | length) > 0) else (new_secret.resources[0].data['vault-root'] | b64decode) }}"
      no_log: true
      when: not (rehearse | bool)

    - name: "CUTOVER: restore the snapshot (-force overwrites data + barrier keyring)"
      kubernetes.core.k8s_exec:
        namespace: "{{ ns }}"
        pod: "{{ new }}-0"
        container: "{{ new }}"
        command: >
          sh -c "export VAULT_ADDR={{ bao_addr }};
                 export VAULT_TOKEN='{{ cutover_root }}';
                 bao operator raft snapshot restore -force {{ restore_in_pod }}"
      register: restore
      failed_when: restore.rc != 0
      no_log: true
      when: not (rehearse | bool)

    # After -force restore the cluster is sealed with the OLD barrier key -> bank-vaults just
    # overwrote the secret with FRESH keys on init, so put the OLD shares back for auto-unseal.
    - name: "CUTOVER: restore the OLD Shamir shares + root into the unseal secret"
      kubernetes.core.k8s:
        state: patched
        api_version: v1
        kind: Secret
        name: "{{ unseal_secret_name }}"
        namespace: "{{ ns }}"
        definition:
          data: "{{ unseal_secret.resources[0].data }}"    # OLD shares captured in pre-flight
      no_log: true
      when: not (rehearse | bool)

    - name: "CUTOVER: restart openbao pods so bank-vaults auto-unseals with the OLD keys"
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: Pod
        name: "{{ new }}-{{ item }}"
        namespace: "{{ ns }}"
      loop: [0, 1, 2]
      when: not (rehearse | bool)

    - name: "CUTOVER: wait until openbao is unsealed with the old keys + data present"
      kubernetes.core.k8s_exec:
        namespace: "{{ ns }}"
        pod: "{{ new }}-0"
        container: "{{ new }}"
        command: sh -c "wget -qO- '{{ bao_addr }}/v1/sys/health?{{ health_qs }}'"
      register: unsealed
      until: ('"sealed":false' in (unsealed.stdout | default(''))) and ('"initialized":true' in (unsealed.stdout | default('')))
      retries: 60
      delay: 10
      when: not (rehearse | bool)

    - name: "CUTOVER: assert the OLD root token authenticates (proves the barrier came from the snapshot)"
      kubernetes.core.k8s_exec:
        namespace: "{{ ns }}"
        pod: "{{ new }}-0"
        container: "{{ new }}"
        command: >
          sh -c "export VAULT_ADDR={{ bao_addr }};
                 export VAULT_TOKEN='{{ root_token }}';
                 bao token lookup -format=json"
      register: root_ok
      until: root_ok.rc == 0 and '"id"' in (root_ok.stdout | default(''))
      retries: 12
      delay: 5
      no_log: true
      when: not (rehearse | bool)

    # =====================================================================
    # Phase 6 — VERIFY + RESUME
    # =====================================================================
    # Post-restore the barrier is the OLD one, so the OLD root token authenticates (the temp
    # root that bank-vaults minted for the empty cluster is gone with the restore).
    - name: "VERIFY: raft peers are openbao-0/1/2"
      kubernetes.core.k8s_exec:
        namespace: "{{ ns }}"
        pod: "{{ new }}-0"
        container: "{{ new }}"
        command: >
          sh -c "export VAULT_ADDR={{ bao_addr }};
                 export VAULT_TOKEN='{{ root_token }}';
                 bao operator raft list-peers"
      register: peers
      until: (new ~ '-0') in (peers.stdout | default('')) and (new ~ '-1') in (peers.stdout | default('')) and (new ~ '-2') in (peers.stdout | default(''))
      retries: 18
      delay: 10
      no_log: true
      when: not (rehearse | bool)

    - name: "VERIFY: secrets engines + policies + auth carried across"
      kubernetes.core.k8s_exec:
        namespace: "{{ ns }}"
        pod: "{{ new }}-0"
        container: "{{ new }}"
        command: >
          sh -c "export VAULT_ADDR={{ bao_addr }};
                 export VAULT_TOKEN='{{ root_token }}';
                 bao secrets list && bao policy list && bao auth list"
      register: data_check
      failed_when: >
        'operationtimecapsule' not in data_check.stdout or 'external-secrets' not in data_check.stdout or 'oidc' not in data_check.stdout
      no_log: true
      when: not (rehearse | bool)

    - name: "RESUME: scale external-secrets back up"
      kubernetes.core.k8s_scale:
        api_version: apps/v1
        kind: Deployment
        name: external-secrets
        namespace: "{{ ns }}"
        replicas: 1
      when: not (rehearse | bool)

    - name: "RESUME: ClusterSecretStores go Valid (external-secrets reconnects to openbao)"
      kubernetes.core.k8s_info:
        api_version: external-secrets.io/v1
        kind: ClusterSecretStore
      register: css
      until: >
        (css.resources | selectattr('spec.provider.vault.server', 'search', new ~ '.' ~ ns) | list | length) ==
        (css.resources | selectattr('spec.provider.vault.server', 'search', new ~ '.' ~ ns)
          | selectattr('status.conditions', 'defined')
          | selectattr('status.conditions', 'search', 'Valid') | list | length)
      retries: 12
      delay: 10
      when: not (rehearse | bool)

    - name: "COMPLETE: summary"
      ansible.builtin.debug:
        msg:
          - "================================================="
          - "  Secret store renamed: {{ old }}-* -> {{ new }}-*"
          - "================================================="
          - "raft peers: {{ new }}-0/1/2 (unsealed with original keys)"
          - "backup kept at: {{ bdir }}  (snapshot + old unseal keys)"
          - "Old PVs vault-data-vault-0/1/2 are Released/Retained — delete ONLY after a multi-day soak."
          - "Residual by design: kind: Vault (bank-vaults CRD), domain {{ old }}.pcfae.com."
          - "================================================="
      when: not (rehearse | bool)
