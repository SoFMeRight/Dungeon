# Makes a host trust optcp's SSH CA (../tasks/ssh-ca-trust.yml): people's certificates for
# Boundary sessions and node-converge's per-run certificate, no stored key either way.
# Hosts come from --limit; k8s/provision-hosts.yml runs the same tasks on every Kubernetes
# node. One run per host, by hand, before its first session: a host trusts nothing until then.
- name: Ad Arbitorium 🔐 - GitOps - Services - Trust optcp's SSH CA
  become: true
  hosts: all
  tasks:
    - ansible.builtin.import_tasks: ../tasks/ssh-ca-trust.yml
  handlers:
    - name: Reload sshd
      ansible.builtin.systemd_service:
        name: ssh
        state: reloaded
