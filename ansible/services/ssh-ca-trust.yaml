# Makes a host trust optcp's SSH CA (../tasks/ssh-ca-trust.yml) so in-cluster automation
# (node-converge on the nodes, boundary-key-rotation on Boundary's targets) logs in with a
# certificate signed per run instead of a stored key. Hosts come from --limit;
# k8s/provision-hosts.yml runs the same tasks on every Kubernetes node. One run per host,
# by hand, before the automation's first: a host trusts nothing until this has run.
- name: Ad Arbitorium 🔐 - GitOps - Services - Trust optcp's SSH CA
  become: true
  hosts: all
  tasks:
    - ansible.builtin.import_tasks: ../tasks/ssh-ca-trust.yml
  handlers:
    - name: Reload sshd
      ansible.builtin.systemd_service:
        name: ssh
        state: reloaded
