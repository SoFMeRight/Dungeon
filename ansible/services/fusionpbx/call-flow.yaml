        argv:
          - psql
          - "-h"
          - "{{ fusionpbx_db.host }}"
          - "-U"
          - "{{ fusionpbx_db.user }}"
          - "-d"
          - "{{ fusionpbx_db.name }}"
          - "-c"
          - >-
            INSERT INTO v_dialplans (dialplan_uuid, app_uuid, domain_uuid, dialplan_context, dialplan_name,
              dialplan_number, dialplan_order, dialplan_enabled, dialplan_continue, dialplan_xml, dialplan_description)
            SELECT gen_random_uuid(), '{{ fusionpbx_ivr_app_uuid }}', d.domain_uuid, '{{ fusionpbx_personal_domain }}',
              '{{ item.name }}', '{{ item.ext }}', '200', 'true', 'false',
              '<extension name="{{ item.name }}" continue="false" uuid="' || gen_random_uuid() || '">
              <condition field="destination_number" expression="^{{ item.ext }}$">
              <action application="answer" data=""/>
              <action application="sleep" data="500"/>
              <action application="playback" data="/var/lib/freeswitch/recordings/{{ fusionpbx_personal_domain }}/{{ item.prompt }}"/>
              <action application="set" data="skip_greeting=true"/>
              <action application="transfer" data="*99{{ item.vm }} XML {{ fusionpbx_personal_domain }}"/>
              </condition>
              </extension>',
              '{{ item.name }} (call-flow)'
            FROM v_domains d WHERE d.domain_name = '{{ fusionpbx_personal_domain }}'
              AND NOT EXISTS (SELECT 1 FROM v_dialplans x
                              WHERE x.domain_uuid = d.domain_uuid AND x.dialplan_number = '{{ item.ext }}');
      environment:
        PGPASSWORD: "{{ fusionpbx_db.password }}"
      loop: "{{ fusionpbx_personal_specials }}"
      loop_control:
        label: "{{ item.name }} ({{ item.ext }})"
      changed_when: "'INSERT 0 1' in stdout"
      notify: Reload FusionPBX dialplan
      no_log: true

    - name: FusionPBX | ensure personal ring-group departments (+ generated dialplan)
      ansible.builtin.command:
        argv:
          - psql
          - "-h"
          - "{{ fusionpbx_db.host }}"
          - "-U"
          - "{{ fusionpbx_db.user }}"
          - "-d"
          - "{{ fusionpbx_db.name }}"
          - "-c"
          - >-
            WITH d AS (SELECT domain_uuid FROM v_domains WHERE domain_name = '{{ fusionpbx_personal_domain }}'),
            ins_rg AS (
              INSERT INTO v_ring_groups (ring_group_uuid, domain_uuid, ring_group_name, ring_group_extension,
                ring_group_context, ring_group_call_timeout, ring_group_strategy, ring_group_timeout_app,
                ring_group_timeout_data, ring_group_exit_key, ring_group_cid_name_prefix, ring_group_ringback,
                ring_group_greeting, ring_group_enabled, ring_group_description, dialplan_uuid)
              SELECT gen_random_uuid(), d.domain_uuid, '{{ item.name }}', '{{ item.ext }}',
                '{{ fusionpbx_personal_domain }}', '{{ item.timeout }}', 'enterprise', 'transfer',
                '*98{{ item.vm }} XML {{ fusionpbx_personal_domain }}', '*', '{{ item.prefix }}', '${us-ring}',
                '{{ fusionpbx_personal_ring_notice }}', 'true', '{{ item.name }} (call-flow)', gen_random_uuid()
              FROM d
              WHERE NOT EXISTS (SELECT 1 FROM v_ring_groups r
                               WHERE r.domain_uuid = d.domain_uuid AND r.ring_group_extension = '{{ item.ext }}')
              RETURNING ring_group_uuid, dialplan_uuid, domain_uuid),
            ins_dest AS (
              INSERT INTO v_ring_group_destinations (ring_group_destination_uuid, domain_uuid, ring_group_uuid,
                destination_number, destination_delay, destination_timeout, destination_enabled)
              SELECT gen_random_uuid(), ins_rg.domain_uuid, ins_rg.ring_group_uuid, m.num, '0',
                '{{ item.timeout }}', 'true'
              FROM ins_rg, (VALUES {% for mem in item.members %}('{{ mem }}'){% if not loop.last %}, {% endif %}{% endfor %}) AS m(num))
            INSERT INTO v_dialplans (dialplan_uuid, domain_uuid, app_uuid, dialplan_name, dialplan_number,
              dialplan_context, dialplan_continue, dialplan_xml, dialplan_order, dialplan_enabled, dialplan_description)
            SELECT ins_rg.dialplan_uuid, ins_rg.domain_uuid, '{{ fusionpbx_ring_groups_app_uuid }}', '{{ item.name }}',
              '{{ item.ext }}', '{{ fusionpbx_personal_domain }}', 'false',
              '<extension name="{{ item.name }}" continue="" uuid="' || ins_rg.dialplan_uuid || '">
              <condition field="destination_number" expression="^{{ item.ext }}$">
              <action application="ring_ready" data=""/>
              <action application="set" data="ring_group_uuid=' || ins_rg.ring_group_uuid || '"/>
              <action application="set" data="record_stereo=true"/>
              <action application="lua" data="app.lua ring_groups"/>
              </condition>
              </extension>',
              '101', 'true', '{{ item.name }} (call-flow)'
            FROM ins_rg;
      environment:
        PGPASSWORD: "{{ fusionpbx_db.password }}"
      loop: "{{ fusionpbx_personal_departments }}"
      loop_control:
        label: "{{ item.name }} ({{ item.ext }})"
      changed_when: "'INSERT 0 1' in stdout"
      notify: Reload FusionPBX dialplan
      no_log: true

    - name: FusionPBX | ensure personal IVR menus (+ generated dialplan)
      ansible.builtin.command:
        argv:
          - psql
          - "-h"
          - "{{ fusionpbx_db.host }}"
          - "-U"
          - "{{ fusionpbx_db.user }}"
          - "-d"
          - "{{ fusionpbx_db.name }}"
          - "-c"
          - >-
            WITH d AS (SELECT domain_uuid FROM v_domains WHERE domain_name = '{{ fusionpbx_personal_domain }}'),
            ins AS (
              INSERT INTO v_ivr_menus (ivr_menu_uuid, domain_uuid, dialplan_uuid, ivr_menu_name, ivr_menu_extension,
                ivr_menu_parent_uuid, ivr_menu_language, ivr_menu_dialect, ivr_menu_voice, ivr_menu_greet_long,
                ivr_menu_timeout, ivr_menu_inter_digit_timeout, ivr_menu_max_failures, ivr_menu_max_timeouts,
                ivr_menu_digit_len, ivr_menu_direct_dial, ivr_menu_exit_app, ivr_menu_exit_data,
                ivr_menu_context, ivr_menu_enabled, ivr_menu_description)
              SELECT gen_random_uuid(), d.domain_uuid, gen_random_uuid(), '{{ item.name }}', '{{ item.ext }}',
                NULL,
                'en', 'us', 'callie', '{{ item.greet }}', '5000', '2000', '{{ item.loops }}', '1', '5', 'false',
                'transfer', '{{ fusionpbx_personal_bail_ext }} XML {{ fusionpbx_personal_domain }}', '{{ fusionpbx_personal_domain }}',
                'true', '{{ item.name }} (call-flow)'
              FROM d
              WHERE NOT EXISTS (SELECT 1 FROM v_ivr_menus m WHERE m.domain_uuid = d.domain_uuid AND m.ivr_menu_extension = '{{ item.ext }}')
              RETURNING ivr_menu_uuid, dialplan_uuid, domain_uuid)
            INSERT INTO v_dialplans (dialplan_uuid, domain_uuid, app_uuid, dialplan_name, dialplan_number,
              dialplan_context, dialplan_continue, dialplan_xml, dialplan_order, dialplan_enabled, dialplan_description)
            SELECT ins.dialplan_uuid, ins.domain_uuid, '{{ fusionpbx_ivr_app_uuid }}', '{{ item.name }}', '{{ item.ext }}',
              '{{ fusionpbx_personal_domain }}', 'false',
              '<extension name="{{ item.name }}" continue="false" uuid="' || ins.dialplan_uuid || '">
              <condition field="destination_number" expression="^{{ item.ext }}$">
              <action application="ring_ready" data=""/>
              <action application="answer" data=""/>
              <action application="sleep" data="1000"/>
              <action application="set" data="hangup_after_bridge=true"/>
              {% if item.preamble %}<action application="playback" data="/var/lib/freeswitch/recordings/{{ fusionpbx_personal_domain }}/{{ item.preamble }}"/>{% endif %}
              <action application="set" data="ivr_menu_uuid=' || ins.ivr_menu_uuid || '"/>
              <action application="lua" data="ivr_menu.lua"/>
              <action application="transfer" data="{{ fusionpbx_personal_bail_ext }} XML {{ fusionpbx_personal_domain }}"/>
              </condition>
              </extension>',
              '100', 'true', '{{ item.name }} (call-flow)'
            FROM ins;
      environment:
        PGPASSWORD: "{{ fusionpbx_db.password }}"
      loop: "{{ fusionpbx_personal_ivr_menus }}"
      loop_control:
        label: "{{ item.name }} ({{ item.ext }})"
      changed_when: "'INSERT 0 1' in stdout"
      notify: Reload FusionPBX dialplan
      no_log: true

    - name: FusionPBX | ensure personal IVR menu options
      ansible.builtin.command:
        argv:
          - psql
          - "-h"
          - "{{ fusionpbx_db.host }}"
          - "-U"
          - "{{ fusionpbx_db.user }}"
          - "-d"
          - "{{ fusionpbx_db.name }}"
          - "-c"
          - >-
            INSERT INTO v_ivr_menu_options (ivr_menu_option_uuid, ivr_menu_uuid, domain_uuid,
              ivr_menu_option_digits, ivr_menu_option_action, ivr_menu_option_param,
              ivr_menu_option_order, ivr_menu_option_enabled, ivr_menu_option_description)
            SELECT gen_random_uuid(), m.ivr_menu_uuid, m.domain_uuid, '{{ item.d }}', 'menu-exec-app',
              '{{ item.p }}', '{{ item.ord }}', 'true', '{{ item.desc }}'
            FROM v_ivr_menus m
            WHERE m.domain_uuid = (SELECT domain_uuid FROM v_domains WHERE domain_name = '{{ fusionpbx_personal_domain }}')
              AND m.ivr_menu_extension = '{{ item.menu }}'
              AND NOT EXISTS (SELECT 1 FROM v_ivr_menu_options o
                              WHERE o.ivr_menu_uuid = m.ivr_menu_uuid AND o.ivr_menu_option_digits = '{{ item.d }}');
      environment:
        PGPASSWORD: "{{ fusionpbx_db.password }}"
      loop: "{{ fusionpbx_personal_ivr_options }}"
      loop_control:
        label: "{{ item.menu }} / {{ item.d }}"
      changed_when: "'INSERT 0 1' in stdout"
      notify: Reload FusionPBX dialplan
      no_log: true

    - name: FusionPBX | ensure personal hours time condition
      ansible.builtin.command:
        argv:
          - psql
          - "-h"
          - "{{ fusionpbx_db.host }}"
          - "-U"
          - "{{ fusionpbx_db.user }}"
          - "-d"
          - "{{ fusionpbx_db.name }}"
          - "-c"
          - >-
            INSERT INTO v_dialplans (dialplan_uuid, domain_uuid, app_uuid, dialplan_name, dialplan_number,
              dialplan_context, dialplan_continue, dialplan_xml, dialplan_order, dialplan_enabled, dialplan_description)
            SELECT gen_random_uuid(), d.domain_uuid, '{{ fusionpbx_time_conditions_app_uuid }}',
              '{{ fusionpbx_personal_time_condition.name }}', '{{ fusionpbx_personal_time_condition.ext }}',
              '{{ fusionpbx_personal_domain }}', 'false',
              '<extension name="{{ fusionpbx_personal_time_condition.name }}" continue="false" uuid="' || gen_random_uuid() || '">
              <condition field="destination_number" expression="^{{ fusionpbx_personal_time_condition.ext }}$" break="on-false"/>
              <condition hour="{{ fusionpbx_personal_time_condition.hour }}">
              <action application="transfer" data="{{ fusionpbx_personal_time_condition.open }} XML {{ fusionpbx_personal_domain }}"/>
              <anti-action application="transfer" data="{{ fusionpbx_personal_time_condition.closed }} XML {{ fusionpbx_personal_domain }}"/>
              </condition>
              </extension>',
              '90', 'true', 'Kai hours time condition (call-flow)'
            FROM v_domains d WHERE d.domain_name = '{{ fusionpbx_personal_domain }}'
              AND NOT EXISTS (SELECT 1 FROM v_dialplans dp
                              WHERE dp.domain_uuid = d.domain_uuid AND dp.dialplan_number = '{{ fusionpbx_personal_time_condition.ext }}');
      environment:
        PGPASSWORD: "{{ fusionpbx_db.password }}"
      changed_when: "'INSERT 0 1' in stdout"
      notify: Reload FusionPBX dialplan
      no_log: true

    # -------------------------------------------------------------------------
    # Go-live cutover: repoint the business DID's inbound route from the agent
    # extension to the time condition, and turn on inbound recording for the agent
    # (the disclaimer plays first at the IVR). Both UPDATEs are idempotent — the
    # replace only matches while the route still points at the agent extension.
    # NOTE: for two-way trunk audio the inbound trunk must land on the *external*
    # SIP profile (pfSense must forward the trunk's SIP + its Contact/ACK path to
    # 10.30.1.69:5080) — that is firewall config, not codifiable here.
    # -------------------------------------------------------------------------
    - name: FusionPBX | go-live — cut the business DID to the flow + record inbound on the agent
      ansible.builtin.command:
        argv:
          - psql
          - "-h"
          - "{{ fusionpbx_db.host }}"
          - "-U"
          - "{{ fusionpbx_db.user }}"
          - "-d"
          - "{{ fusionpbx_db.name }}"
          - "-c"
          - >-
            UPDATE v_dialplans SET dialplan_xml = replace(dialplan_xml,
              '"{{ fusionpbx_business_agent_ext }} XML {{ fusionpbx_business_domain }}"',
              '"{{ fusionpbx_business_time_condition.ext }} XML {{ fusionpbx_business_domain }}"')
            WHERE dialplan_number = '{{ fusionpbx_business_did }}' AND dialplan_context = 'public';
            UPDATE v_extensions SET user_record = 'inbound'
            WHERE extension = '{{ fusionpbx_business_agent_ext }}'
              AND domain_uuid = (SELECT domain_uuid FROM v_domains WHERE domain_name = '{{ fusionpbx_business_domain }}');
      environment:
        PGPASSWORD: "{{ fusionpbx_db.password }}"
      changed_when: false
      notify: Reload FusionPBX dialplan
      no_log: true

  handlers:

    # FusionPBX's own generator: runs every app_defaults.php across all domains
    # (add-only), creating the default dialplans/settings for a newly-inserted
    # domain. Flush the file cache THEN reloadxml — reloadxml alone re-reads
    # FreeSWITCH's in-memory XML but does NOT rebuild FusionPBX's /var/cache
    # files, so stale cached dialplans/config keep being served.
    - name: Populate FusionPBX domain defaults
      ansible.builtin.shell: >-
        cd /var/www/fusionpbx &&
        sudo -u www-data php core/upgrade/upgrade_domains.php >/dev/null 2>&1 ;
        rm -f /var/cache/fusionpbx/* ;
        fs_cli -x 'reloadxml' >/dev/null 2>&1

    # Refresh dialplan + directory so new ring groups / extensions are served.
    # MUST flush /var/cache/fusionpbx first — reloadxml does not rebuild it, and a
    # stale cached dialplan.<domain> will hide newly-created ring-group extensions.
    - name: Reload FusionPBX dialplan
      ansible.builtin.shell: >-
        rm -f /var/cache/fusionpbx/* ;
        fs_cli -x 'reloadxml' >/dev/null 2>&1
      changed_when: false
