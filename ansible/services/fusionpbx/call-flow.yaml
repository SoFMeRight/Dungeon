          - "{{ fusionpbx_db.host }}"
          - "-U"
          - "{{ fusionpbx_db.user }}"
          - "-d"
          - "{{ fusionpbx_db.name }}"
          - "-c"
          - >-
            INSERT INTO v_dialplans (dialplan_uuid, app_uuid, domain_uuid, dialplan_context, dialplan_name,
              dialplan_number, dialplan_order, dialplan_enabled, dialplan_continue, dialplan_xml, dialplan_description)
            SELECT gen_random_uuid(), src.app_uuid, d.domain_uuid, '{{ fusionpbx_personal_domain }}', src.dialplan_name,
              src.dialplan_number, src.dialplan_order, 'true', src.dialplan_continue, src.dialplan_xml,
              'Outbound BulkVS (call-flow)'
            FROM v_domains d,
              (SELECT app_uuid, dialplan_name, dialplan_number, dialplan_order, dialplan_continue, dialplan_xml
               FROM v_dialplans WHERE dialplan_context = '{{ fusionpbx_business_domain }}'
                 AND dialplan_name = 'sip.bulkvs.com.10-11-NANP' LIMIT 1) src
            WHERE d.domain_name = '{{ fusionpbx_personal_domain }}'
              AND NOT EXISTS (SELECT 1 FROM v_dialplans x
                              WHERE x.dialplan_context = '{{ fusionpbx_personal_domain }}'
                                AND x.dialplan_name = 'sip.bulkvs.com.10-11-NANP');
      environment:
        PGPASSWORD: "{{ fusionpbx_db.password }}"
      changed_when: "'INSERT 0 1' in stdout"
      notify: Reload FusionPBX dialplan
      no_log: true

    - name: FusionPBX | set the personal agent's outbound caller ID (owned DID for the cell leg)
