# Installs the Wazuh agent and enrolls it into its tenant group. Hosts come from --limit
# (StageFreight's playbook `groups`); each must have `wazuh_tenant` in group_vars.
# Enrolling a host for the first time needs the authd password, given at launch:
#   -e wazuh_enrollment_password=...   (OpenBao zeldas-letter apps/wazuh ENROLLMENT_PASSWORD)
# Hosts that are already enrolled converge without it.
- name: Ad Arbitorium 🔐 - GitOps - Services - Install and enroll the Wazuh agent
  become: true
  hosts: all
  vars_files:
    - ../vars/wazuh-agent.yml

  pre_tasks:
    - name: Refuse hosts without a declared tenant
      ansible.builtin.assert:
        that: wazuh_tenant is defined and wazuh_tenant | length > 0
        fail_msg: "{{ inventory_hostname }} has no wazuh_tenant in group_vars"

    - name: Read whether the agent is already enrolled
      ansible.builtin.stat:
        path: /var/ossec/etc/client.keys
      register: client_keys

    - name: Require the enrollment password for hosts not yet enrolled
      ansible.builtin.assert:
        that: wazuh_enrollment_password is defined and wazuh_enrollment_password | length > 0
        fail_msg: "{{ inventory_hostname }} is not enrolled; pass -e wazuh_enrollment_password=..."
      when: not (client_keys.stat.exists and client_keys.stat.size > 0)

  tasks:
    - name: Install apt prerequisites
      ansible.builtin.apt:
        name: [gnupg, apt-transport-https, curl]
        state: present
        update_cache: true
        cache_valid_time: 3600
      timeout: "{{ wazuh_apt_timeout }}"

    - name: Fetch the Wazuh signing key
      ansible.builtin.get_url:
        url: "{{ wazuh_apt_key }}"
        dest: /usr/share/keyrings/wazuh.asc
        mode: "0644"

    - name: Add the Wazuh apt repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/wazuh.asc] {{ wazuh_apt_repo }} stable main"
        filename: wazuh
        state: present
      timeout: "{{ wazuh_apt_timeout }}"

    - name: Install the agent at the manager's version
      ansible.builtin.apt:
        name: "wazuh-agent={{ wazuh_agent_version }}"
        state: present
        allow_downgrade: false
        update_cache: true
        cache_valid_time: 3600
      timeout: "{{ wazuh_apt_timeout }}"

    # The manager drives agent upgrades; an unattended apt upgrade must not move the agent
    # past it.
    - name: Hold the agent package
      ansible.builtin.dpkg_selections:
        name: wazuh-agent
        selection: hold

    - name: Install the enrollment password
      ansible.builtin.copy:
        content: "{{ wazuh_enrollment_password }}"
        dest: /var/ossec/etc/authd.pass
        owner: root
        group: wazuh
        mode: "0640"
      no_log: true
      when: wazuh_enrollment_password is defined
      notify: Restart wazuh-agent

    - name: Install the manager's CA, so enrollment verifies the manager's certificate
      ansible.builtin.copy:
        src: "{{ wazuh_manager_ca_file }}"
        dest: /var/ossec/etc/manager-ca.pem
        owner: root
        group: wazuh
        mode: "0644"
      notify: Restart wazuh-agent

    - name: Point the agent at the manager and enroll it into its tenant group
      ansible.builtin.replace:
        path: /var/ossec/etc/ossec.conf
        regexp: '<client>[\s\S]*?</client>'
        replace: |-
          <client>
              <server>
                <address>{{ wazuh_manager }}</address>
                <port>1514</port>
                <protocol>tcp</protocol>
              </server>
              <notify_time>10</notify_time>
              <time-reconnect>60</time-reconnect>
              <auto_restart>yes</auto_restart>
              <crypto_method>aes</crypto_method>
              <enrollment>
                <enabled>yes</enabled>
                <manager_address>{{ wazuh_manager }}</manager_address>
                <port>1515</port>
                <agent_name>{{ ansible_facts['hostname'] }}</agent_name>
                <groups>{{ wazuh_tenant }}</groups>
                <server_ca_path>/var/ossec/etc/manager-ca.pem</server_ca_path>
                <authorization_pass_path>etc/authd.pass</authorization_pass_path>
              </enrollment>
            </client>
      notify: Restart wazuh-agent

    - name: Enable and start the agent
      ansible.builtin.systemd_service:
        name: wazuh-agent
        enabled: true
        state: started

    - name: Apply pending configuration changes
      ansible.builtin.meta: flush_handlers

    - name: Wait until the agent is enrolled and connected
      ansible.builtin.command: grep -q "^status='connected'" /var/ossec/var/run/wazuh-agentd.state
      register: agent_state
      until: agent_state.rc == 0
      retries: 12
      delay: 10
      changed_when: false

  handlers:
    - name: Restart wazuh-agent
      ansible.builtin.systemd_service:
        name: wazuh-agent
        state: restarted
