# Rotates the SSH key Boundary brokers for each target host (dungeon-scratchpad
# dev/boundary/Boundary_Decisions.md). Per host, per run: a new ed25519 pair on the
# controller; the public half added to the host's authorized_keys, usable only from the
# Boundary workers' addresses and only for a shell; the pair written to OpenBao at
# <mount>/<path>/<host> (SSH_USERNAME, SSH_PRIVATE_KEY, SSH_PUBLIC_KEY), where Boundary's
# credential library reads it; then every earlier entry of this play's removed. That order
# never leaves a moment without a working key; a run that fails part-way leaves the old key
# working. Keys this play did not place (no "boundary:<host>" comment) are untouched.
#
# Intent comes in as variables (the boundary-key-rotation CronJob's env):
#   boundary_targets       inventory group of the target hosts     (default boundary_targets)
#   boundary_worker_group  inventory group of the Boundary workers (default k8s_worker)
#   boundary_secret_mount  OpenBao KV mount                        (default optcp)
#   boundary_secret_path   entry prefix under the mount            (default apps/boundary/targets)
# OpenBao is VAULT_ADDR and VAULT_TOKEN in the environment: a token whose policy writes the
# targets entries and nothing else. The CronJob runs it daily; run it by hand to re-key a host now.
- name: Ad Arbitorium 🔐 - GitOps - Services - Rotate Boundary's SSH key per target
  hosts: "{{ boundary_targets | default('boundary_targets') }}"
  vars:
    boundary_worker_group: k8s_worker
    boundary_secret_mount: optcp
    boundary_secret_path: apps/boundary/targets
    boundary_openbao_url: "{{ lookup('ansible.builtin.env', 'VAULT_ADDR') }}"
    boundary_key_tag: "boundary:{{ inventory_hostname }}"
    boundary_key_options: >-
      from="{{ groups[boundary_worker_group] | map('extract', hostvars, 'ansible_host') | join(',') }}",no-port-forwarding,no-agent-forwarding,no-X11-forwarding

  pre_tasks:
    - name: Refuse to run without OpenBao
      ansible.builtin.assert:
        that:
          - boundary_openbao_url | length > 0
          - lookup('ansible.builtin.env', 'VAULT_TOKEN') | length > 0
        fail_msg: VAULT_ADDR and VAULT_TOKEN must be set
        quiet: true

    - name: Refuse a worker group with no addresses
      ansible.builtin.assert:
        that: groups[boundary_worker_group] | map('extract', hostvars, 'ansible_host') | select('defined') | length > 0
        fail_msg: "inventory group {{ boundary_worker_group }} has no hosts with ansible_host"
        quiet: true

  tasks:
    - name: Make a working directory on the controller
      ansible.builtin.tempfile:
        state: directory
        suffix: -boundary-key
      delegate_to: localhost
      register: keydir
      changed_when: false

    - name: Rotate the key
      block:
        - name: Generate the key pair
          ansible.builtin.command: ssh-keygen -q -t ed25519 -N "" -C "{{ boundary_key_tag }}" -f "{{ keydir.path }}/id"
          delegate_to: localhost
          changed_when: false

        - name: Read the key pair
          ansible.builtin.slurp:
            path: "{{ keydir.path }}/{{ item }}"
          loop:
            - id
            - id.pub
          delegate_to: localhost
          register: keyfiles
          no_log: true

        - name: Keep the pair in memory only
          ansible.builtin.set_fact:
            boundary_private_key: "{{ keyfiles.results[0].content | b64decode }}"
            boundary_public_key: "{{ (keyfiles.results[1].content | b64decode) | trim }}"
          no_log: true

        - name: Allow the new key, from the Boundary workers only
          ansible.posix.authorized_key:
            user: "{{ ansible_user_id }}"
            key: "{{ boundary_public_key }}"
            key_options: "{{ boundary_key_options }}"
            comment: "{{ boundary_key_tag }}"
            state: present

        - name: Store the pair in OpenBao
          ansible.builtin.uri:
            url: "{{ boundary_openbao_url }}/v1/{{ boundary_secret_mount }}/data/{{ boundary_secret_path }}/{{ inventory_hostname }}"
            method: POST
            headers:
              X-Vault-Token: "{{ lookup('ansible.builtin.env', 'VAULT_TOKEN') }}"
            body_format: json
            body:
              data:
                SSH_USERNAME: "{{ ansible_user_id }}"
                SSH_PRIVATE_KEY: "{{ boundary_private_key }}"
                SSH_PUBLIC_KEY: "{{ boundary_public_key }}"
            status_code: [200]
          delegate_to: localhost
          changed_when: true
          no_log: true

        - name: Remove this play's earlier keys
          ansible.builtin.lineinfile:
            path: "{{ ansible_user_dir }}/.ssh/authorized_keys"
            regexp: '^(?!.*{{ boundary_public_key.split(" ")[1] | regex_escape }}).*\s{{ boundary_key_tag | regex_escape }}$'
            state: absent
      always:
        - name: Remove the working directory
          ansible.builtin.file:
            path: "{{ keydir.path }}"
            state: absent
          delegate_to: localhost
          changed_when: false
