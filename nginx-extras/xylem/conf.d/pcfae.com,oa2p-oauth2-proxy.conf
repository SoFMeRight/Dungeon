server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name oa2p.pcfae.com;

  ssl_certificate     /etc/letsencrypt/live/pcfae.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/pcfae.com/privkey.pem;
  ssl_trusted_certificate /etc/letsencrypt/live/pcfae.com/chain.pem;

  ssl_protocols             TLSv1.2 TLSv1.3;

  ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA384';
  ssl_prefer_server_ciphers on;
  ssl_session_cache         shared:SSL:50m;
  ssl_session_timeout       1d;

  # OCSP Stapling ---
  # fetch OCSP records from URL in ssl_certificate and cache them
  ssl_stapling on;
  ssl_stapling_verify on;
  ssl_dhparam /etc/nginx/ssl/dhparam.pem;

  # Handy: root redirects to the start page
  location = / { return 302 /oauth2/start; }

  # IMPORTANT: NO trailing slash → keeps the /oauth2/ prefix
  location /oauth2/ {
    proxy_http_version 1.1;
    proxy_buffering    off;
    proxy_read_timeout 300s;

    proxy_set_header Host                $host;
    proxy_set_header X-Real-IP           $remote_addr;
    proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host    $host;
    proxy_set_header X-Forwarded-Proto   https;

    proxy_pass http://moor.prplanit.internal:4180;
  }
}


server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name ittoolsp.pcfae.com;

  ssl_certificate     /etc/letsencrypt/live/pcfae.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/pcfae.com/privkey.pem;
  ssl_trusted_certificate /etc/letsencrypt/live/pcfae.com/chain.pem;

  ssl_protocols             TLSv1.2 TLSv1.3;

  ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA384';
  ssl_prefer_server_ciphers on;
  ssl_session_cache         shared:SSL:50m;
  ssl_session_timeout       1d;

  # OCSP Stapling ---
  # fetch OCSP records from URL in ssl_certificate and cache them
  ssl_stapling on;
  ssl_stapling_verify on;
  ssl_dhparam /etc/nginx/ssl/dhparam.pem;

  # Ask oauth2-proxy if user is allowed
  auth_request /_oauth2/auth;

  # Not logged in → go login (use /oauth2/sign_in if you want the chooser)
  error_page 401 =302 https://oa2p.pcfae.com/oauth2/start?rd=$scheme://$host$request_uri;

  # Optional: capture identity from oauth2-proxy
  auth_request_set $auth_user   $upstream_http_x_auth_request_user;
  auth_request_set $auth_email  $upstream_http_x_auth_request_email;

  # App proxy defaults
  proxy_http_version 1.1;
  proxy_buffering off;
  proxy_read_timeout 300s;
  proxy_set_header Host                $host;
  proxy_set_header X-Real-IP           $remote_addr;
  proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto   $scheme;
  proxy_set_header X-Forwarded-Host    $host;

  # Forward identity to backend (if needed)
  proxy_set_header X-Auth-User  $auth_user;
  proxy_set_header X-Auth-Email $auth_email;

  location / { proxy_pass http://the-lost-woods.prplanit.internal:9290; }

  # INTERNAL subrequest → oauth2-proxy on LAN (no CF/TLS issues)
  location = /_oauth2/auth {
    internal;
    proxy_pass http://moor.prplanit.internal:4180/oauth2/auth;

    # Headers oauth2-proxy expects for auth_request
    proxy_set_header X-Original-URI           $request_uri;
    proxy_set_header X-Original-Method        $request_method;
    proxy_set_header X-Auth-Request-Redirect  $scheme://$host$request_uri;
    proxy_set_header X-Real-IP                $remote_addr;
    proxy_set_header X-Forwarded-Proto        $scheme;
    proxy_set_header Host                     ittoolsp.pcfae.com;
  }
}
