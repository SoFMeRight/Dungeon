# Gitops badge stencils — a gitops repo's own domain badges: the estate it describes
# (ansible automation, kubernetes, flux, compose stacks, app inventory) plus its security
# posture. Scoped to gitops repos: compose AFTER stencils-base + stencils-status +
# stencils-pipeline. NOT part of the global catalog — a go/docker/site repo never renders
# these, so nothing here leaks onto the rest of the fleet.
stencils:
  ansible:           { render: shield, label: Ansible, message: automation, color: "#EE0000", logo: ansible, logo_color: white, link: ansible }
  kubernetes:        { render: shield, label: Kubernetes, message: k8s, color: "#326CE5", logo: kubernetes, logo_color: white, link: fluxcd }
  fluxcd:            { render: shield, label: FluxCD, message: gitops, color: "#5468FF", logo: flux, logo_color: white, link: fluxcd }
  docker-compose:    { render: shield, label: Compose, message: stacks, color: "#2496ED", logo: docker, logo_color: white, link: docker }
  applications:      { render: shield, label: Applications, message: "{inventory.dungeon.count}", color: "#0F1689", logo: kubernetes, logo_color: white, link: "docs/Apps_&_Services-Overview.md" }
  cluster-inventory: { type: k8s-inventory, catalog: .stagefreight/catalog.yml }
  security:          { render: shield, label: Security, message: report, color: "#4B275F", link: "docs/container-security-audit.md" }
