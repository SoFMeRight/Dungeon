services:
  code-server:
    image: lscr.io/linuxserver/code-server:4.143.1-ls373
    container_name: code-server
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - PASSWORD=$USER_PASS # optional
      - HASHED_PASSWORD= # optional
      - SUDO_PASSWORD=$SUDO_PASS # optional
      - SUDO_PASSWORD_HASH= # optional
      - PROXY_DOMAIN=code-server.prplanit.internal # optional
      - DEFAULT_WORKSPACE=/config/workspace # optional
    volumes:
      - /opt/docker/code-server/config:/home/coder/.config
      - /opt/docker/code-server/project:/home/coder/.local
    ports:
      - 8088:8443
    restart: unless-stopped
    logging:
      driver: "loki"
      options:
        loki-batch-size: "400"
        loki-url: "http://monitoring:3100/loki/api/v1/push"
        max-size: "10m"
        max-file: "3"
        mode: "non-blocking"
        loki-retries: "2"
        loki-max-backoff: "800ms"
        loki-timeout: "1s"
