services:
  seaweedfs:
    container_name: seaweedfs
    # Every component runs in this one container today, but each is configured as
    # though it were on its own host: it binds all interfaces and advertises
    # ADVERTISE_IP rather than the container's own name. A container-internal
    # address is unreachable from anywhere else, so a second node added later
    # would be told to fetch from an address it cannot resolve.
    #
    # Ports default to the SeaweedFS defaults and are overridable in .env. Each
    # is passed to the server as well as published, so an override actually moves
    # the listener rather than mapping a host port onto an unchanged one.
    #
    # VOLUME_MAX is a count of volumes, not a size. Each bucket is its own
    # collection with its own volumes, so the ceiling has to cover every
    # collection, not just the stored bytes. Set it explicitly; left unset it is
    # derived from free space at startup. 1000 x 30GB is within the pool.
    # gRPC ports are set explicitly rather than left to SeaweedFS's HTTP+10000
    # derivation, so an overridden HTTP port cannot silently desync from the gRPC
    # port published beside it.
    command: >
      server -dir=/data -s3
      -ip=$ADVERTISE_IP
      -ip.bind=0.0.0.0
      -master.port=${MASTER_PORT:-9333}
      -master.port.grpc=${MASTER_GRPC_PORT:-19333}
      -master.peers=$ADVERTISE_IP:${MASTER_PORT:-9333}
      -volume.port=${VOLUME_PORT:-8080}
      -volume.port.grpc=${VOLUME_GRPC_PORT:-18080}
      -volume.publicUrl=$ADVERTISE_IP:${VOLUME_PORT:-8080}
      -volume.max=${VOLUME_MAX:-1000}
      -filer.port=${FILER_PORT:-8888}
      -filer.port.grpc=${FILER_GRPC_PORT:-18888}
      -s3.port=${S3_PORT:-8333}
      -s3.config=/etc/seaweedfs/s3.json
      -master.volumeSizeLimitMB=${VOLUME_SIZE_LIMIT_MB:-30000}
    configs:
      - source: s3_identities
        target: /etc/seaweedfs/s3.json
        mode: 0444
    image: chrislusf/seaweedfs:4.47        # pin a version; :latest works but pin it
    ports:
      - ${S3_PORT:-8333}:${S3_PORT:-8333}                 # S3 API — the only port an S3 client needs
      - ${MASTER_PORT:-9333}:${MASTER_PORT:-9333}         # master HTTP + admin API
      - ${MASTER_GRPC_PORT:-19333}:${MASTER_GRPC_PORT:-19333}   # master gRPC — volume servers, weed shell
      - ${VOLUME_PORT:-8080}:${VOLUME_PORT:-8080}         # volume HTTP — clients fetch object data here
      - ${VOLUME_GRPC_PORT:-18080}:${VOLUME_GRPC_PORT:-18080}
      - ${FILER_PORT:-8888}:${FILER_PORT:-8888}           # filer HTTP — S3 buckets live under /buckets
      - ${FILER_GRPC_PORT:-18888}:${FILER_GRPC_PORT:-18888}
    restart: always
    volumes:
      - $DATA_DIR:/data

# The identities live in the stack rather than as a bind-mount off a second
# dataset, so this is one artifact: nothing to place by hand before `up`, and no
# way for the compose file and the identity file it depends on to drift apart.
#
# LAYOUT — a CNPG archive gets its own bucket, named for the consumer, and the
# identity is scoped to that bucket rather than to a prefix inside a shared one:
#
#   prplanit-dungeon-cnpg-gitlab            gitlab CNPG archive
#   optcp-dungeon-cnpg-nextcloud            nextcloud CNPG archive
#
# Prefix scoping cannot work for these. A grant written "Read:bucket/prefix/*"
# matches only object paths under that prefix, and restore does not start with an
# object: barman-cloud-check-wal-archive calls HeadBucket first, which SeaweedFS
# authorises as Read against the bucket alone (s3api_server.go routes
# HeadBucketHandler with ACTION_READ; CanDo matches a non-wildcard action only
# against "<Action>:<bucket>"). A prefix grant can never match that, so every
# prefix-scoped identity could archive perfectly and never restore — which is how
# it stood until it was tried.
#
# Granting Read on a shared bucket to make HeadBucket pass would let each
# consumer read every other consumer's archive, so the bucket is the boundary
# instead. One bucket, one identity, no overlap to reason about.
#
# MIGRATION — each CNPG identity carries its old prefix grant as well as its new
# bucket grant, and the pairs are marked MIGRATION below. This is deliberate and
# temporary. The identity has to gain the new bucket before any cluster is pointed
# at it, and has to keep the old prefix until that cluster has actually moved;
# dropping both at once would stop all fourteen archiving at the same moment, with
# WAL then accumulating against max_slot_wal_keep_size on volumes as small as 4Gi.
# That is the failure that filled gatus.
#
# Remove every MIGRATION line once the last destinationPath points at a bucket,
# and redeploy. Until then an identity can reach its old prefix and its new
# bucket, and nothing else.
#
# The remaining prefix grants below are for consumers whose tools do not take
# this path, so they keep the tighter scope.
#
# One identity per consumer. None is Admin except the provisioner. Live data is a
# separate concern entirely — nextcloud and gitlab store objects on the
# in-cluster Ceph RGW, not here.
#
# Keys are interpolated, never written here. Note that `${...}` resolves from the
# stack environment (the Portainer stack's variables), NOT from env_file — that
# file only reaches the container's own environment.
#
# Requires Docker Compose v2.23+ for `configs.content`.
