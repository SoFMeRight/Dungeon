services:
  code-server:
    container_name: code-server
    env_file: code-server-secret.env
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      # - PASSWORD= # optional
      - HASHED_PASSWORD= # optional
      # - SUDO_PASSWORD= # optional
      - SUDO_PASSWORD_HASH= # optional
      - PROXY_DOMAIN=code-server.prplanit.internal # optional
      - DEFAULT_WORKSPACE=/config/workspace # optional
    image: lscr.io/linuxserver/code-server:latest
    ports:
      - 8088:8443
    restart: unless-stopped
    # labels: &logging
    #   labels-regex: "^.+"
    #   log_driver: "loki"
    #   log_opt:
    #     loki-batch-size:"400"
    #     loki-url:"http://localhost:3100/loki/api/v1/push"
    #     max-size:"10m"
    #     max-file:"3"
    volumes:
      - /opt/docker/code-server/config:/home/coder/.config
      - /opt/docker/code-server/project:/home/coder/.local
