apiVersion: apps/v1
kind: Deployment
metadata:
  name: osticket-app
spec:
  template:
    metadata:
      labels:
        policy.prplanit.com/ingress: "true"
        policy.prplanit.com/cap.mariadb: "true"
        policy.prplanit.com/access-scope-mariadb: hyrule-castle.osticket.mariadb
    spec:
      imagePullSecrets:
        - name: cr-pcfae-admin-pull-secret
      initContainers:
        - name: wait-for-db
          image: docker.io/busybox:1.38
      containers:
        - name: osticket
          image: ghcr.io/homelabhd/osticket:v0.0.1
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
