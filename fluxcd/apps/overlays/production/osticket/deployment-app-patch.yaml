apiVersion: apps/v1
kind: Deployment
metadata:
  name: osticket-app
spec:
  template:
    metadata:
      labels:
        policy.prplanit.com/ingress: "true"
        policy.prplanit.com/cap.mariadb: "true"
        policy.prplanit.com/access-scope-mariadb: hyrule-castle.osticket.mariadb
        policy.prplanit.com/cap.oidc: "true"
    spec:
      imagePullSecrets:
        - name: cr-pcfae-admin-pull-secret
      initContainers:
        - name: wait-for-db
          image: docker.io/busybox:1.38
      containers:
        - name: osticket
          # Digest-pinned to the v1.18.4 rebuild carrying the CrowdSec auth JSON emit +
          # nginx real_ip + entrypoint TRUSTED_PROXIES. Tag kept for readability/Renovate;
          # the digest forces the rollout to adopt this exact build (the tag alone wouldn't
          # re-pull a cached image). Renovate tracks digest updates as the tag is rebuilt.
          image: ghcr.io/homelabhd/osticket:v1.18.4@sha256:d115c1a73cafb790ca730e8805178c92484974ceab4f6109dd2a6c71b55e68f4
          env:
            # Trust the in-cluster mesh/gateway so nginx real_ip takes the client
            # from X-Real-Ip (injected by envoyfilter-osticket-realip-*) — makes
            # osTicket log the real client IP (access log, DB syslog, ticket IPs,
            # and the CrowdSec auth-failure JSON line) instead of the ztunnel peer.
            # Environment-specific CIDRs live here, never baked into the image.
            - name: TRUSTED_PROXIES
              value: "192.168.144.0/20 fc00:f1:0ca4:15a0::/56 169.254.0.0/16"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
