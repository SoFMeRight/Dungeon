apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: osticket
  namespace: prelude-of-light
  annotations:
    gatus.home-operations.com/endpoint: |
      group: "Business Apps (Hyrule Castle🏰)"
spec:
  parentRefs:
    - name: cell-membrane-gateway
      namespace: prelude-of-light
      sectionName: https-prplanit
  hostnames:
    - "support.prplanit.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: osticket-app
          # The Service publishes 8184; the xylem route already names it.
          port: 8184
