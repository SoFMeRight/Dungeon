apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: osticket-xylem
  annotations:
    gatus.home-operations.com/endpoint: |
      group: "Business Apps (Hyrule Castle🏰)"
spec:
  parentRefs:
    - name: xylem-gateway
      namespace: arylls-lookout
    - name: phloem-gateway
      namespace: prelude-of-light
  hostnames:
    - "support.pcfae.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: osticket-app
          port: 8184
