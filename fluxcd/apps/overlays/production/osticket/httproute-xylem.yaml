apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: osticket-xylem
  annotations:
    gatus.home-operations.com/endpoint: |
      group: "Business Apps (Hyrule Castle🏰)"
      conditions:
        - "[STATUS] == any(200, 302)"
        - "[BODY] != pat(*Support Ticket System Offline*)"
        - "[RESPONSE_TIME] < 5000"
spec:
  parentRefs:
    - name: phloem-gateway
      namespace: arylls-lookout
  hostnames:
    - "support.pcfae.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: osticket-app
          port: 8184
