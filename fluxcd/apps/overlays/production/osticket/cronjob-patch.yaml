apiVersion: batch/v1
kind: CronJob
metadata:
  name: osticket-cron
spec:
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            policy.prplanit.com/cap.mariadb: "true"
            policy.prplanit.com/access-scope-mariadb: prplanit-support.osticket.mariadb
        spec:
          imagePullSecrets:
            - name: cr-pcfae-admin-pull-secret
          initContainers:
            - name: wait-for-db
              image: docker.io/busybox:1.38
          containers:
            - name: osticket-cron
              image: ghcr.io/homelabhd/osticket:v1.18.4@sha256:616b159903ffc6ba4f59a66a36082222fb2efddf273900b3ad52c2f3dafd382e
