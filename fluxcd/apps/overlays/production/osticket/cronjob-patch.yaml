apiVersion: batch/v1
kind: CronJob
metadata:
  name: osticket-cron
spec:
  suspend: true
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            policy.prplanit.com/cap.mariadb: "true"
            policy.prplanit.com/access-scope-mariadb: prplanit-support.osticket.mariadb
        spec:
          imagePullSecrets:
            - name: cr-pcfae-admin-pull-secret
          initContainers:
            - name: wait-for-db
              image: docker.io/busybox:1.38
          containers:
            - name: osticket-cron
              image: ghcr.io/homelabhd/osticket:v1.18.4@sha256:a156cada6b9f6d2955b25c8a64bbe70ed1493473f6442d04796bd70e38cce257
