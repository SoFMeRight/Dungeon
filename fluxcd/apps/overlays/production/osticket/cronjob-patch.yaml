apiVersion: batch/v1
kind: CronJob
metadata:
  name: osticket-cron
spec:
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            policy.prplanit.com/cap.mariadb: "true"
            policy.prplanit.com/access-scope-mariadb: prplanit-support.osticket.mariadb
        spec:
          imagePullSecrets:
            - name: pull-secret-cr-optcp-optcp-k8s-dungeon-public
          initContainers:
            - name: wait-for-db
              image: docker.io/busybox:1.38
          containers:
            - name: osticket-cron
              image: ghcr.io/homelabhd/osticket:v1.18.4@sha256:1500d602a3ffa802db1eaa2f4ce16a9808b759748820ce9438d7c507218e1d6c
