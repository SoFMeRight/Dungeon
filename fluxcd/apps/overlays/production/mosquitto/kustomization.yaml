apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: arbitorium-home
resources:
  - ../../../base/mosquitto
# Held at zero for the volume re-bind into arbitorium-home.
replicas:
  - name: mosquitto
    count: 0

patches:
  - path: statefulset-patch.yaml
    target:
      kind: StatefulSet
      name: mosquitto
  - path: config-patch.yaml
    target:
      kind: ConfigMap
      name: mosquitto-config
