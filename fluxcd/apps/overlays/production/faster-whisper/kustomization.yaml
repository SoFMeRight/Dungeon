apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: optcp-ai
resources:
  - ../../../base/faster-whisper
# Held at zero for the volume re-bind into optcp-ai.
replicas:
  - name: faster-whisper
    count: 0

patches:
  - path: statefulset-patch.yaml
    target:
      kind: StatefulSet
      name: faster-whisper
