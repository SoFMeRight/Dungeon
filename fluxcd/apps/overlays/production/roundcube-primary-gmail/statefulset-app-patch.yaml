apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: roundcube-primary-gmail
spec:
  replicas: 1
  template:
    metadata:
      labels:
        policy.prplanit.com/ingress: "true"
    spec:
      securityContext:
        runAsUser: 82
        runAsGroup: 82
        fsGroup: 82
      containers:
        - name: roundcube
          image: docker.io/roundcube/roundcubemail:1.7.3-fpm-alpine-nonroot
          securityContext:
            readOnlyRootFilesystem: true
          env:
            - name: ROUNDCUBEMAIL_SKIN
              value: "elastic"
            - name: ROUNDCUBEMAIL_DEFAULT_HOST
              value: "ssl://imap.gmail.com"
            - name: ROUNDCUBEMAIL_DEFAULT_PORT
              value: "993"
            - name: ROUNDCUBEMAIL_SMTP_SERVER
              value: "tls://smtp.gmail.com"
            - name: ROUNDCUBEMAIL_SMTP_PORT
              value: "587"
          volumeMounts:
            - name: pedestal-of-time-roundcube-primary-gmail-html
              mountPath: /var/www/html
            - name: roundcube-tmp
              mountPath: /tmp
            - name: roundcube-run
              mountPath: /var/run
        - name: nginx
          image: docker.io/nginxinc/nginx-unprivileged:1.31-alpine
          securityContext:
            readOnlyRootFilesystem: true
          volumeMounts:
            - $patch: delete
              name: html
            - name: pedestal-of-time-roundcube-primary-gmail-html
              mountPath: /var/www/html
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: nginx-tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
      volumes:
        # readOnlyRootFilesystem: PHP-FPM run dir + nginx-unprivileged pid/cache; /tmp scratch.
        - name: roundcube-tmp
          emptyDir: {}
        - name: roundcube-run
          emptyDir: {}
        - name: nginx-tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: pedestal-of-time-roundcube-primary-gmail-html
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ceph-rbd-retain
        resources:
          requests:
            storage: 5Gi
