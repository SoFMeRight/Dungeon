apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: fairer-pages-xylem-pcfae-com-1
  namespace: tingle-tuner
  annotations:
    gatus.home-operations.com/endpoint: |
      group: "Tools & Utilities (Tingle Tuner🔧)"
    gatus.home-operations.com/enabled: "false"
spec:
  parentRefs:
    - name: xylem-gateway
      namespace: arylls-lookout
  hostnames:
    # Note: 16 hostnames max should be assigned to each "httproute-<name>-<#>.yaml"

    # pcfae.com
    - "code.pcfae.com"
    - "convertx.pcfae.com"
    - "cr.pcfae.com"
    - "crowdsec.pcfae.com"
    - "design.pcfae.com"
    - "dl.pcfae.com"
    - "dns.pcfae.com"
    - "dns2.pcfae.com"
    - "docker.cr.pcfae.com"
    - "draw.pcfae.com"
    - "emulatorjs.pcfae.com"
    - "flowy.pcfae.com"
    - "flux.pcfae.com"
    - "fotos.pcfae.com"
    - "ghcr.cr.pcfae.com"
    - "grafana.pcfae.com"
  rules:
    # Which playlist this domain's error pages draw from. The filter injects a fixed
    # playlist segment; rewriting it here keeps the choice with the domain. Drop this
    # rule and the domain falls back to whatever the filter asked for.
    - matches:
        - path:
            type: PathPrefix
            value: /fairer-pages/playlist/default/
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /fairer-pages/playlist/default/
      backendRefs:
        - name: fairer-pages
          port: 8023
    - matches:
        - path:
            type: PathPrefix
            value: /fairer-pages/
      backendRefs:
        - name: fairer-pages
          port: 8023
