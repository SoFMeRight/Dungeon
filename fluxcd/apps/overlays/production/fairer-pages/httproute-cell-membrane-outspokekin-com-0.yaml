apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: fairer-pages-cell-membrane-outspokekin-com-0
  namespace: tingle-tuner
  annotations:
    gatus.home-operations.com/endpoint: |
      group: "Tools & Utilities (Tingle Tuner🔧)"
    gatus.home-operations.com/enabled: "false"
spec:
  parentRefs:
    - name: cell-membrane-gateway
      namespace: hyrule-castle
  hostnames:
    # Note: 16 hostnames max should be assigned to each "httproute-<name>-<#>.yaml"

    # outspokekin.com
    - "outspokekin.com"
    - "*.outspokekin.com"
    - "chat.outspokekin.com"
    - "livekit.outspokekin.com"
    - "matrix-auth.outspokekin.com"
    - "matrix-call.outspokekin.com"
    - "matrix.outspokekin.com"
    - "social.outspokekin.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /fairer-pages/
      backendRefs:
        - name: fairer-pages
          port: 8023
