apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: fairer-pages-xylem-pcfae-com-4
  namespace: tingle-tuner
  annotations:
    gatus.home-operations.com/endpoint: |
      group: "Tools & Utilities (Tingle Tuner🔧)"
    gatus.home-operations.com/enabled: "false"
spec:
  parentRefs:
    - name: xylem-gateway
      namespace: arylls-lookout
  hostnames:
    # Note: 16 hostnames max should be assigned to each "httproute-<name>-<#>.yaml"

    # pcfae.com
    - "paperless.pcfae.com"
    - "pbx.pcfae.com"
    - "photos.pcfae.com"
    - "pinchflat.pcfae.com"
    - "podinfo.pcfae.com"
    - "prowlarr.pcfae.com"
    - "qbitt.pcfae.com"
    - "quay.cr.pcfae.com"
    - "radarr.pcfae.com"
    - "readarr.pcfae.com"
    - "recipes.pcfae.com"
    - "romm.pcfae.com"
    - "sabnzbd.pcfae.com"
    - "sdiff.pcfae.com"
    - "search.pcfae.com"
    - "sh.pcfae.com"
  rules:
    # Which playlist this domain's error pages draw from. The filter injects a fixed
    # playlist segment; rewriting it here keeps the choice with the domain. Drop this
    # rule and the domain falls back to whatever the filter asked for.
    - matches:
        - path:
            type: PathPrefix
            value: /fairer-pages/playlist/default/
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /fairer-pages/playlist/default/
      backendRefs:
        - name: fairer-pages
          port: 8023
    - matches:
        - path:
            type: PathPrefix
            value: /fairer-pages/
      backendRefs:
        - name: fairer-pages
          port: 8023
