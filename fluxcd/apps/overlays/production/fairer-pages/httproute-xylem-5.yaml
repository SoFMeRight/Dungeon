apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: fairer-pages-xylem-5
  namespace: tingle-tuner
  annotations:
    gatus.home-operations.com/endpoint: |
      group: "Tools & Utilities (Tingle Tuner🔧)"
    gatus.home-operations.com/enabled: "false"
spec:
  parentRefs:
    - name: xylem-gateway
      namespace: arylls-lookout
  hostnames:
    # Note: 16 hostnames max should be assigned to each "httproute-<name>-<#>.yaml"

    - "isptest.pcfae.com"
    - "speedtest.pcfae.com"
    - "speedtester.pcfae.com"
    - "support.pcfae.com"
    - "thelounge.pcfae.com"
    - "translate.pcfae.com"
    - "uptime.pcfae.com"
    - "vault.pcfae.com"
    - "siem.pcfae.com"
    - "web.pcfae.com"
    - "z2m.pcfae.com"
    # Container-registry mirror hosts. Listed EXACT (not the *.cr.pcfae.com wildcard)
    # so this route's /fairer-pages/ path beats the mirror's catch-all proxy route on
    # the same host (Gateway API ranks longest hostname, then longest path), letting
    # the gateway's themed-404 iframe load on the mirror instead of a bare 404.
    - "docker.cr.pcfae.com"
    - "ghcr.cr.pcfae.com"
    - "quay.cr.pcfae.com"
    - "lscr.cr.pcfae.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /fairer-pages/
      backendRefs:
        - name: fairer-pages
          port: 8023
