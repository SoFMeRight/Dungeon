apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: fairer-pages-xylem-pcfae-com-3
  namespace: tingle-tuner
  annotations:
    gatus.home-operations.com/endpoint: |
      group: "Tools & Utilities (Tingle Tuner🔧)"
    gatus.home-operations.com/enabled: "false"
spec:
  parentRefs:
    - name: xylem-gateway
      namespace: arylls-lookout
  hostnames:
    # Note: 16 hostnames max should be assigned to each "httproute-<name>-<#>.yaml"

    # pcfae.com
    - "links.pcfae.com"
    - "lscr.cr.pcfae.com"
    - "lubelogger.pcfae.com"
    - "mail.pcfae.com"
    - "mazanoke.pcfae.com"
    - "mimir.pcfae.com"
    - "monica.pcfae.com"
    - "netalertx.pcfae.com"
    - "netbox.pcfae.com"
    - "ntfy.pcfae.com"
    - "nut.pcfae.com"
    - "nvr.pcfae.com"
    - "nvr2.pcfae.com"
    - "oa2p.pcfae.com"
    - "ollama.pcfae.com"
    - "overseer.pcfae.com"
  rules:
    # Which playlist this domain's error pages draw from. The filter injects a fixed
    # playlist segment; rewriting it here keeps the choice with the domain. Drop this
    # rule and the domain falls back to whatever the filter asked for.
    - matches:
        - path:
            type: PathPrefix
            value: /fairer-pages/playlist/default/
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /fairer-pages/playlist/default/
      backendRefs:
        - name: fairer-pages
          port: 8023
    - matches:
        - path:
            type: PathPrefix
            value: /fairer-pages/
      backendRefs:
        - name: fairer-pages
          port: 8023
