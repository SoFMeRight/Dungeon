# Hostnames we terminate TLS for that no application routes. Envoy answers those with a
# LOCAL 404, which never passes through the error-handler filter — so without this they
# return an empty body to anyone whose DNS points here. Sending them to fairer-pages lets
# it serve its own error page, the same one every other 404 on these gateways gets.
#
# Deliberately a separate route from the per-domain ones: those list exact hostnames that
# real apps also claim, and adding a "/" rule there could out-rank an app on a tie.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: fairer-pages-apex-fallback-xylem
  namespace: tingle-tuner
  annotations:
    gatus.home-operations.com/enabled: "false"
spec:
  parentRefs:
    - name: xylem-gateway
      namespace: arylls-lookout
  hostnames:
    - "pcfae.com"
  rules:
    # A prefix match, so anything an app serves on these hosts by exact path still wins —
    # which is how outspokekin.com keeps answering /.well-known/matrix.
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: fairer-pages
          port: 8023
