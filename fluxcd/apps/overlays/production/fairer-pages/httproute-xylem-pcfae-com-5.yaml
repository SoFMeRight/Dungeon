apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: fairer-pages-xylem-pcfae-com-5
  namespace: tingle-tuner
  annotations:
    gatus.home-operations.com/endpoint: |
      group: "Tools & Utilities (Tingle Tuner🔧)"
    gatus.home-operations.com/enabled: "false"
spec:
  parentRefs:
    - name: xylem-gateway
      namespace: arylls-lookout
  hostnames:
    # Note: 16 hostnames max should be assigned to each "httproute-<name>-<#>.yaml"

    # pcfae.com
    - "shiplog.pcfae.com"
    - "shlink.pcfae.com"
    - "siem.pcfae.com"
    - "smkeygen.pcfae.com"
    - "sonarr.pcfae.com"
    - "speedtest.pcfae.com"
    - "speedtester.pcfae.com"
    - "support.pcfae.com"
    - "thelounge.pcfae.com"
    - "translate.pcfae.com"
    - "uptime.pcfae.com"
    - "vault.pcfae.com"
    - "web.pcfae.com"
    - "z2m.pcfae.com"
  rules:
    # Which playlist this domain's error pages draw from. The filter injects a fixed
    # playlist segment; rewriting it here keeps the choice with the domain. Drop this
    # rule and the domain falls back to whatever the filter asked for.
    - matches:
        - path:
            type: PathPrefix
            value: /fairer-pages/playlist/default/
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /fairer-pages/playlist/default/
      backendRefs:
        - name: fairer-pages
          port: 8023
    - matches:
        - path:
            type: PathPrefix
            value: /fairer-pages/
      backendRefs:
        - name: fairer-pages
          port: 8023
