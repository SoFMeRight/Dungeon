apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: fairer-pages-cell-membrane-prplanit-com-0
  namespace: tingle-tuner
  annotations:
    gatus.home-operations.com/endpoint: |
      group: "Tools & Utilities (Tingle Tuner🔧)"
    gatus.home-operations.com/enabled: "false"
spec:
  parentRefs:
    - name: cell-membrane-gateway
      namespace: hyrule-castle
  hostnames:
    # Note: 16 hostnames max should be assigned to each "httproute-<name>-<#>.yaml"

    # prplanit.com
    - "prplanit.com"
    - "*.prplanit.com"
    - "analytics.prplanit.com"
    - "apps.prplanit.com"
    - "cal.prplanit.com"
    - "dolibarr.prplanit.com"
    - "erpnext.prplanit.com"
    - "flwy.prplanit.com"
    - "form.prplanit.com"
    - "git.prplanit.com"
    - "invoiceninja.prplanit.com"
    - "netbird.prplanit.com"
    - "netbox.prplanit.com"
    - "ntfy.prplanit.com"
    - "orangehrm.prplanit.com"
    - "penpot.prplanit.com"
  rules:
    # Which playlist this domain's error pages draw from. The filter injects a fixed
    # playlist segment; rewriting it here keeps the choice with the domain. Drop this
    # rule and the domain falls back to whatever the filter asked for.
    - matches:
        - path:
            type: PathPrefix
            value: /fairer-pages/playlist/default/
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /fairer-pages/playlist/work/
      backendRefs:
        - name: fairer-pages
          port: 8023
    - matches:
        - path:
            type: PathPrefix
            value: /fairer-pages/
      backendRefs:
        - name: fairer-pages
          port: 8023
