# Apexes we own that nothing else routes yet. Without this they answer with a bare
# gateway 404 — or fail TLS outright where no listener exists — which is what a visitor
# sees if DNS is ever pointed straight at the gateway. Every path is rewritten to a
# fairer-pages error page so the domain reads as ours and unfinished, not broken.
#
# Routes that serve real content on these hostnames still win: an Exact path match
# outranks this prefix, which is how outspokekin.com keeps serving /.well-known/matrix.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: fairer-pages-apex-placeholder
  namespace: tingle-tuner
  annotations:
    gatus.home-operations.com/enabled: "false"
spec:
  parentRefs:
    - name: cell-membrane-gateway
      namespace: hyrule-castle
  hostnames:
    - "optcp.com"
    - "uni2.cc"
    - "prplanit.com"
    - "outspokekin.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /fairer-pages/playlist/random/404.html
      backendRefs:
        - name: fairer-pages
          port: 8023
