apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: romm-xylem
  annotations:
    gatus.home-operations.com/endpoint: |
      group: "Content & Media (Temple of Time🏛️)"
spec:
  parentRefs:
    - name: phloem-ingress-gateway
      namespace: optcp-ingress-internal
  hostnames:
    - "romm.pcfae.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: romm
          port: 7007
