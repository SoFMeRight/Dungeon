apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: romm-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-optcp
    kind: ClusterSecretStore
  target:
    name: romm-secrets
    creationPolicy: Owner
  data:
    - secretKey: db-user
      remoteRef:
        key: apps/romm/mariadb
        property: USER
    - secretKey: db-password
      remoteRef:
        key: apps/romm/mariadb
        property: PASSWORD
    - secretKey: mysql-root-password
      remoteRef:
        key: apps/romm/mariadb
        property: ROOT_PASSWORD
    - secretKey: auth-secret-key
      remoteRef:
        key: apps/romm/app
        property: AUTH_SECRET_KEY
    - secretKey: smb-username
      remoteRef:
        key: apps/romm/samba
        property: USERNAME
    - secretKey: smb-password
      remoteRef:
        key: apps/romm/samba
        property: PASSWORD
    - secretKey: oidc-client-id
      remoteRef:
        key: apps/romm/oidc
        property: CLIENT_ID
    - secretKey: oidc-client-secret
      remoteRef:
        key: apps/romm/oidc
        property: CLIENT_SECRET
