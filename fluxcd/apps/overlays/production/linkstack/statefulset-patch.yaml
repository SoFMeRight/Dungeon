apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: linkstack
spec:
  replicas: 1
  template:
    metadata:
      labels:
        policy.prplanit.com/ingress: "true"
        # Fetches OIDC discovery from sso.prplanit.com server-side, and split-horizon DNS
        # sends that back through the gateway, which refuses in-cluster callers without it.
        policy.prplanit.com/cap.oidc: "true"
    spec:
      imagePullSecrets:
        - name: cr-pcfae-admin-pull-secret
      securityContext:
        fsGroup: 101
      volumes:
        # NOTE: Apache config customization via ConfigMap
        # httpd.conf - main Apache config with port 8080 for HTTP
        # ssl.conf - SSL configuration (TLS terminated at gateway)
        - name: apache-config
          configMap:
            name: linkstack-apache-config
      initContainers:
        - name: init-htdocs
          # TEMPORARY: a dev tag pinned for OIDC testing only. Cut a stable release and
          # repin once single sign-on is confirmed working — a dev-<sha> tag is not a
          # version anyone can reason about later.
          image: docker.io/hlhd/linkstack:dev-e40e8a1
          env:
            # Bump with the image. Compared against a marker on the volume, so application
            # code is refreshed exactly once per image rather than on every start.
            - name: IMAGE_VERSION
              value: "dev-e40e8a1"
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              MARKER=/mnt/htdocs/.image-version

              # First run: volume is empty, seed the whole application.
              if [ ! -f /mnt/htdocs/index.php ]; then
                echo "Seeding htdocs from image ($IMAGE_VERSION)..."
                cp -a /htdocs/. /mnt/htdocs/
                printf '%s' "$IMAGE_VERSION" > "$MARKER"
                chown -R 100:101 /mnt/htdocs
                echo "Seeded $(find /mnt/htdocs -type f | wc -l) files"

              # Image changed: refresh code, leave what the instance owns alone. Code and
              # user data share this volume, so a blind re-copy would take the uploads and
              # configuration with it. Only the paths below are replaced — .env, storage,
              # themes, img, assets/img and backups are never touched.
              elif [ "$(cat "$MARKER" 2>/dev/null || echo none)" != "$IMAGE_VERSION" ]; then
                echo "Refreshing application code -> $IMAGE_VERSION"
                for d in app bootstrap config public resources routes vendor; do
                  [ -d "/htdocs/$d" ] || continue
                  rm -rf "/mnt/htdocs/$d"
                  cp -a "/htdocs/$d" /mnt/htdocs/
                done
                # assets/ mixes third-party libraries with user uploads, so only the vendor
                # subtree is replaced and assets/img is left alone. Livewire publishes its
                # javascript here — without it the admin tables load forever.
                if [ -d /htdocs/assets/vendor ]; then
                  rm -rf /mnt/htdocs/assets/vendor
                  mkdir -p /mnt/htdocs/assets
                  cp -a /htdocs/assets/vendor /mnt/htdocs/assets/
                fi
                for d in migrations seeders factories; do
                  [ -d "/htdocs/database/$d" ] || continue
                  rm -rf "/mnt/htdocs/database/$d"
                  cp -a "/htdocs/database/$d" /mnt/htdocs/database/
                done
                for f in artisan composer.json composer.lock; do
                  [ -f "/htdocs/$f" ] && cp -a "/htdocs/$f" /mnt/htdocs/ || true
                done
                printf '%s' "$IMAGE_VERSION" > "$MARKER"
                chown -R 100:101 /mnt/htdocs
                echo "Refreshed"

              else
                echo "htdocs already at $IMAGE_VERSION, nothing to do"
              fi
          volumeMounts:
            - name: kokiri-forest-linkstack-htdocs
              mountPath: /mnt/htdocs
      containers:
        - name: linkstack
          # TEMPORARY: a dev tag pinned for OIDC testing only. Cut a stable release and
          # repin once single sign-on is confirmed working — a dev-<sha> tag is not a
          # version anyone can reason about later.
          image: docker.io/hlhd/linkstack:dev-e40e8a1
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Etc/UTC"
            # Apache's canonical name only. A single vhost answers every apex; what makes
            # the other domains work is the per-request redirect derivation below.
            - name: HTTP_SERVER_NAME
              value: "bio.outspokekin.com"
            - name: LOG_LEVEL
              value: "info"
            # Log to stderr, not to a file on the volume. Alloy ships container output to
            # Loki, so a file channel is invisible there and accumulates on the PVC instead
            # — this instance had grown a 559MB laravel.log nothing was reading. Note the
            # image reuses LOG_LEVEL for Apache and Laravel reads the same variable, so the
            # two verbosities cannot be set independently without patching the entrypoint.
            - name: LOG_CHANNEL
              value: "stderr"
            - name: PHP_MEMORY_LIMIT
              value: "512M"
            - name: UPLOAD_MAX_FILESIZE
              value: "16M"
            # Laravel/LinkStack settings - override .env for infrastructure config
            # Fallback only: the OIDC redirect is derived per request, so APP_URL is what
            # non-request-scoped URL generation falls back to.
            - name: APP_URL
              value: "https://bio.outspokekin.com"
            - name: FORCE_HTTPS
              value: "true"
            # Single sign-on. Discovery-based, so only the issuer and client are declared;
            # OIDC_REDIRECT_URI is deliberately unset — leaving it unset is what lets one
            # instance serve every apex and return each visitor to the domain they arrived
            # on. Pinning it would collapse that to a single domain.
            # The login view gates the whole social block on this, compared against the
            # literal string "true"; the OIDC settings below are inert without it.
            - name: ENABLE_SOCIAL_LOGIN
              value: "true"
            # Presentation of the sign-in button, which reads "Sign in with <display name>".
            # An empty icon renders the button as text alone.
            - name: OIDC_DISPLAY_NAME
              value: "PrPlanIT SSO"
            - name: OIDC_ICON
              value: ""
            - name: OIDC_ISSUER
              value: "https://sso.prplanit.com"
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: linkstack-secrets
                  key: OIDC_CLIENT_ID
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: linkstack-secrets
                  key: OIDC_CLIENT_SECRET
            # Every apex this instance answers on. The OIDC callback is derived from the
            # incoming host, so an unlisted host is refused rather than trusted — which is
            # why all three belong here, not just the canonical one.
            - name: ALLOWED_HOSTS
              value: "bio.outspokekin.com,bio.sofmeright.com,bio.uni2.cc"
            # Organizr embeds this page, from the public apex and the internal one. Named
            # origins are what the browser checks against frame-ancestors; 'self' is kept
            # automatically. Embedding across sites also needs the session cookie to survive
            # a third-party context, which is SameSite=none — and a browser silently DROPS a
            # SameSite=none cookie that is not also Secure, so the two belong together.
            - name: ALLOWED_FRAME_ORIGINS
              value: "https://apps.prplanit.com,https://apps.pcfae.com"
            - name: SESSION_SAME_SITE
              value: "none"
            - name: SESSION_SECURE_COOKIE
              value: "true"
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          volumeMounts:
            - name: apache-config
              mountPath: /etc/apache2/httpd.conf
              subPath: httpd.conf
            - name: apache-config
              mountPath: /etc/apache2/conf.d/ssl.conf
              subPath: ssl.conf
            - name: kokiri-forest-linkstack-htdocs
              mountPath: /htdocs
  volumeClaimTemplates:
    - metadata:
        name: kokiri-forest-linkstack-htdocs
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: ceph-rbd
        resources:
          requests:
            storage: 5Gi
