apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: linkstack
  annotations:
    gatus.home-operations.com/endpoint: |
      group: "Personal Sites (Kokiri Forest🌿)"
spec:
  parentRefs:
    - name: cell-membrane-gateway
      namespace: hyrule-castle
  hostnames:
    - ls.sofmeright.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: linkstack
          port: 40323
