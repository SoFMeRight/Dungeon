releases:
  - name: flux
    repo: headlamp-k8s/plugins
    tag: "flux-{version}"
    asset: "headlamp-k8s-flux-{version}.tar.gz"
    # renovate: datasource=github-releases depName=headlamp-k8s/plugins extractVersion=^flux-(?<version>.+)$
    version: "0.7.0"
    verify: github-digest
    layout: tar
    strip: 1
    dest: /plugins/flux
  - name: cert-manager
    repo: headlamp-k8s/plugins
    tag: "cert-manager-{version}"
    asset: "headlamp-k8s-cert-manager-{version}.tar.gz"
    # renovate: datasource=github-releases depName=headlamp-k8s/plugins extractVersion=^cert-manager-(?<version>.+)$
    version: "0.1.1"
    verify: github-digest
    layout: tar
    strip: 1
    dest: /plugins/cert-manager
