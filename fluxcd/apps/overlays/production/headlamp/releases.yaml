    # renovate: datasource=github-releases depName=headlamp-k8s/plugins extractVersion=^kyverno-(?<version>.+)$
    version: "0.1.0"
    verify: github-digest
    layout: tar
    strip: 1
    dest: /plugins/kyverno
  - name: prometheus
    repo: headlamp-k8s/plugins
