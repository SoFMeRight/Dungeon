    asset: "prometheus-{version}.tar.gz"
    # renovate: datasource=github-releases depName=headlamp-k8s/plugins extractVersion=^prometheus-(?<version>.+)$
    version: "0.9.1"
    verify: github-digest
    layout: tar
    strip: 1
    dest: /plugins/prometheus
  - name: app-catalog
    repo: headlamp-k8s/plugins
    tag: "app-catalog-{version}"
    asset: "app-catalog-{version}.tar.gz"
    # renovate: datasource=github-releases depName=headlamp-k8s/plugins extractVersion=^app-catalog-(?<version>.+)$
    version: "0.9.1"
    verify: github-digest
    layout: tar
    strip: 1
    dest: /plugins/app-catalog
  - name: cnpg
    repo: cloudnative-pg/cnpg-headlamp-plugin
    tag: "v{version}"
    asset: "cnpg-headlamp-plugin-{version}.tar.gz"
    # renovate: datasource=github-releases depName=cloudnative-pg/cnpg-headlamp-plugin extractVersion=^v(?<version>.+)$
