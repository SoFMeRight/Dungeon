apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gossip-stone
resources:
  - ../../../base/headlamp
  - externalsecret.yaml
  - httproute.yaml
configMapGenerator:
  - name: headlamp-release-spec
    files:
      - releases.yaml
images:
  - name: ghcr.io/headlamp-k8s/headlamp
    newTag: v0.45.0
  - name: docker.io/hlhd/ansible
    newTag: v2.21.5
    digest: sha256:9130d35313d7117085b015d2ef6708436377f09ab16dfe4933a76fcc91f2b0f2
patches:
  - path: statefulset-patch.yaml
    target:
      kind: StatefulSet
      name: headlamp
  - path: service-patch.yaml
    target:
      kind: Service
      name: headlamp
