apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gossip-stone
resources:
  - ../../../base/headlamp
  - externalsecret.yaml
  - httproute.yaml
images:
  - name: ghcr.io/headlamp-k8s/headlamp
    newTag: v0.45.0
patches:
  - path: deployment-patch.yaml
    target:
      kind: Deployment
      name: headlamp
  - path: service-patch.yaml
    target:
      kind: Service
      name: headlamp
