apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: prowlarr-vpn-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-great-sea
  data:
    - secretKey: vpn_user
      remoteRef:
        key: apps/gluetun
        property: OPENVPN_USER
    - secretKey: vpn_password
      remoteRef:
        key: apps/gluetun
        property: OPENVPN_PASSWORD
