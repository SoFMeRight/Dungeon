apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zigbee2mqtt-xylem
  annotations:
    gatus.home-operations.com/endpoint: |
      group: "Security & IoT (Lens of Truth🔍)"
spec:
  parentRefs:
    - name: xylem-gateway
      namespace: pedestal-of-time
  hostnames:
    - "z2m.pcfae.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: zigbee2mqtt
          port: 8080
