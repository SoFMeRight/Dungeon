apiVersion: apps/v1
kind: Deployment
metadata:
  name: bulkvs-ip-sync
spec:
  template:
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bulkvs-ip-sync
          image: ghcr.io/prplanit/bulkvs-ip-sync:v0.0.1
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          envFrom:
            - configMapRef:
                name: bulkvs-ip-sync-config
            - secretRef:
                name: bulkvs-ip-sync-secrets
