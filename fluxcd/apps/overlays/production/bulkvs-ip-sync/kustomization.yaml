apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: compass
# Hash-suffixed ConfigMap: any change to bulkvs-ip-sync.env changes the generated
# name, so Flux rolls the pod automatically.
configMapGenerator:
  - name: bulkvs-ip-sync-config
    envs:
      - bulkvs-ip-sync.env
resources:
  - ../../../base/bulkvs-ip-sync
patches:
  - path: deployment-patch.yaml
  - target:
      kind: Deployment
      name: bulkvs-ip-sync
    patch: |-
      - op: replace
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: cr-pcfae-admin-pull-secret
  - path: externalsecret-patch.yaml
