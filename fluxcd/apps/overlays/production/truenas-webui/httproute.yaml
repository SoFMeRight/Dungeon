apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: truenas-webui
  annotations:
    gatus.home-operations.com/endpoint: |
      group: "Observability (Gossip Stone💬)"
spec:
  parentRefs:
    - name: phloem-ingress-gateway
      namespace: optcp-ingress-internal
  hostnames:
    - "nas.pcfae.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: truenas-webui
          port: 443
