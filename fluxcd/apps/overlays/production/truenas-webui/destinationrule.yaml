apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: truenas-webui
spec:
  # Exported cluster-wide so the cross-namespace phloem-gateway applies TLS origination.
  exportTo:
    - "*"
  host: gringotts.prplanit.internal
  trafficPolicy:
    tls:
      # Originate TLS to gringotts (TrueNAS terminates HTTPS on :443). It serves a
      # self-signed cert, so verification is skipped — the segment from the gateway to
      # the NAS is on the trusted internal network.
      mode: SIMPLE
      insecureSkipVerify: true
