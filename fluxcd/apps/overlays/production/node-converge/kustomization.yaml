apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: optcp-infra-admin
resources:
  - ../../../base/node-converge
patches:
  - path: cronjob-patch.yaml
  - target:
      kind: ClusterRoleBinding
      name: node-converge
    patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: optcp-infra-admin
