apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: optcp-infrastructure-management
# Never backed up in optcp-infra-admin; opt out of the
# optcp-infrastructure-management Velero coverage to keep that unchanged.
labels:
  - pairs:
      velero.io/exclude-from-backup: "true"
    includeTemplates: true
resources:
  - ../../../base/node-converge
patches:
  - path: cronjob-patch.yaml
  - target:
      kind: ClusterRoleBinding
      name: node-converge
    patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: optcp-infrastructure-management
