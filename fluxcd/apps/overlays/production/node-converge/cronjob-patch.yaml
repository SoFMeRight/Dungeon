apiVersion: batch/v1
kind: CronJob
metadata:
  name: node-converge
spec:
  # Control plane first (this run), then its own node and the workers (the hand-off).
  schedule: "0 3 * * *"
  timeZone: America/Los_Angeles
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: converge
              image: ghcr.io/homelabhd/ansible:v2.22.0@sha256:001483870196e1971ace861151f8e1b09fa42a9bd954062d2e8c9dee44fb7617
              env:
                - name: REPO_URL
                  value: https://git.optcp.com/SoFMeRight/dungeon.git
                - name: BAO_ADDR
                  value: http://openbao.optcp-secrets.svc.cluster.local:8200
