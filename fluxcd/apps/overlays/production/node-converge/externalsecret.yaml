apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: node-converge-ssh
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-optcp
    kind: ClusterSecretStore
  target:
    name: node-converge-ssh
    creationPolicy: Owner
    template:
      data:
        SSH_PRIVATE_KEY: "{{ .SSH_PRIVATE_KEY }}"
  data:
    - secretKey: SSH_PRIVATE_KEY
      remoteRef:
        key: apps/node-converge/app
        property: SSH_PRIVATE_KEY
