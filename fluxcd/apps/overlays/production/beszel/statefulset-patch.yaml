apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: beszel
spec:
  replicas: 1
  template:
    metadata:
      labels:
        policy.prplanit.com/ingress: "true"
        policy.prplanit.com/cap.oidc: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: cr-pcfae-admin-pull-secret
      containers:
        - name: beszel
          image: docker.io/henrygd/beszel:0.18.7
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: gossip-stone-beszel-data
              mountPath: /beszel_data
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        # readOnlyRootFilesystem: beszel writes runtime temp to /tmp (data is on the PVC).
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: gossip-stone-beszel-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ceph-rbd-retain
        resources:
          requests:
            storage: 2Gi
