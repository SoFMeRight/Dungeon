apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: piper
spec:
  template:
    spec:
      containers:
        - name: piper
          image: docker.io/rhasspy/wyoming-piper:2.5.2
          securityContext:
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 2m
              memory: 93Mi
            limits:
              cpu: 177m
              memory: 160Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # readOnlyRootFilesystem: voices download to the data PVC; /tmp is defensive scratch.
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: ceph-rbd-retain
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
