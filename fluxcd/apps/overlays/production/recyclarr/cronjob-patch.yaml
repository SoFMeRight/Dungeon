apiVersion: batch/v1
kind: CronJob
metadata:
  name: recyclarr
spec:
  # Suspended for the move into optcp-swift-sail.
  suspend: true
  schedule: "0 4 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: recyclarr
              image: ghcr.io/recyclarr/recyclarr:8.8.1
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
