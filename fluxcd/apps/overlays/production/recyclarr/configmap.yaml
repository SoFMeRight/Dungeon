apiVersion: v1
kind: ConfigMap
metadata:
  name: recyclarr-config
data:
  recyclarr.yml: |
    # yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json
    # Inlined TRaSH composite templates (Recyclarr v8 removed official include-templates),
    # plus Kai's tuning. reset_unmatched_scores restores disciplined TRaSH scores (undoes the
    # old x265=30000 manual over-scoring) and gives custom formats their real names back.
    # Keys via ESO (RADARR_API_KEY / SONARR_API_KEY).
    # Rationale + calibration: dungeon-scratchpad/servarr/servarr-media-download-prefences.md

    radarr:
      # TRaSH "UHD Bluray + WEB"
      movies:
        base_url: http://downloadarrs.swift-sail.svc.cluster.local:7878
        api_key: !env_var RADARR_API_KEY
        quality_definition:
          type: movie
        quality_profiles:
          - trash_id: 64fb5f9858489bdac2af690e27c8f42f  # UHD Bluray + WEB
            reset_unmatched_scores:
              enabled: true
        custom_format_groups:
          add:
            - trash_id: ff204bbcecdd487d1cefcefdbf0c278d  # [Optional] Golden Rule UHD
            - trash_id: a3ac6af01d78e4f21fcb75f601ac96df  # [Unwanted] Unwanted Formats
        # NOTE (bitrate cap): after first sync, set Bluray/WEBDL/Remux-2160p Max to
        # ~225 MB/min (~30 Mbps) in Radarr > Quality (TRaSH movie def doesn't hard-cap this).

    sonarr:
      # One Sonarr server (downloadarrs) => one instance with BOTH profiles. Recyclarr skips
      # multiple instances that share a base_url, so general TV + anime live in one instance.
      tv:
        base_url: http://downloadarrs.swift-sail.svc.cluster.local:8989
        api_key: !env_var SONARR_API_KEY
        quality_definition:
          type: series
        quality_profiles:
          # General TV — prefer 4K (tighter bitrate than movies via the series quality def +
          # a post-sync 2160p cap in Sonarr > Quality).
          - trash_id: d1498e7d189fbe6c7110ceaabb7473e6  # WEB-2160p
            reset_unmatched_scores:
              enabled: true
          # Anime — Jellyseerr auto-routes anime requests here once its Anime Quality Profile
          # is set to [Anime] Remux-1080p (Anime Series Type = Anime).
          - trash_id: 20e0fc959f1f1704bed501f23bdae76f  # [Anime] Remux-1080p
            reset_unmatched_scores:
              enabled: true
        custom_format_groups:
          add:
            - trash_id: e3f37512790f00d0e89e54fe5e790d1c  # [Optional] Golden Rule UHD
            - trash_id: 74aff4168620ed49dcc67e92b2c2a5b4  # [Optional] Language Profiles
            - trash_id: 85fae4a2294965b75710ef2989c850eb  # [Streaming Services] HD/UHD boost
            - trash_id: 59c3af66780d08332fdc64e68297098f  # [Unwanted] Unwanted Formats
        custom_formats:
          # Bump Anime Dual Audio so dub + original(+subs) wins for shared watching.
          # Positive score = preference, never a reject (sub-only still grabs as fallback).
          - trash_ids:
              - 418f50b10f1907201b6cfdf881f467b7  # Anime Dual Audio
            assign_scores_to:
              - name: "[Anime] Remux-1080p"
                score: 800
