# Read access to nextcloud-postgres's Barman archive, for the recovery bootstrap.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-rehearsal-backup-s3
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-operationtimecapsule
  target:
    name: nextcloud-rehearsal-backup-s3
    creationPolicy: Owner
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: apps/nextcloud
        property: BACKUP_GRINGOTTS_S3_ACCESS_KEY
    - secretKey: SECRET_ACCESS_KEY
      remoteRef:
        key: apps/nextcloud
        property: BACKUP_GRINGOTTS_S3_SECRET_KEY
