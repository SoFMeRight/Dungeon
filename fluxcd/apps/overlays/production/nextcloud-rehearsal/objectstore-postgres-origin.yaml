# nextcloud-postgres's archive, used only as the recovery source: no cluster here
# archives to it and it carries no retention policy, so nothing writes or prunes.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: nextcloud-rehearsal-origin
spec:
  configuration:
    destinationPath: s3://optcp-dungeon-cnpg-nextcloud
    endpointURL: http://172.22.150.101:8333
    s3Credentials:
      accessKeyId:
        name: nextcloud-rehearsal-backup-s3
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: nextcloud-rehearsal-backup-s3
        key: SECRET_ACCESS_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
