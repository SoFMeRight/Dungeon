# The live Nextcloud tree (code, config, data), read-only. The rehearsal reads the
# data directory at the path the database records (local::/var/www/html/data/).
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: optcp-cloud-nextcloud-rehearsal-html
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    name: nextcloud-rehearsal-html
    namespace: optcp-cloud
  csi:
    driver: gorons-bracelet.cephfs.csi.ceph.com
    readOnly: true
    nodeStageSecretRef:
      name: csi-cephfs-node
      namespace: gorons-bracelet
    volumeAttributes:
      clusterID: 0985467c-d8f3-4483-b27f-f0a512397ec2
      fsName: Seed_Bank
      staticVolume: "true"
      rootPath: /dungeon/nvme/apps/nextcloud/html
    volumeHandle: nextcloud-rehearsal-html-static
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-rehearsal-html
spec:
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 5Gi
  volumeName: optcp-cloud-nextcloud-rehearsal-html
  storageClassName: ""
