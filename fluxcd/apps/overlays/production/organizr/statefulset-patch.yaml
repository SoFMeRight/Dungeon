apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: organizr
spec:
  template:
    metadata:
      labels:
        policy.prplanit.com/ingress: "true"
    spec:
      initContainers:
        # Enforce the critical zitadel-OIDC keys in config.php before Organizr starts.
        # Runs as uid 1000 (config.php owner); reads client id/secret from the
        # openbao-backed Secret, other settings from env; idempotent + self-validating.
        - name: oidc-seed
          image: docker.io/php:8.3-cli-alpine
          command: ["php", "/seed/seed-oidc.php"]
          env:
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: organizr-oidc
                  key: OIDC_CLIENT_ID
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: organizr-oidc
                  key: OIDC_CLIENT_SECRET
            - name: OIDC_DISCOVERY_URL
              value: "https://sso.prplanit.com/.well-known/openid-configuration"
            - name: OIDC_NAME
              value: "PrecisionPlanIT SSO"
            # no-role/unknown authenticated logins land here (Guest); real access is
            # earned via a mapped role. User(4) is only for the explicit `user` role.
            - name: OIDC_DEFAULT_GROUP_ID
              value: "999"
            # zitadel-role -> Organizr group_id map. Roles with no entry (no-role/unknown)
            # fall through to oidcDefaultGroupId (User=4).
            # Organizr groups: Admin=0, Co-Admin=1, Super User=2, Power User=3, User=4, Guest=999
            - name: OIDC_GROUP_MAPPINGS
              value: '{"owner":"0","admin":"1","trusted":"3","user":"4"}'
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: lost-woods-organizr-config
              mountPath: /config
            - name: oidc-seed
              mountPath: /seed
              readOnly: true
      containers:
        - name: organizr
          volumeMounts:
            - name: lost-woods-organizr-config
              mountPath: /config
      volumes:
        - name: oidc-seed
          configMap:
            name: organizr-oidc-seed
  volumeClaimTemplates:
    - metadata:
        name: lost-woods-organizr-config
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: ceph-rbd-retain
        resources:
          requests:
            storage: 2Gi
