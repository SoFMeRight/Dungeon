apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: organizr-oidc
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-precisionplanit
  target:
    name: organizr-oidc
    creationPolicy: Owner
  data:
    - secretKey: OIDC_CLIENT_ID
      remoteRef:
        key: apps/organizr
        property: OIDC_CLIENT_ID
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: apps/organizr
        property: OIDC_CLIENT_SECRET
