apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: precisionplanit-site
  annotations:
    gatus.home-operations.com/endpoint: |
      group: "Discovery & Dashboards (Lost Woods🌲)"
spec:
  parentRefs:
    - name: cell-membrane-gateway
      namespace: prelude-of-light
  hostnames:
    - "precisionplanit.com"
    - "www.precisionplanit.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: precisionplanit-site
          port: 4021
