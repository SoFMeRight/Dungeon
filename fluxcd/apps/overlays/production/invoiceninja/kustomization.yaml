apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prplanit-billing

resources:
  - ../../../base/invoiceninja
  - httproute.yaml
  - httproute-xylem.yaml

# Held at zero for the volume re-bind into prplanit-billing.
replicas:
  - name: invoiceninja-app
    count: 0
  - name: invoiceninja-mysql
    count: 0
  - name: invoiceninja-redis
    count: 0

patches:
  - path: statefulset-mysql-patch.yaml
  - path: statefulset-redis-patch.yaml
  - path: statefulset-app-patch.yaml
  - path: service-nginx-patch.yaml
    target:
      kind: Service
      name: invoiceninja-nginx
  - path: externalsecret-patch.yaml
  - path: service-invoiceninja-nginx-ingress-patch.yaml
    target:
      kind: Service
      name: invoiceninja-nginx
