apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rustdesk
spec:
  replicas: 1
  template:
    spec:
      securityContext:
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
      imagePullSecrets:
        - name: cr-pcfae-admin-pull-secret
      containers:
        - name: hbbs
          image: docker.io/rustdesk/rustdesk-server:1.1.16
          securityContext:
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        - name: hbbr
          image: docker.io/rustdesk/rustdesk-server:1.1.16
          securityContext:
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # readOnlyRootFilesystem: rustdesk id/key + db live on the data PVC; /tmp scratch.
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ceph-rbd-retain
        resources:
          requests:
            storage: 1Gi
