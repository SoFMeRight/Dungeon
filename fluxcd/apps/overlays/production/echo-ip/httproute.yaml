apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: echo-ip
  namespace: compass
  annotations:
    gatus.home-operations.com/endpoint: |
      group: "DNS & Network (Compass🧭)"
spec:
  parentRefs:
    - name: cell-membrane-gateway
      namespace: prelude-of-light
      sectionName: https-ipleek
    - name: cell-membrane-gateway
      namespace: prelude-of-light
      sectionName: https-ipleek-apex
    - name: cell-membrane-gateway
      namespace: prelude-of-light
      sectionName: http
  hostnames:
    - "ipleek.com"
    - "www.ipleek.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: echo-ip
          port: 8080
