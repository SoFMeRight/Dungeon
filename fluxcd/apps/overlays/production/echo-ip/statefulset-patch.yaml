apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: echo-ip
spec:
  template:
    metadata:
      labels:
        policy.prplanit.com/ingress: "true"
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: geoip-update
          volumeMounts:
            - name: tingle-tuner-echo-ip-data
              mountPath: /usr/share/GeoIP
      containers:
        - name: echo-ip
          image: ghcr.io/homelabhd/echoip:v2026.9.0@sha256:9f9f6ddb943923b34f18848eb813be52621afdeb151748cfb2346519a1699400
          command: []
          args:
            - "-C"
            - "0"
            - "-p"
            - "-r"
            - "-H"
            - "X-Forwarded-For"
            - "-a"
            - "/data/GeoLite2-ASN.mmdb"
            - "-c"
            - "/data/GeoLite2-City.mmdb"
            - "-f"
            - "/data/GeoLite2-Country.mmdb"
            - "-t"
            - "/opt/echoip/html"
          envFrom:
            # ipleek.com branding/theme (escape-hatch env; image ships stock when unset)
            - configMapRef:
                name: echo-ip-branding
          securityContext:
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: tingle-tuner-echo-ip-data
              mountPath: /data
              readOnly: true
      volumes:
        # readOnlyRootFilesystem: echoip is a static Go server (reads mmdb + baked
        # templates); /tmp is defensive scratch only.
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: tingle-tuner-echo-ip-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: ceph-rbd
        resources:
          requests:
            storage: 1Gi
