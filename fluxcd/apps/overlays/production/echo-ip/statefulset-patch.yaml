apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: echo-ip
spec:
  template:
    metadata:
      labels:
        policy.prplanit.com/ingress: "true"
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: geoip-update
          volumeMounts:
            - name: compass-echo-ip-data
              mountPath: /usr/share/GeoIP
      containers:
        - name: echo-ip
          image: ghcr.io/homelabhd/echoip:2026.7.0@sha256:9ef5aaf1e26ab3c44202e803d291daa2f3460474dba4e5c7e30393aff4bfc700
          command: []
          args:
            - "-C"
            - "0"
            - "-p"
            - "-r"
            - "-H"
            - "X-Forwarded-For"
            - "-a"
            - "/data/GeoLite2-ASN.mmdb"
            - "-c"
            - "/data/GeoLite2-City.mmdb"
            - "-f"
            - "/data/GeoLite2-Country.mmdb"
            - "-t"
            - "/opt/echoip/html"
          envFrom:
            # ipleek.com branding/theme (escape-hatch env; image ships stock when unset)
            - configMapRef:
                name: echo-ip-branding
          volumeMounts:
            - name: compass-echo-ip-data
              mountPath: /data
              readOnly: true
            # vestigial: the fork bakes templates at /opt/echoip/html and themes via env,
            # so -t points there and this PVC is no longer read. Left mounted to avoid a
            # volumeClaimTemplate change (immutable on an existing StatefulSet); drop it
            # in a future STS recreate.
            - name: compass-echo-ip-html
              mountPath: /html
  volumeClaimTemplates:
    - metadata:
        name: compass-echo-ip-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: ceph-rbd
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: compass-echo-ip-html
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: ceph-rbd
        resources:
          requests:
            storage: 100Mi
