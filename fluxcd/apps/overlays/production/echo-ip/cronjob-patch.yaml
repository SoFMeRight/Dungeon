- op: replace
  path: /spec/jobTemplate/spec/template/spec/containers/0/volumeMounts
  value:
    # geoipupdate v8 writes its working dir to /tmp/geoipupdate; writable emptyDir
    # so the rootfs can stay read-only (SEC-4).
    - name: tmp
      mountPath: /tmp
    - name: echo-ip-data
      mountPath: /usr/share/GeoIP
- op: replace
  path: /spec/jobTemplate/spec/template/spec/volumes
  value:
    - name: tmp
      emptyDir: {}
    - name: echo-ip-data
      persistentVolumeClaim:
        claimName: echo-ip-data-echo-ip-0
