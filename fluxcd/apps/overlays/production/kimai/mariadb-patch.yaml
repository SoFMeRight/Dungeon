apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: kimai-mariadb
spec:
  podMetadata:
    labels:
      policy.prplanit.com/access-class: mariadb
      policy.prplanit.com/service-scope: temple-of-time.kimai.mariadb
  # Ensure pods are on separate nodes for HA
  affinity:
    antiAffinityEnabled: true
  storage:
    size: 20Gi
    storageClassName: ceph-rbd
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 512Mi
  galera:
    agent:
      resources:
        requests:
          cpu: 3m
          memory: 36Mi
        limits:
          cpu: 718m
          memory: 36Mi
