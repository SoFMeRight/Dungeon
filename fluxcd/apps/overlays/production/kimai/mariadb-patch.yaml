apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: kimai-mariadb
spec:
  # Held for the volume re-bind into optcp-staff-suite.
  suspend: true
  podMetadata:
    annotations:
      backup.velero.io/backup-volumes-excludes: "storage,galera"
    labels:
      policy.prplanit.com/access-class: mariadb
      policy.prplanit.com/service-scope: optcp-staff-suite.kimai.mariadb
  # Ensure pods are on separate nodes for HA
  affinity:
    antiAffinityEnabled: true
  storage:
    size: 20Gi
    storageClassName: ceph-rbd
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 512Mi
      cpu: 561m
  galera:
    agent:
      resources:
        requests:
          cpu: 3m
          memory: 36Mi
        limits:
          cpu: 397m
          memory: 36Mi
