apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: optcp-staff-suite
resources:
  - ../../../base/kimai
  - httproute.yaml
patches:
  - path: mariadb-patch.yaml
  - path: backup-mariadb-patch.yaml
    target:
      kind: Backup
      name: kimai-mariadb-backup-.*
  - path: statefulset-patch.yaml
  - path: service-kimai-ingress-patch.yaml
    target:
      kind: Service
      name: kimai
