apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kimai
spec:
  template:
    metadata:
      labels:
        policy.prplanit.com/ingress: "true"
        policy.prplanit.com/cap.mariadb: "true"
        policy.prplanit.com/access-scope-mariadb: temple-of-time.kimai.mariadb
    spec:
      containers:
        - name: kimai
          image: docker.io/kimai/kimai2:apache@sha256:0db3af96f0da12c6b74428508d306a8c0e3692d8592300d4849b634c59e2986a
          env:
            - name: TRUSTED_HOSTS
              value: "localhost|127.0.0.1|kimai|kimai.pcfae.com"
