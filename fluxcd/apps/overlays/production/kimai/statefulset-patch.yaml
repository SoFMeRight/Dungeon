apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kimai
spec:
  template:
    metadata:
      labels:
        policy.prplanit.com/ingress: "true"
        policy.prplanit.com/cap.mariadb: "true"
        policy.prplanit.com/access-scope-mariadb: optcp-staff-suite.kimai.mariadb
    spec:
      containers:
        - name: kimai
          image: docker.io/kimai/kimai2:apache@sha256:ee3838cd6841b716cb0992a995a1d3cc60dbd5332bb21946565b31d02aaa4eec
          env:
            - name: TRUSTED_HOSTS
              value: "localhost|127.0.0.1|kimai|kimai.pcfae.com"
