apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kimai
spec:
  template:
    metadata:
      labels:
        policy.prplanit.com/ingress: "true"
        policy.prplanit.com/cap.mariadb: "true"
        policy.prplanit.com/access-scope-mariadb: temple-of-time.kimai.mariadb
    spec:
      containers:
        - name: kimai
          image: docker.io/kimai/kimai2:apache@sha256:19b34043e7631b122c5e5aca27c3f3caa0bb37d2bce1478342c666bcdfe84f48
          env:
            - name: TRUSTED_HOSTS
              value: "localhost|127.0.0.1|kimai|kimai.pcfae.com"
