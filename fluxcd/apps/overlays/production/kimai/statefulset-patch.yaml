apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kimai
spec:
  template:
    metadata:
      labels:
        policy.prplanit.com/ingress: "true"
        policy.prplanit.com/cap.mariadb: "true"
        policy.prplanit.com/access-scope-mariadb: optcp-staff-suite.kimai.mariadb
    spec:
      containers:
        - name: kimai
          image: docker.io/kimai/kimai2:apache@sha256:ef2699052e6a6ff20a1b42279927b4512e462659f3bf7d23f80882a8218021b4
          env:
            - name: TRUSTED_HOSTS
              value: "localhost|127.0.0.1|kimai|kimai.pcfae.com"
