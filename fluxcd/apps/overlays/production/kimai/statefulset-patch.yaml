apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kimai
spec:
  template:
    metadata:
      labels:
        policy.prplanit.com/ingress: "true"
        policy.prplanit.com/cap.mariadb: "true"
        policy.prplanit.com/access-scope-mariadb: optcp-staff-suite.kimai.mariadb
    spec:
      containers:
        - name: kimai
          image: docker.io/kimai/kimai2:apache@sha256:d76e55fcd2aa6b5f7343e70bb4c198cbba63de59b329496808e44d4d2e0c137f
          env:
            - name: TRUSTED_HOSTS
              value: "localhost|127.0.0.1|kimai|kimai.pcfae.com"
