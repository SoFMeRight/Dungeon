apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate
spec:
  schedule: "0 */6 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          containers:
            - name: renovate
              image: ghcr.io/renovatebot/renovate:44
              env:
                - name: RENOVATE_ENDPOINT
                  value: "https://gitlab.prplanit.com/api/v4"
                # V8 soft heap ceiling. The cold-cache run crashed with "JavaScript
                # heap out of memory" once docker.io discovery started working; this
                # caps the heap at 3GB explicitly (rather than relying on Node's
                # cgroup auto-detection), sitting under the 4Gi container limit with
                # ~1Gi left for off-heap.
                - name: NODE_OPTIONS
                  value: "--max-old-space-size=3072"
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  # 4Gi holds the 3GB heap plus off-heap.
                  cpu: "2"
                  memory: 4Gi
