apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate-dungeon
spec:
  schedule: "20 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          containers:
            - name: renovate
              image: ghcr.io/renovatebot/renovate:44
              env:
                - name: RENOVATE_ENDPOINT
                  value: "https://gitlab.prplanit.com/api/v4"
                # Caps the V8 heap under the 4Gi limit.
                - name: NODE_OPTIONS
                  value: "--max-old-space-size=3072"
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  # 4Gi holds the 3GB heap plus off-heap.
                  cpu: "2"
                  memory: 4Gi
