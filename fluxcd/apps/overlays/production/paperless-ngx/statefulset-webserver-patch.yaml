apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: paperless-webserver
spec:
  replicas: 1
  template:
    metadata:
      labels:
        policy.prplanit.com/ingress: "true"
        policy.prplanit.com/cap.postgres: "true"
        policy.prplanit.com/access-scope-postgres: arbitorium-restricted.paperless.postgres
        policy.prplanit.com/cap.redis: "true"
        policy.prplanit.com/access-scope-redis: arbitorium-restricted.paperless.redis
    spec:
      containers:
        - name: paperless
          image: ghcr.io/paperless-ngx/paperless-ngx:3.4.2
          env:
            - name: PAPERLESS_URL
              value: "https://paperless.pcfae.com"
            - name: PAPERLESS_CSRF_TRUSTED_ORIGINS
              value: "https://apps.pcfae.com"
            - name: PAPERLESS_ALLOWED_HOSTS
              value: "apps.pcfae.com,paperless.pcfae.com,172.22.30.124"
            - name: PAPERLESS_CORS_ALLOWED_HOSTS
              value: "http://172.22.30.124:8000"
            - name: PAPERLESS_ADMIN_USER
              value: "kai.hamil@gmail.com"
          volumeMounts:
            - name: paperless-data
              mountPath: /usr/src/paperless/data
            - name: paperless-media
              mountPath: /usr/src/paperless/media
            - name: paperless-export
              mountPath: /usr/src/paperless/export
            - name: paperless-consume
              mountPath: /usr/src/paperless/consume
  volumeClaimTemplates:
    - metadata:
        name: paperless-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ceph-rbd-retain
        resources:
          requests:
            storage: 10Gi
    - metadata:
        name: paperless-media
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ceph-rbd-retain
        resources:
          requests:
            storage: 20Gi
    - metadata:
        name: paperless-export
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ceph-rbd-retain
        resources:
          requests:
            storage: 5Gi
    - metadata:
        name: paperless-consume
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ceph-rbd-retain
        resources:
          requests:
            storage: 5Gi
