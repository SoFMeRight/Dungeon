apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflare-ddns-config
data:
  DOMAINS: >-
    arbitorium.com,cm.arbitorium.com,pm.arbitorium.com,
    astralfocus.com,
    ipleek.com,
    operationtimecapsule.com,
    mc.operationtimecapsule.com,
    optcp.com,
    pcfae.com,
    kb.precisionplanit.com,
    prplanit.com,m.ntfy.prplanit.com,
    meshc.prplanit.com,netbird.prplanit.com,pbx.prplanit.com,trmm.prplanit.com,turn.prplanit.com,
    blog.sofmeright.com,ls.sofmeright.com,status.sofmeright.com,
    uni2.cc,
    meals.yesimvegan.com,wiki.yesimvegan.com,
    mc.yesimvegan.com
  # (DNS-only) — proxy everything EXCEPT these.
  PROXIED: >-
    !is(pbx.prplanit.com,turn.prplanit.com,ipleek.com,
        netbird.prplanit.com,trmm.prplanit.com,
        mc.operationtimecapsule.com,mc.yesimvegan.com)
  IP4_PROVIDER: "cloudflare.trace"
  IP6_PROVIDER: "none"
  UPDATE_CRON: "@every 5m"
  TZ: "Etc/UTC"
