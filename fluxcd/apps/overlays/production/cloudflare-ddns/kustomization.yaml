apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: optcp-address-sync
# Hash-suffixed ConfigMap: any change to cloudflare-ddns.env changes the generated
# name, so Flux rolls the pod automatically (favonia reads DOMAINS/PROXIED at startup).
configMapGenerator:
  - name: cloudflare-ddns-config
    envs:
      - cloudflare-ddns.env
resources:
  - ../../../base/cloudflare-ddns
patches:
  - path: deployment-patch.yaml
  - target:
      kind: Deployment
      name: cloudflare-ddns
    patch: |-
      - op: replace
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: pull-secret-cr-optcp-optcp-k8s-dungeon-public
  - path: externalsecret-patch.yaml
