apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: orangehrm
spec:
  template:
    metadata:
      labels:
        policy.prplanit.com/ingress: "true"
    spec:
      initContainers:
        - name: wait-for-mariadb
          image: docker.io/busybox:1.38
      containers:
        - name: orangehrm
          image: docker.io/orangehrm/orangehrm:5.9
          # Full mount set (this list replaces the base's). PVC + the non-root apache overrides
          # (config on :8080, writable run/log dirs). Volumes are defined in the base.
          volumeMounts:
            - name: hyrule-castle-orangehrm-data
              mountPath: /orangehrm
            - name: apache-config
              mountPath: /etc/apache2/ports.conf
              subPath: ports.conf
            - name: apache-config
              mountPath: /etc/apache2/sites-enabled/000-default.conf
              subPath: 000-default.conf
            - name: apache-run
              mountPath: /var/run/apache2
            - name: apache-logs
              mountPath: /var/log/apache2
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
  volumeClaimTemplates:
    - metadata:
        name: hyrule-castle-orangehrm-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: ceph-rbd
        resources:
          requests:
            storage: 5Gi
