# Patch SMB PVs with production paths and namespace
apiVersion: v1
kind: PersistentVolume
metadata:
  name: photoprism-x-originals
spec:
  csi:
    volumeAttributes:
      source: "//gringotts/xylem-gallery/Photos/Library"
    nodeStageSecretRef:
      namespace: kai-private
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: photoprism-x-import
spec:
  csi:
    volumeAttributes:
      source: "//gringotts/xylem-gallery/Photos/Import"
    nodeStageSecretRef:
      namespace: kai-private
