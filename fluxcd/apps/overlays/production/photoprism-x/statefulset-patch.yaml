apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: photoprism-x
spec:
  template:
    metadata:
      labels:
        policy.prplanit.com/ingress: "true"
    spec:
      securityContext:
        runAsUser: 2432
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: photoprism
          securityContext:
            readOnlyRootFilesystem: true
          env:
            - name: PHOTOPRISM_DISABLE_TLS
              value: "true"
            - name: PHOTOPRISM_DEFAULT_TLS
              value: "false"
            - name: PHOTOPRISM_DISABLE_CHOWN
              value: "true"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # readOnlyRootFilesystem: storage/originals on PVCs; /tmp for thumbnail/convert scratch.
        - name: tmp
          emptyDir: {}
