apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: photoprism-x
spec:
  template:
    metadata:
      labels:
        policy.prplanit.com/ingress: "true"
    spec:
      securityContext:
        runAsUser: 2432
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        # readOnlyRootFilesystem EXCEPTION: the photoprism image is s6-overlay-based; its
        # preinit s6-chown fatals ("unable to chown /run: Read-only file system") under a
        # read-only rootfs, and being non-root + drop-ALL it cannot chown a writable /run
        # either. Cannot enable ro-rootfs without an image rebuild. Stays non-root + seccomp.
        - name: photoprism
          env:
            - name: PHOTOPRISM_DISABLE_TLS
              value: "true"
            - name: PHOTOPRISM_DEFAULT_TLS
              value: "false"
            - name: PHOTOPRISM_DISABLE_CHOWN
              value: "true"
