apiVersion: apps/v1
kind: Deployment
metadata:
  name: calcom
spec:
  replicas: 3
  template:
    metadata:
      labels:
        policy.prplanit.com/ingress: "true"
        # next-auth fetches this app's own public host server-side while rendering, and
        # split-horizon DNS sends that back through the gateway, which refuses in-cluster
        # callers. Without this the auth pages wait out the timeout before they render.
        # Not cap.oidc: calcom has no IdP of its own to reach — SSO is a paid feature here.
        policy.prplanit.com/cap.self-origin: "true"
        policy.prplanit.com/cap.postgres: "true"
        policy.prplanit.com/access-scope-postgres: hyrule-castle.calcom.postgres
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: fix-yarn-perms
          image: docker.io/calcom/cal.com:v6.2.0
          # Runs as root only to chown the yarn-cache emptyDir to 1001; keep just the file-perm caps.
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
          command:
            - sh
            - -c
            - |
              cp -a /calcom/.yarn/* /yarn-writable/
              chown -R 1001:1001 /yarn-writable/
          volumeMounts:
            - name: yarn-dir
              mountPath: /yarn-writable
        # Seeds the served build output into writable volumes so the startup rewrite can
        # edit it in place. An empty mount here would hide the build entirely, so the
        # contents have to be copied in first, exactly as the yarn cache above is.
        - name: seed-writable-build
          image: docker.io/calcom/cal.com:v6.2.0
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
          command:
            - sh
            - -c
            - |
              cp -a /calcom/apps/web/.next/server/. /seed-server/
              cp -a /calcom/apps/web/.next/static/. /seed-static/
              cp -a /calcom/apps/web/public/embed/. /seed-embed/
              chown -R 1001:1001 /seed-server/ /seed-static/ /seed-embed/
          volumeMounts:
            - name: next-server
              mountPath: /seed-server
            - name: next-static
              mountPath: /seed-static
            - name: public-embed
              mountPath: /seed-embed
      containers:
        - name: calcom
          image: docker.io/calcom/cal.com:v6.2.0
          securityContext:
            readOnlyRootFilesystem: true
          env:
            - name: NEXT_PUBLIC_WEBAPP_URL
              value: https://cal.prplanit.com
            - name: NEXT_PUBLIC_API_V2_URL
              value: https://cal.prplanit.com/api/v2
            - name: NEXTAUTH_URL
              value: https://cal.prplanit.com
          volumeMounts:
            - name: yarn-dir
              mountPath: /calcom/.yarn
            - name: turbo-dir
              mountPath: /calcom/.turbo
            - name: next-server
              mountPath: /calcom/apps/web/.next/server
            - name: next-static
              mountPath: /calcom/apps/web/.next/static
            - name: public-embed
              mountPath: /calcom/apps/web/public/embed
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: yarn-dir
          emptyDir: {}
        - name: turbo-dir
          emptyDir: {}
        # readOnlyRootFilesystem stays on; these carry the only paths the entrypoint has to
        # rewrite. The public URL is baked into the bundle at build time and replaced in
        # place at startup — denied that write, the client keeps the build host and sign-in
        # redirects off-site. `next start` serves .next/server and .next/static, so only
        # those (plus the embed snippets) need to be writable; .next/standalone is 550M the
        # entrypoint also rewrites but nothing serves.
        - name: next-server
          emptyDir: {}
        - name: next-static
          emptyDir: {}
        - name: public-embed
          emptyDir: {}
        - name: tmp
          emptyDir: {}
