apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hyrule-castle

resources:
  - ../../../base/calcom
  - httproute.yaml
  - externalsecret-postgres-backup.yaml

patches:
  - path: deployment-patch.yaml
    target:
      kind: Deployment
      name: calcom
  - path: cluster-postgres-patch.yaml
    target:
      kind: Cluster
      name: calcom-postgres
  - path: objectstore-postgres-patch.yaml
    target:
      kind: ObjectStore
      name: calcom-postgres-store
  - path: externalsecret-patch.yaml
    target:
      kind: ExternalSecret
      name: calcom-secrets
  - path: service-calcom-ingress-patch.yaml
    target:
      kind: Service
      name: calcom
