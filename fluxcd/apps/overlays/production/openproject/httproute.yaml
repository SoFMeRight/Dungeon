apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openproject
  annotations:
    gatus.home-operations.com/endpoint: |
      group: "Cloud & Collaboration (OpTCP)"
spec:
  parentRefs:
    - name: phloem-gateway
      namespace: arylls-lookout
  hostnames:
    - "projects.optcp.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: openproject
          port: 8080
