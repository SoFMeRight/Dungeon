# Frigate StatefulSet production overlay
# - Pinned image version
# - frigate-notify sidecar for ntfy alerts
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: frigate
spec:
  replicas: 1
  template:
    metadata:
      labels:
        policy.prplanit.com/ingress: "true"
    spec:
      containers:
        # Main Frigate container
        - name: frigate
          resources:
            requests:
              # 575m (p50 x 1.2) does not fit: frigate is pinned to dungeon-chest-001 (GPU compute 7+),
              # which has ~324m unreserved CPU. Bursts to the limit as before.
              cpu: 300m
              memory: 10659Mi
            limits:
              cpu: 2222m
              memory: 10659Mi
          image: ghcr.io/blakeblackshear/frigate:0.18.0-tensorrt@sha256:82d7475ba7e5f950911bd9d06f2392de96881f39eeacd78824a526dde9b5cad9
        # Notification sidecar - polls Frigate API, sends to ntfy
        - name: frigate-notify
          image: ghcr.io/0x2142/frigate-notify:v0.5.4
          env:
            - name: FN_NTFY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: frigate-secret
                  key: NTFY_TOKEN
          volumeMounts:
            - name: frigate-notify-config
              mountPath: /app/config.yml
              subPath: config.yml
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: frigate-notify-config
          configMap:
            name: frigate-notify-config
