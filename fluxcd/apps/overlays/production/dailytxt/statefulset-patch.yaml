apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dailytxt
spec:
  replicas: 1
  template:
    metadata:
      labels:
        policy.prplanit.com/ingress: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: init-permissions
          image: docker.io/phitux/dailytxt:2.6.2
          command:
            - sh
            - -c
            - cp -a /usr/share/nginx/html/. /html/ && chown -R 101:101 /html /data
          # Runs as root to chown the html/data volumes to 101 for the app; drop ALL but keep
          # the file-ownership caps the chown needs.
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
          volumeMounts:
            - name: html
              mountPath: /html
            - name: data
              mountPath: /data
      containers:
        - name: dailytxt
          image: docker.io/phitux/dailytxt:2.6.2
          securityContext:
            readOnlyRootFilesystem: true
          env:
            - name: ALLOWED_HOSTS
              value: "shiplog.pcfae.com"
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: html
              mountPath: /usr/share/nginx/html
            - name: tmp
              mountPath: /tmp
            - name: var-run
              mountPath: /var/run
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: var-log
              mountPath: /var/log
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kai-dailytxt-data
        - name: nginx-config
          configMap:
            name: dailytxt-nginx-config
        - name: html
          emptyDir:
            medium: Memory
            sizeLimit: 4Mi
        # readOnlyRootFilesystem: nginx + supervisord need writable run/cache/log; /tmp scratch.
        - name: tmp
          emptyDir: {}
        - name: var-run
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: var-log
          emptyDir: {}
