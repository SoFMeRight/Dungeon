apiVersion: v1
kind: PersistentVolume
metadata:
  name: kai-dailytxt-data
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ceph-rbd-static
  csi:
    driver: gorons-bracelet.rbd.csi.ceph.com
    fsType: ext4
    volumeHandle: kai-dailytxt-data
    volumeAttributes:
      clusterID: "0985467c-d8f3-4483-b27f-f0a512397ec2"
      pool: dungeon
      staticVolume: "true"
      imageName: kai-dailytxt-data
      imageFeatures: layering
    nodeStageSecretRef:
      name: csi-rbd-node
      namespace: gorons-bracelet
    controllerExpandSecretRef:
      name: csi-rbd-provisioner
      namespace: gorons-bracelet
