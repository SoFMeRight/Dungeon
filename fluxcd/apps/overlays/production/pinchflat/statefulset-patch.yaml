apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pinchflat
spec:
  template:
    metadata:
      labels:
        policy.prplanit.com/ingress: "true"
        istio.io/dataplane-mode: none
    spec:
      containers:
        - name: pinchflat
          image: ghcr.io/kieraneglin/pinchflat@sha256:01b4f98aabaf3f5fe394213f7a32578c9e84e42080f52e2f8334021a4473b202
          securityContext:
            readOnlyRootFilesystem: true
          env:
            - name: TZ
              value: "America/Los_Angeles"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: yt-dlp-config
              mountPath: /etc/yt-dlp
        - name: gluetun
          image: docker.io/qmcgaw/gluetun:v3.41.3
          env:
            - name: VPN_SERVICE_PROVIDER
              value: "private internet access"
            - name: SERVER_REGIONS
              $patch: delete
            - name: FIREWALL_VPN_INPUT_PORTS
              $patch: delete
            - name: FIREWALL_INPUT_PORTS
              value: "8945"
            - name: FIREWALL_OUTBOUND_SUBNETS
              value: "10.144.0.0/12,172.16.0.0/12,172.22.30.33/32,192.168.144.0/20"
            - name: DNS_ADDRESS
              value: "10.144.0.10"
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: optcp-pinchflat-config
        # readOnlyRootFilesystem (pinchflat container): data on config PVC; yt-dlp/BEAM use /tmp.
        - name: tmp
          emptyDir: {}
        # pinchflat's release check writes to /etc/yt-dlp; runtime scratch (config/DB are on the PVC).
        - name: yt-dlp-config
          emptyDir: {}
  volumeClaimTemplates: []
