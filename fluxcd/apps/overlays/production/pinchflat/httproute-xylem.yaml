apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pinchflat-xylem
  annotations:
    gatus.home-operations.com/endpoint: |
      group: "Downloads & Media (Swift Sail⛵)"
      url: https://pinchflat.pcfae.com/healthcheck
      conditions:
        - "[STATUS] == 200"
spec:
  parentRefs:
    - name: phloem-ingress-gateway
      namespace: optcp-ingress-internal
  hostnames:
    - "pinchflat.pcfae.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: pinchflat
          port: 8945
