apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pyload-ng
spec:
  template:
    metadata:
      labels:
        policy.prplanit.com/ingress: "true"
        istio.io/dataplane-mode: none
    spec:
      containers:
        - name: pyload-ng
          image: docker.io/linuxserver/pyload-ng:0.5.0
          # Readiness probes the share, not the web port: the port answers even
          # when the SMB session is dead. No liveness probe - gluetun drops egress
          # on each VPN reconnect and a restart on that would loop.
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - test -r /downloads && test -w /downloads
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          env:
            - name: TZ
              value: "America/Los_Angeles"
        - name: gluetun
          image: docker.io/qmcgaw/gluetun:v3.41.3
          env:
            - name: VPN_SERVICE_PROVIDER
              value: "private internet access"
            - name: SERVER_REGIONS
              $patch: delete
            - name: FIREWALL_VPN_INPUT_PORTS
              $patch: delete
            - name: FIREWALL_INPUT_PORTS
              value: "8227"
            - name: FIREWALL_OUTBOUND_SUBNETS
              value: "10.144.0.0/12,172.16.0.0/12,172.22.30.33/32,192.168.144.0/20"
            - name: DNS_ADDRESS
              value: "10.144.0.10"
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: optcp-pyload-ng-config
  volumeClaimTemplates: []
