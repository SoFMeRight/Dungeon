apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: optcp-swift-sail-privileged

resources:
  - ../../../base/pyload-ng
  - httproute-xylem.yaml
  - static-rbd-volumes.yaml

patches:
  - path: statefulset-patch.yaml
  - path: externalsecret-patch.yaml
  - path: smb-volumes-patch.yaml
  - path: pv-secretref-patch.yaml
  - path: service-pyload-ng-ingress-patch.yaml
    target:
      kind: Service
      name: pyload-ng
