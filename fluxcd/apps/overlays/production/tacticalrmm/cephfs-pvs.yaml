---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: tactical-data-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: gorons-bracelet.cephfs.csi.ceph.com
    nodeStageSecretRef:
      name: csi-cephfs-node
      namespace: gorons-bracelet
    volumeAttributes:
      clusterID: 0985467c-d8f3-4483-b27f-f0a512397ec2
      fsName: Seed_Bank
      staticVolume: "true"
      rootPath: /dungeon/hdd/apps/tacticalrmm/tactical-data
    volumeHandle: tactical-data-static
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tactical-data-pvc
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  volumeName: tactical-data-pv
  storageClassName: ""
