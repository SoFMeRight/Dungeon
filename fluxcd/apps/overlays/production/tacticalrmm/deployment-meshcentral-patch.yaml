apiVersion: apps/v1
kind: Deployment
metadata:
  name: tactical-meshcentral
spec:
  template:
    metadata:
      labels:
        # MeshCentral calls its own public hostname (certUrl) through the gateway.
        policy.prplanit.com/cap.self-origin: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: cr-pcfae-admin-pull-secret
      # ndots 2: meshc.prplanit.com resolves as an absolute name before any search domain.
      dnsConfig:
        options:
          - name: ndots
            value: "2"
      initContainers:
        - name: wait-for-mongodb
          image: docker.io/mongo:4.4
          command:
            - sh
            - -c
            - |
              until mongo --host tactical-mongodb --eval "db.adminCommand('ping')" >/dev/null 2>&1; do
                echo "Waiting for MongoDB..."
                sleep 2
              done
              echo "MongoDB is ready"
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      containers:
        # readOnlyRootFilesystem EXCEPTION: this container's startup command cp's newer
        # MeshAgent binaries into /home/node/app/node_modules/meshcentral/agents (a rootfs
        # path) and rewrites the entrypoint in place — both need a writable rootfs. Cannot
        # enable ro-rootfs without reworking the agent-replacement approach.
        - name: meshcentral
          image: docker.io/tacticalrmm/tactical-meshcentral:1.5.2
          command:
            - bash
            - -c
            - |
              # Replace bundled MeshAgent binaries with newer versions from meshcentral@1.1.56
              # The Dec 2022 binary has CAPTUREBLT bug causing intermittent black screen on Win11/Server2025
              # The Mar 2025 binary (from npm 1.1.56) includes the fix (MeshAgent commit 653f13a)
              AGENTS_DIR="/home/node/app/node_modules/meshcentral/agents"
              wget -q "https://registry.npmjs.org/meshcentral/-/meshcentral-1.1.56.tgz" -O /tmp/meshcentral.tgz
              tar xzf /tmp/meshcentral.tgz -C /tmp
              for f in /tmp/package/agents/MeshService*; do
                bin=$(basename "$f")
                if [ -f "$AGENTS_DIR/$bin" ]; then
                  cp "$f" "$AGENTS_DIR/$bin"
                  echo "Replaced $bin ($(wc -c < "$AGENTS_DIR/$bin") bytes)"
                fi
              done
              rm -rf /tmp/package /tmp/meshcentral.tgz

              # Patch entrypoint:
              # 1. Point certUrl at the public hostname, so agents get the gateway certificate's hash
              # 2. Inject debug flags into config.json after generation, before node starts
              cat > /tmp/inject-debug.js << 'JSEOF'
              const f = "/home/node/app/meshcentral-data/config.json";
              const c = require(f);
              c.settings.debug = "relay,agent,peer";
              c.settings.tlsOffload = true;
              c.settings.agentPong = 28;
              c.domains = c.domains || {};
              c.domains[""] = c.domains[""] || {};
              c.domains[""].certUrl = "https://" + process.env.MESH_HOST + ":443/";
              require("fs").writeFileSync(f, JSON.stringify(c, null, 2));
              JSEOF
              sed '/"certUrl"/d' /entrypoint.sh \
                | sed '/^node node_modules\/meshcentral$/i \
              node /tmp/inject-debug.js' \
                > /tmp/entrypoint-patched.sh
              chmod +x /tmp/entrypoint-patched.sh
              exec /tmp/entrypoint-patched.sh
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: MESH_PERSISTENT_CONFIG
              value: "0"
            - name: WS_MASK_OVERRIDE
              value: "1"
          resources:
            requests:
              cpu: 4m
              memory: 266Mi
            limits:
              cpu: "1000m"
              memory: "304Mi"
      volumes:
        - $patch: replace
        - name: tactical-data
          persistentVolumeClaim:
            claimName: hookshot-tactical-data-pvc
        - name: meshcentral-data
          persistentVolumeClaim:
            claimName: hookshot-meshcentral-data-pvc
