apiVersion: apps/v1
kind: Deployment
metadata:
  name: tactical-websockets
spec:
  template:
    metadata:
      labels:
        # websockets connects to postgres + redis; without these the Cilium deny-default
        # policy blocked egress to :5432/:6379, so wait-for-postgres init hung indefinitely.
        policy.prplanit.com/cap.postgres: "true"
        policy.prplanit.com/access-scope-postgres: hookshot.tacticalrmm.postgres
        policy.prplanit.com/cap.redis: "true"
        policy.prplanit.com/access-scope-redis: hookshot.tacticalrmm.redis
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: cr-pcfae-admin-pull-secret
      initContainers:
        - name: wait-for-postgres
          image: docker.io/postgres:13-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h tactical-postgres -p 5432 -U tactical; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
              echo "PostgreSQL is ready"
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
        - name: wait-for-backend
          image: docker.io/busybox:1.38
          command:
            - sh
            - -c
            - |
              until nc -z tactical-backend 8080; do
                echo "Waiting for Backend (uwsgi)..."
                sleep 2
              done
              echo "Backend is ready"
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
        - name: wait-for-init
          image: docker.io/busybox:1.38
          command: ["sh", "-c", "until [ -f /opt/tactical/tmp/tactical.ready ]; do echo 'Waiting for init...'; sleep 5; done"]
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tactical-data
              mountPath: /opt/tactical
      containers:
        - name: websockets
          image: docker.io/tacticalrmm/tactical:1.5.2
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: NATS_CONNECT_HOST
              value: "tactical-nats"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - $patch: replace
        - name: tmp
          emptyDir: {}
        - name: tactical-data
          persistentVolumeClaim:
            claimName: hookshot-tactical-data-pvc
