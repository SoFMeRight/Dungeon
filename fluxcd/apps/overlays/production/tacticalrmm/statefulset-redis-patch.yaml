apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tactical-redis
spec:
  template:
    metadata:
      labels:
        policy.prplanit.com/access-class: redis
        policy.prplanit.com/service-scope: hookshot.tacticalrmm.redis
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: create-initialized-marker
          image: docker.io/busybox:1.38
          # CephFS dirs owned by 1000:1000 — must match to touch
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      containers:
        - name: redis
          image: docker.io/redis:8-alpine
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 6m
              memory: 83Mi
            limits:
              cpu: 283m
              memory: "144Mi"
      volumes:
        - name: redis-init
          persistentVolumeClaim:
            claimName: hookshot-redis-init-pvc
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ceph-rbd
        resources:
          requests:
            storage: 5Gi
