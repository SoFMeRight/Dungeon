apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: semaphore
spec:
  replicas: 1
  template:
    metadata:
      labels:
        policy.prplanit.com/ingress: "true"
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: postgres
          image: docker.io/postgres:14
        - name: semaphore
          image: docker.io/semaphoreui/semaphore:v2.19.7
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
          env:
            - name: TZ
              value: "Etc/UTC"
            - name: SEMAPHORE_PORT
              value: "3000"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/semaphore
      volumes:
        # readOnlyRootFilesystem: config/playbooks/keys on PVCs; /tmp + HOME writable so ansible
        # runs can write ~/.ansible tmp and ~/.ssh known_hosts.
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        storageClassName: ceph-rbd-retain
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
    - metadata:
        name: config
      spec:
        storageClassName: ceph-rbd-retain
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: playbooks
      spec:
        storageClassName: ceph-rbd-retain
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
    - metadata:
        name: ssh-keys
      spec:
        storageClassName: ceph-rbd-retain
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 100Mi
