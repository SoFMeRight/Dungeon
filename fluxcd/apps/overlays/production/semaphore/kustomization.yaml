apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: optcp-infrastructure-management
resources:
  - ../../../base/semaphore
  - httproute.yaml
patches:
  - path: statefulset-patch.yaml
    target:
      kind: StatefulSet
      name: semaphore
  - path: service-semaphore-ingress-patch.yaml
    target:
      kind: Service
      name: semaphore
  - path: hold-for-move-patch.yaml
