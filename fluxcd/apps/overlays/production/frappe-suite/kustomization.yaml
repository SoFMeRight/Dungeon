apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prplanit-staff-suite

resources:
  - ../../../base/frappe-suite
  - httproute.yaml
  - cephfs-pvs.yaml

# Held at zero for the volume re-bind into prplanit-staff-suite.
replicas:
  - name: frappe-suite-frontend
    count: 0
  - name: frappe-suite-queue-long
    count: 0
  - name: frappe-suite-queue-short
    count: 0
  - name: frappe-suite-redis-cache
    count: 0
  - name: frappe-suite-scheduler
    count: 0
  - name: frappe-suite-websocket
    count: 0
  - name: frappe-suite-mariadb
    count: 0
  - name: frappe-suite-redis-queue
    count: 0
  - name: frappe-suite-sites
    count: 0

patches:
  - path: statefulset-mariadb-patch.yaml
  - path: statefulset-redis-queue-patch.yaml
  - path: statefulset-sites-patch.yaml
  - path: deployment-redis-cache-patch.yaml
  - path: deployment-frontend-patch.yaml
  - path: deployment-websocket-patch.yaml
  - path: deployment-scheduler-patch.yaml
  - path: deployment-queue-long-patch.yaml
  - path: deployment-queue-short-patch.yaml
  - path: service-patch.yaml
    target:
      kind: Service
      name: frappe-suite-frontend
  - path: externalsecret-patch.yaml
  - path: service-frappe-suite-frontend-ingress-patch.yaml
    target:
      kind: Service
      name: frappe-suite-frontend
