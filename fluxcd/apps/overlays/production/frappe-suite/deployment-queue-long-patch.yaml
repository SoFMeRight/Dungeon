apiVersion: apps/v1
kind: Deployment
metadata:
  name: frappe-suite-queue-long
spec:
  template:
    spec:
      containers:
        - name: queue-long
          image: docker.io/hlhd/frappe-suite:v16.50.0
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 82m
              memory: 276Mi
            limits:
              cpu: "1000m"
              memory: "2Gi"
      volumes:
        - name: sites-data
          persistentVolumeClaim:
            claimName: hyrule-castle-frappe-suite-sites
        - name: logs-data
          persistentVolumeClaim:
            claimName: hyrule-castle-frappe-suite-logs
