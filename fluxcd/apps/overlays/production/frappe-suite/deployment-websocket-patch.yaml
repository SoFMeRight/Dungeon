apiVersion: apps/v1
kind: Deployment
metadata:
  name: frappe-suite-websocket
spec:
  template:
    spec:
      containers:
        - name: websocket
          image: docker.io/hlhd/frappe-suite:v16.50.0
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 2m
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: sites-data
          persistentVolumeClaim:
            claimName: hyrule-castle-frappe-suite-sites
        - name: logs-data
          persistentVolumeClaim:
            claimName: hyrule-castle-frappe-suite-logs
