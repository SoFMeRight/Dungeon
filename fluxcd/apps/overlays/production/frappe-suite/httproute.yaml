apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frappe-suite-frontend
  namespace: hyrule-castle
  annotations:
    gatus.home-operations.com/endpoint: |
      group: "Business Apps (Hyrule Castle🏰)"
spec:
  # xylem, not cell-membrane: this is the desk of an ERP holding company books, and
  # cell-membrane terminates the domains that are published to the internet. The site
  # is reached over the LAN and nothing resolves it from outside.
  parentRefs:
    - name: xylem-gateway
      namespace: arylls-lookout
  hostnames:
    - "hq.pcfae.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frappe-suite-frontend
          port: 8085
