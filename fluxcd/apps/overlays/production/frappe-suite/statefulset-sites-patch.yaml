apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: frappe-suite-sites
spec:
  template:
    metadata:
      labels:
        # The token exchange and userinfo call are made by this pod, and
        # sso.prplanit.com resolves to the gateway VIP from inside the cluster.
        policy.prplanit.com/cap.oidc: "true"
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: copy-assets
          image: docker.io/hlhd/frappe-suite:v16.33.0
          imagePullPolicy: Always
          volumeMounts:
            - $patch: delete
              name: PLACEHOLDER_SITES_DATA
            - name: sites-data
              mountPath: /mnt/sites
        - name: configurator
          image: docker.io/hlhd/frappe-suite:v16.33.0
          imagePullPolicy: Always
          volumeMounts:
            - $patch: delete
              name: PLACEHOLDER_SITES_DATA
            - $patch: delete
              name: PLACEHOLDER_LOGS_DATA
            - name: sites-data
              mountPath: /home/frappe/frappe-bench/sites
            - name: logs-data
              mountPath: /home/frappe/frappe-bench/logs
        - name: create-site
          image: docker.io/hlhd/frappe-suite:v16.33.0
          imagePullPolicy: Always
          volumeMounts:
            - $patch: delete
              name: PLACEHOLDER_SITES_DATA
            - $patch: delete
              name: PLACEHOLDER_LOGS_DATA
            - name: sites-data
              mountPath: /home/frappe/frappe-bench/sites
            - name: logs-data
              mountPath: /home/frappe/frappe-bench/logs
            - name: site-setup
              mountPath: /scripts
              readOnly: true
      containers:
        - name: backend
          image: docker.io/hlhd/frappe-suite:v16.33.0
          imagePullPolicy: Always
          volumeMounts:
            - $patch: delete
              name: PLACEHOLDER_SITES_DATA
            - $patch: delete
              name: PLACEHOLDER_LOGS_DATA
            - name: sites-data
              mountPath: /home/frappe/frappe-bench/sites
            - name: logs-data
              mountPath: /home/frappe/frappe-bench/logs
          resources:
            requests:
              cpu: "10m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
      volumes:
        - name: sites-data
          persistentVolumeClaim:
            claimName: hyrule-castle-frappe-suite-sites
        - name: logs-data
          persistentVolumeClaim:
            claimName: hyrule-castle-frappe-suite-logs
  # Remove volumeClaimTemplates - using pre-provisioned CephFS PVCs instead
  volumeClaimTemplates: []
