# The frontend runs with a read-only root, so its entrypoint can't write
# static/config.json from env; this renders the whole file and it is mounted.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dependency-track-frontend-config
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-optcp
  target:
    name: dependency-track-frontend-config
    creationPolicy: Owner
    template:
      data:
        config.json: |
          {
            "API_BASE_URL": "",
            "API_WITH_CREDENTIALS": "",
            "FEATURE_FLAGS": {
              "GLOBAL_POLICY_VIOLATION_AUDIT": true,
              "GLOBAL_VULNERABILITY_AUDIT": true
            },
            "OIDC_CLIENT_ID": "{{ .oidcClientId }}",
            "OIDC_FLOW": "code",
            "OIDC_ISSUER": "https://sso.prplanit.com",
            "OIDC_LOGIN_BUTTON_TEXT": "PrPlanIT SSO",
            "OIDC_SCOPE": "openid email profile"
          }
  data:
    - secretKey: oidcClientId
      remoteRef:
        key: apps/dependency-track/oidc
        property: CLIENT_ID
