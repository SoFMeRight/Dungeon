apiVersion: batch/v1
kind: Job
metadata:
  name: dependency-track-configuration
spec:
  template:
    spec:
      containers:
        - name: configuration
          image: ghcr.io/homelabhd/ansible:v2.22.0@sha256:bb4f24756e0c9d53c58220ae412c451101d17f802b1863e23ecd1aea2215188e
          env:
            - name: BAO_ADDR
              value: http://openbao.optcp-secrets.svc.cluster.local:8200
          resources:
            requests:
              memory: 64Mi
              cpu: 10m
            limits:
              memory: 256Mi
              cpu: 500m
