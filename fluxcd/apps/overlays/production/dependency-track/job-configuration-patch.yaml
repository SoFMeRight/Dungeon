apiVersion: batch/v1
kind: Job
metadata:
  name: dependency-track-configuration
spec:
  template:
    spec:
      containers:
        - name: configuration
          image: ghcr.io/homelabhd/ansible:v2.22.0@sha256:2fdb363113a31c1d96349cc9905e0b42871ea18acb15103f2817b767d89505af
          env:
            - name: BAO_ADDR
              value: http://openbao.optcp-secrets.svc.cluster.local:8200
          resources:
            requests:
              memory: 64Mi
              cpu: 10m
            limits:
              memory: 256Mi
              cpu: 500m
