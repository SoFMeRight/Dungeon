apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-leantime-postgres-replication
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: leantime-postgres
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/optcp-cloud/sa/leantime-postgres
      to:
        - operation:
            ports: ["5432", "8000"]
