apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: linkwarden-meilisearch
spec:
  # Held at zero for the volume re-bind into optcp-cloud.
  replicas: 0
  template:
    spec:
      containers:
        - name: meilisearch
          image: docker.io/getmeili/meilisearch:v1.56.1
          resources:
            limits:
              cpu: 372m
              memory: 112Mi
            requests:
              cpu: 100m
              memory: 41Mi
          volumeMounts:
            - name: temple-of-time-linkwarden-meilisearch-data
              mountPath: /meili_data
  volumeClaimTemplates:
    - metadata:
        name: temple-of-time-linkwarden-meilisearch-data
      spec:
        storageClassName: ceph-rbd-delete
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
