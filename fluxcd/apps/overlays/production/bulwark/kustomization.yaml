apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: optcp-delivery-bag
resources:
  - ../../../base/bulwark
  - httproute.yaml
configMapGenerator:
  - name: bulwark-env
    literals:
      - JMAP_SERVER_URL=https://mail.optcp.com
      - OAUTH_ENABLED=true
      - OAUTH_ONLY=true
      # SSO is the only way in, so skip the sign-in button and go straight to Zitadel.
      - AUTO_SSO_ENABLED=true
      - OAUTH_ISSUER_URL=https://sso.prplanit.com
      # sso.prplanit.com resolves to the gateway's in-cluster address, which the SSRF guard otherwise refuses.
      - OAUTH_ALLOW_PRIVATE_ENDPOINTS=true
      - OAUTH_POST_LOGOUT_REDIRECT_URI=https://mail.optcp.com/en/login
      # No phone-home: no telemetry, no update checks, no extension marketplace.
      - BULWARK_TELEMETRY=off
      - BULWARK_UPDATE_CHECK=off
      - EXTENSION_DIRECTORY_URL=
patches:
  - path: statefulset-patch.yaml
