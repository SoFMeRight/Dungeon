apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bulwark
  annotations:
    gatus.home-operations.com/endpoint: |
      group: "Mail (OpTCP)"
spec:
  parentRefs:
    - name: cell-membrane-gateway
      namespace: prelude-of-light
  hostnames:
    - "mail.optcp.com"
  rules:
    # Bulwark's browser client speaks JMAP straight to the server URL; serving it on this origin
    # keeps the Stalwart admin host internal.
    - matches:
        - path:
            type: Exact
            value: /.well-known/jmap
        - path:
            type: PathPrefix
            value: /jmap
      backendRefs:
        - name: stalwart
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: bulwark
          port: 3000
