apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: photoprism
spec:
  template:
    metadata:
      labels:
        policy.prplanit.com/ingress: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 2432
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: photoprism
          # photoprism is an s6-overlay image running NON-ROOT (uid 2432): preinit must chown /run
          # to the run-uid, which needs CHOWN/DAC_OVERRIDE/FOWNER to be *effective*. As a non-root
          # process that requires allowPrivilegeEscalation:true (NoNewPrivs would block raising the
          # added caps into the effective set — verified: false → "preinit: /run belongs to uid 0
          # ... lacking the privileges to fix it", exit 100). So this keeps the valuable non-root
          # property + drop-ALL + seccomp (3/4 audit dims); privesc:false is the one it can't take.
          securityContext:
            allowPrivilegeEscalation: true
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - SETUID
                - SETGID
          env:
            - name: PHOTOPRISM_SITE_URL
              value: "https://photos.pcfae.com"
            - name: PHOTOPRISM_DISABLE_TLS
              value: "true"
            - name: PHOTOPRISM_DEFAULT_TLS
              value: "false"
            - name: PHOTOPRISM_DISABLE_CHOWN
              value: "true"
