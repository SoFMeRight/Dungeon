apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: photoprism
spec:
  template:
    metadata:
      labels:
        policy.prplanit.com/ingress: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 2432
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: photoprism
          # photoprism is an s6-overlay image: preinit chowns /run to the run-uid. Runs non-root
          # (2432) but needs CHOWN/DAC_OVERRIDE/FOWNER so s6 can fix /run (fsGroup doesn't help).
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
          env:
            - name: PHOTOPRISM_SITE_URL
              value: "https://photos.pcfae.com"
            - name: PHOTOPRISM_DISABLE_TLS
              value: "true"
            - name: PHOTOPRISM_DEFAULT_TLS
              value: "false"
            - name: PHOTOPRISM_DISABLE_CHOWN
              value: "true"
