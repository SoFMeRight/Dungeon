apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dd-ui-postgres
spec:
  template:
    spec:
      imagePullSecrets:
        - name: pull-secret-cr-optcp-optcp-k8s-dungeon-public
      containers:
        - name: postgres
          image: docker.io/postgres:16-alpine
          volumeMounts:
            - name: hookshot-dd-ui-postgres-data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
  volumeClaimTemplates:
    - metadata:
        name: hookshot-dd-ui-postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: ceph-rbd-retain
        resources:
          requests:
            storage: 10Gi
