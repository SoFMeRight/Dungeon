apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: optcp-ipam

resources:
  - ../../../base/netbox
  - httproute.yaml
  - httproute-cell-membrane.yaml
  - configmap-auth.yaml

patches:
  - path: statefulset-postgres-patch.yaml
  - path: statefulset-redis-patch.yaml
  - path: statefulset-netbox-patch.yaml
  - path: service-patch.yaml
    target:
      kind: Service
      name: netbox-server
  - path: service-netbox-server-ingress-patch.yaml
    target:
      kind: Service
      name: netbox-server
  - path: hold-for-move-patch.yaml
