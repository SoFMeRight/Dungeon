apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: netbox-server
spec:
  template:
    metadata:
      labels:
        policy.prplanit.com/ingress: "true"
        policy.prplanit.com/cap.postgres: "true"
        policy.prplanit.com/access-scope-postgres: zeldas-lullaby.netbox.postgres
        policy.prplanit.com/cap.redis: "true"
        policy.prplanit.com/access-scope-redis: zeldas-lullaby.netbox.redis
        policy.prplanit.com/cap.oidc: "true"
    spec:
      initContainers:
        - name: wait-for-postgres
          image: docker.io/busybox:1.38
        - name: wait-for-redis
          image: docker.io/busybox:1.38
        - name: ensure-oidc-config
          image: docker.io/busybox:1.38
          command:
            - sh
            - -c
            - |
              CFG=/config/configuration.py
              [ -f "$CFG" ] || exit 0
              sed -i '/# BEGIN OIDC (gitops-managed)/,/# END OIDC (gitops-managed)/d' "$CFG"
              cat /auth-config/oidc.py >> "$CFG"
          volumeMounts:
            - name: zeldas-lullaby-netbox-config-data
              mountPath: /config
            - name: netbox-auth-config
              mountPath: /auth-config
      containers:
        - name: netbox
          image: docker.io/linuxserver/netbox:4.6.8
          env:
            - name: ALLOWED_HOSTS
              value: "netbox.prplanit.com,netbox.prplanit.internal,netbox.pcfae.com,10.40.9.104,10.30.1.123,10.24.96.9,127.0.0.1,172.22.30.86"
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: netbox-secrets
                  key: OIDC_CLIENT_ID
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: netbox-secrets
                  key: OIDC_CLIENT_SECRET
            - name: NETBOX_BOOTSTRAP_EMAIL
              valueFrom:
                secretKeyRef:
                  name: netbox-secrets
                  key: SUPERUSER_EMAIL
            - name: NETBOX_BOOTSTRAP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: netbox-secrets
                  key: SUPERUSER_PASSWORD
            - name: NETBOX_BOOTSTRAP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: netbox-secrets
                  key: SUPERUSER_USERNAME
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    for i in $(seq 1 60); do
                      /lsiopy/bin/python3 /app/netbox/netbox/manage.py migrate --check >/dev/null 2>&1 && break
                      sleep 5
                    done
                    /lsiopy/bin/python3 /app/netbox/netbox/manage.py shell < /auth-config/bootstrap-superuser.py || true
          volumeMounts:
            - $patch: delete
              name: PLACEHOLDER_CONFIG_DATA
            - name: zeldas-lullaby-netbox-config-data
              mountPath: /config
            - name: netbox-auth-config
              mountPath: /auth-config
          resources:
            requests:
              cpu: "500m"
              memory: "700Mi"
            limits:
              cpu: "750m"
              memory: "800Mi"
      volumes:
        - name: netbox-auth-config
          configMap:
            name: netbox-auth-config
  volumeClaimTemplates:
    - metadata:
        name: zeldas-lullaby-netbox-config-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: ceph-rbd
        resources:
          requests:
            storage: 10Gi
