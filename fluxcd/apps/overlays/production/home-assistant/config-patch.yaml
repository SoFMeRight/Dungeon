apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-config
data:
  configuration.yaml: |
    # Loads default set of integrations. Do not remove.
    default_config:

    # Load frontend themes from the themes folder
    frontend:
      themes: !include_dir_merge_named themes

    automation: !include automations.yaml
    script: !include scripts.yaml
    scene: !include scenes.yaml

    # HTTP/network settings (use_x_forwarded_for + trusted_proxies) live in .storage/http — HA
    # manages them under Settings > System > Network and reads them from there, not from this file.
    # They are seeded declaratively from the storage-http.json key below (see the seed-config init).

    # Google Assistant integration
    google_assistant:
      project_id: hass-arbitorium-com
      service_account: !include SERVICE_ACCOUNT.JSON
      report_state: true
      exposed_domains:
        - switch
        - light
      entity_config:
        lock.0x002446fffd08ea2f:
          name: Front Door (Inner) Lock
          expose: false
        lock.0x002446fffd08d4ec:
          name: Front Door (Outer) Lock
          expose: false
  # seed-config init strips any old copy of this block and re-appends it into
  # /config/configuration.yaml each boot
  auth_oidc.yaml: |
    # >>> auth_oidc (managed — regenerated by seed-config; do not edit here) >>>
    auth_oidc:
      client_id: !secret oidc_client_id
      client_secret: !secret oidc_client_secret
      discovery_url: "https://sso.prplanit.com/.well-known/openid-configuration"
      display_name: "PrPlanIT SSO"
      claims:
        username: preferred_username
        groups: roles
      roles:
        admin: owner
      features:
        automatic_user_linking: true
    # <<< auth_oidc <<<
  service-account-template.json: |
    {
      "type": "service_account",
      "project_id": "hass-arbitorium-com",
      "private_key_id": "PLACEHOLDER",
      "private_key": "PLACEHOLDER",
      "client_email": "hassio@hass-arbitorium-com.iam.gserviceaccount.com",
      "client_id": "PLACEHOLDER",
      "auth_uri": "https://accounts.google.com/o/oauth2/auth",
      "token_uri": "https://oauth2.googleapis.com/token",
      "auth_provider_x509_cert_url": "https://www.googleapis.com/oauth2/v1/certs",
      "client_x509_cert_url": "https://www.googleapis.com/robot/v1/metadata/x509/hassio%40hass-arbitorium-com.iam.gserviceaccount.com",
      "universe_domain": "googleapis.com"
    }
  # HA's migrated HTTP/network config (post- configuration.yaml `http:` deprecation). Seeded into
  # /config/.storage/http by the seed-config init only when absent, so fresh installs trust the
  # gateway/pods from first boot without the deprecated YAML block. Managed thereafter via HA's UI.
  storage-http.json: |
    {
      "version": 2,
      "minor_version": 2,
      "key": "http",
      "data": {
        "stable": {
          "use_x_forwarded_for": true,
          "trusted_proxies": [
            "192.168.144.0/20",
            "172.22.30.70/32",
            "172.22.144.0/24"
          ],
          "ssl_profile": "modern",
          "cors_allowed_origins": [
            "https://cast.home-assistant.io"
          ],
          "login_attempts_threshold": -1,
          "use_x_frame_options": true,
          "ip_ban_enabled": true,
          "server_port": 8123,
          "created_at": "2020-01-01T00:00:00+00:00",
          "error": null,
          "error_message": null
        },
        "pending": null,
        "yaml_migration_done": true
      }
    }
