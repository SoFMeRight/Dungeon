apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: home-assistant
spec:
  replicas: 1
  template:
    metadata:
      labels:
        policy.prplanit.com/ingress: "true"
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "2"
      initContainers:
        - name: seed-config
          image: docker.io/alpine/k8s:1.36.2
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
        - name: install-custom-components
          image: docker.io/alpine/k8s:1.36.2
          env:
            - name: COMP_1_NAME
              value: hacs
            # renovate: datasource=github-releases depName=hacs/integration
            - name: COMP_1_VERSION
              value: "2.0.5"
            - name: COMP_1_URL
              value: "https://github.com/hacs/integration/releases/download/2.0.5/hacs.zip"
            - name: COMP_2_NAME
              value: dreame_vacuum
            # renovate: datasource=github-releases depName=Tasshack/dreame-vacuum
            - name: COMP_2_VERSION
              value: "1.0.11"
            - name: COMP_2_URL
              value: "https://github.com/Tasshack/dreame-vacuum/releases/download/v1.0.8/dreame_vacuum.zip"
            - name: COMP_3_NAME
              value: auth_oidc
            # renovate: datasource=github-releases depName=christiaangoossens/hass-oidc-auth
            - name: COMP_3_VERSION
              value: "1.2.1"
            - name: COMP_3_URL
              value: "https://github.com/christiaangoossens/hass-oidc-auth/releases/download/v1.2.1/hass-oidc-auth.zip"
            - name: COMP_4_NAME
              value: frigate
            # renovate: datasource=github-releases depName=blakeblackshear/frigate-hass-integration
            - name: COMP_4_VERSION
              value: "5.15.4"
            - name: COMP_4_URL
              value: "https://github.com/blakeblackshear/frigate-hass-integration/archive/refs/tags/v5.15.4.zip"
            - name: COMP_4_SUBDIR
              value: "custom_components/frigate"
            - name: COMP_5_NAME
              value: ge_home
            # renovate: datasource=github-releases depName=simbaja/ha_gehome
            - name: COMP_5_VERSION
              value: "2026.8.0"
            - name: COMP_5_URL
              value: "https://github.com/simbaja/ha_gehome/archive/refs/tags/v2026.8.0.zip"
            - name: COMP_5_SUBDIR
              value: "custom_components/ge_home"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
      containers:
        - name: home-assistant
          image: ghcr.io/home-assistant/home-assistant:2026.8.3
          env:
            - name: TZ
              value: America/Los_Angeles
          readinessProbe:
            httpGet:
              path: /manifest.json
              port: 8123
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
