apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: home-assistant-private
  annotations:
    gatus.home-operations.com/endpoint: |
      group: "Security & IoT (Lens of Truth🔍)"
spec:
  parentRefs:
    - name: xylem-ingress-gateway
      namespace: kai-ingress-private
  hostnames:
    - "home.private.arbitorium.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: home-assistant
          port: 8123
