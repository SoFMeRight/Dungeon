apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wikijs-sops
  annotations:
    gatus.home-operations.com/endpoint: |
      group: "Cloud & Collaboration (OpTCP)"
spec:
  parentRefs:
    - name: phloem-gateway
      namespace: optcp-gateway-phloem
  hostnames:
    - "sops.optcp.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: wikijs-sops
          port: 3000
