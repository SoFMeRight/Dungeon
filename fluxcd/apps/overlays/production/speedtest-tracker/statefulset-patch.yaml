apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: speedtest-tracker
spec:
  replicas: 1
  template:
    metadata:
      labels:
        policy.prplanit.com/ingress: "true"
        policy.prplanit.com/cap.postgres: "true"
        policy.prplanit.com/access-scope-postgres: gossip-stone.speedtest-tracker.postgres
    spec:
      # s6-overlay (LinuxServer image) MUST init as root — s6-applyuidgid can
      # only run as root — then it drops the speedtest-tracker app to PUID/PGID
      # 1000. Forcing runAsUser:1000 here broke that (s6 couldn't set the
      # supplementary group list), so the app never started. fsGroup keeps the
      # ceph-rbd volumes writable by the dropped-to-1000 app.
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: init-storage
          image: docker.io/alpine/k8s:1.35.2
          command:
            - sh
            - -c
            - |
              mkdir -p /storage/app/public
              mkdir -p /storage/framework/cache
              mkdir -p /storage/framework/sessions
              mkdir -p /storage/framework/views
              mkdir -p /storage/logs
              echo "Storage directories created"
          volumeMounts:
            - name: app-storage
              mountPath: /storage
      containers:
        - name: speedtest-tracker
          image: docker.io/linuxserver/speedtest-tracker:1.14.5
          # Container starts as root only so s6 can drop the app to 1000; harden
          # everything around that. drop ALL + add back only what s6/nginx need
          # (setuid/setgid + setpcap for the privilege drop, chown/fowner/
          # dac_override/fsetid for /config ownership, kill for s6 supervision,
          # net_bind_service for nginx on :80/:443). Plus default seccomp.
          securityContext:
            allowPrivilegeEscalation: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
              add:
                - SETUID
                - SETGID
                - SETPCAP
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - FSETID
                - KILL
                - NET_BIND_SERVICE
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: APP_URL
              value: "https://isptest.pcfae.com"
            - name: LOG_CHANNEL
              value: "stderr"
            - name: SPEEDTEST_SCHEDULE
              value: "0 12 * * *"
            - name: SPEEDTEST_SERVERS
              value: ""
            - name: PRUNE_RESULTS_OLDER_THAN
              value: "0"
            - name: DISPLAY_TIMEZONE
              value: "America/Los_Angeles"
            - name: APP_TIMEZONE
              value: "America/Los_Angeles"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: gossip-stone-speedtest-tracker-config
              mountPath: /config
            - name: gossip-stone-speedtest-tracker-keys
              mountPath: /config/keys
            - name: run
              mountPath: /run
            - name: nginx-config
              mountPath: /config/nginx/site-confs/default.conf
              subPath: default.conf
            - name: app-storage
              mountPath: /app/www/storage
      volumes:
        - name: run
          emptyDir:
            sizeLimit: 10Mi
        - name: nginx-config
          configMap:
            name: speedtest-tracker-nginx
        - name: app-storage
          emptyDir:
            sizeLimit: 50Mi
  volumeClaimTemplates:
    - metadata:
        name: gossip-stone-speedtest-tracker-config
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: ceph-rbd
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: gossip-stone-speedtest-tracker-keys
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: ceph-rbd
        resources:
          requests:
            storage: 100Mi
