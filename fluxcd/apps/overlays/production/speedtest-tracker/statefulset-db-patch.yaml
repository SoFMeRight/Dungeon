apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: speedtest-tracker-postgres
spec:
  replicas: 1
  template:
    metadata:
      labels:
        policy.prplanit.com/access-class: postgres
        policy.prplanit.com/service-scope: gossip-stone.speedtest-tracker.postgres
    spec:
      initContainers:
        - name: init-permissions
          image: docker.io/busybox:1.38.0
          volumeMounts:
            - name: gossip-stone-speedtest-tracker-postgres
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgres
          image: docker.io/postgres:17
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: gossip-stone-speedtest-tracker-postgres
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: gossip-stone-speedtest-tracker-postgres
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: ceph-rbd
        resources:
          requests:
            storage: 5Gi
