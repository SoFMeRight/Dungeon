apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: optcp-gossip-stone
resources:
  - ../../../base/speedtest-tracker
  - httproute-xylem.yaml
  - nginx-configmap.yaml
# Held at zero for the volume re-bind into optcp-gossip-stone.
replicas:
  - name: speedtest-tracker
    count: 0
  - name: speedtest-tracker-postgres
    count: 0

patches:
  - path: statefulset-patch.yaml
    target:
      kind: StatefulSet
      name: speedtest-tracker
  - path: statefulset-db-patch.yaml
    target:
      kind: StatefulSet
      name: speedtest-tracker-postgres
  - path: service-patch.yaml
    target:
      kind: Service
      name: speedtest-tracker
  - path: service-speedtest-tracker-ingress-patch.yaml
    target:
      kind: Service
      name: speedtest-tracker
