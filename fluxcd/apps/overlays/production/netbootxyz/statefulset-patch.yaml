apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: netbootxyz
spec:
  template:
    metadata:
      labels:
        policy.prplanit.com/ingress: "true"
    spec:
      containers:
        - name: netbootxyz
          resources:
            requests:
              cpu: 2m
              memory: 153Mi
            limits:
              cpu: 78m
              memory: 153Mi
  volumeClaimTemplates:
    - metadata:
        name: config
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: ceph-rbd
        resources:
          requests:
            storage: 5Gi
    - metadata:
        name: assets
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: ceph-rbd
        resources:
          requests:
            storage: 10Gi
