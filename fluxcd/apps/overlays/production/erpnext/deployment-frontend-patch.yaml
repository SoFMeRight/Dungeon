apiVersion: apps/v1
kind: Deployment
metadata:
  name: erpnext-frontend
spec:
  template:
    metadata:
      labels:
        policy.prplanit.com/ingress: "true"
        policy.prplanit.com/cap.mariadb: "true"
        policy.prplanit.com/access-scope-mariadb: hyrule-castle.erpnext.mariadb
        policy.prplanit.com/cap.redis: "true"
        policy.prplanit.com/access-scope-redis: hyrule-castle.erpnext.redis
    spec:
      containers:
        - name: frontend
          image: docker.io/frappe/erpnext:v16.32.3
          securityContext:
            readOnlyRootFilesystem: true
          env:
            - name: UPSTREAM_REAL_IP_ADDRESS
              value: "172.22.30.71"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/lib/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: nginx-confd
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: sites-data
          persistentVolumeClaim:
            claimName: hyrule-castle-erpnext-sites
        - name: logs-data
          persistentVolumeClaim:
            claimName: hyrule-castle-erpnext-logs
        # readOnlyRootFilesystem: frappe nginx templates config into conf.d; cache/pid/tmp scratch.
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: nginx-confd
          emptyDir: {}
