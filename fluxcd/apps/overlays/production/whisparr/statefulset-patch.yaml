apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: whisparr
spec:
  replicas: 1
  template:
    metadata:
      labels:
        policy.prplanit.com/ingress: "true"
    spec:
      containers:
        - name: whisparr
          image: ghcr.io/hotio/whisparr:v2-v2.1.0@sha256:8d87b217aa5ef2480695b3c5039b10cd0a45df743de065885d0a0a49f99169ac
          env:
            - name: TZ
              value: "America/Los_Angeles"
  volumeClaimTemplates:
    - metadata:
        name: swift-sail-whisparr-config
      spec:
        storageClassName: ceph-rbd-retain
    - metadata:
        name: swift-sail-whisparr-data
      spec:
        storageClassName: ceph-rbd-retain
    - metadata:
        name: swift-sail-whisparr-downloads
      spec:
        storageClassName: ceph-rbd-retain
