# Owner-only, no SSO: stays usable when SSO is down (identity-and-access SOP).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: netalertx-private
  annotations:
    gatus.home-operations.com/endpoint: |
      group: "Privileged Telemetry (Lakitu☁️)"
spec:
  parentRefs:
    - name: xylem-ingress-gateway
      namespace: kai-ingress-private
  hostnames:
    - "hosts.private.optcp.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: netalertx
          port: 20211
