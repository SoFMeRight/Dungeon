apiVersion: apps/v1
kind: Deployment
metadata:
  name: opnform-api
spec:
  # Held at zero for the volume re-bind into optcp-cloud.
  replicas: 0
  template:
    spec:
      containers:
        - name: api
          securityContext:
            readOnlyRootFilesystem: true
          volumeMounts:
            # readOnlyRootFilesystem: Laravel storage is on the PVC, but bootstrap/cache
            # (compiled config/routes) is written under the app root at boot; /tmp for PHP.
            - name: tmp
              mountPath: /tmp
            - name: bootstrap-cache
              mountPath: /usr/share/nginx/html/bootstrap/cache
      volumes:
        - name: tmp
          emptyDir: {}
        - name: bootstrap-cache
          emptyDir: {}
