apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: opnform
  annotations:
    gatus.home-operations.com/endpoint: |
      group: "Business Apps (Hyrule Castle🏰)"
spec:
  parentRefs:
    - name: cell-membrane-gateway
      namespace: prelude-of-light
      sectionName: https-prplanit
  hostnames:
    - "form.prplanit.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: opnform-ingress
          port: 80
