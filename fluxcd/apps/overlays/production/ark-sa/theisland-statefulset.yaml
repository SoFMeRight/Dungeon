apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ark-sa-tmc-theisland
spec:
  serviceName: ark-sa-tmc-theisland
  replicas: 1
  selector:
    matchLabels:
      app: ark-sa-tmc-theisland
  template:
    metadata:
      labels:
        app: ark-sa-tmc-theisland
        policy.prplanit.com/probe: "true"
    spec:
      serviceAccountName: ark-sa-tmc-theisland
      enableServiceLinks: false
      imagePullSecrets:
        - name: cr-pcfae-admin-pull-secret
      securityContext:
        fsGroup: 7777
      containers:
        - name: theisland
          image: docker.io/acekorneya/asa_server:2_1_latest
          command: ["/bin/bash", "-c"]
          args:
            - |
              # Nuke corrupted Proton prefix so proton rebuilds it properly with WINED3D
              rm -rf /home/pok/.steam/steam/steamapps/compatdata/2430930
              python3 /health/health-server.py &
              exec /home/pok/scripts/init.sh
          ports:
            - containerPort: 8777
              protocol: UDP
              name: game
            - containerPort: 8777
              protocol: TCP
              name: game-tcp
            - containerPort: 28020
              protocol: TCP
              name: rcon
            - containerPort: 8778
              protocol: UDP
              name: query
            - containerPort: 8080
              protocol: TCP
              name: health
          env:
            - name: PUID
              value: "1001"
            - name: PGID
              value: "1001"
            - name: INSTANCE_NAME
              value: theisland
            - name: TZ
              value: America/Los_Angeles
            - name: MAP_NAME
              value: TheIsland_WP
            - name: SESSION_NAME
              value: The Master Chiefers - The Island
            - name: SERVER_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ark-asa-admin
                  key: admin-password
            - name: SERVER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ark-asa-admin
                  key: server-password
            - name: ASA_PORT
              value: "8777"
            - name: QUERY_PORT
              value: "8778"
            - name: RCON_PORT
              value: "28020"
            - name: MAX_PLAYERS
              value: "70"
            - name: CLUSTER_ID
              value: the-master-chiefers
            - name: RCON_ENABLED
              value: "TRUE"
            - name: UPDATE_SERVER
              value: "TRUE"
            - name: CHECK_FOR_UPDATE_INTERVAL
              value: "24"
            - name: BATTLEEYE
              value: "FALSE"
            - name: PUBLIC_IP
              valueFrom:
                secretKeyRef:
                  name: ark-asa-admin
                  key: public-ip
            - name: SDL_VIDEODRIVER
              value: x11
            - name: DISPLAY
              value: ":0"
            - name: PROTON_USE_WINED3D
              value: "1"
            - name: CUSTOM_SERVER_ARGS
              value: "-ServerPlatform=ALL -PublicIPForEpic=71.24.190.218 -ServerIP=71.24.190.218 -OverrideOfficialDifficulty=5.0"
          resources:
            limits:
              cpu: "1.5"
              memory: 16Gi
            requests:
              cpu: "1"
              memory: 8Gi
          volumeMounts:
            - name: serverfiles
              mountPath: /home/pok/arkserver
            - name: shooting-gallery-ark-sa-tmc-theisland-saved
              mountPath: /home/pok/arkserver/ShooterGame/Saved
            - name: cluster
              mountPath: /home/pok/arkserver/ShooterGame/Saved/clusters
            - name: steamapps
              mountPath: /home/pok/.steam/steam/steamapps
            - name: health-proxy
              mountPath: /health
      volumes:
        - name: health-proxy
          configMap:
            name: ark-health-proxy
            defaultMode: 0755
        - name: serverfiles
          persistentVolumeClaim:
            claimName: ark-sa-serverfiles-pvc
        - name: cluster
          persistentVolumeClaim:
            claimName: ark-sa-cluster-pvc
        - name: steamapps
          persistentVolumeClaim:
            claimName: ark-sa-steamapps-pvc
  volumeClaimTemplates:
    - metadata:
        name: shooting-gallery-ark-sa-tmc-theisland-saved
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 50Gi
