apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ark-sa-tmc-theisland
spec:
  serviceName: ark-sa-tmc-theisland
  replicas: 1
  selector:
    matchLabels:
      app: ark-sa-tmc-theisland
  template:
    metadata:
      labels:
        app: ark-sa-tmc-theisland
        policy.prplanit.com/probe: "true"
      annotations:
        # Reinstallable ASA server binaries + Steam download cache (both SteamCMD-restorable), and
        # the Proton prefix, rebuilt on every start.
        # Kept out of Velero fs-backup; the saved/ volume holds the irreplaceable world state
        # and stays backed up.
        backup.velero.io/backup-volumes-excludes: serverfiles,steamapps,compatdata
    spec:
      serviceAccountName: ark-sa-tmc-theisland
      enableServiceLinks: false
      imagePullSecrets:
        - name: cr-pcfae-admin-pull-secret
      # acekorneya ASA runs the server via Proton/Wine as uid 7777 (non-root). Canary for the drop-ALL
      # + NoNewPrivs posture — revert to the prior (default-caps) form if Proton's prefix rebuild breaks.
      securityContext:
        runAsNonRoot: true
        runAsUser: 7777
        runAsGroup: 7777
        fsGroup: 7777
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: theisland
          image: docker.io/acekorneya/asa_server:2_1_latest@sha256:1278d8e1c3347f4fe0141ac28f8e471b1aacf22e67f429cc9298dbe32e3f9023
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            # RuntimeDefault plus futex_waitv, so Proton gets fsync instead of
            # wineserver round trips (ansible/k8s/tuning/seccomp-proton-fsync.yaml).
            seccompProfile:
              type: Localhost
              localhostProfile: profiles/proton-fsync.json
          command: ["/bin/bash", "-c"]
          args:
            - |
              # Nuke corrupted Proton prefix so proton rebuilds it properly with WINED3D. The prefix
              # is this pod's own emptyDir (compatdata below), so this never touches the other map's.
              rm -rf /home/pok/.steam/steam/steamapps/compatdata/2430930
              # PUBLIC_IP (PUBLIC_IP in Vault, optional) is the address Epic lists the server at:
              # set it for a static IP, or to "epic" to leave it to ARK. Unset, it is detected at every
              # start the way cloudflare-ddns does (Cloudflare's trace), so a WAN change is picked up on
              # the next restart; if that fails too, it is left to ARK.
              if [ -z "$PUBLIC_IP" ]; then
                PUBLIC_IP=$(curl -fsS --max-time 10 https://1.1.1.1/cdn-cgi/trace | sed -n 's/^ip=//p')
              fi
              if [ -n "$PUBLIC_IP" ] && [ "$PUBLIC_IP" != epic ]; then
                export PUBLIC_IP CUSTOM_SERVER_ARGS="$CUSTOM_SERVER_ARGS -PublicIPForEpic=$PUBLIC_IP -ServerIP=$PUBLIC_IP"
              else
                echo "PUBLIC_IP: not set or detected, leaving the public IP to ARK" >&2
              fi
              python3 /health/health-server.py &
              exec /home/pok/scripts/init.sh
          ports:
            - containerPort: 8777
              protocol: UDP
              name: game
            - containerPort: 8777
              protocol: TCP
              name: game-tcp
            - containerPort: 28020
              protocol: TCP
              name: rcon
            - containerPort: 8778
              protocol: UDP
              name: query
            - containerPort: 8080
              protocol: TCP
              name: health
          env:
            - name: PUID
              value: "1001"
            - name: PGID
              value: "1001"
            - name: INSTANCE_NAME
              value: theisland
            - name: TZ
              value: America/Los_Angeles
            - name: MAP_NAME
              value: TheIsland_WP
            - name: SESSION_NAME
              value: The Master Chiefers - The Island
            - name: SERVER_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ark-asa-admin
                  key: admin-password
            - name: SERVER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ark-asa-admin
                  key: server-password
            - name: ASA_PORT
              value: "8777"
            - name: QUERY_PORT
              value: "8778"
            - name: RCON_PORT
              value: "28020"
            - name: MAX_PLAYERS
              value: "70"
            - name: CLUSTER_ID
              value: the-master-chiefers
            - name: RCON_ENABLED
              value: "TRUE"
            - name: UPDATE_SERVER
              value: "TRUE"
            - name: CHECK_FOR_UPDATE_INTERVAL
              value: "24"
            - name: BATTLEEYE
              value: "FALSE"
            - name: PUBLIC_IP
              valueFrom:
                secretKeyRef:
                  name: ark-asa-admin
                  key: PUBLIC_IP
                  optional: true
            - name: SDL_VIDEODRIVER
              value: x11
            - name: DISPLAY
              value: ":0"
            - name: PROTON_USE_WINED3D
              value: "1"
            - name: CUSTOM_SERVER_ARGS
              value: "-ServerPlatform=ALL -OverrideOfficialDifficulty=5.0"
          resources:
            limits:
              cpu: "1.5"
              memory: 16Gi
            requests:
              cpu: "1"
              memory: 8Gi
          volumeMounts:
            - name: serverfiles
              mountPath: /home/pok/arkserver
            - name: saved
              mountPath: /home/pok/arkserver/ShooterGame/Saved
            - name: cluster
              mountPath: /home/pok/arkserver/ShooterGame/Saved/clusters
            - name: steamapps
              mountPath: /home/pok/.steam/steam/steamapps
            # Each map gets its own Proton prefix: on the shared steamapps volume, one map's start
            # wiped the prefix the other was running from, and the server died before logging.
            - name: compatdata
              mountPath: /home/pok/.steam/steam/steamapps/compatdata
            - name: health-proxy
              mountPath: /health
      volumes:
        - name: compatdata
          emptyDir:
            sizeLimit: 4Gi
        - name: health-proxy
          configMap:
            name: ark-health-proxy
            defaultMode: 0755
        - name: serverfiles
          persistentVolumeClaim:
            claimName: ark-sa-serverfiles-pvc
        - name: cluster
          persistentVolumeClaim:
            claimName: ark-sa-cluster-pvc
        - name: steamapps
          persistentVolumeClaim:
            claimName: ark-sa-steamapps-pvc
  volumeClaimTemplates:
    - metadata:
        name: saved
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 50Gi
