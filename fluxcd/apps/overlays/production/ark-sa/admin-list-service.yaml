---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ark-sa-tmc-admin-list-source
spec:
  refreshInterval: 30s
  secretStoreRef:
    name: openbao-operationtimecapsule
    kind: ClusterSecretStore
  target:
    name: ark-sa-tmc-admin-list-source
    creationPolicy: Owner
  data:
    - secretKey: AdminListURL
      remoteRef:
        key: apps/ark-sa-tmc
        property: AdminListURL
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ark-sa-tmc-admin-list-njs
data:
  admin-list.js: |
    import fs from 'fs';

    function parseAdminList(text) {
      var steamIds = {};
      if (!text) return steamIds;

      var lines = text.split('\n');
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i].trim();
        if (!line || line.startsWith('#')) continue;

        var match = line.match(/^([0-9a-f]{32})\s*(#.*)?$/i);
        if (match) {
          var steamId = match[1].toLowerCase();
          var comment = match[2] || '';
          steamIds[steamId] = comment;
        }
      }

      return steamIds;
    }

    function mergeAdminLists(lists) {
      var merged = {};
      for (var i = 0; i < lists.length; i++) {
        var list = lists[i];
        for (var steamId in list) {
          if (!merged[steamId]) {
            merged[steamId] = list[steamId];
          }
        }
      }
      return merged;
    }

    function formatAdminList(steamIds) {
      var lines = [];
      for (var steamId in steamIds) {
        lines.push(steamId);
      }
      return lines.join('\n') + '\n';
    }

    function assembleAdminList(r) {
      try {
        var secretPath = '/vault-data';
        var files = fs.readdirSync(secretPath);
        var lists = [];

        for (var i = 0; i < files.length; i++) {
          try {
            var content = fs.readFileSync(secretPath + '/' + files[i], 'utf8');
            var parsed = parseAdminList(content);
            var hasEntries = false;
            for (var key in parsed) {
              hasEntries = true;
              break;
            }
            if (hasEntries) {
              lists.push(parsed);
            }
          } catch (e) {
            // Skip files that can't be read
          }
        }

        var merged = mergeAdminLists(lists);
        var output = formatAdminList(merged);

        r.headersOut['Content-Type'] = 'text/plain';
        r.return(200, output);
      } catch (error) {
        r.return(500, 'Error: ' + error.message + '\n');
      }
    }

    export default { assembleAdminList };
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ark-sa-tmc-admin-list-nginx-conf
data:
  nginx.conf: |
    load_module modules/ngx_http_js_module.so;
    # Non-root nginx: log via the stderr keyword (inherited fd, dodges the /dev/stderr reopen
    # EACCES that hits non-root); pid + temp paths under the /tmp emptyDir.
    error_log stderr notice;
    pid /tmp/nginx.pid;

    events {
      worker_connections 1024;
    }

    http {
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;
      access_log off;
      js_path "/etc/nginx/njs/";
      js_import admin from admin-list.js;

      server {
        listen 8080;
        server_name _;

        location /AllowedCheaterSteamIDs.txt {
          js_content admin.assembleAdminList;
        }

        location /PlayersJoinNoCheckList.txt {
          js_content admin.assembleAdminList;
        }

        location /PlayersExclusiveJoinList.txt {
          js_content admin.assembleAdminList;
        }

        location / {
          return 404 "Not Found\n";
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ark-sa-tmc-admin-list-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ark-sa-tmc-admin-list-server
  template:
    metadata:
      labels:
        app: ark-sa-tmc-admin-list-server
      annotations:
        vault-data-version: "1"
    spec:
      serviceAccountName: ark-sa-tmc-admin-list-server
      # Full non-root: nginx serves the admin lists on the unprivileged :8080 (config via the
      # nginx-conf configmap — stderr logging + /tmp pid/temp), run as the image's nginx uid 101.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: docker.io/library/nginx:alpine
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: njs-script
              mountPath: /etc/nginx/njs
            - name: vault-data
              mountPath: /vault-data
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-conf
          configMap:
            name: ark-sa-tmc-admin-list-nginx-conf
        - name: njs-script
          configMap:
            name: ark-sa-tmc-admin-list-njs
        - name: vault-data
          secret:
            secretName: ark-sa-tmc-admin-list-source
---
apiVersion: v1
kind: Service
metadata:
  name: ark-sa-tmc-admin-list-server
  annotations:
    lbipam.cilium.io/ips: "172.22.30.231"
    lbipam.cilium.io/sharing-key: "shooting-gallery"
spec:
  type: LoadBalancer
  selector:
    app: ark-sa-tmc-admin-list-server
  ports:
    - port: 28019
      targetPort: 8080
      protocol: TCP
      name: http
