apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ark-asa-admin
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-optcp
    kind: ClusterSecretStore
  target:
    name: ark-asa-admin
    creationPolicy: Owner
  # SERVER_PUBLIC_IP is optional, so it comes from the whole-path extract (a missing data
  # property fails the sync).
  dataFrom:
    - extract:
        key: apps/ark-sa/app
  data:
    - secretKey: admin-password
      remoteRef:
        key: apps/ark-sa/app
        property: SERVER_ADMIN_PASSWORD
    - secretKey: server-password
      remoteRef:
        key: apps/ark-sa/app
        property: SERVER_PASSWORD
