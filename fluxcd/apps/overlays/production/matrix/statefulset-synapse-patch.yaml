apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: matrix-synapse
spec:
  template:
    metadata:
      labels:
        policy.prplanit.com/access-scope-postgres: outspokekin-delivery-bag.matrix.postgres
    spec:
      containers:
        - name: synapse
          image: ghcr.io/homelabhd/synapse:v1.165.0@sha256:77032bdc13cc8776475c6b8158658cec054d6557b14b0728376fd934c6ecd230
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: ceph-rbd
        resources:
          requests:
            # Only the signing key, config state and the pid file. It is separate from
            # media so unbounded media growth cannot fill the volume holding this
            # server's federation identity.
            storage: 5Gi
    - metadata:
        name: media
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: ceph-rbd
        resources:
          requests:
            storage: 50Gi
