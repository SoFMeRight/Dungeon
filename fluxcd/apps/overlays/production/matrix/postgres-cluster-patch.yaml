apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: matrix-postgres
spec:
  # Shutdown has to fit the node's grace budget: 150s total, 30s reserved for
  # critical pods, so 120s for ordinary ones. Postgres does not checkpoint until
  # the smart phase stops waiting for clients to disconnect, so a long smart
  # timeout means the SIGKILL lands before anything is flushed. Short smart, then
  # fast shutdown does the checkpoint well inside the remaining budget.
  smartShutdownTimeout: 10
  stopDelay: 60
  # Requests lift this out of BestEffort so the kubelet does not reclaim the database
  # first under node pressure. Sized from observed use (~537Mi resident): memory is what
  # drives eviction, so the request carries the headroom.
  resources:
    requests:
      memory: "768Mi"
      cpu: "100m"
    limits:
      memory: "768Mi"
      cpu: "1000m"

  # Labels on the Cluster object stay on the Cluster; only inheritedMetadata reaches the
  # pods, which is what the network policies actually select. Without this the operator
  # cannot reach its own instances to read their status, so it reports a communication
  # issue and declines to manage the cluster — including creating the second instance.
  inheritedMetadata:
    # Alloy finds scrape targets from these annotations on the pod, not from a
    # PodMonitor, so without them nothing collects the backup and WAL metrics the
    # instances already publish on 9187. enablePodMonitor is inert on this estate.
    annotations:
      backup.velero.io/backup-volumes-excludes: "pgdata,scratch-data,shm,plugins"
      prometheus.io/scrape: "true"
      prometheus.io/port: "9187"
    labels:
      policy.prplanit.com/cnpg: "managed"
      policy.prplanit.com/access-class: postgres
      policy.prplanit.com/service-scope: outspokekin-delivery-bag.matrix.postgres
      policy.prplanit.com/cap.s3-nas: "true"
      policy.prplanit.com/access-scope-s3-nas: gringotts.seaweedfs

  # Three, so the synchronous standby below always has a spare: with two, draining the
  # replica's node would leave no standby to confirm a commit and block every write.
  instances: 3

  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie
  postgresql:
    # A commit is acknowledged only once a standby has it. Asynchronous, the failover at
    # 2026-11-23 08:00 promoted a replica missing the last writes while Synapse kept
    # running: its stream positions stayed ahead of the rolled-back sequences, so new
    # to-device messages took ids clients had already acknowledged and were deleted
    # undelivered (lost E2EE room keys).
    synchronous:
      method: any      # Any 1 replica can acknowledge
      number: 1        # At least 1 replica must confirm writes

    parameters:
      shared_buffers: "256MB"
      max_connections: "200"
  storage:
    # Retain, like every other class here except ceph-rbd-delete.
    storageClass: ceph-rbd
    size: 20Gi
