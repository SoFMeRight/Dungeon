apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: matrix-postgres
spec:
  instances: 2
  postgresql:
    parameters:
      shared_buffers: "256MB"
      max_connections: "200"
  storage:
    # Retain, like every other class here except ceph-rbd-delete.
    storageClass: ceph-rbd
    size: 20Gi
