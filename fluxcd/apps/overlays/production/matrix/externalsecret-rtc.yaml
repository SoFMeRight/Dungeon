# The whole LiveKit config is rendered from Vault rather than split across a ConfigMap:
# the API keys and the TURN credentials it hands to clients are secret, and LiveKit reads
# a single config file with no include mechanism to separate them.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: matrix-livekit-config
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-outspokekin
    kind: ClusterSecretStore
  target:
    name: matrix-livekit-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        config.yaml: |
          port: 7880
          bind_addresses: ["0.0.0.0"]
          log_level: info

          rtc:
            tcp_port: 7881
            port_range_start: 50000
            port_range_end: 50100
            # STUNner relays media to this pod, so the address clients need is STUNner's,
            # never the node's. Advertising an external IP here would publish a path that
            # is not open on the firewall and stall ICE.
            use_external_ip: false
            # LiveKit is what tells clients where to find TURN. STUNner authenticates with
            # a static credential here because LiveKit hands out a fixed pair rather than
            # minting time-windowed ones; the UDPRoute is what keeps that from mattering,
            # since a relay allocated with it can only reach this service.
            turn_servers:
              - host: turn.outspokekin.com
                port: 3479
                protocol: udp
                username: "{{ .turn_username }}"
                credential: "{{ .turn_password }}"

          keys:
            {{ .livekit_key }}: "{{ .livekit_secret }}"

          room:
            # The authorization service decides who may open a room. Left on, LiveKit would
            # create one for any caller that reaches it and that decision would be moot.
            auto_create: false

          webhook:
            api_key: {{ .livekit_key }}
            urls:
              # The neighbouring service, not its public URL: the SFU signs these and the
              # authorization service verifies the signature, so routing them out through
              # the gateway and back would add a hairpin and prove nothing.
              - http://matrix-lk-jwt:8080/sfu_webhook
  data:
    - secretKey: livekit_key
      remoteRef:
        key: apps/matrix-synapse
        property: LIVEKIT_API_KEY
    - secretKey: livekit_secret
      remoteRef:
        key: apps/matrix-synapse
        property: LIVEKIT_API_SECRET
    - secretKey: turn_username
      remoteRef:
        key: apps/matrix-synapse
        property: TURN_USERNAME
    - secretKey: turn_password
      remoteRef:
        key: apps/matrix-synapse
        property: TURN_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: matrix-lk-jwt-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-outspokekin
    kind: ClusterSecretStore
  target:
    name: matrix-lk-jwt-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Reached in-cluster: the public name resolves to the ingress, which would send
        # the service back out through the gateway to reach a neighbour.
        LIVEKIT_URL: "ws://matrix-livekit:7880"
        LIVEKIT_KEY: "{{ .livekit_key }}"
        LIVEKIT_SECRET: "{{ .livekit_secret }}"
        # Only users of this homeserver may open rooms on the SFU. A wildcard would let
        # any server that can reach the service allocate capacity here.
        LIVEKIT_FULL_ACCESS_HOMESERVERS: "outspokekin.com"
  data:
    - secretKey: livekit_key
      remoteRef:
        key: apps/matrix-synapse
        property: LIVEKIT_API_KEY
    - secretKey: livekit_secret
      remoteRef:
        key: apps/matrix-synapse
        property: LIVEKIT_API_SECRET
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: matrix-turn-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-outspokekin
    kind: ClusterSecretStore
  target:
    name: matrix-turn-auth
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        type: "static"
        username: "{{ .turn_username }}"
        password: "{{ .turn_password }}"
  data:
    - secretKey: turn_username
      remoteRef:
        key: apps/matrix-synapse
        property: TURN_USERNAME
    - secretKey: turn_password
      remoteRef:
        key: apps/matrix-synapse
        property: TURN_PASSWORD
