# The whole LiveKit config is rendered from Vault rather than split across a ConfigMap:
# the API keys and the TURN credentials it hands to clients are secret, and LiveKit reads
# a single config file with no include mechanism to separate them.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: matrix-livekit-config
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-outspokekin
    kind: ClusterSecretStore
  target:
    name: matrix-livekit-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        config.yaml: |
          port: 7880
          bind_addresses: ["0.0.0.0"]
          log_level: info

          rtc:
            tcp_port: 7881
            port_range_start: 50000
            port_range_end: 50100
            # STUNner relays media to this pod, so the address clients need is STUNner's,
            # never the node's. Advertising an external IP here would publish a path that
            # is not open on the firewall and stall ICE.
            use_external_ip: false
            # LiveKit is what tells clients where to find TURN. STUNner authenticates with
            # a static credential here because LiveKit hands out a fixed pair rather than
            # minting time-windowed ones; the UDPRoute is what keeps that from mattering,
            # since a relay allocated with it can only reach this service.
            turn_servers:
              - host: turn.outspokekin.com
                port: 3479
                protocol: udp
                username: "{{ .turn_username }}"
                credential: "{{ .turn_password }}"

          keys:
            {{ .livekit_key }}: "{{ .livekit_secret }}"

          room:
            # The authorization service decides who may open a room. Left on, LiveKit would
            # create one for any caller that reaches it and that decision would be moot.
            auto_create: false

          webhook:
            api_key: {{ .livekit_key }}
            urls:
              # The neighbouring service, not its public URL: the SFU signs these and the
              # authorization service verifies the signature, so routing them out through
              # the gateway and back would add a hairpin and prove nothing.
              - http://matrix-lk-jwt:8080/sfu_webhook
  data:
    - secretKey: livekit_key
      remoteRef:
        key: apps/matrix-synapse
        property: LIVEKIT_API_KEY
    - secretKey: livekit_secret
      remoteRef:
        key: apps/matrix-synapse
        property: LIVEKIT_API_SECRET
    - secretKey: turn_username
      remoteRef:
        key: apps/matrix-synapse
        property: TURN_USERNAME
    - secretKey: turn_password
      remoteRef:
        key: apps/matrix-synapse
        property: TURN_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: matrix-lk-jwt-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-outspokekin
    kind: ClusterSecretStore
  target:
    name: matrix-lk-jwt-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Handed to the browser as the SFU's address, so it must be the public one — an
        # in-cluster name here resolves to nothing on the caller's machine.
        LIVEKIT_URL: "wss://livekit.outspokekin.com/livekit/sfu"
        LIVEKIT_KEY: "{{ .livekit_key }}"
        LIVEKIT_SECRET: "{{ .livekit_secret }}"
        # Only users of this homeserver may open rooms on the SFU. A wildcard would let
        # any server that can reach the service allocate capacity here.
        LIVEKIT_FULL_ACCESS_HOMESERVERS: "outspokekin.com"
        LIVEKIT_LOG_LEVEL: "info"
        # ── application service mode (MSC4195/4512) ──
        # Synapse mediates between clients and the SFU instead of clients calling this
        # service directly. as_token authenticates this service TO the homeserver;
        # hs_token authenticates the homeserver TO this service. They are not
        # interchangeable and both appear in the registration Synapse reads.
        LIVEKIT_AS_TOKEN: "{{ .as_token }}"
        LIVEKIT_HS_TOKEN: "{{ .hs_token }}"
        LIVEKIT_HS_SERVER_NAME: "outspokekin.com"
        # Without this the service resolves the server name through .well-known and
        # reaches matrix.outspokekin.com — which from inside the cluster is the gateway
        # VIP, the hairpin that the gateway's world-only ingress drops. Naming the
        # in-cluster Service keeps the call on the mesh path the AuthorizationPolicy
        # already allows.
        LIVEKIT_CS_API_URL_OVERRIDES: "outspokekin.com=http://matrix-synapse.temple-of-time.svc.cluster.local:8008"
  data:
    - secretKey: livekit_key
      remoteRef:
        key: apps/matrix-synapse
        property: LIVEKIT_API_KEY
    - secretKey: livekit_secret
      remoteRef:
        key: apps/matrix-synapse
        property: LIVEKIT_API_SECRET
    - secretKey: as_token
      remoteRef:
        key: apps/matrix-synapse
        property: LIVEKIT_AS_TOKEN
    - secretKey: hs_token
      remoteRef:
        key: apps/matrix-synapse
        property: LIVEKIT_HS_TOKEN
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: matrix-turn-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-outspokekin
    kind: ClusterSecretStore
  target:
    name: matrix-turn-auth
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        type: "static"
        username: "{{ .turn_username }}"
        password: "{{ .turn_password }}"
  data:
    - secretKey: turn_username
      remoteRef:
        key: apps/matrix-synapse
        property: TURN_USERNAME
    - secretKey: turn_password
      remoteRef:
        key: apps/matrix-synapse
        property: TURN_PASSWORD
---
# The application service registration. It is a SEPARATE file from conf.d: everything in
# that directory is parsed as homeserver config, so the registration cannot live there —
# it is mounted at its own path and referenced by app_service_config_files.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: matrix-synapse-appservices
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-outspokekin
    kind: ClusterSecretStore
  target:
    name: matrix-synapse-appservices
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        lk-jwt.yaml: |
          id: "LiveKit JWT service"
          as_token: "{{ .as_token }}"
          hs_token: "{{ .hs_token }}"
          sender_localpart: "_lk_jwt_service"
          # The service checks room membership for any local user without joining rooms
          # itself, so the namespace has to cover everyone — and non-exclusively, or it
          # would claim the whole user namespace away from the homeserver.
          namespaces:
            users:
              - exclusive: false
                regex: ".*"
          # No event traffic is wanted; a URL here would have Synapse push transactions.
          url: null
          # Key names are the PREFIXED, PLURAL forms Synapse actually parses. The
          # lk-jwt-service README shows `scopes`, singular `io.element.msc4502.scope`
          # and unprefixed proxy_* — Synapse ignores those silently, so a registration
          # copied from it parses cleanly and does nothing.
          io.element.msc4502.scopes:
            - "urn:matrix:client:io.element.msc4502:rooms:is_joined"
          io.element.msc4512.proxy_prefix: "rtc/livekit"
          io.element.msc4512.proxy_url: "http://matrix-lk-jwt.temple-of-time.svc.cluster.local:8080"
  data:
    - secretKey: as_token
      remoteRef:
        key: apps/matrix-synapse
        property: LIVEKIT_AS_TOKEN
    - secretKey: hs_token
      remoteRef:
        key: apps/matrix-synapse
        property: LIVEKIT_HS_TOKEN
