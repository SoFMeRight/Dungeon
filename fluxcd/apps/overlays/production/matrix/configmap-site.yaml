apiVersion: v1
kind: ConfigMap
metadata:
  name: matrix-synapse-site
data:
  site.yaml: |
    # The server name is the identity half of every user ID and is written into every room
    # and event once this server federates. It is the apex; the software answers on a
    # subdomain the apex delegates to via /.well-known/matrix/server. Changing it later
    # orphans every remote connection, so it is not a value to revisit.
    server_name: outspokekin.com
    public_baseurl: https://matrix.outspokekin.com/

    max_upload_size: 100M

    # Synapse serves its own /.well-known/matrix/client from public_baseurl, and a client
    # pointed at the homeserver reads THAT one rather than the apex's. Without the auth
    # block there it finds no delegated-auth metadata, falls back to the legacy login
    # flows — which MAS disables — and reports that the server offers no usable login.
    extra_well_known_client_content:
      org.matrix.msc2965.authentication:
        issuer: https://matrix-auth.outspokekin.com/
        account: https://matrix-auth.outspokekin.com/account/
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: matrix-auth-site
data:
  site.yaml: |
    http:
      public_base: https://matrix-auth.outspokekin.com/
      issuer: https://matrix-auth.outspokekin.com/
    matrix:
      homeserver: outspokekin.com
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: matrix-element-config
data:
  # Every value here names this deployment, so the whole file lives in the overlay rather
  # than being a base file full of placeholders.
  config.json: |
    {
      "default_server_config": {
        "m.homeserver": {
          "base_url": "https://matrix.outspokekin.com",
          "server_name": "outspokekin.com"
        }
      },
      "brand": "Outspoke Kin",
      "disable_custom_urls": true,
      "disable_guests": true,
      "default_country_code": "US",
      "show_labs_settings": false,
      "room_directory": {
        "servers": ["outspokekin.com"]
      }
    }
