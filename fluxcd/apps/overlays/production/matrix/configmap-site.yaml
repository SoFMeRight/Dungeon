apiVersion: v1
kind: ConfigMap
metadata:
  name: matrix-synapse-site
data:
  site.yaml: |
    # The server name is the identity half of every user ID and is written into every room
    # and event once this server federates. It is the apex; the software answers on a
    # subdomain the apex delegates to via /.well-known/matrix/server. Changing it later
    # orphans every remote connection, so it is not a value to revisit.
    server_name: outspokekin.com
    public_baseurl: https://matrix.outspokekin.com/

    max_upload_size: 100M

    # Synapse serves its own /.well-known/matrix/client from public_baseurl, and a client
    # pointed at the homeserver reads THAT one rather than the apex's. Without the auth
    # block there it finds no delegated-auth metadata, falls back to the legacy login
    # flows — which MAS disables — and reports that the server offers no usable login.
    extra_well_known_client_content:
      org.matrix.msc2965.authentication:
        issuer: https://matrix-auth.outspokekin.com/
        account: https://matrix-auth.outspokekin.com/account/
      # Clients that already know the homeserver read discovery from here rather than
      # from the apex, so the call backend has to be advertised in both places.
      org.matrix.msc4143.rtc_foci:
        - type: livekit
          livekit_service_url: https://livekit.outspokekin.com/livekit/jwt

    # Element Call needs all three: room summaries for knocking, the MatrixRTC transports
    # endpoint, and sync v2 state_after so a client tracks who is actually in the call.
    experimental_features:
      msc3266_enabled: true
      msc4143_enabled: true
      msc4222_enabled: true

    # A client schedules its own departure event when it joins, then keeps postponing it.
    # If it drops off the network the delay expires and the call stops showing a ghost.
    max_event_delay_duration: 24h

    rc_message:
      # Encryption key sharing arrives in bursts; the stock limit throttles it and members
      # of a call end up unable to decrypt each other.
      per_second: 0.5
      burst_count: 30

    rc_delayed_event_mgmt:
      # The heartbeat that keeps the departure event postponed runs every five seconds.
      per_second: 1
      burst_count: 20

    matrix_rtc:
      transports:
        - type: livekit
          livekit_service_url: https://livekit.outspokekin.com/livekit/jwt
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: matrix-auth-site
data:
  site.yaml: |
    http:
      public_base: https://matrix-auth.outspokekin.com/
      issuer: https://matrix-auth.outspokekin.com/
    matrix:
      homeserver: outspokekin.com
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: matrix-element-config
data:
  # Every value here names this deployment, so the whole file lives in the overlay rather
  # than being a base file full of placeholders.
  #
  # default_server_name rather than default_server_config: the config form supplies the
  # homeserver verbatim and skips .well-known discovery, so Element never sees the
  # delegated-auth metadata and reports that the server offers no usable login flows.
  config.json: |
    {
      "default_server_name": "outspokekin.com",
      "brand": "Outspoke Kin",
      "disable_custom_urls": true,
      "disable_guests": true,
      "default_country_code": "US",
      "show_labs_settings": false,
      "room_directory": {
        "servers": ["outspokekin.com"]
      },
      "element_call": {
        "brand": "Outspoke Kin Calls",
        "guest_spa_url": "https://matrix-call.outspokekin.com"
      },
      "setting_defaults": {
        "UIFeature.identityServer": false
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: matrix-element-call-config
data:
  # The SFU is named here as a fallback, not as the primary source: the app asks the
  # homeserver for its transports first and only reads this when that lookup returns
  # nothing, which is the difference between a call failing outright and it connecting.
  config.json: |
    {
      "default_server_config": {
        "m.homeserver": {
          "base_url": "https://matrix.outspokekin.com",
          "server_name": "outspokekin.com"
        }
      },
      "livekit": {
        "livekit_service_url": "https://livekit.outspokekin.com/livekit/jwt"
      }
    }
