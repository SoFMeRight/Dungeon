apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: matrix-wellknown
  annotations:
    gatus.home-operations.com/endpoint: |
      group: "Social (Temple of Time⏳)"
      url: https://outspokekin.com/.well-known/matrix/client
      conditions:
        - "[STATUS] == 200"
spec:
  # The apex carries the delegation only. An exact hostname outranks the wildcard
  # catch-all, so anything else on outspokekin.com is answered by whatever serves the
  # apex site — this route claims two paths, not the domain.
  parentRefs:
    - name: cell-membrane-gateway
      namespace: hyrule-castle
  hostnames:
    - "outspokekin.com"
  rules:
    - matches:
        - path:
            type: Exact
            value: /.well-known/matrix/server
        - path:
            type: Exact
            value: /.well-known/matrix/client
      backendRefs:
        - name: matrix-wellknown
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: matrix-rtc
  annotations:
    gatus.home-operations.com/endpoint: |
      group: "Social (Temple of Time⏳)"
      url: https://livekit.outspokekin.com/livekit/jwt/healthz
      conditions:
        - "[STATUS] == 200"
spec:
  parentRefs:
    - name: cell-membrane-gateway
      namespace: hyrule-castle
  hostnames:
    - "livekit.outspokekin.com"
  rules:
    # Both services answer at the root of their own container; the path here only exists to
    # keep them on one hostname, so the prefix is stripped before it reaches them.
    - matches:
        - path:
            type: PathPrefix
            value: /livekit/jwt
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: matrix-lk-jwt
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /livekit/sfu
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: matrix-livekit
          port: 7880
---
