apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: matrix-synapse
  annotations:
    gatus.home-operations.com/endpoint: |
      group: "Social (Temple of Time⏳)"
spec:
  # Public: federation is inbound as well as outbound, and the apex's .well-known points
  # remote servers here.
  parentRefs:
    - name: cell-membrane-gateway
      namespace: hyrule-castle
  hostnames:
    - "matrix.outspokekin.com"
  rules:
    # MAS owns login, logout and token refresh, and exposes them on the homeserver's own
    # paths so existing clients keep working. These must reach MAS rather than Synapse —
    # Synapse no longer implements them once authentication is delegated. More specific
    # paths win over the catch-all below.
    - matches:
        - path:
            type: PathPrefix
            value: /_matrix/client/v3/login
        - path:
            type: PathPrefix
            value: /_matrix/client/r0/login
        - path:
            type: PathPrefix
            value: /_matrix/client/v3/logout
        - path:
            type: PathPrefix
            value: /_matrix/client/r0/logout
        - path:
            type: PathPrefix
            value: /_matrix/client/v3/refresh
        - path:
            type: PathPrefix
            value: /_matrix/client/r0/refresh
      backendRefs:
        - name: matrix-auth
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: matrix-synapse
          port: 8008
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: matrix-auth
