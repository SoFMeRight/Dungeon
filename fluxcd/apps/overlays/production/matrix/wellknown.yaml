apiVersion: v1
kind: ConfigMap
metadata:
  name: matrix-wellknown
data:
  # Delegation is what lets user IDs be @user:outspokekin.com while the software answers
  # on a subdomain. Remote servers read /server; clients read /client, which also tells
  # them where authentication lives.
  server.json: |
    {"m.server": "matrix.outspokekin.com:443"}
  client.json: |
    {
      "m.homeserver": { "base_url": "https://matrix.outspokekin.com" },
      "org.matrix.msc2965.authentication": {
        "issuer": "https://matrix-auth.outspokekin.com/",
        "account": "https://matrix-auth.outspokekin.com/account/"
      }
    }
  default.conf: |
    server {
      listen 8080;
      server_name _;

      # Browser clients fetch these cross-origin. Without the header the request is
      # blocked and discovery fails silently, which presents as the server being down.
      location = /.well-known/matrix/server {
        default_type application/json;
        add_header Access-Control-Allow-Origin * always;
        alias /srv/wellknown/server.json;
      }

      location = /.well-known/matrix/client {
        default_type application/json;
        add_header Access-Control-Allow-Origin * always;
        alias /srv/wellknown/client.json;
      }

      location / {
        return 404;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matrix-wellknown
  labels:
    app: matrix-wellknown
spec:
  replicas: 2
  selector:
    matchLabels:
      app: matrix-wellknown
  template:
    metadata:
      labels:
        app: matrix-wellknown
        policy.prplanit.com/ingress: "true"
    spec:
      serviceAccountName: matrix-wellknown
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: docker.io/nginx:1.31.4-alpine
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /.well-known/matrix/server
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: config
              mountPath: /srv/wellknown
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              memory: "64Mi"
      volumes:
        - name: config
          configMap:
            name: matrix-wellknown
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: matrix-wellknown
  labels:
    app: matrix-wellknown
spec:
  selector:
    app: matrix-wellknown
  ports:
    - port: 8080
      targetPort: http
      name: http
