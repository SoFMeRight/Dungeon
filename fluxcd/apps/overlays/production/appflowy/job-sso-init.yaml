apiVersion: v1
kind: ServiceAccount
metadata:
  name: appflowy-sso-init
---
apiVersion: batch/v1
kind: Job
metadata:
  name: appflowy-sso-init
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: appflowy
        component: sso-init
    spec:
      serviceAccountName: appflowy-sso-init
      restartPolicy: OnFailure
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: register
          image: docker.io/python:3.12.11-alpine
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: HOME
              value: /tmp
            - name: GOTRUE_URL
              value: "http://appflowy-gotrue:9999"
            - name: SSO_METADATA_URL
              valueFrom:
                configMapKeyRef:
                  name: appflowy-sso-init
                  key: SSO_METADATA_URL
            - name: SSO_DOMAINS
              valueFrom:
                configMapKeyRef:
                  name: appflowy-sso-init
                  key: SSO_DOMAINS
            # service_role JWTs are signed with gotrue's JWT secret; the admin SSO API
            # (/admin/sso/providers) requires that role. Same secret gotrue itself uses.
            - name: GOTRUE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: appflowy-shared-secrets
                  key: GOTRUE_JWT_SECRET
          command:
            - python3
            - -c
            - |
              import hmac, hashlib, base64, json, time, os, sys, urllib.request, urllib.error

              def b64(b): return base64.urlsafe_b64encode(b).rstrip(b"=")

              secret = os.environ["GOTRUE_JWT_SECRET"].encode()
              gotrue = os.environ.get("GOTRUE_URL", "http://appflowy-gotrue:9999").rstrip("/")
              meta_url = os.environ["SSO_METADATA_URL"]
              domains = [d.strip() for d in os.environ.get("SSO_DOMAINS", "").split(",") if d.strip()]

              now = int(time.time())
              hdr = b64(json.dumps({"alg": "HS256", "typ": "JWT"}, separators=(",", ":")).encode())
              pl = b64(json.dumps({"role": "service_role", "iss": "appflowy-sso-init",
                                   "iat": now, "exp": now + 600}, separators=(",", ":")).encode())
              sig = b64(hmac.new(secret, hdr + b"." + pl, hashlib.sha256).digest())
              jwt = (hdr + b"." + pl + b"." + sig).decode()

              def call(method, path, body=None):
                  data = json.dumps(body).encode() if body is not None else None
                  req = urllib.request.Request(gotrue + path, data=data, method=method,
                      headers={"Authorization": "Bearer " + jwt, "Content-Type": "application/json"})
                  with urllib.request.urlopen(req, timeout=15) as r:
                      return json.loads(r.read() or b"{}")

              try:
                  existing = call("GET", "/admin/sso/providers")
              except urllib.error.HTTPError as e:
                  print("ERROR listing SSO providers:", e.code, e.read().decode(errors="replace"), file=sys.stderr)
                  sys.exit(1)

              for p in (existing.get("items") or []):
                  if (p.get("saml") or {}).get("metadata_url") == meta_url:
                      print("SSO provider already registered for", meta_url, "- nothing to do")
                      sys.exit(0)

              body = {"type": "saml", "metadata_url": meta_url}
              if domains:
                  body["domains"] = domains
              try:
                  res = call("POST", "/admin/sso/providers", body)
              except urllib.error.HTTPError as e:
                  print("ERROR creating SSO provider:", e.code, e.read().decode(errors="replace"), file=sys.stderr)
                  sys.exit(1)
              print("Registered Zitadel SAML SSO provider:", json.dumps(res)[:400])
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "250m"
      volumes:
        - name: tmp
          emptyDir: {}
