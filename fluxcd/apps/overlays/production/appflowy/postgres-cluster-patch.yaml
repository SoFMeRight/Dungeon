apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: appflowy-postgres
spec:
  # Requests lift this out of BestEffort so the kubelet does not reclaim the database
  # first under node pressure. Sized from observed use (~228Mi resident): memory is what
  # drives eviction, so the request carries the headroom.
  resources:
    requests:
      memory: "384Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

  inheritedMetadata:
    labels:
      policy.prplanit.com/cnpg: "managed"
      policy.prplanit.com/access-class: postgres
      policy.prplanit.com/service-scope: temple-of-time.appflowy.postgres

  instances: 3

  postgresql:
    parameters:
      shared_buffers: "512MB"
      max_connections: "200"

  bootstrap:
    initdb:
      database: appflowy
      owner: appflowy
      secret:
        name: appflowy-postgres-app
      postInitSQLRefs:
        secretRefs:
          - name: appflowy-postgres-init-sql
            key: init.sql
      postInitApplicationSQLRefs:
        secretRefs:
          - name: appflowy-postgres-init-sql
            key: app-init.sql

  enableSuperuserAccess: true

  storage:
    storageClass: ceph-rbd
    size: 20Gi
