apiVersion: apps/v1
kind: Deployment
metadata:
  name: appflowy-web
spec:
  # Held at zero for the namespace move.
  replicas: 0
  template:
    spec:
      containers:
        - name: appflowy-web
          image: docker.io/appflowyinc/appflowy_web:0.20.3
          resources:
            requests:
              memory: 134Mi
              cpu: 12m
            limits:
              memory: "192Mi"
              cpu: "500m"
