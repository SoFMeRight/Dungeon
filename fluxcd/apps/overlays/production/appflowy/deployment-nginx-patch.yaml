apiVersion: apps/v1
kind: Deployment
metadata:
  name: appflowy-nginx
spec:
  replicas: 3
  template:
    metadata:
      labels:
        policy.prplanit.com/ingress: "true"
    spec:
      containers:
        - name: nginx
          image: docker.io/nginx:1.31.8-alpine
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
          resources:
            requests:
              memory: 11Mi
              cpu: 2m   # right-sized 2026-07: p95 ~0-3m (was 250m)
            limits:
              memory: "80Mi"
              cpu: "425m"
      volumes:
        - name: nginx-config
          configMap:
            name: appflowy-nginx-config
