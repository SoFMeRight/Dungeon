apiVersion: apps/v1
kind: Deployment
metadata:
  name: appflowy-admin-frontend
spec:
  # Held at zero for the namespace move.
  replicas: 0
  template:
    spec:
      containers:
        - name: admin-frontend
          image: docker.io/appflowyinc/admin_frontend:0.20.0
          resources:
            requests:
              memory: 170Mi
              cpu: 26m
            limits:
              memory: "224Mi"
              cpu: "500m"
