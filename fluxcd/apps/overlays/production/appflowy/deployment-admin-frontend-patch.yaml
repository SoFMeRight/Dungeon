apiVersion: apps/v1
kind: Deployment
metadata:
  name: appflowy-admin-frontend
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: admin-frontend
          image: docker.io/appflowyinc/admin_frontend:0.19.0
          resources:
            requests:
              memory: 170Mi
              cpu: 26m
            limits:
              memory: "1Gi"
              cpu: "500m"
