apiVersion: v1
kind: ConfigMap
metadata:
  name: appflowy-sso-init
data:
  # Zitadel's instance-wide SAML IdP metadata. gotrue fetches this server-side and
  # matches the appflowy SP by its entityID (registered in the Zitadel SAML app).
  SSO_METADATA_URL: "https://sso.prplanit.com/saml/v2/metadata"
  # Email domain(s) bound to this SSO provider (comma-separated). The AppFlowy client
  # triggers SSO by the login email's domain, so users with these domains are routed
  # to Zitadel. Signups stay disabled — accounts are pre-provisioned (Option A).
  SSO_DOMAINS: "arbitorium.com"
