apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: etherealclique-site
  annotations:
    gatus.home-operations.com/endpoint: |
      group: "Discovery & Dashboards (Lost Woods🌲)"
spec:
  parentRefs:
    - name: cell-membrane-gateway
      namespace: hyrule-castle
  hostnames:
    - "etherealclique.com"
  rules:
    # The apex is the identity half of a fediverse account (@user@etherealclique.com)
    # while the server answers on social.; these lookups are how a remote instance
    # discovers that. A longer path prefix outranks the site's "/" below, so the site is
    # unaffected. Matrix delegation would join here under /.well-known/matrix/.
    - matches:
        - path:
            type: PathPrefix
            value: /.well-known/webfinger
        - path:
            type: PathPrefix
            value: /.well-known/host-meta
        - path:
            type: PathPrefix
            value: /.well-known/nodeinfo
      filters:
        - type: RequestRedirect
          requestRedirect:
            hostname: social.etherealclique.com
            statusCode: 301
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: etherealclique-site
          port: 4017
