apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: optcp-ai
resources:
  - ../../../base/openwakeword
# Held at zero for the volume re-bind into optcp-ai.
replicas:
  - name: openwakeword
    count: 0

patches:
  - path: statefulset-patch.yaml
    target:
      kind: StatefulSet
      name: openwakeword
