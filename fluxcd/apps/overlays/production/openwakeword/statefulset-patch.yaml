apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: openwakeword
spec:
  template:
    spec:
      containers:
        - name: openwakeword
          image: docker.io/rhasspy/wyoming-openwakeword:2.1.0
          securityContext:
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # readOnlyRootFilesystem: models load from the custom PVC; /tmp is defensive scratch.
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: custom
      spec:
        storageClassName: ceph-rbd-retain
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
