apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: arbitorium-restricted
resources:
  - ../../../base/immich
  - httproute.yaml
  - persistent-volumes.yaml
  - persistent-volume-claims.yaml
# Held at zero for the volume re-bind into arbitorium-restricted.
replicas:
  - name: immich
    count: 0

patches:
  - path: statefulset-patch.yaml
    target:
      kind: StatefulSet
      name: immich
  - target:
      kind: StatefulSet
      name: immich
    patch: |-
      - op: remove
        path: /spec/volumeClaimTemplates
  - path: service-immich-ingress-patch.yaml
    target:
      kind: Service
      name: immich
