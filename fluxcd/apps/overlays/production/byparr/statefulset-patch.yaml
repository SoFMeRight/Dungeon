apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: byparr
spec:
  template:
    metadata:
      labels:
        istio.io/dataplane-mode: none
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: byparr
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            # v3 rearchitected onto uv + camoufox: the venv (/app/.venv) symlinks to a baked
            # uv-python under $HOME, and a 585MB camoufox browser ships under XDG_CACHE_HOME=/cache
            # which camoufox writes its profile back into at runtime. The v2-era mounts below
            # (emptyDir over /app/.venv, PVC over /app/.cache, UV_* redirects) hid those baked
            # trees → `exec /app/.venv/bin/python: No such file or directory`. Removed. A read-only
            # rootfs is impractical here (can't both expose the baked /cache browser and let
            # camoufox write to it), so roRootFS is off — the rest of the hardening stays:
            # non-root uid 1000, drop-ALL caps, and gluetun VPN-netns isolation.
            readOnlyRootFilesystem: false
          image: ghcr.io/thephaseless/byparr:3.0.4
          env:
            - name: TZ
              value: "America/Los_Angeles"
          volumeMounts:
            - name: screenshots
              mountPath: /app/screenshots
            - name: tmp
              mountPath: /tmp
        - name: gluetun
          image: docker.io/qmcgaw/gluetun:v3.41.3
          env:
            - name: VPN_SERVICE_PROVIDER
              value: "private internet access"
            - name: SERVER_REGIONS
              $patch: delete
            - name: FIREWALL_OUTBOUND_SUBNETS
              value: "10.144.0.0/12,172.16.0.0/12,172.22.30.33/32,192.168.144.0/20"
            - name: DNS_ADDRESS
              value: "10.144.0.10"
            - name: UPDATER_PERIOD
              value: "24h"
      volumes:
        # headless browser + app temp
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: screenshots
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ceph-rbd-retain
        resources:
          requests:
            storage: 1Gi
