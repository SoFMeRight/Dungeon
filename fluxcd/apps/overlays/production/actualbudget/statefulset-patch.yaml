apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: actualbudget
spec:
  replicas: 1
  template:
    metadata:
      labels:
        policy.prplanit.com/ingress: "true"
    spec:
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: actualbudget
          image: docker.io/actualbudget/actual-server:sha-37e807f-alpine
          securityContext:
            readOnlyRootFilesystem: true
          env:
            - name: ACTUAL_OPENID_SERVER_HOSTNAME
              value: "https://budget.pcfae.com"
          volumeMounts:
            - name: pedestal-of-time-actualbudget-data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        # readOnlyRootFilesystem: budget files on /data PVC; Node uses /tmp scratch.
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: pedestal-of-time-actualbudget-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ceph-rbd-retain
        resources:
          requests:
            storage: 5Gi
