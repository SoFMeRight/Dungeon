apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: actualbudget-xylem
  annotations:
    gatus.home-operations.com/endpoint: |
      group: "Private Apps (Pedestal of Time⚔️)"
spec:
  parentRefs:
    - name: xylem-gateway
      namespace: arylls-lookout
  hostnames:
    - "budget.pcfae.com"
  rules:
    # OIDC callback ONLY: no COOP here. The browser returns to this path
    # cross-origin from Zitadel; COOP:same-origin makes Chromium do a browsing-
    # context-group swap that RESTARTS the navigation, so the code lands twice
    # → the 2nd exchange fails Errors.AuthRequest.NoCode (Zitadel oidc_session.go
    # CreateOIDCSessionFromAuthRequest: code already consumed). This handler
    # returns only a 302 (success) or 400 JSON (error) — it never serves the
    # SAB-dependent SPA — so dropping COOP here does NOT affect SharedArrayBuffer.
    # More-specific prefix wins over "/". (Grafana works precisely because its
    # callback carries no COOP.)
    - matches:
        - path:
            type: PathPrefix
            value: /openid/callback
      backendRefs:
        - name: actualbudget
          port: 5006
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        # ActualBudget's frontend needs SharedArrayBuffer, which the browser only
        # grants under cross-origin isolation (COOP: same-origin + COEP:
        # require-corp on the top-level document). The app server sends both, but
        # the xylem gateway drops them — force them back. The SPA (which needs
        # SAB) only ever loads under "/", so it stays isolated; only the callback
        # above is carved out.
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Cross-Origin-Opener-Policy
                value: same-origin
              - name: Cross-Origin-Embedder-Policy
                value: require-corp
      backendRefs:
        - name: actualbudget
          port: 5006
