apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: actualbudget-xylem
  annotations:
    gatus.home-operations.com/endpoint: |
      group: "Private Apps (Pedestal of Time⚔️)"
spec:
  parentRefs:
    - name: xylem-gateway
      namespace: arylls-lookout
  hostnames:
    - "budget.pcfae.com"
  rules:
    # OIDC flow endpoints must NOT carry COOP: the browser returns here
    # cross-origin from Zitadel, and COOP: same-origin forces a browsing-context
    # swap that RELOADS the callback page — redeeming the single-use auth code a
    # second time, which Zitadel rejects with Errors.AuthRequest.NoCode. These
    # paths are plain redirects and never touch SharedArrayBuffer, so serve them
    # with the app's own headers untouched. More-specific prefix wins over "/".
    - matches:
        - path:
            type: PathPrefix
            value: /openid
      backendRefs:
        - name: actualbudget
          port: 5006
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        # ActualBudget's frontend needs SharedArrayBuffer, which the browser
        # only grants under cross-origin isolation (COOP: same-origin + COEP:
        # require-corp on the top-level document). The app server sends both,
        # but they don't survive the xylem gateway hop — force them here so the
        # browser actually receives them.
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Cross-Origin-Opener-Policy
                value: same-origin
              - name: Cross-Origin-Embedder-Policy
                value: require-corp
      backendRefs:
        - name: actualbudget
          port: 5006
