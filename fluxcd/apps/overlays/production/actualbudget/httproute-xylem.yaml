apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: actualbudget-xylem
  annotations:
    gatus.home-operations.com/endpoint: |
      group: "Private Apps (Pedestal of Time⚔️)"
spec:
  parentRefs:
    - name: xylem-gateway
      namespace: arylls-lookout
  hostnames:
    - "budget.pcfae.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        # ActualBudget's frontend needs SharedArrayBuffer, which the browser
        # only grants under cross-origin isolation (COOP: same-origin + COEP:
        # require-corp on the top-level document). The app server already sends
        # both on EVERY path — including /openid/callback, where it re-serves the
        # SPA to render login errors — but the xylem gateway drops them, so force
        # them back on all paths. (Do NOT carve out /openid: the callback serves
        # the SAB-dependent SPA too, so it must stay cross-origin isolated.)
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Cross-Origin-Opener-Policy
                value: same-origin
              - name: Cross-Origin-Embedder-Policy
                value: require-corp
      backendRefs:
        - name: actualbudget
          port: 5006
