apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: optcp-cloud

resources:
  - ../../../base/shlink
  - externalsecret.yaml
  - httproute.yaml
  - cephfs-web-config-pv.yaml

patches:
  - path: statefulset-app-patch.yaml
  - path: statefulset-db-patch.yaml
  - path: deployment-web-client-patch.yaml
  - path: service-patch.yaml
  - path: service-shlink-web-client-ingress-patch.yaml
    target:
      kind: Service
      name: shlink-web-client
  - path: service-shlink-app-ingress-patch.yaml
    target:
      kind: Service
      name: shlink-app
