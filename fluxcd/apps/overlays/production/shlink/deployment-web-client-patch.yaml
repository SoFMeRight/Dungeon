apiVersion: apps/v1
kind: Deployment
metadata:
  name: shlink-web-client
spec:
  # Held at zero for the volume re-bind into optcp-cloud.
  replicas: 0
  template:
    metadata:
      labels:
        policy.prplanit.com/ingress: "true"
    spec:
      securityContext:
        runAsUser: 101
        runAsGroup: 101
      imagePullSecrets:
        - name: pull-secret-cr-optcp-optcp-k8s-dungeon-public
      containers:
        - name: shlink-web-client
          image: docker.io/shlinkio/shlink-web-client:4.9.0
          securityContext:
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
      volumes:
        # readOnlyRootFilesystem: nginx serving the SPA; cache/pid/tmp scratch.
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
