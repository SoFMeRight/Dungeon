apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hrconvert2-xylem
  annotations:
    gatus.home-operations.com/endpoint: |
      group: "Tools & Utilities (Tingle Tuner🔧)"
spec:
  parentRefs:
    - name: phloem-ingress-gateway
      namespace: optcp-ingress-internal
  hostnames:
    - "hrconvert2.pcfae.com"
  rules:
    # The app lives under /HRProprietary/HRConvert2/; the webroot has no index.
    - matches:
        - path:
            type: Exact
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /HRProprietary/HRConvert2/
            statusCode: 302
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: hrconvert2
          port: 8085
