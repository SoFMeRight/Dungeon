apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hrconvert2
spec:
  replicas: 1
  template:
    metadata:
      labels:
        policy.prplanit.com/ingress: "true"
    spec:
      containers:
        - name: hrconvert2
          image: docker.io/zelon88/hrconvert2:v3.7.2
          resources:
            requests:
              cpu: "10m"
              # 32Mi/256Mi OOMKilled (exit 137) on startup — the image runs Apache + PHP and
              # spins up headless LibreOffice for document conversion, which needs far more.
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          volumeMounts:
            - name: tingle-tuner-hrconvert2-config
              mountPath: /var/www/html/HRProprietary/HRConvert2/config.php
              subPath: config.php
            - name: tingle-tuner-hrconvert2-files
              mountPath: /home/converter
  volumeClaimTemplates:
    - metadata:
        name: tingle-tuner-hrconvert2-config
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: ceph-rbd
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: tingle-tuner-hrconvert2-files
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: ceph-rbd
        resources:
          requests:
            storage: 10Gi
