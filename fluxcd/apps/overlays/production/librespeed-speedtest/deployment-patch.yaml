apiVersion: apps/v1
kind: Deployment
metadata:
  name: librespeed-speedtest
spec:
  template:
    metadata:
      labels:
        policy.prplanit.com/ingress: "true"
    spec:
      initContainers:
        - name: seed-apache-config
          image: ghcr.io/librespeed/speedtest:6.2.1-alpine
      containers:
        - name: librespeed-speedtest
          image: ghcr.io/librespeed/speedtest:6.2.1-alpine
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          envFrom:
            - configMapRef:
                name: librespeed-speedtest-config
