apiVersion: apps/v1
kind: Deployment
metadata:
  name: librespeed-speedtest
spec:
  template:
    metadata:
      labels:
        policy.prplanit.com/ingress: "true"
    spec:
      initContainers:
        - name: seed-apache-config
          image: ghcr.io/librespeed/speedtest:6.3.1-alpine
      containers:
        - name: librespeed-speedtest
          image: ghcr.io/librespeed/speedtest:6.3.1-alpine
          resources:
            requests:
              cpu: 2m
              memory: 65Mi
            limits:
              cpu: 100m
              memory: 128Mi
          envFrom:
            - configMapRef:
                name: librespeed-speedtest-config
