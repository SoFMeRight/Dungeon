apiVersion: apps/v1
kind: Deployment
metadata:
  name: openspeedtest
spec:
  template:
    metadata:
      labels:
        policy.prplanit.com/ingress: "true"
    spec:
      securityContext:
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: openspeedtest
          image: docker.io/openspeedtest/latest:v2.0.6
          securityContext:
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: nginx-log
              mountPath: /var/log/nginx
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          envFrom:
            - configMapRef:
                name: openspeedtest-config
            - secretRef:
                name: openspeedtest-secrets
      volumes:
        # readOnlyRootFilesystem: nginx needs writable cache/pid/log + /tmp scratch.
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: nginx-log
          emptyDir: {}
