apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: optcp-web
resources:
  - ../../../base/ghost
  - httproute.yaml
  - httproute-xylem.yaml
patches:
  - path: statefulset-ghost-patch.yaml
  - path: statefulset-mysql-patch.yaml
  - path: externalsecret-patch.yaml
  - path: service-ghost-ingress-patch.yaml
    target:
      kind: Service
      name: ghost
