apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homarr-xylem
  annotations:
    gatus.home-operations.com/endpoint: |
      group: "Discovery & Dashboards (Lost Woods🌲)"
spec:
  parentRefs:
    - name: phloem-ingress-gateway
      namespace: optcp-ingress-internal
  hostnames:
    - "apptray.pcfae.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: homarr
          port: 7575
