apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: homarr
spec:
  replicas: 3
  template:
    metadata:
      labels:
        policy.prplanit.com/ingress: "true"
        policy.prplanit.com/cap.postgres: "true"
        policy.prplanit.com/access-scope-postgres: lost-woods.homarr.postgres
        policy.prplanit.com/cap.redis: "true"
        policy.prplanit.com/access-scope-redis: lost-woods.homarr.redis
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "7575"
    spec:
      initContainers:
        # Enforce the OIDC role->group model (owner=full, admin=co-admin) in Homarr's
        # DB before the app starts. Idempotent + guarded; membership is left to OIDC sync.
        - name: seed-groups
          image: docker.io/postgres:17-alpine
          command:
            - sh
            - -c
            # Fail-open: the DO block swallows schema errors; this "|| echo" swallows
            # connect errors — the seed is best-effort and never blocks Homarr's start.
            # Single-quoted so the colon/pipes stay inside one string scalar.
            - 'psql -v ON_ERROR_STOP=1 -f /seed/seed-groups.sql || echo "[group-seed] WARNING seed did not run (db unreachable); continuing to start Homarr"'
          env:
            - name: PGHOST
              value: "homarr-postgres-rw"
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: "homarr"
            - name: PGUSER
              value: "homarr"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: homarr-postgres-credentials
                  key: password
            - name: HOME
              value: "/tmp"
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: group-seed
              mountPath: /seed
              readOnly: true
            - name: seed-tmp
              mountPath: /tmp
      containers:
        - name: homarr
          volumeMounts:
            - name: homarr-images-shared
              mountPath: /images
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: DATABASE_URL
              value: ""
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: homarr-postgres-credentials
                  key: password
            - name: DB_DRIVER
              value: "node-postgres"
            - name: DB_DIALECT
              value: "postgresql"
            - name: DB_HOST
              value: "homarr-postgres-rw"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "homarr"
            - name: DB_USER
              value: "homarr"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: homarr-postgres-credentials
                  key: password
            - name: REDIS_IS_EXTERNAL
              value: "true"
            - name: REDIS_HOST
              value: "homarr-redis-master"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: homarr-redis-password
                  key: password
            - name: NEXTAUTH_URL
              value: "https://apptray.pcfae.com"
            - name: AUTH_PROVIDERS
              value: "credentials,oidc"
            - name: AUTH_LOGOUT_REDIRECT_URL
              value: "https://apptray.pcfae.com"
            - name: AUTH_SESSION_EXPIRY_TIME
              value: "30d"
            - name: AUTH_OIDC_ISSUER
              value: "https://sso.prplanit.com"
            - name: AUTH_OIDC_CLIENT_NAME
              value: "PrecisionPlanIT.com SSO"
            - name: AUTH_OIDC_AUTO_LOGIN
              value: "false"
            - name: AUTH_OIDC_SCOPE_OVERWRITE
              value: "openid email profile groups offline_access"
            - name: AUTH_OIDC_GROUPS_ATTRIBUTE
              value: "roles"
            - name: AUTH_OIDC_NAME_ATTRIBUTE_OVERWRITE
              value: "email"
            - name: AUTH_OIDC_FORCE_USERINFO
              value: "false"
            # AUTH_SECRET now comes from the homarr-secrets envFrom (dedicated
            # Vault value apps/homarr:AUTH_SECRET), not the postgres password.
            - name: AUTH_TRUST_HOST
              value: "true"
      volumes:
        - name: homarr-images-shared
          persistentVolumeClaim:
            claimName: homarr-images
        - name: group-seed
          configMap:
            name: homarr-group-seed
        - name: seed-tmp
          emptyDir: {}
