apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: homarr-postgres
spec:
  # Requests lift this out of BestEffort so the kubelet does not reclaim the database
  # first under node pressure. Sized from observed use (~73Mi resident): memory is what
  # drives eviction, so the request carries the headroom. The floor is shared_buffers
  # (128MB) — postgres reserves it up front and CNPG rejects a request below it.
  resources:
    requests:
      memory: "192Mi"
      cpu: "50m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  inheritedMetadata:
    labels:
      policy.prplanit.com/cnpg: "managed"
      policy.prplanit.com/access-class: postgres
      policy.prplanit.com/service-scope: lost-woods.homarr.postgres
      policy.prplanit.com/cap.s3-nas: "true"
      policy.prplanit.com/access-scope-s3-nas: gringotts.seaweedfs

  instances: 3

  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie

  affinity:
    podAntiAffinityType: required

  # Fast failover optimizations
  switchoverDelay: 30  # Reduced from default 3600s for faster planned switchovers

  # startDelay is the startup probe budget, not a failover control: the probe
  # allows one attempt per 10s up to this ceiling, and a replica replaying WAL
  # must finish inside it or kubelet kills it mid-replay.
  startDelay: 3600
  # Shutdown has to fit the node's grace budget: 150s total, 30s reserved for
  # critical pods, so 120s for ordinary ones. Postgres does not checkpoint until
  # the smart phase stops waiting for clients to disconnect, so a long smart
  # timeout means the SIGKILL lands before anything is flushed. Short smart, then
  # fast shutdown does the checkpoint well inside the remaining budget.
  smartShutdownTimeout: 10
  stopDelay: 60
  livenessProbeTimeout: 5

  postgresql:
    # Enable synchronous replication for zero data loss and fast failover
    synchronous:
      method: any      # Any 1 replica can acknowledge
      number: 1        # At least 1 replica must confirm writes

    parameters:
      shared_buffers: "128MB"
      max_connections: "150"
      # Faster detection of primary failure
      wal_receiver_timeout: "5s"
      # WAL retention limits - prevent disk from filling
      wal_keep_size: "128MB"
      max_slot_wal_keep_size: "400MB"  # 8% of 5Gi PVC

  # Enable monitoring
  monitoring:
    enablePodMonitor: true

  bootstrap:
    initdb:
      database: homarr
      owner: homarr

  enableSuperuserAccess: true

  storage:
    storageClass: ceph-rbd-templated
    size: 5Gi
