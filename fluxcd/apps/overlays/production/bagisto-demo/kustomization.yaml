apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prplanit-commerce
resources:
  - ../../../base/bagisto-demo
  - httproute-xylem.yaml
# Held at zero for the volume re-bind into prplanit-commerce.
replicas:
  - name: bagisto-demo
    count: 0
  - name: bagisto-demo-db
    count: 0

patches:
  - patch: |-
      - op: replace
        path: /spec/ports/0/port
        value: 324
    target:
      kind: Service
      name: bagisto-demo
  - path: statefulset-patch.yaml
    target:
      kind: StatefulSet
      name: bagisto-demo
  - path: statefulset-db-patch.yaml
    target:
      kind: StatefulSet
      name: bagisto-demo-db
  - path: service-bagisto-demo-ingress-patch.yaml
    target:
      kind: Service
      name: bagisto-demo
