apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: oauth2-proxy
  namespace: zeldas-lullaby
  annotations:
    gatus.home-operations.com/endpoint: |
      group: "Administration (Zelda's Lullaby🎵)"
      conditions:
        - "[STATUS] == any(200, 302)"
        - "[BODY] != pat(*Fairer Pages*)"
        - "[RESPONSE_TIME] < 5000"
spec:
  parentRefs:
    - name: xylem-gateway
      namespace: arylls-lookout
      sectionName: https-pcfae
  hostnames:
    - "oa2p.pcfae.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: oauth2-proxy
          port: 4180
---
# SSO sign-in serving: routes /oauth2/* on each SSO-gated host to oauth2-proxy so the
# login page (assets + /oauth2/start) works in-place. Must use the EXACT gated hostname
# (a wildcard would lose path precedence to the app's own exact-host route). Add a gated
# host here alongside its sso/<host>.yaml policy. Callback stays central (oa2p.pcfae.com).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: oauth2-proxy-signin
  namespace: zeldas-lullaby
spec:
  parentRefs:
    - name: xylem-gateway
      namespace: arylls-lookout
      sectionName: https-pcfae
  hostnames:
    - "books.pcfae.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /oauth2/
      backendRefs:
        - name: oauth2-proxy
          port: 4180
