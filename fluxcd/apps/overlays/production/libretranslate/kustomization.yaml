apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: optcp-ai
resources:
  - ../../../base/libretranslate
  - httproute.yaml
patches:
  - path: statefulset-patch.yaml
    target:
      kind: StatefulSet
      name: libretranslate
  - path: service-libretranslate-ingress-patch.yaml
    target:
      kind: Service
      name: libretranslate
