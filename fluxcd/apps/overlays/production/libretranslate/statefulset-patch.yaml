apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: libretranslate
spec:
  template:
    metadata:
      labels:
        policy.prplanit.com/ingress: "true"
    spec:
      securityContext:
        runAsUser: 1032
        runAsGroup: 1032
        fsGroup: 1032
      runtimeClassName: nvidia
      volumes:
        - name: config
          emptyDir: {}
      containers:
        - name: libretranslate
          resources:
            requests:
              cpu: 2m
              memory: 880Mi
            limits:
              cpu: 113m
              memory: 880Mi
          env:
            - name: HOME
              value: /home/libretranslate
            - name: LT_API_KEYS_DB_PATH
              value: /home/libretranslate/.local/api_keys.db
          volumeMounts:
            - name: models
              mountPath: /home/libretranslate/.local
            - name: config
              mountPath: /home/libretranslate/.config
  volumeClaimTemplates:
    - metadata:
        name: models
        labels:
          app: libretranslate
          volume-type: models
      spec:
        storageClassName: ceph-rbd
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
