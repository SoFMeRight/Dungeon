# Patch to use static RBD volumes (volumeClaimTemplates removed via JSON patch)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: jellyfin
spec:
  template:
    metadata:
      labels:
        policy.prplanit.com/ingress: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8096"
    spec:
      securityContext:
        fsGroup: 1000
        # /config holds ~180k files; only re-chown when the root dir's ownership is wrong, so a
        # roll doesn't spend minutes recursively chowning every restart.
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: fix-permissions
          image: docker.io/busybox:1.38
          # Runs as root only to chown /config + /cache to 1000; keep just the file-perm caps.
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
          command:
            - sh
            - -c
            - |
              chown -R 1000:1000 /config || true
              chown -R 1000:1000 /cache || true
          volumeMounts:
            - name: config
              mountPath: /config
            - name: cache
              mountPath: /cache
      containers:
        - name: jellyfin
          image: docker.io/jellyfin/jellyfin:10.11.11
          env:
            - name: JELLYFIN_PublishedServerUrl
              value: "https://jfish.optcp.com"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: cache
              mountPath: /cache
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: optcp-jellyfin-config
        - name: cache
          persistentVolumeClaim:
            claimName: optcp-jellyfin-cache
        - name: media-movies
          persistentVolumeClaim:
            claimName: jellyfin-media-movies
        - name: media-tv
          persistentVolumeClaim:
            claimName: jellyfin-media-tv
        - name: media-music
          persistentVolumeClaim:
            claimName: jellyfin-media-music
        - name: media-photos
          persistentVolumeClaim:
            claimName: jellyfin-media-photos
