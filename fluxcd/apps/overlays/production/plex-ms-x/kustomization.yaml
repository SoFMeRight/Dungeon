apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: optcp-restricted

resources:
  - ../../../base/plex-ms-x
  - persistent-volumes.yaml
  - persistent-volume-claims.yaml
  - httproute-xylem.yaml

patches:
  - path: statefulset-patch.yaml
    target:
      kind: StatefulSet
      name: plex-ms-x
  - path: service-patch.yaml
    target:
      kind: Service
      name: plex-ms-x
  - path: storage-patch.yaml
  - path: service-plex-ms-x-ingress-patch.yaml
    target:
      kind: Service
      name: plex-ms-x
