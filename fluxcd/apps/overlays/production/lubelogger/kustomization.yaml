apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: arbitorium-restricted
resources:
  - ../../../base/lubelogger
  - httproute-xylem.yaml
# Held at zero for the volume re-bind into arbitorium-restricted.
replicas:
  - name: lubelogger
    count: 0

patches:
  - path: statefulset-patch.yaml
    target:
      kind: StatefulSet
      name: lubelogger
  - path: service-lubelogger-ingress-patch.yaml
    target:
      kind: Service
      name: lubelogger
