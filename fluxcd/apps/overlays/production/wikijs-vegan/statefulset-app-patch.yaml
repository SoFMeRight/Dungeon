apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wikijs-vegan
spec:
  replicas: 1
  template:
    metadata:
      labels:
        policy.prplanit.com/ingress: "true"
        policy.prplanit.com/cap.oidc: "true"
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: wikijs
          image: ghcr.io/requarks/wiki:2
