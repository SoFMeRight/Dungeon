apiVersion: apps/v1
kind: Deployment
metadata:
  name: calibre-web
spec:
  replicas: 1
  strategy:
    type: Recreate
    rollingUpdate: null
  template:
    metadata:
      labels:
        policy.prplanit.com/ingress: "true"
    spec:
      containers:
        - name: calibre-web
          image: docker.io/linuxserver/calibre-web:2021.12.16
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: optcp-calibre-web-config
