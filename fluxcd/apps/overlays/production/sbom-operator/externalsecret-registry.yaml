# Harbor robot: Repository pull only, on the private sofmeright project.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sbom-operator-registry
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-optcp
  target:
    name: sbom-operator-registry
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "cr.pcfae.com": {
                "auth": "{{ printf "%s:%s" .USERNAME .PASSWORD | b64enc }}"
              },
              "cr.optcp.com": {
                "auth": "{{ printf "%s:%s" .USERNAME .PASSWORD | b64enc }}"
              }
            }
          }
  dataFrom:
    - extract:
        key: apps/sbom-operator/cr.optcp.com
