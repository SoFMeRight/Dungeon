# Harbor robot for the private sofmeright project: Repository pull only, no
# other permission. Passed to syft as the fallback pull secret, since the
# workloads' own pull secrets live in namespaces sbom-operator cannot read.
# Listed under both hostnames until the registry moves to cr.optcp.com.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sbom-operator-registry
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-optcp
  target:
    name: sbom-operator-registry
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "cr.pcfae.com": {
                "auth": "{{ printf "%s:%s" .USERNAME .PASSWORD | b64enc }}"
              },
              "cr.optcp.com": {
                "auth": "{{ printf "%s:%s" .USERNAME .PASSWORD | b64enc }}"
              }
            }
          }
  dataFrom:
    - extract:
        key: apps/dependency-track/cr.optcp.com
