apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: steam-headless
spec:
  selector:
    matchLabels:
      seat: marxii-test
  template:
    metadata:
      labels:
        seat: marxii-test
      annotations:
        # systemd needs a writable cgroup2 hierarchy; honoured only by the nvidia-userns handler.
        io.kubernetes.cri-o.cgroup2-mount-hierarchy-rw: "true"
    spec:
      runtimeClassName: nvidia-userns
      # Root in the seat maps to an unprivileged host UID; capabilities apply only inside it.
      hostUsers: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.family
                    operator: In
                    values:
                      - maxwell
      containers:
        - name: steam-headless
          image: docker.io/josh5/steam-headless:2.44.20261019.1@sha256:c60f4d7243a4d94515f722441fff90b752413bf6a45bb221c9a4ed55bc4d9108
          securityContext:
            privileged: false
            # Bubblewrap mounts a fresh /proc; allowed only in a user namespace.
            procMount: Unmasked
            # Bubblewrap creates nested user namespaces; the node's AppArmor strips their
            # capabilities unless the profile grants userns
            # (ansible/k8s/tuning/apparmor-steam-headless-seat.yaml).
            appArmorProfile:
              type: Localhost
              localhostProfile: steam-headless-seat
            capabilities:
              add:
                - SYS_ADMIN
                - SYS_NICE
                - NET_ADMIN
                - SYS_PTRACE
                # shinputd: cross-credential ownership checks on the virtual input nodes.
                - DAC_READ_SEARCH
                # avahi-daemon keeps these after dropping privileges.
                - NET_RAW
                - SYS_CHROOT
          env:
            - name: TZ
              value: "America/Los_Angeles"
            - name: SUNSHINE_NAME
              value: "Marxii-test"
          volumeMounts:
            # The image owns /mnt/games (its Steam library, chowned at boot); a user-namespace seat
            # can only chown a volume mapped into its namespace.
            - name: steam-library
              mountPath: /mnt/games
            # CIFS cannot be idmap-mounted into a user namespace; the seat mounts the share itself
            # over FUSE (rclone) with these read-only credentials.
            - mountPath: /mnt/roms
              $patch: delete
            - name: smb-credentials
              mountPath: /etc/steam-headless/smb
              readOnly: true
          resources:
            requests:
              cpu: 1000m
              memory: 2Gi
            limits:
              cpu: 4000m
              memory: 8Gi
              nvidia.com/gpu: 1
              devic.es/seat-gpu: 1
              devic.es/uinput: 1
              devic.es/uhid: 1
              devic.es/fuse: 1
      volumes:
        - name: games
          $patch: delete
        - name: smb-credentials
          secret:
            secretName: steam-headless-smb-secret
            defaultMode: 0400
        - name: steam-library
          emptyDir:
            sizeLimit: 2Gi
  volumeClaimTemplates:
    - metadata:
        name: steam-headless-home
      spec:
        storageClassName: ceph-rbd
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
