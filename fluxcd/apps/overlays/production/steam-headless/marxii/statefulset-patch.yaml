apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: steam-headless
spec:
  selector:
    matchLabels:
      seat: marxii
  template:
    metadata:
      labels:
        seat: marxii
    spec:
      # The GTX 980 Ti seat node.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.family
                    operator: In
                    values:
                      - maxwell
      initContainers:
        - name: sync-apps
          volumeMounts:
            - name: steam-headless-home
              mountPath: /home/steamheadless
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 2000m
              memory: 1Gi
        - name: sync-flatpaks
          image: docker.io/josh5/steam-headless:2.44.20261019.1@sha256:c60f4d7243a4d94515f722441fff90b752413bf6a45bb221c9a4ed55bc4d9108
          volumeMounts:
            - name: steam-headless-home
              mountPath: /home/steamheadless
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 2000m
              memory: 2Gi
      containers:
        - name: steam-headless
          image: docker.io/josh5/steam-headless:2.44.20261019.1@sha256:c60f4d7243a4d94515f722441fff90b752413bf6a45bb221c9a4ed55bc4d9108
          env:
            - name: TZ
              value: "America/Los_Angeles"
            - name: SUNSHINE_NAME
              value: "Marxii"
            # This seat's audio is PipeWire; SDL apps that default to raw ALSA (e.g. BM64Recomp)
            # fatally fail to open a device. Route SDL through the PipeWire-pulse bridge.
            - name: SDL_AUDIODRIVER
              value: "pulseaudio"
          volumeMounts:
            - name: steam-headless-home
              mountPath: /home/steamheadless
            - name: steam-headless-home
              mountPath: /var/lib/steam-headless
            # CephFS-HDD playability test mount (read-only; populated out-of-band).
            - name: games-hdd
              mountPath: /mnt/games-hdd
              readOnly: true
            # Writable CephFS-HDD for the WWHD recomp's state (XDG dirs), off the home PVC.
            - name: recomp-hdd
              mountPath: /mnt/recomp-hdd
          resources:
            requests:
              cpu: 4000m
              memory: 8Gi
            limits:
              cpu: 8000m
              memory: 16Gi
              nvidia.com/gpu: 1
      volumes:
        - name: games-hdd
          persistentVolumeClaim:
            claimName: steam-headless-games-hdd
            readOnly: true
        - name: recomp-hdd
          persistentVolumeClaim:
            claimName: steam-headless-recomp-hdd
  volumeClaimTemplates:
    - metadata:
        name: steam-headless-home
      spec:
        storageClassName: ceph-rbd
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
