# Writable CephFS-HDD volume for the recomps' state (WWHD: built game, extracted files, saves,
# settings, shader caches; rac-rs: its toolchain, build and saves), kept off the capacity-bound
# home PVC. The port launchers point the recomps here. Mounted read-write at /mnt/recomp-hdd.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: steam-headless-recomp-hdd
spec:
  storageClassName: cephfs-hdd
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 20Gi
