releases:
  # Launchers
  - name: es-de
    source: gitlab-package
    repo: es-de/emulationstation-de
    package: ES-DE_Stable
    asset: ES-DE_x64.AppImage
    # renovate: datasource=gitlab-releases depName=es-de/emulationstation-de extractVersion=^v(?<version>.+)$
    version: "3.5.0"
    layout: raw
    mode: "0755"
    dest: /home/steamheadless/Applications/ES-DE_x64.AppImage
  - name: prismlauncher
    repo: PrismLauncher/PrismLauncher
    tag: "{version}"
    asset: PrismLauncher-Linux-x86_64.AppImage
    # renovate: datasource=github-releases depName=PrismLauncher/PrismLauncher
    version: "11.1.1"
    layout: raw
    mode: "0755"
    dest: /home/steamheadless/Applications/PrismLauncher.AppImage
  - name: heroic
    repo: Heroic-Games-Launcher/HeroicGamesLauncher
    tag: "v{version}"
    asset: "Heroic-{version}-linux-x86_64.AppImage"
    # renovate: datasource=github-releases depName=Heroic-Games-Launcher/HeroicGamesLauncher extractVersion=^v(?<version>.+)$
    version: "2.22.4"
    layout: raw
    mode: "0755"
    dest: /home/steamheadless/Applications/Heroic.AppImage
  - name: faugus
    repo: Faugus/faugus-launcher
    tag: "{version}"
    asset_match: '^Faugus-.*-x86_64\.AppImage$'
    # renovate: datasource=github-releases depName=Faugus/faugus-launcher
    version: "2.5.0"
    layout: raw
    mode: "0755"
    dest: /home/steamheadless/Applications/Faugus.AppImage

  # Emulators — dest names match ES-DE's bundled find rules
  - name: pcsx2
    repo: PCSX2/pcsx2
    tag: "v{version}"
    asset: "pcsx2-v{version}-linux-appimage-x64-Qt.AppImage"
    # renovate: datasource=github-releases depName=PCSX2/pcsx2 extractVersion=^v(?<version>.+)$
    version: "2.8.2"
    layout: raw
    mode: "0755"
    dest: /home/steamheadless/Applications/pcsx2-Qt.AppImage
  - name: ppsspp
    repo: hrydgard/ppsspp
    tag: "v{version}"
    asset: "PPSSPP-v{version}-anylinux-x86_64.AppImage"
    # renovate: datasource=github-releases depName=hrydgard/ppsspp extractVersion=^v(?<version>.+)$
    version: "1.20.4"
    layout: raw
    mode: "0755"
    dest: /home/steamheadless/Applications/PPSSPP.AppImage
  - name: melonds
    repo: melonDS-emu/melonDS
    tag: "{version}"
    asset: "melonDS-{version}-appimage-x86_64.zip"
    # renovate: datasource=github-releases depName=melonDS-emu/melonDS
    version: "1.1"
    layout: zip
    executables: ["*.AppImage"]
    dest: /home/steamheadless/Applications/melonDS
  - name: azahar
    repo: azahar-emu/azahar
    tag: "{version}"
    asset: azahar.AppImage
    # renovate: datasource=github-releases depName=azahar-emu/azahar
    version: "2126.2"
    layout: raw
    mode: "0755"
    dest: /home/steamheadless/Applications/azahar.AppImage
  - name: xemu
    repo: xemu-project/xemu
    tag: "v{version}"
    asset: "xemu-{version}-x86_64.AppImage"
    # renovate: datasource=github-releases depName=xemu-project/xemu extractVersion=^v(?<version>.+)$
    version: "0.8.137"
    layout: raw
    mode: "0755"
    dest: /home/steamheadless/Applications/xemu.AppImage
  - name: cemu
    repo: Cemu-Project/Cemu
    tag: "v{version}"
    asset: "Cemu-{version}-x86_64.AppImage"
    # renovate: datasource=github-releases depName=Cemu-Project/Cemu extractVersion=^v(?<version>.+)$
    version: "2.6"
    layout: raw
    mode: "0755"
    dest: /home/steamheadless/Applications/Cemu.AppImage

  - name: rmg
    repo: Rosalie241/RMG
    tag: "v{version}"
    asset: "RMG-Portable-Linux64-v{version}.AppImage"
    # renovate: datasource=github-releases depName=Rosalie241/RMG extractVersion=^v(?<version>.+)$
    version: "0.9.0"
    layout: raw
    mode: "0755"
    dest: /home/steamheadless/Applications/RMG.AppImage
  - name: flycast
    repo: flyinghead/flycast
    tag: "v{version}"
    asset: "flycast-x86_64-{version}.AppImage"
    # renovate: datasource=github-releases depName=flyinghead/flycast extractVersion=^v(?<version>.+)$
    version: "2.7"
    layout: raw
    mode: "0755"
    dest: /home/steamheadless/Applications/flycast-x86_64.AppImage
  - name: shadps4
    repo: shadps4-emu/shadPS4
    tag: "v.{version}"
    asset: "shadps4-linux-sdl-{version}.zip"
    # renovate: datasource=github-releases depName=shadps4-emu/shadPS4 extractVersion=^v\.(?<version>.+)$
    version: "0.20.0"
    layout: zip
    executables: ["Shadps4-sdl.AppImage"]
    dest: /home/steamheadless/Applications/shadps4

  # Rolling emulators: no orderable version tags, so they follow the latest release; the
  # published sha256 is still verified and a changed digest is what triggers the update.
  - name: duckstation
    repo: stenzek/duckstation
    asset: DuckStation-x64.AppImage
    version: latest
    layout: raw
    mode: "0755"
    dest: /home/steamheadless/Applications/DuckStation.AppImage
  - name: rpcs3
    repo: RPCS3/rpcs3-binaries-linux
    asset_match: '^rpcs3-.*_linux64\.AppImage$'
    version: latest
    layout: raw
    mode: "0755"
    dest: /home/steamheadless/Applications/rpcs3.AppImage
  - name: xenia-canary
    repo: xenia-canary/xenia-canary
    asset: xenia_canary_linux.AppImage
    version: latest
    layout: raw
    mode: "0755"
    dest: /home/steamheadless/Applications/xenia_canary.AppImage
  - name: vita3k
    repo: Vita3K/Vita3K
    asset: Vita3K-x86_64.AppImage
    version: latest
    layout: raw
    mode: "0755"
    dest: /home/steamheadless/Applications/Vita3K.AppImage

  # Switch. Eden publishes no checksums: its sha256 is pinned here from the official server
  # (stable.eden-emu.dev), and a version bump needs the new sha256 alongside it.
  - name: eden
    source: pinned
    url: "https://stable.eden-emu.dev/v{version}/Eden-Linux-v{version}-amd64-clang-pgo.AppImage"
    version: "0.2.1"
    sha256: 7a28bf988b0648831989722bdbaa90ab31371b403808199813e0ea7c8b25ba6d
    layout: raw
    mode: "0755"
    dest: /home/steamheadless/Applications/Eden.AppImage
  # Suyu's last release (v0.0.3, 2024-04-10), preserved on the games share; its SHA-1 matches
  # the Internet Archive capture of the official git.suyu.dev release asset.
  - name: suyu
    source: pinned
    url: file:///mnt/roms/_Emulators/Suyu-Linux_x86_64.AppImage
    version: "0.0.3"
    sha256: dbab16853bc1e8ad62fcaddf9b0620e690c8522fbbc6cdddcfcc958f9abb1f47
    layout: raw
    mode: "0755"
    dest: /home/steamheadless/Applications/Suyu.AppImage

  # Native PC ports — release assets are named by codename, so selected by pattern
  - name: paperboat
    repo: HarbourMasters/PaperBoat
    tag: "{version}"
    asset_match: '^Paperboat-.*-Linux\.zip$'
    # renovate: datasource=github-releases depName=HarbourMasters/PaperBoat
    version: "1.0.3"
    layout: zip
    executables: ["Paperboat.AppImage"]
    dest: /home/steamheadless/Applications/paperboat
  - name: shipwright
    repo: HarbourMasters/Shipwright
    tag: "{version}"
    asset_match: '^SoH-.*\.appimage$'
    # renovate: datasource=github-releases depName=HarbourMasters/Shipwright
    version: "9.3.1"
    layout: raw
    mode: "0755"
    dest: /home/steamheadless/Applications/SoH.AppImage
  - name: 2ship
    repo: 2ship2harkinian/2ship2harkinian
    tag: "{version}"
    asset_match: '^2Ship-.*-Linux\.zip$'
    # renovate: datasource=github-releases depName=2ship2harkinian/2ship2harkinian
    version: "5.0.1"
    layout: zip
    executables: ["2ship.appimage"]
    dest: /home/steamheadless/Applications/2ship
  - name: ghostship
    repo: HarbourMasters/Ghostship
    tag: "{version}"
    asset_match: '^[A-Za-z]+-[A-Za-z]+-Linux\.zip$'
    # renovate: datasource=github-releases depName=HarbourMasters/Ghostship
    version: "3.0.0"
    layout: zip
    executables: ["ghostship.appimage"]
    dest: /home/steamheadless/Applications/ghostship
  - name: spaghettikart
    repo: HarbourMasters/SpaghettiKart
    tag: "{version}"
    asset: "spaghetti-linux.zip"
    # renovate: datasource=github-releases depName=HarbourMasters/SpaghettiKart
    version: "1.0.0"
    layout: zip
    executables: ["spaghetti.appimage"]
    dest: /home/steamheadless/Applications/spaghettikart
  # Starship's v2.0.0 assets predate GitHub's published digests, so the digest is pinned here
  # (sha256 of the release asset as downloaded 2026-10-20); a version bump needs a new one.
  - name: starship
    source: pinned
    url: https://github.com/HarbourMasters/Starship/releases/download/v{version}/Starship-Barnard-Alfa-Linux.zip
    sha256: 85dd03d3ad8abd881aa3aa2b49ded336627b44b8ac8333e3c41b5bf7c4336289
    # renovate: datasource=github-releases depName=HarbourMasters/Starship
    version: "2.0.0"
    layout: zip
    executables: ["starship.appimage"]
    dest: /home/steamheadless/Applications/starship
  - name: lighthouse
    repo: HarbourMasters/Lighthouse
    tag: "{version}"
    asset_match: '^Lighthouse-.*-Linux\.zip$'
    # renovate: datasource=github-releases depName=HarbourMasters/Lighthouse
    version: "1.1.0"
    layout: zip
    executables: ["lighthouse.appimage"]
    dest: /home/steamheadless/Applications/lighthouse
  - name: dusklight
    repo: TwilitRealm/dusklight
    tag: "v{version}"
    asset: "Dusklight-v{version}-linux-x86_64.AppImage"
    # renovate: datasource=github-releases depName=TwilitRealm/dusklight
    version: "2.0.3"
    layout: raw
    mode: "0755"
    dest: /home/steamheadless/Applications/Dusklight.AppImage
  - name: bm64recomp
    repo: RevoSucks/BM64Recomp
    tag: "v{version}"
    asset: "BM64Recompiled-AppImage-X64-Release.zip"
    # renovate: datasource=github-releases depName=RevoSucks/BM64Recomp
    version: "1.0.0"
    layout: zip
    executables: ["BM64Recompiled-x86_64.AppImage"]
    dest: /home/steamheadless/Applications/bm64recomp
  - name: openmw
    repo: OpenMW/openmw
    tag: "openmw-{version}"
    asset: "openmw-{version}-Linux-64Bit.tar.gz"
    # renovate: datasource=github-releases depName=OpenMW/openmw extractVersion=^openmw-(?<version>.+)$
    version: "0.51.0"
    layout: tar
    strip: 1
    dest: /home/steamheadless/Applications/openmw

  # Seat tooling
  - name: rclone
    repo: rclone/rclone
    tag: "v{version}"
    asset: "rclone-v{version}-linux-amd64.zip"
    # renovate: datasource=github-releases depName=rclone/rclone extractVersion=^v(?<version>.+)$
    version: "1.75.2"
    layout: zip
    subdir: "rclone-v{version}-linux-amd64"
    include: ["rclone"]
    executables: ["rclone"]
    dest: /home/steamheadless/.local/lib/rclone
