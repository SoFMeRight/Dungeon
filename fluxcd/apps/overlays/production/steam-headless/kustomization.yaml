apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: arbitorium-game-streaming
# Shared by every seat: service account, release-sync playbook and spec, the ES-DE library,
# the read-only games share. Each seat is a sub-overlay.
resources:
  - ../../../base/steam-headless
  - smb-volumes.yaml
  - marxii
configMapGenerator:
  - name: steam-headless-release-spec
    files:
      - releases.yaml
  - name: steam-headless-library
    files:
      - library/systems.txt
      - library/es_find_rules.xml
      - library/es_systems.xml
      - library/flatpaks.txt
      - library/port-PaperBoat.sh
      - library/port-Ship_of_Harkinian.sh
      - library/port-2_Ship_2_Harkinian.sh
      - library/port-Minecraft.sh
      - library/port-Heroic_Games_Launcher.sh
      - library/port-Faugus_Launcher.sh
      - library/port-OpenMW.sh
images:
  - name: docker.io/hlhd/ansible
    newTag: v2.21.5
