apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: optcp-swift-sail-privileged

resources:
  - ../../../base/neko-vpn
  - stunner-gateway.yaml
  - httproute-xylem.yaml

patches:
  - path: statefulset-patch.yaml
    target:
      kind: StatefulSet
      name: neko-vpn
  - path: service-patch.yaml
    target:
      kind: Service
      name: neko-vpn
  - path: vault-secret-patch.yaml
  - path: service-neko-vpn-ingress-patch.yaml
    target:
      kind: Service
      name: neko-vpn
