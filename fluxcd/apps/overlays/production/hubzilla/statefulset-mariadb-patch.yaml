apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hubzilla-mariadb
spec:
  template:
    metadata:
      labels:
        policy.prplanit.com/service-scope: temple-of-time.hubzilla.mariadb
    spec:
      containers:
        - name: mariadb
          image: docker.io/mariadb:11.8
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: ceph-rbd
        resources:
          requests:
            storage: 10Gi
