apiVersion: apps/v1
kind: Deployment
metadata:
  name: hubzilla
spec:
  replicas: 2
  template:
    metadata:
      labels:
        policy.prplanit.com/access-scope-mariadb: temple-of-time.hubzilla.mariadb
    spec:
      initContainers:
        - name: webroot
          image: docker.io/hlhd/hubzilla:dev-7da3d79
      containers:
        - name: php
          image: docker.io/hlhd/hubzilla:dev-7da3d79
        - name: nginx
          image: docker.io/nginx:1.27-alpine
