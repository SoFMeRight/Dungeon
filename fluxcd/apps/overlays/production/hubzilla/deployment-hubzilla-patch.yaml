apiVersion: apps/v1
kind: Deployment
metadata:
  name: hubzilla
spec:
  replicas: 2
  template:
    metadata:
      labels:
        policy.prplanit.com/access-scope-mariadb: outspokekin-social.hubzilla.mariadb
    spec:
      volumes:
        - name: socialauth-button
          configMap:
            name: hubzilla-socialauth-button
      containers:
        - name: web
          image: ghcr.io/homelabhd/hubzilla:v11.4.2@sha256:ee759260c7a4a48717e77e6af057d3bc62a0b6f6faba8ab1162c984e5b7e43d4
          volumeMounts:
            # addon/socialauth is a symlink, so the file is mounted at the real path it
            # points into rather than through the link.
            - name: socialauth-button
              mountPath: /var/www/html/extend/addon/addons-official/socialauth/buttons/button_prplanit.html
              subPath: button_prplanit.html
              readOnly: true
