apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: outspokekin-apex-delegation
spec:
  # The apex is the identity half of every handle here (@user@outspokekin.com) while the
  # server answers on social. These three lookups are how a remote instance resolves one
  # to the other, so they belong to the apex rather than to whatever else it serves.
  # Matrix delegation joins here later under /.well-known/matrix/.
  parentRefs:
    - name: cell-membrane-gateway
      namespace: hyrule-castle
  hostnames:
    - "outspokekin.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /.well-known/webfinger
        - path:
            type: PathPrefix
            value: /.well-known/host-meta
        - path:
            type: PathPrefix
            value: /.well-known/nodeinfo
      filters:
        - type: RequestRedirect
          requestRedirect:
            hostname: social.outspokekin.com
            statusCode: 301
