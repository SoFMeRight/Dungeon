apiVersion: apps/v1
kind: Deployment
metadata:
  name: hubzilla-cron
spec:
  template:
    metadata:
      labels:
        policy.prplanit.com/access-scope-mariadb: outspokekin-social.hubzilla.mariadb
    spec:
      initContainers:
        - name: webroot
          image: ghcr.io/homelabhd/hubzilla:v11.4.2
        - name: schema
          image: docker.io/mariadb:12.3
      containers:
        - name: cron
          image: ghcr.io/homelabhd/hubzilla:v11.4.2
