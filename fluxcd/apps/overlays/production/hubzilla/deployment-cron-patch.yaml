apiVersion: apps/v1
kind: Deployment
metadata:
  name: hubzilla-cron
spec:
  template:
    metadata:
      labels:
        policy.prplanit.com/access-scope-mariadb: temple-of-time.hubzilla.mariadb
    spec:
      initContainers:
        - name: webroot
          image: docker.io/hlhd/hubzilla:dev-50b3a1c
        - name: schema
          image: docker.io/mariadb:11.8
      containers:
        - name: cron
          image: docker.io/hlhd/hubzilla:dev-50b3a1c
