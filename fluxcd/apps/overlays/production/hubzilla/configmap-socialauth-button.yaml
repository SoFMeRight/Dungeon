apiVersion: v1
kind: ConfigMap
metadata:
  name: hubzilla-socialauth-button
data:
  # socialauth renders a plain bulleted link unless it finds a button file named for the
  # provider; the token socialauth_redirect is substituted for the real handler at render
  # time. Bootstrap classes rather than the fixed white of the addon's own examples, so it
  # follows the theme instead of fighting it.
  button_prplanit.html: |
    <style type="text/css">
    /* The addon prints a "Sign in with:" heading that only repeats what the button says.
       Its class is on the DIV WRAPPING the buttons, so only the heading span is hidden —
       hiding the class itself takes the button with it. */
    .socialauthlabel > span {
        display: none;
    }
    .prplanit-signin {
        display: block;
        max-width: 400px;
        margin: auto;
        padding-top: 0.5em;
    }
    #prplanitBtn {
        width: 100%;
        font-weight: 600;
    }
    </style>
    <div class="prplanit-signin">
        <button type="button" id="prplanitBtn" class="btn btn-primary" onclick="socialauth_redirect">Login with PrPlanIT SSO</button>
    </div>
