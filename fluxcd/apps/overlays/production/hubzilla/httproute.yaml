apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubzilla
  annotations:
    gatus.home-operations.com/endpoint: |
      group: "Social (Temple of Time⏳)"
spec:
  # Public: federation is inbound as well as outbound — remote instances deliver
  # activity here and resolve the apex's .well-known redirects to this host.
  parentRefs:
    - name: cell-membrane-gateway
      namespace: hyrule-castle
  hostnames:
    - "social.etherealclique.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: hubzilla
          port: 8080
