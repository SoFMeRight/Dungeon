apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: anirra-xylem
  annotations:
    gatus.home-operations.com/endpoint: |
      group: "Downloads & Media (Swift Sail⛵)"
spec:
  parentRefs:
    - name: phloem-ingress-gateway
      namespace: optcp-ingress-internal
  hostnames:
    - "anime.pcfae.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: anirra
          port: 3000
