apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: optcp-web

resources:
  - ../../../base/astralfocal-site
  - httproute.yaml

patches:
  - path: deployment-patch.yaml
    target:
      kind: Deployment
      name: astralfocal-site
  - path: service-patch.yaml
    target:
      kind: Service
      name: astralfocal-site
  - path: service-astralfocal-site-ingress-patch.yaml
    target:
      kind: Service
      name: astralfocal-site
