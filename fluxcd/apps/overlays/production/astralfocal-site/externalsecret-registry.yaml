apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cr-pcfae-admin-pull-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-zeldas-letter
    kind: ClusterSecretStore
  target:
    name: cr-pcfae-admin-pull-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "cr.pcfae.com": {
                "auth": "{{ printf "%s:%s" .username .password | b64enc }}",
                "email": ""
              }
            }
          }
  dataFrom:
    - extract:
        key: registries/cr.pcfae.com
