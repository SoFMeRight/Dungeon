apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: penpot-exporter
spec:
  template:
    spec:
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
      imagePullSecrets:
        - name: docker-io-pull-secret
      containers:
        - name: exporter
          image: docker.io/penpotapp/exporter:2.17.0
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # readOnlyRootFilesystem: exporter runs headless chrome; /tmp for browser scratch.
        - name: tmp
          emptyDir: {}
