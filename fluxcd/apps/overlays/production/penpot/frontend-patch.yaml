apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: penpot-frontend
spec:
  template:
    metadata:
      labels:
        policy.prplanit.com/ingress: "true"
    spec:
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      imagePullSecrets:
        - name: docker-io-pull-secret
      containers:
        - name: frontend
          image: docker.io/penpotapp/frontend:2.17.1
          # readOnlyRootFilesystem is deliberately NOT set (RO-root exception):
          # the frontend entrypoint generates /etc/nginx/nginx.conf from
          # /tmp/nginx.conf.template and rewrites config.js + /etc/nginx/overrides
          # on the rootfs at startup (runs as penpot uid 1001, which owns them).
          # A read-only rootfs — or an emptyDir over /tmp masking the template —
          # leaves nginx serving the stock welcome page. Other hardening stays.
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: PENPOT_FLAGS
              value: >-
                enable-login-with-password enable-login-with-oidc
                enable-oidc-registration enable-smtp disable-registration
            - name: PENPOT_PUBLIC_URI
              value: "https://penpot.prplanit.com"
          # Frontend nginx serves the SPA on 8080; probe it so a non-serving
          # frontend surfaces as not-ready instead of "Running" behind a 503.
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: penpot-assets
              mountPath: /opt/data/assets
      volumes:
        - name: penpot-assets
          persistentVolumeClaim:
            claimName: penpot-assets-pvc
  volumeClaimTemplates: []
