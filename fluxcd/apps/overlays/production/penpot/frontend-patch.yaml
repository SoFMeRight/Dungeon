apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: penpot-frontend
spec:
  template:
    metadata:
      labels:
        policy.prplanit.com/ingress: "true"
    spec:
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      imagePullSecrets:
        - name: docker-io-pull-secret
      containers:
        - name: frontend
          image: docker.io/penpotapp/frontend:2.17.1
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: PENPOT_FLAGS
              value: >-
                enable-login-with-password enable-login-with-oidc
                enable-oidc-registration enable-smtp disable-registration
            - name: PENPOT_PUBLIC_URI
              value: "https://penpot.prplanit.com"
          volumeMounts:
            - name: penpot-assets
              mountPath: /opt/data/assets
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: nginx-confd
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: penpot-assets
          persistentVolumeClaim:
            claimName: penpot-assets-pvc
        # readOnlyRootFilesystem: nginx frontend templates config into conf.d; cache/pid/tmp scratch.
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: nginx-confd
          emptyDir: {}
  volumeClaimTemplates: []
