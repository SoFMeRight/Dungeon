apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: penpot-frontend
spec:
  template:
    metadata:
      labels:
        policy.prplanit.com/ingress: "true"
    spec:
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      imagePullSecrets:
        - name: docker-io-pull-secret
      containers:
        - name: frontend
          image: docker.io/penpotapp/frontend:2.17.1
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: PENPOT_FLAGS
              value: >-
                enable-login-with-password enable-login-with-oidc
                enable-oidc-registration enable-smtp disable-registration
            - name: PENPOT_PUBLIC_URI
              value: "https://penpot.prplanit.com"
          # Frontend nginx serves the SPA on 8080; probe it so a non-serving
          # frontend surfaces as not-ready instead of "Running" behind a 503.
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: penpot-assets
              mountPath: /opt/data/assets
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
      volumes:
        - name: penpot-assets
          persistentVolumeClaim:
            claimName: penpot-assets-pvc
        # readOnlyRootFilesystem: nginx needs writable pid/cache/temp scratch only.
        # conf.d stays on the read-only rootfs — it holds the image's shipped
        # server config (listen 8080) that nginx loads via include.
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
  volumeClaimTemplates: []
