apiVersion: apps/v1
kind: Deployment
metadata:
  name: guacamole-guacd
spec:
  template:
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: guacd
          image: docker.io/guacamole/guacd@sha256:646f0f03bcf5890af1db8f4c95a5d41c686389902cb5fed7f9161352bf51a5b0
          securityContext:
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: "10m"
              memory: "512Mi"
            limits:
              cpu: 10m
              memory: "512Mi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # readOnlyRootFilesystem: guacd writes recordings/drawings to /tmp scratch.
        - name: tmp
          emptyDir: {}
