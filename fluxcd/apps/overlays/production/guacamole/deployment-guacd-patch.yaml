apiVersion: apps/v1
kind: Deployment
metadata:
  name: guacamole-guacd
spec:
  template:
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: guacd
          image: docker.io/guacamole/guacd@sha256:4f7f1a76b68358335f75877cea9a78cf9df1361b20c08608e4ec44ba39fdb80c
          securityContext:
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: "10m"
              memory: "512Mi"
            limits:
              cpu: 10m
              memory: "512Mi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # readOnlyRootFilesystem: guacd writes recordings/drawings to /tmp scratch.
        - name: tmp
          emptyDir: {}
