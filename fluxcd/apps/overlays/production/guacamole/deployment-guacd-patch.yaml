apiVersion: apps/v1
kind: Deployment
metadata:
  name: guacamole-guacd
spec:
  template:
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: guacd
          image: docker.io/guacamole/guacd@sha256:4c3f04301c1aa46650ead0198bebe682a7749f4ca90cb8f2d27eaaca15d0d07b
          securityContext:
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: "10m"
              memory: "512Mi"
            limits:
              cpu: 10m
              memory: "512Mi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # readOnlyRootFilesystem: guacd writes recordings/drawings to /tmp scratch.
        - name: tmp
          emptyDir: {}
