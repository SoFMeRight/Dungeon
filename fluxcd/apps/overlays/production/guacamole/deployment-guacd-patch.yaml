apiVersion: apps/v1
kind: Deployment
metadata:
  name: guacamole-guacd
spec:
  template:
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: guacd
          image: docker.io/guacamole/guacd@sha256:6e3576cbbda19f4c73951d1a7e5b0f0d96f5ba456c727605611eefb181cb0da8
          securityContext:
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: "10m"
              memory: "512Mi"
            limits:
              cpu: 10m
              memory: "512Mi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # readOnlyRootFilesystem: guacd writes recordings/drawings to /tmp scratch.
        - name: tmp
          emptyDir: {}
