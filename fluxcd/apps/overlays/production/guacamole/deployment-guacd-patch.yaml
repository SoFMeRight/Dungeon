apiVersion: apps/v1
kind: Deployment
metadata:
  name: guacamole-guacd
spec:
  template:
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: guacd
          image: docker.io/guacamole/guacd@sha256:2267a4a8dd4c473725e413a645cb41040abbe7f46417ff0e4b57693d2c2f2286
          securityContext:
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: "10m"
              memory: "512Mi"
            limits:
              cpu: 10m
              memory: "512Mi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # readOnlyRootFilesystem: guacd writes recordings/drawings to /tmp scratch.
        - name: tmp
          emptyDir: {}
