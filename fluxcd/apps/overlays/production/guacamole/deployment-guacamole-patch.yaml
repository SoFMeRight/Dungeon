apiVersion: apps/v1
kind: Deployment
metadata:
  name: guacamole
spec:
  template:
    metadata:
      labels:
        policy.prplanit.com/ingress: "true"
        policy.prplanit.com/cap.postgres: "true"
        policy.prplanit.com/access-scope-postgres: optcp-remote-access.guacamole.postgres
    spec:
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
      initContainers:
        - name: generate-initdb
          image: docker.io/guacamole/guacamole@sha256:46a703b1f3cd87903176655d25dcd3349ba3ae26b3f56705723d6593ac55b4ec
        - name: init-db
          image: docker.io/postgres:15-alpine
      containers:
        - name: guacamole
          image: docker.io/guacamole/guacamole@sha256:46a703b1f3cd87903176655d25dcd3349ba3ae26b3f56705723d6593ac55b4ec
          securityContext:
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: 725m
              memory: "2Gi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: tomcat-temp
              mountPath: /usr/local/tomcat/temp
            - name: tomcat-work
              mountPath: /usr/local/tomcat/work
            - name: tomcat-logs
              mountPath: /usr/local/tomcat/logs
      volumes:
        # readOnlyRootFilesystem: Tomcat needs writable temp/work/logs + /tmp scratch.
        - name: tmp
          emptyDir: {}
        - name: tomcat-temp
          emptyDir: {}
        - name: tomcat-work
          emptyDir: {}
        - name: tomcat-logs
          emptyDir: {}
