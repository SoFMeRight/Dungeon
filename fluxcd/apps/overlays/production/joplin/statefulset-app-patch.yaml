apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: joplin-app
spec:
  template:
    metadata:
      labels:
        policy.prplanit.com/ingress: "true"
        policy.prplanit.com/cap.postgres: "true"
        policy.prplanit.com/access-scope-postgres: temple-of-time.joplin.postgres
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: joplin
          image: docker.io/joplin/server:3.7.2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: APP_BASE_URL
              value: "https://joplin.pcfae.com"
            - name: PM2_HOME
              value: /tmp/pm2
            # Disable joplin-server's boot-time NTP self-check. In Kubernetes the
            # container clock is the node clock, which chrony already disciplines,
            # so the pod time is correct; the check only adds an external NTP
            # dependency this pod cannot satisfy (UDP/123 egress is blocked and
            # the internal chrony sits behind a LoadBalancer VIP that in-cluster
            # traffic cannot hair-pin), and its hard-exit on failure crash-loops
            # the app. 0 = check disabled (default 2000ms).
            - name: MAX_TIME_DRIFT
              value: "0"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: logs
              mountPath: /home/joplin/packages/server/logs
            - name: temp
              mountPath: /home/joplin/packages/server/temp
      volumes:
        # readOnlyRootFilesystem: data in the external postgres DB; PM2_HOME + scratch on /tmp.
        - name: tmp
          emptyDir: {}
        # joplin-server's two runtime dirs (logDir=${rootDir}/logs, tempDir=${rootDir}/temp) land on
        # the read-only rootfs — give each a writable mount so it can create them on boot.
        - name: logs
          emptyDir: {}
        - name: temp
          emptyDir: {}
