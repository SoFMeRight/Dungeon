apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: optcp-cloud

resources:
  - ../../../base/joplin
  - httproute-xylem.yaml

patches:
  - path: statefulset-postgres-patch.yaml
    target:
      kind: StatefulSet
      name: joplin-postgres
  - path: statefulset-app-patch.yaml
    target:
      kind: StatefulSet
      name: joplin-app
  - path: externalsecret-patch.yaml
    target:
      kind: ExternalSecret
      name: joplin-secrets
  - path: service-joplin-app-ingress-patch.yaml
    target:
      kind: Service
      name: joplin-app
