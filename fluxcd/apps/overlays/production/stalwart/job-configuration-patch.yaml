apiVersion: batch/v1
kind: Job
metadata:
  name: stalwart-configuration
spec:
  template:
    spec:
      initContainers:
        - name: render-plan
          image: docker.io/busybox:1.38
        - name: configuration
          image: docker.io/stalwartlabs/cli:1.0.14
          resources:
            requests:
              memory: 32Mi
              cpu: 10m
            limits:
              memory: 128Mi
              cpu: 200m
      containers:
        - name: identities
          image: docker.io/alpine/k8s:1.37.1
          env:
            # The Gmail sync's own account, and the app password it logs in with: IMAP only.
            # Raise ROTATION to replace the app password on the next run.
            - name: ACCOUNT_NAME
              value: gmail-sync
            - name: APP_PASSWORD_NAME
              value: gmail-sync
            - name: APP_PASSWORD_PERMISSIONS
              value: >-
                authenticate imapAuthenticate imapCapability imapId imapEnable imapNamespace
                imapList imapLsub imapStatus imapSelect imapExamine imapFetch imapSearch imapStore
                imapAppend imapCopy imapMove imapExpunge imapCreate imapDelete imapRename
                imapSubscribe imapIdle
            - name: ROTATION
              value: "1"
            - name: VAULT_ADDR
              value: http://openbao.optcp-secrets.svc.cluster.local:8200
            - name: VAULT_ROLE
              value: stalwart-configuration
            - name: VAULT_MOUNT
              value: optcp
            - name: APP_PASSWORD_PATH
              value: apps/stalwart/gmail-sync
            # One smtp-<name> entry per mailbox, created empty but for HOST and PORT; the
            # Operator fills USERNAME, PASSWORD and FROM. Never overwritten.
            - name: SEED_PREFIX
              value: apps/stalwart/smtp-
            - name: GMAIL_MAILBOXES
              value: >-
                timecapsuleops outspokekin sofmeright precisionplanit homelabhelp
                klhfcknbrnr thecodesbykai optimecapsule prplanit
            - name: IMAP_HOST
              value: imap.gmail.com
            - name: IMAP_PORT
              value: "993"
