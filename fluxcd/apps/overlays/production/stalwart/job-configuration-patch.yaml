apiVersion: batch/v1
kind: Job
metadata:
  name: stalwart-configuration
spec:
  template:
    spec:
      containers:
        - name: configuration
          image: docker.io/stalwartlabs/cli:1.0.13
          resources:
            requests:
              memory: 32Mi
              cpu: 10m
            limits:
              memory: 128Mi
              cpu: 200m
