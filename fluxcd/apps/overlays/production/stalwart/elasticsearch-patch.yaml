apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stalwart-elasticsearch
spec:
  template:
    spec:
      containers:
        - name: elasticsearch
          image: docker.io/library/elasticsearch:9.5.5
          env:
            - name: ES_JAVA_OPTS
              value: "-Xms1g -Xmx1g"
            # Stalwart sends whole search batches in one bulk request; the default 10% of heap
            # rejects them, and Stalwart cannot see per-document rejections.
            - name: indexing_pressure.memory.limit
              value: "25%"
          resources:
            requests:
              cpu: 35m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: ceph-rbd
        resources:
          requests:
            storage: 5Gi
