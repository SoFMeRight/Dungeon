apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: optcp-delivery-bag
resources:
  - ../../../base/stalwart
  - certificate.yaml
  - httproute.yaml
  - postgres-database-v1.yaml
  - migrate.yaml
configMapGenerator:
  - name: stalwart-env
    literals:
      - STALWART_PUBLIC_URL=https://mail-admin.optcp.com
      - STALWART_HOSTNAME=mail.optcp.com
      # Stores are read only at startup: the plan sets them while recovery mode holds the index queue.
      - STALWART_RECOVERY_MODE=true
  - name: stalwart-config
    files:
      - config.json
  - name: stalwart-config-v1
    files:
      - config.json=config-v1.json
  - name: stalwart-plan
    files:
      - plan.ndjson
patches:
  - path: postgres-cluster-patch.yaml
  - path: objectstore-postgres-patch.yaml
  - path: deployment-patch.yaml
  - path: job-configuration-patch.yaml
  - path: service-mail-patch.yaml
  - path: redis-replication-patch.yaml
  - path: elasticsearch-patch.yaml
