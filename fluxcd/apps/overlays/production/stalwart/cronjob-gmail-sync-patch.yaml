apiVersion: batch/v1
kind: CronJob
metadata:
  name: stalwart-gmail-sync
spec:
  schedule: "7 * * * *"
  timeZone: America/Los_Angeles
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: imapsync
              image: docker.io/gilleslamiral/imapsync:2.326@sha256:ece980cb0fd2806369975d2989a3e8d9fbf28d632cdd45a05961a1e511612ed5
              env:
                # Entries apps/stalwart/smtp-<name> land in Gmail/<name>.
                - name: ENTRY_PREFIX
                  value: smtp-
                # Stalwart's IMAPS inside the cluster; the certificate is for mail.optcp.com.
                - name: TARGET_HOST
                  value: stalwart-mail.optcp-delivery-bag.svc.cluster.local
                - name: TARGET_PORT
                  value: "993"
                - name: TARGET_TLS_NAME
                  value: mail.optcp.com
                - name: TARGET_USERNAME
                  value: kai@optcp.com
                - name: FOLDER_PREFIX
                  value: Gmail
                # Gmail's virtual folders repeat what the labels already hold.
                - name: EXCLUDE
                  value: '^\[Gmail\]/(All Mail|Important|Starred|Spam|Trash)$'
                - name: IMAPSYNC_OPTIONS
                  value: --automap --skipcrossduplicates --useheader Message-Id --syncinternaldates --nofoldersizes
