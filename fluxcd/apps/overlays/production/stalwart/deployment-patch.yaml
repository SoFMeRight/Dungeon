apiVersion: apps/v1
kind: Deployment
metadata:
  name: stalwart
spec:
  template:
    metadata:
      annotations:
        # Stores and tracers are read only at startup.
        kubectl.kubernetes.io/restartedAt: "2026-10-31T01:20:00Z"
      labels:
        policy.prplanit.com/ingress: "true"
        policy.prplanit.com/cap.postgres: "true"
        policy.prplanit.com/access-scope-postgres: optcp-delivery-bag.stalwart.postgres
        policy.prplanit.com/cap.s3: "true"
        policy.prplanit.com/access-scope-s3: gorons-bracelet.rgw
        policy.prplanit.com/cap.oidc: "true"
        policy.prplanit.com/cap.redis: "true"
        policy.prplanit.com/access-scope-redis: optcp-delivery-bag.stalwart.redis
    spec:
      initContainers:
        - name: wait-for-db
          image: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
      containers:
        - name: stalwart
          image: docker.io/stalwartlabs/stalwart:v1.0.1
          env:
            - name: STALWART_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stalwart-redis-password
                  key: password
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 2Gi
              cpu: 310m
      volumes:
        - name: config
          configMap:
            name: stalwart-config-v1
