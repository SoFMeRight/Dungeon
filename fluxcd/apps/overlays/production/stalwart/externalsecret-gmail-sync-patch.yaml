apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stalwart-gmail-sync
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-optcp
  data:
    - secretKey: TARGET_PASSWORD
      remoteRef:
        key: apps/stalwart/gmail-sync
        property: APP_PASSWORD
  dataFrom:
    - find:
        path: apps/stalwart
        name:
          regexp: "smtp-"
      rewrite:
        - regexp:
            source: "^.*/"
            target: ""
        # A Secret key allows only letters, digits, '-', '.' and '_'.
        - regexp:
            source: "[^A-Za-z0-9._-]"
            target: "_"
