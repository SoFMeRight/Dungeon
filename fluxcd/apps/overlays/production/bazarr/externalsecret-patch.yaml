---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bazarr-vpn-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-great-sea
  data:
    - secretKey: vpn_user
      remoteRef:
        key: apps/gluetun
        property: OPENVPN_USER
    - secretKey: vpn_password
      remoteRef:
        key: apps/gluetun
        property: OPENVPN_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bazarr-smb-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-great-sea
  data:
    - secretKey: username
      remoteRef:
        key: apps/bazarr
        property: SAMBA_USERNAME
    - secretKey: password
      remoteRef:
        key: apps/bazarr
        property: SAMBA_PASSWORD
