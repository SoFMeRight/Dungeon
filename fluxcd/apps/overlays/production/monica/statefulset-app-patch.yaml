apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: monica
spec:
  replicas: 1
  template:
    metadata:
      labels:
        policy.prplanit.com/ingress: "true"
    spec:
      initContainers:
        - name: copy-app
          image: docker.io/monica:4.1.2-fpm-alpine@sha256:acd19d04ca33daee024206c7f00c0a9a29f4bbe1560ba232315dfac40004d495
      containers:
        - name: nginx
          image: docker.io/nginx:1.31.8-alpine
        - name: monica
          image: docker.io/monica:4.1.2-fpm-alpine@sha256:acd19d04ca33daee024206c7f00c0a9a29f4bbe1560ba232315dfac40004d495
          env:
            - name: APP_URL
              value: "https://monica.pcfae.com"
          volumeMounts:
            - name: pedestal-of-time-monica-data
              mountPath: /var/www/html/storage
            - name: app-files
              mountPath: /var/www/html
  volumeClaimTemplates:
    - metadata:
        name: pedestal-of-time-monica-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ceph-rbd-retain
        resources:
          requests:
            storage: 10Gi
