apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: monica
spec:
  replicas: 1
  template:
    metadata:
      labels:
        policy.prplanit.com/ingress: "true"
    spec:
      initContainers:
        - name: copy-app
          image: docker.io/monica:4.1.2-fpm-alpine@sha256:25e07143ea727a47c4eda6bd04f8c6d306626d9271777de7a1ce64a7277f41d9
      containers:
        - name: nginx
          image: docker.io/nginx:1.31.8-alpine
        - name: monica
          image: docker.io/monica:4.1.2-fpm-alpine@sha256:25e07143ea727a47c4eda6bd04f8c6d306626d9271777de7a1ce64a7277f41d9
          env:
            - name: APP_URL
              value: "https://monica.pcfae.com"
          volumeMounts:
            - name: monica-data
              mountPath: /var/www/html/storage
            - name: app-files
              mountPath: /var/www/html
  volumeClaimTemplates:
    - metadata:
        name: monica-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ceph-rbd-retain
        resources:
          requests:
            storage: 10Gi
