apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: monica
spec:
  replicas: 1
  template:
    metadata:
      labels:
        policy.prplanit.com/ingress: "true"
    spec:
      initContainers:
        - name: copy-app
          image: docker.io/monica:4.1.2-fpm-alpine@sha256:07087664f42e67d1b5daf01cd752c6b8441492fcd115b9a3cdf690abbedbdfac
      containers:
        - name: nginx
          image: docker.io/nginx:1.31.8-alpine
        - name: monica
          image: docker.io/monica:4.1.2-fpm-alpine@sha256:07087664f42e67d1b5daf01cd752c6b8441492fcd115b9a3cdf690abbedbdfac
          env:
            - name: APP_URL
              value: "https://monica.pcfae.com"
          volumeMounts:
            - name: pedestal-of-time-monica-data
              mountPath: /var/www/html/storage
            - name: app-files
              mountPath: /var/www/html
  volumeClaimTemplates:
    - metadata:
        name: pedestal-of-time-monica-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ceph-rbd-retain
        resources:
          requests:
            storage: 10Gi
