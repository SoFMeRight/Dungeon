apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: monica
spec:
  replicas: 1
  template:
    metadata:
      labels:
        policy.prplanit.com/ingress: "true"
    spec:
      initContainers:
        - name: copy-app
          image: docker.io/monica:4.1.2-fpm-alpine@sha256:b4b8e76fe2ea13dd7ed8e125180d12249fd68a70221653963bf78c2f096f7ef9
      containers:
        - name: nginx
          image: docker.io/nginx:1.31.10-alpine
        - name: monica
          image: docker.io/monica:4.1.2-fpm-alpine@sha256:b4b8e76fe2ea13dd7ed8e125180d12249fd68a70221653963bf78c2f096f7ef9
          env:
            - name: APP_URL
              value: "https://monica.pcfae.com"
          volumeMounts:
            - name: monica-data
              mountPath: /var/www/html/storage
            - name: app-files
              mountPath: /var/www/html
  volumeClaimTemplates:
    - metadata:
        name: monica-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ceph-rbd-retain
        resources:
          requests:
            storage: 10Gi
