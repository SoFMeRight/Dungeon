apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: monica
spec:
  replicas: 1
  template:
    metadata:
      labels:
        policy.prplanit.com/ingress: "true"
    spec:
      initContainers:
        - name: copy-app
          image: docker.io/monica:4.1.2-fpm-alpine@sha256:1e1ffe44af268b5a1d670d697efc196416eb562af7e85da37b825f24c7dad3b8
      containers:
        - name: nginx
          image: docker.io/nginx:1.31.8-alpine
        - name: monica
          image: docker.io/monica:4.1.2-fpm-alpine@sha256:1e1ffe44af268b5a1d670d697efc196416eb562af7e85da37b825f24c7dad3b8
          env:
            - name: APP_URL
              value: "https://monica.pcfae.com"
          volumeMounts:
            - name: pedestal-of-time-monica-data
              mountPath: /var/www/html/storage
            - name: app-files
              mountPath: /var/www/html
  volumeClaimTemplates:
    - metadata:
        name: pedestal-of-time-monica-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ceph-rbd-retain
        resources:
          requests:
            storage: 10Gi
