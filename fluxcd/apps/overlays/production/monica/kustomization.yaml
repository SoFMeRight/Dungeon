apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: arbitorium-restricted
resources:
  - ../../../base/monica
  - httproute-xylem.yaml
patches:
  - path: statefulset-app-patch.yaml
    target:
      kind: StatefulSet
      name: monica
  - path: statefulset-db-patch.yaml
    target:
      kind: StatefulSet
      name: monica-db
  - path: service-monica-ingress-patch.yaml
    target:
      kind: Service
      name: monica
