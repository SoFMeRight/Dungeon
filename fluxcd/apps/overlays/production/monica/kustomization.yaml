apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: arbitorium-restricted
resources:
  - ../../../base/monica
  - httproute-xylem.yaml
# Held at zero for the volume re-bind into arbitorium-restricted.
replicas:
  - name: monica
    count: 0
  - name: monica-db
    count: 0

patches:
  - path: statefulset-app-patch.yaml
    target:
      kind: StatefulSet
      name: monica
  - path: statefulset-db-patch.yaml
    target:
      kind: StatefulSet
      name: monica-db
  - path: service-monica-ingress-patch.yaml
    target:
      kind: Service
      name: monica
