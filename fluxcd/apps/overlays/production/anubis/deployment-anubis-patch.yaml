apiVersion: apps/v1
kind: Deployment
metadata:
  name: anubis
spec:
  replicas: 1
  template:
    metadata:
      labels:
        policy.prplanit.com/ingress: "true"
        policy.prplanit.com/metrics: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: anubis
          image: ghcr.io/techarohq/anubis:v1.28.2
          securityContext:
            readOnlyRootFilesystem: true
          env:
            - name: DIFFICULTY
              value: "4"
            # GitLab's own robots.txt passes through; anubis's would disallow every crawler
            - name: SERVE_ROBOTS_TXT
              value: "false"
            # Unset, anubis redirects to any domain after a challenge
            - name: REDIRECT_DOMAINS
              value: "git.prplanit.com"
            - name: TARGET
              value: "http://gitlab-webservice-default.optcp-supply-chain.svc.cluster.local:8181"
            - name: OG_PASSTHROUGH
              value: "true"
            - name: OG_EXPIRY_TIME
              value: "24h"
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 128Mi
              cpu: 100m
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # readOnlyRootFilesystem: anubis is a stateless proxy; /tmp is defensive scratch.
        - name: tmp
          emptyDir: {}
