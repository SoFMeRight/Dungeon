apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: optcp-edge-defenses
resources:
  - ../../../base/anubis
  - httproute-xylem.yaml
patches:
  - path: deployment-anubis-patch.yaml
  - path: configmap-bot-policy-patch.yaml
  - path: externalsecret-patch.yaml
  - path: service-anubis-ingress-patch.yaml
    target:
      kind: Service
      name: anubis
