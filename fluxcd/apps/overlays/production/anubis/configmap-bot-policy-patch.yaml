apiVersion: v1
kind: ConfigMap
metadata:
  name: anubis-bot-policy
data:
  botPolicy.json: |
    {
      "bots": [
        {
          "name": "well-known",
          "path_regex": "^/.well-known/.*$",
          "action": "ALLOW"
        },
        {
          "name": "favicon",
          "path_regex": "^/favicon.ico$",
          "action": "ALLOW"
        },
        {
          "name": "robots-txt",
          "path_regex": "^/robots.txt$",
          "action": "ALLOW"
        },
        {
          "name": "gitlab-git-http",
          "path_regex": "^/.+\\.git/(info/refs|info/lfs/.*|git-upload-pack|git-receive-pack)$",
          "action": "ALLOW"
        },
        {
          "name": "gitlab-api",
          "path_regex": "^/(api|oauth|jwt)/.*$",
          "action": "ALLOW"
        },
        {
          "name": "gitlab-health",
          "path_regex": "^/-/(health|readiness|liveness)$",
          "action": "ALLOW"
        },
        {
          "name": "generic-browser",
          "user_agent_regex": "Mozilla",
          "action": "CHALLENGE"
        }
      ]
    }
