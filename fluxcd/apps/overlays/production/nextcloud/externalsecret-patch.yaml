apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-secrets
spec:
  secretStoreRef:
    name: openbao-optcp
    kind: ClusterSecretStore
  target:
    deletionPolicy: Retain
  data:
    # App credentials
    - secretKey: NEXTCLOUD_ADMIN_USER
      remoteRef:
        key: apps/nextcloud/app
        property: ADMIN_USER
    - secretKey: NEXTCLOUD_ADMIN_PASSWORD
      remoteRef:
        key: apps/nextcloud/app
        property: ADMIN_PASSWORD
    # Database
    - secretKey: POSTGRES_USER
      remoteRef:
        key: apps/nextcloud/postgres
        property: USER
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: apps/nextcloud/postgres
        property: PASSWORD
    # Cache
    - secretKey: REDIS_HOST_PASSWORD
      remoteRef:
        key: apps/nextcloud/redis
        property: PASSWORD
    # SMTP
    - secretKey: SMTP_NAME
      remoteRef:
        key: apps/nextcloud/smtp
        property: USERNAME
    - secretKey: SMTP_PASSWORD
      remoteRef:
        key: apps/nextcloud/smtp
        property: PASSWORD
    - secretKey: SMTP_HOST
      remoteRef:
        key: apps/nextcloud/smtp
        property: HOST
    # Integrations
    - secretKey: TALK_HPB_SECRET
      remoteRef:
        key: apps/nextcloud/app
        property: TALK_HPB_SECRET
    - secretKey: WHITEBOARD_JWT_SECRET
      remoteRef:
        key: apps/nextcloud/app
        property: WHITEBOARD_JWT_SECRET
