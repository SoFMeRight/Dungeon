# Nextcloud config for the migration Job (NEXTCLOUD_CONFIG_DIR), copied into a
# writable emptyDir. instanceid, version, datadirectory and apps_paths match the
# instance; the database, bucket and keys come from the Job's environment.
# objectstore.config.php is added only after the database rewrite.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nextcloud-migrate-s3-config
data:
  config.php: |
    <?php
    $CONFIG = array(
      'instanceid' => 'oc1zg04r2ckt',
      'installed' => true,
      'version' => '34.0.4.1',
      'datadirectory' => '/var/www/html/data',
      'check_data_directory_permissions' => false,
      'dbtype' => 'pgsql',
      'dbhost' => getenv('DB_HOST'),
      'dbname' => 'nextcloud',
      'dbuser' => getenv('DB_USER'),
      'dbpassword' => getenv('DB_PASSWORD'),
      'dbtableprefix' => 'oc_',
      'apps_paths' => array(
        array('path' => '/var/www/html/apps', 'url' => '/apps', 'writable' => false),
        array('path' => '/var/www/html/custom_apps', 'url' => '/custom_apps', 'writable' => false),
      ),
      'appstoreenabled' => false,
      'log_type' => 'errorlog',
      'loglevel' => 2,
    );
  objectstore.config.php: |
    <?php
    $CONFIG = array(
      'objectstore' => array(
        'class' => '\\OC\\Files\\ObjectStore\\S3',
        'arguments' => array(
          'bucket' => getenv('S3_BUCKET'),
          'hostname' => 'ceph-rgw.gorons-bracelet.svc.cluster.local',
          'port' => 80,
          'use_ssl' => false,
          'use_path_style' => true,
          'region' => 'us-east-1',
          'key' => getenv('S3_KEY'),
          'secret' => getenv('S3_SECRET'),
          'autocreate' => false,
        ),
      ),
    );
