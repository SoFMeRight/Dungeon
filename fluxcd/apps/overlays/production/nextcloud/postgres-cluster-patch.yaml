apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: nextcloud-postgres
spec:
  # Requests lift this out of BestEffort so the kubelet does not reclaim the database
  # first under node pressure. Sized from observed use (~187Mi resident): memory is what
  # drives eviction, so the request carries the headroom. The floor is shared_buffers
  # (512MB) — postgres reserves it up front and CNPG rejects a request below it.
  resources:
    requests:
      memory: "768Mi"
      cpu: "100m"
    limits:
      memory: "1536Mi"
      cpu: "1000m"

  inheritedMetadata:
    labels:
      policy.prplanit.com/cnpg: "managed"
      policy.prplanit.com/access-class: postgres
      policy.prplanit.com/service-scope: temple-of-time.nextcloud.postgres
      policy.prplanit.com/cap.s3: "true"
      policy.prplanit.com/access-scope-s3: gorons-bracelet.rgw

  instances: 3

  postgresql:
    parameters:
      shared_buffers: "512MB"
      max_connections: "200"

  bootstrap:
    initdb:
      database: nextcloud
      owner: nextcloud

  enableSuperuserAccess: true

  storage:
    storageClass: ceph-rbd
    size: 8Gi

  backup:
    barmanObjectStore:
      destinationPath: s3://nextcloud-backups/postgresql
      endpointURL: https://s3.pcfae.com
