apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: nextcloud-postgres
spec:
  inheritedMetadata:
    labels:
      policy.prplanit.com/cnpg: "managed"
      policy.prplanit.com/access-class: postgres
      policy.prplanit.com/service-scope: temple-of-time.nextcloud.postgres
      policy.prplanit.com/cap.s3: "true"
      policy.prplanit.com/access-scope-s3: gorons-bracelet.rgw

  instances: 3

  postgresql:
    parameters:
      shared_buffers: "512MB"
      max_connections: "200"

  bootstrap:
    initdb:
      database: nextcloud
      owner: nextcloud

  enableSuperuserAccess: true

  storage:
    storageClass: ceph-rbd
    # Bumped 8Gi->20Gi 2026-08-25: WAL archiving to S3 had stalled and un-archived WAL
    # (8GB) filled the volume, crashlooping the primary on "Not enough disk space". The
    # headroom lets the primary start and drain the WAL backlog to S3 (archive creds verified
    # working). 85MB of actual data; WAL returns to normal once drained.
    size: 20Gi

  backup:
    barmanObjectStore:
      destinationPath: s3://nextcloud-backups/postgresql
      endpointURL: https://s3.pcfae.com
