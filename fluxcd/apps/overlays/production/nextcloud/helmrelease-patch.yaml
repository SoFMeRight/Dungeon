apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud
spec:
  chart:
    spec:
      # renovate: datasource=helm depName=nextcloud registryUrl=https://nextcloud.github.io/helm/
      version: "9.1.4"
  values:
    podLabels:
      policy.prplanit.com/ingress: "true"
      policy.prplanit.com/cap.postgres: "true"
      policy.prplanit.com/access-scope-postgres: temple-of-time.nextcloud.postgres
      policy.prplanit.com/cap.redis: "true"
      policy.prplanit.com/access-scope-redis: temple-of-time.nextcloud.redis

    image:
      # renovate: datasource=docker depName=library/nextcloud
      tag: "34.0.3"

    replicaCount: 3

    # Hard spread: one replica per node (matches kimai) so replicas occupy distinct
    # nodes and survive a single node loss. A replica stays Pending if fewer eligible
    # nodes are free (acceptable on a 5-worker cluster).
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: nextcloud
                app.kubernetes.io/component: app
            topologyKey: kubernetes.io/hostname

    nextcloud:
      host: ncloud.optcp.com
      trustedDomains:
        - ncloud.optcp.com
        - ncloud.pcfae.com
        # In-cluster host Collabora's WOPI callback connects to (wopi_callback_url below);
        # only resolvable/reachable in-mesh, so nextcloud must trust it as a valid domain.
        - nextcloud.temple-of-time.svc.cluster.local

      mail:
        enabled: true
        fromAddress: ncloud
        domain: gmail.com
        smtp:
          host: smtp.gmail.com
          secure: tls
          port: 587
          authtype: LOGIN

      extraEnv:
        - name: TRUSTED_PROXIES
          value: "192.168.144.0/20"
        - name: OVERWRITECLIURL
          value: "https://ncloud.optcp.com"
        - name: OVERWRITEPROTOCOL
          value: "https"
        - name: PHP_MEMORY_LIMIT
          value: "1G"
        - name: PHP_UPLOAD_LIMIT
          value: "16G"

      defaultConfigs:
        imaginary.config.php: true

      configs:
        cron.config.php: |-
          <?php
          $CONFIG = array(
            'backgroundjobs_mode' => 'cron',
          );
        session.config.php: |-
          <?php
          if (getenv('REDIS_HOST')) {
            ini_set('session.save_handler', 'redis');
            ini_set('session.save_path',
              'tcp://' . getenv('REDIS_HOST') . ':'
              . (getenv('REDIS_HOST_PORT') ?: '6379')
              . '?auth=' . getenv('REDIS_HOST_PASSWORD')
            );
          }

      # Pin Collabora's WOPI CheckFileInfo callback to the in-cluster nextcloud service, so
      # coolwsd reaches nextcloud east-west instead of the public LB (a meshed pod can't
      # hairpin to the gateway LB IP). richdocuments' wopi_callback_url is DB app-config, not
      # config.php — set it via occ each start (idempotent, self-healing); non-fatal so a
      # mid-upgrade boot isn't blocked. Browser->Collabora (public_wopi_url) is unaffected.
      hooks:
        before-starting: |-
          #!/bin/sh
          # Both settings must go through occ, not chart values: wopi_callback_url is DB
          # app-config, and trusted_domains is only seeded by the chart at INSTALL time (the
          # NEXTCLOUD_TRUSTED_DOMAINS env is ignored on upgrades). Index 10 is a reserved slot
          # for the internal host so it never collides with the chart-managed 0-2. Idempotent.
          su -p www-data -s /bin/sh -c '
            php /var/www/html/occ config:app:set richdocuments wopi_callback_url --value "http://nextcloud.temple-of-time.svc.cluster.local"
            php /var/www/html/occ config:system:set trusted_domains 10 --value "nextcloud.temple-of-time.svc.cluster.local"
          ' || true

      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 1
          maxSurge: 0

      # Partial hardening — nextcloud:apache MUST run as root PID 1 (apache binds the privileged :80
      # and the entrypoint chowns /var/www/html); it cannot run non-root without switching to the
      # fpm+nginx flavor. Verified boot with this set (AH00163 + status.php 200): seccomp RuntimeDefault
      # + drop ALL, adding back only apache's needs — chown/chmod/setuid for the entrypoint chown and
      # worker drop to www-data, plus NET_BIND_SERVICE for the privileged :80 bind.
      podSecurityContext:
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
          add:
            - CHOWN
            - DAC_OVERRIDE
            - FOWNER
            - SETUID
            - SETGID
            - NET_BIND_SERVICE

      # notify_push co-located as a sidecar: talks to nextcloud over localhost (no gateway hairpin,
      # no istio east-west, no trusted-domain juggling). Clients still reach it via the public URL
      # through the nextcloud-notify-push Service (repointed at these pods) + the /push HTTPRoute.
      extraSidecarContainers:
        - name: notify-push
          image: docker.io/icewind1991/notify_push:1.4.0
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: notify-push
              containerPort: 7867
          env:
            - name: PORT
              value: "7867"
            - name: NEXTCLOUD_URL
              value: "http://localhost:80"
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: nextcloud-aux-config
                  key: POSTGRES_HOST
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: nextcloud-aux-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST)/$(POSTGRES_DB)"
            - name: DATABASE_PREFIX
              value: "oc_"
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: nextcloud-aux-config
                  key: REDIS_HOST
            - name: REDIS_HOST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secrets
                  key: REDIS_HOST_PASSWORD
            - name: REDIS_URL
              value: "redis://:$(REDIS_HOST_PASSWORD)@$(REDIS_HOST):6379"

    externalDatabase:
      host: nextcloud-postgres-rw
      database: nextcloud

    externalRedis:
      host: nextcloud-redis-master

    persistence:
      enabled: true
      existingClaim: nextcloud-html

    cronjob:
      enabled: true
      type: sidecar
      # Cron sidecar runs the same image (cron.php, no :80 bind) — same minimal caps minus NET_BIND_SERVICE.
      sidecar:
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
            add:
              - CHOWN
              - DAC_OVERRIDE
              - FOWNER
              - SETUID
              - SETGID

    startupProbe:
      initialDelaySeconds: 30
      periodSeconds: 10
      failureThreshold: 30

    livenessProbe:
      initialDelaySeconds: 120
      periodSeconds: 30

    readinessProbe:
      initialDelaySeconds: 30
      periodSeconds: 15

    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 2
        memory: 2Gi

    collabora:
      enabled: true
      fullnameOverride: nextcloud-collabora
      podLabels:
        policy.prplanit.com/ingress: "true"
      image:
        repository: docker.io/collabora/code
        # Held on the 25.04 line (last-known-good; Renovate pin below). On CODE 26.04.3.1.1,
        # richdocuments 11.1 (NC 34) calls /wopi/settings and getSettings($type) receives null
        # -> TypeError 500 -> coolwsd "Failed to install config" -> document load fails
        # (Collabora bug #16040, WOPISrc query-param mangling). The upstream fix merged
        # 2026-08-20 but is not in any published image yet (newest is 26.04.3.1.1, 2026-08-11).
        # Bump back to a fixed 26.04.x once it ships.
        tag: "25.04.10.3.1"
      collabora:
        aliasgroups:
          - host: "https://ncloud.optcp.com:443"
          # coolwsd validates the WOPISrc host; with wopi_callback_url now pointing at the
          # in-cluster service, that host must be an accepted WOPI host or it self-rejects
          # ("Unauthorized WOPI host").
          - host: "http://nextcloud.temple-of-time.svc.cluster.local:80"
        server_name: ncloud.optcp.com
        extra_params: "--o:ssl.enable=false --o:ssl.termination=true"
      securityContext:
        capabilities:
          add:
            - MKNOD
            - FOWNER
            - SYS_CHROOT
        allowPrivilegeEscalation: true

    service:
      port: 80

    imaginary:
      enabled: true
      # h2non/imaginary (Go) already runs as uid 1000 — full non-root.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: false
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault
