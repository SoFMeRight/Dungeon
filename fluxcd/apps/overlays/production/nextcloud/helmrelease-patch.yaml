apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud
spec:
  chart:
    spec:
      # renovate: datasource=helm depName=nextcloud registryUrl=https://nextcloud.github.io/helm/
      version: "9.4.0"
  values:
    podLabels:
      policy.prplanit.com/ingress: "true"
      policy.prplanit.com/cap.oidc: "true"
      policy.prplanit.com/cap.postgres: "true"
      policy.prplanit.com/access-scope-postgres: optcp-cloud.nextcloud.postgres
      policy.prplanit.com/cap.redis: "true"
      policy.prplanit.com/access-scope-redis: optcp-cloud.nextcloud.redis

    image:
      # renovate: datasource=docker depName=library/nextcloud
      tag: "34.0.5"

    replicaCount: 3

    # Hard spread: one replica per node (matches kimai) so replicas occupy distinct
    # nodes and survive a single node loss. A replica stays Pending if fewer eligible
    # nodes are free (acceptable on a 5-worker cluster).
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: nextcloud
                app.kubernetes.io/component: app
            topologyKey: kubernetes.io/hostname

    nextcloud:
      host: cloud.optcp.com
      trustedDomains:
        - cloud.optcp.com
        # In-cluster host Collabora's WOPI callback connects to (wopi_callback_url below);
        # only resolvable/reachable in-mesh, so nextcloud must trust it as a valid domain.
        - nextcloud.optcp-cloud.svc.cluster.local

      mail:
        enabled: true
        fromAddress: ncloud
        domain: gmail.com
        smtp:
          host: smtp.gmail.com
          secure: tls
          port: 587
          authtype: LOGIN

      # Primary storage on Ceph RGW, path-style over the in-cluster service; the bucket's
      # key comes from optcp/apps/nextcloud/s3-optcp via the nextcloud-s3 Secret.
      objectStore:
        s3:
          enabled: true
          host: ceph-rgw.gorons-bracelet.svc.cluster.local
          ssl: false
          port: "80"
          region: us-east-1
          bucket: nextcloud
          usePathStyle: true
          autoCreate: false
          existingSecret: nextcloud-s3
          secretKeys:
            accessKey: s3-access-key
            secretKey: s3-secret-key

      extraEnv:
        - name: TRUSTED_PROXIES
          value: "192.168.144.0/20"
        - name: OVERWRITECLIURL
          value: "https://cloud.optcp.com"
        # The image's mod_remoteip replaces REMOTE_ADDR with the client IP from the gateway's
        # headers, so the gateway never reaches Nextcloud as a trusted proxy and its
        # X-Forwarded-Proto is ignored. https is set for every request not from a pod address
        # (192.168.144.0/20, fc00:f1:ca4:15xx::/56): browsers through the gateway get https,
        # Collabora's in-cluster callbacks over the HTTP:80 service (wopi_callback_url) keep http,
        # whose preset/settings URLs richdocuments builds from this scheme.
        - name: OVERWRITEPROTOCOL
          value: "https"
        - name: OVERWRITECONDADDR
          value: '^(?!192\.168\.(14[4-9]|15[0-9])\.|fc00:f1:ca4:15[0-9a-f]{2}:)'
        - name: PHP_MEMORY_LIMIT
          value: "1G"
        - name: PHP_UPLOAD_LIMIT
          value: "16G"

      # Mount the ErrorLogFormat "%M" snippet into apache's conf-enabled so Nextcloud's
      # errorlog output (above) is unprefixed nextcloud.log JSON that crowdsec parses directly.
      extraVolumes:
        - name: apache-errorlog
          configMap:
            name: nextcloud-apache-errorlog
      extraVolumeMounts:
        - name: apache-errorlog
          mountPath: /etc/apache2/conf-enabled/zzz-crowdsec-errorlog.conf
          subPath: zzz-crowdsec-errorlog.conf

      defaultConfigs:
        imaginary.config.php: true

      configs:
        cron.config.php: |-
          <?php
          $CONFIG = array(
            'backgroundjobs_mode' => 'cron',
          );
        session.config.php: |-
          <?php
          if (getenv('REDIS_HOST')) {
            ini_set('session.save_handler', 'redis');
            ini_set('session.save_path',
              'tcp://' . getenv('REDIS_HOST') . ':'
              . (getenv('REDIS_HOST_PORT') ?: '6379')
              . '?auth=' . getenv('REDIS_HOST_PASSWORD')
            );
          }
        # Emit app logs (incl. auth failures) to stderr as raw nextcloud.log JSON so they reach
        # Loki for CrowdSec. errorlog routes through apache (www-data can't write /dev/stdout);
        # the apache-errorlog configMap sets ErrorLogFormat "%M" so lines carry no apache prefix.
        # Per-pod stderr (not the shared cephfs nextcloud.log), so no cross-replica duplication.
        logging.config.php: |-
          <?php
          $CONFIG = array(
            'log_type' => 'errorlog',
            'loglevel' => 2,
          );

      # Pin Collabora's WOPI CheckFileInfo callback to the in-cluster nextcloud service, so
      # coolwsd reaches nextcloud east-west instead of the public LB (a meshed pod can't
      # hairpin to the gateway LB IP). richdocuments' wopi_callback_url is DB app-config, not
      # config.php — set it via occ each start (idempotent, self-healing); non-fatal.
      # Browser->Collabora (public_wopi_url) is unaffected.
      hooks:
        before-starting: |-
          #!/bin/sh
          # The entrypoint runs hooks as www-data already (run_as), so occ is called directly.
          # The entrypoint only upgrades when the image is newer than the code in /var/www/html;
          # if its occ upgrade fails after the code sync, later starts skip it and the instance
          # stays on the update page. Finish a pending upgrade here, under the entrypoint's
          # init lock so replicas run it one at a time; a failure exits non-zero and the pod
          # restarts and retries.
          flock /var/www/html/nextcloud-init-sync.lock sh -c '
            if php /var/www/html/occ status --output=json | grep -q "\"needsDbUpgrade\":true"; then
              php /var/www/html/occ upgrade --no-interaction
            fi
          ' || exit 1
          # These must go through occ, not chart values: wopi_callback_url is DB app-config;
          # trusted_domains is only seeded by the chart at INSTALL time (NEXTCLOUD_TRUSTED_DOMAINS
          # env ignored on upgrades) — index 10 is a reserved slot so it never collides with the
          # chart-managed 0-2. The overwriteprotocol delete scrubs any value an earlier occ op
          # persisted into config.php, so only the conditional OVERWRITEPROTOCOL env above applies.
          # All idempotent.
          php /var/www/html/occ config:app:set richdocuments wopi_callback_url --value "http://nextcloud.optcp-cloud.svc.cluster.local" || true
          php /var/www/html/occ config:system:set trusted_domains 10 --value "nextcloud.optcp-cloud.svc.cluster.local" || true
          php /var/www/html/occ config:system:delete overwriteprotocol || true
          # The public host is stored in config.php and app-config at install/setup time, not
          # read from the chart's host; set it every start so it follows nextcloud.host.
          php /var/www/html/occ config:system:set trusted_domains 1 --value "cloud.optcp.com" || true
          php /var/www/html/occ config:app:set notify_push base_endpoint --value "https://cloud.optcp.com/push" || true
          php /var/www/html/occ config:app:set richdocuments public_wopi_url --value "https://cloud.optcp.com" || true
          php /var/www/html/occ config:app:set whiteboard collabBackendUrl --value "https://cloud.optcp.com/whiteboard" || true
          # Full-text search: the apps live in custom_apps on the html volume (installed once,
          # enabled after); the platform and index settings are app-config, set every start.
          # Document text is indexed in nextcloud-elasticsearch.
          for app in fulltextsearch fulltextsearch_elasticsearch files_fulltextsearch; do
            php /var/www/html/occ app:install "$app" >/dev/null 2>&1 || php /var/www/html/occ app:enable "$app" || true
          done
          php /var/www/html/occ fulltextsearch:configure '{"search_platform":"OCA\\FullTextSearch_Elasticsearch\\Platform\\ElasticSearchPlatform"}' || true
          php /var/www/html/occ fulltextsearch_elasticsearch:configure '{"elastic_host":"http://nextcloud-elasticsearch:9200","elastic_index":"nextcloud"}' || true
          php /var/www/html/occ files_fulltextsearch:configure '{"files_local":"1","files_pdf":"1","files_office":"1"}' || true

      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 1
          maxSurge: 0

      # Partial hardening — nextcloud:apache MUST run as root PID 1 (apache binds the privileged :80
      # and the entrypoint chowns /var/www/html); it cannot run non-root without switching to the
      # fpm+nginx flavor. Verified boot with this set (AH00163 + status.php 200): seccomp RuntimeDefault
      # + drop ALL, adding back only apache's needs — chown/chmod/setuid for the entrypoint chown and
      # worker drop to www-data, plus NET_BIND_SERVICE for the privileged :80 bind.
      podSecurityContext:
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
          add:
            - CHOWN
            - DAC_OVERRIDE
            - FOWNER
            - SETUID
            - SETGID
            - NET_BIND_SERVICE

      # notify_push co-located as a sidecar: talks to nextcloud over localhost (no gateway hairpin,
      # no istio east-west, no trusted-domain juggling). Clients still reach it via the public URL
      # through the nextcloud-notify-push Service (repointed at these pods) + the /push HTTPRoute.
      extraSidecarContainers:
        - name: notify-push
          image: docker.io/icewind1991/notify_push:1.4.1
          resources:
            requests:
              cpu: 2m
              memory: 17Mi
            limits:
              cpu: 204m
              memory: 17Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: notify-push
              containerPort: 7867
          env:
            - name: PORT
              value: "7867"
            - name: NEXTCLOUD_URL
              value: "http://localhost:80"
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: nextcloud-aux-config
                  key: POSTGRES_HOST
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: nextcloud-aux-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST)/$(POSTGRES_DB)"
            - name: DATABASE_PREFIX
              value: "oc_"
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: nextcloud-aux-config
                  key: REDIS_HOST
            - name: REDIS_HOST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secrets
                  key: REDIS_HOST_PASSWORD
            - name: REDIS_URL
              value: "redis://:$(REDIS_HOST_PASSWORD)@$(REDIS_HOST):6379"

    externalDatabase:
      host: nextcloud-postgres-rw
      database: nextcloud

    externalRedis:
      host: nextcloud-redis-master

    persistence:
      enabled: true
      existingClaim: nextcloud-html

    cronjob:
      enabled: true
      type: sidecar
      # Cron sidecar runs the same image (cron.php, no :80 bind) — same minimal caps minus NET_BIND_SERVICE.
      sidecar:
        resources:
          requests:
            cpu: 4m
            memory: 95Mi
          limits:
            cpu: 678m
            memory: 95Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
            add:
              - CHOWN
              - DAC_OVERRIDE
              - FOWNER
              - SETUID
              - SETGID

    startupProbe:
      initialDelaySeconds: 30
      periodSeconds: 10
      failureThreshold: 30

    livenessProbe:
      initialDelaySeconds: 120
      periodSeconds: 30

    readinessProbe:
      initialDelaySeconds: 30
      periodSeconds: 15

    resources:
      requests:
        cpu: 50m
        memory: 512Mi
      limits:
        cpu: 1540m
        memory: 2Gi

    collabora:
      enabled: true
      fullnameOverride: nextcloud-collabora
      resources:
        requests:
          cpu: 5m
          memory: 641Mi
        limits:
          # Startup is CPU-bound: at 96m it sat pinned at the limit and failed its startup probe.
          cpu: 150m
          memory: 641Mi
      podLabels:
        policy.prplanit.com/ingress: "true"
      image:
        repository: docker.io/collabora/code
        # Held on the 25.04 line (last-known-good; Renovate pin below). On CODE 26.04.3.1.1,
        # richdocuments 11.1 (NC 34) calls /wopi/settings and getSettings($type) receives null
        # -> TypeError 500 -> coolwsd "Failed to install config" -> document load fails
        # (Collabora bug #16040, WOPISrc query-param mangling). The upstream fix merged
        # 2026-08-20 but is not in any published image yet (newest is 26.04.3.1.1, 2026-08-11).
        # Bump back to a fixed 26.04.x once it ships.
        tag: "25.04.10.3.1"
      collabora:
        aliasgroups:
          - host: "https://cloud.optcp.com:443"
          # coolwsd validates the WOPISrc host; with wopi_callback_url now pointing at the
          # in-cluster service, that host must be an accepted WOPI host or it self-rejects
          # ("Unauthorized WOPI host").
          - host: "http://nextcloud.optcp-cloud.svc.cluster.local:80"
        server_name: cloud.optcp.com
        extra_params: "--o:ssl.enable=false --o:ssl.termination=true"
      securityContext:
        capabilities:
          add:
            - MKNOD
            - FOWNER
            - SYS_CHROOT
        allowPrivilegeEscalation: true

    service:
      port: 80

    imaginary:
      enabled: true
      resources:
        requests:
          cpu: 2m
          memory: 13Mi
        limits:
          cpu: 188m
          memory: 13Mi
      # h2non/imaginary (Go) already runs as uid 1000 — full non-root.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: false
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault
