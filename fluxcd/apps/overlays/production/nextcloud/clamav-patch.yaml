apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nextcloud-clamav
spec:
  template:
    spec:
      containers:
        - name: clamav
          image: docker.io/clamav/clamav:1.5.4@sha256:1fdfd24c6f0a0fb60788481487459a6d4eda8a9b448641594e04db8410d34422
  volumeClaimTemplates:
    - metadata:
        name: db
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: ceph-rbd
        resources:
          requests:
            storage: 2Gi
