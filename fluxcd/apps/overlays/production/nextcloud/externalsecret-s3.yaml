apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-s3
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-optcp
  target:
    name: nextcloud-s3
    template:
      engineVersion: v2
      data:
        # RGW user nextcloud-user, owner of the nextcloud bucket (S3 primary storage); the
        # provisioning Job sets the same key from zeldas-letter rgw/nextcloud
        s3-access-key: "{{ .s3_access_key }}"
        s3-secret-key: "{{ .s3_secret_key }}"
  data:
    - secretKey: s3_access_key
      remoteRef:
        key: apps/nextcloud/s3-optcp
        property: ACCESS_KEY
    - secretKey: s3_secret_key
      remoteRef:
        key: apps/nextcloud/s3-optcp
        property: SECRET_KEY
