apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-s3
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-zeldas-letter
  target:
    name: nextcloud-s3
    template:
      engineVersion: v2
      data:
        # RGW user nextcloud-user, owner of the nextcloud bucket (S3 primary storage)
        s3-access-key: "{{ .s3_access_key }}"
        s3-secret-key: "{{ .s3_secret_key }}"
  data:
    - secretKey: s3_access_key
      remoteRef:
        key: rgw/nextcloud
        property: s3_access_key
    - secretKey: s3_secret_key
      remoteRef:
        key: rgw/nextcloud
        property: s3_secret_key
