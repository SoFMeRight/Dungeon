apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: temple-of-time

resources:
  - ../../../base/nextcloud
  - httproute.yaml
  - cephfs-html-pv.yaml

patches:
  - path: helmrelease-patch.yaml
    target:
      kind: HelmRelease
      name: nextcloud
  - path: aux-configmap-patch.yaml
  - path: externalsecret-patch.yaml
  - path: postgres-cluster-patch.yaml
  - path: postgres-credentials-patch.yaml
  - path: redis-replication-patch.yaml
  - path: externalsecret-redis-patch.yaml
  - path: clamav-patch.yaml
  - path: elasticsearch-patch.yaml
  - path: talk-hpb-configmap-patch.yaml
  - path: talk-hpb-patch.yaml
  - path: whiteboard-patch.yaml
  - path: externalsecret-postgres-backup-patch.yaml
  - path: service-nextcloud-ingress-patch.yaml
    target:
      kind: Service
      name: nextcloud
  - path: service-nextcloud-collabora-ingress-patch.yaml
    target:
      kind: Service
      name: nextcloud-collabora
  - path: service-nextcloud-talk-hpb-ingress-patch.yaml
    target:
      kind: Service
      name: nextcloud-talk-hpb
  - path: service-nextcloud-notify-push-ingress-patch.yaml
    target:
      kind: Service
      name: nextcloud-notify-push
  - path: service-nextcloud-whiteboard-ingress-patch.yaml
    target:
      kind: Service
      name: nextcloud-whiteboard
