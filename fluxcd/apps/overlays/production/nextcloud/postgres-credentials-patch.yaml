apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-postgres-credentials
spec:
  secretStoreRef:
    name: openbao-optcp
    kind: ClusterSecretStore
  data:
    - secretKey: username
      remoteRef:
        key: apps/nextcloud/postgres
        property: USER
    - secretKey: password
      remoteRef:
        key: apps/nextcloud/postgres
        property: PASSWORD
