apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: palworld
spec:
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # HDD-backed Ceph RBD: the world runs from RAM; disk is the ~8GB SteamCMD install +
        # periodic saves (sequential, not latency-critical), so HDD is fine and frees NVMe.
        storageClassName: ceph-rbd-hdd
        resources:
          requests:
            storage: 20Gi
