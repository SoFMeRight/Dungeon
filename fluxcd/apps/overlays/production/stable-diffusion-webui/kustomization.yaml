apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: optcp-ai
resources:
  - ../../../base/stable-diffusion-webui
  - httproute-xylem.yaml
# Held at zero for the volume re-bind into optcp-ai.
replicas:
  - name: stable-diffusion-webui
    count: 0

patches:
  - path: statefulset-patch.yaml
    target:
      kind: StatefulSet
      name: stable-diffusion-webui
  - path: service-stable-diffusion-webui-ingress-patch.yaml
    target:
      kind: Service
      name: stable-diffusion-webui
