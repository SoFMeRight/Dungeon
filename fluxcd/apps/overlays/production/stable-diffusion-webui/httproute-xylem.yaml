apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: stable-diffusion-webui-xylem
  annotations:
    gatus.home-operations.com/endpoint: |
      group: "Tools & Utilities (Tingle Tuner🔧)"
spec:
  parentRefs:
    - name: phloem-ingress-gateway
      namespace: optcp-ingress-internal
  hostnames:
    - "sdiff.optcp.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: stable-diffusion-webui
          port: 7860
