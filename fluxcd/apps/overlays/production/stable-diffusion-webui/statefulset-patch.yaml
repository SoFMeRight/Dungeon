apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stable-diffusion-webui
spec:
  template:
    metadata:
      labels:
        policy.prplanit.com/ingress: "true"
    spec:
      # ai-dock's /opt/ai-dock/bin/init.sh REQUIRES root + a writable rootfs: it runs
      # useradd/groupadd/usermod, appends /etc/sudoers, sed-substitutes $USER_NAME into the
      # supervisord confs, and writes /var/log,/run,/etc. As the base's non-root uid 1000 with
      # caps dropped, every step fails (and supervisord dies on the literal "$USER_NAME").
      # roRootFS is infeasible here; run as root (image drops to its baked `user` internally).
      # fsGroup 1000 + seccomp RuntimeDefault are inherited from the base.
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
      initContainers:
        - name: fix-permissions
          image: docker.io/busybox:1.38
          command:
            - sh
            - -c
            - |
              chown -R 1000:1111 /models /outputs
              chmod -R 755 /models /outputs
          volumeMounts:
            - name: data
              mountPath: /models
            - name: output
              mountPath: /outputs
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
      containers:
        - name: webui
          image: ghcr.io/ai-dock/stable-diffusion-webui:v2-cuda-12.1.1-base-22.04-v1.10.1
          # Root container (ai-dock init.sh needs root + a writable rootfs). Drop ALL and add back
          # only what init.sh + supervisord require: CHOWN/DAC_OVERRIDE/FOWNER (useradd, chown -R,
          # sudoers append), SETUID/SETGID/SETPCAP (supervisord drops each program to the baked
          # `user`), KILL (root supervisord signals the uid-1000 webui process — the uids differ,
          # so CAP_KILL is required to stop/restart it). privEsc stays on for init.sh's sudoers
          # provisioning. No readOnlyRootFilesystem (init.sh writes across /etc,/root,/var).
          securityContext:
            allowPrivilegeEscalation: true
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - SETUID
                - SETGID
                - SETPCAP
                - KILL
          env:
            # Only start the webui supervisor program — silences cloudflared/jupyter/sshd/etc,
            # incl. the cf_tunnel program that was erroring on the (now-substituted) $USER_NAME.
            - name: SUPERVISOR_NO_AUTOSTART
              value: "cloudflared,jupyter,sshd,syncthing,caddy,serviceportal,quicktunnel"
            - name: WEBUI_PORT
              value: "7860"
            - name: DIRECT_ADDRESS
              value: "0.0.0.0"
            - name: DIRECT_ADDRESS_GET_WAN
              value: "false"
            - name: WEB_ENABLE_AUTH
              value: "false"
            - name: CLI_ARGS
              value: "--allow-code --medvram --xformers --enable-insecure-extension-access --api --listen --port 7860"
          volumeMounts:
            - name: data
              mountPath: /opt/stable-diffusion-webui/models
            - name: output
              mountPath: /opt/stable-diffusion-webui/outputs
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: ceph-rbd
        resources:
          requests:
            storage: 100Gi
    - metadata:
        name: output
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: ceph-rbd
        resources:
          requests:
            storage: 200Gi
