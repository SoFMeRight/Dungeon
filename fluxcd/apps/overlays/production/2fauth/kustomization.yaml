apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: zeldas-lullaby
resources:
  - ../../../base/2fauth
  - httproute.yaml
patches:
  - path: statefulset-patch.yaml
    target:
      kind: StatefulSet
      name: twofauth
  - path: service-twofauth-ingress-patch.yaml
    target:
      kind: Service
      name: twofauth
