apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: twofauth
  annotations:
    gatus.home-operations.com/endpoint: |
      group: "Administration (Zelda's Lullaby🎵)"
spec:
  parentRefs:
    - name: phloem-gateway
      namespace: optcp-gateway-phloem
  hostnames:
    - "authenticator.optcp.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: twofauth
          port: 8000
