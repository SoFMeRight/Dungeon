apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: twofauth
spec:
  replicas: 1
  template:
    metadata:
      labels:
        policy.prplanit.com/ingress: "true"
    spec:
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: twofauth
          image: docker.io/2fauth/2fauth:6.1.3
          env:
            - name: APP_URL
              value: "https://2fa.pcfae.com"
            - name: SESSION_DRIVER
              value: "database"
            - name: CACHE_DRIVER
              value: "database"
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 500m
          volumeMounts:
            - name: zeldas-lullaby-twofauth-data
              mountPath: /2fauth
  volumeClaimTemplates:
    - metadata:
        name: zeldas-lullaby-twofauth-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ceph-rbd-retain
        resources:
          requests:
            storage: 5Gi
