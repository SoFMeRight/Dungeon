apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: twofauth
spec:
  replicas: 1
  template:
    metadata:
      labels:
        policy.prplanit.com/ingress: "true"
    spec:
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        # readOnlyRootFilesystem EXCEPTION: the 2fauth entrypoint sets up persistence by creating
        # symlinks inside its baked app tree (ln /srv/database/database.sqlite -> the /2fauth PVC),
        # which needs a writable rootfs. Cannot enable ro-rootfs without an image rebuild.
        - name: twofauth
          image: docker.io/2fauth/2fauth:8.0.1
          env:
            - name: APP_URL
              value: "https://2fa.pcfae.com"
            - name: SESSION_DRIVER
              value: "database"
            - name: CACHE_DRIVER
              value: "database"
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 500m
          volumeMounts:
            - name: zeldas-lullaby-twofauth-data
              mountPath: /2fauth
  volumeClaimTemplates:
    - metadata:
        name: zeldas-lullaby-twofauth-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ceph-rbd-retain
        resources:
          requests:
            storage: 5Gi
