apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: py-kms
spec:
  replicas: 1
  template:
    metadata:
      labels:
        policy.prplanit.com/ingress: "true"
    spec:
      containers:
        - name: py-kms
          image: ghcr.io/py-kms-organization/py-kms:python3-next
          securityContext:
            readOnlyRootFilesystem: true
          env:
            - name: TZ
              value: "America/Los_Angeles"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # readOnlyRootFilesystem: the client-db is on the PVC; /tmp is defensive scratch.
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: swift-sail-py-kms-db
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ceph-rbd-retain
        resources:
          requests:
            storage: 1Gi
