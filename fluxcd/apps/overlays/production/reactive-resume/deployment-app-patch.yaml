apiVersion: apps/v1
kind: Deployment
metadata:
  name: reactive-resume-app
spec:
  replicas: 1
  template:
    metadata:
      labels:
        policy.prplanit.com/ingress: "true"
        policy.prplanit.com/cap.postgres: "true"
        policy.prplanit.com/access-scope-postgres: temple-of-time.reactive-resume.postgres
    spec:
      containers:
        - name: app
          image: docker.io/amruthpillai/reactive-resume:v5.2.5
          securityContext:
            readOnlyRootFilesystem: true
          env:
            - name: APP_URL
              value: "https://resume.sofmeright.com"
            - name: STORAGE_URL
              value: "https://resume.sofmeright.com/storage/default"
            - name: MAIL_FROM
              value: "noreply@sofmeright.com"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # readOnlyRootFilesystem: DB + object-storage backed; /tmp scratch.
        - name: tmp
          emptyDir: {}
