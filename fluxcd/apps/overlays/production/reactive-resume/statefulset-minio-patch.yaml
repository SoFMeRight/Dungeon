apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: reactive-resume-minio
spec:
  replicas: 1
  template:
    spec:
      # minio needs /data owned by its run-uid; fsGroup alone left it unwritable (pre-existing
      # outage). Chown the backend to 1000 as root before minio starts. Init lives here because the
      # data volume is renamed to the env-specific name in this overlay.
      initContainers:
        - name: fix-data-perms
          image: docker.io/busybox:1.38
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
          command:
            - sh
            - -c
            - chown -R 1000:1000 /data && chmod -R u+rwX /data
          volumeMounts:
            - name: temple-of-time-reactive-resume-minio-data
              mountPath: /data
      containers:
        - name: minio
          image: docker.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
          volumeMounts:
            - name: temple-of-time-reactive-resume-minio-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: temple-of-time-reactive-resume-minio-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ceph-rbd-retain
        resources:
          requests:
            storage: 10Gi
