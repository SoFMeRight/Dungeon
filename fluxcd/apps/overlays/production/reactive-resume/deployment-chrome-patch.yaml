apiVersion: apps/v1
kind: Deployment
metadata:
  name: reactive-resume-chrome
spec:
  replicas: 1
  template:
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
      containers:
        - name: chrome
          image: ghcr.io/browserless/chromium:v2.56.0
          securityContext:
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # readOnlyRootFilesystem: browserless/chromium writes browser scratch to /tmp.
        - name: tmp
          emptyDir: {}
