apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: fusionpbx-external
  annotations:
    gatus.home-operations.com/endpoint: |
      group: "Business Apps (Hyrule Castle🏰)"
spec:
  parentRefs:
    - name: xylem-gateway
      namespace: arylls-lookout
  hostnames:
    - "pbx.pcfae.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: fusionpbx-external
          port: 443
