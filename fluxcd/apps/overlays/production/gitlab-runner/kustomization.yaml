apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: optcp-ci-runners
resources:
  - ../../../base/gitlab-runner
configMapGenerator:
  - name: buildkitd-config
    files:
      - buildkitd.toml
patches:
  - path: helmrelease-patch.yaml
  - path: buildkitd-patch.yaml
  - path: pvc-cache-patch.yaml
