apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: open-webui-postgres
spec:
  # Shutdown has to fit the node's grace budget: 150s total, 30s reserved for
  # critical pods, so 120s for ordinary ones. Postgres does not checkpoint until
  # the smart phase stops waiting for clients to disconnect, so a long smart
  # timeout means the SIGKILL lands before anything is flushed. Short smart, then
  # fast shutdown does the checkpoint well inside the remaining budget.
  smartShutdownTimeout: 10
  stopDelay: 60
  # Requests lift this out of BestEffort so the kubelet does not reclaim the database
  # first under node pressure. Sized from observed use (~85Mi resident): memory is what
  # drives eviction, so the request carries the headroom. The floor is shared_buffers
  # (256MB) — postgres reserves it up front and CNPG rejects a request below it.
  resources:
    requests:
      memory: "384Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "500m"

  inheritedMetadata:
    labels:
      policy.prplanit.com/cnpg: "managed"
      policy.prplanit.com/access-class: postgres
      policy.prplanit.com/service-scope: temple-of-time.open-webui.postgres
      policy.prplanit.com/cap.s3-nas: "true"
      policy.prplanit.com/access-scope-s3-nas: gringotts.seaweedfs

  instances: 3

  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie

  postgresql:
    parameters:
      shared_buffers: "256MB"
      max_connections: "100"

  enableSuperuserAccess: true

  storage:
    storageClass: ceph-rbd
    size: 4Gi
