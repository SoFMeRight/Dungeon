apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ollama
spec:
  template:
    metadata:
      labels:
        policy.prplanit.com/ingress: "true"
    spec:
      containers:
        - name: ollama
          resources:
            requests:
              cpu: 2m
              memory: 1144Mi
            limits:
              cpu: 178m
              memory: 1144Mi
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app: ollama
          volume-type: data
      spec:
        storageClassName: ceph-rbd
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 100Gi
