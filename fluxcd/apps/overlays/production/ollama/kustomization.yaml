apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: optcp-ai
resources:
  - ../../../base/ollama
  - httproute.yaml
# Held at zero for the volume re-bind into optcp-ai.
replicas:
  - name: ollama
    count: 0

patches:
  - path: statefulset-patch.yaml
    target:
      kind: StatefulSet
      name: ollama
  - path: service-ollama-ingress-patch.yaml
    target:
      kind: Service
      name: ollama
