apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: endlessh-go
spec:
  replicas: 1
  template:
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: endlessh-go
          image: docker.io/shizunge/endlessh-go:2026.0730.0
          securityContext:
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # readOnlyRootFilesystem: endlessh-go is a stateless tarpit; /tmp is defensive scratch.
        - name: tmp
          emptyDir: {}
