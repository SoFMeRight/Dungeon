apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ark-se-tmc-theisland
spec:
  serviceName: ark-se-tmc-theisland
  replicas: 1
  selector:
    matchLabels:
      app: ark-se-tmc-theisland
  template:
    metadata:
      labels:
        app: ark-se-tmc-theisland
        policy.prplanit.com/probe: "true"
    spec:
      serviceAccountName: ark-se-tmc-theisland
      enableServiceLinks: false
      imagePullSecrets:
        - name: cr-pcfae-admin-pull-secret
      # drpsychick ARK:SE (steamcmd native) runs as the steam user (PUID/fsGroup 1001). Attempt
      # non-root + drop ALL + no-privesc; revert if steamcmd/the server can't access its 1001-owned data.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: theisland
          image: docker.io/drpsychick/arkserver:latest-v1.6.62
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 7797
              protocol: UDP
              name: game-udp
            - containerPort: 7797
              protocol: TCP
              name: game-tcp
            - containerPort: 27057
              protocol: UDP
              name: query-udp
            - containerPort: 27057
              protocol: TCP
              name: query-tcp
            - containerPort: 27095
              protocol: TCP
              name: rcon
            - containerPort: 8080
              protocol: TCP
              name: health
          env:
            - name: am_ark_SessionName
              value: "MasterChiefers-TheIsland"
            - name: am_serverMap
              value: TheIsland
            - name: am_ark_GameModIds
              value: "1213429840,1232362083,1565015734,1609138312,1840761213,506506101,731604991,751991809,793605978,806480270,821530042,895711211,902616446,924933745"
            - name: am_ark_QueryPort
              value: "27057"
            - name: am_ark_Port
              value: "7797"
            - name: am_ark_RCONPort
              value: "27095"
            - name: am_ark_ServerAdminPassword
              valueFrom:
                secretKeyRef:
                  name: ark-se-tmc
                  key: admin-password
            - name: am_ark_ServerPassword
              valueFrom:
                secretKeyRef:
                  name: ark-se-tmc
                  key: server-password
            - name: am_arkopt_clusterid
              valueFrom:
                secretKeyRef:
                  name: ark-se-tmc
                  key: cluster-id
            - name: am_arkNoPortDecrement
              value: "true"
            - name: am_ark_MaxPlayers
              value: "10"
            - name: am_arkAutoUpdateOnStart
              value: "true"
            - name: ARKCLUSTER
              value: "true"
            - name: am_arkflag_ForceAllowCaveFlyers
              value: "true"
            - name: am_arkflag_crossplay
              value: "true"
            - name: ARKSERVER_SHARED
              value: "/arkserver"
            - name: HEALTH_SERVER
              value: "true"
          resources:
            limits:
              memory: 16Gi
            requests:
              memory: 12Gi
              cpu: 2000m
          stdin: true
          tty: true
          volumeMounts:
            - name: shooting-gallery-ark-se-tmc-theisland-data
              mountPath: /ark
            - name: shooting-gallery-ark-se-tmc-theisland-saved
              mountPath: /arkserver/ShooterGame/Saved
            - name: shooting-gallery-ark-se-tmc-theisland-cluster
              mountPath: /arkserver/ShooterGame/Saved/clusters
            - name: shooting-gallery-ark-se-tmc-theisland-serverfiles
              mountPath: /arkserver
  volumeClaimTemplates:
    - metadata:
        name: shooting-gallery-ark-se-tmc-theisland-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 50Gi
    - metadata:
        name: shooting-gallery-ark-se-tmc-theisland-saved
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 50Gi
    - metadata:
        name: shooting-gallery-ark-se-tmc-theisland-cluster
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
    - metadata:
        name: shooting-gallery-ark-se-tmc-theisland-serverfiles
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 250Gi
