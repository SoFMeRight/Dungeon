apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ark-se-tmc
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-optcp
    kind: ClusterSecretStore
  target:
    name: ark-se-tmc
    creationPolicy: Owner
  data:
  - secretKey: admin-password
    remoteRef:
      key: apps/ark-se/app
      property: ADMIN_PASSWORD
  - secretKey: server-password
    remoteRef:
      key: apps/ark-se/app
      property: SERVER_PASSWORD
  - secretKey: cluster-id
    remoteRef:
      key: apps/ark-se/app
      property: CLUSTER_ID
