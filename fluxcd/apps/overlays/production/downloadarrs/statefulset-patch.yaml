apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: downloadarrs
spec:
  template:
    metadata:
      labels:
        policy.prplanit.com/ingress: "true"
        istio.io/dataplane-mode: none
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: gluetun
          env:
            - name: SERVER_REGIONS
              value: "CA Vancouver"
            - name: FIREWALL_OUTBOUND_SUBNETS
              value: "10.144.0.0/12,172.16.0.0/12,172.22.30.33/32,192.168.144.0/20"
            - name: TZ
              value: "America/Los_Angeles"
        - name: qbittorrent
          env:
            - name: TZ
              value: "America/Los_Angeles"
        - name: radarr
          env:
            - name: TZ
              value: "America/Los_Angeles"
        - name: sonarr
          env:
            - name: TZ
              value: "America/Los_Angeles"
        - name: lidarr
          env:
            - name: TZ
              value: "America/Los_Angeles"
        - name: readarr
          env:
            - name: TZ
              value: "America/Los_Angeles"
        - name: cross-seed
          command: ["cross-seed", "daemon"]
          securityContext:
            readOnlyRootFilesystem: true
          env:
            - name: TZ
              value: "America/Los_Angeles"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # Gluetun
        - name: gluetun-config
          persistentVolumeClaim:
            claimName: swift-sail-qbittorrent-gluetun-config
        # qBittorrent
        - name: qbittorrent-config
          persistentVolumeClaim:
            claimName: swift-sail-qbittorrent-config
        - name: downloads
          persistentVolumeClaim:
            claimName: swift-sail-qbittorrent-downloads
        # Radarr
        - name: radarr-config
          persistentVolumeClaim:
            claimName: swift-sail-radarr-config
        - name: movies
          persistentVolumeClaim:
            claimName: radarr-movies
        # Sonarr
        - name: sonarr-config
          persistentVolumeClaim:
            claimName: swift-sail-sonarr-config
        - name: tv-shows
          persistentVolumeClaim:
            claimName: sonarr-tv-shows
        # Lidarr
        - name: lidarr-config
          persistentVolumeClaim:
            claimName: swift-sail-lidarr-config
        - name: music
          persistentVolumeClaim:
            claimName: lidarr-music
        # Readarr
        - name: readarr-config
          persistentVolumeClaim:
            claimName: swift-sail-readarr-config
        - name: books
          persistentVolumeClaim:
            claimName: readarr-books
        # Cross-seed
        - name: cross-seed-config
          persistentVolumeClaim:
            claimName: swift-sail-cross-seed-config
        # readOnlyRootFilesystem (cross-seed container): config on PVC; /tmp scratch.
        - name: tmp
          emptyDir: {}
        # Shared seeding/completed
        - name: tv-shows-seeding
          persistentVolumeClaim:
            claimName: qbittorrent-tv-shows-seeding
        - name: movies-seeding
          persistentVolumeClaim:
            claimName: qbittorrent-movies-seeding
        - name: downloads-completed
          persistentVolumeClaim:
            claimName: qbittorrent-downloads
