# SMB secrets for downloadarrs - keeping original PV secret names due to PV immutability
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: qbittorrent-smb-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-great-sea
  target:
    name: qbittorrent-smb-secret
  dataFrom:
    - extract:
        key: smb/qbittorrent
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: radarr-smb-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-great-sea
  target:
    name: radarr-smb-secret
    template:
      type: Opaque
      data:
        # smb.csi.k8s.io requires username/password keys
        username: "{{ .SAMBA_USERNAME | toString }}"
        password: "{{ .SAMBA_PASSWORD | toString }}"
  dataFrom:
    - extract:
        key: apps/radarr
---
