apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: google-webfonts-helper-xylem
  annotations:
    gatus.home-operations.com/endpoint: |
      group: "Tools & Utilities (Tingle Tuner🔧)"
spec:
  parentRefs:
    - name: phloem-gateway
      namespace: prelude-of-light
  hostnames:
    - "gwfonts.pcfae.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: google-webfonts-helper
          port: 8654
