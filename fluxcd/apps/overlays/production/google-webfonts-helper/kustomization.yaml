apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: optcp-tools
resources:
  - ../../../base/google-webfonts-helper
  - httproute-xylem.yaml
patches:
  - path: statefulset-patch.yaml
    target:
      kind: StatefulSet
      name: google-webfonts-helper
  - path: service-patch.yaml
    target:
      kind: Service
      name: google-webfonts-helper
  - path: service-google-webfonts-helper-ingress-patch.yaml
    target:
      kind: Service
      name: google-webfonts-helper
