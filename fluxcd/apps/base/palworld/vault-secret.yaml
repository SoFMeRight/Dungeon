apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: palworld-secret
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: openbao-operationtimecapsule
    kind: ClusterSecretStore
  target:
    name: palworld-secret
    template:
      type: Opaque
      # Keys match the image's env names (consumed via envFrom).
      data:
        ADMIN_PASSWORD: "{{ .ADMIN_PASSWORD | toString }}"
        SERVER_PASSWORD: "{{ .SERVER_PASSWORD | toString }}"
  dataFrom:
    - extract:
        key: apps/palworld
