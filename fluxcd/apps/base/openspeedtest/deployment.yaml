apiVersion: apps/v1
kind: Deployment
metadata:
  name: openspeedtest
spec:
  revisionHistoryLimit: 5
  replicas: 1
  selector:
    matchLabels:
      app: openspeedtest
  template:
    metadata:
      labels:
        app: openspeedtest
    spec:
      serviceAccountName: openspeedtest
      # openspeedtest image already runs as nginx (uid 101) on unprivileged 3000/3001 — full non-root.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: openspeedtest
          image: PLACEHOLDER_IMAGE
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
            - containerPort: 3001
              name: https
              protocol: TCP
          envFrom:
            - configMapRef:
                name: PLACEHOLDER_CONFIGMAP
            - secretRef:
                name: PLACEHOLDER_SECRET
          resources:
            requests:
              cpu: PLACEHOLDER_CPU
              memory: PLACEHOLDER_MEMORY
            limits:
              cpu: PLACEHOLDER_CPU_LIMIT
              memory: PLACEHOLDER_MEMORY_LIMIT
