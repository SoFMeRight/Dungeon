# The key belongs to Dependency-Track's svc:sbom-operator service account: upload
# BOMs, create projects on upload, read the portfolio and update projects. It
# expires after 366 days (current key: 2027-10-24).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sbom-operator
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-optcp
  target:
    name: sbom-operator
    creationPolicy: Owner
  data:
    - secretKey: dtrackApiKey
      remoteRef:
        key: apps/sbom-operator/dependency-track
        property: API_KEY
