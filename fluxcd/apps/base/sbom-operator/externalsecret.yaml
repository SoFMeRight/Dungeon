# The key belongs to Dependency-Track's team svc:sbom-operator, issued and written here by
# dependency-track-config (its config.yaml declares the team and its permissions).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sbom-operator
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-optcp
  target:
    name: sbom-operator
    creationPolicy: Owner
  data:
    - secretKey: dtrackApiKey
      remoteRef:
        key: apps/sbom-operator/dependency-track
        property: API_KEY
