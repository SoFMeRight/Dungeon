apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plex-ms-x-smb-secret
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: openbao-pedestal-of-time
    kind: ClusterSecretStore
  target:
    name: plex-ms-x-smb-secret
    template:
      type: Opaque
      data:
        username: "{{ .SAMBA_USERNAME | toString }}"
        password: "{{ .SAMBA_PASSWORD | toString }}"
  dataFrom:
    - extract:
        key: apps/plex-ms-x
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plex-ms-x-claim
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: openbao-pedestal-of-time
    kind: ClusterSecretStore
  target:
    name: plex-ms-x-claim
    template:
      type: Opaque
      data:
        claim: "{{ .PLEX_CLAIM | toString }}"
  dataFrom:
    - extract:
        key: apps/plex-ms-x
