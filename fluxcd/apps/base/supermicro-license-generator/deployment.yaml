apiVersion: apps/v1
kind: Deployment
metadata:
  name: supermicro-license-generator
spec:
  revisionHistoryLimit: 5
  replicas: PLACEHOLDER_REPLICAS
  selector:
    matchLabels:
      app: supermicro-license-generator
  template:
    metadata:
      labels:
        app: supermicro-license-generator
    spec:
      serviceAccountName: supermicro-license-generator
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 100
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: supermicro-license-generator
          image: PLACEHOLDER_IMAGE
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: PLACEHOLDER_CPU_REQUEST
              memory: PLACEHOLDER_MEMORY_REQUEST
            limits:
              cpu: PLACEHOLDER_CPU_LIMIT
              memory: PLACEHOLDER_MEMORY_LIMIT
