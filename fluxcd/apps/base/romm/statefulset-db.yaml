apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: romm-db
spec:
  revisionHistoryLimit: 5
  serviceName: romm-db
  replicas: PLACEHOLDER_REPLICAS
  selector:
    matchLabels:
      app: romm-db
  template:
    metadata:
      labels:
        app: romm-db
    spec:
      serviceAccountName: romm-db
      # LSIO mariadb is s6-overlay managed (starts root, setuidgid-drops to PUID). Root-required
      # partial: drop ALL + the caps s6 needs + seccomp.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mariadb
          image: PLACEHOLDER_IMAGE
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - SETUID
                - SETGID
          ports:
            - containerPort: 3306
              name: mysql
              protocol: TCP
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: romm-secrets
                  key: mysql-root-password
            - name: MYSQL_DATABASE
              value: "romm"
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: romm-secrets
                  key: db-user
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: romm-secrets
                  key: db-password
          volumeMounts:
            - name: shooting-gallery-romm-mysql
              mountPath: /var/lib/mysql
            - name: db-cnf
              mountPath: /config/custom.cnf
              subPath: custom.cnf
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - mariadb-admin ping -h localhost
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - mariadb-admin ping -h localhost
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: db-cnf
          configMap:
            name: romm-db-cnf
  volumeClaimTemplates:
    - metadata:
        name: shooting-gallery-romm-mysql
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: PLACEHOLDER_STORAGE_CLASS
        resources:
          requests:
            storage: 10Gi
