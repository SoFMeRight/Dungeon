apiVersion: apps/v1
kind: Deployment
metadata:
  name: bulkvs-ip-sync
spec:
  revisionHistoryLimit: 5
  replicas: 1
  selector:
    matchLabels:
      app: bulkvs-ip-sync
  template:
    metadata:
      labels:
        app: bulkvs-ip-sync
    spec:
      serviceAccountName: bulkvs-ip-sync
      containers:
        - name: bulkvs-ip-sync
          image: PLACEHOLDER_IMAGE
          envFrom:
            - configMapRef:
                name: bulkvs-ip-sync-config
            - secretRef:
                name: bulkvs-ip-sync-secrets
          resources:
            requests:
              cpu: PLACEHOLDER_CPU
              memory: PLACEHOLDER_MEMORY
            limits:
              cpu: PLACEHOLDER_CPU_LIMIT
              memory: PLACEHOLDER_MEMORY_LIMIT
