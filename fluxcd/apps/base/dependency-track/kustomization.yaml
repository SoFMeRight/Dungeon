apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - serviceaccount.yaml
  - repository.yaml
  - helmrelease.yaml
  - externalsecret.yaml
  - postgres-credentials.yaml
  - externalsecret-postgres-backup.yaml
  - objectstore-postgres.yaml
  - postgres-cluster.yaml
  - scheduledbackup-postgres.yaml
  - externalsecret-configuration.yaml
  - job-configuration.yaml
configMapGenerator:
  - name: dependency-track-configuration-playbook
    files:
      - playbook/apply.yml
      - playbook/policy.yml
      - playbook/publisher.yml
      - playbook/rule.yml
      - playbook/team.yml
      - playbook/ntfy.peb
