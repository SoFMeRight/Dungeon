# Team svc:dependency-track-config, declared in config.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dependency-track-config
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-optcp
  target:
    name: dependency-track-config
    creationPolicy: Owner
    template:
      data:
        DT_API_KEY: "{{ .apiKey }}"
  data:
    - secretKey: apiKey
      remoteRef:
        key: apps/dependency-track/config
        property: API_KEY
