# The chart creates the API server's ServiceAccount (dependency-track); the
# frontend and the configuration Job get their own identities rather than sharing it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dependency-track-frontend
automountServiceAccountToken: false
---
# The configuration Job's identity, not the API server's.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dependency-track-configuration
automountServiceAccountToken: false
