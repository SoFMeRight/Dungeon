apiVersion: batch/v1
kind: Job
metadata:
  name: dependency-track-configuration
  annotations:
    kustomize.toolkit.fluxcd.io/force: "Enabled"  # immutable one-shot Job: force-replace on change, not wedge
spec:
  backoffLimit: 20
  template:
    metadata:
      labels:
        app: dependency-track-configuration
    spec:
      serviceAccountName: dependency-track-configuration
      # Its token is the OpenBao Kubernetes login; the ServiceAccount has no RBAC.
      automountServiceAccountToken: true
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: configuration
          image: PLACEHOLDER_ANSIBLE_IMAGE
          command: ["ansible-playbook", "/playbook/apply.yml"]
          env:
            - name: HOME
              value: /tmp
            - name: ANSIBLE_LOCAL_TEMP
              value: /tmp/.ansible
            - name: DT_URL
              value: http://dependency-track-api-server:8080
            - name: BAO_ROLE
              value: dependency-track-configuration
            - name: DT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: dependency-track-configuration
                  key: DT_API_KEY
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: playbook
              mountPath: /playbook
              readOnly: true
            - name: configuration
              mountPath: /configuration
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: playbook
          configMap:
            name: dependency-track-configuration-playbook
        - name: configuration
          configMap:
            name: dependency-track-configuration
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
