apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dependency-track-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-optcp
  target:
    name: dependency-track-secret
    creationPolicy: Owner
    template:
      data:
        kek: "{{ .kek }}"
        accessKeyId: "{{ .s3AccessKey }}"
        secretAccessKey: "{{ .s3SecretKey }}"
        DT_OIDC_CLIENT_ID: "{{ .oidcClientId }}"
  data:
    - secretKey: kek
      remoteRef:
        key: apps/dependency-track/app
        property: KEK
    - secretKey: s3AccessKey
      remoteRef:
        key: apps/dependency-track/s3-optcp
        property: ACCESS_KEY
    - secretKey: s3SecretKey
      remoteRef:
        key: apps/dependency-track/s3-optcp
        property: SECRET_KEY
    - secretKey: oidcClientId
      remoteRef:
        key: apps/dependency-track/oidc
        property: CLIENT_ID
