apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dependency-track-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-optcp
  target:
    name: dependency-track-secret
    creationPolicy: Owner
    template:
      data:
        accessKeyId: "{{ .s3AccessKey }}"
        secretAccessKey: "{{ .s3SecretKey }}"
        DT_OIDC_CLIENT_ID: "{{ .oidcClientId }}"
        DT_SECRET_GITHUB_TOKEN: "{{ .githubToken }}"
        DT_SECRET_NTFY_AUTH: "Bearer {{ .ntfyToken }}"
  data:
    - secretKey: s3AccessKey
      remoteRef:
        key: apps/dependency-track/s3-optcp
        property: ACCESS_KEY
    - secretKey: s3SecretKey
      remoteRef:
        key: apps/dependency-track/s3-optcp
        property: SECRET_KEY
    - secretKey: oidcClientId
      remoteRef:
        key: apps/dependency-track/oidc
        property: CLIENT_ID
    # Fine-grained PAT with no permissions.
    - secretKey: githubToken
      remoteRef:
        key: apps/dependency-track/github
        property: API_KEY
    # ntfy user dependency-track, write-only to Arbitorium-Prod-Alert and Arbitorium-Prod-Warn.
    - secretKey: ntfyToken
      remoteRef:
        key: apps/dependency-track/ntfy
        property: TOKEN
