apiVersion: apps/v1
kind: Deployment
metadata:
  name: shlink-web-client
spec:
  revisionHistoryLimit: 5
  replicas: PLACEHOLDER_REPLICAS
  selector:
    matchLabels:
      app: shlink-web-client
  template:
    metadata:
      labels:
        app: shlink-web-client
    spec:
      serviceAccountName: shlink-web-client
      # nginx SPA already runs as uid 101 on :8080 — full non-root.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: shlink-web-client
          image: PLACEHOLDER_IMAGE
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          volumeMounts:
            - name: web-config
              mountPath: /usr/share/nginx/html/conf.d/
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: web-config
          persistentVolumeClaim:
            claimName: temple-of-time-shlink-web-config
