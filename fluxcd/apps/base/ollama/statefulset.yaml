apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ollama
spec:
  revisionHistoryLimit: 5
  serviceName: ollama
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      serviceAccountName: ollama
      # The image runs as `ubuntu` (uid 1000, HOME=/home/ubuntu), so ollama stores models under
      # $HOME/.ollama — the PVC must land there (a /root/.ollama mount is unreachable: /root is
      # 0700 root, so state silently fell back to ephemeral rootfs). GPU access is runtime/cgroup-
      # based, unaffected by dropping caps. Full non-root + readOnlyRootFilesystem: the PVC carries
      # models/keys; only the nvidia shader cache (~/.nv) and /tmp remain on the read-only rootfs.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ollama
          image: docker.io/ollama/ollama:0.32.15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 11434
              name: http
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "all"
          resources:
            limits:
              nvidia.com/gpu: 6  # Heavy LLM inference workload
          volumeMounts:
            - name: data
              mountPath: /home/ubuntu/.ollama
            - name: nv-cache
              mountPath: /home/ubuntu/.nv
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: nv-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 50Gi
