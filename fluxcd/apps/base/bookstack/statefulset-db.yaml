apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bookstack-db
spec:
  revisionHistoryLimit: 5
  serviceName: bookstack-db
  replicas: 1
  selector:
    matchLabels:
      app: bookstack-db
  template:
    metadata:
      labels:
        app: bookstack-db
    spec:
      serviceAccountName: bookstack-db
      # LSIO/s6-overlay mariadb: MUST start as root PID 1 (s6 chowns /config + setuidgid-drops to
      # PUID); can't run non-root without a rebuild. Partial hardening: seccomp + drop ALL, adding
      # back only s6's needs (chown/chmod/setuid). :3306 is unprivileged — no NET_BIND_SERVICE.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mariadb
          image: PLACEHOLDER_DB_IMAGE
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - SETUID
                - SETGID
          env:
            - name: PUID
              value: "PLACEHOLDER_PUID"
            - name: PGID
              value: "PLACEHOLDER_PGID"
            - name: TZ
              value: "PLACEHOLDER_TZ"
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bookstack-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: bookstack-secrets
                  key: MYSQL_DATABASE
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: bookstack-secrets
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bookstack-secrets
                  key: MYSQL_PASSWORD
          ports:
            - containerPort: 3306
              name: mysql
          volumeMounts:
            - name: PLACEHOLDER_NAMESPACE-bookstack-db-data
              mountPath: /config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: PLACEHOLDER_NAMESPACE-bookstack-db-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: PLACEHOLDER_STORAGE_CLASS
        resources:
          requests:
            storage: 5Gi
