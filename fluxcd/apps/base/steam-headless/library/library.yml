---
# Converges the seat's ES-DE library onto the home volume from the mounted spec (/library):
#   systems.txt          "<es-de system> <folder under ROMS_SRC>" per line; ~/ROMs/<system> -> ROMS_SRC/<folder>
#   port-<Title>.sh      installed as ~/ROMs/ports/<Title>.sh with "_" shown as a space (ES-DE
#                        "ports" system; ConfigMap keys cannot hold spaces)
#   es_find_rules.xml    installed as ~/ES-DE/custom_systems/es_find_rules.xml
#   es_systems.xml       installed as ~/ES-DE/custom_systems/es_systems.xml
# System links, launchers and custom files no longer declared are removed; ROMS_SRC itself is
# never written.
- name: converge the ES-DE library
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    spec: /library
    home: "{{ lookup('ansible.builtin.env', 'HOME') }}"
    roms: "{{ home }}/ROMs"
    roms_src: "{{ lookup('ansible.builtin.env', 'ROMS_SRC') }}"
    custom_files: [es_find_rules.xml, es_systems.xml]
    systems: >-
      {{ lookup('ansible.builtin.file', spec ~ '/systems.txt').splitlines()
         | map('trim') | reject('match', '^(#|$)') | map('split') | list }}
  tasks:
    - name: ensure the library directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ roms }}/ports"
        - "{{ home }}/ES-DE/custom_systems"

    - name: link each declared system to its games folder
      ansible.builtin.file:
        src: "{{ roms_src }}/{{ item.1 }}"
        dest: "{{ roms }}/{{ item.0 }}"
        state: link
        force: true
        follow: false
      loop: "{{ systems }}"
      loop_control:
        label: "{{ item.0 }} -> {{ item.1 }}"

    - name: find the system links in the library
      ansible.builtin.find:
        paths: "{{ roms }}"
        file_type: link
      register: _links

    - name: remove system links no longer declared
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ _links.files | rejectattr('path', 'in', systems | map('first') | map('regex_replace', '^', roms ~ '/') | list) | list }}"
      loop_control:
        label: "{{ item.path | basename }}"

    - name: find the declared launchers
      ansible.builtin.find:
        paths: "{{ spec }}"
        patterns: "port-*.sh"
        file_type: any
      register: _spec_ports

    - name: install each declared launcher
      ansible.builtin.copy:
        src: "{{ item.path }}"
        dest: "{{ roms }}/ports/{{ item.path | basename | regex_replace('^port-', '') | replace('_', ' ') }}"
        remote_src: true
        mode: "0755"
      loop: "{{ _spec_ports.files }}"
      loop_control:
        label: "{{ item.path | basename }}"

    - name: find the installed launchers
      ansible.builtin.find:
        paths: "{{ roms }}/ports"
        patterns: "*.sh"
      register: _ports

    - name: remove launchers no longer declared
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ _ports.files }}"
      when: >-
        ('port-' ~ (item.path | basename | replace(' ', '_')))
        not in (_spec_ports.files | map(attribute='path') | map('basename') | list)
      loop_control:
        label: "{{ item.path | basename }}"

    - name: check which ES-DE custom files are declared
      ansible.builtin.stat:
        path: "{{ spec }}/{{ item }}"
      loop: "{{ custom_files }}"
      register: _custom

    - name: install the declared ES-DE custom files, remove the undeclared
      ansible.builtin.copy:
        src: "{{ spec }}/{{ item.item }}"
        dest: "{{ home }}/ES-DE/custom_systems/{{ item.item }}"
        remote_src: true
        mode: "0644"
      loop: "{{ _custom.results | selectattr('stat.exists') | list }}"
      loop_control:
        label: "{{ item.item }}"

    - name: remove the ES-DE custom files no longer declared
      ansible.builtin.file:
        path: "{{ home }}/ES-DE/custom_systems/{{ item.item }}"
        state: absent
      loop: "{{ _custom.results | rejectattr('stat.exists') | list }}"
      loop_control:
        label: "{{ item.item }}"

- name: give RetroArch a writable controller-profile directory
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    home: "{{ lookup('ansible.builtin.env', 'HOME') }}"
    ra_config: "{{ home }}/.var/app/org.libretro.RetroArch/config/retroarch"
    ra_bundled_autoconfig: "{{ home }}/.local/share/flatpak/app/org.libretro.RetroArch/current/active/files/share/libretro/autoconfig"
  tasks:
    # The Flatpak's default joypad_autoconfig_dir is inside the read-only app image, so saving a
    # controller profile fails. Profiles live in RetroArch's own config instead, seeded from the
    # bundled set without overwriting profiles saved from the menu.
    - name: check for an installed RetroArch
      ansible.builtin.stat:
        path: "{{ ra_bundled_autoconfig }}"
      register: _ra_bundled

    - name: create the controller-profile directory
      when: _ra_bundled.stat.exists
      ansible.builtin.file:
        path: "{{ ra_config }}/autoconfig"
        state: directory
        mode: "0755"

    # copy with force: false skips a whole subdirectory once it exists; cp -n adds each missing
    # profile and leaves every existing one untouched.
    - name: seed the bundled controller profiles
      when: _ra_bundled.stat.exists
      ansible.builtin.command:
        argv: [cp, -R, -n, "{{ ra_bundled_autoconfig }}/.", "{{ ra_config }}/autoconfig/"]
      changed_when: false

    - name: check for RetroArch's config
      ansible.builtin.stat:
        path: "{{ ra_config }}/retroarch.cfg"
      register: _ra_cfg

    - name: point joypad_autoconfig_dir at the writable directory
      when: _ra_cfg.stat.exists
      ansible.builtin.lineinfile:
        path: "{{ ra_config }}/retroarch.cfg"
        regexp: '^joypad_autoconfig_dir = '
        line: 'joypad_autoconfig_dir = "~/.var/app/org.libretro.RetroArch/config/retroarch/autoconfig"'

- name: run Eden's Switch library from the games share
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    home: "{{ lookup('ansible.builtin.env', 'HOME') }}"
    eden_config: "{{ home }}/.config/eden/qt-config.ini"
    switch_root: "{{ lookup('ansible.builtin.env', 'ROMS_SRC') }}/Nintendo_-_Switch"
    # Eden reads updates and DLC found in its game folders in place (Data Storage,
    # ext_content_from_game_dirs), so nothing on the share is copied into the seat's NAND.
    # Game folders 1-3 are Eden's own SDMC, UserNAND and SysNAND; these follow from 4.
    eden_share_dirs:
      - "{{ switch_root }}/_Games"
      - "{{ switch_root }}/Updates"
      - "{{ switch_root }}/DLC"
    # The firmware's Mii and user-select applets crash under Eden (a 32-bit applet executes an
    # unmapped address), stalling games such as Mario Kart 8 Deluxe at "select a Mii". Eden's
    # built-in implementations (HLE, 0) do not depend on them.
    eden_hle_applets: [mii_edit, player_select]
  tasks:
    # Eden writes qt-config.ini on its first start; until then there is nothing to converge.
    - name: check for Eden's config
      ansible.builtin.stat:
        path: "{{ eden_config }}"
      register: _eden_cfg

    - name: converge Eden's share settings
      when: _eden_cfg.stat.exists
      block:
        - name: read updates and DLC from the game folders
          ansible.builtin.lineinfile:
            path: "{{ eden_config }}"
            regexp: '^ext_content_from_game_dirs='
            line: 'ext_content_from_game_dirs=true'

        - name: count the game folders
          ansible.builtin.lineinfile:
            path: "{{ eden_config }}"
            regexp: '^Paths\\gamedirs\\size='
            line: 'Paths\gamedirs\size={{ 3 + eden_share_dirs | length }}'

        - name: add each share folder as a game folder
          ansible.builtin.lineinfile:
            path: "{{ eden_config }}"
            regexp: '^Paths\\gamedirs\\{{ idx + 4 }}\\path='
            line: 'Paths\gamedirs\{{ idx + 4 }}\path={{ item }}'
            insertafter: '^Paths\\gamedirs\\'
          loop: "{{ eden_share_dirs }}"
          loop_control:
            index_var: idx
            label: "{{ idx + 4 }}: {{ item }}"

        - name: scan the share folders flat and show them expanded
          ansible.builtin.lineinfile:
            path: "{{ eden_config }}"
            regexp: '^Paths\\gamedirs\\{{ item.0 + 4 }}\\{{ item.1.key }}='
            line: 'Paths\gamedirs\{{ item.0 + 4 }}\{{ item.1.key }}={{ item.1.value }}'
            insertafter: '^Paths\\gamedirs\\{{ item.0 + 4 }}\\path='
          loop: "{{ range(eden_share_dirs | length) | product([{'key': 'deep_scan', 'value': 'false'}, {'key': 'expanded', 'value': 'true'}]) | list }}"
          loop_control:
            label: "{{ item.0 + 4 }}: {{ item.1.key }}"

        - name: mark the applet modes as set rather than default
          ansible.builtin.lineinfile:
            path: "{{ eden_config }}"
            regexp: '^{{ item }}_applet_mode\\default='
            line: '{{ item }}_applet_mode\default=false'
          loop: "{{ eden_hle_applets }}"

        - name: use Eden's built-in applets
          ansible.builtin.lineinfile:
            path: "{{ eden_config }}"
            regexp: '^{{ item }}_applet_mode='
            line: '{{ item }}_applet_mode=0'
          loop: "{{ eden_hle_applets }}"

- name: run Cemu's Wii U library from the games share
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    home: "{{ lookup('ansible.builtin.env', 'HOME') }}"
    cemu_config: "{{ home }}/.config/Cemu/settings.xml"
    cemu_game_paths:
      - "{{ lookup('ansible.builtin.env', 'ROMS_SRC') }}/Nintendo_-_Wii_U/_Games"
    # Cubeb (3) is Cemu's only audio backend on Linux; the default, DirectSound (0), finds no
    # device, and a title can hang at boot without its audio output.
    cemu_audio_api: "3"
  tasks:
    # Cemu writes settings.xml on its first exit; until then there is nothing to converge.
    - name: check for Cemu's config
      ansible.builtin.stat:
        path: "{{ cemu_config }}"
      register: _cemu_cfg

    - name: converge Cemu's share settings
      when: _cemu_cfg.stat.exists
      block:
        - name: list the share folders as the game paths
          community.general.xml:
            path: "{{ cemu_config }}"
            xpath: /content/GamePaths
            set_children: "{{ cemu_game_paths | map('community.general.dict_kv', 'Entry') | list }}"

        - name: output audio through Cubeb
          community.general.xml:
            path: "{{ cemu_config }}"
            xpath: /content/Audio/api
            value: "{{ cemu_audio_api }}"

- name: menu entries for the managed apps
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    spec: /library
    home: "{{ lookup('ansible.builtin.env', 'HOME') }}"
    apps_dir: "{{ home }}/Applications"
    menu_dir: "{{ home }}/.local/share/applications"
    installer_state: "{{ home }}/.local/state/steam-headless/app-installers"
    menu: >-
      {{ (lookup('ansible.builtin.file', spec ~ '/menu.txt', errors='ignore') | default('', true)).splitlines()
         | map('trim') | reject('match', '^(#|$)') | map('split', '|') | list }}
    dismissed: >-
      {{ (lookup('ansible.builtin.file', spec ~ '/dismiss.txt', errors='ignore') | default('', true)).splitlines()
         | map('trim') | reject('match', '^(#|$)') | list }}
  tasks:
    - name: ensure the menu and installer-state directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop: ["{{ menu_dir }}", "{{ installer_state }}"]

    - name: write a menu entry for each managed app
      ansible.builtin.copy:
        dest: "{{ menu_dir }}/seat-{{ item.0 }}.desktop"
        mode: "0644"
        content: |
          [Desktop Entry]
          Type=Application
          Name={{ item.1 }}
          Exec="{{ apps_dir }}/{{ item.2 }}"
          Path={{ (apps_dir ~ '/' ~ item.2) | dirname }}
          Icon=applications-games
          Terminal=false
          Categories={{ item.3 }}
      loop: "{{ menu }}"
      loop_control:
        label: "{{ item.0 }}"

    - name: find the seat's menu entries
      ansible.builtin.find:
        paths: "{{ menu_dir }}"
        patterns: "seat-*.desktop"
      register: _seat_entries

    - name: remove menu entries no longer declared
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ _seat_entries.files }}"
      when: (item.path | basename | regex_replace('^seat-(.*)\\.desktop$', '\\1')) not in (menu | map('first') | list)
      loop_control:
        label: "{{ item.path | basename }}"

    # The image's own reconcile (steam-headless-app-install) drops the launcher of any installer
    # offer whose state is "dismissed".
    - name: dismiss the image's installer offers for apps the seat manages
      ansible.builtin.copy:
        dest: "{{ installer_state }}/{{ item }}"
        content: "dismissed\n"
        mode: "0600"
      loop: "{{ dismissed }}"
