apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: steam-headless-secret
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: openbao-arbitorium
    kind: ClusterSecretStore
  target:
    name: steam-headless-secret
    template:
      type: Opaque
      data:
        USER_PASSWORD: "{{ .USER_PASSWORD | toString }}"
        SUNSHINE_USER: "{{ .SUNSHINE_USER | toString }}"
        SUNSHINE_PASS: "{{ .SUNSHINE_PASS | toString }}"
  dataFrom:
    - extract:
        key: apps/steam-headless
