apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: steam-headless
spec:
  revisionHistoryLimit: 5
  serviceName: steam-headless
  replicas: 1
  selector:
    matchLabels:
      app: steam-headless
  template:
    metadata:
      labels:
        app: steam-headless
        # Privileged seat: systemd as PID 1, a KWin compositor on the GPU, uinput virtual input
        # devices, and a root init that installs host-matched NVIDIA 32-bit libraries. None of the
        # five hardening dimensions can hold.
        policy.prplanit.com/except-seccomp: "true"
        policy.prplanit.com/except-drop-caps: "true"
        policy.prplanit.com/except-no-privesc: "true"
        policy.prplanit.com/except-non-root: "true"
        policy.prplanit.com/except-ro-rootfs: "true"
    spec:
      serviceAccountName: steam-headless
      runtimeClassName: nvidia
      # Sunshine binds its streaming ports on the node address; Moonlight reaches the seat there.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        seccompProfile:
          type: Unconfined
      containers:
        - name: steam-headless
          image: PLACEHOLDER_IMAGE
          securityContext:
            privileged: true
          env:
            - name: TZ
              value: "PLACEHOLDER_TZ"
            - name: DISPLAY
              value: ":55"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "all"
          ports:
            - containerPort: 47984
              name: sunshine-https
              protocol: TCP
            - containerPort: 47989
              name: sunshine-http
              protocol: TCP
            - containerPort: 47990
              name: sunshine-web
              protocol: TCP
            - containerPort: 48010
              name: sunshine-rtsp
              protocol: TCP
            - containerPort: 47998
              name: sunshine-video
              protocol: UDP
            - containerPort: 47999
              name: sunshine-ctrl
              protocol: UDP
            - containerPort: 48000
              name: sunshine-audio
              protocol: UDP
          volumeMounts:
            - name: home
              mountPath: /home/steamheadless
              subPath: home
            # The image's persistent state root (incl. the host-matched NVIDIA 32-bit libraries it
            # extracts on first boot); must be mounted whole — the image initialises it when empty.
            - name: home
              mountPath: /var/lib/steam-headless
              subPath: state
            # /mnt/games is the image's writable Steam library (chowned at every start); the ROM
            # library is mounted read-only beside it.
            - name: games
              mountPath: /mnt/roms
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
            # systemd (PID 1) mounts its own tmpfs over /run unless /run is already a mount point,
            # hiding the session environment the init script writes there before exec.
            - name: run
              mountPath: /run
          resources:
            limits:
              nvidia.com/gpu: 1
      volumes:
        - name: games
          persistentVolumeClaim:
            claimName: steam-headless-games
            readOnly: true
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: home
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
