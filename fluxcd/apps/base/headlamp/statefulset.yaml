apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: headlamp
  annotations:
    # force-replace on immutable-field change (e.g. volumeClaimTemplates); PVC retained
    kustomize.toolkit.fluxcd.io/force: "Enabled"
spec:
  replicas: 1
  revisionHistoryLimit: 5
  serviceName: headlamp
  selector:
    matchLabels:
      app: headlamp
  template:
    metadata:
      labels:
        app: headlamp
    spec:
      serviceAccountName: headlamp
      initContainers:
        # Reconcile plugins onto the PVC via the mounted release-sync playbook
        # (fetch pinned release -> verify against the published sha256 -> place
        # at dest). The outer guard keeps a reconcile failure from blocking pod
        # start: Headlamp always boots, serving whatever is already cached.
        - name: fetch-plugins
          image: docker.io/hlhd/ansible
          command:
            - sh
            - -c
            - |
              ansible-playbook /playbook/sync.yml -e @/spec/releases.yaml \
                || echo "release-sync: reconcile failed; starting with cached plugins"
          env:
            - name: HOME
              value: /tmp
            - name: ANSIBLE_LOCALHOST_WARNING
              value: "false"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: playbook
              mountPath: /playbook
              readOnly: true
            - name: spec
              mountPath: /spec
              readOnly: true
            - name: plugins
              mountPath: /plugins
            - name: tmp
              mountPath: /tmp
      containers:
        - name: headlamp
          image: ghcr.io/headlamp-k8s/headlamp
          args: ["-in-cluster", "-plugins-dir=/plugins"]
          ports:
            - name: http
              containerPort: 4466
          readinessProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
          volumeMounts:
            - name: plugins
              mountPath: /plugins
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: playbook
          configMap:
            name: sync-release-artifacts
        - name: spec
          configMap:
            name: headlamp-release-spec
  volumeClaimTemplates:
    - metadata:
        name: plugins
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: PLACEHOLDER_STORAGE
