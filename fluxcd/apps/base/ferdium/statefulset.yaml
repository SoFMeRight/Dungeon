apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ferdium
spec:
  revisionHistoryLimit: 5
  serviceName: ferdium
  replicas: PLACEHOLDER_REPLICAS
  selector:
    matchLabels:
      app: ferdium
  template:
    metadata:
      labels:
        app: ferdium
    spec:
      serviceAccountName: ferdium
      containers:
        - name: ferdium
          image: PLACEHOLDER_IMAGE
          ports:
            - containerPort: 3000
              name: http
            - containerPort: 3001
              name: https
          env:
            - name: PUID
              value: "PLACEHOLDER_PUID"
            - name: PGID
              value: "PLACEHOLDER_PGID"
            - name: TZ
              value: "PLACEHOLDER_TZ"
          volumeMounts:
            - name: PLACEHOLDER_NAMESPACE-ferdium-config
              mountPath: /config
            - name: dshm
              mountPath: /dev/shm
          # LSIO/s6-overlay: s6 preinit requires root-owned /run and setuid-drops to PUID/PGID —
          # can't run non-root. Partial hardening: keep root, drop ALL, add back only s6's file-perm
          # + setuid caps. Ports 3000/3001 unprivileged (no NET_BIND_SERVICE).
          securityContext:
            seccompProfile:
              type: RuntimeDefault
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - SETUID
                - SETGID
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: PLACEHOLDER_NAMESPACE-ferdium-config
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: PLACEHOLDER_STORAGE_CLASS
        resources:
          requests:
            storage: PLACEHOLDER_CONFIG_STORAGE_SIZE
