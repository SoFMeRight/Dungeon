apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bulwark-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-optcp
  target:
    name: bulwark-secret
    creationPolicy: Owner
    template:
      data:
        SESSION_SECRET: "{{ .sessionSecret }}"
        ADMIN_PASSWORD: "{{ .adminPassword }}"
        OAUTH_CLIENT_ID: "{{ .oidcClientId }}"
        OAUTH_CLIENT_SECRET: "{{ .oidcClientSecret }}"
  data:
    - secretKey: sessionSecret
      remoteRef:
        key: apps/bulwark/app
        property: SESSION_SECRET
    - secretKey: adminPassword
      remoteRef:
        key: apps/bulwark/app
        property: ADMIN_PASSWORD
    - secretKey: oidcClientId
      remoteRef:
        key: apps/bulwark/oidc
        property: CLIENT_ID
    - secretKey: oidcClientSecret
      remoteRef:
        key: apps/bulwark/oidc
        property: CLIENT_SECRET
