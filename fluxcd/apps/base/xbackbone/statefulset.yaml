apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: xbackbone
spec:
  revisionHistoryLimit: 5
  serviceName: xbackbone
  replicas: PLACEHOLDER_REPLICAS
  selector:
    matchLabels:
      app: xbackbone
  template:
    metadata:
      labels:
        app: xbackbone
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: xbackbone
          image: PLACEHOLDER_IMAGE
          # LSIO s6-overlay: starts root then drops to abc (PUID); RO-root/non-root need a rebuild.
          # Partial ceiling: drop ALL + s6's file-ownership caps + NET_BIND_SERVICE (nginx binds
          # :80/:443) + no-privesc. (Undeployed/frozen — verify on resurrection.)
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - SETUID
                - SETGID
                - NET_BIND_SERVICE
          ports:
            - containerPort: 80
              name: http
              protocol: TCP
            - containerPort: 443
              name: https
              protocol: TCP
          env:
            - name: TZ
              value: PLACEHOLDER_TZ
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          volumeMounts:
            - name: tingle-tuner-xbackbone-config
              mountPath: /config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: tingle-tuner-xbackbone-config
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: PLACEHOLDER_STORAGE_CLASS
        resources:
          requests:
            storage: 10Gi
