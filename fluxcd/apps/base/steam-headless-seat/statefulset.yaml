apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: steam-headless
spec:
  revisionHistoryLimit: 5
  serviceName: steam-headless
  replicas: 1
  selector:
    matchLabels:
      app: steam-headless
  template:
    metadata:
      labels:
        app: steam-headless
        # Privileged seat: systemd as PID 1, a KWin compositor on the GPU, uinput virtual input
        # devices, and a root init that installs host-matched NVIDIA 32-bit libraries. None of the
        # five hardening dimensions can hold.
        policy.prplanit.com/except-seccomp: "true"
        policy.prplanit.com/except-drop-caps: "true"
        policy.prplanit.com/except-no-privesc: "true"
        policy.prplanit.com/except-non-root: "true"
        policy.prplanit.com/except-ro-rootfs: "true"
        # Outside the ambient mesh: the seat's Sunshine streams are UDP from LAN clients and its
        # egress is the open internet; Cilium policy scopes both.
        istio.io/dataplane-mode: none
    spec:
      serviceAccountName: steam-headless
      # Seats run untrusted games and never talk to the Kubernetes API: no token in the pod.
      automountServiceAccountToken: false
      runtimeClassName: nvidia
      securityContext:
        seccompProfile:
          type: Unconfined
      initContainers:
        # Reconcile the pinned launchers, emulators and ports (release spec) onto the home volume
        # via the mounted release-sync playbook, then converge the ES-DE library. Neither step
        # blocks the seat: on failure it boots with whatever is already cached.
        - name: sync-apps
          image: docker.io/hlhd/ansible
          command:
            - sh
            - -c
            - |
              ansible-playbook /playbook/sync.yml -e @/spec/releases.yaml \
                || echo "release-sync: reconcile failed; starting with cached apps"
              ansible-playbook /library-script/library.yml \
                || echo "library: converge failed; starting with the previous library"
          env:
            - name: HOME
              value: /home/steamheadless
            - name: ANSIBLE_HOME
              value: /tmp/ansible
            - name: ANSIBLE_LOCAL_TEMP
              value: /tmp/ansible/tmp
            - name: ANSIBLE_REMOTE_TEMP
              value: /tmp/ansible/remote
            - name: ANSIBLE_LOCALHOST_WARNING
              value: "false"
            - name: ROMS_SRC
              value: /mnt/roms
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: playbook
              mountPath: /playbook
              readOnly: true
            - name: release-spec
              mountPath: /spec
              readOnly: true
            - name: library-script
              mountPath: /library-script
              readOnly: true
            - name: library
              mountPath: /library
              readOnly: true
            - name: steam-headless-home
              mountPath: /home/steamheadless
              subPath: home
            - name: sync-tmp
              mountPath: /tmp
            # file:// sources (preserved builds on the games share)
            - name: games
              mountPath: /mnt/roms
              readOnly: true
        # Converge the declared Flathub apps (library/flatpaks.txt) into the seat user's Flatpak
        # installation on the home volume. Runs on the seat image, which carries flatpak; the
        # install triggers run in Bubblewrap and need the same privilege as the seat. Never
        # blocks the seat.
        - name: sync-flatpaks
          image: PLACEHOLDER_IMAGE
          command:
            - sh
            - -c
            - |
              bash /library-script/flatpaks.sh || echo "flatpak: converge failed; starting with installed apps"
          env:
            - name: HOME
              value: /home/steamheadless
          securityContext:
            privileged: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: library-script
              mountPath: /library-script
              readOnly: true
            - name: library
              mountPath: /library
              readOnly: true
            - name: steam-headless-home
              mountPath: /home/steamheadless
              subPath: home
            - name: sync-tmp
              mountPath: /tmp
      containers:
        - name: steam-headless
          image: PLACEHOLDER_IMAGE
          securityContext:
            privileged: true
          # 1. NVIDIA Container Toolkit >= 1.18 stacks a second tmpfs (its disable-device-node-modification
          #    hook, source /nvct-params) on /proc/driver/nvidia/params over libnvidia-container's. The
          #    image's init unmounts once, leaving one; any submount on /proc makes the kernel refuse
          #    Bubblewrap's fresh /proc, so every Flatpak fails. Unmount until none remain.
          # 2. The image's init deletes every /dev/dri/card* node. NVIDIA's Wayland EGL (egl-wayland)
          #    identifies its GPU by the primary node, so without it every Wayland client (plasmashell,
          #    Firefox, Flatpak apps) falls back to llvmpipe. Recreate only the render GPU's own card
          #    node, matched by its sysfs device, once PID 1 has become systemd: after the init's
          #    deletion and before the session's clients pick a renderer.
          # 3. The toolkit mounts the node's older egl-wayland (1.1.13) ahead of the image's 1.1.22 on
          #    the library path; KWin 6.7's Wayland server needs the newer one, so native clients
          #    (plasmashell, Firefox) still fell back to llvmpipe. /etc/egl overrides the platform
          #    entry to load the image's own egl-wayland by absolute path.
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - |
                    while mountpoint -q /proc/driver/nvidia/params; do
                      umount /proc/driver/nvidia/params || break
                    done
                    i=0
                    while [ "$(cat /proc/1/comm)" != "systemd" ] && [ $i -lt 300 ]; do
                      sleep 0.2; i=$((i + 1))
                    done
                    render=$(ls /dev/dri/renderD* 2>/dev/null | head -n 1)
                    [ -n "$render" ] || exit 0
                    gpu=$(readlink -f "/sys/class/drm/$(basename "$render")/device")
                    for card in /sys/class/drm/card*; do
                      name=$(basename "$card")
                      case "$name" in *-*) continue ;; esac
                      [ "$(readlink -f "$card/device")" = "$gpu" ] || continue
                      [ -e "/dev/dri/$name" ] && continue
                      dev=$(cat "$card/dev")
                      mknod -m 0660 "/dev/dri/$name" c "${dev%%:*}" "${dev##*:}"
                      chgrp --reference="$render" "/dev/dri/$name"
                    done
                    # A user-namespace seat cannot create device nodes: generic-device-plugin hands
                    # the card in as seat-cardN, which the init's deletion does not match.
                    for seat_card in /dev/dri/seat-card*; do
                      [ -c "$seat_card" ] || continue
                      card="/dev/dri/${seat_card#/dev/dri/seat-}"
                      [ -e "$card" ] || ln -s "$(basename "$seat_card")" "$card"
                    done
                    if [ -e /usr/lib64/libnvidia-egl-wayland.so.1 ]; then
                      mkdir -p /etc/egl/egl_external_platform.d
                      printf '%s\n' '{"file_format_version":"1.0.0","ICD":{"library_path":"/usr/lib64/libnvidia-egl-wayland.so.1"}}' \
                        > /etc/egl/egl_external_platform.d/10_nvidia_wayland.json
                    fi
                    exit 0
          env:
            - name: TZ
              value: "PLACEHOLDER_TZ"
            - name: DISPLAY
              value: ":55"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "all"
          ports:
            - containerPort: 47984
              name: sunshine-https
              protocol: TCP
            - containerPort: 47989
              name: sunshine-http
              protocol: TCP
            - containerPort: 47990
              name: sunshine-web
              protocol: TCP
            - containerPort: 48010
              name: sunshine-rtsp
              protocol: TCP
            - containerPort: 47998
              name: sunshine-video
              protocol: UDP
            - containerPort: 47999
              name: sunshine-ctrl
              protocol: UDP
            - containerPort: 48000
              name: sunshine-audio
              protocol: UDP
          volumeMounts:
            - name: steam-headless-home
              mountPath: /home/steamheadless
              subPath: home
            # The image's persistent state root (incl. the host-matched NVIDIA 32-bit libraries it
            # extracts on first boot); must be mounted whole — the image initialises it when empty.
            - name: steam-headless-home
              mountPath: /var/lib/steam-headless
              subPath: state
            # /mnt/games is the image's writable Steam library (chowned at every start); the ROM
            # library is mounted read-only beside it.
            - name: games
              mountPath: /mnt/roms
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
            # systemd (PID 1) mounts its own tmpfs over /run unless /run is already a mount point,
            # hiding the session environment the init script writes there before exec.
            - name: run
              mountPath: /run
          resources:
            limits:
              nvidia.com/gpu: 1
      volumes:
        - name: games
          persistentVolumeClaim:
            claimName: steam-headless-games
            readOnly: true
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
        - name: playbook
          configMap:
            name: sync-release-artifacts
        - name: release-spec
          configMap:
            name: steam-headless-release-spec
        - name: library-script
          configMap:
            name: steam-headless-library-script
        - name: library
          configMap:
            name: steam-headless-library
        - name: sync-tmp
          emptyDir:
            sizeLimit: 2Gi
  volumeClaimTemplates:
    - metadata:
        name: steam-headless-home
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
