apiVersion: v1
kind: Service
metadata:
  name: steam-headless
spec:
  type: PLACEHOLDER_SERVICE_TYPE
  selector:
    app: steam-headless
  ports:
    - name: sunshine-https
      port: 47984
      targetPort: 47984
      protocol: TCP
    - name: sunshine-http
      port: 47989
      targetPort: 47989
      protocol: TCP
    - name: sunshine-web
      port: 47990
      targetPort: 47990
      protocol: TCP
    - name: sunshine-rtsp
      port: 48010
      targetPort: 48010
      protocol: TCP
    - name: sunshine-video
      port: 47998
      targetPort: 47998
      protocol: UDP
    - name: sunshine-ctrl
      port: 47999
      targetPort: 47999
      protocol: UDP
    - name: sunshine-audio
      port: 48000
      targetPort: 48000
      protocol: UDP
    - name: shui
      port: 8483
      targetPort: 8483
      protocol: TCP
    - name: shui-webrtc
      port: 8483
      targetPort: 8483
      protocol: UDP
