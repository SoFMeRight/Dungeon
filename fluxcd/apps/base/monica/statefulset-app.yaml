apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: monica
spec:
  revisionHistoryLimit: 5
  serviceName: monica
  replicas: PLACEHOLDER_REPLICAS
  selector:
    matchLabels:
      app: monica
  template:
    metadata:
      labels:
        app: monica
    spec:
      serviceAccountName: monica
      # nginx runs fully non-root (uid 101) on :8080 with a read-only rootfs (writable emptyDirs
      # for its cache + pid). The copy-app init and fpm master remain root (fpm forks www-data
      # workers) — root-required partial for those: drop ALL + file-ownership/setuid caps + seccomp.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: copy-app
          image: PLACEHOLDER_IMAGE
          command: ['sh', '-c', 'cp -a /var/www/html/. /app-files/']
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
          volumeMounts:
            - name: app-files
              mountPath: /app-files
      containers:
        - name: nginx
          image: PLACEHOLDER_NGINX_IMAGE
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
            - name: app-files
              mountPath: /var/www/html
              readOnly: true
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
          resources:
            requests:
              memory: 32Mi
              cpu: 10m
            limits:
              memory: 64Mi
              cpu: 100m
        - name: monica
          image: PLACEHOLDER_IMAGE
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - SETUID
                - SETGID
          env:
            - name: APP_URL
              value: "PLACEHOLDER_APP_URL"
            - name: APP_TRUSTED_PROXIES
              value: "*"
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: monica-secrets
                  key: app_key
            - name: DB_HOST
              value: "monica-db"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: monica-secrets
                  key: db_username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: monica-secrets
                  key: db_password
          volumeMounts:
            - name: data
              mountPath: /var/www/html/storage
            - name: app-files
              mountPath: /var/www/html
          resources:
            requests:
              memory: 512Mi
              cpu: 200m
            limits:
              memory: 1Gi
              cpu: 1000m
      volumes:
        - name: nginx-config
          configMap:
            name: monica-nginx
        - name: app-files
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: PLACEHOLDER_STORAGE_CLASS
        resources:
          requests:
            storage: 10Gi
