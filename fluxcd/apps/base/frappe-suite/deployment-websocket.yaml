apiVersion: apps/v1
kind: Deployment
metadata:
  name: frappe-suite-websocket
spec:
  revisionHistoryLimit: 5
  replicas: 1
  selector:
    matchLabels:
      app: frappe-suite-websocket
  template:
    metadata:
      labels:
        app: frappe-suite-websocket
    spec:
      serviceAccountName: frappe-suite-websocket
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: websocket
          image: PLACEHOLDER_ERPNEXT_IMAGE
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - node
            - /home/frappe/frappe-bench/apps/frappe/socketio.js
          ports:
            - containerPort: 9000
              name: websocket
          volumeMounts:
            - name: sites-data
              mountPath: /home/frappe/frappe-bench/sites
              readOnly: true
            - name: logs-data
              mountPath: /home/frappe/frappe-bench/logs
      volumes:
        - name: sites-data
          persistentVolumeClaim:
            claimName: PLACEHOLDER_SITES_PVC
        - name: logs-data
          persistentVolumeClaim:
            claimName: PLACEHOLDER_LOGS_PVC
