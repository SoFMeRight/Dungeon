apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: frappe-suite-sites
spec:
  revisionHistoryLimit: 5
  serviceName: frappe-suite-sites
  replicas: 1
  selector:
    matchLabels:
      app: frappe-suite-sites
  template:
    metadata:
      labels:
        app: frappe-suite-sites
    spec:
      serviceAccountName: frappe-suite-sites
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: copy-assets
          image: PLACEHOLDER_ERPNEXT_IMAGE
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - bash
            - -c
            - |
              echo "Copying assets from image to sites volume...";
              cp -r /home/frappe/frappe-bench/sites/assets \
                /mnt/sites/assets;
              cp -f /home/frappe/frappe-bench/sites/apps.json \
                /mnt/sites/apps.json 2>/dev/null || true;
              echo "Assets copied successfully.";
          volumeMounts:
            - name: PLACEHOLDER_SITES_DATA
              mountPath: /mnt/sites
        - name: configurator
          image: PLACEHOLDER_ERPNEXT_IMAGE
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - bash
            - -c
            - |
              ls -1 apps > sites/apps.txt;
              if [ ! -f sites/common_site_config.json ]; then
                echo '{}' > sites/common_site_config.json;
              fi
              bench set-config -g db_host $DB_HOST;
              bench set-config -gp db_port $DB_PORT;
              bench set-config -g redis_cache "redis://$REDIS_CACHE";
              bench set-config -g redis_queue "redis://$REDIS_QUEUE";
              bench set-config -g redis_socketio "redis://$REDIS_QUEUE";
              bench set-config -gp socketio_port $SOCKETIO_PORT;
          env:
            - name: DB_HOST
              value: "frappe-suite-mariadb"
            - name: DB_PORT
              value: "3306"
            - name: REDIS_CACHE
              value: "frappe-suite-redis-cache:6379"
            - name: REDIS_QUEUE
              value: "frappe-suite-redis-queue:6379"
            - name: SOCKETIO_PORT
              value: "9000"
          volumeMounts:
            - name: PLACEHOLDER_SITES_DATA
              mountPath: /home/frappe/frappe-bench/sites
            - name: PLACEHOLDER_LOGS_DATA
              mountPath: /home/frappe/frappe-bench/logs
        - name: create-site
          image: PLACEHOLDER_ERPNEXT_IMAGE
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - bash
            - -c
            - |
              wait-for-it -t 120 frappe-suite-mariadb:3306;
              wait-for-it -t 120 frappe-suite-redis-cache:6379;
              wait-for-it -t 120 frappe-suite-redis-queue:6379;
              export start=`date +%s`;
              until [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".db_host // empty"` ]] && \
                [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_cache // empty"` ]] && \
                [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_queue // empty"` ]];
              do
                echo "Waiting for sites/common_site_config.json to be created";
                sleep 5;
                if (( `date +%s`-start > 120 )); then
                  echo "could not find sites/common_site_config.json with required keys";
                  exit 1
                fi
              done;
              echo "sites/common_site_config.json found";
              if [ ! -f sites/$SITE_NAME/site_config.json ]; then
                bench new-site \
                  --mariadb-user-host-login-scope='%' \
                  --admin-password=$ADMIN_PASSWORD \
                  --db-root-username=root \
                  --db-root-password=$DB_ROOT_PASSWORD \
                  --install-app erpnext \
                  --install-app hrms \
                  --install-app helpdesk \
                  --install-app crm \
                  --set-default \
                  $SITE_NAME;
              else
                echo "Site $SITE_NAME already exists, skipping creation";
              fi
              # Routing is nginx's job via FRAPPE_SITE_NAME_HEADER; what the site itself
              # needs is the URL to put in the links it generates — password resets,
              # notifications, OAuth redirects — which is host_name. Written to the
              # default site, which new-site above set. Changing the hostname is this
              # value plus the HTTPRoute; the site is not involved.
              bench set-config host_name https://$SITE_DOMAIN
              # Identity provider and landing app live in the database, so they are
              # reapplied here rather than surviving only as whatever an operator once ran.
              /home/frappe/frappe-bench/env/bin/python /scripts/configure-site.py
          env:
            # The site is the tenant boundary: named for the organisation whose books it
            # holds, not for the URL. PrPlanIT, HomeLabHD and SoFMeRight are Companies
            # inside it; another business would be a separate site on this same bench.
            - name: SITE_NAME
              value: "prplanit"
            - name: SITE_DOMAIN
              value: "hq.pcfae.com"
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: frappe-suite-secrets
                  key: ADMIN_PASSWORD
            - name: DB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: frappe-suite-secrets
                  key: MYSQL_ROOT_PASSWORD
            # The label names the organisation people log in with, not the software
            # issuing the token. Frappe derives the record name from it, and the callback
            # path from that name, so changing it changes the redirect URI the provider
            # must hold.
            - name: OIDC_PROVIDER_LABEL
              value: "PrPlanIT"
            - name: OIDC_BASE_URL
              value: "https://sso.prplanit.com"
            - name: OIDC_AUTHORIZE_PATH
              value: "/oauth/v2/authorize"
            - name: OIDC_TOKEN_PATH
              value: "/oauth/v2/token"
            - name: OIDC_USERINFO_PATH
              value: "/oidc/v1/userinfo"
            - name: OIDC_SCOPES
              value: "openid profile email"
            # A site holding books does not hand a User record to everyone the provider
            # will authenticate; people are provisioned first.
            - name: OIDC_SIGN_UPS
              value: "Deny"
            - name: OIDC_USER_ID_PROPERTY
              value: "sub"
            - name: DEFAULT_APP
              value: "erpnext"
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: frappe-suite-secrets
                  key: OIDC_CLIENT_ID
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: frappe-suite-secrets
                  key: OIDC_CLIENT_SECRET
          volumeMounts:
            - name: PLACEHOLDER_SITES_DATA
              mountPath: /home/frappe/frappe-bench/sites
            - name: PLACEHOLDER_LOGS_DATA
              mountPath: /home/frappe/frappe-bench/logs
            - name: site-setup
              mountPath: /scripts
              readOnly: true
      containers:
        - name: backend
          image: PLACEHOLDER_ERPNEXT_IMAGE
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8000
              name: backend
          env:
            - name: DB_HOST
              value: "frappe-suite-mariadb"
            - name: DB_PORT
              value: "3306"
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: frappe-suite-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: frappe-suite-secrets
                  key: MYSQL_ROOT_PASSWORD
          volumeMounts:
            - name: PLACEHOLDER_SITES_DATA
              mountPath: /home/frappe/frappe-bench/sites
            - name: PLACEHOLDER_LOGS_DATA
              mountPath: /home/frappe/frappe-bench/logs
      volumes:
        - name: site-setup
          configMap:
            name: frappe-suite-site-setup
  volumeClaimTemplates:
    - metadata:
        name: PLACEHOLDER_SITES_DATA
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: PLACEHOLDER_STORAGE_CLASS
        resources:
          requests:
            storage: 20Gi
    - metadata:
        name: PLACEHOLDER_LOGS_DATA
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: PLACEHOLDER_STORAGE_CLASS
        resources:
          requests:
            storage: 5Gi
