apiVersion: apps/v1
kind: Deployment
metadata:
  name: frappe-suite-frontend
spec:
  revisionHistoryLimit: 5
  replicas: 1
  selector:
    matchLabels:
      app: frappe-suite-frontend
  template:
    metadata:
      labels:
        app: frappe-suite-frontend
    spec:
      serviceAccountName: frappe-suite-frontend
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: PLACEHOLDER_ERPNEXT_IMAGE
          command:
            - nginx-entrypoint.sh
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: BACKEND
              value: "frappe-suite-sites:8000"
            # The SITE, not the hostname: nginx sends this as X-Frappe-Site-Name and also
            # resolves static files under sites/<value>/public, so it must name a site
            # directory that exists. $host only works where a site is named after the
            # domain it answers on; sites here are named for the organisation whose books
            # they hold, so the URL can change without the site moving.
            #
            # A second organisation gets its own site and its own frontend pinned to it,
            # which is how upstream documents multi-tenancy.
            - name: FRAPPE_SITE_NAME_HEADER
              value: "prplanit"
            - name: SOCKETIO
              value: "frappe-suite-websocket:9000"
            - name: UPSTREAM_REAL_IP_ADDRESS
              value: "PLACEHOLDER_UPSTREAM_IP"
            - name: UPSTREAM_REAL_IP_HEADER
              value: "X-Forwarded-For"
            - name: UPSTREAM_REAL_IP_RECURSIVE
              value: "off"
            - name: PROXY_READ_TIMEOUT
              value: "120"
            - name: CLIENT_MAX_BODY_SIZE
              value: "50m"
          volumeMounts:
            - name: sites-data
              mountPath: /home/frappe/frappe-bench/sites
              readOnly: true
            - name: logs-data
              mountPath: /home/frappe/frappe-bench/logs
              readOnly: true
      volumes:
        - name: sites-data
          persistentVolumeClaim:
            claimName: PLACEHOLDER_SITES_PVC
        - name: logs-data
          persistentVolumeClaim:
            claimName: PLACEHOLDER_LOGS_PVC
