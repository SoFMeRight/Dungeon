apiVersion: apps/v1
kind: Deployment
metadata:
  name: frappe-suite-scheduler
spec:
  revisionHistoryLimit: 5
  replicas: 1
  selector:
    matchLabels:
      app: frappe-suite-scheduler
  template:
    metadata:
      labels:
        app: frappe-suite-scheduler
    spec:
      serviceAccountName: frappe-suite-scheduler
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: scheduler
          image: PLACEHOLDER_ERPNEXT_IMAGE
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - bench
            - schedule
          volumeMounts:
            - name: sites-data
              mountPath: /home/frappe/frappe-bench/sites
            - name: logs-data
              mountPath: /home/frappe/frappe-bench/logs
      volumes:
        - name: sites-data
          persistentVolumeClaim:
            claimName: PLACEHOLDER_SITES_PVC
        - name: logs-data
          persistentVolumeClaim:
            claimName: PLACEHOLDER_LOGS_PVC
