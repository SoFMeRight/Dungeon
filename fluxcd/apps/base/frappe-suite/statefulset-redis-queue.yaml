apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: erpnext-redis-queue
spec:
  revisionHistoryLimit: 5
  serviceName: erpnext-redis-queue
  replicas: 1
  selector:
    matchLabels:
      app: erpnext-redis-queue
  template:
    metadata:
      labels:
        app: erpnext-redis-queue
    spec:
      serviceAccountName: erpnext-redis-queue
      containers:
        - name: redis
          image: PLACEHOLDER_REDIS_IMAGE
          securityContext:
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 6379
              name: redis
          volumeMounts:
            - name: PLACEHOLDER_REDIS_QUEUE_DATA
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: PLACEHOLDER_REDIS_QUEUE_DATA
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: PLACEHOLDER_STORAGE_CLASS
        resources:
          requests:
            storage: 5Gi
