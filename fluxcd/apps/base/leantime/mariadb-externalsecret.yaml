apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: leantime-mariadb
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-operationtimecapsule
  target:
    name: leantime-mariadb
    creationPolicy: Owner
  data:
    - secretKey: root-password
      remoteRef:
        key: apps/leantime
        property: mariadb-root-password
    - secretKey: user-password
      remoteRef:
        key: apps/leantime
        property: mariadb-user-password
