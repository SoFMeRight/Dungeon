apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: leantime-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-operationtimecapsule
  target:
    name: leantime-secret
    creationPolicy: Owner
  data:
    - secretKey: session-password
      remoteRef:
        key: apps/leantime
        property: session-password
    - secretKey: oidc-client-id
      remoteRef:
        key: apps/leantime
        property: oidc-client-id
    - secretKey: oidc-client-secret
      remoteRef:
        key: apps/leantime
        property: oidc-client-secret
