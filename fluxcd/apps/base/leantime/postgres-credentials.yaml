apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: leantime-postgres-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-optcp
  target:
    name: leantime-postgres-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: apps/leantime/postgres
        property: USER
    - secretKey: password
      remoteRef:
        key: apps/leantime/postgres
        property: PASSWORD
