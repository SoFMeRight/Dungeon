apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - serviceaccount.yaml
  - postgres-credentials.yaml
  - externalsecret-postgres-backup.yaml
  - objectstore-postgres.yaml
  - postgres-cluster.yaml
  - scheduledbackup-postgres.yaml
  - statefulset.yaml
  - externalsecret.yaml
  - service.yaml
configMapGenerator:
  # Postgres fixes for leantime 3.12.0 (unquoted camelCase columns in two raw selects).
  # The seed init container refuses to start if the image's originals change.
  - name: leantime-pg-patches
    files:
      - patches/ReportEngine.php
      - patches/Goalcanvas.php
