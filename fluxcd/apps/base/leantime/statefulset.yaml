apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: leantime
  labels:
    app: leantime
spec:
  revisionHistoryLimit: 5
  serviceName: leantime
  # One replica: uploads live on a ReadWriteOnce volume and sessions are file-backed.
  replicas: 1
  selector:
    matchLabels:
      app: leantime
  template:
    metadata:
      labels:
        app: leantime
    spec:
      serviceAccountName: leantime
      # Leantime never calls the Kubernetes API; a compromised pod gets no cluster credential.
      automountServiceAccountToken: false
      # The image runs as www-data (uid 1000, group 0 bits mirrored for arbitrary uids).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Read-only root: the image's writable trees are copied into emptyDirs first, so the
        # mounts below never hide what the image ships (compiled caches, bundled plugins).
        - name: seed-writable
          image: docker.io/leantime/leantime:3.12.0
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - sh
            - -c
            - |
              set -e
              cp -a /var/www/html/storage/. /seed/storage/
              cp -a /var/www/html/bootstrap/cache/. /seed/bootstrap-cache/
              cp -a /var/www/html/app/Plugins/. /seed/plugins/
              cp -a /var/lib/nginx/. /seed/nginx-lib/
              # The mounted Postgres patches are copies of these 3.12.0 files; a new image must
              # come with new patches (or drop them once upstream fixes the queries).
              sha256sum -c <<'SUMS'
              5a72199166463330dac4f0017fd70d89213177268adf84cc904f9dbf1e286e1b  /var/www/html/app/Domain/Reports/Repositories/ReportEngine.php
              68071c498dc38f213be57483a755e8075431d02231eba74a6d3391e29ce25663  /var/www/html/app/Domain/Goalcanvas/Repositories/Goalcanvas.php
              SUMS
              mkdir -p /seed/log/nginx /seed/log/supervisor
          volumeMounts:
            - name: storage
              mountPath: /seed/storage
            - name: bootstrap-cache
              mountPath: /seed/bootstrap-cache
            - name: plugins
              mountPath: /seed/plugins
            - name: log
              mountPath: /seed/log
            - name: nginx-lib
              mountPath: /seed/nginx-lib
        - name: wait-for-db
          image: docker.io/busybox:1.38
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - sh
            - -c
            - |
              until nc -z -v -w5 leantime-postgres-rw 5432; do
                echo "Waiting for Postgres..."
                sleep 5
              done
      containers:
        - name: leantime
          image: docker.io/leantime/leantime:3.12.0
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: LEAN_DB_DEFAULT_CONNECTION
              value: pgsql
            - name: LEAN_DB_HOST
              value: leantime-postgres-rw
            - name: LEAN_DB_PORT
              value: "5432"
            - name: LEAN_DB_DATABASE
              value: leantime
            - name: LEAN_DB_USER
              valueFrom:
                secretKeyRef:
                  name: leantime-postgres-credentials
                  key: username
            - name: LEAN_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: leantime-postgres-credentials
                  key: password
            - name: LEAN_SESSION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: leantime-secret
                  key: session-password
            - name: LEAN_APP_URL
              value: PLACEHOLDER_APP_URL
            - name: LEAN_SESSION_SECURE
              value: "true"
            - name: LEAN_ALLOW_TELEMETRY
              value: "false"
            - name: LEAN_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: leantime-secret
                  key: oidc-client-id
            - name: LEAN_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: leantime-secret
                  key: oidc-client-secret
          volumeMounts:
            - name: leantime-data
              mountPath: /var/www/html/userfiles
              subPath: userfiles
            - name: leantime-data
              mountPath: /var/www/html/public/userfiles
              subPath: public-userfiles
            - name: storage
              mountPath: /var/www/html/storage
            - name: bootstrap-cache
              mountPath: /var/www/html/bootstrap/cache
            - name: plugins
              mountPath: /var/www/html/app/Plugins
            - name: log
              mountPath: /var/log
            - name: nginx-lib
              mountPath: /var/lib/nginx
            - name: run
              mountPath: /run
            - name: tmp
              mountPath: /tmp
            - name: pg-patches
              mountPath: /var/www/html/app/Domain/Reports/Repositories/ReportEngine.php
              subPath: ReportEngine.php
              readOnly: true
            - name: pg-patches
              mountPath: /var/www/html/app/Domain/Goalcanvas/Repositories/Goalcanvas.php
              subPath: Goalcanvas.php
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
      # Node-disk scratch (not tmpfs), each capped so logs or caches can never fill a node.
      volumes:
        - name: storage
          emptyDir:
            sizeLimit: 256Mi
        - name: bootstrap-cache
          emptyDir:
            sizeLimit: 32Mi
        - name: plugins
          emptyDir:
            sizeLimit: 128Mi
        - name: log
          emptyDir:
            sizeLimit: 128Mi
        - name: nginx-lib
          emptyDir:
            sizeLimit: 64Mi
        - name: run
          emptyDir:
            sizeLimit: 8Mi
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: pg-patches
          configMap:
            name: leantime-pg-patches
  volumeClaimTemplates:
    - metadata:
        name: leantime-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
