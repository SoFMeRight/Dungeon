apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: osticket-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: PLACEHOLDER_SECRET_STORE
    kind: ClusterSecretStore
  target:
    name: osticket-secrets
    creationPolicy: Owner
  data:
    - secretKey: MYSQL_ROOT_PASSWORD
      remoteRef:
        key: apps/osticket/mariadb
        property: ROOT_PASSWORD
    - secretKey: MYSQL_PASSWORD
      remoteRef:
        key: apps/osticket/mariadb
        property: PASSWORD
    - secretKey: DB_PASS
      remoteRef:
        key: apps/osticket/mariadb
        property: PASSWORD
    - secretKey: SMTP_FROM
      remoteRef:
        key: apps/osticket/smtp
        property: FROM
    - secretKey: SMTP_HOST
      remoteRef:
        key: apps/osticket/smtp
        property: HOST
    - secretKey: SMTP_PORT
      remoteRef:
        key: apps/osticket/smtp
        property: PORT
    - secretKey: SMTP_USER
      remoteRef:
        key: apps/osticket/smtp
        property: USER
    - secretKey: SMTP_PASSWORD
      remoteRef:
        key: apps/osticket/smtp
        property: PASSWORD
    - secretKey: INSTALL_SECRET
      remoteRef:
        key: apps/osticket/app
        property: INSTALL_SECRET
    - secretKey: INSTALL_EMAIL
      remoteRef:
        key: apps/osticket/app
        property: INSTALL_EMAIL
    - secretKey: ADMIN_EMAIL
      remoteRef:
        key: apps/osticket/app
        property: ADMIN_EMAIL
    - secretKey: ADMIN_USER
      remoteRef:
        key: apps/osticket/app
        property: ADMIN_USER
    - secretKey: ADMIN_PASS
      remoteRef:
        key: apps/osticket/app
        property: ADMIN_PASS
