# Backup-only key on the NAS object store; never the app's credential.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: osticket-mariadb-backup-s3
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: PLACEHOLDER_SECRET_STORE
    kind: ClusterSecretStore
  target:
    name: osticket-mariadb-backup-s3
    creationPolicy: Owner
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: apps/osticket/s3-gringotts
        property: ACCESS_KEY
    - secretKey: SECRET_ACCESS_KEY
      remoteRef:
        key: apps/osticket/s3-gringotts
        property: SECRET_KEY
