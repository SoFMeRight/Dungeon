apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Generates ConfigMap 'sync-release-artifacts' (the release-sync playbook) for
# consumers to mount; carried into a consumer via its resources, not deployed
# on its own.
configMapGenerator:
  - name: sync-release-artifacts
    files:
      - sync.yml
      - artifact.yml
