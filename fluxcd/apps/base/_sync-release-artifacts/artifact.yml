---
# One release artifact `a`.
# Sources (a.source):
#   github-release (default) — a.repo owner/name, a.tag; the asset is a.asset (exact name,
#     {version} substituted) or the first asset whose name matches the regex a.asset_match.
#     version "latest" follows the repo's latest release (rolling projects); a changed
#     published digest is what triggers the update.
#   gitlab-package — a GitLab generic package: a.repo group/project, a.package (package
#     name), version a.version, file a.asset; digest is the package file's sha256.
#   pinned — a.url ({version} substituted; https:// or file://) verified against a.sha256
#     pinned in the spec, for sources that publish no digest or no longer exist upstream.
# Placement (native modules, extraction via argv commands; no shell): layout raw|tar|zip (default tar).
#   raw   the file itself to a.dest, a.mode (default 0644).
#   tar   the image's tar (gzip/xz/bzip2 detected); a.strip leading path components.
#   zip   the image's unzip.
#   a.subdir selects a directory inside the archive; a.include basename globs at its top level
#   (default: everything); a.executables basename globs anywhere under a.dest made 0755.
- name: "reconcile {{ a.name }} {{ a.version }}"
  vars:
    _src: "{{ a.source | default('github-release') }}"
    _tag: "{{ (a.tag | default('{version}')) | replace('{version}', a.version) }}"
    _asset: "{{ (a.asset | default('')) | replace('{version}', a.version) }}"
    _layout: "{{ a.layout | default('tar') }}"
    _marker: "{{ (a.dest ~ '.artifact-digest') if (a.layout | default('tar')) == 'raw' else (a.dest ~ '/.artifact-digest') }}"
    _vmark: "{{ (a.dest ~ '.artifact-version') if (a.layout | default('tar')) == 'raw' else (a.dest ~ '/.artifact-version') }}"
    _stage: "/tmp/sra-{{ a.name }}"
    _glapi: "https://gitlab.com/api/v4/projects/{{ (a.repo | default('')) | replace('/', '%2F') }}"
  block:
    - name: "{{ a.name }}: resolve release metadata"
      when: _src == 'github-release'
      ansible.builtin.uri:
        url: "https://api.github.com/repos/{{ a.repo }}/releases/{{ 'latest' if a.version == 'latest' else ('tags/' ~ _tag) }}"
        headers:
          Accept: application/vnd.github+json
        return_content: true
      register: _rel

    - name: "{{ a.name }}: pick published digest + download url"
      when: _src == 'github-release'
      vars:
        _cand: >-
          {{ (_rel.json.assets | selectattr('name', 'match', a.asset_match) | list)
             if a.asset_match is defined
             else (_rel.json.assets | selectattr('name', 'equalto', _asset) | list) }}
      ansible.builtin.set_fact:
        _pub: "{{ _cand | map(attribute='digest') | select('string') | list | first | default('') }}"
        _url: "{{ _cand | map(attribute='browser_download_url') | list | first | default('') }}"

    - name: "{{ a.name }}: resolve package {{ a.package | default('') }} {{ a.version }}"
      when: _src == 'gitlab-package'
      ansible.builtin.uri:
        url: "{{ _glapi }}/packages?package_type=generic&package_name={{ a.package }}&package_version={{ a.version }}"
        return_content: true
      register: _pkg

    - name: "{{ a.name }}: list package files"
      when: _src == 'gitlab-package'
      ansible.builtin.uri:
        url: "{{ _glapi }}/packages/{{ (_pkg.json | selectattr('name', 'equalto', a.package) | first).id }}/package_files?per_page=100"
        return_content: true
      register: _pkgf

    - name: "{{ a.name }}: pick package file digest + download url"
      when: _src == 'gitlab-package'
      vars:
        _sha: "{{ _pkgf.json | selectattr('file_name', 'equalto', _asset) | map(attribute='file_sha256') | select('string') | list | last | default('') }}"
      ansible.builtin.set_fact:
        _pub: "{{ ('sha256:' ~ _sha) if _sha | length == 64 else '' }}"
        _url: "{{ (_glapi ~ '/packages/generic/' ~ a.package ~ '/' ~ a.version ~ '/' ~ _asset) if _sha | length == 64 else '' }}"

    - name: "{{ a.name }}: take the pinned digest + url"
      when: _src == 'pinned'
      ansible.builtin.set_fact:
        _pub: "{{ ('sha256:' ~ (a.sha256 | string)) if (a.sha256 | default('') | string) | length == 64 else '' }}"
        _url: "{{ (a.url | default('')) | replace('{version}', a.version) }}"

    - name: "{{ a.name }}: require a published sha256 digest + url"
      ansible.builtin.assert:
        that:
          - "_pub is string and _pub.startswith('sha256:')"
          - "_url | length > 0"
          - "_layout in ['raw', 'tar', 'zip']"
        fail_msg: "no sha256-digested asset '{{ a.asset_match | default(_asset) }}' on {{ _src }} {{ _tag }}, or unknown layout '{{ _layout }}'"
        quiet: true

    - name: "{{ a.name }}: read cached digest marker"
      ansible.builtin.slurp:
        src: "{{ _marker }}"
      register: _m
      failed_when: false

    - name: "{{ a.name }}: already current"
      ansible.builtin.debug:
        msg: "{{ a.name }} {{ a.version }} current ({{ _pub }}) - skipping"
      when: "(_m.content | default('') | b64decode) == _pub"

    - name: "{{ a.name }}: fetch, verify, place"
      when: "(_m.content | default('') | b64decode) != _pub"
      block:
        - name: "{{ a.name }}: reset staging dir"
          ansible.builtin.file:
            path: "{{ _stage }}"
            state: absent
        - name: "{{ a.name }}: create staging dir"
          ansible.builtin.file:
            path: "{{ _stage }}"
            state: directory
            mode: "0755"

        - name: "{{ a.name }}: download + verify against published digest (fail-closed)"
          ansible.builtin.get_url:
            url: "{{ _url }}"
            dest: "{{ _stage }}/asset"
            checksum: "{{ _pub if (a.verify | default('github-digest')) != 'none' else omit }}"
            force: true
            mode: "0644"

        - name: "{{ a.name }}: place the file (raw)"
          when: _layout == 'raw'
          block:
            - name: "{{ a.name }}: ensure the destination directory"
              ansible.builtin.file:
                path: "{{ a.dest | dirname }}"
                state: directory
                mode: "0755"
            - name: "{{ a.name }}: place {{ a.dest }}"
              ansible.builtin.copy:
                src: "{{ _stage }}/asset"
                dest: "{{ a.dest }}"
                remote_src: true
                mode: "{{ a.mode | default('0644') }}"

        - name: "{{ a.name }}: unpack, select, place (tar|zip)"
          when: _layout in ['tar', 'zip']
          vars:
            _work: "{{ _stage }}/x"
            _root: "{{ _work ~ (('/' ~ a.subdir) if a.subdir is defined else '') }}"
          block:
            # strip unwraps leading directory levels; GNU tar does it at extraction, and
            # zip archives carry no such option.
            - name: "{{ a.name }}: reject strip on a zip"
              ansible.builtin.assert:
                that: "_layout == 'tar' or (a.strip | default(0) | int) == 0"
                fail_msg: "strip is supported for tar archives only"
                quiet: true
            - name: "{{ a.name }}: create the extraction dir"
              ansible.builtin.file:
                path: "{{ _work }}"
                state: directory
                mode: "0755"
            # The image's busybox tar/unzip, invoked as argv (no shell); unarchive needs GNU tar
            # and Info-ZIP's zipinfo, which the image does not ship.
            - name: "{{ a.name }}: extract"
              ansible.builtin.command:
                argv: >-
                  {{ (['tar', '-xf', _stage ~ '/asset', '-C', _work]
                      + (['--strip-components=' ~ (a.strip | int)] if (a.strip | default(0) | int) > 0 else []))
                     if _layout == 'tar'
                     else ['unzip', '-q', '-o', _stage ~ '/asset', '-d', _work] }}
              changed_when: true
            - name: "{{ a.name }}: reset {{ a.dest }}"
              ansible.builtin.file:
                path: "{{ a.dest }}"
                state: absent
            - name: "{{ a.name }}: create {{ a.dest }}"
              ansible.builtin.file:
                path: "{{ a.dest }}"
                state: directory
                mode: "0755"
            - name: "{{ a.name }}: place the whole extraction"
              when: a.include is not defined
              ansible.builtin.copy:
                src: "{{ _root }}/"
                dest: "{{ a.dest }}/"
                remote_src: true
            # include: basename globs matched at the top level of the extraction
            - name: "{{ a.name }}: find the included entries"
              when: a.include is defined
              ansible.builtin.find:
                paths: "{{ _root }}"
                patterns: "{{ a.include }}"
                file_type: any
              register: _incl
            - name: "{{ a.name }}: place the included entries"
              when: a.include is defined
              ansible.builtin.copy:
                src: "{{ item.path ~ ('/' if item.isdir else '') }}"
                dest: "{{ a.dest }}/{{ item.path | basename }}{{ '/' if item.isdir else '' }}"
                remote_src: true
              loop: "{{ _incl.files }}"
              loop_control:
                label: "{{ item.path | basename }}"
            # executables: basename globs matched anywhere under dest
            - name: "{{ a.name }}: find the executables"
              when: a.executables is defined
              ansible.builtin.find:
                paths: "{{ a.dest }}"
                patterns: "{{ a.executables }}"
                recurse: true
              register: _exe
            - name: "{{ a.name }}: mark them executable"
              when: a.executables is defined
              ansible.builtin.file:
                path: "{{ item.path }}"
                mode: "0755"
              loop: "{{ _exe.files }}"
              loop_control:
                label: "{{ item.path | basename }}"

        - name: "{{ a.name }}: write digest + version markers"
          ansible.builtin.copy:
            dest: "{{ item.p }}"
            content: "{{ item.c }}"
            mode: "0644"
          loop:
            - p: "{{ _marker }}"
              c: "{{ _pub }}"
            - p: "{{ _vmark }}"
              c: "{{ a.version }}"

        - name: "{{ a.name }}: installed"
          ansible.builtin.debug:
            msg: "{{ a.name }} {{ a.version }} installed & verified ({{ _pub }})"
  rescue:
    - name: "{{ a.name }}: keep cached copy on failure"
      ansible.builtin.debug:
        msg: "WARN {{ a.name }} {{ a.version }}: {{ ansible_failed_result.msg | default('reconcile failed') }} - keeping cached copy"
