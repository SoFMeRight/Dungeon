# Reads only netbox's entries, as its server ServiceAccount.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-netbox
spec:
  provider:
    vault:
      server: "http://openbao.optcp-secrets.svc.cluster.local:8200"
      path: "optcp"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "netbox"
          serviceAccountRef:
            name: netbox-server
