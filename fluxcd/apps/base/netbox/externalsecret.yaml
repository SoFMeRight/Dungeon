apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbox-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-netbox
    kind: SecretStore
  target:
    name: netbox-secrets
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: apps/netbox/postgres
        property: USER
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: apps/netbox/postgres
        property: PASSWORD
    - secretKey: DB_USER
      remoteRef:
        key: apps/netbox/postgres
        property: USER
    - secretKey: DB_PASSWORD
      remoteRef:
        key: apps/netbox/postgres
        property: PASSWORD
    - secretKey: SUPERUSER_USERNAME
      remoteRef:
        key: apps/netbox/app
        property: SUPERUSER_USERNAME
    - secretKey: SUPERUSER_EMAIL
      remoteRef:
        key: apps/netbox/app
        property: SUPERUSER_EMAIL
    - secretKey: SUPERUSER_PASSWORD
      remoteRef:
        key: apps/netbox/app
        property: SUPERUSER_PASSWORD
    - secretKey: OIDC_CLIENT_ID
      remoteRef:
        key: apps/netbox/oidc
        property: CLIENT_ID
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: apps/netbox/oidc
        property: CLIENT_SECRET
