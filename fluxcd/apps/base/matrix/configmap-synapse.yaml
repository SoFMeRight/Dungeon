apiVersion: v1
kind: ConfigMap
metadata:
  name: matrix-synapse-config
data:
  homeserver.yaml: |
    # The server name is the identity half of every user ID and is baked into every room
    # and event once federated. It is the apex, while the software answers on a subdomain
    # the apex delegates to via /.well-known/matrix/server.
    server_name: PLACEHOLDER_SERVER_NAME
    public_baseurl: PLACEHOLDER_PUBLIC_BASEURL
    pid_file: /data/homeserver.pid
    signing_key_path: /data/signing.key
    report_stats: false

    listeners:
      - port: 8008
        tls: false
        type: http
        # TLS terminates at the gateway, so the client address arrives in a header.
        x_forwarded: true
        bind_addresses: ['0.0.0.0']
        resources:
          - names: [client, federation]
            compress: false

    media_store_path: /media
    max_upload_size: PLACEHOLDER_MAX_UPLOAD_SIZE

    # Accounts are created through MAS, never here.
    enable_registration: false
    password_config:
      enabled: false

    # Delegated authentication (MSC3861): MAS owns login, sessions and account
    # management. Element X will not talk to a homeserver without it.
    experimental_features:
      msc3861:
        enabled: true
        issuer: PLACEHOLDER_MAS_ISSUER
        client_id: 0000000000000000000SYNAPSE
        client_auth_method: client_secret_basic
        account_management_url: PLACEHOLDER_MAS_ACCOUNT_URL

    trusted_key_servers:
      - server_name: "matrix.org"

    log_config: /config/log.yaml
  log.yaml: |
    version: 1
    formatters:
      precise:
        format: '%(asctime)s - %(name)s - %(lineno)d - %(levelname)s - %(request)s - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: precise
    loggers:
      synapse.storage.SQL:
        level: INFO
    root:
      level: INFO
      handlers: [console]
    disable_existing_loggers: false
