apiVersion: v1
kind: ConfigMap
metadata:
  name: matrix-synapse-config
data:
  # Values that differ per deployment — server name, public URL, MAS endpoints, media
  # backend — are NOT here. Synapse merges every file in the conf.d directory it is
  # given, so those live in their own file and this one stays deployment-agnostic.
  homeserver.yaml: |
    pid_file: /data/homeserver.pid
    signing_key_path: /data/signing.key
    report_stats: false

    listeners:
      - port: 8008
        tls: false
        type: http
        # TLS terminates at the gateway, so the client address arrives in a header.
        x_forwarded: true
        bind_addresses: ['0.0.0.0']
        resources:
          - names: [client, federation]
            compress: false

    # Accounts are created through MAS, never here.
    enable_registration: false
    password_config:
      enabled: false

    # Delegated authentication (MSC3861): MAS owns login, sessions and account
    # management. Element X will not talk to a homeserver without it.
    experimental_features:
      msc3861:
        enabled: true
        client_id: 0000000000000000000SYNAPSE
        client_auth_method: client_secret_basic

    trusted_key_servers:
      - server_name: "matrix.org"

    log_config: /config/log.yaml
  log.yaml: |
    version: 1
    formatters:
      precise:
        format: '%(asctime)s - %(name)s - %(lineno)d - %(levelname)s - %(request)s - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: precise
    loggers:
      synapse.storage.SQL:
        level: INFO
    root:
      level: INFO
      handlers: [console]
    disable_existing_loggers: false
