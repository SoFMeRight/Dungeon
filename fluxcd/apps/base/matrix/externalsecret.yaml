apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: matrix-postgres-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: PLACEHOLDER_SECRET_STORE
    kind: ClusterSecretStore
  target:
    name: matrix-postgres-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: apps/matrix
        property: POSTGRES_USER
    - secretKey: password
      remoteRef:
        key: apps/matrix
        property: POSTGRES_PASSWORD
---
# Synapse has no environment-variable configuration: everything is YAML. The values that
# must not sit in a ConfigMap are rendered into a conf.d fragment here, which Synapse
# reads alongside the main config.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: matrix-synapse-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: PLACEHOLDER_SECRET_STORE
    kind: ClusterSecretStore
  target:
    name: matrix-synapse-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        secrets.yaml: |
          macaroon_secret_key: "{{ .macaroon_secret }}"
          form_secret: "{{ .form_secret }}"
          database:
            name: psycopg2
            args:
              user: "{{ .db_user }}"
              password: "{{ .db_password }}"
              dbname: synapse
              host: matrix-postgres-rw
              port: 5432
              cp_min: 5
              cp_max: 10
          experimental_features:
            msc3861:
              client_secret: "{{ .mas_shared_secret }}"
              admin_token: "{{ .mas_admin_token }}"
  data:
    - secretKey: db_user
      remoteRef:
        key: apps/matrix
        property: POSTGRES_USER
    - secretKey: db_password
      remoteRef:
        key: apps/matrix
        property: POSTGRES_PASSWORD
    - secretKey: macaroon_secret
      remoteRef:
        key: apps/matrix
        property: SYNAPSE_MACAROON_SECRET
    - secretKey: form_secret
      remoteRef:
        key: apps/matrix
        property: SYNAPSE_FORM_SECRET
    # Shared with MAS: Synapse authenticates to it as an OAuth client, and uses the admin
    # token for the provisioning API.
    - secretKey: mas_shared_secret
      remoteRef:
        key: apps/matrix
        property: MAS_SYNAPSE_SHARED_SECRET
    - secretKey: mas_admin_token
      remoteRef:
        key: apps/matrix
        property: MAS_SYNAPSE_ADMIN_TOKEN
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: matrix-auth-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: PLACEHOLDER_SECRET_STORE
    kind: ClusterSecretStore
  target:
    name: matrix-auth-secrets
    creationPolicy: Owner
  data:
    - secretKey: MAS_ENCRYPTION_KEY
      remoteRef:
        key: apps/matrix
        property: MAS_ENCRYPTION_KEY
    - secretKey: MAS_SYNAPSE_SHARED_SECRET
      remoteRef:
        key: apps/matrix
        property: MAS_SYNAPSE_SHARED_SECRET
    - secretKey: MAS_SYNAPSE_ADMIN_TOKEN
      remoteRef:
        key: apps/matrix
        property: MAS_SYNAPSE_ADMIN_TOKEN
    # Zitadel application backing "Login with PrPlanIT" on Matrix.
    - secretKey: OIDC_CLIENT_ID
      remoteRef:
        key: apps/matrix
        property: OIDC_CLIENT_ID
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: apps/matrix
        property: OIDC_CLIENT_SECRET
