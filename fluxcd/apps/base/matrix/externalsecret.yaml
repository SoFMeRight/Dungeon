apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: matrix-postgres-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: PLACEHOLDER_SECRET_STORE
    kind: ClusterSecretStore
  target:
    name: matrix-postgres-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: apps/matrix-synapse
        property: POSTGRES_USER
    - secretKey: password
      remoteRef:
        key: apps/matrix-synapse
        property: POSTGRES_PASSWORD
---
# Synapse has no environment-variable configuration: everything is YAML. The values that
# must not sit in a ConfigMap are rendered into a conf.d fragment here, which Synapse
# reads alongside the main config.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: matrix-synapse-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: PLACEHOLDER_SECRET_STORE
    kind: ClusterSecretStore
  target:
    name: matrix-synapse-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        secrets.yaml: |
          macaroon_secret_key: "{{ .macaroon_secret }}"
          form_secret: "{{ .form_secret }}"
          # Synapse performs no environment substitution on its YAML, so the S3
          # credentials can only reach it through a rendered file.
          media_storage_providers:
            - module: s3_storage_provider.S3StorageProviderBackend
              store_local: true
              store_remote: true
              store_synchronous: true
              config:
                bucket: "{{ .s3_bucket }}"
                # The service port, not the pod port: RGW answers on 80 here. Using 8080
                # breaks writes only, so uploads fail while reads look healthy.
                endpoint_url: "http://ceph-rgw.gorons-bracelet.svc.cluster.local:80"
                access_key_id: "{{ .s3_access_key }}"
                secret_access_key: "{{ .s3_secret_key }}"
          database:
            name: psycopg2
            args:
              user: "{{ .db_user }}"
              password: "{{ .db_password }}"
              dbname: synapse
              host: matrix-postgres-rw
              port: 5432
              cp_min: 5
              cp_max: 10
          matrix_authentication_service:
            secret: "{{ .mas_admin_token }}"
  data:
    - secretKey: db_user
      remoteRef:
        key: apps/matrix-synapse
        property: POSTGRES_USER
    - secretKey: db_password
      remoteRef:
        key: apps/matrix-synapse
        property: POSTGRES_PASSWORD
    # Media lives in Ceph RGW; credentials follow the estate's rgw/<app> convention.
    - secretKey: s3_bucket
      remoteRef:
        key: rgw/matrix-synapse
        property: S3_BUCKET
    - secretKey: s3_access_key
      remoteRef:
        key: rgw/matrix-synapse
        property: S3_ACCESS_KEY
    - secretKey: s3_secret_key
      remoteRef:
        key: rgw/matrix-synapse
        property: S3_SECRET_KEY
    - secretKey: macaroon_secret
      remoteRef:
        key: apps/matrix-synapse
        property: SYNAPSE_MACAROON_SECRET
    - secretKey: form_secret
      remoteRef:
        key: apps/matrix-synapse
        property: SYNAPSE_FORM_SECRET
    # Shared with MAS: Synapse authenticates to it as an OAuth client, and uses the admin
    # token for the provisioning API.
    - secretKey: mas_shared_secret
      remoteRef:
        key: apps/matrix-synapse
        property: MAS_SYNAPSE_SHARED_SECRET
    - secretKey: mas_admin_token
      remoteRef:
        key: apps/matrix-synapse
        property: MAS_SYNAPSE_ADMIN_TOKEN
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: matrix-auth-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: PLACEHOLDER_SECRET_STORE
    kind: ClusterSecretStore
  target:
    name: matrix-auth-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Merged with the ConfigMap by passing both to mas-cli. Everything here would be a
        # credential in a ConfigMap otherwise.
        secrets.yaml: |
          database:
            uri: "postgresql://{{ .db_user }}:{{ .db_password }}@matrix-postgres-rw:5432/mas"
          secrets:
            encryption: "{{ .encryption_key }}"
            keys:
              - kid: rsa
                key: |{{ .key_rsa | nindent 18 }}
              - kid: ec
                key: |{{ .key_ec | nindent 18 }}
          matrix:
            secret: "{{ .synapse_admin_token }}"
          clients:
            # Synapse authenticates to MAS as this client to delegate login (MSC3861).
            - client_id: 0000000000000000000SYNAPSE
              client_auth_method: client_secret_basic
              client_secret: "{{ .synapse_shared_secret }}"
          upstream_oauth2:
            providers:
              - id: "{{ .upstream_id }}"
                issuer: "https://sso.prplanit.com"
                human_name: PrPlanIT SSO
                client_id: "{{ .oidc_client_id }}"
                client_secret: "{{ .oidc_client_secret }}"
                token_endpoint_auth_method: client_secret_basic
                scope: "openid email profile"
                # Zitadel returns preferred_username in the userinfo response rather than
                # the ID token. Without this the claim arrives empty, MAS cannot derive a
                # localpart, and the link step fails with a 500 after an otherwise
                # successful sign-in.
                fetch_userinfo: true
                claims_imports:
                  localpart:
                    action: require
                    template: "{{`{{ user.preferred_username }}`}}"
                  displayname:
                    action: suggest
                    template: "{{`{{ user.name }}`}}"
                  email:
                    action: suggest
                    template: "{{`{{ user.email }}`}}"
  data:
    - secretKey: db_user
      remoteRef:
        key: apps/matrix-synapse
        property: POSTGRES_USER
    - secretKey: db_password
      remoteRef:
        key: apps/matrix-synapse
        property: POSTGRES_PASSWORD
    - secretKey: encryption_key
      remoteRef:
        key: apps/matrix-synapse
        property: MAS_ENCRYPTION_KEY
    - secretKey: key_rsa
      remoteRef:
        key: apps/matrix-synapse
        property: MAS_KEY_RSA
    - secretKey: key_ec
      remoteRef:
        key: apps/matrix-synapse
        property: MAS_KEY_EC
    - secretKey: synapse_shared_secret
      remoteRef:
        key: apps/matrix-synapse
        property: MAS_SYNAPSE_SHARED_SECRET
    - secretKey: synapse_admin_token
      remoteRef:
        key: apps/matrix-synapse
        property: MAS_SYNAPSE_ADMIN_TOKEN
    # The provider id is fixed because it appears in the callback URL Zitadel is told about.
    - secretKey: upstream_id
      remoteRef:
        key: apps/matrix-synapse
        property: MAS_UPSTREAM_ID
    # Zitadel application backing "Login with PrPlanIT" on Matrix.
    - secretKey: oidc_client_id
      remoteRef:
        key: apps/matrix-synapse
        property: OIDC_CLIENT_ID
    - secretKey: oidc_client_secret
      remoteRef:
        key: apps/matrix-synapse
        property: OIDC_CLIENT_SECRET
