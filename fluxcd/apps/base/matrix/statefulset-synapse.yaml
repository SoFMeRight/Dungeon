apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: matrix-synapse
  labels:
    app: matrix-synapse
  annotations:
    # conf.d is a PROJECTED volume combining a Secret and a ConfigMap, plus a separate
    # Secret for the appservice registration. Projected sources are the less-exercised
    # path in Reloader; if it does not walk into them this annotation is inert, which
    # is exactly the shape of failure worth proving rather than assuming.
    secret.reloader.stakater.com/reload: matrix-synapse-secrets,matrix-synapse-appservices
    configmap.reloader.stakater.com/reload: matrix-synapse-site,matrix-synapse-config
spec:
  serviceName: matrix-synapse
  replicas: 1
  selector:
    matchLabels:
      app: matrix-synapse
  template:
    metadata:
      labels:
        app: matrix-synapse
        policy.prplanit.com/ingress: "true"
        policy.prplanit.com/cap.postgres: "true"
        policy.prplanit.com/access-scope-postgres: PLACEHOLDER_DB_SCOPE
    spec:
      serviceAccountName: matrix-synapse
      securityContext:
        runAsNonRoot: true
        runAsUser: 991
        runAsGroup: 991
        fsGroup: 991
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: synapse
          image: PLACEHOLDER_SYNAPSE_IMAGE
          # The image's entrypoint generates a config when none exists. Ours is supplied,
          # so synapse is invoked directly: the second path is a directory, which is how
          # the vault-rendered secrets join the config without being in a ConfigMap.
          command:
            - python
            - -m
            - synapse.app.homeserver
            - --config-path
            - /config/homeserver.yaml
            - --config-path
            - /config/conf.d/
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8008
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          volumeMounts:
            - name: config
              mountPath: /config/homeserver.yaml
              subPath: homeserver.yaml
              readOnly: true
            - name: config
              mountPath: /config/log.yaml
              subPath: log.yaml
              readOnly: true
            - name: secrets
              mountPath: /config/conf.d
              readOnly: true
            # Application service registrations are NOT homeserver config: everything in
            # conf.d is parsed as such, so they get their own directory and are named by
            # app_service_config_files instead.
            - name: appservices
              mountPath: /config/appservices
              readOnly: true
            # The signing key is this server's identity to the rest of the federation.
            # Losing it is not recoverable: remote servers reject events signed by a
            # replacement, so it lives on a Retain volume.
            - name: data
              mountPath: /data
            - name: media
              mountPath: /media
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              memory: "2Gi"
      volumes:
        - name: config
          configMap:
            name: matrix-synapse-config
        # conf.d is a merge point: the vault-rendered secrets and the deployment's own
        # site config are different objects that have to land in one directory.
        - name: secrets
          projected:
            sources:
              - secret:
                  name: matrix-synapse-secrets
              - configMap:
                  name: matrix-synapse-site
        - name: appservices
          secret:
            secretName: matrix-synapse-appservices
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: PLACEHOLDER_STORAGE_CLASS
        resources:
          requests:
            storage: PLACEHOLDER_DATA_SIZE
    - metadata:
        name: media
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: PLACEHOLDER_STORAGE_CLASS
        resources:
          requests:
            storage: PLACEHOLDER_MEDIA_SIZE
