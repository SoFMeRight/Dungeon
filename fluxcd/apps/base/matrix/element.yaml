apiVersion: v1
kind: ConfigMap
metadata:
  name: matrix-element-config
data:
  config.json: |
    {
      "default_server_config": {
        "m.homeserver": {
          "base_url": "PLACEHOLDER_PUBLIC_BASEURL",
          "server_name": "PLACEHOLDER_SERVER_NAME"
        }
      },
      "brand": "PLACEHOLDER_BRAND",
      "disable_custom_urls": true,
      "disable_guests": true,
      "default_country_code": "US",
      "show_labs_settings": false,
      "room_directory": {
        "servers": ["PLACEHOLDER_SERVER_NAME"]
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matrix-element
  labels:
    app: matrix-element
spec:
  replicas: PLACEHOLDER_ELEMENT_REPLICAS
  selector:
    matchLabels:
      app: matrix-element
  template:
    metadata:
      labels:
        app: matrix-element
        policy.prplanit.com/ingress: "true"
    spec:
      serviceAccountName: matrix-element
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: element
          image: PLACEHOLDER_ELEMENT_IMAGE
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /config.json
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            # Element is a static bundle; the only thing that varies per deployment is
            # which homeserver it points at.
            - name: config
              mountPath: /app/config.json
              subPath: config.json
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "10m"
              memory: "64Mi"
            limits:
              memory: "256Mi"
      volumes:
        - name: config
          configMap:
            name: matrix-element-config
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
