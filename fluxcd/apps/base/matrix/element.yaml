apiVersion: apps/v1
kind: Deployment
metadata:
  name: matrix-element
  labels:
    app: matrix-element
spec:
  replicas: PLACEHOLDER_ELEMENT_REPLICAS
  selector:
    matchLabels:
      app: matrix-element
  template:
    metadata:
      labels:
        app: matrix-element
        policy.prplanit.com/ingress: "true"
    spec:
      serviceAccountName: matrix-element
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: element
          image: PLACEHOLDER_ELEMENT_IMAGE
          env:
            # The image's nginx template binds this, defaulting to 80 — which an
            # unprivileged process cannot bind.
            - name: ELEMENT_WEB_PORT
              value: "8080"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /config.json
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            # Element is a static bundle; the only thing that varies per deployment is
            # which homeserver it points at.
            - name: config
              mountPath: /app/config.json
              subPath: config.json
              readOnly: true
            # The image's entrypoint renders its nginx config from a template at startup,
            # so this one directory has to be writable for the root filesystem to stay
            # read-only everywhere else.
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "10m"
              memory: "64Mi"
            limits:
              memory: "256Mi"
      volumes:
        - name: config
          configMap:
            name: matrix-element-config
        - name: nginx-conf
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
