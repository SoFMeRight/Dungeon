# The MatrixRTC Authorization Service: it trades a Matrix OpenID token for a LiveKit
# JWT, which is what stops anyone who can reach the SFU from joining any call.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matrix-lk-jwt
  labels:
    app: matrix-lk-jwt
spec:
  replicas: 2
  selector:
    matchLabels:
      app: matrix-lk-jwt
  template:
    metadata:
      labels:
        app: matrix-lk-jwt
        policy.prplanit.com/ingress: "true"
    spec:
      serviceAccountName: matrix-lk-jwt
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: lk-jwt
          image: PLACEHOLDER_LK_JWT_IMAGE
          env:
            - name: LIVEKIT_JWT_BIND
              value: ":8080"
          envFrom:
            - secretRef:
                name: matrix-lk-jwt-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              memory: "128Mi"
