apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: urbackup-server
spec:
  revisionHistoryLimit: 5
  serviceName: urbackup-server
  replicas: PLACEHOLDER_REPLICAS
  selector:
    matchLabels:
      app: urbackup-server
  template:
    metadata:
      labels:
        app: urbackup-server
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: urbackup-server
          image: PLACEHOLDER_IMAGE
          # Backup server: stays root to store client files preserving arbitrary ownership.
          # Partial ceiling: drop ALL + file-ownership caps (CHOWN/DAC_OVERRIDE/FOWNER) + the
          # privilege-drop caps (SETUID/SETGID) + no-privesc. non-root/RO-root left off (writes
          # arbitrary-owner files + hostNetwork). (Undeployed/frozen — verify on resurrection.)
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - SETUID
                - SETGID
          ports:
            - containerPort: 55414
              name: urbackup
              protocol: TCP
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: PLACEHOLDER_TZ
          volumeMounts:
            - name: fairy-bottle-urbackup-data
              mountPath: /var/urbackup
            - name: fairy-bottle-urbackup-backups
              mountPath: /backups
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 4Gi
  volumeClaimTemplates:
    - metadata:
        name: fairy-bottle-urbackup-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: PLACEHOLDER_STORAGE_CLASS
        resources:
          requests:
            storage: 10Gi
    - metadata:
        name: fairy-bottle-urbackup-backups
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: PLACEHOLDER_STORAGE_CLASS
        resources:
          requests:
            storage: 500Gi
