apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud
spec:
  releaseName: nextcloud
  interval: 30m
  chart:
    spec:
      chart: nextcloud
      sourceRef:
        kind: HelmRepository
        name: nextcloud
  # Migrating the data took longer than the five-minute default on 34.0.3 ->
  # 34.0.4, and the deadline it missed is what set the whole failure going.
  timeout: 20m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      # No rollback. Nextcloud writes its new version into the data on upgrade and
      # then refuses to start on an older image -- "the version of the data is
      # higher than the docker image version, and downgrading is not supported".
      # So rolling back is an operation that cannot succeed, and after the timeout
      # above Flux attempted one every fifteen minutes for nine days while two of
      # three pods sat in CrashLoopBackOff.
      #
      # A failed upgrade now stays failed and visible, which is the honest state
      # and the one the Deployment stuck alert reports.
      retries: 0
  values:
    fullnameOverride: "nextcloud"

    rbac:
      enabled: true
      serviceaccount:
        create: true
        name: nextcloud

    image:
      repository: library/nextcloud
      flavor: apache

    nextcloud:
      host: PLACEHOLDER_HOST
      existingSecret:
        enabled: true
        secretName: nextcloud-secrets
        usernameKey: NEXTCLOUD_ADMIN_USER
        passwordKey: NEXTCLOUD_ADMIN_PASSWORD
        smtpUsernameKey: SMTP_NAME
        smtpPasswordKey: SMTP_PASSWORD
        smtpHostKey: SMTP_HOST

      mail:
        enabled: false

      trustedDomains: []

      objectStore:
        s3:
          enabled: false

      strategy:
        type: Recreate

    # Disable all bundled databases — external only
    internalDatabase:
      enabled: false
    postgresql:
      enabled: false
    mariadb:
      enabled: false
    redis:
      enabled: false

    externalDatabase:
      enabled: true
      type: postgresql
      existingSecret:
        enabled: true
        secretName: nextcloud-secrets
        usernameKey: POSTGRES_USER
        passwordKey: POSTGRES_PASSWORD

    externalRedis:
      enabled: true
      existingSecret:
        enabled: true
        secretName: nextcloud-secrets
        passwordKey: REDIS_HOST_PASSWORD

    persistence:
      enabled: false

    cronjob:
      enabled: false

    startupProbe:
      enabled: true
      initialDelaySeconds: 30
      periodSeconds: 10
      failureThreshold: 30

    livenessProbe:
      enabled: true

    readinessProbe:
      enabled: true

    collabora:
      enabled: false
      serviceAccount:
        create: true
        name: nextcloud-collabora

    imaginary:
      enabled: false

    ingress:
      enabled: false
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: nextcloud-imaginary
            patch: |-
              - op: add
                path: /spec/template/spec/serviceAccountName
                value: nextcloud-imaginary
          - target:
              kind: Deployment
              name: nextcloud-collabora
            patch: |-
              - op: add
                path: /spec/template/spec/serviceAccountName
                value: nextcloud-collabora
