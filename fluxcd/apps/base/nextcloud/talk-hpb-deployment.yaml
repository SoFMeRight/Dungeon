apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-talk-hpb
  labels:
    app: nextcloud-talk-hpb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nextcloud-talk-hpb
  template:
    metadata:
      labels:
        app: nextcloud-talk-hpb
    spec:
      serviceAccountName: nextcloud-talk-hpb
      # The signaling image starts as root and su-exec-drops to its own user, so it can't run non-root.
      # Partial hardening: seccomp + drop ALL, adding back only SETUID/SETGID for the su-exec drop.
      # fsGroup 1000 makes the config emptyDir writable by the render-config init.
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: render-config
          image: docker.io/alpine/k8s:1.36.2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - sh
            - -c
            - |
              cp /template/server.conf /config/server.conf
              sed -i "s|PLACEHOLDER_HASH_KEY|${TALK_HPB_SECRET}|g" /config/server.conf
              sed -i "s|PLACEHOLDER_TALK_SECRET|${TALK_HPB_SECRET}|g" /config/server.conf
          env:
            - name: TALK_HPB_SECRET
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secrets
                  key: TALK_HPB_SECRET
          volumeMounts:
            - name: config-template
              mountPath: /template
              readOnly: true
            - name: config
              mountPath: /config
      containers:
        - name: signaling
          image: docker.io/strukturag/nextcloud-spreed-signaling:latest
          # Image starts root + su-exec-drops to its own user — needs SETUID/SETGID.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - SETUID
                - SETGID
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/v1/welcome
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/welcome
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: config-template
          configMap:
            name: nextcloud-talk-hpb-config
        - name: config
          emptyDir: {}
