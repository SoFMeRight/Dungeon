apiVersion: v1
kind: Service
metadata:
  name: nextcloud-notify-push
  labels:
    app: nextcloud-notify-push
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 7867
      targetPort: notify-push
      protocol: TCP
  # notify_push now runs as a sidecar in the nextcloud app pods (see the HelmRelease
  # extraSidecarContainers), so this Service targets those pods on the sidecar's :7867.
  selector:
    app.kubernetes.io/name: nextcloud
    app.kubernetes.io/component: app
