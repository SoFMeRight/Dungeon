# The archive as it stood before each cluster was given a bucket of its own. It is
# read from, never written to: the cluster archives to open-webui-postgres-store,
# and names this one only on the externalCluster it recovers from.
#
# It exists because a restored cluster may not continue writing the lineage it was
# restored from -- barman rejects an archive that already holds WAL -- so the
# source and the destination have to be two different places. Keeping the source
# where it already is means nothing has to be copied to restore.
#
# No retentionPolicy: pruning is the writer's job and nothing writes here. The
# objects age out under the bucket's own lock and lifecycle.
#
# Remove this once the archive below has aged past its object lock and no restore
# will want it again.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: open-webui-postgres-prior
spec:
  configuration:
    s3Credentials:
      accessKeyId:
        name: open-webui-postgres-backup-s3
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: open-webui-postgres-backup-s3
        key: SECRET_ACCESS_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
