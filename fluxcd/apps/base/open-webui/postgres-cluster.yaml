apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: open-webui-postgres
spec:
  instances: PLACEHOLDER_INSTANCES

  affinity:
    podAntiAffinityType: required

  postgresql:
    parameters:
      shared_buffers: "PLACEHOLDER_SHARED_BUFFERS"
      max_connections: "PLACEHOLDER_MAX_CONNECTIONS"
      max_slot_wal_keep_size: "800MB"

  # Restored from the object store rather than initialised empty. CNPG cannot shrink a
  # PVC in place, so reducing the volume means recreating the cluster, and recreating it
  # means bootstrapping from the archive. serverName names the lineage being read, which
  # is the cluster's own: the restore continues the same recovery window rather than
  # starting a new one.
  #
  # bootstrap.recovery does NOT enable archiving. The plugins stanza below is what keeps
  # the restored cluster shipping WAL; without it the restore comes up unarchived.
  bootstrap:
    recovery:
      source: open-webui-archive

  externalClusters:
    - name: open-webui-archive
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: open-webui-postgres-store
          serverName: open-webui-postgres

  storage:
    storageClass: PLACEHOLDER_STORAGE_CLASS
    size: PLACEHOLDER_STORAGE_SIZE
  # Archiving is done by the barman-cloud plugin, configured in the ObjectStore of
  # the same name. isWALArchiver makes this plugin the one that ships WAL; exactly
  # one plugin may claim it.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: open-webui-postgres-store
