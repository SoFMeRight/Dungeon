# Open WebUI's client sends the Redis password to the sentinels too
# (utils/redis.py build_sentinel_kwargs), so they require it, as gitlab's do.
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisSentinel
metadata:
  name: open-webui-sentinel
spec:
  clusterSize: 3
  serviceAccountName: open-webui-sentinel
  # One sentinel per node, so a single node loss cannot take two of the three votes.
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app: open-webui-sentinel-sentinel
          topologyKey: kubernetes.io/hostname
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    runAsNonRoot: true
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  kubernetesConfig:
    image: PLACEHOLDER_SENTINEL_IMAGE
    imagePullPolicy: IfNotPresent
    redisSecret:
      name: open-webui-redis-password
      key: password
    resources:
      requests:
        cpu: 17m
        memory: 15Mi
      limits:
        cpu: 200m
        memory: 80Mi
  redisSentinelConfig:
    redisReplicationName: open-webui-redis
    masterGroupName: open-webui-redis
    redisPort: "6379"
    quorum: "2"
    parallelSyncs: "1"
    failoverTimeout: "180000"
    downAfterMilliseconds: "30000"
    redisReplicationPassword:
      secretKeyRef:
        name: open-webui-redis-password
        key: password
