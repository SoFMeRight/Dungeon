apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
spec:
  revisionHistoryLimit: 5
  replicas: PLACEHOLDER_REPLICAS
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      # Hard spread: one replica per node (matches kimai) — survives node loss; a replica
      # stays Pending if fewer eligible nodes are free (acceptable on a 5-worker cluster).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: open-webui
      containers:
        - name: open-webui
          image: PLACEHOLDER_OPEN_WEBUI_IMAGE
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: open-webui-secrets
                  key: WEBUI_SECRET_KEY
            - name: DATABASE_URL
              value: "PLACEHOLDER_DATABASE_URL"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: open-webui-postgres-credentials
                  key: password
            - name: REDIS_URL
              value: "PLACEHOLDER_REDIS_URL"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: open-webui-redis-password
                  key: password
            - name: ENABLE_WEBSOCKET_SUPPORT
              value: "true"
            - name: WEBSOCKET_MANAGER
              value: "redis"
            - name: WEBSOCKET_REDIS_URL
              value: "PLACEHOLDER_WEBSOCKET_REDIS_URL"
            - name: OLLAMA_HOST
              value: "0.0.0.0"
            - name: OLLAMA_ORIGINS
              value: "*"
            - name: OLLAMA_BASE_URL
              value: ""
            - name: OLLAMA_BASE_URLS
              value: "PLACEHOLDER_OLLAMA_BASE_URLS"
            - name: AIOHTTP_CLIENT_TIMEOUT
              value: "600"
            - name: ENABLE_OAUTH_SIGNUP
              value: "true"
            - name: OAUTH_MERGE_ACCOUNTS_BY_EMAIL
              value: "true"
            - name: OAUTH_PROVIDER_NAME
              value: "PrPlanIT.com SSO"
            - name: OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: open-webui-secrets
                  key: OAUTH_CLIENT_ID
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: open-webui-secrets
                  key: OAUTH_CLIENT_SECRET
            - name: OPENID_PROVIDER_URL
              value: "PLACEHOLDER_OPENID_PROVIDER_URL"
            - name: OAUTH_SCOPES
              value: "openid email profile"
            - name: ENABLE_OAUTH_ROLE_MANAGEMENT
              value: "true"
            - name: OAUTH_ROLES_CLAIM
              value: "roles"
            - name: OAUTH_ALLOWED_ROLES
              value: "user"
            - name: OAUTH_ADMIN_ROLES
              value: "admin"
            - name: ENABLE_OAUTH_GROUP_MANAGEMENT
              value: "false"
            - name: OAUTH_GROUP_CLAIM
              value: "groups"
