apiVersion: v1
kind: ConfigMap
metadata:
  name: open-webui-redis-sentinel-config
  labels:
    app: open-webui-sentinel
data:
  sentinel.conf: |
    # Redis Sentinel configuration for Open WebUI
    port 26379
    dir /data

    # Must precede the `sentinel monitor` line the initContainer appends:
    # Sentinel rejects a hostname unless resolution is enabled first.
    sentinel resolve-hostnames yes
    sentinel announce-hostnames yes

    # Logging
    loglevel notice
    logfile ""
