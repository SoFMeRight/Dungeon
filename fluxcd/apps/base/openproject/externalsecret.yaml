apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openproject-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-optcp
  target:
    name: openproject-secret
    creationPolicy: Owner
    template:
      data:
        SECRET_KEY_BASE: "{{ .secretKeyBase }}"
        DATABASE_URL: "postgres://{{ .dbUser | urlquery }}:{{ .dbPassword | urlquery }}@openproject-postgres-rw:5432/openproject"
        OPENPROJECT_SEED__ADMIN__USER__PASSWORD: "{{ .adminPassword }}"
        OPENPROJECT_OPENID__CONNECT_PRPLANIT_IDENTIFIER: "{{ .oidcClientId }}"
        OPENPROJECT_OPENID__CONNECT_PRPLANIT_SECRET: "{{ .oidcClientSecret }}"
        OPENPROJECT_FOG_CREDENTIALS_AWS__ACCESS__KEY__ID: "{{ .s3AccessKey }}"
        OPENPROJECT_FOG_CREDENTIALS_AWS__SECRET__ACCESS__KEY: "{{ .s3SecretKey }}"
  data:
    - secretKey: secretKeyBase
      remoteRef:
        key: apps/openproject/app
        property: SECRET_KEY_BASE
    - secretKey: adminPassword
      remoteRef:
        key: apps/openproject/app
        property: ADMIN_PASSWORD
    - secretKey: dbUser
      remoteRef:
        key: apps/openproject/postgres
        property: USER
    - secretKey: dbPassword
      remoteRef:
        key: apps/openproject/postgres
        property: PASSWORD
    - secretKey: oidcClientId
      remoteRef:
        key: apps/openproject/oidc
        property: CLIENT_ID
    - secretKey: oidcClientSecret
      remoteRef:
        key: apps/openproject/oidc
        property: CLIENT_SECRET
    - secretKey: s3AccessKey
      remoteRef:
        key: apps/openproject/s3-optcp
        property: ACCESS_KEY
    - secretKey: s3SecretKey
      remoteRef:
        key: apps/openproject/s3-optcp
        property: SECRET_KEY
