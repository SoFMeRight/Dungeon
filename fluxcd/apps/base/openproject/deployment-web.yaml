apiVersion: apps/v1
kind: Deployment
metadata:
  name: openproject-web
  labels:
    app: openproject
    component: web
spec:
  revisionHistoryLimit: 5
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: openproject
      component: web
  template:
    metadata:
      labels:
        app: openproject
        component: web
    spec:
      serviceAccountName: openproject
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: openproject
                    component: web
      initContainers:
        # Ruby refuses a world-writable TMPDIR without the sticky bit, which an emptyDir lacks.
        - name: prepare-tmp
          image: docker.io/openproject/openproject:17.9.2-slim
          command: ["sh", "-c", "mkdir -p /tmp/ruby && chmod 1777 /tmp/ruby"]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        # The mesh accepts TCP before Postgres exists, so ask Postgres itself.
        - name: wait-for-db
          image: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
          command: ["sh", "-c", "until pg_isready -q -h openproject-postgres-rw -p 5432; do sleep 2; done"]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: web
          image: docker.io/openproject/openproject:17.9.2-slim
          args: ["/app/docker/prod/web"]
          envFrom:
            - configMapRef:
                name: openproject-env
            - secretRef:
                name: openproject-secret
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: app-tmp
              mountPath: /app/tmp
            - name: initializers
              mountPath: /app/config/initializers/zz_enterprise_features.rb
              subPath: enterprise-features.rb
              readOnly: true
            - name: initializers
              mountPath: /app/config/initializers/zz_color_themes.rb
              subPath: color-themes.rb
              readOnly: true
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # The health check answers 404 to a request addressed to the pod IP, hence the Host.
          startupProbe:
            httpGet:
              path: /health_checks/default
              port: 8080
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health_checks/default
              port: 8080
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health_checks/default
              port: 8080
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              memory: 1Gi
              cpu: 100m
            limits:
              memory: 4Gi
              cpu: "2"
      volumes:
        # Node-disk scratch (not tmpfs), each capped.
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: app-tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: initializers
          configMap:
            name: openproject-initializers
