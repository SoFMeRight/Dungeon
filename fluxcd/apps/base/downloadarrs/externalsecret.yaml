---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: downloadarrs-vpn-secret
spec:
  secretStoreRef:
    name: PLACEHOLDER_SECRET_STORE
    kind: ClusterSecretStore
  target:
    name: downloadarrs-vpn-secret
  data:
    - secretKey: username
      remoteRef:
        key: apps/gluetun
        property: OPENVPN_USER
    - secretKey: password
      remoteRef:
        key: apps/gluetun
        property: OPENVPN_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: downloadarrs-qbittorrent-secret
spec:
  secretStoreRef:
    name: PLACEHOLDER_SECRET_STORE
    kind: ClusterSecretStore
  target:
    name: downloadarrs-qbittorrent-secret
  data:
    - secretKey: username
      remoteRef:
        key: apps/qbittorrent
        property: username
    - secretKey: password
      remoteRef:
        key: apps/qbittorrent
        property: password
---
# The gluetun control server's authorisation config. Gluetun 3.40+ makes every route
# private, and this grants exactly the four qSticky calls — two port reads and two status
# reads, each in both the current and legacy spelling so a gluetun upgrade does not
# silently remove access. Nothing else on the control server is reachable with this key:
# without a role, /v1/vpn/status (PUT) could stop the tunnel.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: downloadarrs-gluetun-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: PLACEHOLDER_SECRET_STORE
    kind: ClusterSecretStore
  target:
    name: downloadarrs-gluetun-auth
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        config.toml: |
          [[roles]]
          name = "qsticky"
          routes = [
            "GET /v1/portforward",
            "GET /v1/openvpn/portforwarded",
            "GET /v1/vpn/status",
            "GET /v1/openvpn/status",
          ]
          auth = "apikey"
          apikey = "{{ .gluetun_apikey }}"
  data:
    - secretKey: gluetun_apikey
      remoteRef:
        key: apps/gluetun
        property: CONTROL_SERVER_APIKEY
---
# qSticky reads credentials from files rather than the environment: pydantic-settings
# resolves each setting from /run/secrets/<field>, so the API key and the qBittorrent
# password never enter the process environment, where they would be readable through
# /proc/self/environ for the life of the process.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: downloadarrs-qsticky-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: PLACEHOLDER_SECRET_STORE
    kind: ClusterSecretStore
  target:
    name: downloadarrs-qsticky-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        gluetun_apikey: "{{ .gluetun_apikey }}"
        qbittorrent_pass: "{{ .qbittorrent_password }}"
        qbittorrent_user: "{{ .qbittorrent_username }}"
  data:
    - secretKey: gluetun_apikey
      remoteRef:
        key: apps/gluetun
        property: CONTROL_SERVER_APIKEY
    - secretKey: qbittorrent_password
      remoteRef:
        key: apps/qbittorrent
        property: password
    - secretKey: qbittorrent_username
      remoteRef:
        key: apps/qbittorrent
        property: username
