apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: downloadarrs
spec:
  revisionHistoryLimit: 5
  serviceName: downloadarrs
  replicas: 1
  selector:
    matchLabels:
      app: downloadarrs
  template:
    metadata:
      labels:
        app: downloadarrs
    spec:
      serviceAccountName: downloadarrs
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: cross-seed-config-init
          image: docker.io/busybox:1.38
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: QBITTORRENT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: downloadarrs-qbittorrent-secret
                  key: username
            - name: QBITTORRENT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: downloadarrs-qbittorrent-secret
                  key: password
            - name: PROWLARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: prowlarr-api-secret
                  key: api_key
          command:
            - sh
            - -c
            - |
              cat > /config/config.js << CONFIGEOF
              module.exports = {
                delay: 30,
                torznab: ["http://prowlarr.swift-sail.svc.cluster.local:9696/1/api?apikey=$PROWLARR_API_KEY"],
                torrentClients: ["qbittorrent:http://$QBITTORRENT_USERNAME:$QBITTORRENT_PASSWORD@localhost:6887"],
                port: 2468,
                host: "0.0.0.0",
                rssCadence: null,
                searchCadence: null,
                excludeOlder: null,
                excludeRecentSearch: null,
                action: "inject",
                matchMode: "safe",
                skipRecheck: true,
                linkType: "hardlink",
                linkDirs: [],
                dataDirs: ["/downloads"],
                maxDataDepth: 3,
                outputDir: null,
                includeEpisodes: true,
                includeSingleEpisodes: true,
                includeNonVideos: false,
                fuzzySizeThreshold: 0.02,
                duplicateCategories: true,
                apiAuth: false,
                useClientTorrents: true
              };
              CONFIGEOF
              chown 1000:1000 /config/config.js
              echo "Cross-seed configuration complete"
          volumeMounts:
            - name: cross-seed-config
              mountPath: /config
      containers:
        # Gluetun VPN Gateway - shared by all apps
        - name: gluetun
          image: docker.io/qmcgaw/gluetun:v3.41.3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - NET_ADMIN
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - MKNOD
                - SETUID
                - SETGID
              drop:
                - ALL
          env:
            - name: VPN_SERVICE_PROVIDER
              value: "private internet access"
            - name: SERVER_REGIONS
              value: PLACEHOLDER_SERVER_REGIONS
            - name: VPN_PORT_FORWARDING
              value: "on"
            - name: PORT_FORWARD_ONLY
              value: "true"
            - name: VPN_PORT_FORWARDING_PROVIDER
              value: "private internet access"
            - name: VPN_PORT_FORWARDING_STATUS_FILE
              value: "/tmp/gluetun/forwarded_port"
            - name: FIREWALL_INPUT_PORTS
              value: "6887,7878,8989,8686,8787,2468"
            - name: FIREWALL_OUTBOUND_SUBNETS
              value: PLACEHOLDER_FIREWALL_SUBNETS
            - name: DNS_ADDRESS
              value: "10.144.0.10"
            - name: TZ
              value: "Etc/UTC"
            - name: LOG_LEVEL
              value: "info"
            - name: HEALTH_VPN_DURATION_INITIAL
              value: "60s"
            # Every control-server route is private in gluetun 3.40+. Without a role
            # config the server answers nothing; with one mounted here, only the reads
            # qSticky needs are reachable, and the API key never enters the environment.
            - name: HTTP_CONTROL_SERVER_AUTH_CONFIG_FILEPATH
              value: /etc/gluetun-auth/config.toml
            - name: OPENVPN_USER
              valueFrom:
                secretKeyRef:
                  name: downloadarrs-vpn-secret
                  key: username
            - name: OPENVPN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: downloadarrs-vpn-secret
                  key: password
            - name: VPN_PORT_FORWARDING_USERNAME
              valueFrom:
                secretKeyRef:
                  name: downloadarrs-vpn-secret
                  key: username
            - name: VPN_PORT_FORWARDING_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: downloadarrs-vpn-secret
                  key: password
          # gluetun restarts the tunnel itself when its own health check fails, but that
          # recovery can wedge: this pod sat ready=true for 37 hours with openvpn stuck in
          # "stopping" and no egress, because nothing outside the container was checking.
          #
          # Runs gluetun's own healthcheck, which queries its health server on
          # 127.0.0.1:9999 and exits 0 healthy / 1 unhealthy. Using the vendor command
          # rather than a hand-rolled wget keeps the definition of "healthy" theirs, so a
          # change to that contract cannot silently turn this into a probe that always
          # passes. An httpGet probe is not an option: kubelet dials the pod IP, and the
          # health server binds loopback only — exposing it, or putting the control-server
          # API key in the pod spec, would both be worse than an exec.
          livenessProbe:
            exec:
              command:
                - /gluetun-entrypoint
                - healthcheck
            # The tunnel has to establish before any of this means anything, and a probe
            # that fires during connect would restart the container forever.
            initialDelaySeconds: 180
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: gluetun-config
              mountPath: /gluetun
            - name: gluetun-auth
              mountPath: /etc/gluetun-auth
              readOnly: true
            - name: gluetun-tmp
              mountPath: /tmp/gluetun
          ports:
            - containerPort: 6887
              name: qbittorrent
            - containerPort: 7878
              name: radarr
            - containerPort: 8989
              name: sonarr
            - containerPort: 8686
              name: lidarr
            - containerPort: 8787
              name: readarr
            - containerPort: 2468
              name: cross-seed
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

        # qBittorrent - full downloads access
        - name: qbittorrent
          image: docker.io/linuxserver/qbittorrent:5.2.3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - SETUID
                - SETGID
          env:
            - name: TZ
              value: "Etc/UTC"
            - name: WEBUI_PORT
              value: "6887"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          volumeMounts:
            - name: qbittorrent-config
              mountPath: /config
            - name: downloads
              mountPath: /downloads
            - name: tv-shows-seeding
              mountPath: /media/TV_Shows/Automated-Seeding
            - name: movies-seeding
              mountPath: /media/Movies/2D-Automated-Seeding
            - name: downloads-completed
              mountPath: /media/timecapsule/Media/Download/__qbittorrent
          resources:
            requests:
              cpu: 150m
              memory: 3Gi
            limits:
              cpu: "2"
              memory: 4Gi

        # Keeps qBittorrent's listen port equal to the port gluetun holds from the VPN.
        #
        # It reads gluetun's control API, not the forwarded_port file. Gluetun CLEARS that
        # file when the tunnel drops; a watcher reading it then writes the empty value
        # through, which qBittorrent stores as port 0 and silently stops accepting inbound
        # connections. The API reports tunnel status and port as separate facts, so "the VPN
        # is down" can never be mistaken for "the port is now nothing".
        - name: qsticky
          image: ghcr.io/monstermuffin/qsticky:sha-5ca1746@sha256:27c19a7acc9fb8b39c2b5ebee3183190a3920afbb1c43342b01c7752c02a02d3
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            # Both endpoints are neighbours in this pod, so loopback is the whole reachable
            # surface — nothing this container talks to crosses the pod boundary.
            - name: GLUETUN_HOST
              value: "127.0.0.1"
            - name: GLUETUN_PORT
              value: "8000"
            - name: GLUETUN_AUTH_TYPE
              value: "apikey"
            - name: QBITTORRENT_HOST
              value: "127.0.0.1"
            - name: QBITTORRENT_PORT
              value: "6887"
            - name: CHECK_INTERVAL
              value: "30"
            - name: LOG_LEVEL
              value: "INFO"
            - name: HEALTH_FILE
              value: /app/health/status.json
          volumeMounts:
            # pydantic-settings resolves each setting from /run/secrets/<field>, so the API
            # key and the qBittorrent password stay out of the environment, where they would
            # be readable through /proc/self/environ for the life of the process.
            - name: qsticky-secrets
              mountPath: /run/secrets
              readOnly: true
            # The image writes its health file here and nowhere else, which is what lets the
            # root filesystem above be read-only.
            - name: qsticky-health
              mountPath: /app/health
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

        # Radarr - only zz-radarr subpath
        - name: radarr
          image: docker.io/linuxserver/radarr:6.3.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - SETUID
                - SETGID
          env:
            - name: TZ
              value: "Etc/UTC"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          volumeMounts:
            - name: radarr-config
              mountPath: /config
            - name: movies
              mountPath: /media/Movies
            - name: downloads
              mountPath: /downloads/zz-radarr
              subPath: zz-radarr
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi

        # Sonarr - only zz-sonarr subpath
        - name: sonarr
          image: docker.io/linuxserver/sonarr:4.0.19
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - SETUID
                - SETGID
          env:
            - name: TZ
              value: "Etc/UTC"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          volumeMounts:
            - name: sonarr-config
              mountPath: /config
            - name: tv-shows
              mountPath: /media/TV_Shows
            - name: downloads
              mountPath: /downloads/zz-sonarr
              subPath: zz-sonarr
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi

        # Lidarr
        - name: lidarr
          image: docker.io/linuxserver/lidarr:3.1.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - SETUID
                - SETGID
          env:
            - name: TZ
              value: "Etc/UTC"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          volumeMounts:
            - name: lidarr-config
              mountPath: /config
            - name: music
              mountPath: /media/Music
            - name: downloads
              mountPath: /downloads/zz-lidarr
              subPath: zz-lidarr
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi

        # Readarr
        - name: readarr
          image: docker.io/linuxserver/readarr:0.4.19-nightly@sha256:4f291128d1a5538be73c2a30473d7cdd0820e223dc8b8533b0cbc5659000dcbe
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - SETUID
                - SETGID
          env:
            - name: TZ
              value: "Etc/UTC"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          volumeMounts:
            - name: readarr-config
              mountPath: /config
            - name: books
              mountPath: /media/Books
            - name: downloads
              mountPath: /downloads/zz-readarr
              subPath: zz-readarr
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi

        # Cross-seed
        - name: cross-seed
          image: docker.io/crossseed/cross-seed:6.13.7
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: TZ
              value: "Etc/UTC"
          volumeMounts:
            - name: cross-seed-config
              mountPath: /config
            - name: downloads
              mountPath: /downloads
            - name: qbittorrent-config
              mountPath: /qbittorrent-config
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi

      volumes:
        # Gluetun
        - name: gluetun-config
          persistentVolumeClaim:
            claimName: PLACEHOLDER_GLUETUN_CONFIG_PVC
        - name: gluetun-tmp
          emptyDir: {}
        - name: gluetun-auth
          secret:
            secretName: downloadarrs-gluetun-auth
        - name: qsticky-secrets
          secret:
            secretName: downloadarrs-qsticky-secrets
            defaultMode: 0400
        - name: qsticky-health
          emptyDir: {}

        # qBittorrent
        - name: qbittorrent-config
          persistentVolumeClaim:
            claimName: PLACEHOLDER_QBITTORRENT_CONFIG_PVC
        - name: downloads
          persistentVolumeClaim:
            claimName: PLACEHOLDER_DOWNLOADS_PVC

        # Radarr
        - name: radarr-config
          persistentVolumeClaim:
            claimName: PLACEHOLDER_RADARR_CONFIG_PVC
        - name: movies
          persistentVolumeClaim:
            claimName: PLACEHOLDER_MOVIES_PVC

        # Sonarr
        - name: sonarr-config
          persistentVolumeClaim:
            claimName: PLACEHOLDER_SONARR_CONFIG_PVC
        - name: tv-shows
          persistentVolumeClaim:
            claimName: PLACEHOLDER_TV_SHOWS_PVC

        # Lidarr
        - name: lidarr-config
          persistentVolumeClaim:
            claimName: PLACEHOLDER_LIDARR_CONFIG_PVC
        - name: music
          persistentVolumeClaim:
            claimName: PLACEHOLDER_MUSIC_PVC

        # Readarr
        - name: readarr-config
          persistentVolumeClaim:
            claimName: PLACEHOLDER_READARR_CONFIG_PVC
        - name: books
          persistentVolumeClaim:
            claimName: PLACEHOLDER_BOOKS_PVC

        # Cross-seed
        - name: cross-seed-config
          persistentVolumeClaim:
            claimName: PLACEHOLDER_CROSS_SEED_CONFIG_PVC

        # Shared seeding/completed paths
        - name: tv-shows-seeding
          persistentVolumeClaim:
            claimName: PLACEHOLDER_TV_SHOWS_SEEDING_PVC
        - name: movies-seeding
          persistentVolumeClaim:
            claimName: PLACEHOLDER_MOVIES_SEEDING_PVC
        - name: downloads-completed
          persistentVolumeClaim:
            claimName: PLACEHOLDER_DOWNLOADS_COMPLETED_PVC
