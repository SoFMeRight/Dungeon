apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: recyclarr-secrets
spec:
  secretStoreRef:
    name: PLACEHOLDER_SECRET_STORE
    kind: ClusterSecretStore
  target:
    name: recyclarr-secrets
  data:
    - secretKey: RADARR_API_KEY
      remoteRef:
        key: apps/recyclarr
        property: RADARR_API_KEY
    - secretKey: SONARR_API_KEY
      remoteRef:
        key: apps/recyclarr
        property: SONARR_API_KEY
