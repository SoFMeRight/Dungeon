apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: twofauth-secrets
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: openbao-twofauth
    kind: SecretStore
  target:
    name: twofauth-secrets
  data:
    - secretKey: app_key
      remoteRef:
        key: apps/twofauth/app
        property: APP_KEY
    - secretKey: site_owner
      remoteRef:
        key: apps/twofauth/app
        property: SITE_OWNER
    - secretKey: smtp_host
      remoteRef:
        key: apps/twofauth/smtp
        property: HOST
    - secretKey: smtp_port
      remoteRef:
        key: apps/twofauth/smtp
        property: PORT
    - secretKey: smtp_security
      remoteRef:
        key: apps/twofauth/smtp
        property: SECURITY
    - secretKey: smtp_user
      remoteRef:
        key: apps/twofauth/smtp
        property: USERNAME
    - secretKey: smtp_password
      remoteRef:
        key: apps/twofauth/smtp
        property: PASSWORD
    - secretKey: smtp_from
      remoteRef:
        key: apps/twofauth/smtp
        property: FROM_NAME
    - secretKey: openid_client_id
      remoteRef:
        key: apps/twofauth/oidc
        property: CLIENT_ID
    - secretKey: openid_client_secret
      remoteRef:
        key: apps/twofauth/oidc
        property: CLIENT_SECRET
