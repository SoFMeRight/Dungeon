# Renovate for dungeon alone, retried until a pass completes (run-until-done.sh).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate-dungeon
spec:
  schedule: "PLACEHOLDER_SCHEDULE"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: renovate
            policy.prplanit.com/cap.s3: "true"
            policy.prplanit.com/cap.redis: "true"
            policy.prplanit.com/access-scope-redis: hyrule-castle.renovate.redis
            policy.prplanit.com/access-scope-s3: gorons-bracelet.rgw
        spec:
          restartPolicy: Never
          serviceAccountName: renovate
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: renovate
              image: PLACEHOLDER_IMAGE
              # The image entrypoint sets up the toolchain environment, then runs these.
              args: ["sh", "/config/run-until-done.sh", "SoFMeRight/dungeon"]
              # No readOnlyRootFilesystem: containerbase installs toolchains at runtime.
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              env:
                - name: RENOVATE_PLATFORM
                  value: "gitlab"
                - name: RENOVATE_ENDPOINT
                  value: "PLACEHOLDER_GITLAB_ENDPOINT"
                - name: RENOVATE_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: renovate-gitlab
                      key: token
                - name: GITHUB_COM_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: renovate-gitlab
                      key: github_token
                - name: RENOVATE_HOST_RULES
                  valueFrom:
                    secretKeyRef:
                      name: renovate-gitlab
                      key: host_rules
                - name: RENOVATE_AUTODISCOVER
                  value: "false"
                - name: RENOVATE_GIT_AUTHOR
                  value: "Renovate Bot <renovate@precisionplanit.com>"
                - name: LOG_LEVEL
                  value: "info"
                - name: RENOVATE_CONFIG_FILE
                  value: "/config/renovate.json5"
                # Package cache shared by every Renovate job.
                - name: RENOVATE_REDIS_URL
                  value: "redis://renovate-redis:6379"
                # Size-limited working directory (clones, per-run files).
                - name: RENOVATE_BASE_DIR
                  value: "/work"
                # Repository cache on Ceph RGW.
                - name: RENOVATE_REPOSITORY_CACHE
                  value: "enabled"
                - name: RENOVATE_REPOSITORY_CACHE_TYPE
                  value: "s3://renovate-cache"
                # The in-cluster RGW Service, never s3.optcp.com (hairpins under Cilium DSR).
                - name: RENOVATE_S3_ENDPOINT
                  value: "http://ceph-rgw.gorons-bracelet.svc.cluster.local"
                - name: RENOVATE_S3_PATH_STYLE
                  value: "true"
                - name: AWS_REGION
                  value: "default"
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: renovate-rgw-credentials
                      key: s3_access_key
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: renovate-rgw-credentials
                      key: s3_secret_key
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: work
                  mountPath: /work
              resources:
                requests:
                  cpu: PLACEHOLDER_CPU_REQUEST
                  memory: PLACEHOLDER_MEMORY_REQUEST
                limits:
                  cpu: PLACEHOLDER_CPU_LIMIT
                  memory: PLACEHOLDER_MEMORY_LIMIT
          volumes:
            - name: config
              configMap:
                name: renovate-config
            - name: work
              emptyDir:
                sizeLimit: 1Gi
