apiVersion: v1
kind: ConfigMap
metadata:
  name: renovate-config
data:
  # Renovate configuration
  renovate.json5: |
    {
      "$schema": "https://docs.renovatebot.com/renovate-schema.json",
      "platform": "gitlab",
      "gitAuthor": "Renovate Bot <renovate@precisionplanit.com>",
      "onboarding": false,
      "requireConfig": "ignored",
      "repositories": ["SoFMeRight/dungeon"],

      "ignorePaths": ["docker-compose/**", "**/zz-graveyard/**"],

      "registryAliases": {
        "docker.io": "docker.cr.pcfae.com"
      },

      "flux": {
        "fileMatch": ["fluxcd/.+\\.yaml$"]
      },

      "kubernetes": {
        "fileMatch": ["fluxcd/.+\\.yaml$"]
      },

      "helm-values": {
        "fileMatch": ["fluxcd/.+\\.yaml$"]
      },

      "customManagers": [
        {
          "customType": "regex",
          "fileMatch": ["fluxcd/.+\\.yaml$"],
          "matchStrings": [
            "image:\\s+repository:\\s+\"?(?<depName>.*?)\"?\\s+tag:\\s+\"?(?<currentValue>.*?)\"?"
          ],
          "datasourceTemplate": "docker"
        },
        {
          "customType": "regex",
          "fileMatch": ["fluxcd/apps/overlays/production/home-assistant/statefulset-patch\\.yaml$"],
          "matchStrings": [
            "# renovate: datasource=(?<datasource>.*?) depName=(?<depName>.*?)\\n\\s+- name: COMP_\\d+_VERSION\\n\\s+value: \"?(?<currentValue>[^\"\\n]+)\"?"
          ],
          "description": "Home Assistant custom components (HACS, Dreame, etc.)"
        },
        {
          "customType": "regex",
          "fileMatch": ["fluxcd/.+\\.yaml$"],
          "matchStrings": [
            "image:\\s+(?<depName>ghcr\\.io/mariadb-operator/mariadb-operator):(?<currentValue>\\S+)"
          ],
          "datasourceTemplate": "docker",
          "description": "Galera agent/init images in the MariaDB CRs — run the operator binary, so they track the operator (grouped mariadb-operator)"
        },
        {
          "customType": "regex",
          "fileMatch": ["ansible/group_vars/.+\\.ya?ml$"],
          "matchStrings": [
            "crio_version:\\s+\"?(?<currentValue>[^\"\\s]+)\"?"
          ],
          "depNameTemplate": "cri-o/cri-o",
          "datasourceTemplate": "github-releases",
          "extractVersionTemplate": "^v(?<version>.*)$",
          "description": "Node runtime pin the ansible converge playbook applies (grouped k8s-nodes)"
        },
        {
          "customType": "regex",
          "fileMatch": ["ansible/group_vars/.+\\.ya?ml$"],
          "matchStrings": [
            "kubernetes_version:\\s+\"?(?<currentValue>[^\"\\s]+)\"?"
          ],
          "depNameTemplate": "kubernetes/kubernetes",
          "datasourceTemplate": "github-releases",
          "extractVersionTemplate": "^v(?<version>.*)$",
          "description": "Cluster kubernetes pin — minor moves in lockstep with cri-o (grouped k8s-nodes)"
        },
        {
          // Generic "split dependency" rescue manager. The base/overlay convention can
          // divorce a value from the metadata Renovate needs to resolve it — an image
          // tag in an overlay patch whose repository is in base, or a chart version
          // pinned in an overlay without the sourceRef. Neither helm-values nor the flux
          // manager can correlate across files (Renovate never runs kustomize), so those
          // dependencies were invisible and NEVER got a bump — patch or major. Annotate
          // the value in place and this manager tracks it. Covers the four known splits:
          // nextcloud (image + chart), stunner, rook-ceph, bank-vaults (chart + images).
          //   # renovate: datasource=docker depName=library/nextcloud
          //   tag: "31.0.10"
          //   # renovate: datasource=helm depName=stunner registryUrl=https://l7mp.io/stunner
          //   version: "1.1.0"
          // registryUrl is optional — OCI charts carry the registry inside depName.
          "customType": "regex",
          "fileMatch": ["fluxcd/.+\\.yaml$"],
          "matchStrings": [
            "# renovate: datasource=(?<datasource>\\S+) depName=(?<depName>\\S+)(?: registryUrl=(?<registryUrl>\\S+))?\\s+tag:\\s+\"?(?<currentValue>[^\"\\s]+)\"?",
            "# renovate: datasource=(?<datasource>\\S+) depName=(?<depName>\\S+)(?: registryUrl=(?<registryUrl>\\S+))?\\s+version:\\s+\"?(?<currentValue>[^\"\\s]+)\"?"
          ],
          "description": "Annotation-driven tracking for base/overlay-split image tags and chart versions"
        }
      ],

      "packageRules": [
        {
          // Majors surface as an MR (a real notification), but only once the release
          // has aged 30 days — matured enough to be a reasonable upgrade, letting the
          // .0 bugs shake out first. Never auto-merged: the MR waits for a human to
          // review and merge. This REPLACES the old dependencyDashboardApproval gate,
          // which silently parked every major behind a dashboard checkbox so nothing
          // ever got a chance to update — the drift that left Nextcloud two majors back.
          "matchDatasources": ["docker", "helm"],
          "matchUpdateTypes": ["major"],
          "minimumReleaseAge": "30 days"
        },
        {
          // Relational-DB (postgres, mysql) major bumps are NOT drop-in: the on-disk data
          // format changes and the official image refuses to start on an older-major data
          // dir — a major MUST be paired with a manual dump/restore (or pg_upgrade /
          // mysql_upgrade) first. So park these DB MAJORS behind explicit dependency-
          // dashboard approval; this is the one place "drift" is correct — it waits for a
          // deliberate migration instead of merging a routine-looking image MR that would
          // brick the DB. Minor/patch (same major, data-compatible) still auto-flow.
          // Plain images only, NOT CNPG's cloudnative-pg/postgresql nor the mariadb-operator
          // (operator-managed upgrades, grouped separately below).
          "matchDatasources": ["docker"],
          "matchPackageNames": ["**/postgres", "**/mysql"],
          "matchUpdateTypes": ["major"],
          "dependencyDashboardApproval": true
        },
        {
          // Ceph (Rook) is critical stateful storage — a MAJOR is a deliberate, multi-step
          // Rook cluster upgrade, never an image MR, and Renovate mis-reads quay's non-
          // release tags (it proposed a bogus v21 while we run Squid/v19). Fence to the v19
          // line so only v19.x patches surface; the next major (Tentacle) is a planned
          // operation done by bumping this pin deliberately.
          "matchDatasources": ["docker"],
          "matchPackageNames": ["**/ceph/ceph"],
          "allowedVersions": "/^v19/"
        },
        {
          // Photoprism ships date tags and switched formats (YYYYMMDD -> YYMMDD). Default
          // semver mis-orders them — it proposed a 2022 DOWNGRADE (20220121) over the
          // current 251130 because 20,220,121 > 251,130 numerically. Pin the versioning to
          // the current 6-digit YYMMDD scheme and only allow 6-digit tags, so newest-date
          // wins and the legacy 8-digit tags are ignored.
          "matchDatasources": ["docker"],
          "matchPackageNames": ["**/photoprism/**"],
          "versioning": "regex:^(?<major>\\d{2})(?<minor>\\d{2})(?<patch>\\d{2})$",
          "allowedVersions": "/^\\d{6}$/"
        },
        {
          // it-tools ships YYYY.M.D-<git-sha> calver tags; default semver can't order them
          // and would misfire. Extract the date so newest-date wins. (searxng/plex already
          // have their own X.Y.Z-sha rules below.)
          "matchDatasources": ["docker"],
          "matchPackageNames": ["**/it-tools"],
          "versioning": "regex:^(?<major>\\d{4})\\.(?<minor>\\d{1,2})\\.(?<patch>\\d{1,2})"
        },
        {
          // LinuxServer projectsend uses version-r<N>; order by the r-number so it keeps
          // getting real updates instead of being stuck (or mis-ordered).
          "matchDatasources": ["docker"],
          "matchPackageNames": ["**/linuxserver/projectsend"],
          "versioning": "regex:^version-r(?<major>\\d+)$"
        },
        {
          // Rolling/bespoke tags with NO orderable version (latest, nightly, gpu, stable,
          // channel names, svn revisions, build hashes). Renovate can't semver these, so
          // pin the digest: immutable + forward-only digest tracking when the tag moves,
          // and worst case it simply doesn't move — never the silent downgrade a bad
          // semver guess would cause. (Self-managed prplanit/* dev images excluded — we
          // push those tags deliberately.)
          "matchDatasources": ["docker"],
          "matchPackageNames": [
            "**/mealie", "**/readarr", "**/faster-whisper", "**/jellyfin", "**/pihole",
            "**/clamav", "**/py-kms", "**/umami", "**/whiteboard",
            "**/nextcloud-spreed-signaling", "**/vlmcsd", "**/asa_server", "**/arkserver",
            "**/anirra", "**/minecraft-server", "**/kasm", "**/whisparr", "**/tikiwiki",
            "**/frigate"
          ],
          "pinDigests": true
        },
        {
          "matchDatasources": ["helm"],
          "commitMessagePrefix": "chore(helm):",
          "semanticCommits": "enabled"
        },
        {
          "matchDatasources": ["docker"],
          "commitMessagePrefix": "chore(image):",
          "semanticCommits": "enabled"
        },
        {
          // Flux distribution + its controllers are version-coupled and all live
          // in gotk-components.yaml — every release otherwise fires 5-6 competing
          // MRs against the same file. Group them into one "flux" MR.
          "groupName": "flux",
          "matchPackageNames": ["fluxcd/flux2", "ghcr.io/fluxcd/**"],
          "commitMessagePrefix": "chore(flux):"
        },
        // Grouping below is reserved for STRICTLY version-coupled multi-component
        // products — components built from one release that must upgrade in lockstep
        // (a split upgrade breaks the app). Unrelated apps, and incidental sidecars
        // (gluetun, busybox, generic postgres/redis/mariadb backing stores), stay
        // per-dependency for bisectability. Major updates remain disabled globally.
        {
          // AppFlowy-Cloud stack: cloud/web/worker/admin_frontend/ai/gotrue ship per release.
          "groupName": "appflowy",
          "matchPackageNames": ["**/appflowyinc/**"],
          "commitMessagePrefix": "chore(appflowy):"
        },
        {
          // Immich requires server and machine-learning to be the same version.
          "groupName": "immich",
          "matchPackageNames": ["ghcr.io/immich-app/**"],
          "commitMessagePrefix": "chore(immich):"
        },
        {
          // Penpot requires backend/exporter/frontend matched.
          "groupName": "penpot",
          "matchPackageNames": ["**/penpotapp/**"],
          "commitMessagePrefix": "chore(penpot):"
        },
        {
          // TacticalRMM pins tactical/frontend/meshcentral/nats/nginx to one version.
          "groupName": "tacticalrmm",
          "matchPackageNames": ["**/tacticalrmm/**"],
          "commitMessagePrefix": "chore(tacticalrmm):"
        },
        {
          // guacd protocol version must match the guacamole client.
          "groupName": "guacamole",
          "matchPackageNames": ["**/guacamole/**"],
          "commitMessagePrefix": "chore(guacamole):"
        },
        {
          // OpnForm api + client ship from one release.
          "groupName": "opnform",
          "matchPackageNames": ["**/jhumanj/**"],
          "commitMessagePrefix": "chore(opnform):"
        },
        {
          // mariadb-operator: the crds chart, the operator chart, and the agent/init
          // container images (spec.galera.{agent,initContainer}.image, pinned in the
          // Galera CRs) all run the SAME operator binary and must upgrade in lockstep —
          // a split (operator 26.x + agent v0.0.x) breaks Galera reconciliation and takes
          // the cluster down. ghcr.io/mariadb-operator/** matches both the OCI charts
          // (.../charts/*) and the operator image.
          "groupName": "mariadb-operator",
          "matchPackageNames": ["ghcr.io/mariadb-operator/**"],
          "commitMessagePrefix": "chore(mariadb-operator):"
        },
        {
          // k8s-nodes: cri-o's minor is coupled to the cluster's kubernetes minor
          // (runtime/kubelet skew policy), so the two pins move as one PR. Patch
          // bumps auto-PR within the 1.35 line; the minor fence (allowedVersions)
          // holds 1.36+ until it is raised deliberately alongside a cluster
          // upgrade. Merging a bump makes the perform reconcile's ansible
          // converge roll the fleet, one node at a time.
          "groupName": "k8s-nodes",
          "matchDepNames": ["cri-o/cri-o", "kubernetes/kubernetes"],
          "allowedVersions": "<1.36.0",
          "commitMessagePrefix": "chore(k8s-nodes):"
        },
        {
          // Zitadel login v2 is version-locked to the server (v4+).
          "groupName": "zitadel",
          "matchPackageNames": ["ghcr.io/zitadel/**"],
          "commitMessagePrefix": "chore(zitadel):"
        },
        {
          // opstree redis HA: redis-sentinel must match the redis version.
          "groupName": "redis-ha",
          "matchPackageNames": ["quay.io/opstree/redis", "quay.io/opstree/redis-sentinel"],
          "commitMessagePrefix": "chore(redis-ha):"
        },
        {
          // istio base/cni/istiod/ztunnel ship from one release and must upgrade in
          // lockstep — a split control/data-plane upgrade breaks the mesh. They all live
          // in operators/base/istio/, so scope by path (unambiguous; chart names like
          // "base" are too generic to match safely).
          "groupName": "istio",
          "matchFileNames": ["fluxcd/infrastructure/operators/base/istio/**"],
          "commitMessagePrefix": "chore(istio):"
        },
        {
          // Wazuh manager/indexer/dashboard are version-locked (all must be the same
          // 4.x.y); group them. docker.io images → registry-agnostic glob (the alias
          // rewrites the packageName, so a "docker.io/wazuh/**" key would never match).
          "groupName": "wazuh",
          "matchPackageNames": ["**/wazuh/**"],
          "commitMessagePrefix": "chore(wazuh):"
        },
        {
          // Velero chart + velero-plugin-for-aws are version-locked (the plugin minor
          // tracks Velero's per the compat matrix; a mismatched plugin breaks
          // backups/restores). Both live under operators/**/velero/, so scope by path —
          // this groups the HelmRelease chart version and the plugin image into one MR,
          // like istio.
          "groupName": "velero",
          "matchFileNames": ["fluxcd/infrastructure/operators/**/velero/**"],
          "commitMessagePrefix": "chore(velero):"
        },
        {
          // Plex tags are <maj>.<min>.<patch>.<build>-<hash>; the hash changes every
          // release, so default docker versioning treats each release as an incompatible
          // variant and never detects an update. Parse the numeric version, ignore the
          // hash, and exclude the -amd64/-arm64/-armhf single-arch tags (the multi-arch
          // hash-only tag is what's deployed). e.g. 1.43.0.10492 -> 1.43.2.10687.
          // matchPackageNames matches the resolved packageName, which the docker.io
          // registryAlias rewrites to docker.cr.pcfae.com/... — so a "docker.io/..."
          // key never matches. Use a registry-agnostic glob.
          "matchPackageNames": ["**/plexinc/pms-docker"],
          "versioning": "regex:^(?<major>\\d+)\\.(?<minor>\\d+)\\.(?<patch>\\d+)\\.(?<build>\\d+)-[0-9a-f]+$",
          // Two independent Plex servers (plex, plex-ms-x) share this image; key the
          // branch on the deployment dir so each gets its own MR — stagger/verify one
          // before the other rather than restarting both at once.
          "additionalBranchPrefix": "{{parentDir}}-",
          "commitMessagePrefix": "chore(plex):"
        },
        {
          // Nextcloud chart (helm) + app image (docker) must move together across majors —
          // chart 9.x carries the NC 33 templates, chart 8.x carries NC 32. Group so a
          // major bump proposes ONE MR touching both, never a half-upgrade that pairs a
          // new image with an incompatible chart. "nextcloud" = the chart depName (exact);
          // the glob matches the image after the docker.io registryAlias rewrite.
          "groupName": "nextcloud",
          "matchPackageNames": ["nextcloud", "**/library/nextcloud"],
          "commitMessagePrefix": "chore(nextcloud):"
        },
        {
          // SearXNG official tags are <calver>-<git-sha> (e.g. 2026.8.22-9fea41204); the
          // hash changes every release, so default docker versioning treats each release as
          // an incompatible variant and never detects an update — same failure mode as Plex.
          // Parse the numeric calver and ignore the hash. Registry-agnostic glob so it matches
          // whether pinned on ghcr.io (no alias) or docker.io (rewritten to docker.cr.pcfae.com).
          "matchPackageNames": ["**/searxng/searxng"],
          "versioning": "regex:^(?<major>\\d+)\\.(?<minor>\\d+)\\.(?<patch>\\d+)-[0-9a-f]+$",
          "commitMessagePrefix": "chore(searxng):"
        }
      ],

      "commitMessagePrefix": "chore(deps):",
      "semanticCommits": "enabled",
      "dependencyDashboard": true,
      // Unlimited by design: the whole available update set must be actionable
      // same-day. 0 = no cap (do NOT reintroduce a throttle here).
      "prConcurrentLimit": 0,
      "prHourlyLimit": 0
    }
