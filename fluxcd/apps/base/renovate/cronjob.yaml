apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate
spec:
  schedule: "PLACEHOLDER_SCHEDULE"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: renovate
            policy.prplanit.com/cap.s3: "true"
            policy.prplanit.com/access-scope-s3: gorons-bracelet.rgw
        spec:
          restartPolicy: Never
          serviceAccountName: renovate
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: renovate
              image: PLACEHOLDER_IMAGE
              # No readOnlyRootFilesystem: renovate's containerbase installs language toolchains at
              # runtime (v2-install-tool.sh writes /opt/containerbase) — a read-only rootfs FATALs
              # "Initialize tools all failed". Ceiling = non-root + seccomp + drop-ALL + no-privesc.
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              env:
                - name: RENOVATE_PLATFORM
                  value: "gitlab"
                - name: RENOVATE_ENDPOINT
                  value: "PLACEHOLDER_GITLAB_ENDPOINT"
                - name: RENOVATE_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: renovate-gitlab
                      key: token
                - name: GITHUB_COM_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: renovate-gitlab
                      key: github_token
                - name: RENOVATE_HOST_RULES
                  valueFrom:
                    secretKeyRef:
                      name: renovate-gitlab
                      key: host_rules
                - name: RENOVATE_AUTODISCOVER
                  value: "true"
                - name: RENOVATE_GIT_AUTHOR
                  value: "Renovate Bot <renovate@precisionplanit.com>"
                # Scope autodiscover to the two orgs (3rd-party = HomeLabHD, internal =
                # PrPlanIT) plus the dungeon GitOps monorepo. Every repo gets a Dependency
                # Dashboard on Renovate's own schedule, independent of whether it builds --
                # so dormant / less-active projects' dep drift is still visible (the point:
                # the in-CI deps engine only fires when a project actually builds).
                - name: RENOVATE_AUTODISCOVER_FILTER
                  value: "HomeLabHD/**,PrPlanIT/**,SoFMeRight/dungeon"
                - name: LOG_LEVEL
                  value: "info"
                - name: RENOVATE_CONFIG_FILE
                  value: "/config/renovate.json5"
                # S3 repository cache (Ceph RGW via s3.pcfae.com) — stops the
                # ephemeral cronjob cold-scanning all ~2400 deps every run.
                - name: RENOVATE_REPOSITORY_CACHE
                  value: "enabled"
                - name: RENOVATE_REPOSITORY_CACHE_TYPE
                  value: "s3://renovate-cache"
                # In-cluster clients reach ceph-rgw via its ClusterIP service, NOT
                # the external s3.pcfae.com endpoint — that resolves to a LoadBalancer
                # IP and hairpins under Cilium DSR, which failed the repo-cache reads
                # (ECONNRESET/timeout). This is the same address every other in-cluster
                # S3 consumer (loki, cnpg barman, the ceph-rgw-bucket-provisioning jobs) uses.
                - name: RENOVATE_S3_ENDPOINT
                  value: "http://ceph-rgw.gorons-bracelet.svc.cluster.local"
                - name: RENOVATE_S3_PATH_STYLE
                  value: "true"
                - name: AWS_REGION
                  value: "default"
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: renovate-rgw-credentials
                      key: s3_access_key
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: renovate-rgw-credentials
                      key: s3_secret_key
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
              resources:
                requests:
                  cpu: PLACEHOLDER_CPU_REQUEST
                  memory: PLACEHOLDER_MEMORY_REQUEST
                limits:
                  cpu: PLACEHOLDER_CPU_LIMIT
                  memory: PLACEHOLDER_MEMORY_LIMIT
          volumes:
            - name: config
              configMap:
                name: renovate-config
