apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate
spec:
  schedule: "PLACEHOLDER_SCHEDULE"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: renovate
            policy.prplanit.com/cap.s3: "true"
            policy.prplanit.com/access-scope-s3: gorons-bracelet.rgw
        spec:
          restartPolicy: Never
          serviceAccountName: renovate
          # Non-root (uid set in the overlay) + seccomp; fsGroup makes the writable emptyDirs
          # group-owned so the read-only rootfs holds no runtime state.
          securityContext:
            runAsNonRoot: true
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: renovate
              image: PLACEHOLDER_IMAGE
              # readOnlyRootFilesystem: renovate clones + caches under RENOVATE_BASE_DIR (/tmp) and
              # writes git/npm config under HOME — both emptyDirs below. No caps needed; no privesc.
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              env:
                - name: RENOVATE_PLATFORM
                  value: "gitlab"
                - name: RENOVATE_BASE_DIR
                  value: "/tmp/renovate"
                - name: HOME
                  value: "/home/ubuntu"
                - name: RENOVATE_ENDPOINT
                  value: "PLACEHOLDER_GITLAB_ENDPOINT"
                - name: RENOVATE_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: renovate-gitlab
                      key: token
                - name: GITHUB_COM_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: renovate-gitlab
                      key: github_token
                - name: RENOVATE_HOST_RULES
                  valueFrom:
                    secretKeyRef:
                      name: renovate-gitlab
                      key: host_rules
                - name: RENOVATE_AUTODISCOVER
                  value: "false"
                - name: RENOVATE_GIT_AUTHOR
                  value: "Renovate Bot <renovate@precisionplanit.com>"
                - name: RENOVATE_REPOSITORIES
                  value: "SoFMeRight/dungeon"
                - name: LOG_LEVEL
                  value: "info"
                - name: RENOVATE_CONFIG_FILE
                  value: "/config/renovate.json5"
                # S3 repository cache (Ceph RGW via s3.pcfae.com) — stops the
                # ephemeral cronjob cold-scanning all ~2400 deps every run.
                - name: RENOVATE_REPOSITORY_CACHE
                  value: "enabled"
                - name: RENOVATE_REPOSITORY_CACHE_TYPE
                  value: "s3://renovate-cache"
                - name: RENOVATE_S3_ENDPOINT
                  value: "https://s3.pcfae.com"
                - name: RENOVATE_S3_PATH_STYLE
                  value: "true"
                - name: AWS_REGION
                  value: "default"
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: renovate-rgw-credentials
                      key: s3_access_key
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: renovate-rgw-credentials
                      key: s3_secret_key
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
                - name: home
                  mountPath: /home/ubuntu
              resources:
                requests:
                  cpu: PLACEHOLDER_CPU_REQUEST
                  memory: PLACEHOLDER_MEMORY_REQUEST
                limits:
                  cpu: PLACEHOLDER_CPU_LIMIT
                  memory: PLACEHOLDER_MEMORY_LIMIT
          volumes:
            - name: config
              configMap:
                name: renovate-config
            - name: tmp
              emptyDir: {}
            - name: home
              emptyDir: {}
