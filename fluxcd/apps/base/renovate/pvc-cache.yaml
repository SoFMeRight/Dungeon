# Renovate's base directory: the package cache (registry lookup results) and, for the
# dungeon job, the persisted clone. Without it every run re-queries every registry for
# every dependency from cold, which made dungeon's pass longer than the gap between its
# commits. One claim per job: both are ReadWriteOnce and the jobs may overlap.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: renovate-cache
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: PLACEHOLDER_STORAGE_CLASS
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: renovate-dungeon-cache
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: PLACEHOLDER_STORAGE_CLASS
