apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: draw-io
spec:
  revisionHistoryLimit: 5
  serviceName: draw-io
  replicas: PLACEHOLDER_REPLICAS
  selector:
    matchLabels:
      app: draw-io
  template:
    metadata:
      labels:
        app: draw-io
    spec:
      serviceAccountName: draw-io
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: draw-io
          image: PLACEHOLDER_IMAGE
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8443
              name: https
          resources:
            requests:
              cpu: PLACEHOLDER_CPU_REQUEST
              memory: PLACEHOLDER_MEMORY_REQUEST
            limits:
              cpu: PLACEHOLDER_CPU_LIMIT
              memory: PLACEHOLDER_MEMORY_LIMIT
