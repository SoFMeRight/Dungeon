apiVersion: apps/v1
kind: Deployment
metadata:
  name: etherealclique-site
  labels:
    app: etherealclique-site
spec:
  revisionHistoryLimit: 5
  replicas: 1
  selector:
    matchLabels:
      app: etherealclique-site
  template:
    metadata:
      labels:
        app: etherealclique-site
    spec:
      serviceAccountName: etherealclique-site
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: etherealclique-site
          image: PLACEHOLDER_IMAGE
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # nginx renders config + writes pid/temp under /tmp so the root fs stays
            # read-only (static-site base is built for this).
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: "64Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "100m"
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
