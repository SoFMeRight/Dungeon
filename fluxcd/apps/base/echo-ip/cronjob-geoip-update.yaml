apiVersion: batch/v1
kind: CronJob
metadata:
  name: echo-ip-geoip-update
  labels:
    app: echo-ip
spec:
  # Daily at 2 AM. GeoLite2 republishes weekly (Tue); geoipupdate only downloads on change, so daily no-ops cheaply while giving prompt pickup + retry resilience.
  schedule: "0 2 * * *"
  # The job mounts echo-ip's RWO PVC; a run that can't mount must not accumulate
  # behind the next day's run. Replace kills any still-active run before the next.
  concurrencyPolicy: Replace
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: echo-ip
            job: geoip-update
        spec:
          serviceAccountName: echo-ip
          restartPolicy: OnFailure
          # Mirror the echo-ip StatefulSet (which runs geoipupdate as a hardened
          # uid-1000 init container) so GeoIP files on the shared PVC stay owned by 1000.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          # Co-locate with echo-ip-0: the GeoIP PVC is ReadWriteOnce, so this pod
          # must land on the node already holding it, else it wedges on Multi-Attach.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      statefulset.kubernetes.io/pod-name: echo-ip-0
                  topologyKey: kubernetes.io/hostname
          containers:
            - name: geoipupdate
              image: docker.io/maxmindinc/geoipupdate:v8.0.0
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              env:
                - name: GEOIPUPDATE_ACCOUNT_ID
                  valueFrom:
                    secretKeyRef:
                      name: echo-ip-secrets
                      key: GEOIPUPDATE_ACCOUNT_ID
                - name: GEOIPUPDATE_LICENSE_KEY
                  valueFrom:
                    secretKeyRef:
                      name: echo-ip-secrets
                      key: GEOIPUPDATE_LICENSE_KEY
                - name: GEOIPUPDATE_EDITION_IDS
                  value: "GeoLite2-ASN GeoLite2-City GeoLite2-Country"
              volumeMounts:
                # geoipupdate v8 writes its working dir to /tmp/geoipupdate; give it
                # a writable emptyDir so the rootfs can stay read-only (SEC-4).
                - name: tmp
                  mountPath: /tmp
                - name: PLACEHOLDER_NAMESPACE-echo-ip-data
                  mountPath: /usr/share/GeoIP
              resources:
                requests:
                  memory: "64Mi"
                  cpu: "50m"
                limits:
                  memory: "256Mi"
                  cpu: "500m"
          volumes:
            - name: tmp
              emptyDir: {}
            - name: PLACEHOLDER_NAMESPACE-echo-ip-data
              persistentVolumeClaim:
                claimName: PLACEHOLDER_NAMESPACE-echo-ip-data-echo-ip-0
