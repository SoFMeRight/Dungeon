apiVersion: apps/v1
kind: Deployment
metadata:
  name: appflowy-worker
  labels:
    app: appflowy-worker
    component: worker
spec:
  revisionHistoryLimit: 5
  replicas: PLACEHOLDER_REPLICAS
  selector:
    matchLabels:
      app: appflowy-worker
      component: worker
  template:
    metadata:
      labels:
        app: appflowy-worker
        component: worker
    spec:
      serviceAccountName: appflowy-worker
      # Rust worker binary; runs fine non-root (no /app writes). HOME→/tmp (image default /root).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: appflowy-worker
          image: PLACEHOLDER_WORKER_IMAGE
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: HOME
              value: /tmp
            - name: APPFLOWY_ENVIRONMENT
              value: "production"
            - name: APPFLOWY_WORKER_ENVIRONMENT
              value: "production"
            - name: APPFLOWY_WORKER_IMPORT_TICK_INTERVAL
              value: "30"
            # All secrets from worker-specific secret
            - name: APPFLOWY_WORKER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: appflowy-worker-secrets
                  key: APPFLOWY_WORKER_DATABASE_URL
            - name: APPFLOWY_WORKER_DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: appflowy-worker-secrets
                  key: APPFLOWY_WORKER_DATABASE_NAME
            - name: APPFLOWY_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: appflowy-worker-secrets
                  key: APPFLOWY_S3_ACCESS_KEY
            - name: APPFLOWY_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: appflowy-worker-secrets
                  key: APPFLOWY_S3_SECRET_KEY
            - name: APPFLOWY_MAILER_SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: appflowy-worker-secrets
                  key: APPFLOWY_MAILER_SMTP_USERNAME
            - name: APPFLOWY_MAILER_SMTP_EMAIL
              valueFrom:
                secretKeyRef:
                  name: appflowy-worker-secrets
                  key: APPFLOWY_MAILER_SMTP_EMAIL
            - name: APPFLOWY_MAILER_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: appflowy-worker-secrets
                  key: APPFLOWY_MAILER_SMTP_PASSWORD
          envFrom:
            - configMapRef:
                name: appflowy-app-config
          resources:
            requests:
              cpu: PLACEHOLDER_CPU_REQUEST
              memory: PLACEHOLDER_MEMORY_REQUEST
            limits:
              cpu: PLACEHOLDER_CPU_LIMIT
              memory: PLACEHOLDER_MEMORY_LIMIT
