apiVersion: apps/v1
kind: Deployment
metadata:
  name: appflowy-nginx
  labels:
    app: appflowy
    component: nginx
spec:
  revisionHistoryLimit: 5
  replicas: PLACEHOLDER_REPLICAS
  selector:
    matchLabels:
      app: appflowy
      component: nginx
  template:
    metadata:
      labels:
        app: appflowy
        component: nginx
    spec:
      serviceAccountName: appflowy-nginx
      # Hard spread: one replica per node (matches kimai) — survives node loss; a replica
      # stays Pending if fewer eligible nodes are free (acceptable on a 5-worker cluster).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          # Count only same-revision pods so a rolling update doesn't stall on old pods.
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app: appflowy
              component: nginx
      containers:
        - name: nginx
          image: PLACEHOLDER_NGINX_IMAGE
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
            - name: https
              containerPort: 443
              protocol: TCP
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
          resources:
            requests:
              cpu: PLACEHOLDER_CPU_REQUEST
              memory: PLACEHOLDER_MEMORY_REQUEST
            limits:
              cpu: PLACEHOLDER_CPU_LIMIT
              memory: PLACEHOLDER_MEMORY_LIMIT
      volumes:
        - name: nginx-config
          configMap:
            name: appflowy-nginx-config
