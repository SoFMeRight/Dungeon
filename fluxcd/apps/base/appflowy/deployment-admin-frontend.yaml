apiVersion: apps/v1
kind: Deployment
metadata:
  name: appflowy-admin-frontend
  labels:
    app: appflowy-admin-frontend
    component: admin-ui
spec:
  revisionHistoryLimit: 5
  replicas: PLACEHOLDER_REPLICAS
  selector:
    matchLabels:
      app: appflowy-admin-frontend
      component: admin-ui
  template:
    metadata:
      labels:
        app: appflowy-admin-frontend
        component: admin-ui
    spec:
      serviceAccountName: appflowy-admin-frontend
      # Next.js admin server; serves prebuilt .next. HOME→/tmp (image default /root).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: admin-frontend
          image: PLACEHOLDER_ADMIN_FRONTEND_IMAGE
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: HOME
              value: /tmp
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: appflowy-app-config
          resources:
            requests:
              cpu: PLACEHOLDER_CPU_REQUEST
              memory: PLACEHOLDER_MEMORY_REQUEST
            limits:
              cpu: PLACEHOLDER_CPU_LIMIT
              memory: PLACEHOLDER_MEMORY_LIMIT
          livenessProbe:
            httpGet:
              path: /console
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /console
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
