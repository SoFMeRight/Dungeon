apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jellyfin-smb-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-operationtimecapsule
  refreshInterval: 5m
  target:
    name: jellyfin-smb-secret
    template:
      type: Opaque
      data:
        username: "{{ .SAMBA_USERNAME | toString }}"
        password: "{{ .SAMBA_PASSWORD | toString }}"
  dataFrom:
    - extract:
        key: apps/jellyfin
