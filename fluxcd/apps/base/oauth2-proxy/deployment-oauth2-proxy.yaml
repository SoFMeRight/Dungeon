apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
spec:
  revisionHistoryLimit: 5
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy
  template:
    metadata:
      labels:
        app: oauth2-proxy
        policy.prplanit.com/cap.oidc: "true"
    spec:
      serviceAccountName: oauth2-proxy
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oauth2-proxy
          image: PLACEHOLDER_OAUTH2_PROXY_IMAGE
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 4180
              name: http
          args:
            - --http-address
            - 0.0.0.0:4180
            - --cookie-domain
            - prplanit.com,pcfae.com
            - --whitelist-domain=*.prplanit.com,*.pcfae.com,*.uni2.cc
          env:
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secrets
                  key: OAUTH2_PROXY_COOKIE_SECRET
            - name: OAUTH2_PROXY_COOKIE_SECURE
              value: "false"
            - name: OAUTH2_PROXY_EMAIL_DOMAINS
              value: "gmail.com"
            - name: OAUTH2_PROXY_HTTP_ADDRESS
              value: "0.0.0.0:4180"
            - name: OAUTH2_PROXY_UPSTREAMS
              # 200, not 202: istio/Envoy ext-authz treats ONLY 200 as "allow" — a 202
              # is read as a denial and its body ("Authenticated") is returned to the
              # client instead of forwarding to the app. 200 → allow → request reaches calibre.
              value: "static://200"
            - name: OAUTH2_PROXY_PROVIDER
              value: "oidc"
            - name: OAUTH2_PROXY_OIDC_GROUPS_CLAIM
              value: "roles"
            - name: OAUTH2_PROXY_ALLOWED_GROUPS
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secrets
                  key: OAUTH2_PROXY_ALLOWED_GROUPS
            - name: OAUTH2_PROXY_OIDC_ISSUER_URL
              value: "https://sso.prplanit.com"
            # No fixed REDIRECT_URL: with reverse-proxy=true oauth2-proxy derives the
            # OIDC callback per-host from the request (e.g. books.pcfae.com/oauth2/callback),
            # so login returns to the originating app instead of bouncing to oa2p. Each
            # SSO host's /oauth2/callback must be registered on the Zitadel app.
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secrets
                  key: OAUTH2_PROXY_CLIENT_ID
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secrets
                  key: OAUTH2_PROXY_CLIENT_SECRET
            - name: OAUTH2_PROXY_BANNER
              value: "The requested application is secured by PrecisionPlanIT's authorization proxy."
            - name: OAUTH2_PROXY_CUSTOM_SIGN_IN_LOGO
              value: "https://support.pcfae.com/logo.php"
            - name: OAUTH2_PROXY_PROVIDER_DISPLAY_NAME
              value: "PrecisionPlanIT SSO"
            - name: OAUTH2_PROXY_THEME
              value: "dark"
            # Behind the istio gateway acting as ext-authz for many hosts:
            - name: OAUTH2_PROXY_REVERSE_PROXY        # trust the gateway's X-Forwarded-* (host/proto) → absolute return URLs
              value: "true"
            - name: OAUTH2_PROXY_SET_XAUTHREQUEST     # emit X-Auth-Request-User/Email/Groups so istio authz can read the role
              value: "true"
            - name: OAUTH2_PROXY_SKIP_PROVIDER_BUTTON # unauthenticated → straight to Zitadel (no interstitial page)
              value: "true"
