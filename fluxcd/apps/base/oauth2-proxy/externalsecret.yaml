apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: PLACEHOLDER_SECRET_STORE
    kind: ClusterSecretStore
  target:
    name: oauth2-proxy-secrets
    creationPolicy: Owner
  data:
    - secretKey: OAUTH2_PROXY_CLIENT_ID
      remoteRef:
        key: apps/oauth2-proxy/oidc
        property: CLIENT_ID
    - secretKey: OAUTH2_PROXY_CLIENT_SECRET
      remoteRef:
        key: apps/oauth2-proxy/oidc
        property: CLIENT_SECRET
    - secretKey: OAUTH2_PROXY_COOKIE_SECRET
      remoteRef:
        key: apps/oauth2-proxy/app
        property: COOKIE_SECRET
