apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: semaphore-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-semaphore
    kind: SecretStore
  target:
    name: semaphore-secrets
    creationPolicy: Owner
  data:
    - secretKey: postgres_user
      remoteRef:
        key: apps/semaphore/postgres
        property: USER
    - secretKey: postgres_password
      remoteRef:
        key: apps/semaphore/postgres
        property: PASSWORD
    - secretKey: admin_username
      remoteRef:
        key: apps/semaphore/app
        property: ADMIN_USERNAME
    - secretKey: admin_name
      remoteRef:
        key: apps/semaphore/app
        property: ADMIN_NAME
    - secretKey: admin_email
      remoteRef:
        key: apps/semaphore/app
        property: ADMIN_EMAIL
    - secretKey: admin_password
      remoteRef:
        key: apps/semaphore/app
        property: ADMIN_PASSWORD
    - secretKey: access_key_encryption
      remoteRef:
        key: apps/semaphore/app
        property: ACCESS_KEY_ENCRYPTION
