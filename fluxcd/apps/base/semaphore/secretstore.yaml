# Reads only semaphore's entries, as its ServiceAccount.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-semaphore
spec:
  provider:
    vault:
      server: "http://openbao.optcp-secrets.svc.cluster.local:8200"
      path: "optcp"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "semaphore"
          serviceAccountRef:
            name: semaphore
