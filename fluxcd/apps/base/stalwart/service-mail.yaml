apiVersion: v1
kind: Service
metadata:
  name: stalwart-mail
  labels:
    app: stalwart
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: stalwart
  ports:
    - name: smtp
      port: 25
      targetPort: smtp
    - name: submissions
      port: 465
      targetPort: submissions
    - name: submission
      port: 587
      targetPort: submission
    - name: imaps
      port: 993
      targetPort: imaps
