apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stalwart-redis-password
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-optcp
    kind: ClusterSecretStore
  target:
    name: stalwart-redis-password
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: apps/stalwart/redis
        property: PASSWORD
