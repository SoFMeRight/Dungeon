# The Gmail logins Stalwart's sync reads (apps/stalwart/smtp-<gmail user>, discovered by
# prefix so no address is named here) and the sync's own Stalwart app password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stalwart-gmail-sync
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-optcp
  target:
    name: stalwart-gmail-sync
    creationPolicy: Owner
  data:
    - secretKey: STALWART_APP_PASSWORD
      remoteRef:
        key: apps/stalwart/app
        property: GMAIL_SYNC_APP_PASSWORD
  dataFrom:
    - find:
        path: apps/stalwart
        name:
          regexp: "smtp-"
      rewrite:
        - regexp:
            source: "^.*/"
            target: ""
