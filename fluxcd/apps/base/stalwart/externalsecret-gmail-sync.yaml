# The mailbox logins the sync reads, discovered by prefix so no address is named here, and
# the sync's own login on the target.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stalwart-gmail-sync
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: PLACEHOLDER_SECRET_STORE
  target:
    name: stalwart-gmail-sync
    creationPolicy: Owner
  data:
    - secretKey: TARGET_PASSWORD
      remoteRef:
        key: PLACEHOLDER_TARGET_PASSWORD_PATH
        property: APP_PASSWORD
  dataFrom:
    - find:
        path: PLACEHOLDER_ENTRY_PATH
        name:
          regexp: PLACEHOLDER_ENTRY_REGEXP
      rewrite:
        - regexp:
            source: "^.*/"
            target: ""
