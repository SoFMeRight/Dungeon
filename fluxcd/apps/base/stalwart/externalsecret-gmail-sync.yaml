# The Gmail logins the sync reads (apps/stalwart/smtp-<name>, discovered by prefix so no
# address is named here) and the sync's own identity (apps/stalwart/gmail-sync).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stalwart-gmail-sync
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-optcp
  target:
    name: stalwart-gmail-sync
    creationPolicy: Owner
  data:
    - secretKey: STALWART_APP_PASSWORD
      remoteRef:
        key: apps/stalwart/gmail-sync
        property: APP_PASSWORD
  dataFrom:
    - find:
        path: apps/stalwart
        name:
          regexp: "smtp-"
      rewrite:
        - regexp:
            source: "^.*/"
            target: ""
