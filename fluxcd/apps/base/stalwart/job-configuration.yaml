apiVersion: batch/v1
kind: Job
metadata:
  name: stalwart-configuration
  annotations:
    kustomize.toolkit.fluxcd.io/force: "Enabled"  # immutable one-shot Job: force-replace on change, not wedge
spec:
  backoffLimit: 20
  template:
    metadata:
      labels:
        app: stalwart-configuration
    spec:
      serviceAccountName: stalwart-configuration
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # The plan carries client-id placeholders; the ids live in OpenBao, not in git.
        - name: render-plan
          image: docker.io/busybox:1.38
          command:
            - sh
            - -ec
            - |
              : "${STALWART_OIDC_CLIENT_ID:?}" "${BULWARK_OIDC_CLIENT_ID:?}"
              sed -e "s/@STALWART_OIDC_CLIENT_ID@/${STALWART_OIDC_CLIENT_ID}/g" \
                  -e "s/@BULWARK_OIDC_CLIENT_ID@/${BULWARK_OIDC_CLIENT_ID}/g" \
                  /plan/plan.ndjson > /rendered/plan.ndjson
              ! grep -q '@[A-Z_]*@' /rendered/plan.ndjson
          env:
            - name: STALWART_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: stalwart-secret
                  key: STALWART_OIDC_CLIENT_ID
            - name: BULWARK_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: stalwart-secret
                  key: BULWARK_OIDC_CLIENT_ID
          resources:
            requests:
              memory: 8Mi
              cpu: 5m
            limits:
              memory: 32Mi
              cpu: 50m
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: plan
              mountPath: /plan
              readOnly: true
            - name: rendered
              mountPath: /rendered
        - name: configuration
          image: PLACEHOLDER_CLI_IMAGE
          args: ["apply", "--file", "/rendered/plan.ndjson"]
          env:
            - name: HOME
              value: /tmp
            - name: STALWART_URL
              value: http://stalwart:8080
            - name: STALWART_USER
              valueFrom:
                secretKeyRef:
                  name: stalwart-secret
                  key: STALWART_USER
            - name: STALWART_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stalwart-secret
                  key: STALWART_PASSWORD
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: rendered
              mountPath: /rendered
              readOnly: true
            - name: tmp
              mountPath: /tmp
      containers:
        # Identities Stalwart issues for other workloads, written to OpenBao (issuers write; they
        # read only the metadata they record): the Gmail sync's IMAP-only app password on its own
        # account, and one empty smtp-<name> entry per declared Gmail mailbox for the Operator to fill.
        - name: identities
          image: PLACEHOLDER_K8S_IMAGE
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              : "${ACCOUNT_NAME:?}" "${APP_PASSWORD_NAME:?}" "${APP_PASSWORD_PERMISSIONS:?}" "${ROTATION:?}" "${VAULT_ADDR:?}" "${VAULT_ROLE:?}" \
                "${VAULT_MOUNT:?}" "${APP_PASSWORD_PATH:?}" "${SEED_PREFIX:?}" "${GMAIL_MAILBOXES:?}" "${IMAP_HOST:?}" "${IMAP_PORT:?}"
              auth="$STALWART_USER:$STALWART_PASSWORD"
              api="$STALWART_URL/jmap/"
              jmap() {
                curl -fsS -u "$auth" -H 'Content-Type: application/json' "$api" \
                  -d "$(jq -cn --arg m "$1" --argjson a "$2" '{using:["urn:ietf:params:jmap:core","urn:stalwart:jmap"],methodCalls:[[$m,$a,"c0"]]}')" \
                  | jq -c '.methodResponses[0][1]'
              }
              JWT=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              TOKEN=$(curl -sS -X POST "$VAULT_ADDR/v1/auth/kubernetes/login" \
                -d "$(jq -cn --arg j "$JWT" --arg r "$VAULT_ROLE" '{jwt:$j,role:$r}')" | jq -r '.auth.client_token // empty')
              unset JWT
              [ -n "$TOKEN" ] || { echo "openbao login as role $VAULT_ROLE failed"; exit 1; }
              h="X-Vault-Token: $TOKEN"

              acct=$(jmap x:Account/query "$(jq -cn --arg n "$ACCOUNT_NAME" '{filter:{name:$n}}')" | jq -r '.ids[0] // empty')
              [ -n "$acct" ] || { echo "no account named $ACCOUNT_NAME"; exit 1; }
              # One app password, minted only when the recorded one is gone or ROTATION changes.
              # Each is named <APP_PASSWORD_NAME>-<time>, a name never reused; the entry's metadata
              # (never the secret) records it as <id>:<name>, and only an app password matching a
              # recorded id and name is ever destroyed.
              meta="$VAULT_ADDR/v1/$VAULT_MOUNT/metadata/$APP_PASSWORD_PATH"
              code=$(curl -s -o /tmp/meta.json -w '%{http_code}' -H "$h" "$meta")
              case "$code" in
                200) jq -c '.data.custom_metadata // {}' /tmp/meta.json > /tmp/rec.json ;;
                404) echo '{}' > /tmp/rec.json ;;
                *) echo "openbao metadata read: http $code"; exit 1 ;;
              esac
              jmap x:AppPassword/get "$(jq -cn --arg a "$acct" '{accountId:$a}')" \
                | jq -c '[(.list // [])[] | "\(.id):\(.description)"]' > /tmp/live.json
              live() { [ -n "$1" ] && jq -e --arg r "$1" 'index($r) != null' /tmp/live.json >/dev/null; }
              current=$(jq -r '.app_password // ""' /tmp/rec.json)
              pending=$(jq -r '.pending // ""' /tmp/rec.json)
              destroy() {
                live "$1" || return 0
                jmap x:AppPassword/set "$(jq -cn --arg a "$acct" --arg i "${1%%:*}" '{accountId:$a,destroy:[$i]}')" \
                  | jq -e '(.destroyed // []) | length == 1' >/dev/null
              }
              if live "$current" && [ -z "$pending" ] && [ "$(jq -r '.rotation // ""' /tmp/rec.json)" = "$ROTATION" ]; then
                echo "$APP_PASSWORD_NAME app password on $ACCOUNT_NAME: in place"
              else
                name="$APP_PASSWORD_NAME-$(date -u +%Y%m%dT%H%M%SZ)"
                resp=$(jmap x:AppPassword/set "$(jq -cn --arg a "$acct" --arg d "$name" --arg p "$APP_PASSWORD_PERMISSIONS" \
                  '{accountId:$a,create:{n0:{description:$d,permissions:{"@type":"Replace",permissions:($p | split(" ") | map({(.):true}) | add)}}}}')")
                id=$(echo "$resp" | jq -r '.created.n0.id // empty')
                secret=$(echo "$resp" | jq -r '.created.n0.secret // empty')
                [ -n "$id" ] && [ -n "$secret" ] || { echo "no app password created for $APP_PASSWORD_NAME: $(echo "$resp" | jq -c 'del(.created)')"; exit 1; }
                new="$id:$name"
                echo "[\"$new\"]" | jq -c '. + input' - /tmp/live.json > /tmp/live2.json && mv /tmp/live2.json /tmp/live.json
                # OpenBao refuses empty metadata values, so only the keys that have one are written.
                record() {
                  c=$(curl -s -o /tmp/record.json -w '%{http_code}' -H "$h" -X POST "$meta" \
                    -d "$(jq -cn --argjson c "$1" '{custom_metadata:($c | with_entries(select(.value != "")))}')")
                  case "$c" in 2??) ;; *) echo "openbao metadata write: http $c $(jq -c '.errors' /tmp/record.json 2>/dev/null)"; return 1 ;; esac
                }
                # Recorded as pending first, so a run that dies before the swap leaves its name to clean up.
                record "$(jq -cn --arg c "$current" --arg p "$new" --arg r "$ROTATION" '{app_password:$c,pending:$p,rotation:$r}')" \
                  && curl -fsS -H "$h" -X POST "$VAULT_ADDR/v1/$VAULT_MOUNT/data/$APP_PASSWORD_PATH" \
                    -d "$(jq -cn --arg s "$secret" '{data:{APP_PASSWORD:$s}}')" >/dev/null \
                  && record "$(jq -cn --arg c "$new" --arg r "$ROTATION" '{app_password:$c,pending:"",rotation:$r}')" \
                  || { unset secret; destroy "$new"; echo "storing $APP_PASSWORD_NAME failed; new app password removed"; exit 1; }
                unset secret
                for old in "$current" "$pending"; do
                  [ "$old" = "$new" ] && continue
                  destroy "$old" || { echo "removing replaced $APP_PASSWORD_NAME app password failed"; exit 1; }
                done
                echo "$APP_PASSWORD_NAME app password on $ACCOUNT_NAME: minted (rotation $ROTATION)"
              fi

              for m in $GMAIL_MAILBOXES; do
                code=$(curl -s -o /dev/null -w '%{http_code}' -H "$h" -X POST "$VAULT_ADDR/v1/$VAULT_MOUNT/data/${SEED_PREFIX}$m" \
                  -d "$(jq -cn --arg host "$IMAP_HOST" --arg port "$IMAP_PORT" '{options:{cas:0},data:{HOST:$host,PORT:$port,USERNAME:"",PASSWORD:"",FROM:""}}')")
                case "$code" in
                  200) echo "seeded ${SEED_PREFIX}$m" ;;
                  400) ;;
                  *) echo "seeding ${SEED_PREFIX}$m: http $code"; exit 1 ;;
                esac
              done
              curl -sS -H "$h" -X POST "$VAULT_ADDR/v1/auth/token/revoke-self" >/dev/null || true
          env:
            - name: HOME
              value: /tmp
            - name: STALWART_URL
              value: http://stalwart:8080
            - name: STALWART_USER
              valueFrom:
                secretKeyRef:
                  name: stalwart-secret
                  key: STALWART_USER
            - name: STALWART_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stalwart-secret
                  key: STALWART_PASSWORD
            - name: ACCOUNT_NAME
              value: PLACEHOLDER_ACCOUNT_NAME
            - name: APP_PASSWORD_NAME
              value: PLACEHOLDER_APP_PASSWORD_NAME
            - name: APP_PASSWORD_PERMISSIONS
              value: PLACEHOLDER_APP_PASSWORD_PERMISSIONS
            - name: ROTATION
              value: PLACEHOLDER_ROTATION
            - name: VAULT_ADDR
              value: PLACEHOLDER_VAULT_ADDR
            - name: VAULT_ROLE
              value: PLACEHOLDER_VAULT_ROLE
            - name: VAULT_MOUNT
              value: PLACEHOLDER_VAULT_MOUNT
            - name: APP_PASSWORD_PATH
              value: PLACEHOLDER_APP_PASSWORD_PATH
            - name: SEED_PREFIX
              value: PLACEHOLDER_SEED_PREFIX
            - name: GMAIL_MAILBOXES
              value: PLACEHOLDER_GMAIL_MAILBOXES
            - name: IMAP_HOST
              value: PLACEHOLDER_IMAP_HOST
            - name: IMAP_PORT
              value: PLACEHOLDER_IMAP_PORT
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: plan
          configMap:
            name: stalwart-plan
        - name: rendered
          emptyDir:
            sizeLimit: 1Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
