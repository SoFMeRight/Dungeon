# Copies each Gmail mailbox into folders under the Stalwart login (gmail-sync.sh); every
# value is the overlay's.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: stalwart-gmail-sync
  labels:
    app: stalwart-gmail-sync
spec:
  schedule: PLACEHOLDER_SCHEDULE
  timeZone: PLACEHOLDER_TIMEZONE
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: stalwart-gmail-sync
        spec:
          serviceAccountName: stalwart-gmail-sync
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: imapsync
              image: PLACEHOLDER_IMAGE
              command: ["/bin/sh", "/scripts/gmail-sync.sh"]
              env:
                - name: SOURCE_DIR
                  value: /secrets
                - name: ENTRY_PREFIX
                  value: PLACEHOLDER_ENTRY_PREFIX
                - name: TARGET_HOST
                  value: PLACEHOLDER_TARGET_HOST
                - name: TARGET_PORT
                  value: PLACEHOLDER_TARGET_PORT
                - name: TARGET_TLS_NAME
                  value: PLACEHOLDER_TARGET_TLS_NAME
                - name: TARGET_USERNAME
                  value: PLACEHOLDER_TARGET_USERNAME
                - name: TARGET_PASSWORD_KEY
                  value: TARGET_PASSWORD
                - name: FOLDER_PREFIX
                  value: PLACEHOLDER_FOLDER_PREFIX
                - name: EXCLUDE
                  value: PLACEHOLDER_EXCLUDE
                - name: IMAPSYNC_OPTIONS
                  value: PLACEHOLDER_IMAPSYNC_OPTIONS
                - name: HOME
                  value: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 1Gi
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
                - name: secrets
                  mountPath: /secrets
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
                # imapsync keeps its per-user state under /var/tmp regardless of --tmpdir.
                - name: var-tmp
                  mountPath: /var/tmp
                # imapsync keeps its per-user state under /var/tmp regardless of --tmpdir.
                - name: var-tmp
                  mountPath: /var/tmp
          volumes:
            - name: script
              configMap:
                name: stalwart-gmail-sync-script
            - name: secrets
              secret:
                secretName: stalwart-gmail-sync
            - name: tmp
              emptyDir:
                sizeLimit: 512Mi
            - name: var-tmp
              emptyDir:
                sizeLimit: 512Mi
            - name: var-tmp
              emptyDir:
                sizeLimit: 512Mi
