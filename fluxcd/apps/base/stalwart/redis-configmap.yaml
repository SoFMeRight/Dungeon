apiVersion: v1
kind: ConfigMap
metadata:
  name: stalwart-redis-config
  labels:
    app: stalwart-redis
    component: redis
data:
  redis.conf: |
    # Stalwart's in-memory store: rate limits, locks, queue coordination, short-lived auth state.
    bind 0.0.0.0
    port 6379
    protected-mode yes

    # Persistence
    save 900 1
    save 300 10
    save 60 10000
    stop-writes-on-bgsave-error yes
    rdbcompression yes
    rdbchecksum yes
    dbfilename dump.rdb
    dir /data

    # Replication
    replica-serve-stale-data yes
    replica-read-only yes
    repl-diskless-sync no
    replica-priority 100

    # Memory: refuse writes when full rather than evict, so locks and rate limits are never
    # silently dropped.
    maxmemory 200mb
    maxmemory-policy noeviction

    loglevel notice
    logfile ""
    slowlog-log-slower-than 10000
    slowlog-max-len 128
