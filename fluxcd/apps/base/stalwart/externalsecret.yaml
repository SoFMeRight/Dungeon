apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stalwart-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-optcp
  target:
    name: stalwart-secret
    creationPolicy: Owner
    template:
      data:
        STALWART_RECOVERY_ADMIN: "{{ .recoveryAdmin }}"
        STALWART_USER: "{{ (splitn \":\" 2 .recoveryAdmin)._0 }}"
        STALWART_PASSWORD: "{{ (splitn \":\" 2 .recoveryAdmin)._1 }}"
        STALWART_DB_PASSWORD: "{{ .dbPassword }}"
        STALWART_S3_ACCESS_KEY: "{{ .s3AccessKey }}"
        STALWART_S3_SECRET_KEY: "{{ .s3SecretKey }}"
        STALWART_OIDC_CLIENT_ID: "{{ .stalwartOidcClientId }}"
        BULWARK_OIDC_CLIENT_ID: "{{ .bulwarkOidcClientId }}"
  data:
    - secretKey: recoveryAdmin
      remoteRef:
        key: apps/stalwart/app
        property: RECOVERY_ADMIN
    - secretKey: dbPassword
      remoteRef:
        key: apps/stalwart/postgres
        property: PASSWORD
    - secretKey: s3AccessKey
      remoteRef:
        key: apps/stalwart/s3-optcp
        property: ACCESS_KEY
    - secretKey: s3SecretKey
      remoteRef:
        key: apps/stalwart/s3-optcp
        property: SECRET_KEY
    - secretKey: stalwartOidcClientId
      remoteRef:
        key: apps/stalwart/oidc
        property: CLIENT_ID
    - secretKey: bulwarkOidcClientId
      remoteRef:
        key: apps/bulwark/oidc
        property: CLIENT_ID
