apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-operationtimecapsule
    kind: ClusterSecretStore
  target:
    name: immich-db
    creationPolicy: Owner
  data:
    - secretKey: database
      remoteRef:
        key: apps/immich
        property: POSTGRES_DB
    - secretKey: username
      remoteRef:
        key: apps/immich
        property: POSTGRES_USER
    - secretKey: password
      remoteRef:
        key: apps/immich
        property: POSTGRES_PASSWORD
    - secretKey: OIDC_CLIENT_ID
      remoteRef:
        key: apps/immich
        property: OIDC_CLIENT_ID
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: apps/immich
        property: OIDC_CLIENT_SECRET
