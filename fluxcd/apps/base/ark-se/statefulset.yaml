apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ark-se-tmc
spec:
  revisionHistoryLimit: 5
  serviceName: ark-se-tmc
  replicas: 1
  selector:
    matchLabels:
      app: ark-se-tmc
  template:
    metadata:
      labels:
        app: ark-se-tmc
    spec:
      serviceAccountName: ark-se-tmc
      enableServiceLinks: false
      # ARK:SE server needs root/sudo (arkmanager install/update path), so non-root/RO-root aren't
      # feasible without an image rebuild — see the Root Required section of docs/container-security-audit.md.
      # seccomp RuntimeDefault is the one axis it can take without touching that.
      securityContext:
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: theisland
          # Our own fork build (HomeLabHD/ark-se-server) — the upstream drpsychick :latest-v1.6.62
          # tag ships without arkmanager (broken build). This is arkmanager v1.6.69 with a guarded
          # install, built via stagefreight from the fork.
          image: ghcr.io/homelabhd/ark-se-server:v1.6.69
          ports:
            - containerPort: 7797
              protocol: UDP
              name: game-udp
            - containerPort: 7797
              protocol: TCP
              name: game-tcp
            - containerPort: 27057
              protocol: UDP
              name: query-udp
            - containerPort: 27057
              protocol: TCP
              name: query-tcp
            - containerPort: 27095
              protocol: TCP
              name: rcon
          env:
            - name: am_ark_SessionName
              value: "ARK Server - The Island"
            - name: am_serverMap
              value: TheIsland
            - name: am_ark_QueryPort
              value: "27057"
            - name: am_ark_Port
              value: "7797"
            - name: am_ark_RCONPort
              value: "27095"
            - name: am_arkNoPortDecrement
              value: "true"
            - name: am_ark_MaxPlayers
              value: "10"
            - name: am_arkAutoUpdateOnStart
              value: "true"
            - name: ARKCLUSTER
              value: "true"
            - name: am_arkflag_ForceAllowCaveFlyers
              value: "true"
            - name: am_arkflag_crossplay
              value: "true"
            - name: ARKSERVER_SHARED
              value: "/arkserver"
          resources:
            limits:
              memory: 16Gi
            requests:
              memory: 12Gi
              cpu: 2000m
          stdin: true
          tty: true
          volumeMounts:
            - name: ark-data
              mountPath: /ark
            - name: ark-saved
              mountPath: /arkserver/ShooterGame/Saved
            - name: ark-cluster
              mountPath: /arkserver/ShooterGame/Saved/clusters
            - name: ark-serverfiles
              mountPath: /arkserver
  volumeClaimTemplates:
    - metadata:
        name: ark-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 50Gi
    - metadata:
        name: ark-saved
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 50Gi
    - metadata:
        name: ark-cluster
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
    - metadata:
        name: ark-serverfiles
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 250Gi
