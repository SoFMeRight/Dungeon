apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homebox-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-zeldas-letter
    kind: ClusterSecretStore
  target:
    name: homebox-secrets
    creationPolicy: Owner
  data:
    - secretKey: HBOX_AUTH_API_KEY_PEPPER
      remoteRef:
        key: apps/homebox
        property: HBOX_AUTH_API_KEY_PEPPER
    - secretKey: OIDC_CLIENT_ID
      remoteRef:
        key: apps/homebox
        property: OIDC_CLIENT_ID
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: apps/homebox
        property: OIDC_CLIENT_SECRET
