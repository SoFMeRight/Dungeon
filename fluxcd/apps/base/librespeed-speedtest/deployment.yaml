apiVersion: apps/v1
kind: Deployment
metadata:
  name: librespeed-speedtest
spec:
  revisionHistoryLimit: 5
  replicas: 1
  selector:
    matchLabels:
      app: librespeed-speedtest
  template:
    metadata:
      labels:
        app: librespeed-speedtest
    spec:
      serviceAccountName: librespeed-speedtest
      # Full non-root: it's a speedtest on unprivileged :8080 — no root needed. The official
      # librespeed image defaults to root apache only by convention (stock master→setuid-drop);
      # every path it writes is 1777 world-writable + www-data-owned — /var/www/html (the
      # entrypoint cp's the frontend there at boot), /run/apache2 + /var/lock/apache2 (apache
      # pid/lock) — so it runs cleanly as uid 33 (www-data) with no caps.
      securityContext:
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: librespeed-speedtest
          image: PLACEHOLDER_IMAGE
          # readOnlyRootFilesystem NOT enabled: the entrypoint cp's the frontend into the baked
          # web root /var/www/html at boot, which needs a writable rootfs.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: PLACEHOLDER_CONFIGMAP
          resources:
            requests:
              cpu: PLACEHOLDER_CPU
              memory: PLACEHOLDER_MEMORY
            limits:
              cpu: PLACEHOLDER_CPU_LIMIT
              memory: PLACEHOLDER_MEMORY_LIMIT
