apiVersion: apps/v1
kind: Deployment
metadata:
  name: librespeed-speedtest
spec:
  revisionHistoryLimit: 5
  replicas: 1
  selector:
    matchLabels:
      app: librespeed-speedtest
  template:
    metadata:
      labels:
        app: librespeed-speedtest
    spec:
      serviceAccountName: librespeed-speedtest
      # Full non-root on the lean alpine image: a speedtest on unprivileged :8080 needs no root.
      # Alpine apache runs as apache (uid 100 / gid 101) and bakes its runtime dirs 0755-root, so
      # every path the entrypoint/apache writes is an emptyDir — /var/www/html (frontend cp),
      # /run/apache2 (pid + mutex), /tmp — plus /etc/apache2 (entrypoint sed's Listen + docroot
      # into httpd.conf), seeded writable by an initContainer. Logs are symlinked to stdout/stderr.
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Seed a writable copy of the baked /etc/apache2 so the non-root entrypoint can rewrite
        # httpd.conf (Listen port + docroot). Runs as uid 100, so the copy is uid-100-owned; the
        # alpine config tree has no symlinks, so a plain recursive copy is faithful.
        - name: seed-apache-config
          image: PLACEHOLDER_IMAGE
          command:
            - sh
            - -c
            - |
              cp -r /etc/apache2/. /seed/
              # Point apache's logs at a piped logger: /bin/cat inherits the container's stdout
              # and writes there. A child writing to an INHERITED fd is non-root-safe, unlike
              # reopening the /dev/stderr,/dev/stdout log symlinks (EACCES) — so logs reach
              # `kubectl logs` while the process stays non-root.
              sed -i \
                -e 's#ErrorLog logs/error.log#ErrorLog "|/bin/cat"#' \
                -e 's#CustomLog logs/access.log combined#CustomLog "|/bin/cat" combined#' \
                /seed/httpd.conf
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: apache-config
              mountPath: /seed
      containers:
        - name: librespeed-speedtest
          image: PLACEHOLDER_IMAGE
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: PLACEHOLDER_CONFIGMAP
          volumeMounts:
            - name: apache-config
              mountPath: /etc/apache2
            - name: www-html
              mountPath: /var/www/html
            - name: apache-run
              mountPath: /run/apache2
            - name: tmp
              mountPath: /tmp
            # Writable fallback for /var/log/apache2 (where the /dev/stdout,/dev/stderr log
            # symlinks live). Logs actually flow through the initContainer's piped-logger config
            # to the container stdout (kubectl logs); this just keeps the dir writable so apache
            # never fails on it.
            - name: apache-logs
              mountPath: /var/log/apache2
          resources:
            requests:
              cpu: PLACEHOLDER_CPU
              memory: PLACEHOLDER_MEMORY
            limits:
              cpu: PLACEHOLDER_CPU_LIMIT
              memory: PLACEHOLDER_MEMORY_LIMIT
      volumes:
        - name: apache-config
          emptyDir: {}
        - name: www-html
          emptyDir: {}
        - name: apache-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: apache-logs
          emptyDir: {}
