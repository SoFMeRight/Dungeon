apiVersion: apps/v1
kind: Deployment
metadata:
  name: librespeed-speedtest
spec:
  revisionHistoryLimit: 5
  replicas: 1
  selector:
    matchLabels:
      app: librespeed-speedtest
  template:
    metadata:
      labels:
        app: librespeed-speedtest
    spec:
      serviceAccountName: librespeed-speedtest
      containers:
        - name: librespeed-speedtest
          image: PLACEHOLDER_IMAGE
          # apache image: master runs root → setuid-drops workers to www-data. Partial hardening:
          # keep root, drop ALL, add back apache's file-perm + setuid + privileged-bind caps.
          securityContext:
            seccompProfile:
              type: RuntimeDefault
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - SETUID
                - SETGID
                - NET_BIND_SERVICE
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: PLACEHOLDER_CONFIGMAP
          resources:
            requests:
              cpu: PLACEHOLDER_CPU
              memory: PLACEHOLDER_MEMORY
            limits:
              cpu: PLACEHOLDER_CPU_LIMIT
              memory: PLACEHOLDER_MEMORY_LIMIT
