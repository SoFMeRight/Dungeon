apiVersion: apps/v1
kind: Deployment
metadata:
  name: librespeed-speedtest
spec:
  revisionHistoryLimit: 5
  replicas: 1
  selector:
    matchLabels:
      app: librespeed-speedtest
  template:
    metadata:
      labels:
        app: librespeed-speedtest
    spec:
      serviceAccountName: librespeed-speedtest
      containers:
        - name: librespeed-speedtest
          image: PLACEHOLDER_IMAGE
          # apache image: master runs root → setuid-drops workers to www-data. Stays root
          # (drop ALL + file-perm/setuid/bind caps), but the rootfs is now immutable
          # (readOnlyRootFilesystem): apache's writable dirs — APACHE_RUN_DIR (/run/apache2),
          # APACHE_LOCK_DIR (/run/lock/apache2) and /tmp — are emptyDirs; logs → stdout/stderr.
          securityContext:
            seccompProfile:
              type: RuntimeDefault
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - SETUID
                - SETGID
                - NET_BIND_SERVICE
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: PLACEHOLDER_CONFIGMAP
          resources:
            requests:
              cpu: PLACEHOLDER_CPU
              memory: PLACEHOLDER_MEMORY
            limits:
              cpu: PLACEHOLDER_CPU_LIMIT
              memory: PLACEHOLDER_MEMORY_LIMIT
          volumeMounts:
            - name: apache-run
              mountPath: /run/apache2
            - name: apache-lock
              mountPath: /run/lock/apache2
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: apache-run
          emptyDir: {}
        - name: apache-lock
          emptyDir: {}
        - name: tmp
          emptyDir: {}
