# Converges the cluster's hosts in two halves so no run touches the node it is on:
# this CronJob does the control plane but its own node, then fires a hand-off Job
# (from this same template) for that node and the workers. See converge.sh.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: node-converge
spec:
  schedule: PLACEHOLDER_SCHEDULE
  timeZone: PLACEHOLDER_TIMEZONE
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: node-converge
        spec:
          serviceAccountName: node-converge
          restartPolicy: Never
          nodeSelector:
            node-role.kubernetes.io/control-plane: ""
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: converge
              image: PLACEHOLDER_IMAGE
              command: ["/bin/sh", "/scripts/converge.sh"]
              env:
                - name: CONVERGE_PHASE
                  value: control-plane
                - name: CRONJOB_NAME
                  value: node-converge
                - name: REPO_URL
                  value: PLACEHOLDER_REPO_URL
                - name: NODE_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: spec.nodeName
                - name: HOST_IP
                  valueFrom:
                    fieldRef:
                      fieldPath: status.hostIP
                - name: HOME
                  value: /tmp
                - name: ANSIBLE_LOCAL_TEMP
                  value: /tmp/.ansible
                - name: BAO_ADDR
                  value: PLACEHOLDER_BAO_ADDR
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: script
              configMap:
                name: node-converge-script
            - name: tmp
              emptyDir: {}
