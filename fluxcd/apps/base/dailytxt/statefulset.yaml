apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dailytxt
spec:
  revisionHistoryLimit: 5
  serviceName: dailytxt
  replicas: 1
  selector:
    matchLabels:
      app: dailytxt
  template:
    metadata:
      labels:
        app: dailytxt
    spec:
      serviceAccountName: dailytxt
      containers:
        - name: dailytxt
          image: PLACEHOLDER_IMAGE
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 80
              name: http
              protocol: TCP
          env:
            - name: SECRET_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dailytxt-secrets
                  key: secret_key
            - name: ALLOW_REGISTRATION
              value: "false"
            - name: INDENT
              value: "2"
            - name: LOGOUT_AFTER_DAYS
              value: "60"
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: 33Mi
              cpu: 2m
            limits:
              # Sign-in runs two argon2id derivations of 64 MiB each (verify, then derive the
              # encryption key), so a login peaks well above the idle working set. 96Mi, sized
              # from 30-day peaks that held no login, OOM-killed every sign-in.
              memory: 256Mi
              cpu: 200m
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: PLACEHOLDER_STORAGE_CLASS
        resources:
          requests:
            storage: 1Gi
