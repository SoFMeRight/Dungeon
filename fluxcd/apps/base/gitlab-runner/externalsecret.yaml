# The chart mounts both keys; this runner authenticates with a runner token
# (glrt-), so the legacy registration token stays empty.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-runner
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-optcp
  target:
    name: gitlab-runner
    creationPolicy: Owner
    template:
      data:
        runner-token: "{{ .token }}"
        runner-registration-token: ""
  data:
    - secretKey: token
      remoteRef:
        key: apps/gitlab-runner/gitlab.prplanit.com
        property: TOKEN
