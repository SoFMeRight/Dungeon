apiVersion: v1
kind: ServiceAccount
metadata:
  name: buildkitd
automountServiceAccountToken: false
---
# Rootless BuildKit (BuildKit's recommended Kubernetes mode, examples/kubernetes/
# deployment+service.rootless.yaml): buildkitd runs as uid 1000 and builds inside its
# own user namespace. Instead of the example's Unconfined profiles it runs on two
# Localhost profiles the nodes carry (ansible/k8s/tuning), which baseline Pod Security
# allows:
#   - seccomp profiles/buildkitd.json: CRI-O's default plus namespace creation
#   - AppArmor buildkitd: grants userns past apparmor_restrict_unprivileged_userns
# Only privilege escalation and capabilities are lifted: newuidmap/newgidmap are
# setuid/file-cap helpers.
# --oci-worker-no-process-sandbox: Kubernetes has no systempaths=unconfined, so build steps
# share buildkitd's PID namespace (BuildKit's documented caveat for this mode).
# The build cache is its own volume (buildkitd-state); buildkitd-config, from the overlay,
# sets its GC budget and registry mirrors.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: buildkitd
spec:
  serviceName: buildkitd
  replicas: 1
  selector:
    matchLabels:
      app: buildkitd
  template:
    metadata:
      annotations:
        backup.velero.io/backup-volumes-excludes: buildkitd-state
      labels:
        app: buildkitd
        policy.prplanit.com/except-no-privesc: "true"
        policy.prplanit.com/except-drop-caps: "true"
    spec:
      serviceAccountName: buildkitd
      automountServiceAccountToken: false
      # fsGroup makes the fresh state volume writable by the rootless uid.
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: buildkitd
          image: docker.io/moby/buildkit:v0.34.2-rootless
          args:
            - --addr
            - unix:///run/user/1000/buildkit/buildkitd.sock
            - --addr
            - tcp://0.0.0.0:1234
            - --tlscacert
            - /certs/ca.crt
            - --tlscert
            - /certs/tls.crt
            - --tlskey
            - /certs/tls.key
            - --oci-worker-no-process-sandbox
            - --config
            - /etc/buildkit/buildkitd.toml
          ports:
            - name: buildkitd
              containerPort: 1234
          readinessProbe:
            exec:
              command: ["buildctl", "debug", "workers"]
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: ["buildctl", "debug", "workers"]
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 10
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            seccompProfile:
              type: Localhost
              localhostProfile: profiles/buildkitd.json
            appArmorProfile:
              type: Localhost
              localhostProfile: buildkitd
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            - name: certs
              mountPath: /certs
              readOnly: true
            - name: config
              mountPath: /etc/buildkit
              readOnly: true
            - name: buildkitd-state
              mountPath: /home/user/.local/share/buildkit
            # rootlesskit's state directory
            - name: rootlesskit
              mountPath: /home/user/.local/tmp
            # buildctl (the health probes) keeps its client config here
            - name: docker-config
              mountPath: /home/user/.docker
            - name: run
              mountPath: /run/user/1000
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: certs
          secret:
            secretName: buildkitd-tls
        - name: config
          configMap:
            name: buildkitd-config
        # Runtime plumbing only: memory-backed, so nothing lands on the node's disk.
        - name: rootlesskit
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: docker-config
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: run
          emptyDir:
            medium: Memory
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
  volumeClaimTemplates:
    - metadata:
        name: buildkitd-state
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: PLACEHOLDER_STORAGE_CLASS
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: buildkitd
spec:
  selector:
    app: buildkitd
  ports:
    - name: buildkitd
      port: 1234
      targetPort: buildkitd
