apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitlab-runner
spec:
  releaseName: gitlab-runner
  interval: 30m
  chart:
    spec:
      chart: gitlab-runner
      version: PLACEHOLDER_CHART_VERSION
      sourceRef:
        kind: HelmRepository
        name: gitlab
  install:
    remediation:
      retries: 3
  values:
    gitlabUrl: PLACEHOLDER_GITLAB_URL
    # Class and size of each job's scratch volume (job-scratch below); set by the overlay.
    jobScratch:
      storageClass: PLACEHOLDER_STORAGE_CLASS
      size: 5Gi
    concurrent: 4
    checkInterval: 10
    rbac:
      create: true
      # Only what the Kubernetes executor needs to run a job pod in its own namespace.
      rules:
        - resources: ["pods"]
          verbs: ["create", "delete", "get", "list", "watch"]
        - resources: ["pods/attach", "pods/exec"]
          verbs: ["create", "patch", "delete", "get"]
        - resources: ["pods/log"]
          verbs: ["get"]
        - resources: ["secrets"]
          verbs: ["create", "delete", "get", "update"]
        - resources: ["configmaps"]
          verbs: ["create", "delete", "get", "update"]
        - resources: ["events"]
          verbs: ["list", "watch"]
    serviceAccount:
      create: true
    runners:
      secret: gitlab-runner
      config: |
        [[runners]]
          # Image builds go to the rootless buildkitd beside the runner; StageFreight reads
          # BUILDKIT_HOST and the client certs at /buildkit-certs. HOME is on the job's
          # scratch volume, so buildx state works with a read-only rootfs.
          environment = [
            "BUILDKIT_HOST=tcp://buildkitd.{{ .Release.Namespace }}.svc:1234",
            "HOME=/home/runner",
            "SF_CACHE_ROOT=/stagefreight",
          ]
          [runners.feature_flags]
            # Without it [[runners.kubernetes.pod_spec]] is ignored.
            FF_USE_ADVANCED_POD_SPEC_CONFIGURATION = true
          [runners.kubernetes]
            namespace = "{{ .Release.Namespace }}"
            image = "alpine:3.22"
            # Pull fresh, because pipelines run moving tags (latest-dev) that a node's
            # cached copy lets go stale; if the pull fails (registry or network down),
            # the runner falls back to the cached copy rather than failing the job.
            pull_policy = ["always", "if-not-present"]
            service_account = "gitlab-runner-jobs"
            automount_service_account_token = false
            poll_timeout = 600
            cpu_request = "100m"
            memory_request = "2Gi"
            memory_limit = "8Gi"
            helper_cpu_request = "50m"
            helper_memory_request = "64Mi"
            helper_memory_limit = "256Mi"
            # Job pods: non-root, read-only rootfs, no capabilities, no escalation.
            # A job that needs a writable path gets an emptyDir, never a looser pod.
            [runners.kubernetes.pod_security_context]
              run_as_non_root = true
              run_as_user = 1000
              run_as_group = 1000
              fs_group = 1000
            [runners.kubernetes.build_container_security_context]
              allow_privilege_escalation = false
              read_only_root_filesystem = true
              privileged = false
              [runners.kubernetes.build_container_security_context.capabilities]
                drop = ["ALL"]
            [runners.kubernetes.helper_container_security_context]
              allow_privilege_escalation = false
              read_only_root_filesystem = true
              privileged = false
              [runners.kubernetes.helper_container_security_context.capabilities]
                drop = ["ALL"]
            [runners.kubernetes.service_container_security_context]
              allow_privilege_escalation = false
              read_only_root_filesystem = true
              privileged = false
              [runners.kubernetes.service_container_security_context.capabilities]
                drop = ["ALL"]
            [runners.kubernetes.init_permissions_container_security_context]
              allow_privilege_escalation = false
              read_only_root_filesystem = true
              privileged = false
              [runners.kubernetes.init_permissions_container_security_context.capabilities]
                drop = ["ALL"]
            [[runners.kubernetes.volumes.pvc]]
              name = "gitlab-runner-cache"
              mount_path = "/stagefreight"
            [[runners.kubernetes.volumes.secret]]
              name = "buildkit-client-tls"
              mount_path = "/buildkit-certs"
              read_only = true
              [runners.kubernetes.volumes.secret.items]
                "ca.crt" = "ca.pem"
                "tls.crt" = "cert.pem"
                "tls.key" = "key.pem"
            [runners.kubernetes.pod_labels]
              "policy.prplanit.com/ci-job" = "true"
              "velero.io/exclude-from-backup" = "true"
            # The job's clone, /tmp and $HOME live on a per-job volume. scratch-init creates
            # the subPath directories as the job's uid: kubelet-created ones are root-owned.
            [[runners.kubernetes.pod_spec]]
              name = "job-scratch"
              patch_type = "strategic"
              patch = '''
                securityContext:
                  fsGroupChangePolicy: OnRootMismatch
                initContainers:
                  - name: scratch-init
                    image: docker.io/library/alpine:3.24
                    command: ["mkdir", "-p", "/scratch/builds", "/scratch/tmp", "/scratch/home"]
                    securityContext:
                      runAsNonRoot: true
                      runAsUser: 1000
                      runAsGroup: 1000
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                        drop: ["ALL"]
                    volumeMounts:
                      - name: scratch
                        mountPath: /scratch
                containers:
                  - name: build
                    volumeMounts:
                      - { name: scratch, mountPath: /builds, subPath: builds }
                      - { name: scratch, mountPath: /tmp, subPath: tmp }
                      - { name: scratch, mountPath: /home/runner, subPath: home }
                  - name: helper
                    volumeMounts:
                      - { name: scratch, mountPath: /builds, subPath: builds }
                      - { name: scratch, mountPath: /tmp, subPath: tmp }
                      - { name: scratch, mountPath: /home/runner, subPath: home }
                volumes:
                  - name: scratch
                    ephemeral:
                      volumeClaimTemplate:
                        spec:
                          accessModes: ["ReadWriteOnce"]
                          storageClassName: {{ .Values.jobScratch.storageClass }}
                          resources:
                            requests:
                              storage: {{ .Values.jobScratch.size }}
              '''
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      privileged: false
      capabilities:
        drop: ["ALL"]
    podSecurityContext:
      runAsUser: 100
      runAsGroup: 65533
      fsGroup: 65533
    volumeMounts:
      - name: tmp
        mountPath: /tmp
    volumes:
      - name: tmp
        emptyDir: {}
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
