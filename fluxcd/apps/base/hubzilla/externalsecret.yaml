apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hubzilla-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: PLACEHOLDER_SECRET_STORE
    kind: ClusterSecretStore
  target:
    name: hubzilla-secrets
    creationPolicy: Owner
  data:
    - secretKey: MYSQL_ROOT_PASSWORD
      remoteRef:
        key: apps/hubzilla
        property: MYSQL_ROOT_PASSWORD
    - secretKey: MYSQL_PASSWORD
      remoteRef:
        key: apps/hubzilla
        property: MYSQL_PASSWORD
---
# Hubzilla has no environment-variable configuration: its settings live in a PHP file
# inside the webroot, which the installer expects to write. The webroot is read-only by
# design here, so the file is supplied as a mount instead and the web installer skipped.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hubzilla-htconfig
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: PLACEHOLDER_SECRET_STORE
    kind: ClusterSecretStore
  target:
    name: hubzilla-htconfig
    creationPolicy: Owner
  data:
    - secretKey: .htconfig.php
      remoteRef:
        key: apps/hubzilla
        property: HTCONFIG_PHP
