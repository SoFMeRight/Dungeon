apiVersion: apps/v1
kind: Deployment
metadata:
  name: hubzilla
  labels:
    app: hubzilla
spec:
  revisionHistoryLimit: 5
  replicas: PLACEHOLDER_REPLICAS
  selector:
    matchLabels:
      app: hubzilla
  template:
    metadata:
      labels:
        app: hubzilla
        policy.prplanit.com/ingress: "true"
        policy.prplanit.com/cap.mariadb: "true"
        policy.prplanit.com/access-scope-mariadb: PLACEHOLDER_DB_SCOPE
    spec:
      serviceAccountName: hubzilla
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: PLACEHOLDER_HUBZILLA_IMAGE
          env:
            - name: SMTP_HOST
              value: "smtp.gmail.com"
            - name: SMTP_PORT
              value: "587"
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: hubzilla-secrets
                  key: SMTP_USER
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hubzilla-secrets
                  key: SMTP_PASSWORD
            - name: SMTP_FROM
              valueFrom:
                secretKeyRef:
                  name: hubzilla-secrets
                  key: SMTP_FROM
          securityContext:
            runAsNonRoot: true
            runAsUser: 33
            runAsGroup: 33
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /siteinfo.json
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: store
              mountPath: /var/www/html/store
            # Smarty compiles templates into PHP here at runtime, so this is writable
            # code. Per-pod and ephemeral on purpose: a write primitive into it then
            # cannot persist across a restart or reach another replica.
            - name: smarty
              mountPath: /var/www/html/view/tpl/smarty3
            - name: htconfig
              mountPath: /var/www/html/.htconfig.php
              subPath: .htconfig.php
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "60m"
              memory: "320Mi"
            limits:
              memory: "1Gi"
      volumes:
        - name: smarty
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: htconfig
          secret:
            secretName: hubzilla-htconfig
        - name: store
          persistentVolumeClaim:
            claimName: temple-of-time-hubzilla-store
