apiVersion: apps/v1
kind: Deployment
metadata:
  name: erpnext-redis-cache
spec:
  revisionHistoryLimit: 5
  replicas: 1
  selector:
    matchLabels:
      app: erpnext-redis-cache
  template:
    metadata:
      labels:
        app: erpnext-redis-cache
    spec:
      serviceAccountName: erpnext-redis-cache
      containers:
        - name: redis
          image: PLACEHOLDER_REDIS_IMAGE
          securityContext:
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 6379
              name: redis
