apiVersion: apps/v1
kind: Deployment
metadata:
  name: erpnext-frontend
spec:
  revisionHistoryLimit: 5
  replicas: 1
  selector:
    matchLabels:
      app: erpnext-frontend
  template:
    metadata:
      labels:
        app: erpnext-frontend
    spec:
      serviceAccountName: erpnext-frontend
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: PLACEHOLDER_ERPNEXT_IMAGE
          command:
            - nginx-entrypoint.sh
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: BACKEND
              value: "erpnext-sites:8000"
            # $host, not a fixed site: nginx resolves the site from the request
            # hostname, which is what lets one bench serve several sites. A site is a
            # tenant — separate database, users and installed apps — so another
            # business gets its own site here rather than a Company inside this one.
            # Hostnames are attached to a site with `bench setup add-domain`, so a
            # rename is a route change and not a site migration.
            - name: FRAPPE_SITE_NAME_HEADER
              value: "$host"
            - name: SOCKETIO
              value: "erpnext-websocket:9000"
            - name: UPSTREAM_REAL_IP_ADDRESS
              value: "PLACEHOLDER_UPSTREAM_IP"
            - name: UPSTREAM_REAL_IP_HEADER
              value: "X-Forwarded-For"
            - name: UPSTREAM_REAL_IP_RECURSIVE
              value: "off"
            - name: PROXY_READ_TIMEOUT
              value: "120"
            - name: CLIENT_MAX_BODY_SIZE
              value: "50m"
          volumeMounts:
            - name: sites-data
              mountPath: /home/frappe/frappe-bench/sites
              readOnly: true
            - name: logs-data
              mountPath: /home/frappe/frappe-bench/logs
              readOnly: true
      volumes:
        - name: sites-data
          persistentVolumeClaim:
            claimName: PLACEHOLDER_SITES_PVC
        - name: logs-data
          persistentVolumeClaim:
            claimName: PLACEHOLDER_LOGS_PVC
