apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: organizr
spec:
  revisionHistoryLimit: 5
  serviceName: organizr
  replicas: 1
  selector:
    matchLabels:
      app: organizr
  template:
    metadata:
      labels:
        app: organizr
    spec:
      serviceAccountName: organizr
      # organizr uses s6-overlay: MUST start as root PID 1 (s6 chowns /run + setuidgid-drops to PUID).
      # Partial hardening: seccomp + drop ALL, adding back only s6's needs + NET_BIND_SERVICE for :80.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: organizr
          image: ghcr.io/organizr/organizr@sha256:1ce319d73cdfd2666ec7ef21e15907531fabc8a6f333c4ac61e2b2e9d2d162f5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - SETUID
                - SETGID
                - NET_BIND_SERVICE
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Etc/UTC"
            - name: branch
              value: "v2-master"
          volumeMounts:
            - name: PLACEHOLDER_NAMESPACE-organizr-config
              mountPath: /config
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: 1000m
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            timeoutSeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            timeoutSeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: PLACEHOLDER_NAMESPACE-organizr-config
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: PLACEHOLDER_STORAGE_CLASS
        resources:
          requests:
            storage: PLACEHOLDER_CONFIG_SIZE
