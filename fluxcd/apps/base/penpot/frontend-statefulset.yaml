apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: penpot-frontend
spec:
  serviceName: penpot-frontend
  replicas: 1
  selector:
    matchLabels:
      app: penpot-frontend
  template:
    metadata:
      labels:
        app: penpot-frontend
    spec:
      serviceAccountName: penpot-frontend
      containers:
        - name: frontend
          image: PLACEHOLDER_IMAGE
          # The image's worker_processes auto follows host cores, and every worker preallocates
          # its connection table. The entrypoint renders nginx.conf, then runs these args.
          args:
            - bash
            - -c
            - >-
              sed -i -E 's/^([[:space:]]*)worker_processes[[:space:]]+auto;/\1worker_processes 2;/' /etc/nginx/nginx.conf
              && exec nginx -g 'daemon off;'
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PENPOT_FLAGS
              value: "PLACEHOLDER_FLAGS"
            - name: ASSETS_STORAGE_BACKEND
              value: "assets-fs"
            - name: PENPOT_STORAGE_ASSETS_FS_DIRECTORY
              value: "/opt/data/assets"
            - name: PENPOT_PUBLIC_URI
              value: "PLACEHOLDER_PUBLIC_URI"
          volumeMounts:
            - name: assets
              mountPath: /opt/data/assets
          resources:
            requests:
              memory: "256Mi"
              cpu: 2m
            limits:
              memory: "512Mi"
              cpu: 100m
  volumeClaimTemplates:
    - metadata:
        name: assets
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: PLACEHOLDER_STORAGE_CLASS
        resources:
          requests:
            storage: PLACEHOLDER_STORAGE_SIZE
