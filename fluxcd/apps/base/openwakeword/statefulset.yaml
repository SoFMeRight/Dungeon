apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: openwakeword
spec:
  revisionHistoryLimit: 5
  serviceName: openwakeword
  replicas: 1
  selector:
    matchLabels:
      app: openwakeword
  template:
    metadata:
      labels:
        app: openwakeword
    spec:
      serviceAccountName: openwakeword
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: openwakeword
          image: docker.io/rhasspy/wyoming-openwakeword:PLACEHOLDER_TAG
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          args:
            - --preload-model
            - ok_nabu
          ports:
            - name: wyoming
              containerPort: 10400
              protocol: TCP
          volumeMounts:
            - name: custom
              mountPath: /custom
  volumeClaimTemplates:
    - metadata:
        name: custom
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: PLACEHOLDER_STORAGE
