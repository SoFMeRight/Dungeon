apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: calcom-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: calcom-secrets
    creationPolicy: Owner
  # CNPG's bootstrap.initdb.secret reads the owner role from fixed key names, so the
  # POSTGRES_* pair is republished under the two names it insists on. Only bootstrap
  # consults them, which is why a rename here stays invisible until the cluster is
  # rebuilt from scratch — the failure would surface at restore time, not now.
  data:
    - secretKey: username
      remoteRef:
        key: apps/calcom
        property: POSTGRES_USER
    - secretKey: password
      remoteRef:
        key: apps/calcom
        property: POSTGRES_PASSWORD
  dataFrom:
    - extract:
        key: apps/calcom
