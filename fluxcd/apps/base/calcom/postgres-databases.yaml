# SAML Jackson keeps its own schema, which is what backs cal.com's SSO connections. A second
# database in the same cluster rather than a second cluster: one thing to back up and restore,
# and the two are always failed over together.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: calcom-saml-db
spec:
  cluster:
    name: calcom-postgres
  name: cal-saml
  owner: prplanit
  encoding: UTF8
  localeCType: C
  localeCollate: C
