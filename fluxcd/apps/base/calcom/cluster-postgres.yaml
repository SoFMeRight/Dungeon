apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: calcom-postgres
spec:
  instances: 3

  imageName: ghcr.io/cloudnative-pg/postgresql:16.15

  affinity:
    podAntiAffinityType: required

  bootstrap:
    initdb:
      database: calendso
      owner: prplanit
      secret:
        name: calcom-secrets

  enableSuperuserAccess: true

  storage:
    storageClass: PLACEHOLDER_STORAGE_CLASS
    size: PLACEHOLDER_SIZE

  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "128MB"
      effective_cache_size: "512MB"
      maintenance_work_mem: "32MB"
      checkpoint_completion_target: "0.9"
      wal_buffers: "8MB"
      default_statistics_target: "100"
      random_page_cost: "1.1"
      effective_io_concurrency: "200"
      work_mem: "1310kB"
      min_wal_size: "512MB"
      max_wal_size: "2GB"
      max_slot_wal_keep_size: "800MB"

  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  # Archive to the NAS object store. destinationPath and endpointURL are supplied
  # by the environment overlay: the path carries the cluster name and the endpoint
  # is that environment's store. Everything else is the same wherever this runs.
  backup:
    barmanObjectStore:
      s3Credentials:
        accessKeyId:
          name: calcom-postgres-backup-s3
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: calcom-postgres-backup-s3
          key: SECRET_ACCESS_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
    retentionPolicy: "30d"
