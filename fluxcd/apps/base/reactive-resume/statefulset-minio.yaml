apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: reactive-resume-minio
spec:
  revisionHistoryLimit: 5
  serviceName: reactive-resume-minio
  replicas: PLACEHOLDER_REPLICAS
  selector:
    matchLabels:
      app: reactive-resume-minio
  template:
    metadata:
      labels:
        app: reactive-resume-minio
    spec:
      serviceAccountName: reactive-resume-minio
      # minio runs root by default but supports any uid with a writable /data (fsGroup).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # minio requires /data owned by its run-uid; fsGroup alone left it unwritable (pre-existing
        # outage). Chown the backend to 1000 as root before minio starts.
        - name: fix-data-perms
          image: docker.io/busybox:1.38
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
          command:
            - sh
            - -c
            - chown -R 1000:1000 /data && chmod -R u+rwX /data
          volumeMounts:
            - name: minio-data
              mountPath: /data
      containers:
        - name: minio
          image: PLACEHOLDER_MINIO_IMAGE
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - minio
            - server
            - /data
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: reactive-resume-secrets
                  key: minio_root_user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: reactive-resume-secrets
                  key: minio_root_password
          ports:
            - containerPort: 9000
              name: api
          volumeMounts:
            - name: minio-data
              mountPath: /data
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: 1000m
  volumeClaimTemplates:
    - metadata:
        name: minio-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: PLACEHOLDER_STORAGE_CLASS
        resources:
          requests:
            storage: PLACEHOLDER_MINIO_STORAGE
