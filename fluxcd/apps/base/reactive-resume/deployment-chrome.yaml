apiVersion: apps/v1
kind: Deployment
metadata:
  name: reactive-resume-chrome
spec:
  revisionHistoryLimit: 5
  replicas: PLACEHOLDER_REPLICAS
  selector:
    matchLabels:
      app: reactive-resume-chrome
  template:
    metadata:
      labels:
        app: reactive-resume-chrome
    spec:
      serviceAccountName: reactive-resume-chrome
      # browserless/chromium already runs as uid 999 (headless chrome, --no-sandbox) — full non-root.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: chrome
          image: PLACEHOLDER_CHROME_IMAGE
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: HEALTH
              value: "true"
            - name: TOKEN
              valueFrom:
                secretKeyRef:
                  name: reactive-resume-secrets
                  key: chrome_token
            - name: PROXY_HOST
              value: chrome
            - name: PROXY_PORT
              value: "3000"
            - name: PROXY_SSL
              value: "false"
          ports:
            - containerPort: 3000
              name: chrome
          resources:
            requests:
              memory: 512Mi
              cpu: 30m   # right-sized 2026-07: p95 ~9m (was 250m)
            limits:
              memory: 2Gi
              cpu: 2000m
