apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: linkstack-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-outspokekin
    kind: ClusterSecretStore
  target:
    name: linkstack-secrets
    creationPolicy: Owner
  data:
    - secretKey: SERVER_ADMIN
      remoteRef:
        key: apps/linkstack
        property: SERVER_ADMIN
    - secretKey: MYSQL_USER
      remoteRef:
        key: apps/linkstack
        property: MYSQL_USER
    - secretKey: MYSQL_PASSWORD
      remoteRef:
        key: apps/linkstack
        property: MYSQL_PASSWORD
    - secretKey: MYSQL_DATABASE
      remoteRef:
        key: apps/linkstack
        property: MYSQL_DATABASE
    - secretKey: MYSQL_ROOT_PASSWORD
      remoteRef:
        key: apps/linkstack
        property: MYSQL_ROOT_PASSWORD
    - secretKey: OIDC_CLIENT_ID
      remoteRef:
        key: apps/linkstack
        property: OIDC_CLIENT_ID
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: apps/linkstack
        property: OIDC_CLIENT_SECRET
