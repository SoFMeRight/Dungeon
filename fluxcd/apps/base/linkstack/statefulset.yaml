apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: linkstack
spec:
  revisionHistoryLimit: 5
  serviceName: linkstack
  replicas: PLACEHOLDER_REPLICAS
  selector:
    matchLabels:
      app: linkstack
  template:
    metadata:
      labels:
        app: linkstack
    spec:
      serviceAccountName: linkstack
      # apache/php image whose entrypoint regenerates /etc/apache2 + /etc/php83 config as root at
      # boot and binds the privileged :443 — cannot run non-root without a rebuild. Partial hardening
      # staying-root (verified boot): seccomp RuntimeDefault + drop ALL, adding back only apache's
      # needs (chown/chmod/setuid for the entrypoint + worker drop, NET_BIND_SERVICE for :443).
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: linkstack
          image: PLACEHOLDER_IMAGE
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - SETUID
                - SETGID
                - NET_BIND_SERVICE
          ports:
            - containerPort: 443
              name: https
          env:
            - name: PUID
              value: PLACEHOLDER_PUID
            - name: PGID
              value: PLACEHOLDER_PGID
            - name: TZ
              value: PLACEHOLDER_TZ
            - name: SERVER_ADMIN
              valueFrom:
                secretKeyRef:
                  name: linkstack-secrets
                  key: SERVER_ADMIN
            - name: HTTP_SERVER_NAME
              value: PLACEHOLDER_HTTP_SERVER_NAME
            - name: HTTPS_SERVER_NAME
              value: PLACEHOLDER_HTTPS_SERVER_NAME
            - name: LOG_LEVEL
              value: PLACEHOLDER_LOG_LEVEL
            - name: PHP_MEMORY_LIMIT
              value: PLACEHOLDER_PHP_MEMORY_LIMIT
            - name: UPLOAD_MAX_FILESIZE
              value: PLACEHOLDER_UPLOAD_MAX_FILESIZE
          resources:
            requests:
              cpu: PLACEHOLDER_CPU_REQUEST
              memory: PLACEHOLDER_MEMORY_REQUEST
            limits:
              cpu: PLACEHOLDER_CPU_LIMIT
              memory: PLACEHOLDER_MEMORY_LIMIT
          volumeMounts:
            - name: PLACEHOLDER_NAMESPACE-linkstack-htdocs
              mountPath: /htdocs
  volumeClaimTemplates:
    - metadata:
        name: PLACEHOLDER_NAMESPACE-linkstack-htdocs
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: PLACEHOLDER_STORAGE_CLASS
        resources:
          requests:
            storage: PLACEHOLDER_HTDOCS_SIZE
