apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: photoprism-x-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: PLACEHOLDER_SECRET_STORE
  refreshInterval: 5m
  target:
    name: photoprism-x-secret
    template:
      type: Opaque
      # Keys are the canonical vault/env names (1:1 from apps/photoprism-x) — the statefulsets
      # reference these directly. Explicit so the manifest documents the secret's contents.
      data:
        ADMIN_USER: "{{ .ADMIN_USER | toString }}"
        ADMIN_PASSWORD: "{{ .ADMIN_PASSWORD | toString }}"
        MARIADB_DATABASE: "{{ .MARIADB_DATABASE | toString }}"
        MARIADB_USER: "{{ .MARIADB_USER | toString }}"
        MARIADB_PASSWORD: "{{ .MARIADB_PASSWORD | toString }}"
        MARIADB_ROOT_PASSWORD: "{{ .MARIADB_ROOT_PASSWORD | toString }}"
        OIDC_ISSUER: "{{ .OIDC_ISSUER | toString }}"
        OIDC_CLIENT_ID: "{{ .OIDC_CLIENT_ID | toString }}"
        OIDC_CLIENT_SECRET: "{{ .OIDC_CLIENT_SECRET | toString }}"
  dataFrom:
    - extract:
        key: apps/photoprism-x
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: photoprism-x-smb-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: PLACEHOLDER_SECRET_STORE
  refreshInterval: 5m
  target:
    name: photoprism-x-smb-secret
    template:
      type: Opaque
      data:
        # smb.csi.k8s.io requires the keys to be named username/password
        username: "{{ .SAMBA_USERNAME | toString }}"
        password: "{{ .SAMBA_PASSWORD | toString }}"
  dataFrom:
    - extract:
        key: apps/photoprism-x
