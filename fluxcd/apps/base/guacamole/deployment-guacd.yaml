apiVersion: apps/v1
kind: Deployment
metadata:
  name: guacamole-guacd
spec:
  revisionHistoryLimit: 5
  replicas: 1
  selector:
    matchLabels:
      app: guacamole-guacd
  template:
    metadata:
      labels:
        app: guacamole-guacd
    spec:
      serviceAccountName: guacamole-guacd
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: guacd
          image: PLACEHOLDER_GUACD_IMAGE
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 4822
              name: guacd
