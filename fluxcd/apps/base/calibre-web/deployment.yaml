apiVersion: apps/v1
kind: Deployment
metadata:
  name: calibre-web
  labels:
    app: calibre-web
spec:
  revisionHistoryLimit: 5
  replicas: PLACEHOLDER_REPLICAS
  selector:
    matchLabels:
      app: calibre-web
  template:
    metadata:
      labels:
        app: calibre-web
    spec:
      serviceAccountName: calibre-web
      # LSIO/s6-overlay image: MUST start as root PID 1 (s6 chowns /run + setuidgid-drops to PUID).
      # Partial hardening: seccomp + drop ALL, adding back only s6's needs. :8083 is unprivileged.
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: calibre-web
          image: PLACEHOLDER_IMAGE
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - SETUID
                - SETGID
          ports:
            - containerPort: 8083
              name: web
          env:
            - name: TZ
              value: "Etc/UTC"
            - name: PUID
              value: "8083"
            - name: PGID
              value: "1000"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: books
              mountPath: /books
            - name: custom-init
              mountPath: /custom-cont-init.d
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 8083
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: calibre-web-config-pvc
        - name: books
          persistentVolumeClaim:
            claimName: calibre-web-books-pvc
        - name: custom-init
          configMap:
            name: calibre-web-custom-init
            defaultMode: 0755
