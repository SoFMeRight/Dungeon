apiVersion: v1
kind: ConfigMap
metadata:
  name: calibre-web-custom-init
  labels:
    app: calibre-web
data:
  # LSIO runs every executable in /custom-cont-init.d as root at boot (init-custom-files).
  10-kepubify-symlink.sh: |
    #!/bin/bash
    # Self-heal kepubify naming for Calibre-Web.
    #
    # Calibre-Web (Linux) only accepts the kepubify binary under the upstream
    # release-asset names kepubify-linux-64bit / -32bit (cps/binary_helper.py),
    # but the LSIO image ships it as plain /usr/bin/kepubify. The two have drifted,
    # so out of the box Calibre-Web reports "Kepubify binary not found". Recreate
    # correctly-named symlinks on every boot so it survives image rebuilds. Idempotent.
    set -u
    PUID="${PUID:-1000}"
    PGID="${PGID:-1000}"
    LINK_NAME="kepubify-linux-64bit"

    SRC="$(command -v kepubify 2>/dev/null || true)"
    [ -z "${SRC}" ] && [ -f /usr/bin/kepubify ] && SRC=/usr/bin/kepubify
    if [ -z "${SRC}" ]; then
      echo "[custom-init] kepubify-symlink: no kepubify binary in image, nothing to do"
      exit 0
    fi
    chmod a+rx "${SRC}" 2>/dev/null || true

    # 1) config_kepubifypath target (/config/bin) — persisted in the PVC, matches app.db
    mkdir -p /config/bin
    ln -sf "${SRC}" "/config/bin/${LINK_NAME}"
    chown -h "${PUID}:${PGID}" "/config/bin/${LINK_NAME}" 2>/dev/null || true
    chown "${PUID}:${PGID}" /config/bin 2>/dev/null || true

    # 2) autodetect fallback (/opt/kepubify) — used if config_kepubifypath ever resets to None
    mkdir -p /opt/kepubify
    ln -sf "${SRC}" "/opt/kepubify/${LINK_NAME}"

    echo "[custom-init] kepubify-symlink: ${LINK_NAME} -> ${SRC} (config/bin + opt/kepubify)"
  # Registration email from a template: when REGISTRATION_MAIL_TEMPLATE names a file, its text
  # is the body with {name} and {password} filled in, and REGISTRATION_MAIL_SUBJECT (optional)
  # the subject. Unset, the stock email is sent. Leaves helper.py untouched if upstream changed it.
  20-registration-mail.sh: |
    #!/bin/bash
    set -u
    python3 - <<'PY'
    import re, sys
    path = "/app/calibre-web/cps/helper.py"
    marker = "# registration-mail template"
    src = open(path, encoding="utf-8").read()
    if marker in src:
        print("[custom-init] registration-mail: already patched"); sys.exit(0)
    m = re.search(r"(def send_registration_mail\(e_mail, user_name, default_password, resend=False, locale=None\):\n)"
                  r"((?:    .*\n)+?)(    WorkerThread\.add\(None, TaskEmail\()", src)
    if not m or "subject = " not in m.group(2):
        print("[custom-init] registration-mail: send_registration_mail changed upstream; left unpatched"); sys.exit(0)
    stock = "".join("    " + l + "\n" if l else "\n" for l in m.group(2).rstrip("\n").split("\n"))
    body = (
        "    template = os.environ.get(\"REGISTRATION_MAIL_TEMPLATE\")  " + marker + "\n"
        "    if template and os.path.isfile(template):\n"
        "        with open(template, encoding=\"utf-8\") as f:\n"
        "            txt = f.read().replace(\"{name}\", user_name).replace(\"{password}\", default_password)\n"
        "        txt = txt.replace(\"\\r\\n\", \"\\n\").replace(\"\\n\", \"\\r\\n\")\n"
        "        subject = os.environ.get(\"REGISTRATION_MAIL_SUBJECT\") or _('Get Started with Calibre-Web')\n"
        "    else:\n" + stock
    )
    src = src[:m.start(2)] + body + src[m.end(2):]
    if "\nimport os\n" not in src and "\nimport os," not in src:
        src = "import os\n" + src
    open(path, "w", encoding="utf-8").write(src)
    print("[custom-init] registration-mail: patched send_registration_mail")
    PY
