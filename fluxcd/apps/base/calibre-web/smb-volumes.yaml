---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: calibre-web-books
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
    - vers=3.1.1
    - hard
    - uid=8083
    - gid=1000
    - file_mode=0777
    - dir_mode=0777
    # Calibre metadata.db is SQLite here. calibre-web uses ONE shared connection (StaticPool),
    # so lock errors aren't in-process contention -> they're CIFS byte-range locks erroring over
    # SMB. nobrl skips them (safe: single connection + replicas=1); cache=none avoids stale pages.
    # Verified: cache=none WITHOUT nobrl still throws "database is locked". Keep nobrl.
    - cache=none
    - nobrl
  csi:
    driver: smb.csi.k8s.io
    readOnly: false
    volumeHandle: calibre-web-books
    volumeAttributes:
      source: "//gringotts/media_books"
    nodeStageSecretRef:
      name: calibre-web-samba-secret
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: calibre-web-books-pvc
spec:
  storageClassName: PLACEHOLDER_STORAGE_CLASS
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Ti
  volumeName: calibre-web-books
