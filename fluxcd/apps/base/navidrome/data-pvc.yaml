apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: navidrome-data
spec:
  # Dynamic RBD (Retain) for navidrome.db + cache/artwork — no pre-existing data,
  # so dynamic provisioning rather than the static PV pattern plex/jellyfin use.
  storageClassName: ceph-rbd
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
