apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: navidrome-smb-secret
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: openbao-operationtimecapsule
    kind: ClusterSecretStore
  target:
    name: navidrome-smb-secret
    template:
      type: Opaque
      data:
        # smb.csi.k8s.io requires the keys to be named username/password
        username: "{{ .SAMBA_USERNAME | toString }}"
        password: "{{ .SAMBA_PASSWORD | toString }}"
        # consumed by the navidrome container as ND_PASSWORDENCRYPTIONKEY (encrypts stored
        # user & third-party passwords); must never change once users have set passwords
        nd-password-encryption-key: "{{ .ND_PASSWORDENCRYPTIONKEY | toString }}"
  dataFrom:
    - extract:
        key: apps/navidrome
