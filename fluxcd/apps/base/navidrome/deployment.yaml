apiVersion: apps/v1
kind: Deployment
metadata:
  name: navidrome
spec:
  revisionHistoryLimit: 5
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: navidrome
  template:
    metadata:
      labels:
        app: navidrome
        # selected by the derived istio AuthorizationPolicy allow-gateway-ingress-phloem
        policy.prplanit.com/ingress: "true"
    spec:
      serviceAccountName: navidrome
      securityContext:
        fsGroup: 3144
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: navidrome
          image: ghcr.io/navidrome/navidrome:0.64.2
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 4533
            runAsGroup: 3144
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: ND_MUSICFOLDER
              value: /music
            - name: ND_DATAFOLDER
              value: /data
            - name: ND_PORT
              value: "8080"
            - name: ND_LOGLEVEL
              value: info
            - name: TZ
              value: Etc/UTC
            # Bigger on-disk cover-art cache (default 100MB) so resized thumbnails persist for a
            # large library instead of being evicted and re-resized — kills the repeat CPU churn
            # WITHOUT raising the CPU limit. Disk is cheap (/data); art resizes once per album,
            # then stays cached. Keeps the CPU ceiling at 1 core.
            - name: ND_IMAGECACHESIZE
              value: 2GB
            # reverse-proxy (SSO) auth: trust the identity header oauth2-proxy injects at the
            # cell-membrane gateway, so SSO'd users don't double-login. Spoofing is blocked two
            # ways: the gateway strips any client-supplied x-auth-request-* (EnvoyFilter
            # sso-strip-spoofed-auth-headers), and Navidrome only trusts the header from the
            # in-cluster pod network below. The Subsonic API (/rest/*) is SSO-exempt and uses
            # its own token auth, so it never carries this header.
            - name: ND_REVERSEPROXYUSERHEADER
              value: X-Auth-Request-Email
            - name: ND_REVERSEPROXYWHITELIST
              value: 192.168.144.0/20
            # auth rate-limit DISABLED (0). At >0 it 429s the web player's burst of
            # /rest/getCoverArt + stream requests (each carries Subsonic token auth), causing
            # slow cover art + stuttering playback. Brute-force is already covered by SSO on
            # the web UI + the crowdsec login-bruteforce scenario, so this knob only hurt.
            - name: ND_AUTHREQUESTLIMIT
              value: "0"
            # encrypts stored user & third-party passwords; sourced from Vault, never change it
            - name: ND_PASSWORDENCRYPTIONKEY
              valueFrom:
                secretKeyRef:
                  name: navidrome-smb-secret
                  key: nd-password-encryption-key
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ping
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /ping
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: music
              mountPath: /music
              readOnly: true
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          resources:
            # Most of this container's memory is NOT navidrome. Per cgroup memory.stat:
            # anon 415Mi (the Go heap, flat) against slab_reclaimable ~550Mi — kernel
            # dentry/inode cache for the CIFS music mount, billed to whichever cgroup
            # faulted it in. Walking and streaming a library of this size populates it,
            # and a limit with no slack turns reclaim into an OOM kill instead of a cache
            # eviction. jellyfin shows the same shape (anon 617Mi, slab 362Mi) and simply
            # has 6Gi to absorb it.
            #
            # So the limit covers heap + metadata cache + room to reclaim, and requests
            # track anon only, which is what the scheduler should reserve. Note `top` and
            # working-set metrics cannot separate heap from kernel slab — read
            # memory.stat before changing these.
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
      volumes:
        - name: music
          persistentVolumeClaim:
            claimName: navidrome-music
        - name: data
          persistentVolumeClaim:
            claimName: navidrome-data
        - name: tmp
          emptyDir: {}
