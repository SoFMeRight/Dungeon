# Standing restic repository password for hasteward backup/restore/repair runs.
# Materializes secret `hasteward-restic` (key: password) from the openbao
# zeldas-letter engine (apps/hasteward -> RESTIC_PASS); the ad-hoc job.yaml
# consumes it as RESTIC_PASSWORD per run.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hasteward-restic
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-zeldas-letter
  target:
    name: hasteward-restic
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: password
      remoteRef:
        key: apps/hasteward
        property: RESTIC_PASS
