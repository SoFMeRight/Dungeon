# HASteward Galera bootstrap — when every node is down: fence, wsrep_recover every PVC,
# escrow them all, then bootstrap from the highest recovered seqno. Run with --dry-run first.
#   ../jobs/run.sh bootstrap -c <cluster> -n <namespace> -e galera [-f] [-- --dry-run]
# Vars: ENGINE CLUSTER NAMESPACE IMAGE PULL_POLICY FORCE EXTRA_ARGS — filled by run.sh.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: hasteward-bootstrap-${CLUSTER}-
  namespace: optcp-fairy-bottle
  labels:
    app.kubernetes.io/name: hasteward
    hasteward.prplanit.com/verb: bootstrap
    hasteward.prplanit.com/target: ${CLUSTER}
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hasteward
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: hasteward
      restartPolicy: Never
      containers:
        - name: hasteward
          image: ${IMAGE}
          # run.sh resolves the tag to a digest before substituting it here, so
          # IfNotPresent cannot serve stale code: there is nothing newer that a re-pull
          # could find. When the registry is unreachable it substitutes the bare tag
          # instead, and this policy is what lets the node's cached layer still run.
          imagePullPolicy: ${PULL_POLICY}
          args: ["bootstrap", "${EXTRA_ARGS}"]
          env:
            # empty unless run.sh was given -f; HASteward reads "" as false
            - name: HASTEWARD_FORCE
              value: "${FORCE}"
            - name: HASTEWARD_ENGINE
              value: "${ENGINE}"
            - name: HASTEWARD_CLUSTER
              value: "${CLUSTER}"
            - name: HASTEWARD_NAMESPACE
              value: "${NAMESPACE}"
            - name: HASTEWARD_BACKUPS_PATH
              value: /backups
            - name: RESTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hasteward-restic
                  key: password
          volumeMounts:
            - name: backups
              mountPath: /backups
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: backups
          persistentVolumeClaim:
            claimName: hasteward-backups
        - name: tmp
          emptyDir: {}
