# HASteward CNPG disk-full DEADLOCK recovery — replay + recycle WAL IN PLACE for an
# instance too full to start, then SETTLE it (bring the recovered primary back, cancelling
# any stuck failover). Escrow-snapshotted, no PVC growth, no data loss.
#   ../jobs/run.sh deadlock-recover -c <cluster> -n <namespace> -i <instance>
# Vars: ENGINE(cnpg) CLUSTER NAMESPACE INSTANCE IMAGE — filled by run.sh.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: hasteward-deadlock-recover-${CLUSTER}-
  namespace: fairy-bottle
  labels:
    app.kubernetes.io/name: hasteward
    hasteward.prplanit.com/verb: deadlock-recover
    hasteward.prplanit.com/target: ${CLUSTER}
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hasteward
      # The pod outlives its main container if an Istio sidecar is injected, so the Job
      # never completes. HASteward operations do not need the mesh.
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: hasteward
      restartPolicy: Never
      containers:
        - name: hasteward
          image: ${IMAGE}
          args: ["prune-wal", "--deadlock-recover", "--instance", "${INSTANCE}"]
          env:
            - name: HASTEWARD_ENGINE
              value: "${ENGINE}"
            - name: HASTEWARD_CLUSTER
              value: "${CLUSTER}"
            - name: HASTEWARD_NAMESPACE
              value: "${NAMESPACE}"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
