# HASteward read-only triage — diagnose a cluster's health/authority. ALWAYS run first.
#   ../jobs/run.sh triage -c <cluster> -n <namespace>
# Vars: ENGINE(cnpg|galera) CLUSTER NAMESPACE IMAGE — filled by run.sh.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: hasteward-triage-${CLUSTER}-
  namespace: fairy-bottle
  labels:
    app.kubernetes.io/name: hasteward
    hasteward.prplanit.com/verb: triage
    hasteward.prplanit.com/target: ${CLUSTER}
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hasteward
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: hasteward
      restartPolicy: Never
      containers:
        - name: hasteward
          image: ${IMAGE}
          # ${IMAGE} defaults to the rolling latest-dev tag; always pull so a run never
          # executes a stale cached image on the scheduling node.
          imagePullPolicy: Always
          args: ["triage"]
          env:
            - name: HASTEWARD_ENGINE
              value: "${ENGINE}"
            - name: HASTEWARD_CLUSTER
              value: "${CLUSTER}"
            - name: HASTEWARD_NAMESPACE
              value: "${NAMESPACE}"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
