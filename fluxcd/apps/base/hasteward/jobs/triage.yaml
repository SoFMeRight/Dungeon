# HASteward read-only triage — diagnose a cluster's health/authority. ALWAYS run first.
#   ../jobs/run.sh triage -c <cluster> -n <namespace>
# Vars: ENGINE(cnpg|galera) CLUSTER NAMESPACE IMAGE — filled by run.sh.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: hasteward-triage-${CLUSTER}-
  namespace: fairy-bottle
  labels:
    app.kubernetes.io/name: hasteward
    hasteward.prplanit.com/verb: triage
    hasteward.prplanit.com/target: ${CLUSTER}
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hasteward
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: hasteward
      restartPolicy: Never
      containers:
        - name: hasteward
          image: ${IMAGE}
          # run.sh resolves the tag to a digest before substituting it here, so
          # IfNotPresent cannot serve stale code: there is nothing newer that a re-pull
          # could find. When the registry is unreachable it substitutes the bare tag
          # instead, and this policy is what lets the node's cached layer still run.
          imagePullPolicy: ${PULL_POLICY}
          args: ["triage"]
          env:
            - name: HASTEWARD_ENGINE
              value: "${ENGINE}"
            - name: HASTEWARD_CLUSTER
              value: "${CLUSTER}"
            - name: HASTEWARD_NAMESPACE
              value: "${NAMESPACE}"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
