# Backup-only key on the NAS object store; never the app's credential.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kimai-mariadb-backup-s3
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-operationtimecapsule
    kind: ClusterSecretStore
  target:
    name: kimai-mariadb-backup-s3
    creationPolicy: Owner
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: apps/kimai/s3-backup
        property: ACCESS_KEY
    - secretKey: SECRET_ACCESS_KEY
      remoteRef:
        key: apps/kimai/s3-backup
        property: SECRET_KEY
