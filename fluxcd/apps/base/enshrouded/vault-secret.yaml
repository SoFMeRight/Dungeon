apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: enshrouded-secret
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-optcp
  target:
    name: enshrouded-secret
    creationPolicy: Owner
    template:
      type: Opaque
      # The whole server config, read as an external config (EXTERNAL_CONFIG=1): the image's
      # generated one puts every player in a single all-permissions group. A player's group is
      # the one whose password they join with; SERVER_PASSWORD is the Friend group's.
      data:
        enshrouded_server.json: |
          {
            "name": "Master-Chiefers",
            "saveDirectory": "./savegame",
            "logDirectory": "./logs",
            "ip": "0.0.0.0",
            "queryPort": 15637,
            "slotCount": 16,
            "tags": [],
            "voiceChatMode": "Proximity",
            "enableVoiceChat": false,
            "enableTextChat": false,
            "gameSettingsPreset": "Default",
            "gameSettings": {
              "playerHealthFactor": 1,
              "playerManaFactor": 1,
              "playerStaminaFactor": 1,
              "playerBodyHeatFactor": 1,
              "playerDivingTimeFactor": 1,
              "enableDurability": true,
              "enableStarvingDebuff": false,
              "foodBuffDurationFactor": 1,
              "fromHungerToStarving": 600000000000,
              "shroudTimeFactor": 1,
              "tombstoneMode": "AddBackpackMaterials",
              "enableGliderTurbulences": true,
              "weatherFrequency": "Normal",
              "fishingDifficulty": "Normal",
              "miningDamageFactor": 1,
              "plantGrowthSpeedFactor": 1,
              "resourceDropStackAmountFactor": 1,
              "factoryProductionSpeedFactor": 1,
              "perkUpgradeRecyclingFactor": 0.5,
              "perkCostFactor": 1,
              "experienceCombatFactor": 1,
              "experienceMiningFactor": 1,
              "experienceExplorationQuestsFactor": 1,
              "randomSpawnerAmount": "Normal",
              "aggroPoolAmount": "Normal",
              "enemyDamageFactor": 1,
              "enemyHealthFactor": 1,
              "enemyStaminaFactor": 1,
              "enemyPerceptionRangeFactor": 1,
              "bossDamageFactor": 1,
              "bossHealthFactor": 1,
              "threatBonus": 1,
              "pacifyAllEnemies": false,
              "tamingStartleRepercussion": "LoseSomeProgress",
              "dayTimeDuration": 1800000000000,
              "nightTimeDuration": 720000000000,
              "curseModifier": "Normal",
              "flameLevelFogRemoval": 11
            },
            "userGroups": [
              {
                "name": "Admin",
                "password": {{ .adminPassword | toJson }},
                "canKickBan": true,
                "canAccessInventories": true,
                "canEditWorld": true,
                "canEditBase": true,
                "canExtendBase": true,
                "reservedSlots": 2
              },
              {
                "name": "Friend",
                "password": {{ .serverPassword | toJson }},
                "canKickBan": false,
                "canAccessInventories": true,
                "canEditWorld": true,
                "canEditBase": true,
                "canExtendBase": true,
                "reservedSlots": 0
              },
              {
                "name": "Guest",
                "password": {{ .guestPassword | toJson }},
                "canKickBan": false,
                "canAccessInventories": false,
                "canEditWorld": true,
                "canEditBase": false,
                "canExtendBase": false,
                "reservedSlots": 0
              }
            ],
            "bannedAccounts": []
          }
  data:
    - secretKey: adminPassword
      remoteRef:
        key: apps/enshrouded/app
        property: ADMIN_PASSWORD
    - secretKey: serverPassword
      remoteRef:
        key: apps/enshrouded/app
        property: SERVER_PASSWORD
    - secretKey: guestPassword
      remoteRef:
        key: apps/enshrouded/app
        property: GUEST_PASSWORD
