apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: enshrouded-secret
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: openbao-operationtimecapsule
    kind: ClusterSecretStore
  target:
    name: enshrouded-secret
    template:
      type: Opaque
      # Key matches the image's env name (consumed via envFrom); applied to every user group.
      data:
        SERVER_PASSWORD: "{{ .SERVER_PASSWORD | toString }}"
  dataFrom:
    - extract:
        key: apps/enshrouded
