apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: enshrouded-secret
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-optcp
  target:
    name: enshrouded-secret
    creationPolicy: Owner
    template:
      type: Opaque
      # The image applies it to every user group.
      data:
        SERVER_PASSWORD: "{{ .serverPassword }}"
  data:
    - secretKey: serverPassword
      remoteRef:
        key: apps/enshrouded/app
        property: SERVER_PASSWORD
