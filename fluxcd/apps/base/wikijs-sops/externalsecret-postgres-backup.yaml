apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wikijs-sops-postgres-backup-s3
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-optcp
  target:
    name: wikijs-sops-postgres-backup-s3
    creationPolicy: Owner
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: apps/wikijs-sops/s3-gringotts
        property: ACCESS_KEY
    - secretKey: SECRET_ACCESS_KEY
      remoteRef:
        key: apps/wikijs-sops/s3-gringotts
        property: SECRET_KEY
