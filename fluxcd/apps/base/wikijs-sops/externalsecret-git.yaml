apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wikijs-sops-git
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-optcp
  target:
    name: wikijs-sops-git
    creationPolicy: Owner
  data:
    - secretKey: id_ed25519
      remoteRef:
        key: apps/wikijs-sops/git
        property: SSH_PRIVATE_KEY
