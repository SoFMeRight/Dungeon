apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: linkwarden-meilisearch
spec:
  replicas: PLACEHOLDER_REPLICAS
  selector:
    matchLabels:
      app: linkwarden-meilisearch
  template:
    metadata:
      labels:
        app: linkwarden-meilisearch
    spec:
      serviceAccountName: linkwarden-meilisearch
      # meilisearch (Go) runs root by default but works as any uid with a writable /meili_data (fsGroup).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: meilisearch
          image: PLACEHOLDER_IMAGE
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: MEILI_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: linkwarden-app-secrets
                  key: meili-master-key
            - name: MEILI_ENV
              value: "production"
            # Meilisearch's own supported in-place upgrade: on a version bump it migrates the
            # on-disk index to the running engine's format at startup (supported for any DB
            # created by v1.12+). No-op when versions already match, and it keeps the index —
            # so linkwarden's per-link indexVersion stays valid and no reindex is needed.
            - name: MEILI_UPGRADE_DB
              value: "true"
          ports:
            - containerPort: 7700
              name: meilisearch
          volumeMounts:
            - name: meilisearch-data
              mountPath: /meili_data
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 7700
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 7700
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        # readOnlyRootFilesystem: meilisearch writes dumps/snapshots/uploads to /tmp
        # (the index itself lives on the /meili_data PVC).
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: meilisearch-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
