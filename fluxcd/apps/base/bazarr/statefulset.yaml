apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bazarr
spec:
  revisionHistoryLimit: 5
  serviceName: bazarr
  replicas: 1
  selector:
    matchLabels:
      app: bazarr
  template:
    metadata:
      labels:
        app: bazarr
    spec:
      serviceAccountName: bazarr
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bazarr
          image: docker.io/linuxserver/bazarr:PLACEHOLDER_IMAGE_TAG
          # LSIO s6-overlay: starts root, setuidgid-drops to PUID. Root-required partial:
          # drop ALL + the caps s6 needs to drop privileges.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - SETUID
                - SETGID
          env:
            - name: TZ
              value: "PLACEHOLDER_TIMEZONE"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: movies
              mountPath: /media/Movies
            - name: tv-shows
              mountPath: /media/TV_Shows
        - name: gluetun
          image: docker.io/qmcgaw/gluetun:PLACEHOLDER_IMAGE_TAG
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - NET_ADMIN
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - MKNOD
                - SETUID
                - SETGID
              drop:
                - ALL
          env:
            - name: VPN_SERVICE_PROVIDER
              value: "PLACEHOLDER_VPN_PROVIDER"
            - name: SERVER_REGIONS
              value: "PLACEHOLDER_SERVER_REGIONS"
            - name: FIREWALL_VPN_INPUT_PORTS
              value: "PLACEHOLDER_VPN_INPUT_PORTS"
            - name: OPENVPN_USER
              valueFrom:
                secretKeyRef:
                  name: bazarr-vpn-secret
                  key: vpn_user
            - name: OPENVPN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bazarr-vpn-secret
                  key: vpn_password
            - name: DOT
              value: "off"
            - name: DNS_ADDRESS
              value: "PLACEHOLDER_DNS_ADDRESS"
            - name: HEALTH_VPN_DURATION_INITIAL
              value: "60s"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: movies
          persistentVolumeClaim:
            claimName: bazarr-movies
        - name: tv-shows
          persistentVolumeClaim:
            claimName: bazarr-tv-shows
  volumeClaimTemplates:
    - metadata:
        name: config
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: PLACEHOLDER_STORAGE_CLASS
        resources:
          requests:
            storage: 2Gi
