apiVersion: v1
kind: ConfigMap
metadata:
  name: minecraft-patches
data:
  # Applied to the plugin configs on the volume at every start (PATCH_DEFINITIONS). Each key is
  # one patch definition ({"file", "ops"}); the directory loader rejects a patch set.
  # Chat shows the LuckPerms prefix, then the player name.
  essentials-chat.json: |
    {
      "file": "/data/plugins/Essentials/config.yml",
      "ops": [
        {"$set": {"path": "$.chat.format", "value": "{PREFIX}{USERNAME}&r: {MESSAGE}"}},
        {"$set": {"path": "$['update-check']", "value": false}}
      ]
    }
  # Plugin versions come from GitOps (MODRINTH_PROJECTS, or the jar kept on the volume), so the
  # plugins' own update checks are off; egress denies them anyway. CMILib's AutoUpdate would
  # also replace its own jar.
  cmilib.json: |
    {"file": "/data/plugins/CMILib/config.yml", "ops": [{"$set": {"path": "$.AutoUpdate", "value": false}}]}
  advancedteleport.json: |
    {"file": "/data/plugins/AdvancedTeleport/config.yml", "ops": [{"$set": {"path": "$['check-for-updates']", "value": false}}]}
  coreprotect.json: |
    {"file": "/data/plugins/CoreProtect/config.yml", "ops": [{"$set": {"path": "$['check-updates']", "value": false}}]}
  vault.json: |
    {"file": "/data/plugins/Vault/config.yml", "ops": [{"$set": {"path": "$['update-check']", "value": false}}]}
  chestshop.json: |
    {"file": "/data/plugins/ChestShop/config.yml", "ops": [{"$set": {"path": "$.TURN_OFF_DEV_UPDATE_NOTIFIER", "value": true}}]}
  playerkits.json: |
    {"file": "/data/plugins/PlayerKits/config.yml", "ops": [{"$set": {"path": "$.Config.update_notify", "value": false}}]}
