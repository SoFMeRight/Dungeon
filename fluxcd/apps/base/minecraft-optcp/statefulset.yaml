apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minecraft
spec:
  revisionHistoryLimit: 5
  serviceName: minecraft
  replicas: 1
  selector:
    matchLabels:
      app: minecraft
  template:
    metadata:
      labels:
        app: minecraft
    spec:
      serviceAccountName: minecraft
      # itzg starts root to chown /data then su-execs to the run user; /data is already 1000-owned,
      # so running directly as 1000 skips that path. Full non-root.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minecraft
          image: docker.io/itzg/minecraft-server:java25@sha256:f7f2222512810f0f0e85133913622cf639be77a5dd1d4b11f24ab675da6ba742
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 35566
              name: minecraft
              protocol: TCP
          env:
            - name: TYPE
              value: PAPER
            # renovate: datasource=custom.paper depName=paper
            - name: VERSION
              value: "1.21.11"
            # Plugins are fetched from Modrinth at every start: the newest release build tagged
            # for VERSION (chestshop has only a beta for 1.21.11). A project with no build for
            # VERSION fails the start before the world loads, so nothing runs mismatched.
            - name: MODRINTH_PROJECTS
              value: |
                advancedteleport
                bentobox
                chestshop:beta
                coreprotect
                essentialsx
                essentialsx-chat-module
                griefprevention
                luckperms
                multiverse-core
                multiverse-portals
                perworldplugins
                playerkits-2
                resource-world
                thizzyz-tree-feller
                vaultunlocked
                worldedit
                worldguard
            # Clears the jars directly in plugins/ before the downloads, so plugins/ holds exactly
            # the list above. Jobs and CMILib (Spigot only, no version tags to match on) stay on
            # the volume as they are, and so do the BentoBox addons in plugins/BentoBox/addons/
            # (BentoBox loads addons only from there); those are updated by hand.
            - name: REMOVE_OLD_MODS
              value: "TRUE"
            - name: REMOVE_OLD_MODS_INCLUDE
              value: "*.jar"
            - name: REMOVE_OLD_MODS_EXCLUDE
              value: "Jobs*.jar,CMILib*.jar"
            - name: REMOVE_OLD_MODS_DEPTH
              value: "1"
            # The EssentialsX Chat format (patches/essentials-chat.json).
            - name: PATCH_DEFINITIONS
              value: /patches
            # Half the players in bed skips the night in the overworld (vanilla's own rule; other
            # worlds keep vanilla's 100%).
            - name: RCON_CMDS_STARTUP
              value: |-
                gamerule players_sleeping_percentage 50
            - name: EULA
              value: "TRUE"
            - name: SERVER_PORT
              value: "35566"
            - name: INIT_MEMORY
              value: 2G
            - name: MAX_MEMORY
              value: 9G
            - name: USE_AIKAR_FLAGS
              value: "true"
          volumeMounts:
            - name: data
              mountPath: /data
            # readOnlyRootFilesystem: HOME=/data (PVC) carries all runtime state; only /tmp lives
            # on the (now read-only) rootfs — the JVM writes hsperfdata + jar/temp extraction there.
            - name: tmp
              mountPath: /tmp
            - name: patches
              mountPath: /patches
              readOnly: true
          stdin: true
          tty: true
          # Chunk generation and loading run on the CPU; at a 500m limit the server was throttled
          # in 84% of CFS periods and chunks crawled in.
          resources:
            requests:
              cpu: "1"
              memory: 8Gi
            limits:
              cpu: "4"
              memory: 10Gi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: patches
          configMap:
            name: minecraft-patches
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: PLACEHOLDER_STORAGE_CLASS
        resources:
          requests:
            storage: 10Gi
