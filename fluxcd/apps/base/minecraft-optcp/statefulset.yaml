apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minecraft
spec:
  revisionHistoryLimit: 5
  serviceName: minecraft
  replicas: 1
  selector:
    matchLabels:
      app: minecraft
  template:
    metadata:
      labels:
        app: minecraft
    spec:
      serviceAccountName: minecraft
      # itzg starts root to chown /data then su-execs to the run user; /data is already 1000-owned,
      # so running directly as 1000 skips that path. Full non-root.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minecraft
          image: docker.io/itzg/minecraft-server:java25
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 35566
              name: minecraft
              protocol: TCP
          env:
            - name: TYPE
              value: PAPER
            - name: VERSION
              value: "1.21.4"
            - name: EULA
              value: "TRUE"
            - name: SERVER_PORT
              value: "35566"
            - name: INIT_MEMORY
              value: 2G
            - name: MAX_MEMORY
              value: 9G
            - name: USE_AIKAR_FLAGS
              value: "true"
          volumeMounts:
            - name: data
              mountPath: /data
          stdin: true
          tty: true
          resources:
            requests:
              cpu: 70m
              memory: 8Gi
            limits:
              cpu: 500m
              memory: 10Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: PLACEHOLDER_STORAGE_CLASS
        resources:
          requests:
            storage: 10Gi
