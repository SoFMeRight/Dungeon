apiVersion: apps/v1
kind: Deployment
metadata:
  name: mazanoke
  labels:
    app: mazanoke
spec:
  revisionHistoryLimit: 5
  replicas: 1
  selector:
    matchLabels:
      app: mazanoke
  template:
    metadata:
      labels:
        app: mazanoke
    spec:
      serviceAccountName: mazanoke
      containers:
        - name: mazanoke
          image: ghcr.io/civilblur/mazanoke:v1.1.6
          # nginx serving static (client-side image optimizer), binds :80. Root master
          # setuid-drops workers, so it stays root with curated caps + NET_BIND_SERVICE for
          # the :80 bind + seccomp. readOnlyRootFilesystem on top: nginx's only writes are
          # /run/nginx.pid + the /var/cache/nginx temp dirs (emptyDirs below); access/error
          # logs are symlinked to stdout/stderr, so nothing else touches the rootfs.
          securityContext:
            seccompProfile:
              type: RuntimeDefault
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - SETUID
                - SETGID
                - NET_BIND_SERVICE
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          volumeMounts:
            - name: run
              mountPath: /run
            - name: nginx-cache
              mountPath: /var/cache/nginx
      volumes:
        - name: run
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
