apiVersion: apps/v1
kind: Deployment
metadata:
  name: mazanoke
  labels:
    app: mazanoke
spec:
  revisionHistoryLimit: 5
  replicas: 1
  selector:
    matchLabels:
      app: mazanoke
  template:
    metadata:
      labels:
        app: mazanoke
    spec:
      serviceAccountName: mazanoke
      # Full non-root: a static-file nginx needs no root once it listens on the unprivileged :8080.
      # The mazanoke-nginx configmap replaces the baked config (listen 8080, error_log stderr, /tmp
      # temp paths); run as the image's nginx uid 101. The stock docker-entrypoint.d scripts tolerate
      # the read-only mounted config (same as under the prior readOnlyRootFilesystem).
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mazanoke
          image: ghcr.io/civilblur/mazanoke:v1.1.6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
      volumes:
        - name: nginx-conf
          configMap:
            name: mazanoke-nginx
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
