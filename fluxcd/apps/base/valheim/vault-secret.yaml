apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: valheim-secret
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: openbao-operationtimecapsule
    kind: ClusterSecretStore
  target:
    name: valheim-secret
    template:
      type: Opaque
      # Key matches the image's env name (consumed via envFrom); 5 characters minimum.
      data:
        SERVER_PASS: "{{ .SERVER_PASS | toString }}"
  dataFrom:
    - extract:
        key: apps/valheim
