apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: valheim-secret
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-optcp
  target:
    name: valheim-secret
    creationPolicy: Owner
    template:
      type: Opaque
      # Stored as SERVER_PASSWORD like every game server; the image reads SERVER_PASS (5+ chars).
      data:
        SERVER_PASS: "{{ .serverPassword }}"
  data:
    - secretKey: serverPassword
      remoteRef:
        key: apps/valheim/app
        property: SERVER_PASSWORD
