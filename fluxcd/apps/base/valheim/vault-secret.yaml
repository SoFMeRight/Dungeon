apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: valheim-secret
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: openbao-optcp
    kind: ClusterSecretStore
  target:
    name: valheim-secret
    template:
      type: Opaque
      # Stored as SERVER_PASSWORD like every game server; the image reads SERVER_PASS (5+ chars).
      data:
        SERVER_PASS: "{{ .SERVER_PASSWORD | toString }}"
  dataFrom:
    - extract:
        key: apps/valheim/app
