apiVersion: vault.banzaicloud.com/v1alpha1
kind: Vault
metadata:
  name: vault
spec:
  size: 3
  image: PLACEHOLDER_VAULT_IMAGE
  bankVaultsImage: ghcr.io/bank-vaults/bank-vaults:v1.33.1

  # Use Kubernetes secrets for unseal keys (SOPS encrypted in source)
  unsealConfig:
    options: {}  # Empty options object required by CRD
    kubernetes:
      secretNamespace: PLACEHOLDER_NAMESPACE
      secretName: vault-unseal-keys

  # Vault configuration for HA with Raft storage
  config:
    storage:
      raft:
        path: /vault/data
        node_id: "${ env `POD_NAME` }"
        retry_join:
          - leader_api_addr: "http://vault-0.zeldas-lullaby.svc.cluster.local:8200"
    listener:
      tcp:
        address: "0.0.0.0:8200"
        tls_disable: true
    api_addr: "http://${ env `POD_NAME` }.zeldas-lullaby.svc.cluster.local:8200"
    cluster_addr: "https://${ env `POD_NAME` }.zeldas-lullaby.svc.cluster.local:8201"
    ui: true
    disable_mlock: true

  # Volume claim templates for raft storage (one per pod)
  volumeClaimTemplates:
    - metadata:
        name: vault-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: ceph-rbd
        resources:
          requests:
            storage: 10Gi

  # Volume mounts for raft storage
  volumeMounts:
    - name: vault-data
      mountPath: /vault/data

  # Resources
  resources:
    vault:
      requests:
        memory: "144Mi"
        cpu: "70m"
      limits:
        memory: "256Mi"
        cpu: "150m"
    bankVaults:
      requests:
        memory: "64Mi"
        cpu: "2m"
      limits:
        memory: "128Mi"
        cpu: "20m"
    prometheusExporter:
      requests:
        memory: "16Mi"
        cpu: "2m"
      limits:
        memory: "32Mi"
        cpu: "10m"

  # Service configuration - disabled during initialization
  serviceRegistrationEnabled: false

  # Use the vault service account
  serviceAccount: vault

  # Fix statsd exporter image with full registry path
  statsdImage: docker.io/prom/statsd-exporter:v0.29.0

  # Make sure it runs on worker nodes with pod anti-affinity for HA
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: node-role.kubernetes.io/worker
                operator: Exists
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - vault
            topologyKey: kubernetes.io/hostname
