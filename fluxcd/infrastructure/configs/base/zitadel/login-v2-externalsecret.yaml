apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-login-client
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-optcp
  target:
    name: zitadel-login-client
    creationPolicy: Owner
  data:
    - secretKey: pat
      remoteRef:
        key: apps/zitadel/login
        property: TOKEN
    - secretKey: userId
      remoteRef:
        key: apps/zitadel/login
        property: USER_ID
