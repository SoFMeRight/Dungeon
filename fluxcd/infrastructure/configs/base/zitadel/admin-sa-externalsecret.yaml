apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-k8s-admin-sa
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-optcp
  target:
    name: zitadel-k8s-admin-sa
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: apps/zitadel/admin
        property: TOKEN
    - secretKey: userId
      remoteRef:
        key: apps/zitadel/admin
        property: USER_ID
