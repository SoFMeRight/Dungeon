---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ceph-rbd
  annotations:
    reclaimspace.csiaddons.openshift.io/schedule: "0 22 * * 6"
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: gorons-bracelet.rbd.csi.ceph.com
parameters:
  clusterID: "0985467c-d8f3-4483-b27f-f0a512397ec2"
  pool: "dungeon"
  imageFeatures: layering
  csi.storage.k8s.io/provisioner-secret-name: csi-rbd-provisioner
  csi.storage.k8s.io/provisioner-secret-namespace: gorons-bracelet
  csi.storage.k8s.io/controller-expand-secret-name: csi-rbd-provisioner
  csi.storage.k8s.io/controller-expand-secret-namespace: gorons-bracelet
  csi.storage.k8s.io/node-stage-secret-name: csi-rbd-node
  csi.storage.k8s.io/node-stage-secret-namespace: gorons-bracelet
  csi.storage.k8s.io/fstype: ext4
reclaimPolicy: Retain
allowVolumeExpansion: true
mountOptions:
  - discard
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
