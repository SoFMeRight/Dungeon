apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: joplin-realip-xylem
  namespace: arylls-lookout
spec:
  # joplin-server derives the request IP from X-Real-Ip (userIp(): x-real-ip
  # header, else ctx.ip) but does not enable koa app.proxy, so without the
  # header it logs the mesh peer (ztunnel pod) instead of the client -- which
  # would make CrowdSec ban the gateway rather than the attacker. The xylem
  # gateway forwards neither X-Real-Ip nor X-Forwarded-For, so inject X-Real-Ip
  # from the gateway's downstream client address on request. `replace` (not add)
  # so a client-supplied header cannot spoof the ban source. Scoped to
  # joplin.pcfae.com so no other xylem backend is affected.
  workloadSelector:
    labels:
      gateway.networking.k8s.io/gateway-name: xylem-gateway
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          portNumber: 443
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter:
                name: envoy.filters.http.router
      patch:
        operation: INSERT_BEFORE
        value:
          name: joplin-realip-lua
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
            defaultSourceCode:
              inlineString: |
                function envoy_on_request(request_handle)
                  local host = request_handle:headers():get(":authority")
                  if host and string.find(host, "joplin.pcfae.com", 1, true) then
                    local addr = request_handle:streamInfo():downstreamDirectRemoteAddress()
                    if addr then
                      local ip = addr:gsub(":%d+$", ""):gsub("^%[", ""):gsub("%]$", "")
                      request_handle:headers():replace("x-real-ip", ip)
                    end
                  end
                end
