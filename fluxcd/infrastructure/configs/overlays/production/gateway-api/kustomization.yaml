apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/gateway-api
  # ── EnvoyFilters: fairer-pages (default error pages) ───────
  - envoyfilter-fairer-pages-cell-membrane.yaml
  - envoyfilter-fairer-pages-xylem.yaml
  - envoyfilter-fairer-pages-phloem.yaml
  # ── EnvoyFilters: HSTS headers ─────────────────────────────
  - envoyfilter-hsts-cell-membrane.yaml
  - envoyfilter-hsts-xylem.yaml
  - envoyfilter-hsts-phloem.yaml
  # Gateway-wide real-client-IP normalization: replaces client-spoofable XFF/X-Real-Ip with the
  # gateway's downstream direct remote address, on every host. Replaced the former per-app
  # (anubis/joplin/osticket) realip filters, which were redundant here and stale after the
  # route swap moved their hosts to phloem.
  - envoyfilter-realip-xylem.yaml
  - envoyfilter-realip-phloem.yaml
  - envoyfilter-realip-cell-membrane.yaml
  # ── EnvoyFilters: http→https Location rewrite ──────────────
  - envoyfilter-https-location-cell-membrane.yaml
  - envoyfilter-https-location-xylem.yaml
  - envoyfilter-https-location-phloem.yaml
  # ── EnvoyFilters: app-specific ─────────────────────────────
  - envoyfilter-ceph-dashboard-health-xylem.yaml
  - envoyfilter-ceph-dashboard-health-phloem.yaml
  - envoyfilter-home-assistant-websocket-cell-membrane.yaml
  - envoyfilter-meshcentral-websocket-cell-membrane.yaml
  - envoyfilter-netbird-websocket-cell-membrane.yaml
  - envoyfilter-tacticalrmm-websocket-cell-membrane.yaml
  - envoyfilter-ntfy-timeout-cell-membrane.yaml
  - envoyfilter-ntfy-timeout-xylem.yaml
  - envoyfilter-sideporch-camera-phloem.yaml
  # ── HTTPRoutes ─────────────────────────────────────────────
  - httproute-http-redirect-cell-membrane.yaml
  - httproute-http-redirect-xylem.yaml
  - httproute-http-redirect-phloem.yaml
patches:
  - path: gateway-patch-xylem.yaml
    target:
      kind: Gateway
      name: xylem-gateway
  - path: gateway-patch-cell-membrane.yaml
    target:
      kind: Gateway
      name: cell-membrane-gateway
  - path: gateway-patch-phloem.yaml
    target:
      kind: Gateway
      name: phloem-gateway
  # Set namespace for xylem-gateway to arylls-lookout
  - patch: |-
      - op: add
        path: /metadata/namespace
        value: arylls-lookout
    target:
      kind: Gateway
      name: xylem-gateway
  # Set namespace for cell-membrane-gateway to hyrule-castle
  - patch: |-
      - op: add
        path: /metadata/namespace
        value: hyrule-castle
    target:
      kind: Gateway
      name: cell-membrane-gateway
  # Set namespace for phloem-gateway to prelude-of-light
  - patch: |-
      - op: add
        path: /metadata/namespace
        value: prelude-of-light
    target:
      kind: Gateway
      name: phloem-gateway
