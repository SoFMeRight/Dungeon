apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: meshcentral-websocket-cell-membrane
  namespace: hyrule-castle
spec:
  # MeshCentral's remote-desktop / terminal / agent connections are long-lived WebSockets.
  # Disable the route timeout + idle-timeout so they aren't reaped. Browsers use the standard
  # HTTP/1.1 WebSocket upgrade (istio's default) — no gateway-wide h2 allow_connect.
  # SCOPED to meshc.prplanit.com ONLY — this file must never affect any other app's routes.
  workloadSelector:
    labels:
      gateway.networking.k8s.io/gateway-name: cell-membrane-gateway
  configPatches:
    - applyTo: HTTP_ROUTE
      match:
        context: GATEWAY
        routeConfiguration:
          vhost:
            name: meshc.prplanit.com:443
            route:
              action: ANY
      patch:
        operation: MERGE
        value:
          route:
            timeout: 0s
            idle_timeout: 0s
            upgrade_configs:
              - upgrade_type: websocket
                enabled: true
