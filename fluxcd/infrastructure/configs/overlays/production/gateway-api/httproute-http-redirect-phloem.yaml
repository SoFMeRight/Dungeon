apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-redirect-phloem
  namespace: optcp-gateway-phloem
spec:
  parentRefs:
    - name: phloem-gateway
      namespace: optcp-gateway-phloem
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
