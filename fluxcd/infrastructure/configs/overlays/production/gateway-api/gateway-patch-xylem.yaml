apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: xylem-gateway
  annotations:
    lbipam.cilium.io/ips: "172.22.30.69"
    lbipam.cilium.io/sharing-key: "pedestal-of-time"
    lbipam.cilium.io/sharing-cross-namespace: "*"
    service.cilium.io/loadbalancer-mode: "dsr"
    # Carries envoyproxy/envoy#45198 (HBONE connect_originate stream leak), which
    # ships in 1.32; 1.31.2 (Envoy 1.39.5) does not carry it. Control plane is on 1.31.2.
    sidecar.istio.io/proxyImage: docker.io/istio/proxyv2:1.32.0-alpha.0-distroless
spec:
  infrastructure:
    labels:
      policy.prplanit.com/metrics: "true"
      policy.prplanit.com/client-class: ingress-gateway
      policy.prplanit.com/ingress-instance: xylem
    # Istio propagates these to the generated gateway pod (as it does the labels above).
    # The istio-proxy socket/cert volumes are ephemeral with no backup value; keep them
    # out of Velero fs-backup.
    annotations:
      backup.velero.io/backup-volumes-excludes: workload-socket,credential-socket,istio-envoy,workload-certs,istio-data
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https-pcfae
      protocol: HTTPS
      port: 443
      hostname: "*.pcfae.com"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: pcfae-com-tls
    - name: https-pcfae-apex
      protocol: HTTPS
      port: 443
      hostname: "pcfae.com"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: pcfae-com-apex-tls
    - name: https-cr-pcfae
      protocol: HTTPS
      port: 443
      hostname: "*.cr.pcfae.com"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: cr-pcfae-com-tls
