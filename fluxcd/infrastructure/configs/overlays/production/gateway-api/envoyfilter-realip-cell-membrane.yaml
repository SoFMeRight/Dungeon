apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: realip-cell-membrane
  namespace: hyrule-castle
spec:
  # Gateway-wide real-client-IP normalization for the public gateway — REPLACE X-Forwarded-For
  # and X-Real-Ip with the gateway's downstream direct remote address so a client-supplied header
  # cannot spoof the logged/banned IP. downstreamDirectRemoteAddress() is the real client here
  # (source preserved through the pfSense L4 forward / DSR) — the same value the existing
  # osticket-realip-cell-membrane filter already trusts, generalized to every host. See
  # envoyfilter-realip-phloem for the full rationale.
  workloadSelector:
    labels:
      gateway.networking.k8s.io/gateway-name: cell-membrane-gateway
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          portNumber: 443
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter:
                name: envoy.filters.http.router
      patch:
        operation: INSERT_BEFORE
        value:
          name: realip-normalize-lua
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
            defaultSourceCode:
              inlineString: |
                function envoy_on_request(request_handle)
                  local addr = request_handle:streamInfo():downstreamDirectRemoteAddress()
                  if addr then
                    local ip = addr:gsub(":%d+$", ""):gsub("^%[", ""):gsub("%]$", "")
                    request_handle:headers():replace("x-forwarded-for", ip)
                    request_handle:headers():replace("x-real-ip", ip)
                  end
                end
