apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-redirect
  namespace: optcp-ingress-public
spec:
  parentRefs:
    - name: cell-membrane-ingress-gateway
      namespace: optcp-ingress-public
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
