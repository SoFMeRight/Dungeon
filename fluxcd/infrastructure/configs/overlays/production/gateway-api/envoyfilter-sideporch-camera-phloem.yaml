apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: sideporch-camera-tls12
  namespace: prelude-of-light
spec:
  workloadSelector:
    labels:
      gateway.networking.k8s.io/gateway-name: phloem-gateway
  configPatches:
    # The Reolink camera at sideporch.prplanit.internal negotiates only static-RSA ciphers
    # (AES128-GCM-SHA256 / AES256-GCM-SHA384) and rejects every ECDHE suite, while envoy's
    # BoringSSL offers ECDHE-only by default — no common cipher, so TLS origination fails at
    # the handshake (cx_connect_fail, 503 to clients). istio-ambient builds this upstream as
    # an EDS cluster with transport_socket_matches (hbone + user), and EnvoyFilter can only
    # append to that list — first-match wins, so a partial TLS patch is shadowed by the
    # original match. So the cluster is replaced with a self-contained STATIC one whose TLS
    # origination pins the static-RSA ciphers the camera accepts. The ServiceEntry/
    # DestinationRule still define the route target; this only fixes the cipher handshake.
    - applyTo: CLUSTER
      match:
        context: GATEWAY
        cluster:
          name: "outbound|443||sideporch.prplanit.internal"
      patch:
        operation: REMOVE
    - applyTo: CLUSTER
      match:
        context: GATEWAY
      patch:
        operation: ADD
        value:
          name: "outbound|443||sideporch.prplanit.internal"
          connect_timeout: 10s
          type: STATIC
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: "outbound|443||sideporch.prplanit.internal"
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: 10.9.11.129
                          port_value: 443
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              sni: sideporch.prplanit.internal
              common_tls_context:
                tls_params:
                  tls_minimum_protocol_version: TLSv1_2
                  tls_maximum_protocol_version: TLSv1_2
                  cipher_suites:
                    - "AES128-GCM-SHA256"
                    - "AES256-GCM-SHA384"
                    - "ECDHE-RSA-AES128-GCM-SHA256"
