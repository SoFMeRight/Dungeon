apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: cell-membrane-gateway
  annotations:
    lbipam.cilium.io/ips: "172.22.30.71"
    lbipam.cilium.io/sharing-key: "hyrule-castle"
    lbipam.cilium.io/sharing-cross-namespace: "*"
    service.cilium.io/loadbalancer-mode: "dsr"
spec:
  infrastructure:
    labels:
      policy.prplanit.com/metrics: "true"
      policy.prplanit.com/client-class: ingress-gateway
      policy.prplanit.com/ingress-instance: cell-membrane
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https-prplanit
      protocol: HTTPS
      port: 443
      hostname: "*.prplanit.com"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: prplanit-com-tls
    - name: https-precisionplanit
      protocol: HTTPS
      port: 443
      hostname: "*.precisionplanit.com"
