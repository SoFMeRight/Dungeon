apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: realip-phloem
  namespace: prelude-of-light
spec:
  # Gateway-wide real-client-IP normalization. By default Envoy passes a client-supplied
  # X-Forwarded-For through unchanged, so any backend that trusts the leftmost XFF (or reads
  # X-Real-Ip) can be fed a forged IP — verified: uptime-kuma, mealie and jellyseerr all logged
  # an attacker-controlled `X-Forwarded-For`. That lets a spoofed header make CrowdSec ban an
  # innocent IP. Fix it once at the gateway: REPLACE (not add) both X-Forwarded-For and
  # X-Real-Ip with the gateway's own downstream direct remote address — the real TCP client
  # (DSR-preserved on this internal gateway) — so no client header can override the ban source.
  # This is the same downstreamDirectRemoteAddress() the osticket/joplin/anubis per-app filters
  # already trust, generalized to every host so app-log detections read an unspoofable IP.
  workloadSelector:
    labels:
      gateway.networking.k8s.io/gateway-name: phloem-gateway
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          portNumber: 443
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter:
                name: envoy.filters.http.router
      patch:
        operation: INSERT_BEFORE
        value:
          name: realip-normalize-lua
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
            defaultSourceCode:
              inlineString: |
                function envoy_on_request(request_handle)
                  local addr = request_handle:streamInfo():downstreamDirectRemoteAddress()
                  if addr then
                    local ip = addr:gsub(":%d+$", ""):gsub("^%[", ""):gsub("%]$", "")
                    request_handle:headers():replace("x-forwarded-for", ip)
                    request_handle:headers():replace("x-real-ip", ip)
                  end
                end
