apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-redirect
  namespace: optcp-ingress-operator
spec:
  parentRefs:
    - name: xylem-ingress-gateway
      namespace: optcp-ingress-operator
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
