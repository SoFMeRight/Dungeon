apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-masterkey
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-optcp
  target:
    name: zitadel-masterkey
    creationPolicy: Owner
    template:
      data:
        masterkey: "{{ .MASTERKEY }}"
  data:
    - secretKey: MASTERKEY
      remoteRef:
        key: apps/zitadel/app
        property: MASTERKEY
