apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: optcp-identity

resources:
  - ../../../base/zitadel  # Get the base config
  - externalsecret-masterkey.yaml
  - externalsecret-zitadel-secrets.yaml

patches:
  - path: config-patch.yaml
    target:
      kind: ConfigMap
      name: zitadel-config
