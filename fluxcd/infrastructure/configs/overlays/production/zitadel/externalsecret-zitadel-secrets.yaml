# username/password are the CNPG owner secret; the rest is Zitadel's env.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-optcp
  target:
    name: zitadel-secrets
    creationPolicy: Owner
    template:
      data:
        username: "{{ .POSTGRES_USER }}"
        password: "{{ .POSTGRES_PASSWORD }}"
        ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: "{{ .POSTGRES_PASSWORD }}"
        SMTP_USER: "{{ .SMTP_USERNAME }}"
        SMTP_PASSWORD: "{{ .SMTP_PASSWORD }}"
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: apps/zitadel/postgres
        property: USER
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: apps/zitadel/postgres
        property: PASSWORD
    - secretKey: SMTP_USERNAME
      remoteRef:
        key: apps/zitadel/smtp
        property: USERNAME
    - secretKey: SMTP_PASSWORD
      remoteRef:
        key: apps/zitadel/smtp
        property: PASSWORD
