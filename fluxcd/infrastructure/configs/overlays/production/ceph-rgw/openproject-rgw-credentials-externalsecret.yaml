apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openproject-rgw-credentials
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-optcp
  target:
    name: openproject-rgw-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  refreshInterval: 5m
  data:
    - secretKey: s3_access_key
      remoteRef:
        key: apps/openproject/s3-optcp
        property: ACCESS_KEY
    - secretKey: s3_secret_key
      remoteRef:
        key: apps/openproject/s3-optcp
        property: SECRET_KEY
