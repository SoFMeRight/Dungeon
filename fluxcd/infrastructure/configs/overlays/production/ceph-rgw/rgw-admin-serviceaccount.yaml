apiVersion: v1
kind: ServiceAccount
metadata:
  name: rgw-admin
# Identity for the per-app RGW setup jobs. They run meshed (ambient) so they
# present this SPIFFE identity to ceph-rgw, which is authz-protected
# (allow-harbor-to-rgw flips it to default-deny). allow-rgw-admin-jobs permits
# this SA -> ceph-rgw:8080, the Istio-layer sibling of the Cilium cap.ceph allow.
