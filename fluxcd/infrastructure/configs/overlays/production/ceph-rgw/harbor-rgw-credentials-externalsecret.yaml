apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-rgw-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-zeldas-letter
    kind: ClusterSecretStore
  target:
    name: harbor-rgw-credentials
    creationPolicy: Owner
  data:
    - secretKey: access_key
      remoteRef:
        key: rgw/harbor
        property: S3_ACCESS_KEY
    - secretKey: secret_key
      remoteRef:
        key: rgw/harbor
        property: S3_SECRET_KEY
