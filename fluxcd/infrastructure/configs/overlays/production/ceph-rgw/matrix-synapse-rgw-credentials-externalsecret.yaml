apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: matrix-synapse-rgw-credentials
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-outspokekin
  target:
    name: matrix-synapse-rgw-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  refreshInterval: 5m
  dataFrom:
    - extract:
        key: rgw/matrix-synapse
        conversionStrategy: Default
        decodingStrategy: None
