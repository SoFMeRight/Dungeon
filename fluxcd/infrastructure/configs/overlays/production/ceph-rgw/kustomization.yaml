apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: optcp-operators-privileged
resources:
  - rgw-admin-serviceaccount.yaml
  - ceph-rgw-keyring.enc.yaml
  - gitlab-rgw-credentials.enc.yaml
  - ceph-rgw-bucket-provisioning-gitlab.yaml
  - harbor-rgw-credentials-externalsecret.yaml
  - ceph-rgw-bucket-provisioning-harbor.yaml
  - loki-rgw-credentials-externalsecret.yaml
  - ceph-rgw-bucket-provisioning-loki.yaml
  - appflowy-rgw-credentials-externalsecret.yaml
  - ceph-rgw-bucket-provisioning-appflowy.yaml
  - nextcloud-rgw-credentials-externalsecret.yaml
  - ceph-rgw-bucket-provisioning-nextcloud.yaml
  - renovate-rgw-credentials-externalsecret.yaml
  - ceph-rgw-bucket-provisioning-renovate.yaml
  - matrix-synapse-rgw-credentials-externalsecret.yaml
  - ceph-rgw-bucket-provisioning-matrix-synapse.yaml
  - reactive-resume-rgw-credentials-externalsecret.yaml
  - ceph-rgw-bucket-provisioning-reactive-resume.yaml
  - openproject-rgw-credentials-externalsecret.yaml
  - ceph-rgw-bucket-provisioning-openproject.yaml
  - stalwart-rgw-credentials-externalsecret.yaml
  - ceph-rgw-bucket-provisioning-stalwart.yaml
  - dependency-track-rgw-credentials-externalsecret.yaml
  - ceph-rgw-bucket-provisioning-dependency-track.yaml

# The bucket setup script. The name carries a hash of the script, so a change to it
# changes every bucket Job's pod template: Flux force-replaces each Job and every
# bucket is set up again by the new script.
configMapGenerator:
  - name: ceph-rgw-bucket-provisioning-script
    files:
      - setup.sh=ceph-rgw-bucket-provisioning-setup.sh
