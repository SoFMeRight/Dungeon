apiVersion: v1
kind: ServiceAccount
metadata:
  name: optcp-k8s-dungeon-internal
automountServiceAccountToken: false
---
# Reads only the internal registry pull token, as its own ServiceAccount.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-optcp-k8s-dungeon-internal
spec:
  provider:
    vault:
      server: "http://openbao.zeldas-lullaby.svc.cluster.local:8200"
      path: "optcp"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "optcp-k8s-dungeon-internal"
          serviceAccountRef:
            name: optcp-k8s-dungeon-internal
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pull-secret-cr-optcp-optcp-k8s-dungeon-internal
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-optcp-k8s-dungeon-internal
    kind: SecretStore
  target:
    name: pull-secret-cr-optcp-optcp-k8s-dungeon-internal
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "cr.optcp.com": {
                "auth": "{{ printf "%s:%s" .USERNAME .PASSWORD | b64enc }}"
              },
              "*.cr.optcp.com": {
                "auth": "{{ printf "%s:%s" .USERNAME .PASSWORD | b64enc }}"
              }
            }
          }
  data:
    - secretKey: USERNAME
      remoteRef:
        key: shared/registry/cr.optcp.com-internal
        property: USERNAME
    - secretKey: PASSWORD
      remoteRef:
        key: shared/registry/cr.optcp.com-internal
        property: PASSWORD
