apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: pull-secret-cr-optcp-optcp-k8s-dungeon-public
spec:
  externalSecretName: pull-secret-cr-optcp-optcp-k8s-dungeon-public
  namespaceSelectors:
    - matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: Exists
  refreshTime: 1h
  externalSecretSpec:
    refreshInterval: 1h
    secretStoreRef:
      name: openbao-optcp-k8s-dungeon-public
      kind: ClusterSecretStore
    target:
      name: pull-secret-cr-optcp-optcp-k8s-dungeon-public
      creationPolicy: Owner
      template:
        type: kubernetes.io/dockerconfigjson
        data:
          .dockerconfigjson: |
            {
              "auths": {
                "cr.optcp.com": {
                  "auth": "{{ printf "%s:%s" .USERNAME .PASSWORD | b64enc }}"
                },
                "*.cr.optcp.com": {
                  "auth": "{{ printf "%s:%s" .USERNAME .PASSWORD | b64enc }}"
                }
              }
            }
    data:
      - secretKey: USERNAME
        remoteRef:
          key: shared/registry/cr.optcp.com-public
          property: USERNAME
      - secretKey: PASSWORD
        remoteRef:
          key: shared/registry/cr.optcp.com-public
          property: PASSWORD
