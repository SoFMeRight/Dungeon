---
apiVersion: batch/v1
kind: Job
metadata:
  name: cephfs-init-grafana
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: setup
          image: docker.io/prplanit/ansible-oci:2.20.1-v2
          command:
            - ansible-playbook
            - /scripts/cephfs-init-rootpaths.yml
            - -e
            - path=/dungeon/nvme/apps/grafana/plugins owner=472:472 mode=0755
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
          env:
            - name: HOME
              value: /tmp
            - name: ANSIBLE_LOCAL_TEMP
              value: /tmp/.ansible
          volumeMounts:
            - name: cephfs-root
              mountPath: /cephfs
            - name: setup-script
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: cephfs-root
          persistentVolumeClaim:
            claimName: gorons-bracelet-cephfs-root
        - name: setup-script
          configMap:
            name: cephfs-setup-script
        - name: tmp
          emptyDir: {}
