---
apiVersion: batch/v1
kind: Job
metadata:
  name: cephfs-init-ark-sa
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      # Runs as root: it chowns cephfs subpaths to arbitrary app uid:gid (a
      # cross-owner operation CAP_CHOWN can't do reliably as non-root under
      # no_new_privs). Blast radius is minimised — all caps dropped except the
      # three chown/mkdir needs, no-privesc, seccomp, read-only rootfs.
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: setup-nvme
          image: docker.io/prplanit/ansible-oci:2.20.1-v2
          command:
            - ansible-playbook
            - /scripts/cephfs-init-rootpaths.yml
            - -e
            - path=/dungeon/nvme/games/ark-sa/serverfiles owner=7777:7777 mode=0755
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
          env:
            - name: HOME
              value: /tmp
            - name: ANSIBLE_LOCAL_TEMP
              value: /tmp/.ansible
            - name: ANSIBLE_REMOTE_TMP
              value: /tmp/.ansible
          volumeMounts:
            - name: cephfs-root
              mountPath: /cephfs
            - name: setup-script
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
        - name: setup-hdd
          image: docker.io/prplanit/ansible-oci:2.20.1-v2
          command:
            - ansible-playbook
            - /scripts/cephfs-init-rootpaths.yml
            - -e
            - path=/dungeon/hdd/games/ark-sa subdirs=cluster,steamapps owner=7777:7777 mode=0755
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
          env:
            - name: HOME
              value: /tmp
            - name: ANSIBLE_LOCAL_TEMP
              value: /tmp/.ansible
            - name: ANSIBLE_REMOTE_TMP
              value: /tmp/.ansible
          volumeMounts:
            - name: cephfs-root
              mountPath: /cephfs
            - name: setup-script
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
      containers:
        - name: complete
          image: docker.io/prplanit/ansible-oci:2.20.1-v2
          command:
            - echo
            - "ARK SA CephFS initialization complete"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: cephfs-root
          persistentVolumeClaim:
            claimName: gorons-bracelet-cephfs-root
        - name: setup-script
          configMap:
            name: cephfs-setup-script
        - name: tmp
          emptyDir: {}
