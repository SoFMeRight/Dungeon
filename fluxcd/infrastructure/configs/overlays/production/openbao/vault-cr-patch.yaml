apiVersion: vault.banzaicloud.com/v1alpha1
kind: Vault
metadata:
  name: openbao
spec:
  image: docker.io/openbao/openbao:2.7.2
  envsConfig:
    - name: VAULT_OIDC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: openbao-oidc-credentials
          key: client-secret
  vaultPodSpec:
    imagePullSecrets:
      - name: pull-secret-cr-optcp-optcp-k8s-dungeon-public
  vaultLabels:
    policy.prplanit.com/ingress: "true"
    policy.prplanit.com/cap.oidc: "true"
  vaultAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9091"
  vaultContainerSpec:
    name: openbao                       # CRD-required; also the pod's vault-container name
    # raft snapshot restore writes a temp file via os.CreateTemp; readOnlyRootFilesystem (kyverno)
    # makes /tmp RO, so point TMPDIR at the writable raft PVC. Must be a real container env
    # (bank-vaults' envsConfig does NOT reach the openbao container's process env).
    env:
      - name: TMPDIR
        value: /vault/data
    # Sealed-tolerant liveness (sealedcode/uninitcode=200): bank-vaults' default probe returns
    # 503 while sealed and kills the pod in ~30s — fatal on a COLD start (all nodes sealed at
    # once) where the configurer needs a stable window to init+unseal. Unsealed nodes still pass.
    livenessProbe:
      httpGet:
        path: /v1/sys/health?standbyok=true&perfstandbyok=true&sealedcode=200&uninitcode=200&drsecondarycode=200
        port: api-port
        scheme: HTTP
      # /sys/health answers slowly during a raft election; 3s x 3 killed nodes mid-election.
      failureThreshold: 6
      initialDelaySeconds: 60
      periodSeconds: 10
      timeoutSeconds: 10
    securityContext:
      capabilities:
        add:
          - CHOWN
          - FOWNER
          - SETFCAP
          - SETGID
          - SETUID
        drop:
          - ALL
    # The operator already injects /vault/config and /vault/data; only the openbao-native
    # config path is declared here. Re-adding the vault paths duplicates the operator's own
    # mounts and the StatefulSet reconcile fails on non-unique mountPaths.
    volumeMounts:
      - name: vault-config
        mountPath: /openbao/config
  unsealConfig:
    kubernetes:
      secretNamespace: optcp-secrets
  vaultConfigurerPodSpec: {}
  externalConfig:
    policies:
      - name: external-secrets
        rules: |
          path "operationtimecapsule/data/*" {
            capabilities = ["read", "list"]
          }
          path "operationtimecapsule/metadata/*" {
            capabilities = ["read", "list"]
          }
          path "precisionplanit/data/*" {
            capabilities = ["read", "list"]
          }
          path "precisionplanit/metadata/*" {
            capabilities = ["read", "list"]
          }
          path "zeldas-letter/data/*" {
            capabilities = ["read", "list"]
          }
          path "zeldas-letter/metadata/*" {
            capabilities = ["read", "list"]
          }
          path "great-sea/data/*" {
            capabilities = ["read", "list"]
          }
          path "great-sea/metadata/*" {
            capabilities = ["read", "list"]
          }
          path "outspokekin/data/*" {
            capabilities = ["read", "list"]
          }
          path "outspokekin/metadata/*" {
            capabilities = ["read", "list"]
          }
          path "pedestal-of-time/data/*" {
            capabilities = ["read", "list"]
          }
          path "pedestal-of-time/metadata/*" {
            capabilities = ["read", "list"]
          }
          path "arbitorium/data/*" {
            capabilities = ["read", "list"]
          }
          path "arbitorium/metadata/*" {
            capabilities = ["read", "list"]
          }
      # Tenant policy (audits/Secret-Storage.md): reads only the optcp mount.
      - name: external-secrets-optcp
        rules: |
          path "optcp/data/*" {
            capabilities = ["read", "list"]
          }
          path "optcp/metadata/*" {
            capabilities = ["read", "list"]
          }
      # Tenant policy (audits/Secret-Storage.md): reads only the prplanit mount.
      - name: external-secrets-prplanit
        rules: |
          path "prplanit/data/*" {
            capabilities = ["read", "list"]
          }
          path "prplanit/metadata/*" {
            capabilities = ["read", "list"]
          }
      # zitadel-configuration writes the admin-SA PAT it mints and caches the flatroles
      # signing key it reads back.
      - name: zitadel-provisioner
        rules: |
          path "optcp/data/apps/zitadel/admin" {
            capabilities = ["create", "update", "patch"]
          }
          path "optcp/data/apps/zitadel/app" {
            capabilities = ["create", "update", "patch", "read"]
          }
      # dependency-track-configuration issues Dependency-Track keys; it writes them, never reads.
      - name: dependency-track-configuration
        rules: |
          path "optcp/data/apps/+/dependency-track" {
            capabilities = ["create", "update"]
          }
      - name: vault-admin
        rules: |
          path "*" {
            capabilities = ["create", "read", "update", "delete", "list", "sudo"]
          }
      # boundary-init stores the admin login database init generates; it writes, never reads.
      - name: boundary-init
        rules: |
          path "optcp/data/apps/boundary/app" {
            capabilities = ["create", "update", "patch"]
          }
      # stalwart-configuration writes the identities Stalwart issues: the Gmail sync's app
      # password, and the empty smtp-<name> seeds the Operator fills. It reads no secret, only
      # metadata: the app password it recorded, and whether a seed already exists.
      - name: stalwart-configuration
        rules: |
          path "optcp/data/apps/stalwart/gmail-sync" {
            capabilities = ["create", "update"]
          }
          path "optcp/metadata/apps/stalwart/gmail-sync" {
            capabilities = ["create", "read", "update"]
          }
          path "optcp/data/apps/stalwart/smtp-*" {
            capabilities = ["create"]
          }
          path "optcp/metadata/apps/stalwart/smtp-*" {
            capabilities = ["read"]
          }
      # People with the operator role sign their own SSH certificate; the role limits the
      # principal to their own username.
      - name: ssh-operator
        rules: |
          path "optcp-ssh/sign/operator" {
            capabilities = ["create", "update"]
          }
      # Registry pull tokens (Registry Tokens): each reads only its own entry.
      - name: optcp-docker-io
        rules: |
          path "optcp/data/shared/registry/docker.io" {
            capabilities = ["read"]
          }
      - name: optcp-k8s-dungeon-public
        rules: |
          path "optcp/data/shared/registry/cr.optcp.com-public" {
            capabilities = ["read"]
          }
      - name: optcp-k8s-dungeon-internal
        rules: |
          path "optcp/data/shared/registry/cr.optcp.com-internal" {
            capabilities = ["read"]
          }
      # Workload consumers (Secret Stores, least privilege): each reads only its own entries.
      - name: twofauth
        rules: |
          path "optcp/data/apps/twofauth/app" {
            capabilities = ["read"]
          }
          path "optcp/data/apps/twofauth/oidc" {
            capabilities = ["read"]
          }
          path "optcp/data/apps/twofauth/smtp" {
            capabilities = ["read"]
          }
      - name: vaultwarden
        rules: |
          path "optcp/data/apps/vaultwarden/app" {
            capabilities = ["read"]
          }
          path "optcp/data/apps/vaultwarden/oidc" {
            capabilities = ["read"]
          }
          path "optcp/data/apps/vaultwarden/smtp" {
            capabilities = ["read"]
          }
      - name: netbird
        rules: |
          path "optcp/data/apps/netbird/app" {
            capabilities = ["read"]
          }
          path "optcp/data/apps/netbird/oidc" {
            capabilities = ["read"]
          }
          path "optcp/data/apps/netbird/postgres" {
            capabilities = ["read"]
          }
          path "optcp/data/apps/netbird/s3-backup" {
            capabilities = ["read"]
          }
          path "optcp/data/apps/netbird/zitadel" {
            capabilities = ["read"]
          }
      - name: netbird-router
        rules: |
          path "optcp/data/apps/netbird-router/netbird" {
            capabilities = ["read"]
          }
      - name: netbox
        rules: |
          path "optcp/data/apps/netbox/app" {
            capabilities = ["read"]
          }
          path "optcp/data/apps/netbox/oidc" {
            capabilities = ["read"]
          }
          path "optcp/data/apps/netbox/postgres" {
            capabilities = ["read"]
          }
      - name: semaphore
        rules: |
          path "optcp/data/apps/semaphore/app" {
            capabilities = ["read"]
          }
          path "optcp/data/apps/semaphore/postgres" {
            capabilities = ["read"]
          }
      - name: unifi-network-application
        rules: |
          path "optcp/data/apps/unifi-network-application/mongodb" {
            capabilities = ["read"]
          }
      - name: vaultwarden-postgres
        rules: |
          path "optcp/data/apps/vaultwarden/s3-backup" {
            capabilities = ["read"]
          }
      # node-converge signs a throwaway key per run against optcp's SSH CA, and nothing else.
      - name: node-converge
        rules: |
          path "optcp-ssh/sign/node-converge" {
            capabilities = ["create", "update"]
          }
      # StageFreight image/attestation signing — one policy per tenant (a GitLab
      # group = a credential/identity scope, the same boundary Vault already draws
      # for KV with external-secrets-optcp vs -prplanit). Each grants sign +
      # read-public-key on ONLY its own cosign-signer key (sign/<key>/+ is the hash-algorithm
      # form cosign calls), so a compromised runner
      # in one group can never sign for another. CI can never export, rotate, or
      # delete a key; verifiers embed the public half offline and never call Vault.
      - name: stagefreight-cosign-homelabhd
        rules: |
          path "cosign-signer/sign/homelabhd" {
            capabilities = ["create", "update"]
          }
          path "cosign-signer/sign/homelabhd/+" {
            capabilities = ["create", "update"]
          }
          path "cosign-signer/keys/homelabhd" {
            capabilities = ["read"]
          }
      - name: stagefreight-cosign-prplanit
        rules: |
          path "cosign-signer/sign/prplanit" {
            capabilities = ["create", "update"]
          }
          path "cosign-signer/sign/prplanit/+" {
            capabilities = ["create", "update"]
          }
          path "cosign-signer/keys/prplanit" {
            capabilities = ["read"]
          }
      - name: stagefreight-cosign-sofmeright
        rules: |
          path "cosign-signer/sign/sofmeright" {
            capabilities = ["create", "update"]
          }
          path "cosign-signer/sign/sofmeright/+" {
            capabilities = ["create", "update"]
          }
          path "cosign-signer/keys/sofmeright" {
            capabilities = ["read"]
          }
      # Read-only on the raft snapshot endpoint and nothing else. The openbao-snapshot
      # helper assumes this (via the kubernetes role below) to stream a raft snapshot to
      # Velero/kopia for backup; it can read NO secrets and perform no other operation.
      - name: snapshot
        rules: |
          path "sys/storage/raft/snapshot" {
            capabilities = ["read"]
          }
      # cert-manager signs wazuh's certificate requests, through the Vault Issuer in
      # optcp-siem, with the wazuh role and nothing else.
      - name: cert-manager-wazuh
        rules: |
          path "optcp-pki-int/sign/wazuh" {
            capabilities = ["create", "update"]
          }
      # istio-mesh-ca (one-off): has optcp-pki's root sign optcp-mesh-ca's key and stores
      # the result for istiod's cacerts. Removed once run.
      - name: istio-mesh-ca
        rules: |
          path "optcp/metadata/apps/istio-mesh-ca" {
            capabilities = ["read"]
          }
          path "optcp/data/apps/istio-mesh-ca" {
            capabilities = ["create", "update"]
          }
          path "optcp-mesh-ca/intermediate/generate/exported" {
            capabilities = ["create", "update"]
          }
          path "optcp-pki/root/sign-intermediate" {
            capabilities = ["create", "update"]
          }
          path "optcp-mesh-ca/intermediate/set-signed" {
            capabilities = ["create", "update"]
          }
    auth:
      - type: kubernetes
        config:
          kubernetes_host: https://kubernetes.default.svc.cluster.local
          disable_iss_validation: true
        roles:
          - name: external-secrets
            bound_service_account_names: ["external-secrets-vault"]
            bound_service_account_namespaces: ["optcp-secrets"]
            policies: ["external-secrets"]
            ttl: 24h
          - name: external-secrets-optcp
            bound_service_account_names: ["external-secrets-vault"]
            bound_service_account_namespaces: ["optcp-secrets"]
            policies: ["external-secrets-optcp"]
            ttl: 24h
          - name: external-secrets-prplanit
            bound_service_account_names: ["external-secrets-vault"]
            bound_service_account_namespaces: ["optcp-secrets"]
            policies: ["external-secrets-prplanit"]
            ttl: 24h
          - name: optcp-docker-io
            bound_service_account_names: ["external-secrets-vault"]
            bound_service_account_namespaces: ["optcp-secrets"]
            policies: ["optcp-docker-io"]
            ttl: 24h
          - name: optcp-k8s-dungeon-public
            bound_service_account_names: ["external-secrets-vault"]
            bound_service_account_namespaces: ["optcp-secrets"]
            policies: ["optcp-k8s-dungeon-public"]
            ttl: 24h
          - name: optcp-k8s-dungeon-internal
            bound_service_account_names: ["optcp-k8s-dungeon-internal"]
            bound_service_account_namespaces: ["optcp-web", "outspokekin-web", "yesimvegan-web"]
            policies: ["optcp-k8s-dungeon-internal"]
            ttl: 1h
          - name: netbird
            bound_service_account_names: ["netbird-management"]
            bound_service_account_namespaces: ["optcp-remote-access"]
            policies: ["netbird"]
            ttl: 1h
          - name: netbird-router
            bound_service_account_names: ["netbird-router-dungeon"]
            bound_service_account_namespaces: ["optcp-vpn"]
            policies: ["netbird-router"]
            ttl: 1h
          - name: netbox
            bound_service_account_names: ["netbox-server"]
            bound_service_account_namespaces: ["optcp-ipam"]
            policies: ["netbox"]
            ttl: 1h
          - name: semaphore
            bound_service_account_names: ["semaphore"]
            bound_service_account_namespaces: ["optcp-infrastructure-management"]
            policies: ["semaphore"]
            ttl: 1h
          - name: unifi-network-application
            bound_service_account_names: ["unifi-network-application-app"]
            bound_service_account_namespaces: ["optcp-infrastructure-management"]
            policies: ["unifi-network-application"]
            ttl: 1h
          - name: twofauth
            bound_service_account_names: ["twofauth"]
            bound_service_account_namespaces: ["optcp-keyring"]
            policies: ["twofauth"]
            ttl: 1h
          - name: vaultwarden
            bound_service_account_names: ["vaultwarden"]
            bound_service_account_namespaces: ["optcp-keyring"]
            policies: ["vaultwarden"]
            ttl: 1h
          - name: vaultwarden-postgres
            bound_service_account_names: ["vaultwarden-postgres"]
            bound_service_account_namespaces: ["optcp-keyring"]
            policies: ["vaultwarden-postgres"]
            ttl: 1h
          - name: zitadel-vault-sync
            bound_service_account_names: ["zitadel-configuration"]
            bound_service_account_namespaces: ["optcp-identity"]
            policies: ["zitadel-provisioner"]
            ttl: 1h
          - name: dependency-track-configuration
            bound_service_account_names: ["dependency-track-configuration"]
            bound_service_account_namespaces: ["optcp-sibyl-system"]
            policies: ["dependency-track-configuration"]
            ttl: 1h
          # Boundary controller obtains a periodic, renewable, orphan token via its SA
          # (no hand-minted token) for its vault credential store -> brokered static keys.
          - name: boundary-init
            bound_service_account_names: ["boundary-init"]
            bound_service_account_namespaces: ["optcp-remote-access"]
            policies: ["boundary-init"]
            ttl: 1h
          - name: node-converge
            bound_service_account_names: ["node-converge"]
            bound_service_account_namespaces: ["optcp-infrastructure-management"]
            policies: ["node-converge"]
            ttl: 1h
          # The daily raft-snapshot backup: the openbao-snapshot helper in optcp-secrets
          # logs in here, takes a snapshot, and Velero/kopia captures it. Read-only
          # snapshot policy; the 1h token covers a single backup run.
          - name: openbao-snapshot
            bound_service_account_names: ["openbao-snapshot"]
            bound_service_account_namespaces: ["optcp-secrets"]
            policies: ["snapshot"]
            ttl: 1h
          - name: stalwart-configuration
            bound_service_account_names: ["stalwart-configuration"]
            bound_service_account_namespaces: ["optcp-delivery-bag"]
            policies: ["stalwart-configuration"]
            ttl: 1h
          # cert-manager logs in as optcp-siem's wazuh-pki ServiceAccount with a token it
          # requests for the Issuer, whose audience is always vault://<namespace>/<issuer>.
          - name: cert-manager-wazuh
            bound_service_account_names: ["wazuh-pki"]
            bound_service_account_namespaces: ["optcp-siem"]
            audience: "vault://optcp-siem/optcp-pki"
            policies: ["cert-manager-wazuh"]
            ttl: 10m
          - name: istio-mesh-ca
            bound_service_account_names: ["istio-mesh-ca"]
            bound_service_account_namespaces: ["optcp-secrets"]
            policies: ["istio-mesh-ca"]
            ttl: 15m
      - type: oidc
        config:
          oidc_discovery_url: https://sso.optcp.com
          oidc_client_id: "360752964924708521"
          oidc_client_secret: '${ env `VAULT_OIDC_CLIENT_SECRET` }'
          default_role: vault-admin
        roles:
          - name: vault-admin
            user_claim: sub
            policies: ["vault-admin"]
            allowed_redirect_uris:
              - https://secrets.optcp.com/ui/vault/auth/oidc/oidc/callback
              - http://localhost:8250/oidc/callback
            oidc_scopes:
              - openid
              - profile
              - email
              - offline_access
            bound_claims:
              roles: "Admin"
          # Operators: one-hour SSH certificates for their own username, nothing else; the
          # login lasts a working day so the client re-signs without a new Zitadel round.
          - name: operator
            user_claim: preferred_username
            policies: ["ssh-operator"]
            token_ttl: 8h
            token_max_ttl: 12h
            allowed_redirect_uris:
              - https://secrets.optcp.com/ui/vault/auth/oidc/oidc/callback
              - http://localhost:8250/oidc/callback
            oidc_scopes:
              - openid
              - profile
              - email
              - offline_access
            bound_claims:
              roles: "operator"
      # GitLab CI workload identity -> Vault. StageFreight pipelines present the
      # STAGEFREIGHT_OIDC id_token (aud: stagefreight) and exchange it here for a
      # short-lived token. No static secret and no Kubernetes SA token (build jobs
      # run with automount disabled) — signing is bound to the CI job's own OIDC
      # identity. One role per tenant: each is pinned to its GitLab group via
      # project_path and carries ONLY that tenant's cosign policy, so a token
      # minted in another group cannot assume it.
      - type: jwt
        path: gitlab-ci
        config:
          oidc_discovery_url: https://git.optcp.com
          bound_issuer: https://git.optcp.com
        roles:
          - name: stagefreight-cosign-homelabhd
            role_type: jwt
            user_claim: project_path
            bound_audiences: ["stagefreight"]
            bound_claims_type: glob
            bound_claims:
              project_path: "HomeLabHD/*"
            token_policies: ["stagefreight-cosign-homelabhd"]
            token_ttl: 10m
            token_type: service
          - name: stagefreight-cosign-prplanit
            role_type: jwt
            user_claim: project_path
            bound_audiences: ["stagefreight"]
            bound_claims_type: glob
            bound_claims:
              project_path: "PrPlanIT/*"
            token_policies: ["stagefreight-cosign-prplanit"]
            token_ttl: 10m
            token_type: service
          - name: stagefreight-cosign-sofmeright
            role_type: jwt
            user_claim: project_path
            bound_audiences: ["stagefreight"]
            bound_claims_type: glob
            bound_claims:
              project_path: "SoFMeRight/*"
            token_policies: ["stagefreight-cosign-sofmeright"]
            token_ttl: 10m
            token_type: service
    secrets:
      - path: operationtimecapsule
        type: kv
        description: Media and archives secrets
        options:
          version: 2
      - path: precisionplanit
        type: kv
        description: PrecisionPlanIt business secrets
        options:
          version: 2
      - path: zeldas-letter
        type: kv
        description: System and core infrastructure secrets
        options:
          version: 2
      - path: great-sea
        type: kv
        description: VPN-routed media automation secrets
        options:
          version: 2
      - path: outspokekin
        type: kv
        description: OutspokeKin Social
        # Sent on every reconcile; the top-level description is used only at creation.
        config:
          description: OutspokeKin Social
        options:
          version: 2
      - path: pedestal-of-time
        type: kv
        description: Personal productivity and management apps
        options:
          version: 2
      - path: arbitorium
        type: kv
        description: Ad Arbitorium Site
        # Sent on every reconcile; the top-level description is used only at creation.
        config:
          description: Ad Arbitorium Site
        options:
          version: 2
      - path: optcp
        type: kv
        description: "Operation: Time Capsule"
        # Sent on every reconcile; the top-level description is used only at creation.
        config:
          description: "Operation: Time Capsule"
        options:
          version: 2
      - path: prplanit
        type: kv
        description: Precision Plan IT
        # Sent on every reconcile; the top-level description is used only at creation.
        config:
          description: Precision Plan IT
        options:
          version: 2
      # optcp's SSH CA (one CA per tenant: a host trusting a CA accepts every cert it
      # signs, so tenants never share one; the mount is <tenant>-ssh). Roles are named
      # for the consumer. The CA private key is generated once inside OpenBao and never
      # leaves. The public key, served unauthenticated at /v1/optcp-ssh/public_key, is
      # committed at ansible/files/optcp-ssh-ca.pub and is what optcp hosts trust.
      - path: optcp-ssh
        type: ssh
        description: optcp SSH certificate authority
        configuration:
          config:
            - name: ca
              generate_signing_key: "true"
              # Without this bank-vaults rewrites config/ca on every reconcile, and
              # OpenBao answers each write with a new default issuer: a new CA.
              create_only: "true"
          roles:
            # node-converge: one certificate per run, valid long enough to outlast a
            # full roll (drains included), since Ansible keeps opening connections.
            - name: node-converge
              key_type: "ca"
              algorithm_signer: "rsa-sha2-256"
              allow_user_certificates: "true"
              allowed_users: "kai"
              # bank-vaults injects a list without this; OpenBao's ssh role API requires a string.
              allowed_domains: ""
              default_user: "kai"
              allowed_extensions: ""
              default_extensions: {}
              ttl: "4h0m0s"
              max_ttl: "6h0m0s"
            # operator: a person's own certificate, principal = the username Zitadel gave
            # (the oidc mount's alias; auth_oidc_d33174a6 is that mount's accessor).
            - name: operator
              key_type: "ca"
              algorithm_signer: "rsa-sha2-256"
              allow_user_certificates: "true"
              allowed_users_template: "true"
              allowed_users: "{{identity.entity.aliases.auth_oidc_d33174a6.name}}"
              default_user_template: "true"
              default_user: "{{identity.entity.aliases.auth_oidc_d33174a6.name}}"
              # bank-vaults injects a list without this; OpenBao's ssh role API requires a string.
              allowed_domains: ""
              allowed_extensions: "permit-X11-forwarding,permit-agent-forwarding,permit-port-forwarding,permit-pty,permit-user-rc"
              default_extensions:
                permit-X11-forwarding: ""
                permit-agent-forwarding: ""
                permit-port-forwarding: ""
                permit-pty: ""
                permit-user-rc: ""
              ttl: "1h0m0s"
              max_ttl: "4h0m0s"
      # Cosign image/attestation signer. ECDSA keys generated once inside OpenBao,
      # non-exportable — they sign via cosign-signer/sign/<tenant> and never leave
      # the vault, the same custody model as optcp-ssh's CA above. One key
      # per tenant (GitLab group) so a compromise in one group cannot forge
      # another's signatures. Verifiers embed each public key
      # (cosign-signer/keys/<tenant>) as an offline trust anchor; nothing calls
      # Vault at verify time. The purpose-named mount (not the cosign default
      # "transit") requires TRANSIT_SECRET_ENGINE_PATH=cosign-signer in the signer
      # env, which StageFreight forwards for the kms class.
      - path: cosign-signer
        type: transit
        description: Cosign image/attestation signer (per-tenant transit keys)
        configuration:
          keys:
            - name: homelabhd
              type: "ecdsa-p256"
              exportable: "false"
              allow_plaintext_backup: "false"
            - name: prplanit
              type: "ecdsa-p256"
              exportable: "false"
              allow_plaintext_backup: "false"
            - name: sofmeright
              type: "ecdsa-p256"
              exportable: "false"
              allow_plaintext_backup: "false"
      # optcp's X.509 root CA, the same custody model as optcp-ssh: the key is generated
      # once inside OpenBao and never leaves. It signs only optcp-pki-int's intermediate,
      # never a leaf. Its certificate, served unauthenticated at /v1/optcp-pki/ca/pem, is
      # committed at ansible/files/optcp-pki-ca.pem and is what optcp clients trust, so a
      # workload's namespace can be moved or rebuilt without touching its clients.
      - path: optcp-pki
        type: pki
        description: optcp root certificate authority
        config:
          max_lease_ttl: 175200h
        configuration:
          root/generate:
            - name: internal
              common_name: optcp Root CA
              issuer_name: optcp-root
              key_type: ec
              key_bits: 384
              ttl: 175200h
              # bank-vaults skips the generate once /v1/optcp-pki/ca answers; without it
              # every reconcile would mint a new root.
              create_only: "true"
          config:
            - name: urls
              issuing_certificates: ["https://secrets.optcp.com/v1/optcp-pki/ca"]
              crl_distribution_points: ["https://secrets.optcp.com/v1/optcp-pki/crl"]
      # optcp's issuing CA, signed by optcp-pki's root (dungeon d6f90613, the one-off
      # pki-intermediate Job). cert-manager signs workload certificates here through a Vault
      # Issuer in the workload's namespace; roles are named for the workload.
      - path: optcp-pki-int
        type: pki
        description: optcp issuing certificate authority
        config:
          max_lease_ttl: 87600h
        configuration:
          config:
            - name: urls
              issuing_certificates: ["https://secrets.optcp.com/v1/optcp-pki-int/ca"]
              crl_distribution_points: ["https://secrets.optcp.com/v1/optcp-pki-int/crl"]
          roles:
            # wazuh's indexer, manager, dashboard and securityadmin certificates. The
            # subject fields reproduce the DNs the indexer matches in nodes_dn / admin_dn;
            # OpenBao takes them from the role, never from the request.
            - name: wazuh
              allowed_domains: ["admin", "wazuh-indexer", "wazuh-manager", "wazuh-dashboard", "wazuh-manager.prplanit.com", "localhost"]
              allow_bare_domains: true
              allow_subdomains: false
              allow_localhost: true
              allow_ip_sans: true
              server_flag: true
              client_flag: true
              key_type: ec
              key_bits: 384
              key_usage: ["DigitalSignature"]
              organization: ["Wazuh"]
              ou: ["Wazuh"]
              locality: ["California"]
              country: ["US"]
              ttl: 8760h
              max_ttl: 8760h
      # istiod's plugged-in CA, signed by optcp-pki's root through the one-off istio-mesh-ca
      # Job. Its key is exported to optcp/apps/istio-mesh-ca, because istiod signs workload
      # certificates itself; this mount records the CA and publishes its CRL.
      - path: optcp-mesh-ca
        type: pki
        description: optcp service-mesh certificate authority
        config:
          max_lease_ttl: 87600h
        configuration:
          config:
            - name: urls
              issuing_certificates: ["https://secrets.optcp.com/v1/optcp-mesh-ca/ca"]
              crl_distribution_points: ["https://secrets.optcp.com/v1/optcp-mesh-ca/crl"]
