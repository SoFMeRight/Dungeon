# ClusterSecretStore for the optcp tenant mount (audits/Secret-Storage.md).
# Reads only optcp/ through its own role, and serves only namespaces labelled tenant=optcp.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao-optcp
spec:
  conditions:
    - namespaceSelector:
        matchLabels:
          tenant: optcp
  provider:
    vault:
      server: "http://openbao.zeldas-lullaby.svc.cluster.local:8200"
      path: "optcp"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "external-secrets-optcp"
          secretRef:
            name: "external-secrets-vault-token"
            namespace: "zeldas-lullaby"
            key: "token"
