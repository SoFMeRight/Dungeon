apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: optcp-secrets

resources:
  - ../../../base/openbao           # Vault CR base
  - openbao-unseal-keys.enc.yaml    # SOPS-encrypted unseal keys
  - openbao-oidc-credentials.enc.yaml  # SOPS-encrypted OIDC client secret for Zitadel SSO
  - external-secrets-sa.yaml      # ServiceAccount for External Secrets Kubernetes auth
  - external-secrets-token.yaml   # Token secret for ServiceAccount
  - clustersecretstore-operationtimecapsule.yaml  # External Secrets for operationtimecapsule (media/archives stuff like in song-of-storms, song-of-time)
  - clustersecretstore-pedestal-of-time.yaml  # External Secrets for pedestal-of-time (plex-ms-x and related apps)
  - clustersecretstore-precisionplanit.yaml  # External Secrets for PrecisionPlanIt secrets
  - clustersecretstore-zeldas-letter.yaml  # External Secrets for the Hyrule family (system/core apps)
  - clustersecretstore-outspokekin.yaml  # External Secrets for the OutspokeKin tenant (outspokekin-* namespaces)
  - clustersecretstore-great-sea.yaml  # External Secrets for great-sea (VPN-routed media automation apps in optcp-swift-sail-privileged)
  - clustersecretstore-arbitorium.yaml  # External Secrets for the house tenant (arbitorium-* namespaces)
  - clustersecretstore-optcp.yaml  # optcp tenant mount, apps/<app>/<issuer>; tenant=optcp namespaces only
  - clustersecretstore-optcp-docker-io.yaml  # every namespace; reads only the Docker Hub pull token
  - clustersecretstore-optcp-k8s-dungeon-public.yaml  # every namespace; reads only the public registry pull token
  - clustersecretstore-prplanit.yaml  # prplanit tenant mount, apps/<app>/<issuer>; tenant=prplanit namespaces only
  - istio-mesh-ca-job.yaml  # one-off, removed once run

patches:
  - path: vault-cr-patch.yaml
    target:
      kind: Vault
      name: openbao
  - path: vault-sa-auth-delegator-patch.yaml
    target:
      kind: ClusterRoleBinding
      name: openbao-tokenreview-binding
