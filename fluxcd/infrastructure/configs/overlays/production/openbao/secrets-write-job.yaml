# One-off: creates optcp/apps/harbor/redis with a PASSWORD generated here (Secret Stores,
# Writing entries), never over an existing entry (cas 0), and compares it back by hash.
# The value is never printed. Removed, with its role and policy, once it has run.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secrets-write
  labels:
    app: secrets-write
---
apiVersion: batch/v1
kind: Job
metadata:
  name: secrets-write
  labels:
    app: secrets-write
  annotations:
    kustomize.toolkit.fluxcd.io/force: "Enabled"
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: secrets-write
    spec:
      serviceAccountName: secrets-write
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: write
          image: docker.io/alpine/k8s:1.37.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              JWT=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              TOKEN=$(curl -fsS -X POST "$VAULT_ADDR/v1/auth/kubernetes/login" \
                -d "{\"jwt\":\"$JWT\",\"role\":\"$VAULT_ROLE\"}" | jq -r .auth.client_token)
              unset JWT
              h="X-Vault-Token: $TOKEN"
              # Alphanumeric, so it needs no escaping inside the redis+sentinel:// URLs.
              pw=$(tr -dc 'A-Za-z0-9' </dev/urandom | head -c 48)
              [ "${#pw}" -eq 48 ] || { echo "password generation failed"; exit 1; }
              jq -n --arg p "$pw" '{options: {cas: 0}, data: {PASSWORD: $p}}' > /tmp/entry.json
              curl -fsS -H "$h" -X POST "$VAULT_ADDR/v1/$MOUNT/data/$ENTRY" --data @/tmp/entry.json >/dev/null
              rm -f /tmp/entry.json
              want=$(printf %s "$pw" | sha256sum)
              unset pw
              got=$(curl -fsS -H "$h" "$VAULT_ADDR/v1/$MOUNT/data/$ENTRY" | jq -j .data.data.PASSWORD | sha256sum)
              [ "$want" = "$got" ] && echo "created $MOUNT/$ENTRY [PASSWORD]" || { echo "readback mismatch $MOUNT/$ENTRY"; exit 1; }
              curl -fsS -H "$h" -X POST "$VAULT_ADDR/v1/auth/token/revoke-self" >/dev/null || true
              echo done
          env:
            - name: VAULT_ADDR
              value: http://openbao.optcp-secrets.svc.cluster.local:8200
            - name: VAULT_ROLE
              value: secrets-write
            - name: MOUNT
              value: optcp
            - name: ENTRY
              value: apps/harbor/redis
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Mi
