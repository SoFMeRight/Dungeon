# One-off: writes new entries from the SOPS seed secrets-write-seed (Secret Stores, Writing
# entries). Writes each entry that does not exist yet and reads it back. Removed, with its
# seed, role and policy, once it has run.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secrets-write
  labels:
    app: secrets-write
---
apiVersion: batch/v1
kind: Job
metadata:
  name: secrets-write
  labels:
    app: secrets-write
  annotations:
    kustomize.toolkit.fluxcd.io/force: "Enabled"
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: secrets-write
    spec:
      serviceAccountName: secrets-write
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: write
          image: docker.io/alpine/k8s:1.37.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              JWT=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              TOKEN=$(curl -fsS -X POST "$VAULT_ADDR/v1/auth/kubernetes/login" \
                -d "{\"jwt\":\"$JWT\",\"role\":\"$VAULT_ROLE\"}" | jq -r .auth.client_token)
              unset JWT
              h="X-Vault-Token: $TOKEN"
              for spec in $WRITES; do
                mount=${spec%%:*}; pair=${spec#*:}; path=${pair%%=*}; seed=/seed/${pair#*=}
                if curl -fsS -H "$h" "$VAULT_ADDR/v1/$mount/data/$path" >/dev/null 2>&1; then
                  echo "$mount/$path exists, left as is"; continue
                fi
                jq '{data: .}' "$seed" > /tmp/new.json
                curl -fsS -H "$h" -X POST "$VAULT_ADDR/v1/$mount/data/$path" --data @/tmp/new.json >/dev/null
                want=$(jq -c 'keys' "$seed")
                got=$(curl -fsS -H "$h" "$VAULT_ADDR/v1/$mount/data/$path" | jq -c '.data.data | keys')
                rm -f /tmp/new.json
                [ "$want" = "$got" ] && echo "wrote $mount/$path $got" || { echo "readback mismatch $mount/$path"; exit 1; }
              done
              curl -fsS -H "$h" -X POST "$VAULT_ADDR/v1/auth/token/revoke-self" >/dev/null || true
              echo done
          env:
            - name: VAULT_ADDR
              value: http://openbao.optcp-secrets.svc.cluster.local:8200
            - name: VAULT_ROLE
              value: secrets-write
            # mount:path=seed key, one per entry
            - name: WRITES
              value: >-
                optcp:apps/adguardhome-sync/adguard-origin=adguardhome-sync-adguard-origin.json
                optcp:apps/adguardhome-sync/adguard-dns1=adguardhome-sync-adguard-dns1.json
                optcp:apps/adguardhome-sync/app=adguardhome-sync-app.json
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: seed
              mountPath: /seed
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Mi
        - name: seed
          secret:
            secretName: secrets-write-seed
