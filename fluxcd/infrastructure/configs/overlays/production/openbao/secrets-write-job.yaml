# One-off: patches existing entries with the properties in the SOPS seed secrets-write-seed
# (Secret Stores, Writing entries), leaving their other properties as they are, and reads
# each property back. Removed, with its seed, role and policy, once it has run.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secrets-write
  labels:
    app: secrets-write
---
apiVersion: batch/v1
kind: Job
metadata:
  name: secrets-write
  labels:
    app: secrets-write
  annotations:
    kustomize.toolkit.fluxcd.io/force: "Enabled"
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: secrets-write
    spec:
      serviceAccountName: secrets-write
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: write
          image: docker.io/alpine/k8s:1.37.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              JWT=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              TOKEN=$(curl -fsS -X POST "$VAULT_ADDR/v1/auth/kubernetes/login" \
                -d "{\"jwt\":\"$JWT\",\"role\":\"$VAULT_ROLE\"}" | jq -r .auth.client_token)
              unset JWT
              h="X-Vault-Token: $TOKEN"
              for spec in $PATCHES; do
                mount=${spec%%:*}; pair=${spec#*:}; path=${pair%%=*}; seed=/seed/${pair#*=}
                jq '{data: .}' "$seed" > /tmp/patch.json
                curl -fsS -H "$h" -H "Content-Type: application/merge-patch+json" -X PATCH \
                  "$VAULT_ADDR/v1/$mount/data/$path" --data @/tmp/patch.json >/dev/null
                rm -f /tmp/patch.json
                keys=$(jq -c 'keys' "$seed")
                want=$(jq -cS . "$seed" | sha256sum)
                got=$(curl -fsS -H "$h" "$VAULT_ADDR/v1/$mount/data/$path" \
                  | jq -cS --argjson k "$keys" '.data.data | with_entries(select(.key as $x | $k | index($x)))' | sha256sum)
                [ "$want" = "$got" ] && echo "patched $mount/$path $keys" || { echo "readback mismatch $mount/$path"; exit 1; }
              done
              curl -fsS -H "$h" -X POST "$VAULT_ADDR/v1/auth/token/revoke-self" >/dev/null || true
              echo done
          env:
            - name: VAULT_ADDR
              value: http://openbao.optcp-secrets.svc.cluster.local:8200
            - name: VAULT_ROLE
              value: secrets-write
            # mount:path=seed key, one per entry
            - name: PATCHES
              value: >-
                great-sea:apps/prowlarr=prowlarr-api-key.json
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: seed
              mountPath: /seed
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Mi
        - name: seed
          secret:
            secretName: secrets-write-seed
