# One-off: moves the S3 entries named for a tenant or a host to their purpose names
# (Secret Stores). Copies each entry to its new path, reads it back, deletes the old one.
# Removed, with its role and policy, once it has run.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secrets-rename
  labels:
    app: secrets-rename
---
apiVersion: batch/v1
kind: Job
metadata:
  name: secrets-rename
  labels:
    app: secrets-rename
  annotations:
    kustomize.toolkit.fluxcd.io/force: "Enabled"
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: secrets-rename
    spec:
      serviceAccountName: secrets-rename
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rename
          image: docker.io/alpine/k8s:1.37.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              JWT=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              TOKEN=$(curl -fsS -X POST "$VAULT_ADDR/v1/auth/kubernetes/login" \
                -d "{\"jwt\":\"$JWT\",\"role\":\"$VAULT_ROLE\"}" | jq -r .auth.client_token)
              unset JWT
              h="X-Vault-Token: $TOKEN"
              for spec in $RENAMES; do
                mount=${spec%%:*}; pair=${spec#*:}; old=${pair%%=*}; new=${pair#*=}
                if curl -fsS -H "$h" "$VAULT_ADDR/v1/$mount/data/$new" >/dev/null 2>&1; then
                  echo "$mount/$new exists"
                else
                  if ! curl -fsS -H "$h" "$VAULT_ADDR/v1/$mount/data/$old" -o /tmp/old.json 2>/dev/null; then
                    echo "$mount/$old missing, nothing to move"; continue
                  fi
                  jq '{data: .data.data}' /tmp/old.json > /tmp/new.json
                  curl -fsS -H "$h" -X POST "$VAULT_ADDR/v1/$mount/data/$new" --data @/tmp/new.json >/dev/null
                  rm -f /tmp/old.json /tmp/new.json
                  echo "copied $mount/$old -> $new"
                fi
                curl -fsS -H "$h" "$VAULT_ADDR/v1/$mount/data/$new" >/dev/null \
                  && curl -fsS -H "$h" -X DELETE "$VAULT_ADDR/v1/$mount/metadata/$old" >/dev/null \
                  && echo "deleted $mount/$old"
              done
              curl -fsS -H "$h" -X POST "$VAULT_ADDR/v1/auth/token/revoke-self" >/dev/null || true
              echo done
          env:
            - name: VAULT_ADDR
              value: http://openbao.zeldas-lullaby.svc.cluster.local:8200
            - name: VAULT_ROLE
              value: secrets-rename
            # mount:old=new, one per entry
            - name: RENAMES
              value: >-
                optcp:apps/stalwart/s3-optcp=apps/stalwart/s3-active
                optcp:apps/stalwart/s3-gringotts=apps/stalwart/s3-backup
                optcp:apps/openproject/s3-optcp=apps/openproject/s3-active
                optcp:apps/openproject/s3-gringotts=apps/openproject/s3-backup
                optcp:apps/dependency-track/s3-optcp=apps/dependency-track/s3-active
                optcp:apps/dependency-track/s3-gringotts=apps/dependency-track/s3-backup
                optcp:apps/gitlab/s3-optcp=apps/gitlab/s3-active
                optcp:apps/gitlab/s3-gringotts=apps/gitlab/s3-backup
                optcp:apps/nextcloud/s3-optcp=apps/nextcloud/s3-active
                optcp:apps/nextcloud/s3-gringotts=apps/nextcloud/s3-backup
                optcp:apps/wikijs-sops/s3-gringotts=apps/wikijs-sops/s3-backup
                prplanit:apps/osticket/s3-gringotts=apps/osticket/s3-backup
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Mi
