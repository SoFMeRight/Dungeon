# One-off: moves the S3 entries named for a tenant or a host to their purpose names
# (Secret Stores). Copies each entry to its new path, reads it back, deletes the old one.
# Removed, with its role and policy, once it has run.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secrets-rename
  labels:
    app: secrets-rename
---
apiVersion: batch/v1
kind: Job
metadata:
  name: secrets-rename
  labels:
    app: secrets-rename
  annotations:
    kustomize.toolkit.fluxcd.io/force: "Enabled"
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: secrets-rename
      annotations:
        prplanit.com/rename-for: run-2
    spec:
      serviceAccountName: secrets-rename
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rename
          image: docker.io/alpine/k8s:1.37.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              JWT=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              TOKEN=$(curl -sS -X POST "$VAULT_ADDR/v1/auth/kubernetes/login" \
                -d "{\"jwt\":\"$JWT\",\"role\":\"$VAULT_ROLE\"}" | jq -r '.auth.client_token // empty')
              unset JWT
              [ -n "$TOKEN" ] || { echo "login as role $VAULT_ROLE failed"; exit 1; }
              h="X-Vault-Token: $TOKEN"
              # get <mount> <path> <file>: 200 found, 404 absent, anything else is an error.
              get() { curl -sS -H "$h" -o "$3" -w '%{http_code}' "$VAULT_ADDR/v1/$1/data/$2"; }
              for spec in $RENAMES; do
                mount=${spec%%:*}; pair=${spec#*:}; old=${pair%%=*}; new=${pair#*=}
                code=$(get "$mount" "$new" /dev/null)
                case "$code" in
                  200) echo "$mount/$new exists" ;;
                  404)
                    code=$(get "$mount" "$old" /tmp/old.json)
                    case "$code" in
                      404) echo "$mount/$old missing, nothing to move"; continue ;;
                      200) ;;
                      *) echo "reading $mount/$old: http $code"; exit 1 ;;
                    esac
                    jq '{data: .data.data}' /tmp/old.json > /tmp/new.json
                    curl -fsS -H "$h" -X POST "$VAULT_ADDR/v1/$mount/data/$new" --data @/tmp/new.json >/dev/null
                    rm -f /tmp/old.json /tmp/new.json
                    echo "copied $mount/$old -> $new" ;;
                  *) echo "reading $mount/$new: http $code"; exit 1 ;;
                esac
                [ "$(get "$mount" "$new" /dev/null)" = 200 ] || { echo "$mount/$new does not read back"; exit 1; }
                curl -fsS -H "$h" -X DELETE "$VAULT_ADDR/v1/$mount/metadata/$old" >/dev/null && echo "deleted $mount/$old"
              done
              curl -sS -H "$h" -X POST "$VAULT_ADDR/v1/auth/token/revoke-self" >/dev/null || true
              echo done
          env:
            - name: VAULT_ADDR
              value: http://openbao.zeldas-lullaby.svc.cluster.local:8200
            - name: VAULT_ROLE
              value: secrets-rename
            # mount:old=new, one per entry
            - name: RENAMES
              value: >-
                optcp:apps/stalwart/s3-optcp=apps/stalwart/s3-active
                optcp:apps/stalwart/s3-gringotts=apps/stalwart/s3-backup
                optcp:apps/openproject/s3-optcp=apps/openproject/s3-active
                optcp:apps/openproject/s3-gringotts=apps/openproject/s3-backup
                optcp:apps/dependency-track/s3-optcp=apps/dependency-track/s3-active
                optcp:apps/dependency-track/s3-gringotts=apps/dependency-track/s3-backup
                optcp:apps/gitlab/s3-optcp=apps/gitlab/s3-active
                optcp:apps/gitlab/s3-gringotts=apps/gitlab/s3-backup
                optcp:apps/nextcloud/s3-optcp=apps/nextcloud/s3-active
                optcp:apps/nextcloud/s3-gringotts=apps/nextcloud/s3-backup
                optcp:apps/wikijs-sops/s3-gringotts=apps/wikijs-sops/s3-backup
                prplanit:apps/osticket/s3-gringotts=apps/osticket/s3-backup
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Mi
