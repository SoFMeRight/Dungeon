# One-off: deletes zeldas-letter rgw/gossip-stone (Secret Stores, Writing entries), a copy of
# the RGW admin ops key that only the retired Prometheus read. Deletes every version through
# its metadata, then confirms the metadata is gone. Reads no value. Removed, with its role
# and policy, once it has run.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secrets-delete
  labels:
    app: secrets-delete
---
apiVersion: batch/v1
kind: Job
metadata:
  name: secrets-delete
  labels:
    app: secrets-delete
  annotations:
    kustomize.toolkit.fluxcd.io/force: "Enabled"
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: secrets-delete
    spec:
      serviceAccountName: secrets-delete
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: delete
          image: docker.io/alpine/k8s:1.37.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              JWT=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              TOKEN=$(curl -fsS -X POST "$VAULT_ADDR/v1/auth/kubernetes/login" \
                -d "{\"jwt\":\"$JWT\",\"role\":\"$VAULT_ROLE\"}" | jq -r .auth.client_token)
              unset JWT
              h="X-Vault-Token: $TOKEN"
              m="$VAULT_ADDR/v1/$MOUNT/metadata/$ENTRY"
              code() { curl -sS -o /dev/null -w '%{http_code}' -H "$h" "$@" "$m"; }
              case $(code) in
                200) [ "$(code -X DELETE)" = 204 ] || { echo "delete failed $MOUNT/$ENTRY"; exit 1; }
                     echo "deleted $MOUNT/$ENTRY" ;;
                404) echo "$MOUNT/$ENTRY already absent" ;;
                *) echo "cannot read $MOUNT/$ENTRY metadata"; exit 1 ;;
              esac
              [ "$(code)" = 404 ] && echo "confirmed absent $MOUNT/$ENTRY" || { echo "still present $MOUNT/$ENTRY"; exit 1; }
              curl -fsS -H "$h" -X POST "$VAULT_ADDR/v1/auth/token/revoke-self" >/dev/null || true
              echo done
          env:
            - name: VAULT_ADDR
              value: http://openbao.optcp-secrets.svc.cluster.local:8200
            - name: VAULT_ROLE
              value: secrets-delete
            - name: MOUNT
              value: zeldas-letter
            - name: ENTRY
              value: rgw/gossip-stone
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Mi
