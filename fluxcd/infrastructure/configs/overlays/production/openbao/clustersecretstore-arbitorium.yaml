# ClusterSecretStore for Arbitorium Vault namespace
# Used for the house tenant (arbitorium-* namespaces)
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao-arbitorium
spec:
  provider:
    vault:
      server: "http://openbao.zeldas-lullaby.svc.cluster.local:8200"
      path: "arbitorium"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "external-secrets"
          secretRef:
            name: "external-secrets-vault-token"
            namespace: "zeldas-lullaby"
            key: "token"
