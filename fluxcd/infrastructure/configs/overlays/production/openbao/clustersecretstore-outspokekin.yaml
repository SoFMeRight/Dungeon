# ClusterSecretStore for the outspokekin OpenBao mount
# Used by the fediverse hub (temple-of-time namespace)
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao-outspokekin
spec:
  provider:
    vault:
      server: "http://openbao.zeldas-lullaby.svc.cluster.local:8200"
      path: "outspokekin"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "external-secrets"
          secretRef:
            name: "external-secrets-vault-token"
            namespace: "zeldas-lullaby"
            key: "token"
