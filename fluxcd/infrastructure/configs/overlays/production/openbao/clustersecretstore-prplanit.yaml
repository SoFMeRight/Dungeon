# ClusterSecretStore for the prplanit tenant mount (audits/Secret-Storage.md).
# Reads only prplanit/ through its own role, and serves only namespaces labelled tenant=prplanit.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao-prplanit
spec:
  conditions:
    - namespaceSelector:
        matchLabels:
          tenant: prplanit
  provider:
    vault:
      server: "http://openbao.zeldas-lullaby.svc.cluster.local:8200"
      path: "prplanit"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "external-secrets-prplanit"
          secretRef:
            name: "external-secrets-vault-token"
            namespace: "zeldas-lullaby"
            key: "token"
