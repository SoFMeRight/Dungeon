# Serves every namespace but reads only the Docker Hub pull token.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao-optcp-docker-io
spec:
  provider:
    vault:
      server: "http://openbao.optcp-secrets.svc.cluster.local:8200"
      path: "optcp"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "optcp-docker-io"
          secretRef:
            name: "external-secrets-vault-token"
            namespace: "optcp-secrets"
            key: "token"
