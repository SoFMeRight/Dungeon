# Serves every namespace but reads only the public registry pull token.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao-optcp-k8s-dungeon-public
spec:
  provider:
    vault:
      server: "http://openbao.zeldas-lullaby.svc.cluster.local:8200"
      path: "optcp"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "optcp-k8s-dungeon-public"
          secretRef:
            name: "external-secrets-vault-token"
            namespace: "zeldas-lullaby"
            key: "token"
