# ClusterSecretStore for Great Sea Vault namespace
# Used for VPN-routed media automation apps in optcp-swift-sail-privileged
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao-great-sea
spec:
  provider:
    vault:
      server: "http://openbao.optcp-secrets.svc.cluster.local:8200"
      path: "great-sea"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "external-secrets"
          secretRef:
            name: "external-secrets-vault-token"
            namespace: "optcp-secrets"
            key: "token"
