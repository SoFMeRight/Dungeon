# Configuration values for Weave GitOps HelmRelease
apiVersion: v1
kind: ConfigMap
metadata:
  name: weave-gitops-values
  namespace: flux-system
data:
  values.yaml: |
    # HomeLabHD weave-gitops fork, replacing the upstream wego-app image. Finalizes the
    # v0.39.x line weaveworks archived at v0.39.1-rc.1, with the MUI 9 Tabs render-loop
    # fix (detail pages crashed React #185) and the list-sort scroll-jump fix.
    # CRI-O mirrors ghcr.io through Harbor.
    image:
      repository: ghcr.io/homelabhd/weave-gitops
      # Pinned by digest (kept the readable v0.39.1 tag alongside it). Immutable, so the
      # default IfNotPresent serves the cached layer during a registry/cache outage AND
      # deterministically runs the intended build — a bare re-cuttable tag can otherwise
      # serve a stale cached digest. Update the sha256 whenever v0.39.1 is re-cut.
      tag: v0.39.1@sha256:a822542eea6443973da683aec9ffac8994d9e23e4c678e2576d727a92d3ddcf3

    # Admin user configuration
    adminUser:
      create: false  # Disable admin user completely

    # Enable both user-account and OIDC auth methods
    additionalArgs:
      - --auth-methods=user-account,oidc

    # OIDC configuration (Zitadel PKCE - no client secret)
    oidcSecret:
      create: false
      name: oidc-auth

    # RBAC configuration with impersonation for multi-namespace visibility
    rbac:
      create: true
      viewSecretsResourceNames: ["cluster-user-auth", "oidc-auth"]
      # Allow impersonation of users and OIDC groups
      impersonationResourceNames: ["kai", "operator"]
      impersonationResources: ["users", "groups"]
      additionalRules:
        - apiGroups: [""]
          resources: ["users", "groups"]
          verbs: ["impersonate"]

    # Additional security settings
    metrics:
      enabled: true

    # Service configuration - use LoadBalancer with Cilium LB IPAM
    service:
      type: LoadBalancer
      annotations:
        io.cilium/lb-ipam-ips: "172.22.30.137"
        io.cilium/lb-ipam-sharing-key: "gossip-stone"
      port: 9001

    # Disable ingress since we're using LoadBalancer
    ingress:
      enabled: false
