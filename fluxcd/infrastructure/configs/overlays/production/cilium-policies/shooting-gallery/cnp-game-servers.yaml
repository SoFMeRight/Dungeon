apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-ark-se-tmc-theisland-lan
spec:
  description: >-
    LAN-only ingress to ark-se-tmc-theisland (172.22.30.231).
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app: ark-se-tmc-theisland
  ingress:
    - fromCIDRSet:
        - cidr: "10.0.0.0/8"
        - cidr: "172.16.0.0/12"
        - cidr: "192.168.0.0/16"
          except:
            - "192.168.144.0/20"
      toPorts:
        - ports:
            - port: "7797"
              protocol: UDP
            - port: "7797"
              protocol: TCP
            - port: "27057"
              protocol: UDP
            - port: "27057"
              protocol: TCP
            - port: "27095"
              protocol: TCP
            - port: "8080"
              protocol: TCP
