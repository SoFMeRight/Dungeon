apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-emulatorjs-egress
spec:
  description: >-
    emulatorjs (LinuxServer image) runs an embedded IPFS node to distribute its
    emulator cores + frontend data over P2P, then serves browser-based emulation.
    Allow toFQDNs the EmulatorJS CDN and the libp2p DHT bootstrap nodes
    (*.bootstrap.libp2p.io) on 443/TCP, with L7 DNS. The IPFS swarm (port 4001,
    TCP + UDP/QUIC) connects to arbitrary DHT peers worldwide and cannot be
    FQDN-scoped, so it is granted to `world` scoped to :4001 only. Its
    :3000/:80 are inbound.
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app: emulatorjs
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:io.cilium.k8s.policy.serviceaccount: coredns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: "cdn.emulatorjs.org"
        - matchName: "data.emulatorjs.org"
        - matchPattern: "*.emulatorjs.org"
        - matchPattern: "*.bootstrap.libp2p.io"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "4001"
              protocol: TCP
            - port: "4001"
              protocol: UDP
