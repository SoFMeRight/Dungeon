apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-romm-egress
spec:
  description: >-
    romm's OIDC discovery, JWKS and token exchange go to sso.prplanit.com, which
    split-horizon DNS resolves to the cell-membrane gateway. Those gateway pods
    are not meshed, so `toEntities: cluster` does not cover them and an explicit
    toEndpoints allow is required — paired with cap.oidc, which is what the
    gateway's own ingress policy matches on. Without it the metadata fetch hangs
    until httpx times out and login returns 500.
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app: romm
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: prelude-of-light
            gateway.networking.k8s.io/gateway-name: cell-membrane-gateway
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
