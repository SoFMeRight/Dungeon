apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-wazuh-to-indexer
spec:
  description: >-
    Allow wazuh-manager and wazuh-dashboard to access
    wazuh-indexer on 9200/TCP.
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app: wazuh-indexer
  ingress:
    - fromEndpoints:
        - matchLabels:
            app: wazuh-manager
        - matchLabels:
            app: wazuh-dashboard
      toPorts:
        - ports:
            - port: "9200"
              protocol: TCP
