apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  description: >-
    Default-deny ingress AND egress for optcp-web: the public sites that are no separate entity (Kai's sites and
    blog, astralfocal, enamorafoto).
    Allows are additive from CCNPs (HBONE guardrail, DNS, probes, metrics,
    contracts) and namespace-specific CNPs below.
  enableDefaultDeny:
    ingress: true
    egress: true
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            policy.prplanit.com/reserved: default-deny-anchor
  egress:
    - toEndpoints:
        - matchLabels:
            policy.prplanit.com/reserved: default-deny-anchor
