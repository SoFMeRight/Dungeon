apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-ceph-csi-egress
spec:
  description: >-
    Allow the Ceph-CSI provisioners (rbd + cephfs ctrlplugin) to reach the
    external Ceph cluster subnet on the MON (6789/3300) and OSD/MDS/MGR messenger
    range (6800-7568) TCP. They create/delete/resize/snapshot RBD images and
    CephFS subvolumes, which needs the MON cluster map plus direct OSD (and, for
    cephfs, MDS) access — without it, PVC provisioning stalls cluster-wide once
    egress default-deny is enforced. The ceph-csi controller-manager
    (app.kubernetes.io/name: ceph-csi) only talks to the kube-apiserver (CCNP
    baseline) and needs no ceph egress; the node plugins are hostNetwork (node
    kernel RBD/CephFS mount) and are not governed by pod policy. Un-meshed:
    RADOS is a non-HTTP protocol ztunnel cannot carry.
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - "gorons-bracelet.rbd.csi.ceph.com-ctrlplugin"
          - "gorons-bracelet.cephfs.csi.ceph.com-ctrlplugin"
  egress:
    - toCIDRSet:
        - cidr: "fc00:f1:ada:104e:1ace::/64"
      toPorts:
        - ports:
            - port: "6789"
              protocol: TCP
            - port: "3300"
              protocol: TCP
            - port: "6800"
              endPort: 7568
              protocol: TCP
