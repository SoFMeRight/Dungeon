apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-csi-addons-controller
spec:
  description: >-
    The CSI-Addons controller runs reclaim-space through the RBD driver's
    csi-addons sidecars: the ctrlplugin's on 9070 and each nodeplugin's on
    9071. The nodeplugins are hostNetwork, so they are reached on the node
    address.
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: csi-addons
  egress:
    - toEndpoints:
        - matchLabels:
            app: gorons-bracelet.rbd.csi.ceph.com-ctrlplugin
      toPorts:
        - ports:
            - port: "9070"
              protocol: TCP
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "9071"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-rbd-ctrlplugin-csi-addons
spec:
  description: >-
    Allow the CSI-Addons controller to reach the RBD ctrlplugin's csi-addons
    sidecar on 9070.
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app: gorons-bracelet.rbd.csi.ceph.com-ctrlplugin
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: csi-addons
      toPorts:
        - ports:
            - port: "9070"
              protocol: TCP
