apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-grafana-to-ntfy
spec:
  description: >-
    Allow Grafana (gossip-stone) to reach ntfy on 80/TCP for alert
    notifications via the internal service — avoids hairpinning to the public
    xylem gateway VIP (which drops in-cluster pods).
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: ntfy
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: gossip-stone
            app.kubernetes.io/name: grafana
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
