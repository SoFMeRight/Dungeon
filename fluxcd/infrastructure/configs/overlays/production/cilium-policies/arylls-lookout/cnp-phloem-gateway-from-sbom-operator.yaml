apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-phloem-gateway-from-sbom-operator
spec:
  description: >-
    sbom-operator pulls images from Harbor and its proxy caches.
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: phloem-gateway
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: optcp-sibyl-system
            app.kubernetes.io/name: sbom-operator
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
