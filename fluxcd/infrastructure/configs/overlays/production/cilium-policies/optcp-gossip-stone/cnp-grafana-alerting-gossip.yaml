# The alerting gossip ring between grafana replicas. Both directions are named
# because the namespace default-denies ingress and egress, and UDP is named
# alongside TCP because memberlist gossips over UDP while joining over TCP --
# and ambient does not carry UDP, so only Cilium governs that half.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grafana-alerting-gossip
spec:
  description: Grafana unified-alerting HA gossip between replicas on 9094.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: grafana
      toPorts:
        - ports:
            - port: "9094"
              protocol: TCP
            - port: "9094"
              protocol: UDP
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: grafana
      toPorts:
        - ports:
            - port: "9094"
              protocol: TCP
            - port: "9094"
              protocol: UDP
