apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-nutify-lan
spec:
  description: >-
    LAN-only ingress to the nutify web UI (172.22.30.137) on 5050,443/TCP.
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app: nutify
  ingress:
    - fromCIDRSet:
        - cidr: "10.0.0.0/8"
        - cidr: "172.16.0.0/12"
        - cidr: "192.168.0.0/16"
          except:
            - "192.168.144.0/20"
      toPorts:
        - ports:
            # 3493 removed: see the matching istio policy. upsd hands FSD to any
            # master-rights client and its only credential is published in git.
            - port: "5050"
              protocol: TCP
            - port: "443"
              protocol: TCP
