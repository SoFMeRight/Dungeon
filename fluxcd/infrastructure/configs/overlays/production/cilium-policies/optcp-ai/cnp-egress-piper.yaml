apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-piper-egress
spec:
  description: >-
    piper (Wyoming TTS) downloads the requested voice from HuggingFace
    (rhasspy/piper-voices) on first use, then serves from the data PVC.
    Allow egress to the HuggingFace repo + LFS/Xet CDN on 443/TCP, with
    L7 DNS. Steady-state (voice cached) needs none of this.
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app: piper
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:io.cilium.k8s.policy.serviceaccount: coredns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: "huggingface.co"
        - matchPattern: "*.huggingface.co"
        - matchPattern: "*.hf.co"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
