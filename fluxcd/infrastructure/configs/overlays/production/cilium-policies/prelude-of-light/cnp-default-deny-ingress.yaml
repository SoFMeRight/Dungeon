apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  description: >-
    Default-deny ingress AND egress for prelude-of-light namespace.
    Gateway pods get RFC1918 CIDR ingress via cnp-phloem-gateway (pfSense
    forwards .70 to the VPN subnets only). Egress is granted by
    cnp-egress-phloem-gateway (whole-cluster + world backends). DNS,
    kube-apiserver and mesh (HBONE) ride the universal CCNP baseline.
    CCNPs provide: kubelet-probes, istio-ambient, prometheus-scrape.
  enableDefaultDeny:
    ingress: true
    egress: true
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            policy.prplanit.com/reserved: default-deny-anchor
  egress:
    - toEndpoints:
        - matchLabels:
            policy.prplanit.com/reserved: default-deny-anchor
