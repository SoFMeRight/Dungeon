apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  description: >-
    Default-deny ingress AND egress for optcp-infra-admin namespace.
    Ingress: nothing serves here; CCNPs cover kubelet-probes, istio-ambient,
    prometheus-scrape.
    Egress: node-converge via cnp-egress-node-converge; DNS and kube-apiserver
    ride the universal CCNP baseline.
    Both directions use a reserved-label anchor to trigger enforcement.
  enableDefaultDeny:
    ingress: true
    egress: true
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            policy.prplanit.com/reserved: default-deny-anchor
  egress:
    - toEndpoints:
        - matchLabels:
            policy.prplanit.com/reserved: default-deny-anchor
