apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-photoprism-x-to-mariadb
spec:
  description: >-
    Allow photoprism-x app to access photoprism-x-mariadb on 3306/TCP.
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app: photoprism-x-mariadb
  ingress:
    - fromEndpoints:
        - matchLabels:
            app: photoprism-x
      toPorts:
        - ports:
            - port: "3306"
              protocol: TCP
