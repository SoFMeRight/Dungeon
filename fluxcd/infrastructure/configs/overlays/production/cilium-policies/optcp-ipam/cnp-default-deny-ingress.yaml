apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  description: >-
    Default-deny ingress AND egress for optcp-ipam namespace.
    Ingress: CCNPs cover kubelet-probes, istio-ambient, prometheus-scrape,
    postgres/redis contracts, and ingress-gateway traffic for labeled pods.
    Egress: netbox-server via cnp-egress-netbox; DNS, intra-namespace mesh
    (server->postgres/redis) and kube-apiserver ride the universal CCNP baseline.
    Both directions use a reserved-label anchor to trigger enforcement.
  enableDefaultDeny:
    ingress: true
    egress: true
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            policy.prplanit.com/reserved: default-deny-anchor
  egress:
    - toEndpoints:
        - matchLabels:
            policy.prplanit.com/reserved: default-deny-anchor
