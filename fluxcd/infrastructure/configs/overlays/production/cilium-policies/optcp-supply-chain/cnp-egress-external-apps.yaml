apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-external-apps-egress
spec:
  description: >-
    GitLab reaches open-ended external sets as core function (repo mirrors,
    package/registry pulls, webhooks, email) via
    webservice/sidekiq/kas/registry/toolbox/migrations. That set cannot
    be allowlisted, so world+cluster is granted; DBs and the mesh ride the
    universal CCNP baseline.
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - webservice
          - sidekiq
          - kas
          - registry
          - toolbox
          - migrations
  egress:
    - toEntities:
        - world
        - cluster
