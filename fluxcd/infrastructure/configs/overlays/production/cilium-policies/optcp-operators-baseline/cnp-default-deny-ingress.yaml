apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  description: >-
    Default-deny ingress AND egress for optcp-operators-baseline namespace.
    The workloads are the CloudNativePG (+ barman-cloud plugin), MariaDB and
    Redis operators, redis-sentinel-repair, reflector and reloader. Their
    egress (kube-apiserver + DNS + mesh) and their kubelet probes ride the
    universal CCNP baseline; cnp-operators admits the kube-apiserver to the
    CNPG and MariaDB webhooks and the CNPG operator to the barman-cloud plugin.
    The operators reach their databases through the cnpg-, mariadb- and
    redis-operator CCNPs and the per-namespace Istio policies.
    Both directions use a reserved-label anchor to trigger enforcement.
  enableDefaultDeny:
    ingress: true
    egress: true
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            policy.prplanit.com/reserved: default-deny-anchor
  egress:
    - toEndpoints:
        - matchLabels:
            policy.prplanit.com/reserved: default-deny-anchor
