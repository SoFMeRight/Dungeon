apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-nutify-egress
spec:
  description: >-
    nutify (NUT UPS monitor) polls the Eaton UPS management card over SNMPv3
    (eaton-ups.prplanit.internal -> 10.24.7.30, 161/UDP) and, on a UPS power
    event, SSHes into the five Proxmox hypervisors (172.22.22.3-7, 22/TCP) to
    shut them down. Narrow toCIDR allows; DNS (to resolve the SNMP host) rides
    the baseline. Inert until egress default-deny is enabled.
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app: nutify
  egress:
    - toCIDR:
        - "10.24.7.30/32"
      toPorts:
        - ports:
            - port: "161"
              protocol: UDP
    - toCIDR:
        - "172.22.22.3/32"
        - "172.22.22.4/32"
        - "172.22.22.5/32"
        - "172.22.22.6/32"
        - "172.22.22.7/32"
      toPorts:
        - ports:
            - port: "22"
              protocol: TCP
