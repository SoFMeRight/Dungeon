apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-gatus-egress
spec:
  description: >-
    gatus auto-derives its probe targets from cluster Services + HTTPRoutes
    (via its sidecar reading the Kubernetes API). That set is large, ever-
    changing, and spans meshed pods, NON-meshed pods (istio gateways, coturn),
    Service/LoadBalancer IPs, and external LAN/infra (Ceph MONs) on arbitrary
    ports. Because the cluster entity does not cover non-meshed pods, a monitor
    needs the all entity (every endpoint, in or out of the cluster) — it cannot
    be practically allowlisted. Documented broad egress, like uptime-kuma.
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: gatus
  egress:
    - toEntities:
        - all
