apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-gatus-egress
spec:
  description: >-
    gatus is a broad monitor: it probes a large, changing set spanning meshed
    pods, external LAN/public targets, and the non-meshed istio gateways.
    world+cluster covers the meshed/external targets; the gateways are granted
    explicitly (the cluster entity does not match non-meshed gateway pods).
    A few non-meshed cross-namespace pods it probes directly may still show as
    down under egress-deny — a Cilium ambient limitation, cosmetic (the target
    services themselves are reachable by their real clients).
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: gatus
  egress:
    - toEntities:
        - world
        - cluster
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: hyrule-castle
            gateway.networking.k8s.io/gateway-name: cell-membrane-gateway
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: arylls-lookout
            gateway.networking.k8s.io/gateway-name: xylem-gateway
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "80"
              protocol: TCP
