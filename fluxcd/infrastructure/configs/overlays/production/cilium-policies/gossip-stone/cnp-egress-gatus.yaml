apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-gatus-egress
spec:
  description: >-
    gatus probes are auto-derived from cluster Services + HTTPRoutes (via its
    sidecar reading the Kubernetes API — covered by allow-kube-apiserver-egress).
    In-cluster Service probes and its postgres ride the mesh (HBONE); the
    *.pcfae.com HTTPRoute-hostname probes reach the cell-membrane + xylem gateway
    pods directly on 443/80 (the gateways are not mesh-captured). Not broad
    — targets are enumerable.
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: gatus
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: hyrule-castle
            gateway.networking.k8s.io/gateway-name: cell-membrane-gateway
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: arylls-lookout
            gateway.networking.k8s.io/gateway-name: xylem-gateway
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "80"
              protocol: TCP
