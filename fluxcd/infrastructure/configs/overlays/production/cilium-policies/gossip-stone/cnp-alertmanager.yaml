apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-alertmanager-ingress
spec:
  description: >-
    Allow vmalert to hand alerts to Alertmanager on 9093/TCP.
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app: alertmanager
  ingress:
    - fromEndpoints:
        - matchLabels:
            app: vmalert
      toPorts:
        - ports:
            - port: "9093"
              protocol: TCP
