apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-grafana-egress
spec:
  description: >-
    grafana's datasources (VictoriaMetrics, Loki), postgres, and the ntfy
    alert contact point are all in-cluster and ride the mesh (HBONE). Its only
    non-mesh egress is the OIDC login hairpin to sso.prplanit.com via the
    cell-membrane gateway LB (172.22.30.0/24, 443). Runtime grafana.com plugin
    installs are deliberately NOT allowed (open manually when installing).
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  egress:
    - toCIDR:
        - "172.22.30.0/24"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
