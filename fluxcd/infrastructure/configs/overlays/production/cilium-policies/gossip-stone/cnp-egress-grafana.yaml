apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-grafana-egress
spec:
  description: >-
    grafana's datasources (VictoriaMetrics, Loki), postgres, and the ntfy
    alert contact point are all in-cluster and ride the mesh (HBONE). Its only
    non-mesh egress is the OIDC login hairpin to sso.prplanit.com,
    reaching the (non-meshed) cell-membrane/xylem gateway pods on 443. Runtime grafana.com plugin
    installs are deliberately NOT allowed (open manually when installing).
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: hyrule-castle
            gateway.networking.k8s.io/gateway-name: cell-membrane-gateway
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: arylls-lookout
            gateway.networking.k8s.io/gateway-name: xylem-gateway
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
