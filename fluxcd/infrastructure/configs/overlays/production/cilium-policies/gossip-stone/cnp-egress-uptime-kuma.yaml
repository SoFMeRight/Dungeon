apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-uptime-kuma-egress
spec:
  description: >-
    uptime-kuma probes arbitrary user-added monitors (HTTP, TCP-port, DNS,
    etc.) across in-cluster, LAN, and public targets on any port; the monitor
    list is runtime SQLite-managed and not enumerable from git. Documented
    broad world+cluster egress by design — a monitor cannot be allowlisted.
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: uptime-kuma
  egress:
    - toEntities:
        - world
        - cluster
    # The non-meshed istio gateway pods are not reliably matched by the cluster
    # entity, so grant them explicitly for *.pcfae.com hostname monitors.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: hyrule-castle
            gateway.networking.k8s.io/gateway-name: cell-membrane-gateway
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: arylls-lookout
            gateway.networking.k8s.io/gateway-name: xylem-gateway
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "80"
              protocol: TCP
