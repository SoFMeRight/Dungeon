apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-uptime-kuma-egress
spec:
  description: >-
    uptime-kuma probes arbitrary user-added monitors (HTTP, TCP-port, DNS, etc.)
    across in-cluster meshed AND non-meshed pods (e.g. the istio gateways),
    LAN, and public targets on any port; the monitor list is runtime SQLite-
    managed and not enumerable from git. Because the cluster entity does not
    cover non-meshed pods, a monitor needs the all entity (every endpoint, in
    or out of the cluster). Documented broad egress by design.
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: uptime-kuma
  egress:
    - toEntities:
        - all
