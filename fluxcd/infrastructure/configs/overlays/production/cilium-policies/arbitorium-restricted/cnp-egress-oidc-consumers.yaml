apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-oidc-consumers-egress
spec:
  description: >-
    OIDC discovery, JWKS and token exchange go to the IdP, which split-horizon
    DNS resolves to the cell-membrane gateway. Those gateway pods are not meshed,
    so an explicit toEndpoints allow is required, paired with cap.oidc, which is
    what the gateway's own ingress policy matches on.
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      policy.prplanit.com/cap.oidc: "true"
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: optcp-ingress-public
            gateway.networking.k8s.io/gateway-name: cell-membrane-ingress-gateway
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
