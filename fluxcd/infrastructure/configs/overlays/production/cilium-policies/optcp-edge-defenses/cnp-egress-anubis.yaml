apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-anubis-egress
spec:
  description: >-
    anubis is a bot-protection reverse proxy; its only egress dependency is
    the upstream it protects, GitLab's workhorse (gitlab-webservice-default
    in optcp-supply-chain, 8181/TCP). OG_PASSTHROUGH fetches OpenGraph
    metadata from that same target. DNS + mesh ride the universal CCNP
    baseline.
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app: anubis
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: optcp-supply-chain
            app: webservice
            gitlab.com/webservice-name: default
      toPorts:
        - ports:
            - port: "8181"
              protocol: TCP
