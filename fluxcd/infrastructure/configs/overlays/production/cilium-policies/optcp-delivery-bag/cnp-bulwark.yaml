apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-bulwark-egress
spec:
  description: >-
    Bulwark reaches Stalwart's JMAP API, and Zitadel at sso.optcp.com for OIDC discovery,
    JWKS and token exchange. sso.optcp.com resolves to the cell-membrane gateway, which is
    not meshed, so it needs an explicit allow paired with cap.oidc.
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app: bulwark
  egress:
    - toEndpoints:
        - matchLabels:
            app: stalwart
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: optcp-ingress-public
            gateway.networking.k8s.io/gateway-name: cell-membrane-ingress-gateway
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
