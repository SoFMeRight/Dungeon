apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-stalwart
spec:
  description: >-
    Stalwart: LAN-only mail ingress on 172.22.30.103 until a port forward is added, plus the
    stalwart-configuration Job reaching the management API, plus Bulwark reaching JMAP. Egress to world for outbound mail and cluster for
    the hairpin to s3.optcp.com and the IdP.
  endpointSelector:
    matchLabels:
      app: stalwart
  ingress:
    - fromCIDRSet:
        - cidr: "10.0.0.0/8"
        - cidr: "172.16.0.0/12"
        - cidr: "192.168.0.0/16"
          except:
            - "192.168.144.0/20"
      toPorts:
        - ports:
            - port: "2525"
              protocol: TCP
            - port: "1465"
              protocol: TCP
            - port: "1587"
              protocol: TCP
            - port: "1993"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app: stalwart-configuration
        - matchLabels:
            app: bulwark
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEntities:
        - world
        - cluster
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-stalwart-configuration
spec:
  description: The stalwart-configuration Job reaching the management API.
  endpointSelector:
    matchLabels:
      app: stalwart-configuration
  egress:
    - toEndpoints:
        - matchLabels:
            app: stalwart
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-stalwart-sentinel
spec:
  description: >-
    Stalwart and the Redis replicas reaching the sentinels; the redis-contract CCNP covers only
    the data port.
  endpointSelector:
    matchLabels:
      app: stalwart-sentinel-sentinel
  ingress:
    - fromEndpoints:
        - matchLabels:
            app: stalwart
        - matchLabels:
            app: stalwart-redis
        - matchLabels:
            app: stalwart-sentinel-sentinel
      toPorts:
        - ports:
            - port: "26379"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-stalwart-elasticsearch
spec:
  description: Stalwart's full-text search store, reachable by Stalwart only.
  endpointSelector:
    matchLabels:
      app: stalwart-elasticsearch
  ingress:
    - fromEndpoints:
        - matchLabels:
            app: stalwart
      toPorts:
        - ports:
            - port: "9200"
              protocol: TCP
