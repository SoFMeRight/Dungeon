apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-vault-internal
spec:
  description: >-
    Allow external-secrets pods, the zitadel-configuration Job, and Alloy
    (host/remote-node) to reach vault on 8200/TCP. Also LAN-only for vault UI access.
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app: vault
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: optcp-secrets
            app.kubernetes.io/name: external-secrets
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
    # zitadel-configuration writes the admin-SA PAT and caches the flatroles signing
    # key (optcp/apps/zitadel/{admin,app}).
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: optcp-identity
            app.kubernetes.io/name: zitadel-configuration
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
    # boundary-init stores the admin login database init generates (optcp/apps/boundary/app).
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: optcp-remote-access
            app.kubernetes.io/name: boundary
            app.kubernetes.io/component: init
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
    # openbao-snapshot logs in and streams the raft snapshot for the Velero backup.
    - fromEndpoints:
        - matchLabels:
            app: openbao-snapshot
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
    # stalwart-configuration writes the identities Stalwart issues (optcp/apps/stalwart/*).
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: optcp-delivery-bag
            app: stalwart-configuration
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
    # pki-intermediate (one-off) has optcp-pki sign optcp-pki-int's intermediate.
    - fromEndpoints:
        - matchLabels:
            app: pki-intermediate
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
            - port: "9091"
              protocol: TCP
    - fromCIDRSet:
        - cidr: "10.0.0.0/8"
        - cidr: "172.16.0.0/12"
        - cidr: "192.168.0.0/16"
          except:
            - "192.168.144.0/20"
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
