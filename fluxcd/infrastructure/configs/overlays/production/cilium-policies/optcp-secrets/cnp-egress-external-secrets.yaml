apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-external-secrets-egress
spec:
  description: >-
    external-secrets syncs from OpenBao and any configured external provider, an
    open-ended set, so world+cluster is granted; kube-apiserver and the mesh ride
    the universal CCNP baseline.
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: external-secrets
  egress:
    - toEntities:
        - world
        - cluster
