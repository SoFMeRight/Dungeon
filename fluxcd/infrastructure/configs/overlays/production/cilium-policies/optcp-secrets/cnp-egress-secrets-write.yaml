apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-secrets-write-egress
spec:
  description: The one-off secrets-write Job reaching OpenBao, nothing else.
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app: secrets-write
  egress:
    - toEndpoints:
        - matchLabels:
            app: vault
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
