apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  description: >-
    Default-deny ingress AND egress for prplanit-commerce namespace.
    Ingress: CCNPs cover kubelet-probes, istio-ambient, prometheus-scrape, contracts, ingress-gw.
    Egress: DNS + mesh + kube-apiserver ride the universal CCNP baseline; cnp-egress-external-apps
    grants Bagisto world+cluster and cnp-egress-to-gateway grants the gateway hairpin.
    Both directions use a reserved-label anchor to trigger enforcement.
  enableDefaultDeny:
    ingress: true
    egress: true
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            policy.prplanit.com/reserved: default-deny-anchor
  egress:
    - toEndpoints:
        - matchLabels:
            policy.prplanit.com/reserved: default-deny-anchor
