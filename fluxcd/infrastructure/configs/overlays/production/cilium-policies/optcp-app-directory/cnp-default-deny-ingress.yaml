apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  description: >-
    Default-deny ingress AND egress for optcp-app-directory namespace.
    Ingress: homarr DB access covered by contract CCNPs (has labels); CCNPs cover
    kubelet-probes, istio-ambient, prometheus-scrape, and ingress-gateway traffic.
    Egress: DNS + intra-namespace mesh (homarr->postgres/redis) + kube-apiserver
    ride the universal CCNP baseline; cnp-egress-homarr grants the dashboard's
    broad, user-configured egress.
    Both directions use a reserved-label anchor to trigger enforcement.
  enableDefaultDeny:
    ingress: true
    egress: true
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            policy.prplanit.com/reserved: default-deny-anchor
  egress:
    - toEndpoints:
        - matchLabels:
            policy.prplanit.com/reserved: default-deny-anchor
