apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-external-apps-egress
spec:
  description: >-
    InvoiceNinja reaches open-ended external sets as core function: email/SMTP/IMAP, payment
    gateways, calendar/video and webhook integrations. That set cannot be allowlisted, so
    world+cluster is granted; DBs and the mesh ride the universal CCNP baseline.
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - invoiceninja-app
  egress:
    - toEntities:
        - world
        - cluster
