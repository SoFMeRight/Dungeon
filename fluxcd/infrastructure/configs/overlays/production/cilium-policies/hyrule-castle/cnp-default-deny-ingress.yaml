apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  description: >-
    Default deny all ingress for hyrule-castle. Allows are additive
    from CCNPs (HBONE guardrail, DNS, probes, metrics, contracts) and
    namespace-specific CNPs below.
  enableDefaultDeny:
    ingress: true
    egress: false
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            policy.prplanit.com/reserved: default-deny-anchor
