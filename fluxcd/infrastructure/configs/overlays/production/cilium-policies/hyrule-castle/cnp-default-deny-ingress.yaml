apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  description: >-
    Default-deny ingress AND egress for hyrule-castle. Allows are additive
    from CCNPs (HBONE guardrail, DNS, probes, metrics, contracts) and
    namespace-specific CNPs below.
    Egress: DNS + intra-namespace mesh (app->db, gitaly/praefect, redis) +
    kube-apiserver ride the universal CCNP baseline; cnp-egress-cell-membrane-
    gateway grants the gateway world+cluster (proxies all-namespace backends),
    cnp-egress-external-apps grants the GitLab/Harbor/ERPNext/etc. components
    world+cluster, and apt-cacher-ng gets world. DBs and internal-only
    components ride the mesh.
    Both directions use a reserved-label anchor to trigger enforcement.
  enableDefaultDeny:
    ingress: true
    egress: true
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            policy.prplanit.com/reserved: default-deny-anchor
  egress:
    - toEndpoints:
        - matchLabels:
            policy.prplanit.com/reserved: default-deny-anchor
