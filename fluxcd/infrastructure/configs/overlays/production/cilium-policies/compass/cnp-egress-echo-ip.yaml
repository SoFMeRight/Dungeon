apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-echo-ip-egress
spec:
  description: >-
    echo-ip (echoip) downloads MaxMind GeoLite2 databases from
    updates.maxmind.com via geoipupdate (the STS init container + the weekly
    echo-ip-geoip-update CronJob, both labelled app=echo-ip). Reverse-DNS
    (PTR) lookups at request time ride the DNS baseline. Allow egress to
    updates.maxmind.com on 443/TCP, with L7 DNS.
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app: echo-ip
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:io.cilium.k8s.policy.serviceaccount: coredns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: "updates.maxmind.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
