apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  description: >-
    Default-deny ingress AND egress for optcp-monitoring-agents namespace.
    Ingress: CCNPs cover kubelet-probes, istio-ambient, prometheus-scrape;
    cnp-monitoring-lb grants LAN clients.
    Egress: DNS + mesh + kube-apiserver ride the universal CCNP baseline;
    cnp-monitoring-lb grants the UPS, Proxmox and PBS hosts.
    Both directions use a reserved-label anchor to trigger enforcement.
  enableDefaultDeny:
    ingress: true
    egress: true
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            policy.prplanit.com/reserved: default-deny-anchor
  egress:
    - toEndpoints:
        - matchLabels:
            policy.prplanit.com/reserved: default-deny-anchor
