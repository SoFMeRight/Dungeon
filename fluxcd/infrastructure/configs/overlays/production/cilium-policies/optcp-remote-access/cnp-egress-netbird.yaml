apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-netbird-egress
spec:
  description: >-
    netbird (WireGuard management/signal/TURN + peers) reaches open-ended external
    sets that cannot be allowlisted, so world+cluster is granted; its database and
    the mesh ride the universal CCNP baseline. Inert until egress default-deny is
    enabled.
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - netbird
  egress:
    - toEntities:
        - world
        - cluster
