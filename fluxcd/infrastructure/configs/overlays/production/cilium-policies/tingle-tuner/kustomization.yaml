apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tingle-tuner
resources:
  - cnp-default-deny-ingress.yaml
  - cnp-endlessh.yaml
  - cnp-searxng-internal.yaml
  # Egress allows (inert until egress default-deny is enabled for the namespace).
  # Tier: model-fetchers (FQDN) → external CDN; broad (world) → documented wide egress.
  - cnp-egress-faster-whisper.yaml
  - cnp-egress-piper.yaml
  - cnp-egress-libretranslate.yaml
  - cnp-egress-ollama.yaml
  - cnp-egress-google-webfonts-helper.yaml
  - cnp-egress-searxng.yaml
  - cnp-egress-stable-diffusion-webui.yaml
  - cnp-egress-renovate.yaml
