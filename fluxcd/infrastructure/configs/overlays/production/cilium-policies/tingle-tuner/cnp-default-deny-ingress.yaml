apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  description: >-
    Default-deny ingress AND egress for tingle-tuner namespace.
    Ingress: CCNPs cover kubelet-probes, istio-ambient, prometheus-scrape,
    and ingress-gateway traffic; searxng-redis via the redis contract CCNP.
    Egress: universal CCNPs cover DNS + mesh HBONE; per-app cnp-egress-*
    grant model-fetcher (toFQDNs) and documented-broad (world) egress.
    Both directions use a reserved-label anchor to trigger enforcement.
  enableDefaultDeny:
    ingress: true
    egress: true
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            policy.prplanit.com/reserved: default-deny-anchor
  egress:
    - toEndpoints:
        - matchLabels:
            policy.prplanit.com/reserved: default-deny-anchor
