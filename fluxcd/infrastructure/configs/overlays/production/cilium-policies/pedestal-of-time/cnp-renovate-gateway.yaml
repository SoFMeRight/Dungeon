apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-renovate-to-xylem-gateway
spec:
  description: >-
    Renovate (hyrule-castle/app=renovate) ingress to xylem-gateway on :443, which serves
    the *.cr.pcfae.com proxy caches. Identity-based: the gateway's LAN rule excepts the
    pod CIDR, so in-cluster callers need an explicit allow.
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: xylem-gateway
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: hyrule-castle
            app: renovate
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
