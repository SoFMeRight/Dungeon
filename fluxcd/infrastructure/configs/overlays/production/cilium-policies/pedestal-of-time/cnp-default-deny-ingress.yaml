apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  description: >-
    Default-deny ingress AND egress for pedestal-of-time namespace.
    Ingress: paperless DB access covered by contract CCNPs (has labels);
    CCNPs cover kubelet-probes, istio-ambient, prometheus-scrape, ingress-gw.
    Egress: DNS + intra-namespace mesh (app->db) + kube-apiserver ride the
    universal CCNP baseline. The apps are self-contained and need nothing
    external.
    Both directions use a reserved-label anchor to trigger enforcement.
  enableDefaultDeny:
    ingress: true
    egress: true
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            policy.prplanit.com/reserved: default-deny-anchor
  egress:
    - toEndpoints:
        - matchLabels:
            policy.prplanit.com/reserved: default-deny-anchor
