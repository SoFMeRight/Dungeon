apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny
spec:
  description: >-
    Default-deny ingress AND egress for lens-of-truth namespace.
    Ingress: IoT mesh, LB, and internal communication covered by explicit CNPs;
    CCNPs cover kubelet-probes, istio-ambient, prometheus-scrape, ingress-gw.
    Egress: DNS + intra-namespace mesh (MQTT, wazuh-indexer) + kube-apiserver
    ride the universal CCNP baseline; per-app cnp-egress-* grant crowdsec (CTI/
    CAPI), the Cloudflare bouncer, frigate (LAN cameras + Frigate+), wazuh-manager
    (feeds), home-assistant (unbounded integrations), and wazuh indexer/dashboard
    (OIDC discovery/JWKS/token exchange to Zitadel); zigbee2mqtt keeps its
    coordinator/MQTT allow (cnp-iot-mesh). mosquitto and crowdsec-dashboard are
    internal and need nothing external.
    Both directions use a reserved-label anchor to trigger enforcement.
  enableDefaultDeny:
    ingress: true
    egress: true
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            policy.prplanit.com/reserved: default-deny-anchor
  egress:
    - toEndpoints:
        - matchLabels:
            policy.prplanit.com/reserved: default-deny-anchor
