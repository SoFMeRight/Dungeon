apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  description: >-
    Default-deny ingress AND egress for optcp-management-dashboards namespace.
    Ingress: CCNPs cover kubelet-probes, istio-ambient, prometheus-scrape, ingress-gw;
    cnp-pve-cluster-proxy grants phloem to the PVE and PBS proxies.
    Egress: DNS + mesh + kube-apiserver ride the universal CCNP baseline; cnp-egress-*
    grant the OIDC hairpin and headlamp's plugin seed; cnp-pve-cluster-proxy grants the
    Proxmox and PBS hosts.
    Both directions use a reserved-label anchor to trigger enforcement.
  enableDefaultDeny:
    ingress: true
    egress: true
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            policy.prplanit.com/reserved: default-deny-anchor
  egress:
    - toEndpoints:
        - matchLabels:
            policy.prplanit.com/reserved: default-deny-anchor
