apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-secrets-rename-egress
spec:
  description: The one-off secrets-rename Job reaching OpenBao, nothing else.
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app: secrets-rename
  egress:
    - toEndpoints:
        - matchLabels:
            app: vault
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
