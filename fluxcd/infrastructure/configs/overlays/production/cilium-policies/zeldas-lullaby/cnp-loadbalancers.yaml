apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-netbird-coturn
spec:
  description: >-
    Public STUN/TURN ingress to netbird-coturn (172.22.30.86) — world + cluster on
    3478/UDP+TCP, 5349/TCP+UDP, and the 49152-65535/UDP relay range. A VPN's TURN
    server has to be reachable by remote peers (cellular/off-LAN), not just the LAN.
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    # The coturn pods are labeled app=netbird, component=coturn — NOT app=netbird-coturn.
    # The old selector matched zero pods, so default-deny-ingress silently blocked ALL
    # ingress to coturn (STUN/TURN answered only on loopback). Match the real labels.
    matchLabels:
      app: netbird
      component: coturn
  ingress:
    # A VPN's TURN server has to be reachable by peers out on the internet (phones on
    # cellular, remote nodes behind NAT) — not just the LAN. Allow world + cluster.
    # STUN binding is unauthenticated (harmless address reflection); TURN allocations
    # still require the NetBird-issued time-based credentials, so this isn't open relay.
    - fromEntities:
        - world
        - cluster
      toPorts:
        - ports:
            - port: "3478"
              protocol: UDP
            - port: "3478"
              protocol: TCP
            - port: "5349"
              protocol: TCP
            - port: "5349"
              protocol: UDP
            # TURN relay media range — needed by symmetric-NAT/CGNAT peers (typical on
            # cellular) that can't hole-punch and must relay through coturn.
            - port: "49152"
              endPort: 65535
              protocol: UDP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-unifi-app-lan
spec:
  description: >-
    LAN-only ingress to unifi-app (172.22.30.20) on
    8443,8080,8843,8880,6789/TCP, 3478,10001,1900/UDP, 5514/UDP.
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app: unifi-app
  ingress:
    - fromCIDRSet:
        - cidr: "10.0.0.0/8"
        - cidr: "172.16.0.0/12"
        - cidr: "192.168.0.0/16"
          except:
            - "192.168.144.0/20"
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
            - port: "3478"
              protocol: UDP
            - port: "10001"
              protocol: UDP
            - port: "8080"
              protocol: TCP
            - port: "1900"
              protocol: UDP
            - port: "8843"
              protocol: TCP
            - port: "8880"
              protocol: TCP
            - port: "6789"
              protocol: TCP
            - port: "5514"
              protocol: UDP
