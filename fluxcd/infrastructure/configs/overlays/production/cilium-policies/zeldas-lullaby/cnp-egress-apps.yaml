apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-apps-egress
spec:
  description: >-
    These administrative apps reach open-ended external sets: netbird (WireGuard
    management/signal/TURN + peers), semaphore (Ansible against the
    LAN/remote fleet + git), unifi-app (LAN UniFi devices + firmware) and
    netbox-server (webhooks/scripts). Those cannot be allowlisted, so world+cluster is granted; DBs and
    the mesh ride the universal CCNP baseline. Inert until egress default-deny is
    enabled.
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - netbird
          - semaphore
          - unifi-app
          - netbox-server
  egress:
    - toEntities:
        - world
        - cluster
