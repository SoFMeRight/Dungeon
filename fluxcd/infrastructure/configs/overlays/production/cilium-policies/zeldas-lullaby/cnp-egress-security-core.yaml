apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-security-core-egress
spec:
  description: >-
    vault forms its raft peer quorum and reaches its auto-unseal/transit + OIDC
    backends, open-ended external sets that
    cannot be allowlisted, so world+cluster is granted (kube-apiserver + mesh ride
    the universal CCNP baseline). Inert until egress default-deny is enabled.
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - vault
  egress:
    - toEntities:
        - world
        - cluster
