apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  description: >-
    Default-deny ingress AND egress for zeldas-lullaby namespace.
    Ingress: administrative services (netbird,
    netbox, semaphore, unifi);
    CCNPs cover kubelet-probes, istio-ambient, prometheus-scrape, postgres/redis
    contracts, and ingress-gateway traffic for labeled pods.
    Egress: DNS + intra-namespace mesh (app->db, redis) +
    kube-apiserver ride the universal CCNP baseline; cnp-egress-apps grants the
    reaching-external admin apps world+cluster. DBs and redis/sentinel
    need nothing beyond the mesh.
    Both directions use a reserved-label anchor to trigger enforcement.
  enableDefaultDeny:
    ingress: true
    egress: true
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            policy.prplanit.com/reserved: default-deny-anchor
  egress:
    - toEndpoints:
        - matchLabels:
            policy.prplanit.com/reserved: default-deny-anchor
