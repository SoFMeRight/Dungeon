apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-content-apps-egress
spec:
  description: >-
    These content/media apps fetch from an open-ended external set as their core
    function — metadata/artwork providers (photoprism),
    LLM/AI and web-RAG endpoints (open-webui), photo maps + ML models (immich),
    collab signaling (nextcloud-talk-hpb), and Matrix federation plus the identity
    provider hairpin (matrix-synapse, matrix-auth — sso.optcp.com resolves to the
    gateway VIP from inside, so this is a cluster destination, not a world one).
    matrix-lk-jwt joins them because authorising a caller means verifying their
    OpenID token against the homeserver that issued it — ours via the gateway VIP
    for a local user, an arbitrary host for a federated one. That set cannot
    be allowlisted, so world+cluster is granted (cluster covers in-cluster deps
    beyond the mesh). DNS + intra-namespace mesh (app->db) ride the universal
    CCNP baseline.
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - immich
          - open-webui
          - matrix-synapse
          - matrix-auth
          - matrix-lk-jwt
          - photoprism
          - nextcloud-talk-hpb
  egress:
    - toEntities:
        - world
        - cluster
