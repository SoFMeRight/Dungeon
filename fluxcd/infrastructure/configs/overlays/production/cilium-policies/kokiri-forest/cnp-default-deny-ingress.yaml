apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  description: >-
    Default-deny ingress AND egress for kokiri-forest namespace.
    Ingress: gateway pods via cnp-phloem-gateway; linkstack via
    ingress-backend CCNP; linkstack-db from linkstack via cnp-linkstack-db.
    Egress: linkstack->linkstack-db rides HBONE, so the universal DNS/HBONE
    CCNPs cover the in-cluster path, but linkstack does leave the mesh — the
    OIDC hairpin and the theme updater's GitHub reads — which
    cnp-egress-linkstack allows. Both directions use a reserved-label
    anchor to trigger enforcement.
  enableDefaultDeny:
    ingress: true
    egress: true
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            policy.prplanit.com/reserved: default-deny-anchor
  egress:
    - toEndpoints:
        - matchLabels:
            policy.prplanit.com/reserved: default-deny-anchor
