apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-buildkitd
spec:
  description: >-
    buildkitd takes builds from CI job pods only, on 1234 (mTLS with its own CA).
    It pulls base images and pushes results: the internet, plus the gateways that
    front in-cluster registries by their public names (cr.optcp.com resolves to
    phloem; the gateway pods are non-meshed, so the cluster entity does not match
    them).
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app: buildkitd
  ingress:
    - fromEndpoints:
        - matchLabels:
            policy.prplanit.com/ci-job: "true"
      toPorts:
        - ports:
            - port: "1234"
              protocol: TCP
  egress:
    - toEntities:
        - world
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: optcp-ingress-public
            gateway.networking.k8s.io/gateway-name: cell-membrane-ingress-gateway
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: optcp-ingress-operator
            gateway.networking.k8s.io/gateway-name: xylem-ingress-gateway
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: optcp-ingress-internal
            gateway.networking.k8s.io/gateway-name: phloem-ingress-gateway
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "80"
              protocol: TCP
