apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-leantime-egress
spec:
  description: >-
    Leantime egress: world for outbound mail and integrations, cluster for the
    hairpin to the IdP (sso.prplanit.com via split-horizon DNS to the gateway).
  endpointSelector:
    matchLabels:
      app: leantime
  egress:
    - toEntities:
        - world
        - cluster
