apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-bookstack-egress
spec:
  description: >-
    BookStack egress: world for outbound mail and integrations, cluster for the
    hairpin to the IdP (sso.optcp.com via split-horizon DNS to the gateway).
  endpointSelector:
    matchLabels:
      app: bookstack
  egress:
    - toEntities:
        - world
        - cluster
