apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-ark-sa-egress
spec:
  description: >-
    The ARK SA servers (theisland, valguero) auto-update themselves and their Steam Workshop
    mods via SteamCMD on start, and register for Steam/Epic crossplay. That spans Steam's
    CDN/content servers, Steam master on 27015-27030, and Epic — an open-ended external set on
    many ports that cannot be allowlisted. Documented broad world+cluster egress; game-listen
    ports are inbound (players connect in) and covered by cnp-game-servers. The admin-list
    server is DNS + mesh-only.
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - ark-sa-tmc-theisland
          - ark-sa-tmc-valguero
  egress:
    - toEntities:
        - world
        - cluster
