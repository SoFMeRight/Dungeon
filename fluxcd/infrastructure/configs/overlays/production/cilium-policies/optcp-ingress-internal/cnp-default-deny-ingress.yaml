apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  description: >-
    Default-deny ingress AND egress for optcp-ingress-internal namespace.
    Gateway pods get VPN/LAN CIDR ingress via cnp-phloem-ingress-gateway and the
    cnp-phloem-ingress-gateway-from-* identity allows; egress via cnp-egress-phloem-ingress-gateway (whole-cluster +
    world backends). DNS, kube-apiserver and mesh (HBONE) ride the universal
    CCNP baseline.
    CCNPs provide: kubelet-probes, istio-ambient, prometheus-scrape.
  enableDefaultDeny:
    ingress: true
    egress: true
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            policy.prplanit.com/reserved: default-deny-anchor
  egress:
    - toEndpoints:
        - matchLabels:
            policy.prplanit.com/reserved: default-deny-anchor
