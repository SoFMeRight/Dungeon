apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-phloem-ingress-gateway-from-renovate
spec:
  description: >-
    Renovate (hyrule-castle/app=renovate) ingress to phloem-ingress-gateway on :80/:443 for
    Harbor tag discovery on cr.optcp.com and the *.cr.optcp.com proxy caches.
    Identity-based: the gateway's LAN rule excepts the pod CIDR, so in-cluster callers
    need an explicit allow.
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: phloem-ingress-gateway
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: hyrule-castle
            app: renovate
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: optcp-ci-runners
            app: renovate
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
