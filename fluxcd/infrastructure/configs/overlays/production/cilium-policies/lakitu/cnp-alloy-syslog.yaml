apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-alloy-syslog-ingress
  namespace: lakitu
spec:
  endpointSelector:
    matchLabels:
      app: alloy-syslog
  ingress:
    # Syslog senders are devices outside the cluster (pfSense, appliances) reaching the
    # LoadBalancer VIP. UDP is not captured by ztunnel, so Cilium alone governs it.
    - fromEntities:
        - world
        - cluster
      toPorts:
        - ports:
            - port: "5514"
              protocol: UDP
            - port: "5424"
              protocol: UDP
    # Syslog over TLS rides TCP, so ztunnel captures it and the Istio LB policy also applies.
    # LAN only; the pod CIDR is excluded so nothing in-cluster hairpins through the VIP.
    - fromCIDRSet:
        - cidr: "10.0.0.0/8"
        - cidr: "172.16.0.0/12"
        - cidr: "192.168.0.0/16"
          except:
            - "192.168.144.0/20"
      toPorts:
        - ports:
            - port: "6514"
              protocol: TCP
