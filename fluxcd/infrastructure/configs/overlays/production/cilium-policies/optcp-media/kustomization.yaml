apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: optcp-media
resources:
  - cnp-default-deny-ingress.yaml
  - cnp-romm-db.yaml
  - cnp-media-servers.yaml
  - cnp-overseerr-to-plex.yaml
  - cnp-jellyseerr-to-jellyfin.yaml
  # Egress allows (inert until egress default-deny is enabled for the namespace).
  # romm-db is DNS/mesh-only (no allow needed).
  - cnp-egress-romm.yaml
  - cnp-egress-content-apps.yaml
  - cnp-egress-navidrome.yaml
