apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-mealie-egress
spec:
  description: >-
    mealie scrapes recipes from arbitrary user URLs as its core function, and
    signs in through the identity provider hairpin (sso.optcp.com resolves to
    the gateway VIP from inside, so this is a cluster destination, not a world
    one). That set cannot be allowlisted, so world+cluster is granted (cluster
    covers in-cluster deps beyond the mesh). DNS + intra-namespace mesh
    (app->db) ride the universal CCNP baseline.
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app: mealie
  egress:
    - toEntities:
        - world
        - cluster
