apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-ferdium-egress
spec:
  description: >-
    ferdium is a messaging aggregator: it loads the web apps of an open-ended,
    user-configured set of external services (chat, mail, self-hosted tools),
    so its egress is inherently unbounded. world+cluster covers external and
    in-cluster targets; the non-meshed gateways are granted explicitly (the
    cluster entity does not match them). DNS + mesh ride the universal CCNP
    baseline. Inert until egress default-deny is enabled.
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app: ferdium
  egress:
    - toEntities:
        - world
        - cluster
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: hyrule-castle
            gateway.networking.k8s.io/gateway-name: cell-membrane-gateway
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: arylls-lookout
            gateway.networking.k8s.io/gateway-name: xylem-gateway
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "80"
              protocol: TCP
            - port: "15021"
              protocol: TCP
