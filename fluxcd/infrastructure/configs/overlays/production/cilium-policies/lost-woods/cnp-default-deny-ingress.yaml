apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  description: >-
    Default-deny ingress AND egress for lost-woods namespace.
    Ingress: homarr DB access covered by contract CCNPs (has labels); all apps
    have ingress labels — CCNPs cover kubelet-probes, istio-ambient,
    prometheus-scrape, and ingress-gateway traffic.
    Egress: DNS + intra-namespace mesh (homarr->postgres/redis) + kube-apiserver
    ride the universal CCNP baseline; per-app cnp-egress-* grant the broad,
    user-configured egress of the dashboards/aggregator (ferdium, homarr,
    organizr). The static sites are serve-only and need nothing external.
    Both directions use a reserved-label anchor to trigger enforcement.
  enableDefaultDeny:
    ingress: true
    egress: true
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            policy.prplanit.com/reserved: default-deny-anchor
  egress:
    - toEndpoints:
        - matchLabels:
            policy.prplanit.com/reserved: default-deny-anchor
