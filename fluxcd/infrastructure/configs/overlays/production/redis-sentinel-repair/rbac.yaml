# Pod deletion is granted only where a RedisSentinel runs: this ClusterRole grants
# nothing on its own, and Kyverno binds it in each namespace that holds a
# RedisSentinel (generate-redis-sentinel-repair-access), so a Sentinel that moves
# or appears is covered without a list to keep in step.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: redis-sentinel-repair
  labels:
    app: redis-sentinel-repair
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
# The job finds its namespaces from the RedisSentinel objects.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: redis-sentinel-repair-discover
  labels:
    app: redis-sentinel-repair
rules:
  - apiGroups: ["redis.redis.opstreelabs.in"]
    resources: ["redissentinels"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: redis-sentinel-repair-discover
  labels:
    app: redis-sentinel-repair
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: redis-sentinel-repair-discover
subjects:
  - kind: ServiceAccount
    name: redis-sentinel-repair
    namespace: optcp-operators-baseline
