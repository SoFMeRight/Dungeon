apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fairy-bottle
resources:
  - nas-s3-serviceaccount.yaml
  - nas-s3-provisioner-credentials-externalsecret.yaml
  - nas-s3-setup-script.yaml
  - nas-s3-setup.yaml
patches:
  # Kyverno restrict-default-sa-controllers requires a non-default serviceAccountName
  # for controllers in ambient-mesh namespaces.
  - target:
      kind: Job
      name: nas-s3-setup
    patch: |
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: nas-s3-setup
      spec:
        template:
          spec:
            serviceAccountName: nas-s3-setup
