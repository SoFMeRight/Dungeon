apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fairy-bottle
resources:
  - nas-s3-setup-serviceaccount.yaml
  - nas-s3-provisioner-credentials-externalsecret.yaml
  - nas-s3-setup-script.yaml
  # The one-shot nas-s3-setup Job lives in ../nas-s3-jobs, reconciled by the
  # force:true infra-nas-s3-jobs Kustomization so an aws-cli image bump replaces
  # its immutable template instead of wedging this whole config set.
