apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Human-user RBAC for the Zitadel OIDC ladder (authority high->low):
#   prplanit-sso:operator  -> cluster-admin (clusterrolebinding-operator.yaml, cluster-wide)
#   prplanit-sso:admin     -> built-in `admin`      \  bound per-namespace via
#   prplanit-sso:developer -> dungeon:developer      } rolebindings-<ns>.yaml files
#   prplanit-sso:user      -> built-in `view`       /  added as people are granted
resources:
  - clusterrole-developer.yaml         # edit minus secret-read (see file header)
  - clusterrolebinding-operator.yaml   # the ONE cluster-wide human binding
