apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fairy-bottle
resources:
  - s3-buckets-provisioning-gringotts-serviceaccount.yaml
  - nas-s3-provisioner-credentials-externalsecret.yaml
  - s3-buckets-provisioning-gringotts-script.yaml
  - s3-buckets-provisioning-gringotts.yaml
patches:
  # Kyverno restrict-default-sa-controllers requires a non-default serviceAccountName
  # for controllers in ambient-mesh namespaces.
  - target:
      kind: Job
      name: s3-buckets-provisioning-gringotts
    patch: |
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: s3-buckets-provisioning-gringotts
      spec:
        template:
          spec:
            serviceAccountName: s3-buckets-provisioning-gringotts
