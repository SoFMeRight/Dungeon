apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: outspokekin-com-tls
spec:
  secretName: outspokekin-com-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - "*.outspokekin.com"
---
# The apex gets its own certificate rather than sharing the wildcard's. A single cert
# covering both names lets a browser reuse its HTTP/2 connection to a subdomain for an
# apex request: the connection landed on the wildcard listener, whose route table has no
# apex entry, so Envoy answers 404 route_not_found. Separate certs make the names
# uncoalescable, which is what keeps /.well-known reachable from a client that already
# holds a connection to matrix.outspokekin.com.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: outspokekin-com-apex-tls
spec:
  secretName: outspokekin-com-apex-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - "outspokekin.com"
---
# The remaining apexes get their own certificates for the same reason as outspokekin's
# above. Each is paired with a wildcard on one IP, so a shared certificate is all a
# browser needs to reuse a subdomain's connection for an apex request — which then
# arrives on the wildcard listener and is answered 404 route_not_found.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: arbitorium-com-apex-tls
spec:
  secretName: arbitorium-com-apex-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - "arbitorium.com"
---
