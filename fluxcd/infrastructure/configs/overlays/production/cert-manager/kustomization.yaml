apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/cert-manager
  - gateway-certificates.yaml
patches:
  - path: clusterissuer-patch.yaml
    target:
      kind: ClusterIssuer
  # Set namespace for ExternalSecrets to king-of-red-lions (where cert-manager runs)
  - patch: |-
      - op: add
        path: /metadata/namespace
        value: king-of-red-lions
    target:
      kind: ExternalSecret
  # Set namespaces for gateway certificates to match their gateway locations
  - patch: |-
      - op: add
        path: /metadata/namespace
        value: kai-ingress-private
    target:
      kind: Certificate
      name: pcfae-com-tls
  - patch: |-
      - op: add
        path: /metadata/namespace
        value: kai-ingress-private
    target:
      kind: Certificate
      name: pcfae-com-apex-tls
  # phloem-ingress-gateway certs land in optcp-ingress-internal
  - patch: |-
      - op: add
        path: /metadata/namespace
        value: optcp-ingress-internal
    target:
      kind: Certificate
      name: pcfae-com-phloem-tls
  - patch: |-
      - op: add
        path: /metadata/namespace
        value: optcp-ingress-internal
    target:
      kind: Certificate
      name: pcfae-com-apex-phloem-tls
