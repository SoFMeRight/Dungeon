# Canonical source of /etc/kubernetes/auth/auth-config.yaml on each control-plane node.
# Structured apiserver authentication (apiserver.config.k8s.io/v1, stable in 1.35) — REPLACES
# the single-issuer --oidc-* flags so the apiserver can trust TWO JWT issuers at once:
#   1. GitLab   — CI identity (stagefreight), reproduced EXACTLY from the old --oidc-* flags.
#   2. Zitadel  — human + kubelogin identity, app "Kubernetes: Dungeon".
#
# Placed on each node (see configmap-patch.yaml header) BEFORE regenerating the apiserver,
# or it crashloops on a missing file. The apiserver validates this file at startup and
# fetches each issuer's /.well-known/openid-configuration — a malformed file or an
# unreachable issuer fails THAT apiserver to start (hence the one-node-at-a-time canary).
apiVersion: apiserver.config.k8s.io/v1
kind: AuthenticationConfiguration
jwt:
  # --- GitLab CI (stagefreight) — verbatim equivalent of the prior --oidc-* flags ---
  - issuer:
      url: https://gitlab.prplanit.com
      audiences:
        - stagefreight
    claimMappings:
      username:
        claim: sub
        prefix: "prplanit-git:"
      groups:
        claim: groups
        prefix: "prplanit-git:"
  # --- Zitadel (sso.prplanit.com) — apps "Kubernetes: Dungeon" (kubelogin) + Headlamp ---
  - issuer:
      url: https://sso.prplanit.com
      audiences:
        - "393723781534750283"  # kubelogin (Kubernetes: Dungeon)
        - "393929303420607200"  # headlamp
      audienceMatchPolicy: MatchAny
    claimMappings:
      username:
        claim: preferred_username
        prefix: "prplanit-sso:"
      groups:
        # Groups come from the flat `roles` claim set by the Zitadel Action "flatRoles"
        # (it collects every granted role key into a string array). Plain claim+prefix, no CEL.
        # NOTE: flatRoles flattens roles across ALL of a user's project grants, so these
        # groups are NOT project-scoped — the RBAC bindings account for that.
        claim: roles
        prefix: "prplanit-sso:"
