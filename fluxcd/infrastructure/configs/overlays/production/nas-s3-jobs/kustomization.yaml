apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fairy-bottle
# One-shot nas-s3 bootstrap Job, split out of the nas-s3 config set so a dedicated
# force:true Flux Kustomization (infra-nas-s3-jobs) can REPLACE its immutable template
# on an image bump instead of wedging the whole infra-configs reconcile. Same pattern
# as infra-zitadel-jobs. Durable resources (SA, ESO secret, script ConfigMap) stay in
# nas-s3/ under infra-configs; this Kustomization dependsOn infra-configs for them.
resources:
  - nas-s3-setup.yaml
patches:
  # Kyverno restrict-default-sa-controllers requires a non-default serviceAccountName
  # for controllers in ambient-mesh namespaces. The SA is created by infra-configs.
  - target:
      kind: Job
      name: nas-s3-setup
    patch: |
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: nas-s3-setup
      spec:
        template:
          spec:
            serviceAccountName: nas-s3-setup
