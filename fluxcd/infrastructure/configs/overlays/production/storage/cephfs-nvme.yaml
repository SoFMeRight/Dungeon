apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: cephfs-nvme
  annotations:
    kustomize.toolkit.fluxcd.io/force: "Enabled"
provisioner: gorons-bracelet.cephfs.csi.ceph.com
parameters:
  clusterID: 0985467c-d8f3-4483-b27f-f0a512397ec2
  fsName: Seed_Bank
  pool: dungeon-fs-nvme
  subvolumePath: /dungeon/nvme/csi-volumes
  mounter: kernel
  csi.storage.k8s.io/provisioner-secret-name: csi-cephfs-provisioner
  csi.storage.k8s.io/provisioner-secret-namespace: optcp-operators-privileged
  csi.storage.k8s.io/controller-expand-secret-name: csi-cephfs-provisioner
  csi.storage.k8s.io/controller-expand-secret-namespace: optcp-operators-privileged
  csi.storage.k8s.io/node-stage-secret-name: csi-cephfs-node
  csi.storage.k8s.io/node-stage-secret-namespace: optcp-operators-privileged
reclaimPolicy: Retain
allowVolumeExpansion: true
