apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: enforce-pod-hardening-ro-rootfs
  namespace: optcp-policy-engine
  annotations:
    policies.kyverno.io/description: >-
      Workloads exempt from enforce-pod-hardening's require-readonly-root-fs rule. The vast
      majority genuinely cannot run a read-only rootfs: databases (write data/conf/PID),
      LSIO/s6 (write /run + /config), gitlab/harbor Helm charts, apache-root apps (write app
      dir), GPU workloads (writable /tmp/CUDA), ai-dock, gluetun cohort, and root-vendor images.
      The ~10 genuinely RO-root-clean workloads (stateless exporters, VictoriaMetrics, appflowy
      rust services, uptime-kuma, searxng) are hardened instead of listed here.
spec:
  policyRefs:
    - name: enforce-pod-hardening-ro-rootfs
      kind: ValidatingPolicy
  matchConditions:
    - name: exempt-workloads
      expression: |-
        [object.metadata.?name.orValue('') != '' ? object.metadata.name : object.metadata.?generateName.orValue('')].exists(name,
          object.kind == 'Pod' && object.metadata.namespace == 'optcp-network-services' &&
            name.matches('^(adguard-.*|adguardhome-sync-.*|chrony-.*)$') ||
          object.kind == 'Pod' && object.metadata.namespace == 'optcp-gossip-stone' &&
            name.matches('^(grafana-.*|nutify-.*|speedtest-tracker-.*)$') ||
          object.kind == 'Pod' && object.metadata.namespace == 'prplanit-remote-access' &&
            name.matches('^tactical-.*$') ||
          // bagisto/invoiceninja apache+root, frappe-suite (writes /home/frappe + sites).
          object.kind == 'Pod' && object.metadata.namespace == 'prplanit-billing' &&
            name.matches('^invoiceninja-app-.*$') ||
          object.kind == 'Pod' && object.metadata.namespace == 'prplanit-commerce' &&
            name.matches('^bagisto-demo-.*$') ||
          object.kind == 'Pod' && object.metadata.namespace == 'prplanit-staff-suite' &&
            name.matches('^frappe-suite-.*$') ||
          // optcp-supply-chain — apt-cacher apache+root, gitlab and harbor Helm charts, LSIO netbootxyz.
          object.kind == 'Pod' && object.metadata.namespace == 'optcp-supply-chain' &&
            name.matches('^(apt-cacher-ng-.*|gitlab-.*|harbor-.*|netbootxyz-.*)$') ||
          // optcp-ci-runners — renovate (containerbase installs toolchains at runtime).
          object.kind == 'Pod' && object.metadata.namespace == 'optcp-ci-runners' &&
            name.matches('^renovate-.*$') ||
          // prplanit-support — osticket apache+root.
          object.kind == 'Pod' && object.metadata.namespace == 'prplanit-support' &&
            name.matches('^osticket-.*$') ||
          object.kind == 'Pod' && object.metadata.namespace == 'outspokekin-social' &&
            name.matches('^linkstack-.*$') ||
          object.kind == 'Pod' && object.metadata.namespace == 'optcp-ids-ips' &&
            name.matches('^crowdsec-.*$') ||
          object.kind == 'Pod' && object.metadata.namespace == 'optcp-siem' &&
            name.matches('^wazuh-.*$') ||
          object.kind == 'Pod' && object.metadata.namespace == 'arbitorium-home' &&
            name.matches('^home-assistant-.*$') ||
          object.kind == 'Pod' && object.metadata.namespace == 'arbitorium-nvr' &&
            name.matches('^frigate-.*$') ||
          object.kind == 'Pod' && object.metadata.namespace == 'kai-personal' &&
            name.matches('^ferdium-.*$') ||
          object.kind == 'Pod' && object.metadata.namespace == 'optcp-app-directory' &&
            name.matches('^(homarr-.*|organizr-.*)$') ||
          object.kind == 'Pod' && object.metadata.namespace == 'kai-private' &&
            name.matches('^photoprism-x-.*$') ||
          object.kind == 'Pod' && object.metadata.namespace == 'optcp-restricted' &&
            name.matches('^plex-ms-x-.*$') ||
          object.kind == 'Pod' && object.metadata.namespace == 'optcp-media' &&
            name.matches('^(calibre-web-.*|plex-.*|romm-.*)$') ||
          object.kind == 'Pod' && object.metadata.namespace == 'optcp-shooting-gallery' &&
            name.matches('^(ark-sa-.*|ark-se-.*)$') ||
          // optcp-swift-sail-privileged — gluetun cohort + LSIO *arr + root-vendor.
          object.kind == 'Pod' && object.metadata.namespace == 'optcp-swift-sail-privileged' &&
            name.matches('^(bazarr-.*|byparr-.*|downloadarrs-.*|jellyseerr-.*|neko-.*|overseerr-.*|pinchflat-.*|prowlarr-.*|pyload-ng-.*|sabnzbd-.*|thelounge-.*)$') ||
          // optcp-swift-sail — anirra (root-vendor).
          object.kind == 'Pod' && object.metadata.namespace == 'optcp-swift-sail' &&
            name.matches('^anirra-.*$') ||
          object.kind == 'Pod' && object.metadata.namespace == 'arbitorium-restricted' &&
            name.matches('^(immich-.*|lubelogger-.*|monica-.*|paperless-webserver-.*|photoprism-.*)$') ||
          // optcp-staff-suite — kimai apache + sidecars.
          object.kind == 'Pod' && object.metadata.namespace == 'optcp-staff-suite' &&
            name.matches('^kimai-.*$') ||
          // optcp-delivery-bag — opstree redis/sentinel render their config at start; elasticsearch
          // writes its keystore under the install dir.
          object.kind == 'Pod' && object.metadata.namespace == 'optcp-delivery-bag' &&
            name.matches('^(stalwart-redis-.*|stalwart-sentinel-.*|stalwart-elasticsearch-.*)$') ||
          // optcp-cloud — appflowy web/admin (NOT cloud/ai, which are hardened), bookstack LSIO, linkwarden root, nextcloud apache + sidecars, penpot-frontend, shlink-db LSIO
          object.kind == 'Pod' && object.metadata.namespace == 'optcp-cloud' &&
            name.matches('^(appflowy-admin-frontend-.*|appflowy-web-.*|bookstack-.*|linkwarden-.*|nextcloud-.*|penpot-frontend-.*|shlink-db-.*)$') ||
          // optcp-ai — GPU (faster-whisper/libretranslate/stable-diffusion write /tmp), open-webui
          object.kind == 'Pod' && object.metadata.namespace == 'optcp-ai' &&
            name.matches('^(faster-whisper-.*|libretranslate-.*|open-webui-.*|stable-diffusion-webui-.*)$') ||
          // optcp-tools — apache (hrconvert2), librespeed. searxng is hardened.
          object.kind == 'Pod' && object.metadata.namespace == 'optcp-tools' &&
            name.matches('^(hrconvert2-.*|librespeed-speedtest-.*)$') ||
          // optcp-secrets — Vault operator and the OpenBao pods.
          object.kind == 'Pod' && object.metadata.namespace == 'optcp-secrets' &&
            name.matches('^(bank-vaults-operator-.*|openbao-.*)$') ||
          // optcp-infrastructure-management — unifi-network-application LSIO and its MongoDB, semaphore.
          object.kind == 'Pod' && object.metadata.namespace == 'optcp-infrastructure-management' &&
            name.matches('^(semaphore-.*|unifi-network-application-.*)$') ||
          // optcp-ipam — netbox-server LSIO.
          object.kind == 'Pod' && object.metadata.namespace == 'optcp-ipam' &&
            name.matches('^netbox-server-.*$') ||
          // optcp-remote-access — netbird-dashboard supervisord.
          object.kind == 'Pod' && object.metadata.namespace == 'optcp-remote-access' &&
            name.matches('^netbird-dashboard-.*$') ||
          // optcp-identity — zitadel's configuration Job and Redis.
          object.kind == 'Pod' && object.metadata.namespace == 'optcp-identity' &&
            name.matches('^zitadel-.*$') ||
          // optcp-keyring — twofauth's entrypoint symlinks its database into the baked app tree.
          object.kind == 'Pod' && object.metadata.namespace == 'optcp-keyring' &&
            name.matches('^twofauth-.*$') ||
          // optcp-vpn — netbird-router (WireGuard subnet router needs a writable rootfs for the agent).
          object.kind == 'Pod' && object.metadata.namespace == 'optcp-vpn' &&
            name.matches('^netbird-router-.*$')
        )
