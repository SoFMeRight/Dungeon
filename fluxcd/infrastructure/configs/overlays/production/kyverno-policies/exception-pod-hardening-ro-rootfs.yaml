apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: enforce-pod-hardening-ro-rootfs
  namespace: mr-resetti
  annotations:
    policies.kyverno.io/description: >-
      Workloads exempt from enforce-pod-hardening's require-readonly-root-fs rule. The vast
      majority genuinely cannot run a read-only rootfs: databases (write data/conf/PID),
      LSIO/s6 (write /run + /config), gitlab/harbor Helm charts, apache-root apps (write app
      dir), GPU workloads (writable /tmp/CUDA), ai-dock, gluetun cohort, and root-vendor images.
      The ~10 genuinely RO-root-clean workloads (stateless exporters, VictoriaMetrics, appflowy
      rust services, uptime-kuma, searxng) are hardened instead of listed here.
spec:
  exceptions:
    - policyName: enforce-pod-hardening
      ruleNames:
        - require-readonly-root-fs
  match:
    any:
      - resources:
          kinds: [Pod]
          namespaces: [compass]
          names: ["adguard-*", "adguardhome-sync-*", "chrony-*", "netbootxyz-*"]
      - resources:
          kinds: [Pod]
          namespaces: [gossip-stone]
          names: ["grafana-*", "nutify-*", "speedtest-tracker-*"]
      - resources:
          kinds: [Pod]
          namespaces: [hookshot]
          names: ["tactical-*"]
      # hyrule-castle — bagisto/invoiceninja apache+root,
      # frappe-suite (writes /home/frappe + sites).
      - resources:
          kinds: [Pod]
          namespaces: [hyrule-castle]
          names:
            - "bagisto-demo-*"
            - "frappe-suite-*"
            - "invoiceninja-app-*"
      # optcp-supply-chain — apt-cacher apache+root, gitlab and harbor Helm charts.
      - resources:
          kinds: [Pod]
          namespaces: [optcp-supply-chain]
          names: ["apt-cacher-ng-*", "gitlab-*", "harbor-*"]
      # optcp-ci-runners — renovate (containerbase installs toolchains at runtime).
      - resources:
          kinds: [Pod]
          namespaces: [optcp-ci-runners]
          names: ["renovate-*"]
      # prplanit-support — osticket apache+root.
      - resources:
          kinds: [Pod]
          namespaces: [prplanit-support]
          names: ["osticket-*"]
      - resources:
          kinds: [Pod]
          namespaces: [outspokekin-social]
          names: ["linkstack-*"]
      - resources:
          kinds: [Pod]
          namespaces: [lens-of-truth]
          names: ["crowdsec-*", "frigate-*", "home-assistant-*", "wazuh-*"]
      - resources:
          kinds: [Pod]
          namespaces: [lost-woods]
          names: ["ferdium-*", "homarr-*", "organizr-*"]
      - resources:
          kinds: [Pod]
          namespaces: [pedestal-of-time]
          names: ["lubelogger-*", "monica-*", "paperless-webserver-*", "photoprism-x-*", "plex-ms-x-*"]
      - resources:
          kinds: [Pod]
          namespaces: [optcp-media]
          names: ["calibre-web-*", "plex-*", "romm-*"]
      - resources:
          kinds: [Pod]
          namespaces: [optcp-shooting-gallery]
          names: ["ark-sa-*", "ark-se-*"]
      # swift-sail — gluetun cohort + LSIO *arr + root-vendor.
      - resources:
          kinds: [Pod]
          namespaces: [swift-sail]
          names:
            - "anirra-*"
            - "bazarr-*"
            - "byparr-*"
            - "downloadarrs-*"
            - "jellyseerr-*"
            - "neko-*"
            - "overseerr-*"
            - "pinchflat-*"
            - "prowlarr-*"
            - "pyload-ng-*"
            - "sabnzbd-*"
            - "thelounge-*"
      # temple-of-time — calibre-web LSIO,
      # immich, photoprism/plex vendor, DBs.
      - resources:
          kinds: [Pod]
          namespaces: [temple-of-time]
          names:
            - "calibre-web-*"
            - "immich-*"
            - "open-webui-*"
            - "photoprism-*"
            - "plex-*"
      # optcp-staff-suite — kimai apache + sidecars.
      - resources:
          kinds: [Pod]
          namespaces: [optcp-staff-suite]
          names: ["kimai-*"]
      # optcp-delivery-bag — opstree redis/sentinel render their config at start; elasticsearch
      # writes its keystore under the install dir.
      - resources:
          kinds: [Pod]
          namespaces: [optcp-delivery-bag]
          names: ["stalwart-redis-*", "stalwart-sentinel-*", "stalwart-elasticsearch-*"]
      # optcp-cloud — appflowy web/admin (NOT cloud/ai, which are hardened), bookstack LSIO, linkwarden root, nextcloud apache + sidecars, penpot-frontend, shlink-db LSIO
      - resources:
          kinds: [Pod]
          namespaces: [optcp-cloud]
          names: ["appflowy-admin-frontend-*", "appflowy-web-*", "bookstack-*", "linkwarden-*", "nextcloud-*", "penpot-frontend-*", "shlink-db-*"]
      # tingle-tuner — GPU (faster-whisper/libretranslate/stable-diffusion write /tmp), apache
      # (hrconvert2). searxng is hardened.
      - resources:
          kinds: [Pod]
          namespaces: [tingle-tuner]
          names: ["faster-whisper-*", "hrconvert2-*", "librespeed-speedtest-*", "libretranslate-*", "stable-diffusion-webui-*"]
      # optcp-secrets — Vault operator and the OpenBao pods.
      - resources:
          kinds: [Pod]
          namespaces: [optcp-secrets]
          names:
            - "bank-vaults-operator-*"
            - "openbao-*"
      # optcp-infrastructure-management — unifi-network-application LSIO and its MongoDB, semaphore.
      - resources:
          kinds: [Pod]
          namespaces: [optcp-infrastructure-management]
          names:
            - "semaphore-*"
            - "unifi-network-application-*"
      # optcp-ipam — netbox-server LSIO.
      - resources:
          kinds: [Pod]
          namespaces: [optcp-ipam]
          names: ["netbox-server-*"]
      # optcp-remote-access — netbird-dashboard supervisord.
      - resources:
          kinds: [Pod]
          namespaces: [optcp-remote-access]
          names:
            - "netbird-dashboard-*"
      # optcp-identity — zitadel's configuration Job and Redis.
      - resources:
          kinds: [Pod]
          namespaces: [optcp-identity]
          names: ["zitadel-*"]
      # optcp-keyring — twofauth's entrypoint symlinks its database into the baked app tree.
      - resources:
          kinds: [Pod]
          namespaces: [optcp-keyring]
          names: ["twofauth-*"]
      # optcp-vpn — netbird-router (WireGuard subnet router needs a writable rootfs for the agent).
      - resources:
          kinds: [Pod]
          namespaces: [optcp-vpn]
          names:
            - "netbird-router-*"
