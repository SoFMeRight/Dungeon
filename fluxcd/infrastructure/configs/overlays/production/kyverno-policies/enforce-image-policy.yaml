apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: enforce-image-policy
spec:
  validationFailureAction: Audit
  background: true
  rules:
    # ------------------------------------------------------------
    # Rule 1: require-image-tag
    # - Deny :latest
    # - Deny implicit latest (no ":" and no "@sha256:")
    # - Allow digests (image@sha256:...)
    # ------------------------------------------------------------
    - name: require-image-tag
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces:
                - optcp-ingress-internal
                - kai-ingress-private
                - optcp-monitoring-agents
                - optcp-network-services
                - optcp-restricted
                - delivery-bag
                - optcp-address-sync
                - optcp-app-directory
                - optcp-fairy-bottle
                - gorons-bracelet
                - optcp-operators-baseline
                - gossip-stone
                - hookshot
                - optcp-remote-access
                - hyrule-castle
                - king-of-red-lions
                - optcp-web
                - optcp-web-analytics
                - outspokekin-social
                - outspokekin-web
                - prplanit-web
                - yesimvegan-web
                - lens-of-truth
                - kai-personal
                - kai-private
                - optcp-ci-runners
                - optcp-cloud
                - optcp-delivery-bag
                - optcp-identity
                - optcp-keyring
                - optcp-sibyl-system
                - optcp-staff-suite
                - optcp-supply-chain
                - pedestal-of-time
                - prplanit-support
                - optcp-management-dashboards
                - optcp-media
                - optcp-secrets
                - optcp-infrastructure-management
                - optcp-ipam
                - optcp-shooting-gallery
                - swift-sail
                - temple-of-time
                - tingle-tuner
                - optcp-tools
                - optcp-edge-defenses
                - wallmaster
      validate:
        message: >-
          Images must be pinned to a non-latest tag or an immutable digest.
          ':latest' and implicit latest (no tag) are not allowed.
        foreach:
          - list: "request.object.spec.containers"
            deny:
              conditions:
                any:
                  - key: "{{ regex_match('.*:latest$', element.image) }}"
                    operator: Equals
                    value: true
                  - key: "{{ contains(element.image, ':') || contains(element.image, '@sha256:') }}"
                    operator: Equals
                    value: false
          - list: "request.object.spec.initContainers"
            deny:
              conditions:
                any:
                  - key: "{{ regex_match('.*:latest$', element.image) }}"
                    operator: Equals
                    value: true
                  - key: "{{ contains(element.image, ':') || contains(element.image, '@sha256:') }}"
                    operator: Equals
                    value: false
          - list: "request.object.spec.ephemeralContainers"
            deny:
              conditions:
                any:
                  - key: "{{ regex_match('.*:latest$', element.image) }}"
                    operator: Equals
                    value: true
                  - key: "{{ contains(element.image, ':') || contains(element.image, '@sha256:') }}"
                    operator: Equals
                    value: false
    # ------------------------------------------------------------
    # Rule 1b: require-image-tag-controllers
    # - Same as Rule 1 but for controller pod templates
    # ------------------------------------------------------------
    - name: require-image-tag-controllers
      match:
        any:
          - resources:
              kinds: ["Deployment", "StatefulSet", "DaemonSet", "Job", "CronJob"]
              namespaces:
                - optcp-ingress-internal
                - kai-ingress-private
                - optcp-monitoring-agents
                - optcp-network-services
                - optcp-restricted
                - delivery-bag
                - optcp-address-sync
                - optcp-app-directory
                - optcp-fairy-bottle
                - gorons-bracelet
                - optcp-operators-baseline
                - gossip-stone
                - hookshot
                - optcp-remote-access
                - hyrule-castle
                - king-of-red-lions
                - optcp-web
                - optcp-web-analytics
                - outspokekin-social
                - outspokekin-web
                - prplanit-web
                - yesimvegan-web
                - lens-of-truth
                - kai-personal
                - kai-private
                - optcp-ci-runners
                - optcp-cloud
                - optcp-delivery-bag
                - optcp-identity
                - optcp-keyring
                - optcp-sibyl-system
                - optcp-staff-suite
                - optcp-supply-chain
                - pedestal-of-time
                - prplanit-support
                - optcp-management-dashboards
                - optcp-media
                - optcp-secrets
                - optcp-infrastructure-management
                - optcp-ipam
                - optcp-shooting-gallery
                - swift-sail
                - temple-of-time
                - tingle-tuner
                - optcp-tools
                - optcp-edge-defenses
                - wallmaster
      validate:
        message: >-
          Images must be pinned to a non-latest tag or an immutable digest.
          ':latest' and implicit latest (no tag) are not allowed.
        foreach:
          - list: "request.object.spec.template.spec.containers"
            deny:
              conditions:
                any:
                  - key: "{{ regex_match('.*:latest$', element.image) }}"
                    operator: Equals
                    value: true
                  - key: "{{ contains(element.image, ':') || contains(element.image, '@sha256:') }}"
                    operator: Equals
                    value: false
          - list: "request.object.spec.template.spec.initContainers"
            deny:
              conditions:
                any:
                  - key: "{{ regex_match('.*:latest$', element.image) }}"
                    operator: Equals
                    value: true
                  - key: "{{ contains(element.image, ':') || contains(element.image, '@sha256:') }}"
                    operator: Equals
                    value: false
    # ------------------------------------------------------------
    # Rule 2: restrict-image-registries
    # - Allow explicit allowlisted registries
    # - Also allow images without registry prefix (implicit docker hub)
    # Trusted registries:
    #   docker.io         - Docker Hub (public images; CRI-O mirrors via Harbor)
    #   ghcr.io           - GitHub Container Registry
    #   quay.io           - Red Hat Quay
    #   lscr.io           - LinuxServer.io
    #   nvcr.io           - NVIDIA NGC (GPU operator, device plugin, DCGM)
    #   reg.kyverno.io    - Kyverno policy engine images
    #   registry.k8s.io   - Official Kubernetes images
    #   registry.gitlab.com - GitLab container images (self-hosted GitLab)
    #   cr.optcp.com      - Harbor (custom-built images, proxy caches)
    #   releases-docker.jfrog.io - JFrog Artifactory upstream releases
    #   docker-registry3.mariadb.com - MariaDB operator sidecar images
    # Regex: single-line, repeated per deny block (Kyverno has no variable reuse across rules)
    # ------------------------------------------------------------
    - name: restrict-image-registries
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces:
                - optcp-ingress-internal
                - kai-ingress-private
                - optcp-monitoring-agents
                - optcp-network-services
                - optcp-restricted
                - delivery-bag
                - optcp-address-sync
                - optcp-app-directory
                - optcp-fairy-bottle
                - gorons-bracelet
                - optcp-operators-baseline
                - gossip-stone
                - hookshot
                - optcp-remote-access
                - hyrule-castle
                - king-of-red-lions
                - optcp-web
                - optcp-web-analytics
                - outspokekin-social
                - outspokekin-web
                - prplanit-web
                - yesimvegan-web
                - lens-of-truth
                - kai-personal
                - kai-private
                - optcp-ci-runners
                - optcp-cloud
                - optcp-delivery-bag
                - optcp-identity
                - optcp-keyring
                - optcp-sibyl-system
                - optcp-staff-suite
                - optcp-supply-chain
                - pedestal-of-time
                - prplanit-support
                - optcp-management-dashboards
                - optcp-media
                - optcp-secrets
                - optcp-infrastructure-management
                - optcp-ipam
                - optcp-shooting-gallery
                - swift-sail
                - temple-of-time
                - tingle-tuner
                - optcp-tools
                - optcp-edge-defenses
                - wallmaster
      validate:
        message: >-
          Image registry is not allowlisted. Use an approved registry,
          or docker hub images with no registry prefix.
        foreach:
          - list: "request.object.spec.containers"
            deny:
              conditions:
                all:
                  # yamllint disable-line rule:line-length
                  - key: "{{ regex_match('^((docker|ghcr|quay|lscr|nvcr)\\.io|reg\\.kyverno\\.io|registry\\.(k8s\\.io|gitlab\\.com|istio\\.io)|([a-z0-9-]+\\.)*cr\\.optcp\\.com|releases-docker\\.jfrog\\.io|docker-registry3\\.mariadb\\.com)/', element.image) }}"
                    operator: Equals
                    value: false
                  - key: "{{ regex_match('^[^/]+(:|@sha256:)', element.image) }}"
                    operator: Equals
                    value: false
          - list: "request.object.spec.initContainers"
            deny:
              conditions:
                all:
                  # yamllint disable-line rule:line-length
                  - key: "{{ regex_match('^((docker|ghcr|quay|lscr|nvcr)\\.io|reg\\.kyverno\\.io|registry\\.(k8s\\.io|gitlab\\.com|istio\\.io)|([a-z0-9-]+\\.)*cr\\.optcp\\.com|releases-docker\\.jfrog\\.io|docker-registry3\\.mariadb\\.com)/', element.image) }}"
                    operator: Equals
                    value: false
                  - key: "{{ regex_match('^[^/]+(:|@sha256:)', element.image) }}"
                    operator: Equals
                    value: false
          - list: "request.object.spec.ephemeralContainers"
            deny:
              conditions:
                all:
                  # yamllint disable-line rule:line-length
                  - key: "{{ regex_match('^((docker|ghcr|quay|lscr|nvcr)\\.io|reg\\.kyverno\\.io|registry\\.(k8s\\.io|gitlab\\.com|istio\\.io)|([a-z0-9-]+\\.)*cr\\.optcp\\.com|releases-docker\\.jfrog\\.io|docker-registry3\\.mariadb\\.com)/', element.image) }}"
                    operator: Equals
                    value: false
                  - key: "{{ regex_match('^[^/]+(:|@sha256:)', element.image) }}"
                    operator: Equals
                    value: false
    # ------------------------------------------------------------
    # Rule 2b: restrict-image-registries-controllers
    # - Same as Rule 2 but for controller pod templates
    # ------------------------------------------------------------
    - name: restrict-image-registries-controllers
      match:
        any:
          - resources:
              kinds: ["Deployment", "StatefulSet", "DaemonSet", "Job", "CronJob"]
              namespaces:
                - optcp-ingress-internal
                - kai-ingress-private
                - optcp-monitoring-agents
                - optcp-network-services
                - optcp-restricted
                - delivery-bag
                - optcp-address-sync
                - optcp-app-directory
                - optcp-fairy-bottle
                - gorons-bracelet
                - optcp-operators-baseline
                - gossip-stone
                - hookshot
                - optcp-remote-access
                - hyrule-castle
                - king-of-red-lions
                - optcp-web
                - optcp-web-analytics
                - outspokekin-social
                - outspokekin-web
                - prplanit-web
                - yesimvegan-web
                - lens-of-truth
                - kai-personal
                - kai-private
                - optcp-ci-runners
                - optcp-cloud
                - optcp-delivery-bag
                - optcp-identity
                - optcp-keyring
                - optcp-sibyl-system
                - optcp-staff-suite
                - optcp-supply-chain
                - pedestal-of-time
                - prplanit-support
                - optcp-management-dashboards
                - optcp-media
                - optcp-secrets
                - optcp-infrastructure-management
                - optcp-ipam
                - optcp-shooting-gallery
                - swift-sail
                - temple-of-time
                - tingle-tuner
                - optcp-tools
                - optcp-edge-defenses
                - wallmaster
      validate:
        message: >-
          Image registry is not allowlisted. Use an approved registry,
          or docker hub images with no registry prefix.
        foreach:
          - list: "request.object.spec.template.spec.containers"
            deny:
              conditions:
                all:
                  # yamllint disable-line rule:line-length
                  - key: "{{ regex_match('^((docker|ghcr|quay|lscr|nvcr)\\.io|reg\\.kyverno\\.io|registry\\.(k8s\\.io|gitlab\\.com|istio\\.io)|([a-z0-9-]+\\.)*cr\\.optcp\\.com|releases-docker\\.jfrog\\.io|docker-registry3\\.mariadb\\.com)/', element.image) }}"
                    operator: Equals
                    value: false
                  - key: "{{ regex_match('^[^/]+(:|@sha256:)', element.image) }}"
                    operator: Equals
                    value: false
          - list: "request.object.spec.template.spec.initContainers"
            deny:
              conditions:
                all:
                  # yamllint disable-line rule:line-length
                  - key: "{{ regex_match('^((docker|ghcr|quay|lscr|nvcr)\\.io|reg\\.kyverno\\.io|registry\\.(k8s\\.io|gitlab\\.com|istio\\.io)|([a-z0-9-]+\\.)*cr\\.optcp\\.com|releases-docker\\.jfrog\\.io|docker-registry3\\.mariadb\\.com)/', element.image) }}"
                    operator: Equals
                    value: false
                  - key: "{{ regex_match('^[^/]+(:|@sha256:)', element.image) }}"
                    operator: Equals
                    value: false
