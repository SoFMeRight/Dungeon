apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: restrict-default-sa-galera-jobs
  namespace: optcp-policy-engine
  annotations:
    policies.kyverno.io/description: >-
      mariadb-operator builds its Galera init and recovery Jobs without the MariaDB's
      ServiceAccount (withServiceAccount(false) in pkg/builder), so they always run as
      default. Remove once the operator honours spec.serviceAccountName for them.
spec:
  policyRefs:
    - name: restrict-default-sa
      kind: ValidatingPolicy
  matchConditions:
    - name: exempt-workloads
      expression: |-
        [object.metadata.?name.orValue('') != '' ? object.metadata.name : object.metadata.?generateName.orValue('')].exists(name,
          object.kind == 'Job' && object.metadata.namespace == 'prplanit-support' &&
            name.matches('^(osticket-mariadb-init|osticket-mariadb-.*-recovery)$') ||
          object.kind == 'Pod' && object.metadata.namespace == 'prplanit-support' &&
            name.matches('^(osticket-mariadb-init-.*|osticket-mariadb-.*-recovery-.*)$') ||
          object.kind == 'Job' && object.metadata.namespace == 'optcp-staff-suite' &&
            name.matches('^(kimai-mariadb-init|kimai-mariadb-.*-recovery)$') ||
          object.kind == 'Pod' && object.metadata.namespace == 'optcp-staff-suite' &&
            name.matches('^(kimai-mariadb-init-.*|kimai-mariadb-.*-recovery-.*)$')
        )
