apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: mutate-pod-hardening
  annotations:
    policies.kyverno.io/title: Mutate Pod Hardening (seccomp)
    policies.kyverno.io/description: >-
      Phase 2b of the workload-hardening rollout (see docs/container-security-audit.md and the
      audit-pod-hardening report). Injects pod-level seccompProfile RuntimeDefault on pods in
      istio ambient (app) namespaces — the ONE dimension safe to apply fleet-wide. Uses a +()
      anchor so it only ADDS when absent, never overrides. ADMISSION-TIME ONLY (no
      mutateExisting): existing pods are untouched until they next roll, so the change lands
      gradually and observably, never a fleet-wide restart. The other four dimensions
      (non-root, no-privilege-escalation, drop-caps, read-only rootfs) are carried explicitly
      per app in the overlays (Phase 3) — every decision visible and diff-reviewable in git,
      rather than inferred from a runtime expression. Escape hatch: label a namespace
      policy.prplanit.com/mutate-hardening=suspended.
spec:
  background: true
  rules:
    - name: add-seccomp-runtime-default
      match:
        any:
          - resources:
              kinds: [Pod]
              # CREATE-only: hardening is admission-time (see description). On UPDATE the
              # securityContext fields are immutable anyway, and the mutation would re-inject
              # them onto controller-issued pod updates (finalizer removal, status) → the API
              # rejects the update → finalizers/GC wedge. Scope out UPDATE.
              operations: [CREATE]
              namespaceSelector:
                matchLabels:
                  istio.io/dataplane-mode: ambient
      exclude:
        any:
          - resources:
              selector:
                matchLabels:
                  app.kubernetes.io/name: kyverno
          - resources:
              namespaceSelector:
                matchLabels:
                  policy.prplanit.com/mutate-hardening: "suspended"
      mutate:
        patchStrategicMerge:
          spec:
            securityContext:
              +(seccompProfile):
                type: RuntimeDefault
