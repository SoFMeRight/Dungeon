apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: mutate-pod-hardening
  annotations:
    policies.kyverno.io/title: Mutate Pod Hardening (seccomp + no-privesc)
    policies.kyverno.io/description: >-
      Phase 2b of the workload-hardening rollout (see docs/container-security-audit.md and the
      audit-pod-hardening report). Injects the two lowest-risk securityContext defaults on pods
      in istio ambient (app) namespaces: pod-level seccompProfile RuntimeDefault, and
      allowPrivilegeEscalation:false on every container. Uses +() anchors so it only ADDS when
      absent — never overrides an app's explicit value. ADMISSION-TIME ONLY (no mutateExisting):
      existing pods are untouched until they next roll, so the change lands gradually and
      observably, never a fleet-wide restart. Per-app escape hatch: set the container/pod field
      explicitly, or label the namespace policy.prplanit.com/mutate-hardening=suspended.
spec:
  background: true
  rules:
    # seccomp RuntimeDefault — near-zero risk (applies the default syscall filter). Pod-level
    # so it covers all containers; a container may still override to its own profile.
    - name: add-seccomp-runtime-default
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaceSelector:
                matchLabels:
                  istio.io/dataplane-mode: ambient
      exclude: &excludeCommon
        any:
          - resources:
              selector:
                matchLabels:
                  app.kubernetes.io/name: kyverno
          - resources:
              namespaceSelector:
                matchLabels:
                  policy.prplanit.com/mutate-hardening: "suspended"
      mutate:
        patchStrategicMerge:
          spec:
            securityContext:
              +(seccompProfile):
                type: RuntimeDefault
    # allowPrivilegeEscalation:false on every container — mostly safe, but can break apps that
    # rely on setuid privilege GAIN (rare). Canary-roll before trusting broadly; suspend per
    # namespace or add an explicit true on the offending container to opt out.
    - name: add-no-privilege-escalation
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaceSelector:
                matchLabels:
                  istio.io/dataplane-mode: ambient
      exclude: *excludeCommon
      mutate:
        patchStrategicMerge:
          spec:
            containers:
              - (name): "?*"
                securityContext:
                  +(allowPrivilegeEscalation): false
