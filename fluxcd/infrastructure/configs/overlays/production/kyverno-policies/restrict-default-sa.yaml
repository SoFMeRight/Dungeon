apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-default-sa
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: restrict-default-sa-pods
      match:
        any:
          - resources:
              kinds: [Pod]
              # Gate creation/update only. Without this, the rule also matches
              # DELETE and traps every existing default-SA pod — it can never be
              # deleted/replaced with a compliant one (e.g. a StatefulSet rolling
              # in a fixed serviceAccountName deadlocks). Enforcement is unchanged:
              # default-SA pods still cannot be created.
              operations: [CREATE, UPDATE]
              namespaces:
                - arylls-lookout
                - compass
                - delivery-bag
                - fairy-bottle
                - gorons-bracelet
                - gossip-stone
                - hookshot
                - hyrule-castle
                - kokiri-forest
                - lens-of-truth
                - lost-woods
                - pedestal-of-time
                - shooting-gallery
                - swift-sail
                - temple-of-time
                - tingle-tuner
                - wallmaster
                - zeldas-lullaby
      exclude:
        any:
          - resources:
              selector:
                matchLabels:
                  app.kubernetes.io/name: kyverno
          - resources:
              namespaceSelector:
                matchLabels:
                  policy.prplanit.com/restrict-default-sa: "suspended"
      validate:
        message: "Pods must specify a non-default serviceAccountName in ambient mesh namespaces."
        deny:
          conditions:
            any:
              - key: "{{ request.object.spec.serviceAccountName || '' }}"
                operator: Equals
                value: ""
              - key: "{{ request.object.spec.serviceAccountName || '' }}"
                operator: Equals
                value: "default"
    - name: restrict-default-sa-controllers
      match:
        any:
          - resources:
              kinds: [Deployment, StatefulSet, DaemonSet, Job, CronJob]
              operations: [CREATE, UPDATE]
              namespaces:
                - arylls-lookout
                - compass
                - delivery-bag
                - fairy-bottle
                - gorons-bracelet
                - gossip-stone
                - hookshot
                - hyrule-castle
                - kokiri-forest
                - lens-of-truth
                - lost-woods
                - pedestal-of-time
                - shooting-gallery
                - swift-sail
                - temple-of-time
                - tingle-tuner
                - wallmaster
                - zeldas-lullaby
      exclude:
        any:
          - resources:
              selector:
                matchLabels:
                  app.kubernetes.io/name: kyverno
          - resources:
              namespaceSelector:
                matchLabels:
                  policy.prplanit.com/restrict-default-sa: "suspended"
      validate:
        message: "Controllers must specify a non-default serviceAccountName in ambient mesh namespaces."
        deny:
          conditions:
            any:
              - key: "{{ request.object.spec.template.spec.serviceAccountName || '' }}"
                operator: Equals
                value: ""
              - key: "{{ request.object.spec.template.spec.serviceAccountName || '' }}"
                operator: Equals
                value: "default"
