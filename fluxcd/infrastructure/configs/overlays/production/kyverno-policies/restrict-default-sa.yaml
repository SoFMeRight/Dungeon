apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-default-sa
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: restrict-default-sa-pods
      match:
        any:
          - resources:
              kinds: [Pod]
              # Gate creation/update only. Without this, the rule also matches
              # DELETE and traps every existing default-SA pod — it can never be
              # deleted/replaced with a compliant one (e.g. a StatefulSet rolling
              # in a fixed serviceAccountName deadlocks). Enforcement is unchanged:
              # default-SA pods still cannot be created.
              operations: [CREATE, UPDATE]
              namespaces:
                - optcp-ingress-internal
                - kai-ingress-private
                - optcp-monitoring-agents
                - optcp-network-services
                - optcp-restricted
                - delivery-bag
                - optcp-address-sync
                - optcp-app-directory
                - optcp-fairy-bottle
                - gorons-bracelet
                - optcp-operators-baseline
                - gossip-stone
                - hookshot
                - optcp-remote-access
                - hyrule-castle
                - optcp-web
                - optcp-web-analytics
                - outspokekin-social
                - outspokekin-web
                - prplanit-web
                - yesimvegan-web
                - lens-of-truth
                - kai-personal
                - kai-private
                - optcp-ci-runners
                - optcp-cloud
                - optcp-delivery-bag
                - optcp-identity
                - optcp-keyring
                - optcp-sibyl-system
                - optcp-staff-suite
                - optcp-supply-chain
                - pedestal-of-time
                - prplanit-billing
                - prplanit-commerce
                - prplanit-staff-suite
                - prplanit-support
                - optcp-management-dashboards
                - optcp-media
                - optcp-secrets
                - optcp-infrastructure-management
                - optcp-ipam
                - optcp-shooting-gallery
                - swift-sail
                - temple-of-time
                - tingle-tuner
                - optcp-tools
                - optcp-edge-defenses
                - wallmaster
      exclude:
        any:
          - resources:
              selector:
                matchLabels:
                  app.kubernetes.io/name: kyverno
          - resources:
              namespaceSelector:
                matchLabels:
                  policy.prplanit.com/restrict-default-sa: "suspended"
      validate:
        message: "Pods must specify a non-default serviceAccountName in ambient mesh namespaces."
        deny:
          conditions:
            any:
              - key: "{{ request.object.spec.serviceAccountName || '' }}"
                operator: Equals
                value: ""
              - key: "{{ request.object.spec.serviceAccountName || '' }}"
                operator: Equals
                value: "default"
    - name: restrict-default-sa-controllers
      match:
        any:
          - resources:
              kinds: [Deployment, StatefulSet, DaemonSet, Job, CronJob]
              operations: [CREATE, UPDATE]
              namespaces:
                - optcp-ingress-internal
                - kai-ingress-private
                - optcp-monitoring-agents
                - optcp-network-services
                - optcp-restricted
                - delivery-bag
                - optcp-address-sync
                - optcp-app-directory
                - optcp-fairy-bottle
                - gorons-bracelet
                - optcp-operators-baseline
                - gossip-stone
                - hookshot
                - optcp-remote-access
                - hyrule-castle
                - optcp-web
                - optcp-web-analytics
                - outspokekin-social
                - outspokekin-web
                - prplanit-web
                - yesimvegan-web
                - lens-of-truth
                - kai-personal
                - kai-private
                - optcp-ci-runners
                - optcp-cloud
                - optcp-delivery-bag
                - optcp-identity
                - optcp-keyring
                - optcp-sibyl-system
                - optcp-staff-suite
                - optcp-supply-chain
                - pedestal-of-time
                - prplanit-billing
                - prplanit-commerce
                - prplanit-staff-suite
                - prplanit-support
                - optcp-management-dashboards
                - optcp-media
                - optcp-secrets
                - optcp-infrastructure-management
                - optcp-ipam
                - optcp-shooting-gallery
                - swift-sail
                - temple-of-time
                - tingle-tuner
                - optcp-tools
                - optcp-edge-defenses
                - wallmaster
      exclude:
        any:
          - resources:
              selector:
                matchLabels:
                  app.kubernetes.io/name: kyverno
          - resources:
              namespaceSelector:
                matchLabels:
                  policy.prplanit.com/restrict-default-sa: "suspended"
      validate:
        message: "Controllers must specify a non-default serviceAccountName in ambient mesh namespaces."
        deny:
          conditions:
            any:
              - key: "{{ request.object.spec.jobTemplate.spec.template.spec.serviceAccountName || request.object.spec.template.spec.serviceAccountName || '' }}"
                operator: Equals
                value: ""
              - key: "{{ request.object.spec.jobTemplate.spec.template.spec.serviceAccountName || request.object.spec.template.spec.serviceAccountName || '' }}"
                operator: Equals
                value: "default"
