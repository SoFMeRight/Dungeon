apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: mutate-redis-sentinel-sa
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [statefulsets]
  matchConditions:
    - name: sentinel
      expression: "object.metadata.?labels[?'redis_setup_type'].orValue('') == 'sentinel'"
    - name: has-app-label
      expression: "object.metadata.?labels[?'app'].orValue('') != ''"
  variables:
    - name: app
      expression: "object.metadata.labels['app']"
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{spec: Object.spec{template: Object.spec.template{spec: Object.spec.template.spec{
            serviceAccountName: variables.app.endsWith('-sentinel') ? variables.app.substring(0, size(variables.app) - 9) : variables.app}}}}
