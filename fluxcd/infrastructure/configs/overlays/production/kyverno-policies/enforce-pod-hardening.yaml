apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: enforce-pod-hardening
  annotations:
    # Pod-only (match uses operations:[CREATE]); disable controller autogen so the rule names
    # stay stable for PolicyException references.
    pod-policies.kyverno.io/autogen-controllers: none
    policies.kyverno.io/title: Enforce Pod Hardening (graduated dimensions)
    policies.kyverno.io/description: >-
      The Enforce companion to audit-pod-hardening. Dimensions graduate here ONE AT A TIME, only
      after their audit-pod-hardening PolicyReport is clean of non-exception workloads. Each rule
      is CREATE-only (securityContext is immutable on UPDATE; validating UPDATE would reject
      controller-issued pod updates — finalizer/status — and wedge GC, the same trap the mutate
      policy scopes out). Existing non-compliant pods are grandfathered and comply on next roll.
      Per-workload exceptions: label the workload policy.prplanit.com/except-<dimension>: "true"
      (e.g. except-nonroot, except-ro-rootfs) — the matching rule excludes it, kept visible in git.
      Namespace escape hatch: policy.prplanit.com/enforce-hardening=suspended.

      Graduated so far:
        - seccomp (2026-08-31): mutate-pod-hardening injects RuntimeDefault on every CREATE
          fleet-wide, so this rule is a pure backstop — it rejects only an explicit Unconfined.
        - drop-caps (2026-08-31): app namespaces only — the 6 infra namespaces (root CSI/backup/
          gateway/reflector daemonsets) are excluded by name and stay audit-only. Repo-manifest
          exceptions carry the except-drop-caps label; Helm/operator workloads that can't be
          pod-labelled are excluded by name pattern (predates PolicyExceptions being enabled).
        - no-privesc (2026-08-31): app namespaces only. Exceptions now use a PolicyException CR
          (exception-pod-hardening-no-privesc, in zeldas-lullaby) — the scalable model for the
          large phases ahead — plus the except-no-privesc label for repo-manifest self-documentation.
        - non-root (2026-08-31): app namespaces only. ~63 genuinely root-required workloads exempted
          via exception-pod-hardening-non-root (LSIO/s6/apache/gluetun/vendor/security/operator).
      Not yet graduated (still audit-only, long legitimate-exception tails): read-only-root-fs.
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: require-seccomp-runtime-default
      match:
        any:
          - resources:
              kinds: [Pod]
              operations: [CREATE]
              namespaceSelector:
                matchLabels:
                  istio.io/dataplane-mode: ambient
      exclude:
        any:
          - resources:
              selector:
                matchLabels:
                  app.kubernetes.io/name: kyverno
          - resources:
              namespaceSelector:
                matchLabels:
                  policy.prplanit.com/enforce-hardening: "suspended"
          - resources:
              selector:
                matchLabels:
                  policy.prplanit.com/except-seccomp: "true"
      validate:
        message: "SEC-7: seccompProfile must be RuntimeDefault/Localhost (pod-level or every container). mutate-pod-hardening adds it automatically — this rejects an explicit Unconfined."
        anyPattern:
          - spec:
              securityContext:
                seccompProfile:
                  type: "RuntimeDefault | Localhost"
          - spec:
              containers:
                - securityContext:
                    seccompProfile:
                      type: "RuntimeDefault | Localhost"
    - name: require-drop-all-capabilities
      match:
        any:
          - resources:
              kinds: [Pod]
              operations: [CREATE]
              namespaceSelector:
                matchLabels:
                  istio.io/dataplane-mode: ambient
      exclude:
        any:
          - resources:
              selector:
                matchLabels:
                  app.kubernetes.io/name: kyverno
          - resources:
              namespaceSelector:
                matchLabels:
                  policy.prplanit.com/enforce-hardening: "suspended"
          # App namespaces only: the infra namespaces host root CSI/backup/gateway/reflector
          # daemonsets that legitimately hold caps — they stay audit-only.
          - resources:
              namespaces:
                - gorons-bracelet
                - fairy-bottle
                - king-of-red-lions
                - gerudo-crest
                - lakitu
                - arylls-lookout
          # Repo-manifest exceptions (self-documenting label on the workload).
          - resources:
              selector:
                matchLabels:
                  policy.prplanit.com/except-drop-caps: "true"
          # Helm/operator-managed exceptions that can't carry a pod label (PolicyExceptions are
          # disabled in this Kyverno). harbor + gitlab (Helm), bank-vaults (operator), osticket/
          # kimai mariadb (mariadb-operator init+agent sidecars), neko-gateway (STUNner dataplane),
          # nextcloud-collabora (Helm subchart, keeps MKNOD/SYS_CHROOT sandbox caps).
          - resources:
              names:
                - "harbor-proxy-cache-*"
                - "harbor-redis-*"
                - "gitlab-praefect-db-init-*"
                - "bank-vaults-operator-*"
                - "openbao-*"
                - "osticket-mariadb-*"
                - "kimai-mariadb-*"
                - "neko-gateway-*"
                - "nextcloud-collabora-*"
      validate:
        message: "SEC-6: every container must drop ALL capabilities (add back only the minimum). Exempt a workload with the label policy.prplanit.com/except-drop-caps: \"true\"."
        pattern:
          spec:
            containers:
              - securityContext:
                  capabilities:
                    drop: ["ALL"]
    - name: require-no-privilege-escalation
      match:
        any:
          - resources:
              kinds: [Pod]
              operations: [CREATE]
              namespaceSelector:
                matchLabels:
                  istio.io/dataplane-mode: ambient
      exclude:
        any:
          - resources:
              selector:
                matchLabels:
                  app.kubernetes.io/name: kyverno
          - resources:
              namespaceSelector:
                matchLabels:
                  policy.prplanit.com/enforce-hardening: "suspended"
          # App namespaces only: infra namespaces (root CSI/backup/gateway/reflector) stay audit-only.
          - resources:
              namespaces:
                - gorons-bracelet
                - fairy-bottle
                - king-of-red-lions
                - gerudo-crest
                - lakitu
                - arylls-lookout
          # Repo-manifest self-documenting exceptions.
          - resources:
              selector:
                matchLabels:
                  policy.prplanit.com/except-no-privesc: "true"
      # Genuine escalators (sudo / file-cap binaries / privileged) + operator/Helm pods are
      # exempted via the PolicyException exception-pod-hardening-no-privesc (zeldas-lullaby).
      validate:
        message: "SEC-3: allowPrivilegeEscalation must be false on every container. Exempt a genuine escalator via the no-privesc PolicyException or except-no-privesc label."
        pattern:
          spec:
            containers:
              - securityContext:
                  allowPrivilegeEscalation: false
    - name: require-run-as-non-root
      match:
        any:
          - resources:
              kinds: [Pod]
              operations: [CREATE]
              namespaceSelector:
                matchLabels:
                  istio.io/dataplane-mode: ambient
      exclude:
        any:
          - resources:
              selector:
                matchLabels:
                  app.kubernetes.io/name: kyverno
          - resources:
              namespaceSelector:
                matchLabels:
                  policy.prplanit.com/enforce-hardening: "suspended"
          # App namespaces only: infra namespaces (root CSI/backup/gateway/reflector) stay audit-only.
          - resources:
              namespaces:
                - gorons-bracelet
                - fairy-bottle
                - king-of-red-lions
                - gerudo-crest
                - lakitu
                - arylls-lookout
          # Repo-manifest self-documenting exceptions.
          - resources:
              selector:
                matchLabels:
                  policy.prplanit.com/except-non-root: "true"
      # ~63 genuinely root-required workloads are exempted via the PolicyException
      # exception-pod-hardening-non-root (zeldas-lullaby).
      validate:
        message: "SEC-1/2: runAsNonRoot must be true (pod-level or every container). Exempt a root-required workload via the non-root PolicyException or except-non-root label."
        anyPattern:
          - spec:
              securityContext:
                runAsNonRoot: true
          - spec:
              containers:
                - securityContext:
                    runAsNonRoot: true
