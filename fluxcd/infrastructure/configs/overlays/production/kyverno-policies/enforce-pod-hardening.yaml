apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: enforce-pod-hardening-seccomp
  annotations:
    policies.kyverno.io/title: Enforce Pod Hardening (graduated dimensions)
    policies.kyverno.io/description: >-
      The Enforce companion to audit-pod-hardening. Dimensions graduate here ONE AT A TIME, only
      after their audit-pod-hardening PolicyReport is clean of non-exception workloads. Each rule
      is CREATE-only (securityContext is immutable on UPDATE; validating UPDATE would reject
      controller-issued pod updates — finalizer/status — and wedge GC, the same trap the mutate
      policy scopes out). Existing non-compliant pods are grandfathered and comply on next roll.
      Per-workload exceptions: label the workload policy.prplanit.com/except-<dimension>: "true"
      (e.g. except-nonroot, except-ro-rootfs) — the matching rule excludes it, kept visible in git.
      Namespace escape hatch: policy.prplanit.com/enforce-hardening=suspended.

      Graduated so far:
        - seccomp (2026-08-31): mutate-pod-hardening injects RuntimeDefault on every CREATE
          fleet-wide, so this rule is a pure backstop — it rejects only an explicit Unconfined.
        - drop-caps (2026-08-31): app namespaces only — the 6 infra namespaces (root CSI/backup/
          gateway/reflector daemonsets) are excluded by name and stay audit-only. Repo-manifest
          exceptions carry the except-drop-caps label; Helm/operator workloads that can't be
          pod-labelled are excluded by name pattern (predates PolicyExceptions being enabled).
        - no-privesc (2026-08-31): app namespaces only. Exceptions now use a PolicyException CR
          (exception-pod-hardening-no-privesc, in optcp-policy-engine) — the scalable model for the
          large phases ahead — plus the except-no-privesc label for repo-manifest self-documentation.
        - non-root (2026-08-31): app namespaces only. ~63 genuinely root-required workloads exempted
          via exception-pod-hardening-non-root (LSIO/s6/apache/gluetun/vendor/security/operator).
        - read-only-root-fs (2026-08-31): app namespaces only. Mostly a ratchet — ~124 workloads
          genuinely can't run a read-only rootfs (DBs, LSIO/s6, gitlab/harbor Helm, apache-root, GPU,
          ai-dock, gluetun, root-vendor), exempted via exception-pod-hardening-ro-rootfs; the ~10
          RO-root-clean workloads (stateless exporters, VictoriaMetrics, appflowy rust, uptime-kuma,
          searxng) are hardened. All five dimensions are now enforced.
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  evaluation:
    background:
      enabled: false
  # Pods only: no rules generated for their controllers
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
    namespaceSelector:
      matchLabels:
        istio.io/dataplane-mode: ambient
      matchExpressions:
        - key: policy.prplanit.com/enforce-hardening
          operator: NotIn
          values: [suspended]
  matchConditions:
    - name: not-kyverno
      expression: "object.metadata.?labels[?'app.kubernetes.io/name'].orValue('') != 'kyverno'"
    # Repo-manifest exceptions (self-documenting label on the workload)
    - name: not-excepted-by-label
      expression: "object.metadata.?labels[?'policy.prplanit.com/except-seccomp'].orValue('') != 'true'"
  validations:
    - expression: >-
        object.spec.?securityContext.?seccompProfile.?type.orValue('') in ['RuntimeDefault', 'Localhost'] ||
          object.spec.containers.all(c, c.?securityContext.?seccompProfile.?type.orValue('') in ['RuntimeDefault', 'Localhost'])
      message: "SEC-7: seccompProfile must be RuntimeDefault/Localhost (pod-level or every container). mutate-pod-hardening adds it automatically — this rejects an explicit Unconfined."
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: enforce-pod-hardening-drop-caps
  annotations:
    policies.kyverno.io/description: >-
      The drop-caps dimension of enforce-pod-hardening; the full description is on
      enforce-pod-hardening-seccomp.
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  evaluation:
    background:
      enabled: false
  # Pods only: no rules generated for their controllers
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
    namespaceSelector:
      matchLabels:
        istio.io/dataplane-mode: ambient
      matchExpressions:
        - key: policy.prplanit.com/enforce-hardening
          operator: NotIn
          values: [suspended]
        # App namespaces only: the infra namespaces host root CSI/backup/gateway/reflector
        # workloads that legitimately need this; they stay audit-only.
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - optcp-operators-privileged
            - optcp-fairy-bottle
            - optcp-service-mesh
            - optcp-operators-baseline
            - optcp-telemetry
            - optcp-ingress-internal
            - kai-ingress-private
  matchConditions:
    - name: not-kyverno
      expression: "object.metadata.?labels[?'app.kubernetes.io/name'].orValue('') != 'kyverno'"
    # Repo-manifest exceptions (self-documenting label on the workload)
    - name: not-excepted-by-label
      expression: "object.metadata.?labels[?'policy.prplanit.com/except-drop-caps'].orValue('') != 'true'"
    # Helm/operator-managed exceptions that can't carry a pod label. harbor + gitlab (Helm),
    # bank-vaults (operator), neko-gateway (STUNner dataplane), nextcloud-collabora (Helm
    # subchart, keeps MKNOD/SYS_CHROOT sandbox caps).
    - name: not-excepted-by-name
      expression: |-
        !cel.bind(name, object.metadata.?name.orValue('') != '' ? object.metadata.name : object.metadata.?generateName.orValue(''),
          name.matches(
            '^(gitlab-praefect-db-init-.*|bank-vaults-operator-.*|openbao-.*|neko-gateway-.*|' +
            'nextcloud-collabora-.*)$'))
  validations:
    - expression: >-
        object.spec.containers.all(c, c.?securityContext.?capabilities.?drop.hasValue() &&
          c.securityContext.capabilities.drop.all(d, d == 'ALL'))
      message: "SEC-6: every container must drop ALL capabilities (add back only the minimum). Exempt a workload with the label policy.prplanit.com/except-drop-caps: \"true\"."
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: enforce-pod-hardening-no-privesc
  annotations:
    policies.kyverno.io/description: >-
      The no-privesc dimension of enforce-pod-hardening; the full description is on
      enforce-pod-hardening-seccomp.
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  evaluation:
    background:
      enabled: false
  # Pods only: no rules generated for their controllers
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
    namespaceSelector:
      matchLabels:
        istio.io/dataplane-mode: ambient
      matchExpressions:
        - key: policy.prplanit.com/enforce-hardening
          operator: NotIn
          values: [suspended]
        # App namespaces only: the infra namespaces host root CSI/backup/gateway/reflector
        # workloads that legitimately need this; they stay audit-only.
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - optcp-operators-privileged
            - optcp-fairy-bottle
            - optcp-service-mesh
            - optcp-operators-baseline
            - optcp-telemetry
            - optcp-ingress-internal
            - kai-ingress-private
  matchConditions:
    - name: not-kyverno
      expression: "object.metadata.?labels[?'app.kubernetes.io/name'].orValue('') != 'kyverno'"
    # Repo-manifest exceptions (self-documenting label on the workload)
    - name: not-excepted-by-label
      expression: "object.metadata.?labels[?'policy.prplanit.com/except-no-privesc'].orValue('') != 'true'"
  validations:
    - expression: >-
        object.spec.containers.all(c, c.?securityContext.?allowPrivilegeEscalation.orValue(true) == false)
      message: "SEC-5: allowPrivilegeEscalation must be false on every container. Exempt a genuine escalator via the no-privesc PolicyException or except-no-privesc label."
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: enforce-pod-hardening-non-root
  annotations:
    policies.kyverno.io/description: >-
      The non-root dimension of enforce-pod-hardening; the full description is on
      enforce-pod-hardening-seccomp.
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  evaluation:
    background:
      enabled: false
  # Pods only: no rules generated for their controllers
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
    namespaceSelector:
      matchLabels:
        istio.io/dataplane-mode: ambient
      matchExpressions:
        - key: policy.prplanit.com/enforce-hardening
          operator: NotIn
          values: [suspended]
        # App namespaces only: the infra namespaces host root CSI/backup/gateway/reflector
        # workloads that legitimately need this; they stay audit-only.
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - optcp-operators-privileged
            - optcp-fairy-bottle
            - optcp-service-mesh
            - optcp-operators-baseline
            - optcp-telemetry
            - optcp-ingress-internal
            - kai-ingress-private
  matchConditions:
    - name: not-kyverno
      expression: "object.metadata.?labels[?'app.kubernetes.io/name'].orValue('') != 'kyverno'"
    # Repo-manifest exceptions (self-documenting label on the workload)
    - name: not-excepted-by-label
      expression: "object.metadata.?labels[?'policy.prplanit.com/except-non-root'].orValue('') != 'true'"
  validations:
    - expression: >-
        object.spec.?securityContext.?runAsNonRoot.orValue(false) ||
          object.spec.containers.all(c, c.?securityContext.?runAsNonRoot.orValue(false))
      message: "SEC-1/2: runAsNonRoot must be true (pod-level or every container). Exempt a root-required workload via the non-root PolicyException or except-non-root label."
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
