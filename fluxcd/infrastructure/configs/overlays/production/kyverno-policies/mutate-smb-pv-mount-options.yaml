apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: mutate-smb-pv-mount-options
  annotations:
    policies.kyverno.io/title: Default SMB PV mount options
    policies.kyverno.io/category: Storage
    policies.kyverno.io/description: >-
      smb.csi.k8s.io PersistentVolumes that omit an explicit `hard` mount option get the CIFS
      default of `soft`, which turns transient network blips into EIO read/write failures
      (intermittent media read failures + library freezes). This policy injects `hard` and,
      when no dialect is pinned, `vers=3.1.1` at admission so new statically-provisioned SMB
      PVs cannot silently regress. Explicit author choices (`soft`, or a pinned `vers=`) are
      respected. See memory: smb-csi-soft-inject.
spec:
  # Best-effort defaulting: never let this convenience mutation block core
  # storage provisioning. If Kyverno is unavailable, a PV is created
  # un-mutated (the pre-policy behavior) rather than rejected.
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [persistentvolumes]
  matchConditions:
    - name: smb
      expression: "object.spec.?csi.?driver.orValue('') == 'smb.csi.k8s.io'"
    - name: has-mount-options
      expression: "size(object.spec.?mountOptions.orValue([])) > 0"
  variables:
    - name: options
      expression: "object.spec.mountOptions"
  mutations:
    # Admission-time only (mountOptions is immutable, so there is nothing to scan)
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          (!('hard' in variables.options) && !('soft' in variables.options)
            ? [JSONPatch{op: "add", path: "/spec/mountOptions/-", value: "hard"}] : []) +
          (!variables.options.exists(o, o.startsWith('vers='))
            ? [JSONPatch{op: "add", path: "/spec/mountOptions/-", value: "vers=3.1.1"}] : [])
