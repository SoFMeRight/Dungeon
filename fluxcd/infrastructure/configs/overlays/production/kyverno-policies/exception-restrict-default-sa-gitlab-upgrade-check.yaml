apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: restrict-default-sa-gitlab-upgrade-check
  namespace: optcp-policy-engine
  annotations:
    policies.kyverno.io/description: >-
      The GitLab chart's pre-upgrade upgrade-check hook Job has no serviceAccountName
      value (templates/upgrade_check_hook.yaml), so it always runs as default. It is the
      guard against skipping a required upgrade stop, so it stays enabled. Remove once
      the chart lets it take a ServiceAccount.
spec:
  policyRefs:
    - name: restrict-default-sa
      kind: ValidatingPolicy
  matchConditions:
    - name: exempt-workloads
      expression: |-
        [object.metadata.?name.orValue('') != '' ? object.metadata.name : object.metadata.?generateName.orValue('')].exists(name,
          object.kind == 'Job' && object.metadata.namespace == 'optcp-supply-chain' &&
            name.matches('^gitlab-gitlab-upgrade-check$') ||
          object.kind == 'Pod' && object.metadata.namespace == 'optcp-supply-chain' &&
            name.matches('^gitlab-gitlab-upgrade-check-.*$')
        )
