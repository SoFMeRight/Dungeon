apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: enforce-pod-hardening-non-root
  namespace: optcp-policy-engine
  annotations:
    policies.kyverno.io/description: >-
      Workloads exempt from enforce-pod-hardening's require-run-as-non-root rule. All are
      genuinely root-required (LSIO/s6 root-start, apache/php-fpm bind+chown, gluetun shared-netns,
      root-only vendor images, host-level network/security tools, operator/Helm pods). RE-EVALUATE
      tags mark node/elixir apps that MIGHT harden with more work — follow-ups, not dead ends.
spec:
  policyRefs:
    - name: enforce-pod-hardening-non-root
      kind: ValidatingPolicy
  matchConditions:
    - name: exempt-workloads
      expression: |-
        [object.metadata.?name.orValue('') != '' ? object.metadata.name : object.metadata.?generateName.orValue('')].exists(name,
          // optcp-network-services — host network/DNS/time services (bind :53/:123, need host access)
          object.kind == 'Pod' && object.metadata.namespace == 'optcp-network-services' &&
            name.matches('^(adguard-.*|adguardhome-sync-.*|chrony-.*)$') ||
          // optcp-gossip-stone — nutify (UPS, needs device) + speedtest-tracker (LSIO s6)
          object.kind == 'Pod' && object.metadata.namespace == 'optcp-gossip-stone' &&
            name.matches('^(nutify-.*|speedtest-tracker-.*)$') ||
          // bagisto (root-start chown), invoiceninja apache-root
          object.kind == 'Pod' && object.metadata.namespace == 'prplanit-billing' &&
            name.matches('^invoiceninja-app-.*$') ||
          object.kind == 'Pod' && object.metadata.namespace == 'prplanit-commerce' &&
            name.matches('^bagisto-demo-.*$') ||
          // optcp-supply-chain — apt-cacher-ng (root-start chown), LSIO netbootxyz
          object.kind == 'Pod' && object.metadata.namespace == 'optcp-supply-chain' &&
            name.matches('^(apt-cacher-ng-.*|netbootxyz-.*)$') ||
          // outspokekin-social — linkstack (apache-root, regenerates /etc/apache2 + binds :443)
          object.kind == 'Pod' && object.metadata.namespace == 'outspokekin-social' &&
            name.matches('^linkstack-.*$') ||
          // optcp-ids-ips, optcp-siem — crowdsec/wazuh (SIEM, host access), frigate (privileged), home-assistant (devices)
          object.kind == 'Pod' && object.metadata.namespace == 'optcp-ids-ips' &&
            name.matches('^crowdsec-.*$') ||
          object.kind == 'Pod' && object.metadata.namespace == 'optcp-siem' &&
            name.matches('^wazuh-manager-.*$') ||
          object.kind == 'Pod' && object.metadata.namespace == 'arbitorium-home' &&
            name.matches('^home-assistant-.*$') ||
          object.kind == 'Pod' && object.metadata.namespace == 'arbitorium-nvr' &&
            name.matches('^frigate-.*$') ||
          // kai-personal — ferdium LSIO s6
          object.kind == 'Pod' && object.metadata.namespace == 'kai-personal' &&
            name.matches('^ferdium-.*$') ||
          // optcp-app-directory — homarr (RE-EVALUATE: node app, possibly hardenable), organizr LSIO s6
          object.kind == 'Pod' && object.metadata.namespace == 'optcp-app-directory' &&
            name.matches('^(homarr-.*|organizr-.*)$') ||
          // arbitorium-restricted — lubelogger (DataProtection keys), monica (php-fpm root), paperless (root init)
          object.kind == 'Pod' && object.metadata.namespace == 'arbitorium-restricted' &&
            name.matches('^(lubelogger-.*|monica-.*|paperless-webserver-.*)$') ||
          // optcp-restricted — plex-ms-x (s6 root-start)
          object.kind == 'Pod' && object.metadata.namespace == 'optcp-restricted' &&
            name.matches('^plex-ms-x-.*$') ||
          // optcp-media — calibre-web LSIO, plex s6, romm(+db) root vendor
          object.kind == 'Pod' && object.metadata.namespace == 'optcp-media' &&
            name.matches('^(calibre-web-.*|plex-.*|romm-.*)$') ||
          // optcp-shooting-gallery — ark-se (root/sudo game)
          object.kind == 'Pod' && object.metadata.namespace == 'optcp-shooting-gallery' &&
            name.matches('^ark-se-tmc-.*$') ||
          // optcp-swift-sail-privileged — gluetun cohort (shared netns, can't pod-level non-root) + LSIO *arr + root-vendor.
          // downloadarrs is a dead end, not a follow-up: gluetun holds NET_ADMIN over the shared
          // netns and the five LSIO *arr containers start as root so s6 can drop to PUID/PGID.
          // Its sidecars that COULD harden already have — qsticky and cross-seed run non-root.
          // RE-EVALUATE: byparr/pinchflat/jellyseerr/overseerr (node/elixir) may harden with work.
          object.kind == 'Pod' && object.metadata.namespace == 'optcp-swift-sail-privileged' &&
            name.matches(
              '^(bazarr-.*|byparr-.*|downloadarrs-.*|jellyseerr-.*|neko-gateway-.*|neko-vpn-.*|overseerr-.*|pinchflat-.*|prowlarr-.*|pyload-ng-.*|sabnzbd-.*|' +
              'thelounge-.*)$') ||
          // optcp-swift-sail — anirra (root-vendor).
          object.kind == 'Pod' && object.metadata.namespace == 'optcp-swift-sail' &&
            name.matches('^anirra-.*$') ||
          // outspokekin-delivery-bag — matrix-turn (STUNner dataplane;
          // inherits root from the shared stunner-hardened Dataplane, which NetBird's :3478 requires.
          // This gateway listens on 3479 and would run unprivileged, but the Dataplane is
          // cluster-scoped and one spec serves every gateway. Otherwise fully hardened by that CR:
          // RO-rootfs, no-privesc, drop-all-caps + NET_BIND_SERVICE.)
          object.kind == 'Pod' && object.metadata.namespace == 'outspokekin-delivery-bag' &&
            name.matches('^matrix-turn-.*$') ||
          // optcp-staff-suite — kimai apache-root (+ its cronjobs/sidecars).
          object.kind == 'Pod' && object.metadata.namespace == 'optcp-staff-suite' &&
            name.matches('^kimai-.*$') ||
          // optcp-cloud — appflowy web/admin (entrypoint sed-writes root-owned /app), bookstack(+db) LSIO, linkwarden (deliberately root), nextcloud apache-root
          // (+ its cron/notify-push sidecars, collabora, clamav), shlink-db LSIO mariadb
          object.kind == 'Pod' && object.metadata.namespace == 'optcp-cloud' &&
            name.matches('^(appflowy-admin-frontend-.*|appflowy-web-.*|bookstack-.*|linkwarden-.*|nextcloud-.*|shlink-db-.*)$') ||
          // optcp-ai — faster-whisper LSIO, stable-diffusion-webui ai-dock root
          object.kind == 'Pod' && object.metadata.namespace == 'optcp-ai' &&
            name.matches('^(faster-whisper-.*|stable-diffusion-webui-.*)$') ||
          // optcp-tools — hrconvert2 apache-root
          object.kind == 'Pod' && object.metadata.namespace == 'optcp-tools' &&
            name.matches('^hrconvert2-.*$') ||
          // optcp-secrets — bank-vaults/openbao (Vault operator).
          object.kind == 'Pod' && object.metadata.namespace == 'optcp-secrets' &&
            name.matches('^(bank-vaults-operator-.*|openbao-.*)$') ||
          // optcp-infrastructure-management — unifi-network-application-app LSIO (s6-overlay).
          object.kind == 'Pod' && object.metadata.namespace == 'optcp-infrastructure-management' &&
            name.matches('^unifi-network-application-app-.*$') ||
          // optcp-ipam — netbox-server LSIO (s6-overlay).
          object.kind == 'Pod' && object.metadata.namespace == 'optcp-ipam' &&
            name.matches('^netbox-server-.*$') ||
          // optcp-remote-access — netbird-dashboard (supervisord), netbird-turn (STUNner dataplane binds
          // :3478 — root-required under CRI-O; otherwise fully hardened via its Dataplane CR: RO-rootfs,
          // no-privesc, drop-all-caps + NET_BIND_SERVICE. This is its ONLY exception — unlike neko it
          // doesn't need no-privesc.)
          object.kind == 'Pod' && object.metadata.namespace == 'optcp-remote-access' &&
            name.matches('^(netbird-dashboard-.*|netbird-turn-.*)$') ||
          // optcp-vpn — netbird-router (WireGuard subnet router: NET_ADMIN/MKNOD, runs as root).
          object.kind == 'Pod' && object.metadata.namespace == 'optcp-vpn' &&
            name.matches('^netbird-router-.*$')
        )
