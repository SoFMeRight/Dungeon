# AUDIT ONLY — reports violations in PolicyReports, blocks nothing. Do not flip to Deny here;
# enforcement graduates per-dimension via enforce-pod-hardening-* once the audit exception list
# is triaged. failurePolicy Ignore: a report-only policy must never be able to block admission
# (with Fail it sat in the fail-closed webhook gating every pod in the cluster).
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: audit-pod-hardening-seccomp
  annotations:
    policies.kyverno.io/title: Audit Pod Hardening (SEC-*)
    policies.kyverno.io/description: >-
      Report-only (Audit) baseline for the five workload-hardening dimensions tracked in
      docs/container-security-audit.md — non-root, no privilege-escalation, drop ALL caps,
      seccomp RuntimeDefault, read-only root FS. Generates PolicyReports across every istio
      ambient (app) namespace WITHOUT blocking anything, so the exception list can be built
      before graduating the tolerable dimensions to a mutate + Enforce policy. Scope follows
      the ambient label (auto-covers new app namespaces; excludes system namespaces).
spec:
  validationActions: [Audit]
  failurePolicy: Ignore
  evaluation:
    background:
      enabled: true
  # Pods only: no rules generated for their controllers
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    namespaceSelector:
      matchLabels:
        istio.io/dataplane-mode: ambient
      matchExpressions:
        - key: policy.prplanit.com/audit-hardening
          operator: NotIn
          values: [suspended]
  matchConditions:
    - name: not-kyverno
      expression: "object.metadata.?labels[?'app.kubernetes.io/name'].orValue('') != 'kyverno'"
  validations:
    - expression: >-
        object.spec.?securityContext.?seccompProfile.?type.orValue('') in ['RuntimeDefault', 'Localhost'] ||
          object.spec.containers.all(c, c.?securityContext.?seccompProfile.?type.orValue('') in ['RuntimeDefault', 'Localhost'])
      message: "SEC-7: seccompProfile RuntimeDefault/Localhost required (pod-level or every container)."
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: audit-pod-hardening-drop-caps
  annotations:
    policies.kyverno.io/description: >-
      The drop-caps dimension of audit-pod-hardening; the full description is on
      audit-pod-hardening-seccomp.
spec:
  validationActions: [Audit]
  failurePolicy: Ignore
  evaluation:
    background:
      enabled: true
  # Pods only: no rules generated for their controllers
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    namespaceSelector:
      matchLabels:
        istio.io/dataplane-mode: ambient
      matchExpressions:
        - key: policy.prplanit.com/audit-hardening
          operator: NotIn
          values: [suspended]
  matchConditions:
    - name: not-kyverno
      expression: "object.metadata.?labels[?'app.kubernetes.io/name'].orValue('') != 'kyverno'"
  validations:
    - expression: >-
        object.spec.containers.all(c, c.?securityContext.?capabilities.?drop.hasValue() &&
          c.securityContext.capabilities.drop.all(d, d == 'ALL'))
      message: "SEC-6: every container should drop ALL capabilities (add back the minimum)."
---
