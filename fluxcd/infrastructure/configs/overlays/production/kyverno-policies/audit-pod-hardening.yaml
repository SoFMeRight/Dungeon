      The no-privesc dimension of audit-pod-hardening; the full description is on
      audit-pod-hardening-seccomp.
spec:
  validationActions: [Audit]
  failurePolicy: Ignore
  evaluation:
    background:
      enabled: true
  # Pods only: no rules generated for their controllers
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    namespaceSelector:
      matchLabels:
        istio.io/dataplane-mode: ambient
      matchExpressions:
        - key: policy.prplanit.com/audit-hardening
          operator: NotIn
          values: [suspended]
  matchConditions:
    - name: not-kyverno
      expression: "object.metadata.?labels[?'app.kubernetes.io/name'].orValue('') != 'kyverno'"
