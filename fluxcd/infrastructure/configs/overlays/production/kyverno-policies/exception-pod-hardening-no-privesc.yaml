apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: enforce-pod-hardening-no-privesc
  namespace: zeldas-lullaby
  annotations:
    policies.kyverno.io/description: >-
      Workloads exempt from enforce-pod-hardening's require-no-privilege-escalation rule.
      Two classes: (1) genuine escalators that need allowPrivilegeEscalation:true, and
      (2) Helm/operator-managed pods that don't need it but can't carry a pod-level
      securityContext without chart/CR value changes — flagged TIGHTENABLE below as follow-ups.
spec:
  exceptions:
    - policyName: enforce-pod-hardening
      ruleNames:
        - require-no-privilege-escalation
  match:
    any:
      # frigate: privileged NVR (privileged implies allowPrivEsc).
      - resources:
          kinds: [Pod]
          namespaces: [lens-of-truth]
          names: ["frigate-*"]
      # ark-se: arkmanager uses sudo. stable-diffusion-webui: ai-dock init.sh sudo/sudoers.
      - resources:
          kinds: [Pod]
          namespaces: [shooting-gallery]
          names: ["ark-se-tmc-*"]
      - resources:
          kinds: [Pod]
          namespaces: [tingle-tuner]
          names: ["stable-diffusion-webui-*"]
      # neko-gateway: STUNner stunnerd TURN dataplane (file-cap class, operator-managed).
      - resources:
          kinds: [Pod]
          namespaces: [swift-sail]
          names: ["neko-gateway-*"]
      # photoprism + photoprism-x: same app/image, two instances. Both start NON-ROOT (uid 2432)
      # with added caps (CHOWN/DAC_OVERRIDE/FOWNER/SETUID/SETGID) that a non-root process needs in
      # its effective set — NoNewPrivs blocks raising them, so both genuinely require privesc:true.
      # (Contrast root-start images like apt-cacher/speedtest-tracker, which are fine at false.)
      # Matched by app label to exclude the compliant mariadb sidecars.
      - resources:
          kinds: [Pod]
          namespaces: [temple-of-time]
          selector:
            matchLabels:
              app: photoprism
      - resources:
          kinds: [Pod]
          namespaces: [pedestal-of-time]
          selector:
            matchLabels:
              app: photoprism-x
      # netbird-coturn: turnserver is a file-capability binary (NoNewPrivs strips its caps on exec).
      # bank-vaults operator + openbao (Vault) pods. TIGHTENABLE: openbao's prometheus-exporter
      # (statsd-exporter) sidecar doesn't need privesc — set via the Vault CR's containerSecurityContext.
      - resources:
          kinds: [Pod]
          namespaces: [zeldas-lullaby]
          names: ["netbird-coturn-*", "bank-vaults-operator-*", "openbao-*"]
      # osticket mariadb: mariadb-operator `agent` sidecar (TIGHTENABLE via the MariaDB CR).
      # harbor openresty + redis (Helm): neither escalates — TIGHTENABLE via harbor chart securityContext.
      - resources:
          kinds: [Pod]
          namespaces: [hyrule-castle]
          names: ["osticket-mariadb-*", "harbor-proxy-cache-*", "harbor-redis-*"]
      # kimai mariadb agent (operator, TIGHTENABLE via CR). nextcloud-collabora (Helm chroot sandbox).
      - resources:
          kinds: [Pod]
          namespaces: [temple-of-time]
          names: ["kimai-mariadb-*", "nextcloud-collabora-*"]
