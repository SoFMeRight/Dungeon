apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: mutate-vault-sidecar-hardening
  annotations:
    policies.kyverno.io/title: Mutate Vault Sidecar Hardening
    policies.kyverno.io/description: >-
      The bank-vaults operator injects sidecars (bank-vaults, prometheus-exporter) into the
      Vault raft pods and runs a vault-configurer Deployment, none with a container
      securityContext, and the Vault CRD has no field for them. This hardens the CR-managed
      pods (raft pods app.kubernetes.io/name=vault + the vault-configurator pod) that the
      per-app-overlay doctrine can't reach. Rule 1 (foreach): adds allowPrivilegeEscalation
      :false to EVERY container (merges, so the vault container keeps its CR-managed caps —
      never clobbered) and drop-ALL to the bank-vaults/prometheus-exporter containers. Rule
      2: seccomp RuntimeDefault + runAsNonRoot on the vault-configurator pod only (its
      bank-vaults container runs uid 65534). NOT applied to the raft pods: pod-level
      runAsNonRoot is impossible there (openbao image has a non-numeric user ->
      CreateContainerConfigError). readOnlyRootFilesystem is left off (runtime writes).
      failurePolicy: Ignore is required — Kyverno shares this namespace (zeldas-lullaby), so
      a Fail webhook-rebuild blip would block Vault StatefulSet pod creation. Validate with
      kubectl create --dry-run=server before rolling real pods. ADMISSION-TIME ONLY.
spec:
  background: true
  failurePolicy: Ignore
  rules:
    - name: harden-vault-cr-container-security
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [zeldas-lullaby]
              selector:
                matchLabels:
                  app.kubernetes.io/name: vault
          - resources:
              kinds: [Pod]
              namespaces: [zeldas-lullaby]
              selector:
                matchLabels:
                  app.kubernetes.io/name: vault-configurator
      mutate:
        foreach:
          # allowPrivilegeEscalation:false on EVERY container (merge — vault keeps its caps)
          - list: "request.object.spec.containers"
            patchStrategicMerge:
              spec:
                containers:
                  - (name): "{{ element.name }}"
                    securityContext:
                      allowPrivilegeEscalation: false
          # drop-ALL caps on the operator sidecar containers (raft sidecars + configurer)
          - list: "request.object.spec.containers"
            preconditions:
              all:
                - key: "{{ element.name }}"
                  operator: AnyIn
                  value: [bank-vaults, prometheus-exporter]
            patchStrategicMerge:
              spec:
                containers:
                  - (name): "{{ element.name }}"
                    securityContext:
                      capabilities:
                        drop: [ALL]
          # readOnlyRootFilesystem on all three. Each writes only to mounted volumes
          # (openbao: /vault/data + /vault/config + /openbao/config; statsd: its /tmp is a
          # read-only configmap mount and it doesn't write; bank-vaults: no rootfs writes
          # observed) — verified RO-clean by canary before commit. No extra emptyDirs needed.
          - list: "request.object.spec.containers"
            preconditions:
              all:
                - key: "{{ element.name }}"
                  operator: AnyIn
                  value: [vault, bank-vaults, prometheus-exporter]
            patchStrategicMerge:
              spec:
                containers:
                  - (name): "{{ element.name }}"
                    securityContext:
                      readOnlyRootFilesystem: true
    - name: harden-vault-configurer-pod
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [zeldas-lullaby]
              selector:
                matchLabels:
                  app.kubernetes.io/name: vault-configurator
      mutate:
        patchStrategicMerge:
          spec:
            securityContext:
              +(seccompProfile):
                type: RuntimeDefault
              +(runAsNonRoot): true
