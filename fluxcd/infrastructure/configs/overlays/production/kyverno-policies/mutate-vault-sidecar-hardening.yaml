apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: mutate-vault-sidecar-hardening
  annotations:
    policies.kyverno.io/title: Mutate Vault Sidecar Hardening
    policies.kyverno.io/description: >-
      The bank-vaults operator injects sidecars (bank-vaults, prometheus-exporter) into the
      Vault raft pods and runs a vault-configurer Deployment, none with a container
      securityContext, and the Vault CRD has no field for them. This hardens the CR-managed
      pods (raft pods app.kubernetes.io/name=vault + the vault-configurator pod) that the
      per-app-overlay doctrine can't reach. Containers: allowPrivilegeEscalation:false on EVERY
      container (the vault container keeps its CR-managed caps — never clobbered) and drop-ALL to
      the bank-vaults/prometheus-exporter containers. Pod: seccomp RuntimeDefault + runAsNonRoot
      on the vault-configurator pod only (its bank-vaults container runs uid 65534). NOT applied
      to the raft pods: pod-level runAsNonRoot is impossible there (openbao image has a
      non-numeric user -> CreateContainerConfigError). failurePolicy: Ignore is required — with
      Fail, a Kyverno webhook-rebuild blip would block Vault StatefulSet pod creation, and every
      secret in the cluster depends on it. Validate with kubectl create --dry-run=server before
      rolling real pods. ADMISSION-TIME ONLY.
spec:
  failurePolicy: Ignore
  # Pods only: no rules generated for their controllers
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        # CREATE-only: admission-time hardening (see description). On UPDATE the
        # securityContext is immutable and re-injecting it wedges controller pod updates.
        operations: [CREATE]
        resources: [pods]
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: optcp-secrets
  matchConditions:
    - name: vault-pods
      expression: "object.metadata.?labels[?'app.kubernetes.io/name'].orValue('') in ['vault', 'vault-configurator']"
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: |-
          lists.range(size(object.spec.containers)).map(i, cel.bind(c, object.spec.containers[i],
            cel.bind(p, "/spec/containers/" + string(i) + "/securityContext",
              (has(c.securityContext) ? [] : [JSONPatch{op: "add", path: p, value: {}}]) +
              // allowPrivilegeEscalation:false on EVERY container (vault keeps its caps)
              [JSONPatch{op: "add", path: p + "/allowPrivilegeEscalation", value: false}] +
              (c.name in ['openbao', 'bank-vaults', 'prometheus-exporter'] && !c.?securityContext.?capabilities.hasValue()
                ? [JSONPatch{op: "add", path: p + "/capabilities", value: {}}] : []) +
              // drop-ALL caps on the operator sidecar containers (raft sidecars + configurer)
              (c.name in ['bank-vaults', 'prometheus-exporter']
                ? [JSONPatch{op: "add", path: p + "/capabilities/drop", value: ["ALL"]}] : []) +
              // readOnlyRootFilesystem on all three. Each writes only to mounted volumes
              // (openbao: /vault/data + /vault/config + /openbao/config; statsd: its /tmp is a
              // read-only configmap mount and it doesn't write; bank-vaults: no rootfs writes
              // observed) — verified RO-clean by canary before commit. No extra emptyDirs needed.
              (c.name in ['openbao', 'bank-vaults', 'prometheus-exporter']
                ? [JSONPatch{op: "add", path: p + "/readOnlyRootFilesystem", value: true}] : []) +
              // runAsNonRoot + a NUMERIC runAsUser so admission can verify non-root. openbao's
              // image declares a non-numeric user, so runAsNonRoot alone -> CreateContainerConfig
              // Error; pin each to the uid it already runs as (vault=100, sidecars=65534) = a
              // runtime no-op. statsd-exporter also ships a non-numeric user, hence pinning it too.
              (c.name == 'openbao'
                ? [JSONPatch{op: "add", path: p + "/runAsNonRoot", value: true},
                   JSONPatch{op: "add", path: p + "/runAsUser", value: 100},
                   // Strip IPC_LOCK from the openbao container. vault-operator v1.24.0 hardcodes
                   // capabilities.add [IPC_LOCK, SETFCAP] and APPENDS the CR's vaultContainerSpec caps
                   // (mergo WithAppendSlice) — so the CR cannot remove IPC_LOCK. PSA baseline (enforced on
                   // optcp-secrets) forbids it, wedging the raft rollout at the highest ordinal. mlock is
                   // off (config disable_mlock: true) so IPC_LOCK is unused; overwrite add with the intended
                   // set. Kyverno mutation runs before PSA validation, so the rewritten pod admits cleanly.
                   JSONPatch{op: "add", path: p + "/capabilities/add", value: ["CHOWN", "FOWNER", "SETFCAP", "SETGID", "SETUID"]}]
                : []) +
              (c.name in ['bank-vaults', 'prometheus-exporter']
                ? [JSONPatch{op: "add", path: p + "/runAsNonRoot", value: true},
                   JSONPatch{op: "add", path: p + "/runAsUser", value: 65534}]
                : [])
            ))).flatten() +
          // The vault-configurator pod: seccomp RuntimeDefault + runAsNonRoot, each only when unset
          (object.metadata.labels['app.kubernetes.io/name'] != 'vault-configurator' ? [] :
            (has(object.spec.securityContext) ? [] : [JSONPatch{op: "add", path: "/spec/securityContext", value: {}}]) +
            (object.spec.?securityContext.?seccompProfile.hasValue() ? [] :
              [JSONPatch{op: "add", path: "/spec/securityContext/seccompProfile", value: {"type": "RuntimeDefault"}}]) +
            (object.spec.?securityContext.?runAsNonRoot.hasValue() ? [] :
              [JSONPatch{op: "add", path: "/spec/securityContext/runAsNonRoot", value: true}]))
