apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: mutate-vault-sidecar-hardening
  annotations:
    policies.kyverno.io/title: Mutate Vault Sidecar Hardening
    policies.kyverno.io/description: >-
      bank-vaults injects the "bank-vaults" (unseal/configurer) and "prometheus-exporter"
      sidecars into the Vault raft pods with no container securityContext, and the Vault
      CRD exposes securityContext only for the pod (spec.securityContext) and the vault
      container (vaultContainerSpec) — there is NO field for the sidecars, so they cannot be
      hardened through the CR. Like mutate-velero-maintenance-hardening (Velero's kopia jobs,
      same "operator generates an unconfigurable PodSpec" problem), this is the sanctioned
      mutate exception to the per-app-overlay doctrine. It targets ONLY the Vault raft pods
      (app.kubernetes.io/name: vault in zeldas-lullaby) and hardens ONLY the two sidecar
      containers BY NAME — never the vault container, whose caps (drop ALL + add CHOWN/
      SETUID/SETGID/FOWNER/SETFCAP) are deliberately managed in the CR. Pod-level
      runAsNonRoot is safe: all three containers already run non-root (vault=100, sidecars=
      65534). Intentionally NO runAsUser (would override the image uids and break vault=100)
      and NO readOnlyRootFilesystem (sidecars write at runtime). Add-only (+() anchors);
      ADMISSION-TIME ONLY — securityContext is immutable on running pods, so this takes
      effect on the next vault pod roll (no mutateExisting).
spec:
  background: true
  rules:
    - name: harden-vault-sidecars
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - zeldas-lullaby
              selector:
                matchLabels:
                  app.kubernetes.io/name: vault
      mutate:
        patchStrategicMerge:
          spec:
            securityContext:
              +(runAsNonRoot): true
            containers:
              - (name): bank-vaults
                securityContext:
                  +(allowPrivilegeEscalation): false
                  +(capabilities):
                    drop:
                      - ALL
              - (name): prometheus-exporter
                securityContext:
                  +(allowPrivilegeEscalation): false
                  +(capabilities):
                    drop:
                      - ALL
