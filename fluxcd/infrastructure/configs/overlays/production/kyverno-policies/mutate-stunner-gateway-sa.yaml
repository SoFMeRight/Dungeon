apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: mutate-stunner-gateway
spec:
  background: true
  rules:
    - name: set-stunner-sa-on-deployment
      match:
        any:
          - resources:
              kinds: [Deployment]
              namespaces: ["swift-sail", "optcp-remote-access", "temple-of-time"]
              selector:
                matchLabels:
                  stunner.l7mp.io/owned-by: stunner
      preconditions:
        all:
          - key: "{{ request.object.metadata.labels.\"stunner.l7mp.io/related-gateway-name\" || '' }}"
            operator: NotEquals
            value: ""
      mutate:
        patchStrategicMerge:
          spec:
            template:
              spec:
                serviceAccountName: "{{ request.object.metadata.labels.\"stunner.l7mp.io/related-gateway-name\" }}"
    - name: set-stunner-lb-ip-on-service
      match:
        any:
          - resources:
              kinds: [Service]
              namespaces: ["swift-sail"]
              annotations:
                stunner.l7mp.io/related-gateway-name: "swift-sail/neko-gateway"
      mutate:
        patchStrategicMerge:
          metadata:
            annotations:
              lbipam.cilium.io/ips: "172.22.30.120"
    # NetBird's STUNner TURN gateway inherits coturn's old address (172.22.30.86,
    # sharing-key optcp-remote-access) so turn.prplanit.com DNS and the WAN NAT don't move.
    - name: set-netbird-turn-lb-ip-on-service
      match:
        any:
          - resources:
              kinds: [Service]
              namespaces: ["optcp-remote-access"]
              annotations:
                stunner.l7mp.io/related-gateway-name: "optcp-remote-access/netbird-turn"
      mutate:
        patchStrategicMerge:
          metadata:
            annotations:
              lbipam.cilium.io/ips: "172.22.30.86"
              lbipam.cilium.io/sharing-key: "optcp-remote-access"
              lbipam.cilium.io/sharing-cross-namespace: "*"
    # Matrix's TURN gateway takes its own address rather than sharing NetBird's: both
    # want a TURN listener, and two listeners cannot hold the same port on one IP.
    - name: set-matrix-turn-lb-ip-on-service
      match:
        any:
          - resources:
              kinds: [Service]
              namespaces: ["temple-of-time"]
              annotations:
                stunner.l7mp.io/related-gateway-name: "temple-of-time/matrix-turn"
      mutate:
        patchStrategicMerge:
          metadata:
            annotations:
              lbipam.cilium.io/ips: "172.22.30.87"
