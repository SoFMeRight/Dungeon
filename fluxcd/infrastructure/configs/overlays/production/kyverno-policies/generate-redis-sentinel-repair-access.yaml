# Binds redis-sentinel-repair's pod-delete ClusterRole in every namespace that holds a
# RedisSentinel, and removes the binding with the last one, so the repair job follows
# Sentinels through namespace moves. The background controller's permissions for it
# are in Kyverno's HelmRelease (backgroundController.rbac).
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: generate-redis-sentinel-repair-access
spec:
  evaluation:
    generateExisting:
      enabled: true
    synchronize:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [redis.redis.opstreelabs.in]
        apiVersions: [v1beta2]
        operations: [CREATE, UPDATE]
        resources: [redissentinels]
  variables:
    - name: binding
      expression: |-
        [{
          "apiVersion": "rbac.authorization.k8s.io/v1",
          "kind": "RoleBinding",
          "metadata": {
            "name": "redis-sentinel-repair-access",
            "namespace": object.metadata.namespace,
            "labels": {"app": "redis-sentinel-repair"}
          },
          "roleRef": {"apiGroup": "rbac.authorization.k8s.io", "kind": "ClusterRole", "name": "redis-sentinel-repair"},
          "subjects": [{"kind": "ServiceAccount", "name": "redis-sentinel-repair", "namespace": "optcp-operators-baseline"}]
        }]
  generate:
    - expression: "generator.Apply(object.metadata.namespace, variables.binding)"
