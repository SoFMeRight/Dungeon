apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: mutate-redis-master-handoff
  annotations:
    policies.kyverno.io/title: Mutate Redis master handoff on shutdown
    policies.kyverno.io/description: >-
      A drain that takes a Redis replication master and one of its three sentinels together
      leaves two sentinels that can split their vote and abort the failover. The redis-operator
      then re-registers the new master with SENTINEL REMOVE/MONITOR, which publishes no
      +switch-master, so sentinel-aware clients (gitlab-kas) keep the old master's pod IP. This
      injects a preStop hook on operator-managed Redis replication pods: a master asks its
      sentinels for SENTINEL FAILOVER and waits until it is demoted, so planned disruption is a
      single coordinated, announced failover. Replicas exit at once. The redis-operator CRD has no
      lifecycle field, so Kyverno is the only mechanism. CREATE-only + admission-time: existing
      pods get the hook when they next roll. Assumes the operator naming <name>-redis replication,
      <name>-sentinel RedisSentinel, master group = replication name.
spec:
  failurePolicy: Fail
  # Pods only: no rules generated for their controllers
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
  matchConditions:
    - name: redis-replication
      expression: "object.metadata.?labels[?'redis_setup_type'].orValue('') == 'replication'"
    - name: operator-naming
      expression: "object.metadata.?labels[?'app'].orValue('').endsWith('-redis')"
  variables:
    - name: app
      expression: "object.metadata.labels['app']"
    # The container named after the replication: the redis server
    - name: index
      expression: "lists.range(size(object.spec.containers)).filter(i, object.spec.containers[i].name == variables.app)"
    - name: sentinel
      expression: "variables.app.substring(0, size(variables.app) - 6) + '-sentinel-sentinel'"
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: |-
          size(variables.index) == 0 ? [] : cel.bind(p, "/spec/containers/" + string(variables.index[0]),
            cel.bind(hook, {"exec": {"command": ["/bin/sh", "-c",
              r'''REDISCLI_AUTH="$(printf %s "$REDISCLI_AUTH" | tr -d '\r\n')"
          export REDISCLI_AUTH
          [ "$(redis-cli --no-auth-warning role | head -n1)" = master ] || exit 0
          sentinel="''' + variables.sentinel + r'''"
          redis-cli --no-auth-warning -h "$sentinel" -p 26379 sentinel failover "''' + variables.app + r'''" || exit 0
          i=0
          while [ "$i" -lt 25 ]; do
            [ "$(redis-cli --no-auth-warning role | head -n1)" = slave ] && exit 0
            sleep 1
            i=$((i + 1))
          done
          ''']}},
              has(object.spec.containers[variables.index[0]].lifecycle)
                ? [JSONPatch{op: "add", path: p + "/lifecycle/preStop", value: hook}]
                : [JSONPatch{op: "add", path: p + "/lifecycle", value: {"preStop": hook}}]))
