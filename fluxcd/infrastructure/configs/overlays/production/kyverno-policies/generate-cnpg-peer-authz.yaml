# CNPG >=1.30 instance managers dial each other on :8000 (/failsafe) and replicas
# stream from the primary on :5432 — under the namespace default-deny both need the
# per-cluster self-paired allow (only the cluster's own SA to only that cluster's
# pods). Generates it on CNPG Cluster creation so a new cluster is never born with
# silently degraded resilience. CREATE-only and skip-if-exists: the Flux-managed
# allow-<cluster>-replication policies for existing clusters stay authoritative,
# and a later Flux manifest with the same name simply takes over. A generated
# policy outliving a deleted Cluster selects no pods and allows nothing.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:generate-istio-authorizationpolicies
  labels:
    rbac.kyverno.io/aggregate-to-background-controller: "true"
rules:
  - apiGroups: ["security.istio.io"]
    resources: ["authorizationpolicies"]
    verbs: ["create", "update", "patch", "get", "list", "watch", "delete"]
---
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: generate-cnpg-peer-authz
spec:
  evaluation:
    generateExisting:
      enabled: false
    synchronize:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [postgresql.cnpg.io]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [clusters]
  variables:
    - name: name
      expression: "'allow-' + object.metadata.name + '-replication'"
    - name: existing
      expression: "resource.List('security.istio.io/v1', 'authorizationpolicies', object.metadata.namespace)"
    - name: exists
      expression: "dyn(variables.existing.items).exists(p, p.metadata.name == variables.name)"
    - name: authz
      expression: |-
        [{
          "apiVersion": "security.istio.io/v1",
          "kind": "AuthorizationPolicy",
          "metadata": {"name": variables.name, "namespace": object.metadata.namespace},
          "spec": {
            "selector": {"matchLabels": {"cnpg.io/cluster": object.metadata.name}},
            "action": "ALLOW",
            "rules": [{
              "from": [{"source": {"principals": [
                "cluster.local/ns/" + object.metadata.namespace + "/sa/" + object.metadata.name]}}],
              // 5432: streaming replication; 8000: instance-manager peer /failsafe (CNPG >=1.30)
              "to": [{"operation": {"ports": ["5432", "8000"]}}]
            }]
          }
        }]
  generate:
    - expression: "variables.exists || generator.Apply(object.metadata.namespace, variables.authz)"
