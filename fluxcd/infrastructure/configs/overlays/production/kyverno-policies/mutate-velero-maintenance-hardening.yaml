apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: mutate-velero-maintenance-hardening
  annotations:
    policies.kyverno.io/title: Mutate Velero Maintenance Job Hardening
    policies.kyverno.io/description: >-
      Velero's repository-maintenance Jobs (kopia prune/gc, one per BackupRepository) are
      generated on the fly by the Velero server with no securityContext, and Velero
      deliberately keeps the maintenance PodSpec non-configurable (upstream #7911) — so they
      cannot be hardened through an app overlay the way every other workload is. This
      narrowly-scoped admission mutate is the sanctioned exception to the "carry the four
      non-seccomp dimensions explicitly per-app in overlays" doctrine (see mutate-pod-hardening):
      it targets ONLY pods carrying the velero.io/repo-name label.
      FULL non-root: velero hardcodes writing the kopia repo config to /udmrepo at the container
      root filesystem (no volume) — as root it just mkdir's /udmrepo, but a non-root uid cannot
      write /. So this rule injects a writable emptyDir at /udmrepo (+ fsGroup 1000) so the pod
      CAN run non-root and still write its kopia config/cache, then applies the full set:
      runAsNonRoot + runAsUser/Group 1000, allowPrivilegeEscalation false, drop-all capabilities,
      seccomp RuntimeDefault. Without the /udmrepo volume, forcing runAsNonRoot fatals with
      "mkdir /udmrepo: permission denied" (verified on a live cycle). readOnlyRootFilesystem is
      intentionally left off — kopia writes a local cache under /udmrepo. Add-only (+() anchors on
      scalars; volume/mount merge by name); ADMISSION-TIME ONLY — maintenance Jobs are recreated
      each cycle, so new pods are covered within one interval (no mutateExisting).
spec:
  background: true
  rules:
    - name: harden-velero-maintenance-pods
      match:
        any:
          - resources:
              kinds:
                - Pod
              selector:
                matchExpressions:
                  - key: velero.io/repo-name
                    operator: Exists
      mutate:
        patchStrategicMerge:
          spec:
            securityContext:
              +(runAsNonRoot): true
              +(runAsUser): 1000
              +(runAsGroup): 1000
              +(fsGroup): 1000
              +(seccompProfile):
                type: RuntimeDefault
            volumes:
              - name: udmrepo
                emptyDir:
                  sizeLimit: 2Gi
            containers:
              - (name): "*"
                securityContext:
                  +(allowPrivilegeEscalation): false
                  +(capabilities):
                    drop:
                      - ALL
                volumeMounts:
                  - name: udmrepo
                    mountPath: /udmrepo
