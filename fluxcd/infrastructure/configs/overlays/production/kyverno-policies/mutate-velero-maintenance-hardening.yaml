apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: mutate-velero-maintenance-hardening
  annotations:
    policies.kyverno.io/title: Mutate Velero Maintenance Job Hardening
    policies.kyverno.io/description: >-
      Velero's repository-maintenance Jobs (kopia prune/gc, one per BackupRepository) are
      generated on the fly by the Velero server with no securityContext, and Velero
      deliberately keeps the maintenance PodSpec non-configurable (upstream #7911) — so they
      cannot be hardened through an app overlay the way every other workload is. This
      narrowly-scoped admission mutate is the sanctioned exception to the "carry the four
      non-seccomp dimensions explicitly per-app in overlays" doctrine (see mutate-pod-hardening):
      it targets ONLY pods carrying the velero.io/repo-name label.
      ROOT IS REQUIRED here, not hardened away: velero hardcodes writing the kopia repo config
      to /udmrepo at the container root filesystem (no volume, no writable dir), so the pod MUST
      run as root to create it — forcing runAsNonRoot breaks maintenance with
      "mkdir /udmrepo: permission denied" (verified on a live cycle). So this rule hardens the
      dimensions that are safe while root: no-privilege-escalation (the reported SEC-3 audit
      failure), drop-all capabilities (root needs none for kopia prune/gc against S3), and
      seccomp RuntimeDefault (self-contained if mutate-pod-hardening is suspended on the backup
      namespace). runAsNonRoot and readOnlyRootFilesystem are intentionally left off — both break
      the job. Add-only (+() anchors, never overrides); ADMISSION-TIME ONLY — maintenance Jobs are
      recreated each cycle, so new pods are covered within one interval (no mutateExisting).
spec:
  background: true
  rules:
    - name: harden-velero-maintenance-pods
      match:
        any:
          - resources:
              kinds:
                - Pod
              selector:
                matchExpressions:
                  - key: velero.io/repo-name
                    operator: Exists
      mutate:
        patchStrategicMerge:
          spec:
            securityContext:
              +(seccompProfile):
                type: RuntimeDefault
            containers:
              - (name): "*"
                securityContext:
                  +(allowPrivilegeEscalation): false
                  +(capabilities):
                    drop:
                      - ALL
