apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: mutate-velero-maintenance-hardening
  annotations:
    policies.kyverno.io/title: Mutate Velero Maintenance Job Hardening
    policies.kyverno.io/description: >-
      Velero's repository-maintenance Jobs (kopia prune/gc, one per BackupRepository) are
      generated on the fly by the Velero server with no securityContext, and Velero
      deliberately keeps the maintenance PodSpec non-configurable (upstream #7911) — so they
      cannot be hardened through an app overlay the way every other workload is. This
      narrowly-scoped admission mutate is the sanctioned exception to the "carry the four
      non-seccomp dimensions explicitly per-app in overlays" doctrine (see mutate-pod-hardening):
      it targets ONLY pods carrying the velero.io/repo-name label.
      FULL non-root: velero writes to two root-filesystem paths a non-root uid can't create —
      the kopia repo config at /udmrepo (hardcoded) and the kopia cache at $HOME/.cache (HOME is
      unset → /.cache). So this rule injects ONE writable emptyDir at /udmrepo (+ fsGroup 1000)
      and repoints HOME=/udmrepo, so the config lands in the mount and the cache lands in
      /udmrepo/.cache — both writable — then applies the full set: runAsNonRoot + runAsUser/Group
      1000, allowPrivilegeEscalation false, drop-all capabilities, seccomp RuntimeDefault. Without
      these, forcing runAsNonRoot fatals with "mkdir /udmrepo" then "mkdir /.cache: permission
      denied" (both verified on live cycles). readOnlyRootFilesystem is intentionally left off —
      the cache is written at runtime. Add-only (+() anchors on
      scalars; volume/mount merge by name); ADMISSION-TIME ONLY — maintenance Jobs are recreated
      each cycle, so new pods are covered within one interval (no mutateExisting).
spec:
  background: true
  rules:
    - name: harden-velero-maintenance-pods
      match:
        any:
          - resources:
              kinds:
                - Pod
              # CREATE-only: admission-time hardening. Firing on UPDATE re-injects the immutable
              # securityContext/volume onto the maintenance pod's own finalizer-removal update →
              # API rejects it → the failed kopia-maintain pods wedge Terminating with the
              # batch.kubernetes.io/job-tracking finalizer forever. Scope out UPDATE.
              operations: [CREATE]
              selector:
                matchExpressions:
                  - key: velero.io/repo-name
                    operator: Exists
      mutate:
        patchStrategicMerge:
          spec:
            securityContext:
              +(runAsNonRoot): true
              +(runAsUser): 1000
              +(runAsGroup): 1000
              +(fsGroup): 1000
              +(seccompProfile):
                type: RuntimeDefault
            volumes:
              - name: udmrepo
                emptyDir:
                  sizeLimit: 2Gi
            containers:
              - (name): "*"
                securityContext:
                  +(allowPrivilegeEscalation): false
                  +(capabilities):
                    drop:
                      - ALL
                env:
                  - name: HOME
                    value: /udmrepo
                volumeMounts:
                  - name: udmrepo
                    mountPath: /udmrepo
