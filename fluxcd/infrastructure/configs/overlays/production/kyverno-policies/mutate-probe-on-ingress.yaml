apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: mutate-probe-on-ingress
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments, statefulsets, daemonsets]
  matchConditions:
    - name: ingress
      expression: "object.spec.template.metadata.?labels[?'policy.prplanit.com/ingress'].orValue('') == 'true'"
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{spec: Object.spec{template: Object.spec.template{metadata: Object.spec.template.metadata{
            labels: {"policy.prplanit.com/probe": "true"}}}}}
