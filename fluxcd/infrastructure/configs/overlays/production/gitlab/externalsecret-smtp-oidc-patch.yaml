apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-smtp-oidc
spec:
  secretStoreRef:
    name: openbao-optcp
  target:
    template:
      data:
        provider: |
          name: 'openid_connect'
          label: 'PrecisionPlanIT.com'
          icon: 'https://sso.optcp.com/ui/console/assets/icons/favicon-32x32.png'
          args:
            name: 'openid_connect'
            scope: ['openid', 'profile', 'email']
            response_type: 'code'
            issuer: 'https://sso.optcp.com'
            discovery: true
            client_auth_method: 'query'
            uid_field: 'sub'
            client_options:
              identifier: '{{ .oidc_client_id }}'
              secret: '{{ .oidc_client_secret }}'
              redirect_uri: 'https://git.prplanit.com/users/auth/openid_connect/callback'
