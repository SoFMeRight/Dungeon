# Credential for the ReadOnly `legacy-velero-backups` BackupStorageLocation.
#
# Scoped on the SeaweedFS side to Read and List on the pre-rename velero-backups
# bucket only -- no Write, no Tagging -- so velero can restore from it but can
# never alter or expire it. Separate from velero-minio-credentials, which is the
# read-write credential for the current location.
#
# Fill and encrypt; the plaintext is never committed:
#   sops --encrypt velero-legacy-secret-template.yaml > velero-legacy-secret.enc.yaml
#
# Delete this, its .enc.yaml, the BSL and the bucket once the newest object in
# velero-backups has aged past the retention you care about.
apiVersion: v1
kind: Secret
metadata:
  name: velero-legacy-credentials
  namespace: kube-system
type: Opaque
stringData:
  cloud: |
    [default]
    aws_access_key_id=REPLACE_WITH_VELERO_BACKUPS_ACCESS_KEY
    aws_secret_access_key=REPLACE_WITH_VELERO_BACKUPS_SECRET_KEY
