# Encrypts every Velero repository: losing it makes all backups unreadable.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-repo-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-optcp
  target:
    name: velero-repo-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: repository-password
      remoteRef:
        key: apps/velero/app
        property: REPOSITORY_PASSWORD
