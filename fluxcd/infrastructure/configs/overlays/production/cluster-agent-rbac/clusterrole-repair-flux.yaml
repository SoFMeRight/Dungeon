apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-repair-flux
  labels:
    app.kubernetes.io/part-of: cluster-agent-rbac
# `flux reconcile` is an annotation patch: it changes WHEN declared state is
# re-applied, never WHAT is declared. It cannot alter a manifest, only trigger a
# sync of what Git already holds -- so it is safe to grant cluster-wide, unlike
# exec/delete which are namespaced in rbac-namespaced.yaml.
rules:
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["gitrepositories", "helmrepositories", "ocirepositories"]
    verbs: ["patch"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["patch"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["patch"]
