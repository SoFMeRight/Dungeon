# Ambient carries the TCP half of the gossip ring (join and push/pull); see the Cilium
# policy for the UDP half.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-alertmanager-cluster-gossip
spec:
  selector:
    matchLabels:
      app: alertmanager
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/gossip-stone/sa/alertmanager
      to:
        - operation:
            ports: ["9094"]
