apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-ark-sa-tmc-admin-loadbalancer
spec:
  selector:
    matchLabels:
      app: ark-sa-tmc-admin-list-server
  action: ALLOW
  rules:
    # list-server runs on container port 8080 (Service 28019->8080); istio ambient
    # enforces on the workload port, so this is 8080, not the LB service port.
    - to:
        - operation:
            ports: ["8080"]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-ark-sa-tmc-theisland-loadbalancer
spec:
  selector:
    matchLabels:
      app: ark-sa-tmc-theisland
  action: ALLOW
  rules:
    - to:
        - operation:
            ports: ["8777", "28020", "8778"]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-ark-sa-tmc-valguero-loadbalancer
spec:
  selector:
    matchLabels:
      app: ark-sa-tmc-valguero
  action: ALLOW
  rules:
    - to:
        - operation:
            ports: ["8779", "28021", "8780"]
