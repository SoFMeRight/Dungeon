apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-dependency-track-postgres-replication
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: dependency-track-postgres
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/optcp-sibyl-system/sa/dependency-track-postgres
      to:
        - operation:
            ports: ["5432", "8000"]
