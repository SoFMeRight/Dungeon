# SHARED (whole xylem gateway) — not per-app. Strips any client-supplied identity
# headers before ext-authz runs, so nobody can forge `x-auth-request-groups: owner`.
# The `_` prefix keeps this shared infra sorted above the per-app host files.
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: sso-strip-spoofed-auth-headers
spec:
  workloadSelector:
    labels:
      gateway.networking.k8s.io/gateway-name: xylem-gateway
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.lua
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
            inlineCode: |
              function envoy_on_request(handle)
                for _, h in ipairs({"x-auth-request-user", "x-auth-request-email", "x-auth-request-groups", "x-auth-request-preferred-username"}) do
                  handle:headers():remove(h)
                end
              end
