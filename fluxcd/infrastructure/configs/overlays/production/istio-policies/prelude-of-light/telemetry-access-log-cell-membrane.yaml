# Enables JSON access logging for the public cell-membrane gateway so its request logs
# flow through alloy to Loki, where CrowdSec parses them for attack detection. istio
# emits no access logs by default (meshConfig sets no accessLogFile); this Telemetry
# scopes logging to the gateway workload only, so east-west sidecar traffic stays
# unlogged and Loki cardinality stays bounded. The cell-membrane-access-log provider
# (defined in the istiod meshConfig) emits direct_remote_ip + cf_connecting_ip so the
# CrowdSec parser can derive the real, unspoofable client IP.
apiVersion: telemetry.istio.io/v1
kind: Telemetry
metadata:
  name: cell-membrane-access-log
spec:
  selector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: cell-membrane-gateway
  accessLogging:
    - providers:
        - name: cell-membrane-access-log
