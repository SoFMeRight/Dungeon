# The zitadel-configuration Job writes Zitadel's generated credentials to OpenBao at
# zeldas-letter/apps/zitadel; external-secrets reads them back.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-zitadel-configuration-to-vault
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: vault
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/zeldas-lullaby/sa/zitadel-configuration
      to:
        - operation:
            ports: ["8200"]
