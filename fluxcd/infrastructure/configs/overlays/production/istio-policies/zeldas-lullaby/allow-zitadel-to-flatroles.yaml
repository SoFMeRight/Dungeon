# Zitadel's API pods (sa/zitadel) call the flatRoles Actions-v2 target on
# preuserinfo/preaccesstoken, and the zitadel-configuration Job (sa/zitadel-configuration)
# self-tests it before cutover. The mesh identity is the target's caller authentication:
# the payload signing key is not verified by the service.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-zitadel-to-flatroles
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: zitadel-flatroles
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/zeldas-lullaby/sa/zitadel
              - cluster.local/ns/zeldas-lullaby/sa/zitadel-configuration
      to:
        - operation:
            ports: ["8080"]
