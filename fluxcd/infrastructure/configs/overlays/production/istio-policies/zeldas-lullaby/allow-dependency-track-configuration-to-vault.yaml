apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-dependency-track-configuration-to-vault
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: vault
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/optcp-sibyl-system/sa/dependency-track-configuration
      to:
        - operation:
            ports: ["8200"]
