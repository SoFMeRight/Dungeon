apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-vault-to-vault
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: vault
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/zeldas-lullaby/sa/openbao
      to:
        - operation:
            # 8201 = raft cluster port (steady state); 8200 = API, needed for the raft bootstrap
            # challenge + the vault-SA configurer's init/unseal on a FRESH cluster (self-hairpin).
            ports: ["8200", "8201"]
