apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-stalwart-configuration-to-stalwart
spec:
  selector:
    matchLabels:
      app: stalwart
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/optcp-delivery-bag/sa/stalwart-configuration
      to:
        - operation:
            ports: ["8080"]
