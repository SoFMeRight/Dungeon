apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-leantime-to-leantime-postgres
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: leantime-postgres
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/optcp-cloud/sa/leantime
      to:
        - operation:
            ports: ["5432"]
