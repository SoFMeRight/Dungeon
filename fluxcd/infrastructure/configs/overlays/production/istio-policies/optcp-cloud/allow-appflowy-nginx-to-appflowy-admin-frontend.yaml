apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-appflowy-nginx-to-appflowy-admin-frontend
spec:
  selector:
    matchLabels:
      app: appflowy-admin-frontend
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/optcp-cloud/sa/appflowy-nginx
      to:
        - operation:
            ports: ["3000"]
