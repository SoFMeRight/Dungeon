apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-appflowy-cloud-to-appflowy-gotrue
spec:
  # gotrue shares app=appflowy with nginx — component disambiguates the target.
  # (was app: appflowy-gotrue, which matched no pod, so this allow was a no-op.)
  selector:
    matchLabels:
      app: appflowy
      component: gotrue
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/optcp-cloud/sa/appflowy-cloud
      to:
        - operation:
            ports: ["9999"]
