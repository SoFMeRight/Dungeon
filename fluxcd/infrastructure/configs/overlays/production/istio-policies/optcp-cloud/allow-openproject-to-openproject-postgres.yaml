apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-openproject-to-openproject-postgres
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: openproject-postgres
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/optcp-cloud/sa/openproject
      to:
        - operation:
            ports: ["5432"]
