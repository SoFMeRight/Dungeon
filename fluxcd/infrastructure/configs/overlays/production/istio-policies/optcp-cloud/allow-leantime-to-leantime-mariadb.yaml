apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-leantime-to-leantime-mariadb
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: leantime-mariadb
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/optcp-cloud/sa/leantime
      to:
        - operation:
            ports: ["3306"]
