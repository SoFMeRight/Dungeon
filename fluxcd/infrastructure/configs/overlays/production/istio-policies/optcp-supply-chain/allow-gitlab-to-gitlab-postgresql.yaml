apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-gitlab-to-gitlab-postgresql
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: gitlab-postgresql
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/optcp-supply-chain/sa/gitlab-webservice
              - cluster.local/ns/optcp-supply-chain/sa/gitlab-sidekiq
              - cluster.local/ns/optcp-supply-chain/sa/gitlab-praefect
              - cluster.local/ns/optcp-supply-chain/sa/gitlab-toolbox
              - cluster.local/ns/optcp-supply-chain/sa/gitlab-gitaly
              # Helm-hook Jobs (migrations, praefect DB init) run under their own SAs and
              # need DB access to complete an upgrade; not discovered by PolySieve (hooks).
              - cluster.local/ns/optcp-supply-chain/sa/gitlab-migrations
              - cluster.local/ns/optcp-supply-chain/sa/gitlab-praefect-db-init
      to:
        - operation:
            ports: ["5432"]
