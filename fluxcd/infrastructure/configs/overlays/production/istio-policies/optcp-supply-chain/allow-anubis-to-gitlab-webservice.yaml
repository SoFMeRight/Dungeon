apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-anubis-to-gitlab-webservice
spec:
  selector:
    matchLabels:
      app: webservice
      gitlab.com/webservice-name: default
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/optcp-edge-defenses/sa/anubis
      to:
        - operation:
            ports: ["8181"]
