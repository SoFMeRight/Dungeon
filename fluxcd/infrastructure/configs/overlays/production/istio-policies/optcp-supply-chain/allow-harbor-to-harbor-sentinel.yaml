apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-harbor-to-harbor-sentinel
spec:
  selector:
    matchLabels:
      app: harbor-sentinel-sentinel
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/optcp-supply-chain/sa/harbor-core
              - cluster.local/ns/optcp-supply-chain/sa/harbor-jobservice
              - cluster.local/ns/optcp-supply-chain/sa/harbor-registry
      to:
        - operation:
            ports: ["26379"]
