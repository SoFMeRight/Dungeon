apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-alloy-syslog-to-loki
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: single-binary
      app.kubernetes.io/name: loki
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/lakitu/sa/alloy-syslog
      to:
        - operation:
            ports: ["3100"]
