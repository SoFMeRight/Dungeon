apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-grafana-to-loki
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: single-binary
      app.kubernetes.io/name: loki
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/optcp-gossip-stone/sa/grafana
      to:
        - operation:
            ports: ["3100"]
