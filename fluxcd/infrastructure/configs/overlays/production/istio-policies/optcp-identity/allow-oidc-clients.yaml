apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-oidc-clients
spec:
  selector:
    matchLabels:
      app: zitadel
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces:
              - optcp-ingress-internal
              - kai-ingress-private
              - optcp-fairy-bottle
              - gorons-bracelet
              - optcp-gossip-stone
              - prplanit-staff-suite
              - outspokekin-delivery-bag
              - outspokekin-social
              - lens-of-truth
              - arbitorium-home
              - arbitorium-restricted
              - optcp-app-directory
              - kai-private
              - optcp-cloud
              - optcp-ai
              - optcp-management-dashboards
              - optcp-media
              - optcp-swift-sail
              - optcp-swift-sail-privileged
              - yesimvegan-web
              - optcp-identity
              - optcp-remote-access
      to:
        - operation:
            ports: ["8080"]
