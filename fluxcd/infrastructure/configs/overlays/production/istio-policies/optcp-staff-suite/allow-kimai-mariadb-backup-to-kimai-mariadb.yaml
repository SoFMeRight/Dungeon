apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-kimai-mariadb-backup-to-kimai-mariadb
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: kimai-mariadb
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/optcp-staff-suite/sa/kimai-mariadb-backup
      to:
        - operation:
            ports: ["3306"]
