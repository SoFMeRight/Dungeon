apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-wikijs-sops-postgres-replication
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: wikijs-sops-postgres
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/optcp-staff-suite/sa/wikijs-sops-postgres
      to:
        - operation:
            ports: ["5432", "8000"]
