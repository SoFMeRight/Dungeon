apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-tactical-backend-to-tactical-nats
spec:
  selector:
    matchLabels:
      app: tactical-nats
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/prplanit-remote-access/sa/tactical-backend
              - cluster.local/ns/prplanit-remote-access/sa/tactical-celery
              - cluster.local/ns/prplanit-remote-access/sa/tactical-nats
              - cluster.local/ns/prplanit-remote-access/sa/tactical-websockets
      to:
        - operation:
            ports: ["4222"]
