apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-dependency-track-to-ntfy
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ntfy
  action: ALLOW
  rules:
    # Ambient enforces the container port (Service 80 -> 8080).
    - from:
        - source:
            principals:
              - cluster.local/ns/optcp-sibyl-system/sa/dependency-track
      to:
        - operation:
            ports: ["8080"]
