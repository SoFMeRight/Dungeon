apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-grafana-to-ntfy
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ntfy
  action: ALLOW
  rules:
    # Grafana alert notifications to ntfy over the internal service (80/TCP).
    - from:
        - source:
            principals:
              - cluster.local/ns/gossip-stone/sa/grafana
      to:
        - operation:
            ports: ["80"]
