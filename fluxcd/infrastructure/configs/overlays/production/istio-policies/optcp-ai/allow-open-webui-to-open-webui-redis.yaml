apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-open-webui-to-open-webui-redis
spec:
  selector:
    matchLabels:
      app: open-webui-redis
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/optcp-ai/sa/open-webui
      to:
        - operation:
            ports: ["6379"]
