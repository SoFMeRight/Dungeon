apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-csi-addons-to-rbd-ctrlplugin
spec:
  selector:
    matchLabels:
      app: gorons-bracelet.rbd.csi.ceph.com-ctrlplugin
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/optcp-operators-privileged/sa/csi-addons-controller-manager
      to:
        - operation:
            ports: ["9070"]
---
