apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-appflowy-sso-init-to-appflowy-gotrue
spec:
  # The one-shot SSO-registration Job calls gotrue's admin API to register the
  # Zitadel SAML provider. gotrue shares app=appflowy with nginx — component
  # disambiguates the target.
  selector:
    matchLabels:
      app: appflowy
      component: gotrue
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/temple-of-time/sa/appflowy-sso-init
      to:
        - operation:
            ports: ["9999"]
