# MAS provisions and queries accounts through Synapse's admin API, and Synapse introspects
# every access token against MAS. Both directions are in-cluster, so both need an allow —
# without one the connection is reset by the mesh rather than refused, which surfaces as
# "Unable to introspect the access token".
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-matrix-auth-to-matrix-synapse
spec:
  selector:
    matchLabels:
      app: matrix-synapse
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/temple-of-time/sa/matrix-auth
      to:
        - operation:
            ports: ["8008"]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-matrix-synapse-to-matrix-auth
spec:
  selector:
    matchLabels:
      app: matrix-auth
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/temple-of-time/sa/matrix-synapse
      to:
        - operation:
            ports: ["8080"]
