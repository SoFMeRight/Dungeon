apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-renovate-to-renovate-redis
spec:
  selector:
    matchLabels:
      app: renovate-redis
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/hyrule-castle/sa/renovate
      to:
        - operation:
            ports: ["6379"]
