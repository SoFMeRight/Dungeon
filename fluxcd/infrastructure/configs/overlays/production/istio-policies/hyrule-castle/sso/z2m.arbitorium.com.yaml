# zigbee2mqtt (public)  ·  SSO required  ·  tier: operator-only  (admits: operator)
#
# Self-contained: this file IS the complete access rule for z2m.arbitorium.com on the
# public cell-membrane gateway. The internal xylem host (z2m.pcfae.com) is deliberately
# UNGATED so the Home Assistant embed keeps working even if OIDC/oauth2-proxy is down.
#   require-login (CUSTOM) → oauth2-proxy proves an SSO session + injects the role header
#   authz (DENY)          → deny unless the injected role is in `admits` below
# notPaths /oauth2/* : the oauth2-proxy sign-in/callback/static paths must bypass the gate
#   (served by the oauth2-proxy-signin-cell-membrane HTTPRoute: z2m.arbitorium.com/oauth2/*).
# Tiers (widen by adding roles to notValues; operator is the floor):
#   operator-only : [operator]   admin: [operator,admin]   trusted: [operator,admin,trusted]
# NOTE: `owner` is carried alongside `operator` during the owner→operator role rename
#   (zero-downtime). Drop `owner` once the Zitadel role is renamed and sessions have cycled.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: sso-z2m-require-login
spec:
  selector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: cell-membrane-gateway
  action: CUSTOM
  provider:
    name: oauth2-proxy
  rules:
    - to:
        - operation:
            hosts:
              - z2m.arbitorium.com
            notPaths:
              - /oauth2/*
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: sso-z2m-authz
spec:
  selector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: cell-membrane-gateway
  action: DENY
  rules:
    - to:
        - operation:
            hosts:
              - z2m.arbitorium.com
            notPaths:
              - /oauth2/*
      when:
        - key: request.headers[x-auth-request-groups]
          notValues:
            - operator     # admits: operator
            - owner        # transitional: owner→operator rename (drop after cutover)
