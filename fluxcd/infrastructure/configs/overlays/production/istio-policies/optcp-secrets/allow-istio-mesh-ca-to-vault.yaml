apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-istio-mesh-ca-to-vault
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: vault
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/optcp-secrets/sa/istio-mesh-ca
      to:
        - operation:
            ports: ["8200"]
