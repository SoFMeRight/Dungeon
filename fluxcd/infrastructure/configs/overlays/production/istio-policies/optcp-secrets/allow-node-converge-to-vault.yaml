apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-node-converge-to-vault
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: vault
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/optcp-infra-admin/sa/node-converge
      to:
        - operation:
            ports: ["8200"]
