apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-csi-addons-to-rbd-ctrlplugin
spec:
  selector:
    matchLabels:
      app: gorons-bracelet.rbd.csi.ceph.com-ctrlplugin
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/gorons-bracelet/sa/csi-addons-controller-manager
      to:
        - operation:
            ports: ["9070"]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-csi-addons-to-rbd-nodeplugin
spec:
  selector:
    matchLabels:
      app: gorons-bracelet.rbd.csi.ceph.com-nodeplugin-csi-addons
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/gorons-bracelet/sa/csi-addons-controller-manager
      to:
        - operation:
            ports: ["9071"]
