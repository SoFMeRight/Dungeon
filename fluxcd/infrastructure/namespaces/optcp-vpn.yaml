apiVersion: v1
kind: Namespace
metadata:
  name: optcp-vpn
  labels:
    name: optcp-vpn
    purpose: vpn
    tenant: optcp                          # openbao-optcp ClusterSecretStore condition
    docker-io-pull-secret: "enabled"
    istio.io/dataplane-mode: ambient
    # privileged: the NetBird subnet router needs NET_ADMIN/MKNOD for WireGuard and
    # subnet routing, which baseline forbids. Nothing else shares this namespace.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: "latest"
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/audit-version: "latest"
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/warn-version: "latest"
