apiVersion: v1
kind: Namespace
metadata:
  name: optcp-swift-sail-privileged
  labels:
    name: optcp-swift-sail-privileged
    purpose: media-acquisition
    tenant: optcp                          # openbao-optcp ClusterSecretStore condition
    docker-io-pull-secret: "enabled"
    istio.io/dataplane-mode: ambient
    # privileged: every pod carries a gluetun VPN sidecar that needs NET_ADMIN and
    # /dev/net/tun, which baseline forbids. Nothing without a tunnel shares it.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: "latest"
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/audit-version: "latest"
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/warn-version: "latest"
