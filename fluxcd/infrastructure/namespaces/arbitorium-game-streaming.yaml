apiVersion: v1
kind: Namespace
metadata:
  name: arbitorium-game-streaming
  labels:
    cr-pcfae-pull-secret: "enabled"
    docker-io-pull-secret: "enabled"
    istio.io/dataplane-mode: ambient
    # Game-streaming seats (steam-headless → Sunshine → Moonlight). privileged PSA: each seat
    # runs Xorg + uinput virtual input devices + hostNetwork, which baseline forbids.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
