apiVersion: v1
kind: Namespace
metadata:
  name: farores-wind
  labels:
    name: farores-wind
    cr-pcfae-pull-secret: "enabled"
    docker-io-pull-secret: "enabled"
    istio.io/dataplane-mode: ambient
    # Zero-trust remote-access tier (NetBird subnet router; Boundary may consolidate here).
    # privileged PSA: the NetBird router needs NET_ADMIN/MKNOD for WireGuard + subnet routing,
    # which baseline forbids. Scoped to this network-pivot tier so the crown-jewel and app
    # namespaces stay baseline.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
