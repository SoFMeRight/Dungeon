apiVersion: v1
kind: Namespace
metadata:
  name: optcp-service-mesh
  labels:
    name: optcp-service-mesh
    purpose: service-mesh
    tenant: optcp                          # openbao-optcp ClusterSecretStore condition
    docker-io-pull-secret: "enabled"
    # Privileged mode required for Istio CNI and ztunnel DaemonSets
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
