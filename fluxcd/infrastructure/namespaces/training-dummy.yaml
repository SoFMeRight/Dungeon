apiVersion: v1
kind: Namespace
metadata:
  name: training-dummy
  labels:
    name: training-dummy
    # Disposable DB-disaster lab: stand up scratch CNPG/Galera clusters, wedge them on
    # purpose, and prove HASteward's recovery deterministically before it touches prod.
    # Everything here is expendable. Mirrors temple-of-time so a sim faithfully reproduces
    # how the real database namespaces run (istio ambient, PSS baseline, pull secrets).
    purpose: db-disaster-sim
    cr-pcfae-pull-secret: "enabled"
    docker-io-pull-secret: "enabled"
    istio.io/dataplane-mode: ambient
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: "latest"
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/audit-version: "latest"
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/warn-version: "latest"
    policy.prplanit.com/restrict-default-sa: "suspended"
