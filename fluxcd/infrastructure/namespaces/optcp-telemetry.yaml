apiVersion: v1
kind: Namespace
metadata:
  name: optcp-telemetry
  labels:
    name: optcp-telemetry
    purpose: host-telemetry
    tenant: optcp                          # openbao-optcp ClusterSecretStore condition
    docker-io-pull-secret: "enabled"
    istio.io/dataplane-mode: ambient
    # privileged: the node agents read the hosts' /var/log and metrics through hostPath,
    # and netalertx scans the LAN with NET_ADMIN and NET_RAW, which baseline forbids.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: "latest"
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/audit-version: "latest"
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/warn-version: "latest"
