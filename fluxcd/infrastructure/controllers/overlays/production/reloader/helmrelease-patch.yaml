apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
spec:
  # Never backed up in gerudo-crest; optcp-operators-baseline is in the Velero
  # schedule for the operators, so reloader opts out to keep that unchanged.
  commonMetadata:
    labels:
      velero.io/exclude-from-backup: "true"
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: reloader
              spec:
                template:
                  metadata:
                    labels:
                      velero.io/exclude-from-backup: "true"
  values:
    fullnameOverride: reloader
    reloader:
      # Nothing reloads unless it carries an annotation naming this controller. The
      # default watches every workload in the cluster, which would let any Secret
      # rotation restart anything referencing it.
      ignoreSecrets: false
      ignoreConfigMaps: false
      watchGlobally: true
      reloadOnCreate: false
      autoReloadAll: false
      deployment:
        resources:
          requests:
            cpu: 2m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
