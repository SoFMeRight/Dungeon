apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
spec:
  targetNamespace: zeldas-lullaby
  values:
    # PolicyExceptions: the scalable exception model for enforce-pod-hardening's larger phases
    # (no-privesc / non-root / RO-root have 25 / 67 / 127 exceptions — name patterns don't scale).
    # Restricted to zeldas-lullaby so exceptions can only be created in this one admin-controlled,
    # flux-managed namespace (a compromised app namespace can't self-except).
    features:
      policyExceptions:
        enabled: true
        namespace: zeldas-lullaby
    admissionController:
      container:
        image:
          registry: ghcr.io
          repository: kyverno/kyverno
      initContainer:
        image:
          registry: ghcr.io
          repository: kyverno/kyvernopre
    backgroundController:
      image:
        registry: ghcr.io
        repository: kyverno/background-controller
    cleanupController:
      image:
        registry: ghcr.io
        repository: kyverno/cleanup-controller
    reportsController:
      image:
        registry: ghcr.io
        repository: kyverno/reports-controller
