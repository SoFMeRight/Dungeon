apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
spec:
  targetNamespace: mr-resetti
  values:
    # Namespaces the admission webhooks must never gate, because the cluster
    # cannot start without them and Kyverno cannot start without the cluster.
    #
    # The cycle, observed on 2026-09-29 after four nodes bounced: istiod could
    # not be created because mutate.kyverno.svc-fail was unreachable; Kyverno
    # could not start because istio-cni reported "no ztunnel connection";
    # ztunnel could not become Ready because the istiod-ca-cert ConfigMap was
    # absent; and that ConfigMap is published by istiod. Nothing in that loop
    # ever succeeds on its own, so it waits forever — it took a human, and a
    # power failure cold-boots all ten nodes at once, which is strictly worse.
    #
    # kube-system is excluded by the chart for exactly this reason. These two
    # belong beside it: king-of-red-lions runs istiod, ztunnel and istio-cni,
    # which every other pod's networking depends on; mr-resetti runs Kyverno,
    # which must never be able to gate its own recovery.
    #
    # The cost is admission-time enforcement in those two namespaces only, and it
    # is close to nothing here:
    #   - the pod-hardening policies are scoped to istio.io/dataplane-mode=ambient
    #     namespaces. king-of-red-lions carries no such label, so they never
    #     applied there at all.
    #   - mutate-pod-hardening already excludes app.kubernetes.io/name=kyverno.
    #   - istiod, ztunnel, cert-manager and kyverno already run with dedicated
    #     ServiceAccounts, drop ALL capabilities and read-only root filesystems;
    #     cert-manager and kyverno already set seccompProfile RuntimeDefault
    #     natively. The guarantees are met by configuration, not by mutation.
    #   - background scanning is unaffected: the reports controller evaluates
    #     resources already in the cluster and does not go through a webhook, so
    #     audit coverage of these namespaces continues.
    # An object, not a list. chart 3.9.x renders this straight into the kyverno
    # ConfigMap's `webhooks` key, and a list there parses to an empty selector —
    # which silently removes even the kube-system exclusion the chart ships by
    # default, leaving every namespace gated. Verified against the live webhook:
    # the object form applied within seconds, the list form produced `{}`.
    config:
      webhooks:
        namespaceSelector:
          matchExpressions:
            - key: kubernetes.io/metadata.name
              operator: NotIn
              values:
                - kube-system
                - king-of-red-lions
                - mr-resetti

    # PolicyExceptions: the scalable exception model for enforce-pod-hardening's larger phases
    # (no-privesc / non-root / RO-root have 25 / 67 / 127 exceptions — name patterns don't scale).
    # Restricted to mr-resetti so exceptions can only be created in this one admin-controlled,
    # flux-managed namespace (a compromised app namespace can't self-except).
    features:
      policyExceptions:
        enabled: true
        namespace: mr-resetti
    # Alloy discovers scrape targets from prometheus.io annotations on pods, not from
    # PodMonitor objects, so kyverno_policy_results_total only reaches VictoriaMetrics
    # if the pods carry these. Without them the Kyverno Policy Violations alert
    # evaluates against a metric nobody collects and can never fire.
    #
    # Both controllers publish that metric and they publish different halves of it:
    # the admission controller reports decisions made at admission, the reports
    # controller reports background scans of resources already in the cluster.
    admissionController:
      podAnnotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
      container:
        image:
          registry: ghcr.io
          repository: kyverno/kyverno
      initContainer:
        image:
          registry: ghcr.io
          repository: kyverno/kyvernopre
    backgroundController:
      image:
        registry: ghcr.io
        repository: kyverno/background-controller
    cleanupController:
      image:
        registry: ghcr.io
        repository: kyverno/cleanup-controller
    reportsController:
      podAnnotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
      image:
        registry: ghcr.io
        repository: kyverno/reports-controller
