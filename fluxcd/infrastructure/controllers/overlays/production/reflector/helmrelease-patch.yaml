apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reflector
spec:
  values:
    fullnameOverride: reflector
    image:
      repository: docker.io/emberstack/kubernetes-reflector
    resources:
      requests:
        cpu: 50m
        memory: 112Mi
      limits:
        cpu: 1350m
        memory: 256Mi
