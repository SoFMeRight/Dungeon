apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cifs-csi-driver
spec:
  releaseName: cifs-csi-driver
  targetNamespace: gorons-bracelet
  chart:
    spec:
      chart: csi-driver-smb
      version: "1.20.3"
      sourceRef:
        kind: HelmRepository
        name: csi-driver-smb
        namespace: flux-system
  interval: 15m
  install:
    createNamespace: true
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    fullnameOverride: "csi-smb"
    # Kept off the control plane.
    controller:
      replicas: 1
      tolerations: []
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
    node:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
    linux:
      tolerations: []
    storageClass:
      create: false  # We'll create our own storage classes
