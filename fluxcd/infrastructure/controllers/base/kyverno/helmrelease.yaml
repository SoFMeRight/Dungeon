apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
spec:
  releaseName: kyverno
  targetNamespace: PLACEHOLDER_NAMESPACE
  install:
    createNamespace: false
  interval: 30m
  chart:
    spec:
      chart: kyverno
      version: "3.10.0"
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: optcp-gitops
  # Uninstalling the release (a namespace move does) must never delete the CRDs, or every
  # policy, PolicyException and policy report goes with them. Since chart 3.10 the crds
  # subchart hard-codes keep on five of its CRDs, so annotating through crds.annotations
  # renders the key twice there and the post-render fails; the patch sets it on every CRD
  # once instead. The policies.kyverno.io CRDs come from the kyverno-api subchart, which
  # takes its own annotations.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: CustomResourceDefinition
            patch: |
              - op: add
                path: /metadata/annotations/helm.sh~1resource-policy
                value: keep
  values:
    fullnameOverride: kyverno
    crds:
      install: true
    kyverno-api:
      annotations:
        helm.sh/resource-policy: keep
    admissionController:
      replicas: 2
    config:
      excludeKyvernoNamespace: false
