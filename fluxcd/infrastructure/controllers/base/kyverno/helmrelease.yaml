apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
spec:
  releaseName: kyverno
  targetNamespace: PLACEHOLDER_NAMESPACE
  install:
    createNamespace: false
  interval: 30m
  chart:
    spec:
      chart: kyverno
      version: "3.10.0"
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: flux-system
  values:
    fullnameOverride: kyverno
    # Uninstalling the release (a namespace move does) must never delete the CRDs, or every
    # ClusterPolicy, PolicyException and policy report goes with them. The policies.kyverno.io
    # CRDs come from the kyverno-api subchart, which takes its own annotations.
    crds:
      install: true
      annotations:
        helm.sh/resource-policy: keep
    kyverno-api:
      annotations:
        helm.sh/resource-policy: keep
    admissionController:
      replicas: 2
    config:
      excludeKyvernoNamespace: false
