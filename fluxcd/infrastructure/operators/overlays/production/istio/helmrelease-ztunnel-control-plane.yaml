# ztunnel on the control-plane nodes, with its own CPU limit; the main release stays off them.
# Runs as the main release's ServiceAccount "ztunnel": istiod issues workload certificates only to
# CA_TRUSTED_NODE_ACCOUNTS=king-of-red-lions/ztunnel. resourceScope: namespace leaves the
# cluster-scoped objects to the main release.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ztunnel-control-plane
spec:
  releaseName: ztunnel-control-plane
  targetNamespace: king-of-red-lions
  interval: 30m
  timeout: 20m
  install:
    timeout: 20m
  upgrade:
    timeout: 20m
  dependsOn:
    - name: istio-base
    - name: istio-cni
    - name: istiod
  chartRef:
    kind: HelmChart
    name: ztunnel
    namespace: flux-system
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: DaemonSet
              name: ztunnel-cp
            patch: |
              - op: replace
                path: /spec/template/spec/serviceAccountName
                value: ztunnel
              # Own app label and selector (the chart hard-codes app: ztunnel); the Cilium
              # policies and the ztunnel-denied alert match both labels.
              - op: replace
                path: /spec/selector/matchLabels/app
                value: ztunnel-control-plane
              - op: replace
                path: /spec/template/metadata/labels/app
                value: ztunnel-control-plane
  values:
    resourceName: ztunnel-cp
    resourceScope: namespace
    hub: docker.io/istio
    variant: distroless
    imagePullSecrets:
      - docker-io-pull-secret
    global:
      istioNamespace: king-of-red-lions
    nodeSelector:
      node-role.kubernetes.io/control-plane: ""
    podAnnotations:
      backup.velero.io/backup-volumes-excludes: tmp
    resources:
      requests:
        cpu: 12m
        memory: 128Mi
      limits:
        cpu: 50m
        memory: 768Mi
    logLevel: info
