# istiod's plugged-in CA (optcp Mesh CA, signed by optcp's root), issued from optcp-mesh-ca
# in fd0bb0615.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cacerts
  namespace: optcp-service-mesh
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-optcp
  target:
    name: cacerts
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        ca-cert.pem: '{{ index . "ca-cert.pem" }}'
        ca-key.pem: '{{ index . "ca-key.pem" }}'
        cert-chain.pem: '{{ index . "cert-chain.pem" }}'
        root-cert.pem: '{{ index . "root-cert.pem" }}'
  dataFrom:
    - extract:
        key: apps/istio-mesh-ca
