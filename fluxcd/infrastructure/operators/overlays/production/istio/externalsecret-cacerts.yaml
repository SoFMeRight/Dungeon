# istiod's plugged-in CA (optcp Mesh CA, signed by optcp's root), from optcp-mesh-ca via the
# one-off istio-mesh-ca Job. root-cert.pem also carries the previous self-signed mesh root
# while workloads move onto the new one; drop root-cert-legacy.pem once they have.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cacerts
  namespace: optcp-service-mesh
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-optcp
  target:
    name: cacerts
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        ca-cert.pem: '{{ index . "ca-cert.pem" }}'
        ca-key.pem: '{{ index . "ca-key.pem" }}'
        cert-chain.pem: '{{ index . "cert-chain.pem" }}'
        root-cert.pem: '{{ index . "root-cert.pem" }}{{ index . "root-cert-legacy.pem" }}'
  dataFrom:
    - extract:
        key: apps/istio-mesh-ca
