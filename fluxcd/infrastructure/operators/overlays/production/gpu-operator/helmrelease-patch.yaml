apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gpu-operator
spec:
  values:
    # Prometheus scraping for operator
    # Kept off the control plane; the chart defaults tolerate and prefer it.
    operator:
      podAnnotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
      tolerations: []
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
    node-feature-discovery:
      master:
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 160Mi
            cpu: 950m
        tolerations: []
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: node-role.kubernetes.io/control-plane
                      operator: DoesNotExist
      worker:
        resources:
          requests:
            cpu: 5m
            memory: 64Mi
          limits:
            memory: 128Mi
            cpu: 464m
        tolerations: []
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: node-role.kubernetes.io/control-plane
                      operator: DoesNotExist
      gc:
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
          limits:
            memory: 128Mi
            cpu: 513m
    # Enable CDI as default mode
    cdi:
      enabled: true
      default: true

    # Node selector - only deploy GPU components to nodes with GPUs
    daemonsets:
      nodeSelector:
        nvidia.com/gpu.present: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        - key: node.cilium.io/agent-not-ready
          operator: Exists
          effect: NoSchedule
      # Not OnDelete: that leaves the DaemonSets stale after a values change and Helm times out.
      updateStrategy: RollingUpdate
      rollingUpdate:
        maxUnavailable: "1"

    # Driver configuration for production
    # Using host-installed drivers - no containerized driver configuration needed
    driver:
      enabled: false

    # Toolkit node selector
    toolkit:
      resources:
        requests:
          cpu: 2m
          memory: 54Mi
        limits:
          cpu: 28m
          memory: 54Mi
      nodeSelector:
        nvidia.com/gpu.present: "true"
      env:
        - name: CDI_ENABLED
          value: "true"
        - name: NVIDIA_CONTAINER_RUNTIME_MODE
          value: "cdi"

    # Device plugin with time-slicing configuration for GPU sharing
    # Profiles sized by GPU capability - more powerful = more slices
    devicePlugin:
      enabled: true
      resources:
        requests:
          cpu: 2m
          memory: 54Mi
        limits:
          cpu: 100m
          memory: 54Mi
      nodeSelector:
        nvidia.com/gpu.present: "true"
      config:
        name: time-slicing-config
        default: any
        create: true
        data:
          # Default fallback
          any: |-
            version: v1
            flags:
              migStrategy: none
            sharing:
              timeSlicing:
                renameByDefault: false
                failRequestsGreaterThanOne: false
                resources:
                - name: nvidia.com/gpu
                  replicas: 16
          # GTX 980 Ti - 6GB Maxwell, base reference
          gtx-980-ti: |-
            version: v1
            flags:
              migStrategy: none
            sharing:
              timeSlicing:
                renameByDefault: false
                failRequestsGreaterThanOne: false
                resources:
                - name: nvidia.com/gpu
                  replicas: 16
          # RTX A2000 12GB - 1.4x base TFLOPS
          rtx-a2000: |-
            version: v1
            flags:
              migStrategy: none
            sharing:
              timeSlicing:
                renameByDefault: false
                failRequestsGreaterThanOne: false
                resources:
                - name: nvidia.com/gpu
                  replicas: 24
          # RTX 3080 Ti 12GB - 6x base TFLOPS
          rtx-3080-ti: |-
            version: v1
            flags:
              migStrategy: none
            sharing:
              timeSlicing:
                renameByDefault: false
                failRequestsGreaterThanOne: false
                resources:
                - name: nvidia.com/gpu
                  replicas: 96

    # DCGM exporter node selector
    dcgmExporter:
      resources:
        requests:
          cpu: 31m
          memory: 563Mi
        limits:
          cpu: 83m
          memory: 563Mi
      nodeSelector:
        nvidia.com/gpu.present: "true"
      podAnnotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9400"

    # GPU Feature Discovery node selector
    gfd:
      resources:
        requests:
          cpu: 3m
          memory: 72Mi
        limits:
          cpu: 114m
          memory: 72Mi
      nodeSelector:
        nvidia.com/gpu.present: "true"

    # Validator - disabled in production (CDI mode doesn't require validation)
    validator:
      enabled: false
      # Also applies to the *-validation init containers.
      resources:
        requests:
          cpu: 2m
          memory: 32Mi
        limits:
          cpu: 20m
          memory: 32Mi

    # Node status exporter
    nodeStatusExporter:
      enabled: true
      resources:
        requests:
          cpu: 2m
          memory: 86Mi
        limits:
          cpu: 880m
          memory: 86Mi
