# The nvidia-userns CRI-O handler (ansible/k8s/tuning/crio-nvidia-userns.yaml): the NVIDIA
# runtime, allowing only io.kubernetes.cri-o.cgroup2-mount-hierarchy-rw, so a user-namespace
# game-streaming seat can run systemd. The handler exists only on the seat node.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: nvidia-userns
handler: nvidia-userns
scheduling:
  nodeSelector:
    kubernetes.io/hostname: dungeon-chest-004
