apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
spec:
  targetNamespace: optcp-service-mesh
  # Note: Chart already sets prometheus.io/scrape annotations by default
  values:
    webhook:
      podLabels:
        policy.prplanit.com/webhook: "true"
    extraArgs:
      - --dns01-recursive-nameservers=1.1.1.1:53,1.0.0.1:53
      - --dns01-recursive-nameservers-only
