apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plugin-barman-cloud
spec:
  targetNamespace: gorons-bracelet
  values:
    # The chart ships no requests, which would leave the component that gates every
    # cluster's WAL archiving in BestEffort and first to be reclaimed under node pressure.
    resources:
      requests:
        memory: "128Mi"
        cpu: "50m"
      limits:
        memory: "512Mi"
        cpu: "500m"
