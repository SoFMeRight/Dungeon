# istio-meshmedic on the control-plane nodes, built from the main overlay so it carries the same
# image and arguments. Only the DaemonSet is emitted: it runs as the main ServiceAccount, and
# the SA/RBAC are dropped here so the root build holds one copy of each and nothing cross-wires.
# The main DaemonSet has no CPU limit (it peaks at 568m on the workers); on the control plane it
# peaks at 24m (30d, 15s), so this instance is bounded at 36m (x1.5).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../istio-meshmedic
patches:
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: istio-meshmedic
        namespace: king-of-red-lions
  - patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: istio-meshmedic
  - patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: istio-meshmedic
  - target:
      kind: DaemonSet
      name: istio-meshmedic
    patch: |-
      - op: replace
        path: /metadata/name
        value: istio-meshmedic-control-plane
      # Its own app label and selector, so the main DaemonSet's selector (app: istio-meshmedic) does
      # not match these pods and vice versa. A selector is immutable, so Flux recreates the
      # DaemonSet when it changes.
      - op: add
        path: /metadata/annotations
        value:
          kustomize.toolkit.fluxcd.io/force: enabled
      - op: replace
        path: /spec/selector/matchLabels/app
        value: istio-meshmedic-control-plane
      - op: replace
        path: /spec/template/metadata/labels/app
        value: istio-meshmedic-control-plane
      - op: remove
        path: /spec/template/spec/affinity
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          node-role.kubernetes.io/control-plane: ""
      - op: replace
        path: /spec/template/spec/tolerations
        value:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule
      - op: add
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "36m"
