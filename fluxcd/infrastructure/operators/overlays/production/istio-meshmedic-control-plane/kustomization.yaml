# istio-meshmedic on the control-plane nodes, with its own CPU limit, built from the main overlay.
# Only the DaemonSet is emitted: it runs as the main ServiceAccount, and a second SA/RBAC copy
# in the root build would cross-wire the bindings.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../istio-meshmedic
patches:
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: istio-meshmedic
        namespace: king-of-red-lions
  - patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: istio-meshmedic
  - patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: istio-meshmedic
  - target:
      kind: DaemonSet
      name: istio-meshmedic
    patch: |-
      - op: replace
        path: /metadata/name
        value: istio-meshmedic-control-plane
      # Own app label and selector, distinct from the main DaemonSet's (app: istio-meshmedic).
      - op: add
        path: /metadata/annotations
        value:
          kustomize.toolkit.fluxcd.io/force: enabled
      - op: replace
        path: /spec/selector/matchLabels/app
        value: istio-meshmedic-control-plane
      - op: replace
        path: /spec/template/metadata/labels/app
        value: istio-meshmedic-control-plane
      - op: remove
        path: /spec/template/spec/affinity
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          node-role.kubernetes.io/control-plane: ""
      - op: replace
        path: /spec/template/spec/tolerations
        value:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule
      - op: add
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "36m"
