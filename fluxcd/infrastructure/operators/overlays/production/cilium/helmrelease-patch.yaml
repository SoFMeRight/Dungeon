apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
spec:
  values:
    k8sServiceHost: "172.22.144.105"

    # Enable IPv6 for external connectivity
    ipv6:
      enabled: true

    operator:
      replicas: 1
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
    # eBPF native datapath configuration
    bpf:
      # Disable BPF masquerade for Istio Ambient compatibility
      # (falls back to iptables masquerade - Istio rewrites health probe source IPs
      # to 169.254.7.127 which BPF masquerade breaks before Istio can process them)
      # See: https://github.com/cilium/cilium/issues/36022
      masquerade: false
      # Enable additional BPF features for better performance
      lbExternalClusterIP: true

    # Use DSR mode for load balancers (preserves source IPs)
    loadBalancer:
      mode: dsr
      acceleration: native
      algorithm: maglev
      serviceTopology: true
      # DSR dispatch mode. 'opt' is the lowest-overhead dispatch and the correct one
      # for this cluster: native routing + dual-stack + XDP acceleration, on a fabric
      # we own end to end. It carries the service VIP:port in an IPv4 IP-Option /
      # IPv6 Destination-Option header — both XDP-safe, so IPv6 LB DSR works under
      # acceleration: native (geneve has NO XDP code path for IPv6 DSR, so it would
      # break cross-node v6 dispatch here). 'geneve'/'ipip' exist only for underlays
      # that strip IP options (public cloud) or for overlay routingMode — neither
      # applies to us — and geneve adds ~50B encap that cuts the MTU for jumbo-frame
      # (Ceph) traffic. If a fabric ever dropped the option, the fallback is geneve.
      dsrDispatch: opt

    # NodePort configuration for eBPF
    nodePort:
      enabled: true
      mode: dsr

    # Enable auto-direct routes between nodes (eBPF native)
    autoDirectNodeRoutes: true

    # Enable masquerading ONLY for traffic going outside the cluster
    enableIPv4Masquerade: true

    # Cluster-specific network configuration
    # Native routing (no masquerade) for pod network - this is the key!
    # Traffic within this CIDR uses eBPF native routing without any NAT
    ipv4NativeRoutingCIDR: "192.168.144.0/20"
    # MUST contain the real IPv6 pod CIDR, or v6 pod/DSR traffic is masqueraded
    # (enable-ipv6-masquerade: true) and LoadBalancer DSR replies lose the VIP src,
    # breaking all v6 LB VIPs while v4 works. Pods live in fc00:f1:ca4:15xx::; the
    # old fc00:f1:d759::/64 value matched nothing. This is the documented Pod CIDR.
    ipv6NativeRoutingCIDR: "fc00:f1:0ca4:15a0::/56"

    # Also configure routing mode explicitly
    routingMode: native

    # No tunnel: routingMode is native and 'opt' DSR dispatch adds no encapsulation,
    # so no tunnel protocol is needed. (Only geneve DSR dispatch would force this to
    # 'geneve'; we use opt.)
    tunnelProtocol: ""

    # L2 announcements disabled - using BGP instead
    l2announcements:
      enabled: false

    # Additional performance optimizations
    bpfClockProbe: true

    # Istio Ambient mode compatibility - limit socket LB to host namespace
    # Prevents Cilium from interfering with Istio's traffic redirection
    # See: https://docs.cilium.io/en/stable/network/servicemesh/istio/
    socketLB:
      hostNamespaceOnly: true

    # CNI configuration for Istio Ambient mode compatibility
    cni:
      exclusive: false

    # Enable endpoint routes for better performance
    endpointRoutes:
      enabled: true

    # Enable host routing - REQUIRED for LoadBalancer with native routing
    hostRouting: true

    # Hubble UI service configuration
    envoy:
      resources:
        requests:
          cpu: 23m
          memory: 75Mi
        limits:
          cpu: 3410m
          memory: 75Mi
    hubble:
      relay:
        resources:
          requests:
            cpu: 3m
            memory: 76Mi
          limits:
            cpu: 76m
            memory: 76Mi
      ui:
        backend:
          resources:
            requests:
              cpu: 2m
              memory: 71Mi
            limits:
              cpu: 105m
              memory: 71Mi
        frontend:
          resources:
            requests:
              cpu: 2m
              memory: 23Mi
            limits:
              cpu: 30m
              memory: 23Mi
        podLabels:
          policy.prplanit.com/ingress: "true"
        service:
          type: ClusterIP
