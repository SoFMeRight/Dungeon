apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: velero
  namespace: flux-system
spec:
  targetNamespace: fairy-bottle
  values:
    # Note: Chart already sets prometheus.io/scrape and prometheus.io/port annotations by default
    image:
      pullSecrets:
        - cr-pcfae-admin-pull-secret
    initContainers:
      - name: velero-plugin-for-aws
        image: docker.io/velero/velero-plugin-for-aws:v1.14.4
        imagePullPolicy: IfNotPresent
        volumeMounts:
          - mountPath: /target
            name: plugins
    configuration:
      # Enable CSI snapshots feature
      features: EnableCSI

      clientQPS: 100
      clientBurst: 200

      backupStorageLocation:
        - name: default
          provider: aws
          bucket: prplanit-dungeon-velero
          default: true
          accessMode: ReadWrite
          config:
            region: us-east-1
            s3ForcePathStyle: "true"
            s3Url: http://172.22.150.101:8333
            insecureSkipTLSVerify: "true"

      volumeSnapshotLocation:
        - name: default
          provider: csi

    credentials:
      existingSecret: velero-minio-credentials

    nodeAgent:
      # Kept off the control plane. A pod with an fs-backup volume on a node without an agent
      # fails the backup, so pods there exclude their volumes (backup-volumes-excludes).
      tolerations: []
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      podVolumePath: /var/lib/kubelet/pods
      privileged: false
      keepLatestMaintenanceJobs: 3
      resources:
        requests:
          memory: 200Mi
          cpu: 100m
        limits:
          memory: 1Gi
          cpu: 1287m

    resources:
      requests:
        memory: 128Mi
        cpu: 100m
      limits:
        # 1Gi: a backup of this cluster walks 300+ RBD volumes and 700+
        # snapshots, which needs more than 512Mi. The request stays low
        # because the server is idle between runs.
        memory: 1Gi
        cpu: 1090m

    schedules:
      daily-backup:
        disabled: false
        schedule: "0 2 * * *"
        template:
          ttl: "720h0m0s"
          # File-level backups, so volume contents are captured independently
          # of Ceph and its snapshots.
          defaultVolumesToFsBackup: true
          snapshotVolumes: false
          # Only Ceph (rbd/cephfs) volumes are backed up; NAS CIFS/SMB
          # (smb.csi.k8s.io) is skipped by driver -- see the velero-volume-policy
          # ConfigMap.
          resourcePolicy:
            kind: configmap
            name: velero-volume-policy
          includedNamespaces:
            # Administrative services (vault, weave, zitadel)
            - zeldas-lullaby
            # Archival/Content Management & Media Servers
            - temple-of-time
            # Cloud & collaboration (namespace plan rev1, group Y/Z)
            - optcp-cloud
            # Discovery & Dashboards
            - lost-woods
            # Monitoring services
            - gossip-stone
            # IDS/IPS/SIEM security monitoring
            - lens-of-truth
            # Game servers
            - shooting-gallery
            - optcp-shooting-gallery
            # Gateway for internal-only services
            - arylls-lookout
            # Gateway for personal/public services
            - kokiri-forest
            # Gateway for business/work services (GitLab!)
            - hyrule-castle
            # PrPlanIT client-facing business apps (namespace plan, group A)
            - prplanit
            # Routing & Gateway infrastructure
            - king-of-red-lions
            # RDP/remote control services
            - hookshot
            # Arr apps & downloaders
            - swift-sail
            # Restricted/privileged services
            - pedestal-of-time
            # Mail services
            - delivery-bag
            # Bot protection & security services
            - wallmaster
            # Tools w/o userdata
            - tingle-tuner
            # Storage services
            - gorons-bracelet
            # DNS & NTP services
            - compass
          excludedResources:
            - events
            - events.events.k8s.io
          storageLocation: default
