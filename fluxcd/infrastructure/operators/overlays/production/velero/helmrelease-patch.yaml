apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: velero
  namespace: flux-system
spec:
  targetNamespace: optcp-fairy-bottle
  values:
    # Note: Chart already sets prometheus.io/scrape and prometheus.io/port annotations by default
    image:
      pullSecrets:
        - pull-secret-cr-optcp-optcp-k8s-dungeon-public
    initContainers:
      - name: velero-plugin-for-aws
        image: docker.io/velero/velero-plugin-for-aws:v1.14.4
        imagePullPolicy: IfNotPresent
        volumeMounts:
          - mountPath: /target
            name: plugins
    configuration:
      # Enable CSI snapshots feature
      features: EnableCSI

      clientQPS: 100
      clientBurst: 200

      backupStorageLocation:
        - name: default
          provider: aws
          bucket: prplanit-dungeon-velero
          default: true
          accessMode: ReadWrite
          config:
            region: us-east-1
            s3ForcePathStyle: "true"
            s3Url: http://172.22.150.101:8333
            insecureSkipTLSVerify: "true"

      volumeSnapshotLocation:
        - name: default
          provider: csi

    credentials:
      existingSecret: velero-minio-credentials

    nodeAgent:
      # Kept off the control plane. A pod with an fs-backup volume on a node without an agent
      # fails the backup, so pods there exclude their volumes (backup-volumes-excludes).
      tolerations: []
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      podVolumePath: /var/lib/kubelet/pods
      privileged: false
      keepLatestMaintenanceJobs: 3
      resources:
        requests:
          memory: 200Mi
          cpu: 100m
        limits:
          memory: 1Gi
          cpu: 1287m

    resources:
      requests:
        memory: 128Mi
        cpu: 100m
      limits:
        # 1Gi: a backup of this cluster walks 300+ RBD volumes and 700+
        # snapshots, which needs more than 512Mi. The request stays low
        # because the server is idle between runs.
        memory: 1Gi
        cpu: 1090m

    schedules:
      daily-backup:
        disabled: false
        schedule: "0 2 * * *"
        template:
          ttl: "720h0m0s"
          # File-level backups, so volume contents are captured independently
          # of Ceph and its snapshots.
          defaultVolumesToFsBackup: true
          snapshotVolumes: false
          # Only Ceph (rbd/cephfs) volumes are backed up; NAS CIFS/SMB
          # (smb.csi.k8s.io) is skipped by driver -- see the velero-volume-policy
          # ConfigMap.
          resourcePolicy:
            kind: configmap
            name: velero-volume-policy
          includedNamespaces:
            # Remote access: netbird, boundary (namespace plan, group AM)
            - optcp-remote-access
            # Infrastructure management: unifi-network-application, semaphore (namespace plan, group AG)
            - optcp-infrastructure-management
            # IPAM: netbox (namespace plan, group AQ)
            - optcp-ipam
            # Secrets: openbao, bank-vaults, external-secrets (namespace plan, group AP)
            - optcp-secrets
            # Identity: zitadel, oauth2-proxy (namespace plan, group H)
            - optcp-identity
            # Credential vaults: vaultwarden, twofauth (namespace plan, group AH)
            - optcp-keyring
            # Cloud & collaboration (namespace plan rev1, group Y/Z)
            - optcp-cloud
            # Staff suite (namespace plan, group AO)
            - optcp-staff-suite
            # Personal comms (namespace plan, group B)
            - kai-personal
            # Discovery & Dashboards
            - optcp-app-directory
            # Monitoring services
            - optcp-gossip-stone
            - optcp-management-dashboards
            - optcp-monitoring-agents
            # IDS/IPS/SIEM security monitoring
            - lens-of-truth
            - arbitorium-home
            - arbitorium-nvr
            - arbitorium-restricted
            # Game servers and media libraries
            - optcp-media
            - optcp-shooting-gallery
            # Gateway for internal-only services
            - optcp-ingress-internal
            - kai-ingress-private
            # Public sites: Kai, astralfocal, enamorafoto (namespace plan, group AR)
            - optcp-web
            # Web analytics (namespace plan)
            - optcp-web-analytics
            # OutspokeKin chat, social platform and brand site
            - outspokekin-delivery-bag
            - outspokekin-social
            - outspokekin-web
            # PrPlanIT business sites
            - prplanit-web
            # YesImVegan site and public resources
            - yesimvegan-web
            # Supply chain: GitLab (namespace plan, group V)
            - optcp-supply-chain
            # CI runners: gitlab-runner, buildkitd, renovate (namespace plan, group AL)
            - optcp-ci-runners
            # PrPlanIT support (namespace plan, group A)
            - prplanit-support
            # PrPlanIT MSP, billing, commerce and staff suite (namespace plan, groups C-F)
            - prplanit-billing
            - prplanit-commerce
            - prplanit-remote-access
            - prplanit-staff-suite
            # Routing & Gateway infrastructure
            - king-of-red-lions
            # Arr apps & downloaders
            - optcp-swift-sail
            - optcp-swift-sail-privileged
            # Restricted/privileged services
            - kai-private
            - optcp-restricted
            # Comms and mail: stalwart, bulwark (namespace plan, group AD)
            - optcp-delivery-bag
            # Bot protection & security services
            # Tools w/o userdata
            - optcp-ai
            - optcp-tools
            # Storage services
            - gorons-bracelet
            # Operators: CNPG, barman, MariaDB, Redis (namespace plan, group B).
            # reflector and reloader carry velero.io/exclude-from-backup: they
            # were never backed up in gerudo-crest.
            - optcp-operators-baseline
            # DNS & NTP services
            - optcp-network-services
          excludedResources:
            - events
            - events.events.k8s.io
          storageLocation: default
