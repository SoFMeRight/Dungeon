apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ./bank-vaults
  - ./ceph-rook-ceph
  - ./cert-manager
  - ./gateway-api-crds
  - ./cilium
  - ./cloudnative-pg
  - ./plugin-barman-cloud
  - ./external-secrets
  - ./gpu-operator
  - ./istio
  - ./istio-meshmedic
  - ./mariadb-operator-crds
  - ./mariadb-operator
  - ./redis-operator
  - ./snapshot-controller
  - ./strimzi-kafka-operator
  - ./velero

patches:
  # Durable resilience: every HelmRelease auto-retries a transient upgrade failure
  # (e.g. a readiness-wait timeout during cluster churn) instead of latching
  # UpgradeFailed until a manual force. retries:3 matches the house convention;
  # new HRs in this overlay inherit it automatically.
  - target:
      kind: HelmRelease
    patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: all-helmreleases
      spec:
        upgrade:
          remediation:
            retries: 3
