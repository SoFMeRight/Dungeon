# Production standing policy (proven on this cluster): heal Ready orphans, and
# heal not-Ready orphans that stay orphaned past the grace period. The orphan
# filter bounds churn — a pod that re-enrolls drops out of scope.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: istio-meshmedic
  namespace: king-of-red-lions
spec:
  template:
    spec:
      containers:
        - name: agent
          # Pinned to a released version, never a dev tag or :latest-dev — release
          # retention prunes dev tags, which leaves the DaemonSet unschedulable on
          # any node that has not cached the image.
          image: docker.io/prplanit/istio-meshmedic:v0.0.2
          imagePullPolicy: IfNotPresent
          args:
            - agent
            - --interval=60s
            - --confirm=15s
            - --grace-period=5m
            - --auto-repair=true
            - --repair-stuck=true
            - --metrics-addr=:9100
