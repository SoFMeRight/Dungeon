# Resources for the Ceph CSI containers, on the Driver CRs Rook created (it writes them only at
# creation). ssa: Merge applies only these fields; prune: disabled keeps the Drivers if this file goes.
apiVersion: csi.ceph.io/v1
kind: Driver
metadata:
  name: gorons-bracelet.rbd.csi.ceph.com
  namespace: gorons-bracelet
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: Merge
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  deployCsiAddons: true
  controllerPlugin:
    resources:
      plugin:
        requests:
          cpu: 10m
          memory: 57Mi
        limits:
          cpu: 815m
          memory: 128Mi
      liveness:
        requests:
          cpu: 5m
          memory: 22Mi
        limits:
          cpu: 50m
          memory: 96Mi
      addons:
        requests:
          cpu: 5m
          memory: 32Mi
        limits:
          cpu: 1430m
          memory: 64Mi
      attacher:
        requests:
          cpu: 4m
          memory: 86Mi
        limits:
          cpu: 126m
          memory: 86Mi
      provisioner:
        requests:
          cpu: 15m
          memory: 104Mi
        limits:
          cpu: 1320m
          memory: 104Mi
      resizer:
        requests:
          cpu: 10m
          memory: 80Mi
        limits:
          cpu: 100m
          memory: 80Mi
      snapshotter:
        requests:
          cpu: 3m
          memory: 74Mi
        limits:
          cpu: 214m
          memory: 74Mi
  nodePlugin:
    resources:
      plugin:
        requests:
          cpu: 11m
          memory: 204Mi
        limits:
          cpu: 3960m
          memory: 256Mi
      liveness:
        requests:
          cpu: 5m
          memory: 48Mi
        limits:
          cpu: 186m
          memory: 112Mi
      addons:
        requests:
          cpu: 5m
          memory: 32Mi
        limits:
          cpu: 1320m
          memory: 64Mi
      registrar:
        requests:
          cpu: 2m
          memory: 27Mi
        limits:
          cpu: 233m
          memory: 27Mi
---
