# Resources for the Ceph CSI sidecars. The Driver CRs were created by Rook (ceph-csi-operator
# renders the ctrlplugin/nodeplugin workloads from them); Rook 1.21 no longer takes CSI resource
# settings, so they are set here. Rook writes a Driver only when it creates it, so these values
# hold. ssa: Merge applies only these fields and leaves the rest of the spec alone; prune:
# disabled keeps the drivers if this file is ever removed. Sidecar values from 30d usage
# (2026-10-25): request = p50 x 1.2, CPU limit = 1-minute peak x 1.25, memory = peak x 1.15.
# plugin and liveness (2026-10-27): CPU request = 30d p50 x 1.2 with a 10m floor for the plugin
# and 5m for liveness, CPU limit = 7d 15-second peak x 1.5 with a 50m floor, memory request =
# 30d peak x 1.15, memory limit = max(30d peak x 1.3, peak + 64Mi).
apiVersion: csi.ceph.io/v1
kind: Driver
metadata:
  name: gorons-bracelet.rbd.csi.ceph.com
  namespace: gorons-bracelet
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: Merge
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  deployCsiAddons: true
  controllerPlugin:
    resources:
      plugin:
        requests:
          cpu: 10m
          memory: 57Mi
        limits:
          cpu: 815m
          memory: 128Mi
      liveness:
        requests:
          cpu: 5m
          memory: 22Mi
        limits:
          cpu: 50m
          memory: 96Mi
      addons:
        requests:
          cpu: 5m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
      attacher:
        requests:
          cpu: 4m
          memory: 86Mi
        limits:
          cpu: 126m
          memory: 86Mi
      provisioner:
        requests:
          cpu: 15m
          memory: 104Mi
        limits:
          cpu: 416m
          memory: 104Mi
      resizer:
        requests:
          cpu: 10m
          memory: 80Mi
        limits:
          cpu: 100m
          memory: 80Mi
      snapshotter:
        requests:
          cpu: 3m
          memory: 74Mi
        limits:
          cpu: 214m
          memory: 74Mi
  nodePlugin:
    resources:
      plugin:
        requests:
          cpu: 11m
          memory: 204Mi
        limits:
          cpu: 1427m
          memory: 256Mi
      liveness:
        requests:
          cpu: 5m
          memory: 48Mi
        limits:
          cpu: 186m
          memory: 112Mi
      addons:
        requests:
          cpu: 5m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
      registrar:
        requests:
          cpu: 2m
          memory: 27Mi
        limits:
          cpu: 233m
          memory: 27Mi
---
