apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-operator
spec:
  targetNamespace: gorons-bracelet
  chart:
    spec:
      # renovate: datasource=helm depName=rook-ceph registryUrl=https://charts.rook.io/release
      version: "v1.20.6"
  values:
    csi:
      enableCSIHostNetwork: true
    resources:
      limits:
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
