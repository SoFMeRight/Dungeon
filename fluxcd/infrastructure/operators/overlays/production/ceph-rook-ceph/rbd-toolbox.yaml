# Ceph toolbox for the disaster scripts (bash/disaster/ceph, ansible/k8s/rbd-rook-migrat*).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rbd-toolbox
  namespace: gorons-bracelet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rbd-toolbox
  template:
    metadata:
      labels:
        app: rbd-toolbox
    spec:
      containers:
        - name: rbd
          image: quay.io/ceph/ceph:v19.2.7@sha256:3fc0a79f1c671f0e75be24ba77a4ab32227e5ea080e16dfc0840a1dc6c30bf7e
          command:
            - sleep
            - infinity
          env:
            - name: CEPH_ARGS
              value: --id dungeon-provisioner
          resources:
            requests:
              cpu: 2m
              memory: 79Mi
            limits:
              cpu: 2234m
              memory: 79Mi
          volumeMounts:
            - name: ceph-config
              mountPath: /etc/ceph
      volumes:
        - name: ceph-config
          projected:
            sources:
              - configMap:
                  name: rbd-toolbox-ceph-config
              - secret:
                  name: rbd-toolbox-keyring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rbd-toolbox-ceph-config
  namespace: gorons-bracelet
data:
  ceph.conf: |
    [global]
    fsid = 0985467c-d8f3-4483-b27f-f0a512397ec2
    mon_host = [fc00:f1:ada:104e:1ace::1]:6789,[fc00:f1:ada:104e:1ace::2]:6789,[fc00:f1:ada:104e:1ace::3]:6789,[fc00:f1:ada:104e:1ace::4]:6789,[fc00:f1:ada:104e:1ace::5]:6789
