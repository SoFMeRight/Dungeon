apiVersion: apps/v1
kind: Deployment
metadata:
  name: snapshot-controller
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: snapshot-controller
          image: registry.k8s.io/sig-storage/snapshot-controller:v8.7.0
          resources:
            requests:
              cpu: 11m
              memory: 94Mi
            limits:
              cpu: 1273m
              memory: 94Mi
          args:
            - "--leader-election=true"
            - "--leader-election-namespace=fairy-bottle"
