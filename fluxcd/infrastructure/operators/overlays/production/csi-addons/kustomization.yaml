apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gorons-bracelet

resources:
  - ../../../base/csi-addons

patches:
  - path: deployment-patch.yaml
    target:
      kind: Deployment
      name: csi-addons-controller-manager
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata:
        name: csi-addons-system
