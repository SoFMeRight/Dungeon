apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Pinned to v1.5.1 to match Istio 1.30's Gateway API dependency (v1.5.1): Istio
  # 1.30 reads TLSRoute/ReferenceGrant from the standard channel and expects the
  # v1.5 API surface, so v1.2.1 was a latent mismatch. v1.5 also ships the
  # safe-upgrades ValidatingAdmissionPolicy that blocks installing CRDs < v1.5.0.
  - https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.5.1/standard-install.yaml
