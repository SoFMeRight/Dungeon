apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-cni
spec:
  releaseName: istio-cni
  targetNamespace: king-of-red-lions
  interval: 30m
  # A per-node CNI DaemonSet rolls node-by-node and routinely exceeds helm's 5m default
  # wait, so the upgrade converges on-cluster but helm reports a timeout and the release
  # goes NotReady — blocking dependents (ztunnel). Give the rollout room on both install
  # and upgrade.
  timeout: 20m
  install:
    timeout: 20m
  upgrade:
    timeout: 20m
  dependsOn:
    - name: istio-base
  chart:
    spec:
      chart: cni
      version: "1.30.1"
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: flux-system
      interval: 12h
  values:
    # CNI configuration for Ambient mode
    cni:
      # Use Cilium's CNI paths
      cniBinDir: /opt/cni/bin
      cniConfDir: /etc/cni/net.d

      # Chain with Cilium's CNI config (CRITICAL for Cilium + Istio)
      chained: true
      cniConfFileName: 05-cilium.conflist

      # Istio-owned CNI config: write a dedicated, persistent conflist
      # (02-istio-cni.conflist) containing Cilium's config + the Istio plugin, so the
      # ambient redirect survives Cilium/agent reconciles and node reboots. Without it,
      # Istio's chained entry in 05-cilium.conflist is transiently lost, missing pods
      # during iptables reconciliation -> ambient orphans (flapping capture). It
      # EXTENDS, never replaces, the primary CNI; requires chained + ambient (set
      # above); Cilium is cni-exclusive=false so it coexists. Ref istio/istio#55968.
      istioOwnedCNIConfig: true

      # Ambient mode requires privileged CNI
      privileged: true

      # Ambient mode configuration
      ambient:
        enabled: true

      # Log level
      logLevel: info

      # Exclude namespaces from Istio CNI
      excludeNamespaces:
        - king-of-red-lions
        - kube-system
        - kube-public
        - kube-node-lease
        - flux-system
