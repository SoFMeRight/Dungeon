# The ztunnel chart, shared by the ztunnel and ztunnel-control-plane HelmReleases through chartRef.
# One version for both: ztunnel-control-plane runs as the main release's ServiceAccount, so the two
# must never run different chart versions. Bump the version here only.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmChart
metadata:
  name: ztunnel
  namespace: flux-system
spec:
  chart: ztunnel
  version: "1.31.2"
  sourceRef:
    kind: HelmRepository
    name: istio
  interval: 12h
  reconcileStrategy: ChartVersion
