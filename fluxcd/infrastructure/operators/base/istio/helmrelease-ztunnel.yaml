apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ztunnel
spec:
  releaseName: ztunnel
  targetNamespace: king-of-red-lions
  interval: 30m
  # ztunnel is also a per-node DaemonSet — same rollout-timeout need as istio-cni, else
  # its upgrade hits helm's 5m default wait and reports a false timeout.
  timeout: 20m
  install:
    timeout: 20m
  upgrade:
    timeout: 20m
  dependsOn:
    - name: istio-base
    - name: istio-cni
    - name: istiod
  chart:
    spec:
      chart: ztunnel
      version: "1.29.1"
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: flux-system
      interval: 12h
  values:
    # ztunnel is the core of Ambient mode
    # Handles L4 mTLS between pods

    # Override namespace to king-of-red-lions instead of istio-system
    global:
      istioNamespace: king-of-red-lions

    # Resources for ztunnel DaemonSet
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 1000m
        memory: 768Mi

    # Enable debug logging initially for troubleshooting
    logLevel: info
