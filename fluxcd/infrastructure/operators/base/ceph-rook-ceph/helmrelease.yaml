apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-operator
spec:
  releaseName: rook-ceph-operator
  targetNamespace: PLACEHOLDER_NAMESPACE
  interval: 30m
  # Uninstalling the release (a namespace move does) must never delete the CRDs, or every
  # Driver, ClientProfile and CephConnection goes with them, and the CSI pods after. The
  # ceph-csi-operator subchart has no value for it, so the post-renderer adds the keep policy.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: CustomResourceDefinition
              name: ".*\\.csi\\.ceph\\.io"
            patch: |
              apiVersion: apiextensions.k8s.io/v1
              kind: CustomResourceDefinition
              metadata:
                name: csi-ceph-crds
                annotations:
                  helm.sh/resource-policy: keep
  chart:
    spec:
      chart: rook-ceph
      version: "PLACEHOLDER_VERSION"
      sourceRef:
        kind: HelmRepository
        name: rook-release
        namespace: flux-system
      interval: 12h
  values:
    fullnameOverride: "rook-ceph-operator"
    crds:
      enabled: true
