apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: redis-operator
spec:
  releaseName: redis-operator
  targetNamespace: PLACEHOLDER_NAMESPACE
  install:
    createNamespace: false
  interval: 30m
  chart:
    spec:
      chart: redis-operator
      version: "0.27.0"
      sourceRef:
        kind: HelmRepository
        name: redis-operator
        namespace: flux-system
  values:
    redisOperator:
      replicas: 2
    # Requests from 7d usage (2026-10-27): CPU p99 49m, memory peak 39Mi. The limits are the
    # chart's defaults.
    resources:
      requests:
        cpu: 60m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 500Mi
