apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gpu-operator
spec:
  interval: 30m
  chart:
    spec:
      chart: gpu-operator
      version: v26.7.0
      sourceRef:
        kind: HelmRepository
        name: nvidia
      interval: 12h
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # Enable CDI as default mode
    cdi:
      enabled: true
      default: true

    # Operator configuration
    operator:
      defaultRuntime: crio
      runtimeClass: nvidia

    # Driver configuration - using host-installed drivers from Ubuntu repos
    driver:
      enabled: false
      # Host-installed nvidia-driver-580 from Ubuntu repositories (Canonical-signed)
      # This approach allows using latest kernel with Secure Boot enabled
      # GPU Operator manages device plugin, monitoring, CDI, etc. without managing drivers

    # Toolkit configuration
    toolkit:
      enabled: true
      env:
        - name: NVIDIA_CONTAINER_RUNTIME_MODE
          value: "cdi"
        - name: CDI_ENABLED
          value: "true"

    # Device plugin configuration
    devicePlugin:
      enabled: true

    # DCGM exporter for GPU metrics
    dcgmExporter:
      enabled: true

    # GPU Feature Discovery
    gfd:
      enabled: true

    # MIG Manager (Multi-Instance GPU)
    migManager:
      enabled: false

    # Node Feature Discovery
    nfd:
      enabled: true

    # Validator
    validator:
      enabled: true
      # Held behind the chart on purpose. dungeon-chest-004 runs a GTX 980 Ti --
      # Maxwell, compute capability 5.2 -- and the validator image from v26.x is
      # built against a CUDA that no longer supports it. Its vectorAdd segfaults
      # there (exit 139) while the same binary from v25.10.1 passes on the same
      # card and the same host driver, so the card is fine and the CUDA is not.
      #
      # This is load-bearing, not cosmetic: a failed cuda-validation never writes
      # /run/nvidia/validations/cuda-ready or plugin-ready, so the node's GPU
      # capacity is advertised by a device plugin the operator never confirmed.
      #
      # Only this image is held; the device plugin, toolkit, DCGM and NFD track
      # the chart. It stops receiving CVE fixes for as long as it is pinned.
      # Remove the pin when the 980 Ti is replaced -- nothing else lifts it.
      version: v25.10.1
