# The CNPG-I backup plugin. It must run in the operator's own namespace: the operator
# dials the barman-cloud Service by name over mTLS, and the server certificate is issued
# for that bare name.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plugin-barman-cloud
spec:
  releaseName: plugin-barman-cloud
  targetNamespace: PLACEHOLDER_NAMESPACE
  install:
    createNamespace: false
  interval: 30m
  chart:
    spec:
      chart: plugin-barman-cloud
      version: "0.8.0"
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
        namespace: flux-system
