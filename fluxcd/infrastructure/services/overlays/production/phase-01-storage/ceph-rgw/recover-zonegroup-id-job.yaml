# ONE-TIME RECOVERY (remove after it has run).
# A previous version of ceph-rgw-init did a full-JSON `zonegroup set` that
# overwrote the zonegroup id (cd370ae8-... -> "default"), orphaning every bucket
# and 301-redirect-looping all S3. This job restores the original id so existing
# buckets resolve again. It is idempotent (no-op once the id is correct) and does
# NOT restart the RGW daemons — do that separately after it completes.
apiVersion: batch/v1
kind: Job
metadata:
  name: ceph-rgw-recover-zonegroup-id
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 3
  template:
    metadata:
      labels:
        policy.prplanit.com/cap.ceph: "true"
        policy.prplanit.com/access-scope-ceph: "gorons-bracelet.rgw"
        istio.io/dataplane-mode: none
    spec:
      serviceAccountName: rgw-admin
      restartPolicy: OnFailure
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: recover
          image: quay.io/ceph/ceph:v19
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: HOME
              value: /tmp
            - name: RGW_CLIENT
              value: client.dungeon-rgw
            - name: RGW_ZONEGROUP
              value: default
            - name: TARGET_ZONEGROUP_ID
              value: cd370ae8-791d-40e6-b807-851cdb93c880
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              RGW="radosgw-admin --name ${RGW_CLIENT}"

              CUR_ID="$($RGW zonegroup get --rgw-zonegroup="${RGW_ZONEGROUP}" \
                | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"

              if [ "${CUR_ID}" = "${TARGET_ZONEGROUP_ID}" ]; then
                echo "zonegroup id already ${TARGET_ZONEGROUP_ID} — nothing to recover"
                exit 0
              fi

              echo "restoring zonegroup id: ${CUR_ID} -> ${TARGET_ZONEGROUP_ID}"
              $RGW zonegroup get --rgw-zonegroup="${RGW_ZONEGROUP}" > /tmp/zg.json
              python3 -c "import json; z=json.load(open('/tmp/zg.json')); z['id']='${TARGET_ZONEGROUP_ID}'; json.dump(z, open('/tmp/zg.json','w'))"
              $RGW zonegroup set --rgw-zonegroup="${RGW_ZONEGROUP}" --infile=/tmp/zg.json >/dev/null
              $RGW period update --commit >/dev/null

              echo "=== restored. zonegroup list: ==="
              $RGW zonegroup list
              echo "NOTE: restart the ceph-rgw statefulset to load the restored zonegroup"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: ceph-config
              mountPath: /etc/ceph/ceph.conf
              subPath: ceph.conf
              readOnly: true
            - name: ceph-keyring
              mountPath: /etc/ceph/ceph.keyring
              subPath: keyring
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: ceph-config
          configMap:
            name: ceph-config
        - name: ceph-keyring
          secret:
            secretName: ceph-rgw-keyring
