apiVersion: batch/v1
kind: Job
metadata:
  name: ceph-rgw-init
spec:
  template:
    metadata:
      labels:
        policy.prplanit.com/cap.ceph: "true"
        policy.prplanit.com/access-scope-ceph: "gorons-bracelet.rgw"
        istio.io/dataplane-mode: none
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: init
          image: quay.io/ceph/ceph:v19
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: HOME
              value: /tmp
            - name: RGW_CLIENT
              value: client.dungeon-rgw
            - name: RGW_REALM
              value: dungeon
            - name: RGW_ZONEGROUP
              value: default
            - name: RGW_ZONE
              value: default
            - name: RGW_ENDPOINT
              value: http://ceph-rgw.gorons-bracelet.svc.cluster.local
          command:
            - /bin/bash
            - -c
            - |
              set -e

              # radosgw-admin base command — RGW_CLIENT selects the identity the
              # mounted keyring actually holds (mons reject the default client.admin).
              RGW="radosgw-admin --name ${RGW_CLIENT}"

              echo "=== RGW Initialization Starting ==="

              # Create realm if it doesn't exist
              if ! $RGW realm get --rgw-realm="${RGW_REALM}" 2>/dev/null; then
                echo "Creating realm ${RGW_REALM}..."
                $RGW realm create --rgw-realm="${RGW_REALM}" --default
              else
                echo "Realm ${RGW_REALM} already exists"
              fi

              # Get or create zonegroup
              if ! $RGW zonegroup get --rgw-zonegroup="${RGW_ZONEGROUP}" 2>/dev/null; then
                echo "Creating zonegroup ${RGW_ZONEGROUP}..."
                $RGW zonegroup create --rgw-zonegroup="${RGW_ZONEGROUP}" --rgw-realm="${RGW_REALM}" --master --default
              else
                echo "Zonegroup ${RGW_ZONEGROUP} already exists"
              fi

              # Apply zonegroup config from ConfigMap
              echo "Applying zonegroup configuration..."
              ZONEGROUP_ID=$($RGW zonegroup get --rgw-zonegroup="${RGW_ZONEGROUP}" 2>/dev/null | grep '"id"' | head -1 | cut -d'"' -f4)
              REALM_ID=$($RGW realm get --rgw-realm="${RGW_REALM}" | grep '"id"' | head -1 | cut -d'"' -f4)
              cat /config/zonegroup.json | sed "s/\"id\": \"[^\"]*\"/\"id\": \"$ZONEGROUP_ID\"/" | \
                sed "s/\"realm_id\": \"[^\"]*\"/\"realm_id\": \"$REALM_ID\"/" > /tmp/zonegroup.json
              $RGW zonegroup set --rgw-zonegroup="${RGW_ZONEGROUP}" --infile=/tmp/zonegroup.json

              # Get or create zone
              if ! $RGW zone get --rgw-zone="${RGW_ZONE}" 2>/dev/null; then
                echo "Creating zone ${RGW_ZONE}..."
                $RGW zone create --rgw-zonegroup="${RGW_ZONEGROUP}" --rgw-zone="${RGW_ZONE}" --master --default --endpoints="${RGW_ENDPOINT}"
              else
                echo "Zone ${RGW_ZONE} already exists"
              fi

              # Apply zone config from ConfigMap
              echo "Applying zone configuration with custom pool names..."
              ZONE_ID=$($RGW zone get --rgw-zone="${RGW_ZONE}" 2>/dev/null | grep '"id"' | head -1 | cut -d'"' -f4)
              cat /config/zone.json | \
                sed "s/\"id\": \"[^\"]*\"/\"id\": \"$ZONE_ID\"/" | \
                sed "s/\"realm_id\": \"[^\"]*\"/\"realm_id\": \"$REALM_ID\"/" > /tmp/zone.json
              $RGW zone set --rgw-zone="${RGW_ZONE}" --infile=/tmp/zone.json

              # Update zonegroup to reference the zone
              echo "Updating zonegroup with zone reference..."
              $RGW zonegroup get --rgw-zonegroup="${RGW_ZONEGROUP}" > /tmp/zonegroup-current.json
              ZONE_ENTRY="{\"id\": \"$ZONE_ID\", \"name\": \"${RGW_ZONE}\","
              ZONE_ENTRY="$ZONE_ENTRY \"endpoints\": [\"${RGW_ENDPOINT}\"]}"
              # '|' delimiter: $ZONE_ENTRY contains the endpoint URL, whose slashes
              # would otherwise terminate a s/.../.../ expression.
              cat /tmp/zonegroup-current.json | \
                sed "s|\"master_zone\": \"[^\"]*\"|\"master_zone\": \"$ZONE_ID\"|" | \
                sed "s|\"zones\": \[\]|\"zones\": [$ZONE_ENTRY]|" > /tmp/zonegroup-updated.json
              $RGW zonegroup set --rgw-zonegroup="${RGW_ZONEGROUP}" --infile=/tmp/zonegroup-updated.json

              # Commit period
              echo "Committing period..."
              $RGW period update --commit

              echo "=== RGW Initialization Complete ==="
              echo "Configured pools:"
              META_POOL=$(grep '"domain_root"' /config/zone.json | head -1 | cut -d'"' -f4)
              DATA_POOL=$(grep '"data_pool"' /config/zone.json | head -1 | cut -d'"' -f4)
              echo "  - ${META_POOL}.* (metadata)"
              echo "  - ${DATA_POOL} (object data)"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: ceph-config
              mountPath: /etc/ceph/ceph.conf
              subPath: ceph.conf
              readOnly: true
            - name: ceph-keyring
              mountPath: /etc/ceph/ceph.keyring
              subPath: keyring
              readOnly: true
            - name: zone-config
              mountPath: /config
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: ceph-config
          configMap:
            name: ceph-config
        - name: ceph-keyring
          secret:
            secretName: ceph-rgw-keyring
        - name: zone-config
          configMap:
            name: ceph-rgw-zone-config
