apiVersion: batch/v1
kind: Job
metadata:
  name: ceph-rgw-init
spec:
  template:
    metadata:
      labels:
        policy.prplanit.com/cap.ceph: "true"
        policy.prplanit.com/access-scope-ceph: "gorons-bracelet.rgw"
        istio.io/dataplane-mode: none
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: init
          image: quay.io/ceph/ceph:v19
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: HOME
              value: /tmp
            - name: RGW_CLIENT
              value: client.dungeon-rgw
            - name: RGW_REALM
              value: dungeon
            - name: RGW_ZONEGROUP
              value: default
            - name: RGW_ZONE
              value: default
            - name: RGW_ENDPOINT
              value: http://ceph-rgw.gorons-bracelet.svc.cluster.local
            - name: RGW_METADATA_POOL
              value: dungeon-rgw
            - name: RGW_DATA_POOL
              value: dungeon-rgw-data
            # Declared public S3 endpoint domain(s), comma-separated. The internal service
            # host is derived from RGW_ENDPOINT and always kept — only the public bit is env.
            - name: RGW_HOSTNAMES
              value: s3.pcfae.com
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail

              # RGW_CLIENT selects the identity the mounted keyring holds
              # (mons reject the default client.admin).
              RGW="radosgw-admin --name ${RGW_CLIENT}"
              CHANGED=0

              echo "=== RGW init (idempotent) ==="

              # Create realm / zonegroup / zone ONLY if missing — never re-create over an
              # existing object. Mutable config is re-asserted idempotently below: pool
              # placement via a targeted modify, and hostnames via get -> edit ONLY that
              # field -> set (which preserves the id). What orphaned buckets before was
              # writing a hand-built object with the WRONG id, not editing one field of the
              # live one.
              if ! $RGW realm get --rgw-realm="${RGW_REALM}" >/dev/null 2>&1; then
                echo "creating realm ${RGW_REALM}"
                $RGW realm create --rgw-realm="${RGW_REALM}" --default
                CHANGED=1
              fi
              if ! $RGW zonegroup get --rgw-zonegroup="${RGW_ZONEGROUP}" >/dev/null 2>&1; then
                echo "creating zonegroup ${RGW_ZONEGROUP}"
                $RGW zonegroup create --rgw-zonegroup="${RGW_ZONEGROUP}" \
                  --rgw-realm="${RGW_REALM}" --endpoints="${RGW_ENDPOINT}" --master --default
                CHANGED=1
              fi
              if ! $RGW zone get --rgw-zone="${RGW_ZONE}" >/dev/null 2>&1; then
                echo "creating zone ${RGW_ZONE}"
                $RGW zone create --rgw-zonegroup="${RGW_ZONEGROUP}" --rgw-zone="${RGW_ZONE}" \
                  --endpoints="${RGW_ENDPOINT}" --master --default
                CHANGED=1
              fi

              # Pool placement: only modify when the data pool differs (avoids churn).
              CUR_DATA="$($RGW zone get --rgw-zone="${RGW_ZONE}" 2>/dev/null \
                | grep -m1 '"data_pool"' | cut -d'"' -f4 || true)"
              if [ "${CUR_DATA}" != "${RGW_DATA_POOL}" ]; then
                echo "setting placement pools (${RGW_METADATA_POOL} / ${RGW_DATA_POOL})"
                $RGW zone placement modify --rgw-zone="${RGW_ZONE}" \
                  --placement-id=default-placement \
                  --index-pool="${RGW_METADATA_POOL}" \
                  --data-pool="${RGW_DATA_POOL}" \
                  --data-extra-pool="${RGW_METADATA_POOL}"
                CHANGED=1
              else
                echo "placement pools ok (${CUR_DATA})"
              fi

              # Reconcile zonegroup hostnames to declared intent. RGW must recognise its
              # public domain(s) as endpoint hostnames, else `Host: <domain>` is parsed as a
              # bucket named <domain> -> 404. Desired = internal service host (derived from
              # RGW_ENDPOINT) + RGW_HOSTNAMES. get -> rewrite only hostnames -> set (id kept).
              INTERNAL_HOST="$(printf '%s' "${RGW_ENDPOINT}" | sed -E 's#^[a-z]+://##; s#[:/].*$##')"
              export INTERNAL_HOST
              $RGW zonegroup get --rgw-zonegroup="${RGW_ZONEGROUP}" > /tmp/zg.json
              printf '%s\n' \
                'import json, os' \
                'i = os.environ["INTERNAL_HOST"]' \
                'raw = os.environ.get("RGW_HOSTNAMES", "").split(",")' \
                'want = list(dict.fromkeys([i] + [h.strip() for h in raw if h.strip()]))' \
                'z = json.load(open("/tmp/zg.json"))' \
                'changed = (z.get("hostnames") or []) != want' \
                'z["hostnames"] = want' \
                'json.dump(z, open("/tmp/zg.json", "w"))' \
                'print("yes" if changed else "no")' > /tmp/hn.py
              if [ "$(python3 /tmp/hn.py)" = "yes" ]; then
                echo "reconciling zonegroup hostnames -> ${INTERNAL_HOST},${RGW_HOSTNAMES}"
                $RGW zonegroup set --rgw-zonegroup="${RGW_ZONEGROUP}" --infile=/tmp/zg.json >/dev/null
                CHANGED=1
              else
                echo "hostnames already match declared intent"
              fi

              # Commit the period only if something actually changed — a steady-state
              # run bumps no epoch.
              if [ "${CHANGED}" = "1" ]; then
                echo "committing period"
                $RGW period update --commit >/dev/null
              else
                echo "no changes; period commit skipped"
              fi

              echo "=== RGW init complete (changed=${CHANGED}) ==="
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: ceph-config
              mountPath: /etc/ceph/ceph.conf
              subPath: ceph.conf
              readOnly: true
            - name: ceph-keyring
              mountPath: /etc/ceph/ceph.keyring
              subPath: keyring
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: ceph-config
          configMap:
            name: ceph-config
        - name: ceph-keyring
          secret:
            secretName: ceph-rgw-keyring
