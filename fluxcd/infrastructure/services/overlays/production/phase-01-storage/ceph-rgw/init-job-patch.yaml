apiVersion: batch/v1
kind: Job
metadata:
  name: ceph-rgw-init
spec:
  template:
    metadata:
      labels:
        policy.prplanit.com/cap.ceph: "true"
        policy.prplanit.com/access-scope-ceph: "gorons-bracelet.rgw"
        istio.io/dataplane-mode: none
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: init
          image: quay.io/ceph/ceph:v19
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: HOME
              value: /tmp
            - name: RGW_CLIENT
              value: client.dungeon-rgw
            - name: RGW_REALM
              value: dungeon
            - name: RGW_ZONEGROUP
              value: default
            - name: RGW_ZONE
              value: default
            - name: RGW_ENDPOINT
              value: http://ceph-rgw.gorons-bracelet.svc.cluster.local
            - name: RGW_METADATA_POOL
              value: dungeon-rgw
            - name: RGW_DATA_POOL
              value: dungeon-rgw-data
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail

              # RGW_CLIENT selects the identity the mounted keyring holds
              # (mons reject the default client.admin).
              RGW="radosgw-admin --name ${RGW_CLIENT}"

              echo "=== RGW init (idempotent) ==="

              # Realm / zonegroup / zone are created ONLY if missing. We never
              # run `zonegroup set`/`zone set --infile` — that overwrites the whole
              # object (incl. its id), which orphans every existing bucket. Config
              # that IS safe to re-assert (pool placement) is applied with targeted,
              # idempotent `zone placement modify` below.

              if ! $RGW realm get --rgw-realm="${RGW_REALM}" >/dev/null 2>&1; then
                echo "creating realm ${RGW_REALM}"
                $RGW realm create --rgw-realm="${RGW_REALM}" --default
              fi

              if ! $RGW zonegroup get --rgw-zonegroup="${RGW_ZONEGROUP}" >/dev/null 2>&1; then
                echo "creating zonegroup ${RGW_ZONEGROUP}"
                $RGW zonegroup create --rgw-zonegroup="${RGW_ZONEGROUP}" \
                  --rgw-realm="${RGW_REALM}" --endpoints="${RGW_ENDPOINT}" --master --default
              fi

              if ! $RGW zone get --rgw-zone="${RGW_ZONE}" >/dev/null 2>&1; then
                echo "creating zone ${RGW_ZONE}"
                $RGW zone create --rgw-zonegroup="${RGW_ZONEGROUP}" --rgw-zone="${RGW_ZONE}" \
                  --endpoints="${RGW_ENDPOINT}" --master --default
              fi

              # Pool placement — idempotent, only touches pool names (not identity).
              echo "ensuring placement pools (${RGW_METADATA_POOL}, ${RGW_DATA_POOL})"
              $RGW zone placement modify --rgw-zone="${RGW_ZONE}" \
                --placement-id=default-placement \
                --index-pool="${RGW_METADATA_POOL}" \
                --data-pool="${RGW_DATA_POOL}" \
                --data-extra-pool="${RGW_METADATA_POOL}"

              # Commit the period so any newly-created realm/zonegroup/zone propagates.
              # Re-committing an unchanged config is harmless (only bumps the epoch);
              # it does NOT rewrite object identities the way `zonegroup set` did.
              $RGW period update --commit >/dev/null

              echo "=== RGW init complete ==="
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: ceph-config
              mountPath: /etc/ceph/ceph.conf
              subPath: ceph.conf
              readOnly: true
            - name: ceph-keyring
              mountPath: /etc/ceph/ceph.keyring
              subPath: keyring
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: ceph-config
          configMap:
            name: ceph-config
        - name: ceph-keyring
          secret:
            secretName: ceph-rgw-keyring
