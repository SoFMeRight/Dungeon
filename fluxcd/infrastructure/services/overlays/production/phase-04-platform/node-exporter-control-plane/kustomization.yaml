# node-exporter on the control-plane nodes, with its own CPU limit, built from the main overlay.
# Only the DaemonSet is emitted: it runs as the main ServiceAccount, and a second SA copy in the
# root build would cross-wire the bindings.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../node-exporter
patches:
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: node-exporter
        namespace: lakitu
  - target:
      kind: DaemonSet
      name: node-exporter
    patch: |-
      - op: replace
        path: /metadata/name
        value: node-exporter-control-plane
      # Own app label and selector, distinct from the main DaemonSet's (app: node-exporter).
      - op: add
        path: /metadata/annotations
        value:
          kustomize.toolkit.fluxcd.io/force: enabled
      - op: replace
        path: /spec/selector/matchLabels/app
        value: node-exporter-control-plane
      - op: replace
        path: /spec/template/metadata/labels/app
        value: node-exporter-control-plane
      - op: remove
        path: /spec/template/spec/affinity
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          node-role.kubernetes.io/control-plane: ""
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "502m"
