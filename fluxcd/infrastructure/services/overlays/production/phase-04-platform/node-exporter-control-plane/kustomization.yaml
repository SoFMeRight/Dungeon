# node-exporter on the control-plane nodes, built from the main overlay so it carries the same
# image and settings. The workers need its 250m CPU limit (they throttle at it); on the control
# plane it peaks at 7m (30d, 15s). This instance gives the control plane its own bound.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../node-exporter
nameSuffix: -control-plane
patches:
  - target:
      kind: DaemonSet
      name: node-exporter
    patch: |-
      - op: remove
        path: /spec/template/spec/affinity
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          node-role.kubernetes.io/control-plane: ""
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "10m"
