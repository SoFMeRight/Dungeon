apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: lens-of-truth
resources:
  - ../../../../base/wazuh
  - httproute-xylem.yaml
patches:
  - path: manager-statefulset-patch.yaml
  - path: indexer-statefulset-patch.yaml
  - path: dashboard-statefulset-patch.yaml
  - path: dashboard-resources-patch.yaml
  - path: manager-service-patch.yaml
  - path: indexer-service-patch.yaml
  - path: manager-externalsecret-patch.yaml
  - path: dashboard-externalsecret-patch.yaml
  - path: service-wazuh-dashboard-ingress-patch.yaml
    target:
      kind: Service
      name: wazuh-dashboard
