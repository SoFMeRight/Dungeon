apiVersion: batch/v1
kind: Job
metadata:
  name: wazuh-configuration
spec:
  template:
    spec:
      imagePullSecrets:
        - name: pull-secret-cr-optcp-optcp-k8s-dungeon-public
      initContainers:
        - name: security-config
          image: docker.io/wazuh/wazuh-indexer:4.14.10
      containers:
        - name: configure
          image: ghcr.io/homelabhd/ansible:v2.22.0@sha256:2fdb363113a31c1d96349cc9905e0b42871ea18acb15103f2817b767d89505af
          env:
            - name: TENANT_GROUPS
              value: optcp,prplanit,arbitorium
      volumes:
        - name: security-config
          configMap:
            name: wazuh-indexer-security-config
