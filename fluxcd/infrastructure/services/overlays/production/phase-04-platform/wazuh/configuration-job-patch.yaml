apiVersion: batch/v1
kind: Job
metadata:
  name: wazuh-configuration
spec:
  template:
    spec:
      imagePullSecrets:
        - name: pull-secret-cr-optcp-optcp-k8s-dungeon-public
      initContainers:
        - name: security-config
          image: docker.io/wazuh/wazuh-indexer:4.14.10
      containers:
        - name: configure
          image: ghcr.io/homelabhd/ansible:v2.22.0@sha256:001483870196e1971ace861151f8e1b09fa42a9bd954062d2e8c9dee44fb7617
          env:
            - name: TENANT_GROUPS
              value: optcp,prplanit,arbitorium
      volumes:
        - name: security-config
          configMap:
            name: wazuh-indexer-security-config
