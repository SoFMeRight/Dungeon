apiVersion: batch/v1
kind: Job
metadata:
  name: wazuh-configuration
spec:
  template:
    spec:
      imagePullSecrets:
        - name: pull-secret-cr-optcp-optcp-k8s-dungeon-public
      initContainers:
        - name: security-config
          image: docker.io/wazuh/wazuh-indexer:4.14.10
      containers:
        - name: configure
          image: ghcr.io/homelabhd/ansible:v2.22.0@sha256:bb4f24756e0c9d53c58220ae412c451101d17f802b1863e23ecd1aea2215188e
          env:
            - name: TENANT_GROUPS
              value: optcp,prplanit,arbitorium
      volumes:
        - name: security-config
          configMap:
            name: wazuh-indexer-security-config
