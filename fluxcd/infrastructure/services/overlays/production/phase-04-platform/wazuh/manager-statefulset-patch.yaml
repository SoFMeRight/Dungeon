apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wazuh-manager
spec:
  template:
    spec:
      imagePullSecrets:
        - name: cr-pcfae-admin-pull-secret
      containers:
        - name: wazuh-manager
          image: docker.io/wazuh/wazuh-manager:4.14.9
          envFrom:
            - secretRef:
                name: wazuh-manager-secrets
          resources:
            requests:
              cpu: 11m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 1424Mi
      volumes:
        - name: wazuh-manager-conf
          configMap:
            name: wazuh-manager-config
  volumeClaimTemplates:
    - metadata:
        name: wazuh-manager-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 30Gi
