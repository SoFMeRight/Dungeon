apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wazuh-dashboard
spec:
  # Held at zero for the volume re-bind into optcp-siem.
  replicas: 0
  template:
    metadata:
      labels:
        policy.prplanit.com/ingress: "true"
    spec:
      imagePullSecrets:
        - name: pull-secret-cr-optcp-optcp-k8s-dungeon-public
  volumeClaimTemplates:
    - metadata:
        name: dashboard-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ceph-rbd
        resources:
          requests:
            storage: 10Gi
