apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wazuh-dashboard
spec:
  replicas: 1
  template:
    metadata:
      labels:
        policy.prplanit.com/ingress: "true"
    spec:
      imagePullSecrets:
        - name: cr-pcfae-admin-pull-secret
  volumeClaimTemplates:
    - metadata:
        name: dashboard-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ceph-rbd
        resources:
          requests:
            storage: 10Gi
