apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: boundary-oidc
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao-optcp
    kind: ClusterSecretStore
  target:
    name: boundary-oidc
    creationPolicy: Owner
  data:
    - secretKey: OIDC_CLIENT_ID
      remoteRef:
        key: apps/boundary/oidc
        property: CLIENT_ID
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: apps/boundary/oidc
        property: CLIENT_SECRET
    - secretKey: ADMIN_PASSWORD
      remoteRef:
        key: apps/boundary/app
        property: ADMIN_PASSWORD
