# Intent for the configuration Job: names, URLs and the admin filter; logic lives in the base script.
apiVersion: batch/v1
kind: Job
metadata:
  name: boundary-configuration
spec:
  template:
    metadata:
      annotations:
        prplanit.com/configure-for: targets-declared-1
    spec:
      containers:
        - name: configure
          image: docker.io/hashicorp/boundary:0.21.3
          env:
            - name: BOUNDARY_ADDR
              value: http://boundary-controller.optcp-remote-access.svc.cluster.local:9200
            - name: OIDC_ISSUER
              value: https://sso.optcp.com
            - name: OIDC_API_URL_PREFIX
              value: https://access.optcp.com
            - name: OIDC_AUTH_METHOD_NAME
              value: Single Sign-On
            - name: OIDC_AUTH_METHOD_DESCRIPTION
              value: Zitadel
            - name: ADMIN_LOGIN_NAME
              value: admin
            - name: MANAGED_GROUP_NAME
              value: operator
            # The operator role on the Remote Control project administers Boundary (identity-and-access SOP).
            - name: MANAGED_GROUP_FILTER
              value: '"operator" in "/userinfo/roles" or "operator" in "/token/roles"'
            - name: ADMIN_ROLE_NAME
              value: Administration
            - name: ORG_NAME
              value: OPTCP
            - name: PROJECT_NAME
              value: Hosts
            # Addresses as in ansible/inventory; each host trusts optcp's SSH CA
            # (ansible/services/ssh-ca-trust.yaml) and people log in as themselves.
            - name: TARGETS
              value: |
                ant-parade 10.30.1.111 22
                bluebell 10.30.1.69 22
                cell-membrane 10.40.9.104 22
                dungeon-pedestal 172.22.144.8 22
                freightyard 10.30.8.101 22
                harbormaster 10.24.7.55 22
                homing-pigeon 10.0.0.2 22
                jabu-jabu 10.30.8.98 22
                moor 10.30.1.123 22
                the-usual-suspect 10.0.0.1 22
                xylem 10.24.96.9 22
                dungeon-map-001 172.22.144.150 22
                dungeon-map-002 172.22.144.151 22
                dungeon-map-003 172.22.144.152 22
                dungeon-map-004 172.22.144.153 22
                dungeon-map-005 172.22.144.154 22
                dungeon-chest-001 172.22.144.170 22
                dungeon-chest-002 172.22.144.171 22
                dungeon-chest-003 172.22.144.172 22
                dungeon-chest-004 172.22.144.173 22
                dungeon-chest-005 172.22.144.174 22
            # The StatefulSet's pods; any other registration is removed.
            - name: WORKER_NAMES
              value: boundary-worker-0 boundary-worker-1
