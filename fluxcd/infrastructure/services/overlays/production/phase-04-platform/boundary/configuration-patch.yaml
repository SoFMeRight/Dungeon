# Intent for the configuration Job: names, URLs and the admin filter; logic lives in the base script.
apiVersion: batch/v1
kind: Job
metadata:
  name: boundary-configuration
spec:
  template:
    metadata:
      annotations:
        prplanit.com/configure-for: credential-library-path-1
    spec:
      containers:
        - name: configure
          image: docker.io/hashicorp/boundary:0.21.3
          env:
            - name: BOUNDARY_ADDR
              value: http://boundary-controller.hookshot.svc.cluster.local:9200
            - name: OIDC_ISSUER
              value: https://sso.optcp.com
            - name: OIDC_API_URL_PREFIX
              value: https://access.optcp.com
            - name: OIDC_AUTH_METHOD_NAME
              value: Single Sign-On
            - name: OIDC_AUTH_METHOD_DESCRIPTION
              value: Zitadel
            - name: ADMIN_LOGIN_NAME
              value: admin
            - name: MANAGED_GROUP_NAME
              value: operator
            # The operator role on the Remote Control project administers Boundary (identity-and-access SOP).
            - name: MANAGED_GROUP_FILTER
              value: '"operator" in "/userinfo/roles" or "operator" in "/token/roles"'
            - name: ADMIN_ROLE_NAME
              value: Administration
            - name: CRED_STORE_NAME
              value: openbao
            - name: CRED_LIBRARY_NAME
              value: dungeon-pedestal-key
            - name: CRED_LIBRARY_PATH
              value: optcp/data/apps/boundary/targets/dungeon-pedestal
            - name: CRED_LIBRARY_USERNAME_ATTR
              value: /data/SSH_USERNAME
            - name: CRED_LIBRARY_KEY_ATTR
              value: /data/SSH_PRIVATE_KEY
        - name: vault-token
          image: docker.io/alpine/k8s:1.37.1
          env:
            - name: VAULT_ADDR
              value: http://openbao.zeldas-lullaby.svc.cluster.local:8200
            - name: VAULT_ROLE
              value: boundary
