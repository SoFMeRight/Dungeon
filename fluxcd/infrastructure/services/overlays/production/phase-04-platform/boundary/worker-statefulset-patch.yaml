apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: boundary-worker
spec:
  replicas: 2
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: boundary
              app.kubernetes.io/component: worker
      initContainers:
        - name: render-config
          env:
            # Worker N answers at 172.22.30.88:9202 + 10N (worker-service-<N>.yaml).
            - name: PUBLIC_HOST
              value: "172.22.30.88"
            - name: PUBLIC_PORT_BASE
              value: "9202"
            - name: PUBLIC_PORT_STEP
              value: "10"
      containers:
        - name: boundary
          image: docker.io/hashicorp/boundary:0.21.3
