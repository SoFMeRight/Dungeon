apiVersion: v1
kind: ConfigMap
metadata:
  name: boundary-worker
data:
  worker.hcl: |
    disable_mlock = true

    listener "tcp" {
      address = "0.0.0.0:9202"
      purpose = "proxy"
    }

    listener "tcp" {
      address     = "0.0.0.0:9203"
      purpose     = "ops"
      tls_disable = true
    }

    worker {
      name              = "${WORKER_NAME}"
      initial_upstreams = ["boundary-controller.optcp-remote-access.svc.cluster.local:9201"]
      public_addr       = "${PUBLIC_ADDR}"
      # Outlasts a boundary-postgres primary switchover or restart; equal to the
      # controllers' worker_status_grace_period (controller-configmap-patch.yaml).
      successful_status_grace_period = "2m"
      # Boundary requires this with successful_status_grace_period, and no longer than it.
      status_call_timeout = "5s"
    }

    kms "aead" {
      purpose   = "worker-auth"
      aead_type = "aes-gcm"
      key       = "${KMS_WORKER_AUTH_KEY}"
      key_id    = "global_worker-auth"
    }
