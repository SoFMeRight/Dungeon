apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: boundary-postgres-credentials
spec:
  secretStoreRef:
    name: openbao-optcp
    kind: ClusterSecretStore
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: apps/boundary/postgres
        property: USER
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: apps/boundary/postgres
        property: PASSWORD
