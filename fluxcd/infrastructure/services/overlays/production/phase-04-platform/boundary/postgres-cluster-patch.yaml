apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: boundary-postgres
spec:
  inheritedMetadata:
    labels:
      policy.prplanit.com/cnpg: "managed"
      policy.prplanit.com/access-class: postgres
      policy.prplanit.com/service-scope: hookshot.boundary.postgres
      policy.prplanit.com/cap.s3-nas: "true"
      policy.prplanit.com/access-scope-s3-nas: gringotts.seaweedfs

  instances: 3

  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie

  enableSuperuserAccess: true

  # Fast failover optimizations
  switchoverDelay: 30
  # startDelay is the startup probe budget, not a failover control: the probe
  # allows one attempt per 10s up to this ceiling, and a replica replaying WAL
  # must finish inside it or kubelet kills it mid-replay.
  startDelay: 3600
  # Shutdown has to fit the node's grace budget: 150s total, 30s reserved for
  # critical pods, so 120s for ordinary ones. Postgres does not checkpoint until
  # the smart phase stops waiting for clients to disconnect, so a long smart
  # timeout means the SIGKILL lands before anything is flushed. Short smart, then
  # fast shutdown does the checkpoint well inside the remaining budget.
  smartShutdownTimeout: 10
  stopDelay: 60
  livenessProbeTimeout: 5

  postgresql:
    synchronous:
      method: any
      number: 1

    parameters:
      shared_buffers: "128MB"
      max_connections: "100"
      wal_receiver_timeout: "5s"
      wal_keep_size: "128MB"
      max_slot_wal_keep_size: "320MB"  # 8% of 4Gi PVC (fleet ratio)

  monitoring:
    enablePodMonitor: true

  # Requests lift this out of BestEffort. It is the config store every brokered session
  # authenticates and authorizes against, so it must not be the first thing the kubelet
  # reclaims under node pressure — a shutdown here takes the primary with it.
  # Sized for the primary + CNPG instance manager under Boundary's session load, with
  # headroom above the ~45Mi steady-state resident so memory pressure doesn't trip the
  # instance-manager liveness probe (a 500 there restarts the primary and drops in-flight
  # sessions). The 512Mi ceiling did exactly that under load, hence the raised limit.
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

  storage:
    storageClass: ceph-rbd-retain
    size: 4Gi

  backup:
    barmanObjectStore:
      destinationPath: s3://prplanit/dungeon/cnpg/boundary
      endpointURL: http://172.22.150.101:8333
