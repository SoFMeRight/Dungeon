apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: boundary
  annotations:
    gatus.home-operations.com/endpoint: |
      group: "Remote Access (Hookshot🪝)"
spec:
  parentRefs:
    - name: cell-membrane-ingress-gateway
      namespace: optcp-ingress-public
      sectionName: https-optcp
  hostnames:
    - "access.optcp.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: boundary-controller
          port: 9200
