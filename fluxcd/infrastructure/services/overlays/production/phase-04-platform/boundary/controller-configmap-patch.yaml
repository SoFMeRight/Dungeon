apiVersion: v1
kind: ConfigMap
metadata:
  name: boundary-controller
data:
  controller.hcl: |
    disable_mlock = true

    listener "tcp" {
      address     = "0.0.0.0:9200"
      purpose     = "api"
      tls_disable = true
    }

    listener "tcp" {
      address = "0.0.0.0:9201"
      purpose = "cluster"
    }

    listener "tcp" {
      address     = "0.0.0.0:9203"
      purpose     = "ops"
      tls_disable = true
    }

    controller {
      name               = "boundary-controller"
      public_cluster_addr = "boundary-controller.optcp-remote-access.svc.cluster.local:9201"
      database {
        url = "${BOUNDARY_PG_URL}"
      }
    }

    kms "aead" {
      purpose   = "root"
      aead_type = "aes-gcm"
      key       = "${KMS_ROOT_KEY}"
      key_id    = "global_root"
    }

    kms "aead" {
      purpose   = "worker-auth"
      aead_type = "aes-gcm"
      key       = "${KMS_WORKER_AUTH_KEY}"
      key_id    = "global_worker-auth"
    }

    kms "aead" {
      purpose   = "recovery"
      aead_type = "aes-gcm"
      key       = "${KMS_RECOVERY_KEY}"
      key_id    = "global_recovery"
    }
