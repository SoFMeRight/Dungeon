# Reconciles the Zitadel OIDC auth method (issuer, callback prefix) on the global scope; bump the
# pod annotation to re-run.
apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/force: "Enabled"  # immutable one-shot Job: force-replace on image bump, not wedge
  name: boundary-oidc-setup
  namespace: hookshot
spec:
  # An hour: sbom-operator scans hourly and must see the finished pod.
  ttlSecondsAfterFinished: 3600
  backoffLimit: 1
  template:
    spec:
      serviceAccountName: boundary-controller
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oidc-setup
          image: docker.io/hashicorp/boundary:0.21.3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          command: ["sh", "-c"]
          args:
            - |
              set -euo pipefail
              export BOUNDARY_ADDR=http://boundary-controller.hookshot.svc.cluster.local:9200

              echo "=== Authenticating ==="
              # The initial login role lets anyone list global auth methods; the password one is found by type.
              PW_AM_ID=$(boundary auth-methods list -scope-id global -keyring-type none -format json \
                | grep -o '"id":"ampw_[^"]*"' | head -1 | cut -d'"' -f4 || true)
              [ -n "$PW_AM_ID" ] || { echo "no password auth method in the global scope"; exit 1; }
              TOKEN=$(boundary authenticate password \
                -auth-method-id "$PW_AM_ID" \
                -login-name "${ADMIN_USER:-admin}" \
                -password env://ADMIN_PASSWORD \
                -keyring-type none \
                -format json | grep -o '"token":"[^"]*"' | cut -d'"' -f4)
              export BOUNDARY_TOKEN="$TOKEN"

              echo "=== Reconciling the Single Sign-On auth method ==="
              PRIMARY=$(boundary scopes read -id global -keyring-type none -format json \
                | grep -o '"primary_auth_method_id":"amoidc_[^"]*"' | cut -d'"' -f4 || true)
              if [ -n "$PRIMARY" ]; then
                OIDC_AM_ID="$PRIMARY"
                boundary auth-methods update oidc \
                  -id "$OIDC_AM_ID" \
                  -issuer https://sso.optcp.com \
                  -client-id "$OIDC_CLIENT_ID" \
                  -client-secret "$OIDC_CLIENT_SECRET" \
                  -api-url-prefix https://access.optcp.com \
                  -name "Single Sign-On" \
                  -description "Zitadel" \
                  -keyring-type none \
                  -format json >/dev/null
              else
                RESULT=$(boundary auth-methods create oidc \
                  -issuer https://sso.optcp.com \
                  -client-id "$OIDC_CLIENT_ID" \
                  -client-secret "$OIDC_CLIENT_SECRET" \
                  -signing-algorithm RS256 \
                  -api-url-prefix https://access.optcp.com \
                  -name "Single Sign-On" \
                  -description "Zitadel" \
                  -scope-id global \
                  -keyring-type none \
                  -format json)
                OIDC_AM_ID=$(echo "$RESULT" | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
              fi
              echo "=== OIDC Auth Method ID: $OIDC_AM_ID ==="
              boundary auth-methods list -scope-id global -keyring-type none -format json \
                | grep -o '"id":"amoidc_[^"]*"' | cut -d'"' -f4 | grep -v "^$OIDC_AM_ID$" \
                | sed 's/^/WARN: extra OIDC auth method, not managed here: /' || true
              echo "=== Activating OIDC auth method ==="
              boundary auth-methods change-state oidc \
                -id "$OIDC_AM_ID" \
                -state active-public \
                -keyring-type none \
                -format json

              echo "=== Setting OIDC as primary auth method ==="
              boundary scopes update -id global \
                -primary-auth-method-id "$OIDC_AM_ID" \
                -keyring-type none \
                -format json

              echo "=== Managed group 'operator' in Administration ==="
              # The operator role on the Remote Control project (identity-and-access SOP) administers Boundary.
              FILTER='"operator" in "/userinfo/roles" or "operator" in "/token/roles"'
              MG_ID=$(boundary managed-groups list -auth-method-id "$OIDC_AM_ID" -keyring-type none -format json \
                | grep -o '{"id":"mgoidc_[^"]*"[^{}]*"name":"operator"' | head -1 | cut -d'"' -f4 || true)
              if [ -z "$MG_ID" ]; then
                MG_ID=$(boundary managed-groups create oidc -auth-method-id "$OIDC_AM_ID" -name operator \
                  -description "Zitadel role operator" -filter "$FILTER" -keyring-type none -format json \
                  | grep -o '"id":"mgoidc_[^"]*"' | head -1 | cut -d'"' -f4)
              else
                boundary managed-groups update oidc -id "$MG_ID" -filter "$FILTER" -keyring-type none -format json >/dev/null
              fi
              ADMIN_ROLE=$(boundary roles list -scope-id global -keyring-type none -format json \
                | grep -o '{"id":"r_[^"]*"[^{}]*"name":"Administration"' | head -1 | cut -d'"' -f4 || true)
              [ -n "$ADMIN_ROLE" ] || { echo "no Administration role in the global scope"; exit 1; }
              if ! boundary roles read -id "$ADMIN_ROLE" -keyring-type none -format json | grep -q "\"$MG_ID\""; then
                boundary roles add-principals -id "$ADMIN_ROLE" -principal "$MG_ID" -keyring-type none -format json >/dev/null
              fi
              echo "managed group $MG_ID is a principal of $ADMIN_ROLE"
              echo "=== Done ==="
              echo "OIDC auth method '$OIDC_AM_ID' is now primary for global scope."
          # ADMIN_PASSWORD is provided by the boundary-oidc ExternalSecret
          # (OpenBao apps/boundary), never hardcoded.
          envFrom:
            - secretRef:
                name: boundary-oidc
          env:
            - name: HOME
              value: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
