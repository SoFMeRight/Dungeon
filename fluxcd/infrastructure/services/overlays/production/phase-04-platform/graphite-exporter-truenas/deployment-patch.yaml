apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphite-exporter-truenas
spec:
  template:
    metadata:
      labels:
        policy.prplanit.com/metrics: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9108"
        monitoring.prplanit.com/instance: "gringotts"
    spec:
      imagePullSecrets:
        - name: cr-pcfae-admin-pull-secret
      containers:
        - name: graphite-exporter
          image: docker.io/prom/graphite-exporter:v0.17.0
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
