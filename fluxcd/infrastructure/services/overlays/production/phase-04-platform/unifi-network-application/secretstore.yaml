# Reads only unifi-network-application's entries, as its app ServiceAccount.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-unifi-network-application
spec:
  provider:
    vault:
      server: "http://openbao.optcp-secrets.svc.cluster.local:8200"
      path: "optcp"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "unifi-network-application"
          serviceAccountRef:
            name: unifi-network-application-app
