apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: unifi-network-application-mongodb
spec:
  replicas: 1
  template:
    spec:
      imagePullSecrets:
        - name: pull-secret-cr-optcp-optcp-k8s-dungeon-public
      containers:
        - name: mongo
          image: docker.io/library/mongo:7.0.48
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
  volumeClaimTemplates:
    - metadata:
        name: unifi-network-application-mongodb
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ceph-rbd
        resources:
          requests:
            storage: 1Gi
