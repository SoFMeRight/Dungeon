apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unifi-network-application-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-unifi-network-application
    kind: SecretStore
  target:
    name: unifi-network-application-secrets
    creationPolicy: Owner
  data:
    - secretKey: MONGO_USER
      remoteRef:
        key: apps/unifi-network-application/mongodb
        property: USER
    - secretKey: MONGO_PASS
      remoteRef:
        key: apps/unifi-network-application/mongodb
        property: PASSWORD
    - secretKey: MONGO_INITDB_ROOT_USERNAME
      remoteRef:
        key: apps/unifi-network-application/mongodb
        property: ROOT_USER
    - secretKey: MONGO_INITDB_ROOT_PASSWORD
      remoteRef:
        key: apps/unifi-network-application/mongodb
        property: ROOT_PASSWORD
