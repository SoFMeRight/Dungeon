apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus-config
data:
  config.yaml: |
    storage:
      type: postgres
      path: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/${POSTGRES_DB}?sslmode=disable"
    ui:
      title: PrecisionPlanIT Status
      header: Service Status
      logo: https://precisionplanit.com/img/favicon.png
      # Opens on the grouped view. A browser that already chose a sort keeps its own —
      # gatus applies this to visitors with no stored preference, it does not enforce it.
      default-sort-by: group
