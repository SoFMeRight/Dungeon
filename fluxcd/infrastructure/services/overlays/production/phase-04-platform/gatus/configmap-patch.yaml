apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus-config
data:
  config.yaml: |
    storage:
      type: postgres
      path: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/${POSTGRES_DB}?sslmode=disable"
    ui:
      title: PrecisionPlanIT Status
      header: Service Status
      logo: https://precisionplanit.com/img/favicon.png
      # Opens on the grouped view. A browser that already chose a sort keeps its own —
      # gatus applies this to visitors with no stored preference, it does not enforce it.
      default-sort-by: group
    # Only endpoints that list `alerts` notify, which is the alerting pipeline itself
    # (vmalert, Alertmanager): Gatus is what notices when those are down.
    alerting:
      ntfy:
        url: "http://ntfy.delivery-bag.svc.cluster.local"
        topic: "Arbitorium-Prod-Alert"
        priority: 5
        token: "${NTFY_TOKEN}"
        default-alert:
          failure-threshold: 3
          success-threshold: 2
          send-on-resolved: true
