apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatus
spec:
  replicas: 1
  template:
    metadata:
      labels:
        policy.prplanit.com/ingress: "true"
        policy.prplanit.com/cap.postgres: "true"
        policy.prplanit.com/access-scope-postgres: gossip-stone.gatus.postgres
        policy.prplanit.com/metrics: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      imagePullSecrets:
        - name: cr-pcfae-admin-pull-secret
      initContainers:
        - name: init-config
          image: docker.io/library/busybox:1.38
      containers:
        - name: gatus
          image: ghcr.io/twin/gatus:v5.38.0
          env:
            - name: NTFY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gatus-ntfy-token
                  key: token
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 369m
              memory: 256Mi
        - name: gatus-sidecar
          image: ghcr.io/home-operations/gatus-sidecar:0.6.0
