apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: gatus-postgres
spec:
  inheritedMetadata:
    labels:
      policy.prplanit.com/cnpg: "managed"
      policy.prplanit.com/access-class: postgres
      policy.prplanit.com/service-scope: gossip-stone.gatus.postgres

  # 3 instances (fleet standard): replicas keep gatus up through node drains
  # (operator switchover) — the status page must stay alive precisely while
  # nodes are being maintained.
  instances: 3

  # Replicas must land on different nodes or a drain takes several at once.
  affinity:
    podAntiAffinityType: required

  # Fast failover (fleet pattern — see grafana-postgres)
  switchoverDelay: 30
  startDelay: 10
  stopDelay: 10
  livenessProbeTimeout: 5

  # Limits cap just above the VictoriaMetrics 7d peak (112Mi / 128m).
  # Requests are floor-level so replicas can schedule on the
  # requests-saturated worker pool while chest-001 is out of it — re-size
  # to typical usage (avg 99Mi / median 58m) once the fleet converges and
  # its capacity returns. Requests must stay explicit: absent requests
  # default to the limits.
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 192Mi

  postgresql:
    # Async replication: strict synchronous (grafana pattern) blocks every
    # commit whenever no replica is ready — with replicas still joining,
    # that is a full write outage. Revisit sync once 3/3 is stable.
    parameters:
      shared_buffers: "32MB"
      max_connections: "50"
      # Fast detection of primary failure
      wal_receiver_timeout: "5s"
      # WAL retention caps - a disconnected replica's slot must not fill the PVC
      wal_keep_size: "128MB"
      max_slot_wal_keep_size: "160MB"  # 8% of 2Gi PVC (fleet ratio)

  monitoring:
    enablePodMonitor: true

  bootstrap:
    initdb:
      database: gatus
      owner: gatus
      secret:
        name: gatus-postgres-credentials

  storage:
    storageClass: ceph-rbd-retain
    size: 2Gi
