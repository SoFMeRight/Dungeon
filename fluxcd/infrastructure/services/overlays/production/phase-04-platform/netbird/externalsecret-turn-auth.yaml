apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbird-turn-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-zeldas-letter
    kind: ClusterSecretStore
  target:
    name: netbird-turn-auth
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Shape STUNner's GatewayConfig authRef expects: type selects the auth
        # mechanism, secret is the shared key both sides derive HMAC creds from.
        type: "ephemeral"
        secret: "{{ .sharedSecret }}"
  data:
    - secretKey: sharedSecret
      remoteRef:
        key: apps/netbird
        property: TURN_SHARED_SECRET
