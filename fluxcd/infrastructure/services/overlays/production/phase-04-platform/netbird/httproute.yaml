apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: netbird
  namespace: zeldas-lullaby
  annotations:
    gatus.home-operations.com/endpoint: |
      group: "Administration (Zelda's Lullaby🎵)"
spec:
  parentRefs:
    - name: cell-membrane-gateway
      namespace: hyrule-castle
  hostnames:
    - "netbird.prplanit.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: netbird-management
          port: 80
    - matches:
        # NetBird's management gRPC service lives at /management.ManagementService/ —
        # a PathPrefix of /management does NOT match it (segment-boundary matching),
        # so the client's GetServerKey / SSO-config calls must target the dotted name.
        - path:
            type: PathPrefix
            value: /management.ManagementService
      timeouts:
        request: 24h
      backendRefs:
        - name: netbird-management
          # gRPC → the h2c service port (8081); /api stays on the h1 port (80).
          port: 8081
    - matches:
        - path:
            type: PathPrefix
            value: /signalexchange.SignalExchange
      timeouts:
        request: 24h
      backendRefs:
        - name: netbird-signal
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /relay
      timeouts:
        request: 24h
      backendRefs:
        - name: netbird-relay
          port: 33080
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: netbird-dashboard
          port: 80
