# NetBird's TURN/STUN server, provided by STUNner instead of coturn. STUNner is
# the Kubernetes-native way to run TURN: it publishes only the single Gateway
# port (3478) on the LoadBalancer and relays media through its dataplane, so the
# 49152-65535 relay range never has to be exposed — the problem coturn forced on
# us simply doesn't exist here. A dedicated GatewayClass gives NetBird its own
# realm + auth, independent of the neko-vpn STUNner gateway.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: netbird-turn
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: netbird-turn
spec:
  controllerName: "stunner.l7mp.io/gateway-operator"
  parametersRef:
    group: "stunner.l7mp.io"
    kind: GatewayConfig
    name: netbird-turn
    namespace: zeldas-lullaby
  description: "STUNner TURN/STUN gateway for NetBird VPN peers"
---
apiVersion: stunner.l7mp.io/v1
kind: GatewayConfig
metadata:
  name: netbird-turn
spec:
  realm: netbird.prplanit.com
  # Ephemeral (time-windowed) auth: STUNner and NetBird share a secret and each
  # derives per-client, expiring HMAC credentials from it. authRef points at a
  # Secret carrying type=ephemeral + the shared secret (materialised from Vault).
  authRef:
    name: netbird-turn-auth
    namespace: zeldas-lullaby
  # Run the hardened Dataplane below instead of the operator's unhardened default.
  dataplane: netbird-turn
---
apiVersion: stunner.l7mp.io/v1
kind: Dataplane
metadata:
  name: netbird-turn
spec:
  # Mirrors the operator's default dataplane, plus a real securityContext. stunnerd
  # must stay root to bind the privileged :3478 (this cluster's CRI-O ignores
  # ip_unprivileged_port_start and NET_BIND_SERVICE is inert for non-root), but
  # everything else is locked down: read-only rootfs (stunnerd logs to stdout and
  # pulls its config from the control plane over the network, so it writes nothing),
  # no privilege escalation, all caps dropped except the one needed for the bind,
  # and RuntimeDefault seccomp. Net result: one documented non-root exception, no
  # privesc exception — strictly tighter than the neko-vpn dataplane.
  image: docker.io/l7mp/stunnerd:1.2.1
  imagePullPolicy: IfNotPresent
  command: ["stunnerd"]
  args: ["-w", "--udp-thread-num=16", "--log-format=text"]
  dataplaneResource: Deployment
  replicas: 1
  terminationGracePeriodSeconds: 3600
  resources:
    requests:
      cpu: "500m"
      memory: "128Mi"
    limits:
      cpu: "2"
      memory: "512Mi"
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
        - ALL
      add:
        - NET_BIND_SERVICE
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: netbird-turn
spec:
  gatewayClassName: netbird-turn
  # One UDP listener is all NetBird uses (turn:turn.prplanit.com:3478?transport=udp).
  # The operator auto-creates the LoadBalancer Service; a Kyverno rule pins its IP
  # to 172.22.30.86 (sharing-key zeldas-lullaby), the address coturn used to hold.
  listeners:
    - name: turn-udp
      port: 3478
      protocol: TURN-UDP
---
apiVersion: stunner.l7mp.io/v1
kind: StaticService
metadata:
  name: netbird-peers
spec:
  # NetBird peers live anywhere on the internet, so relay to any address. This is
  # not an open relay: STUNner only accepts allocations from clients holding valid
  # ephemeral credentials, and those are minted from the shared secret above.
  prefixes:
    - "0.0.0.0/0"
---
apiVersion: stunner.l7mp.io/v1
kind: UDPRoute
metadata:
  name: netbird-turn
spec:
  parentRefs:
    - name: netbird-turn
  rules:
    - backendRefs:
        - group: stunner.l7mp.io
          kind: StaticService
          name: netbird-peers
