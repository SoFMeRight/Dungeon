apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: zeldas-lullaby

resources:
  - ../../../../base/netbird
  - httproute.yaml
  - stunner-gateway.yaml
  - externalsecret-turn-auth.yaml

patches:
  - patch: |-
      - op: replace
        path: /spec/storage/storageClass
        value: ceph-rbd
      - op: add
        path: /spec/inheritedMetadata
        value:
          labels:
            policy.prplanit.com/cnpg: "managed"
            policy.prplanit.com/access-class: postgres
            policy.prplanit.com/service-scope: zeldas-lullaby.netbird.postgres
    target:
      kind: Cluster
      name: netbird-postgres
  - patch: |-
      - op: replace
        path: /spec/template/spec/initContainers/0/image
        value: docker.io/library/busybox:1.37.0
    target:
      kind: StatefulSet
      name: netbird-management
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: docker.io/netbirdio/management:0.77.1
      - op: replace
        path: /spec/template/spec/containers/0/env/3/value
        value: "86400"
    target:
      kind: StatefulSet
      name: netbird-management
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: docker.io/netbirdio/signal:0.77.1
    target:
      kind: StatefulSet
      name: netbird-signal
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: docker.io/netbirdio/dashboard:v2.91.1
    target:
      kind: Deployment
      name: netbird-dashboard
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: docker.io/netbirdio/relay:0.77.1
    target:
      kind: Deployment
      name: netbird-relay
  - patch: |-
      - op: replace
        path: /spec/secretStoreRef/name
        value: openbao-zeldas-letter
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: apps/netbird
      - op: replace
        path: /spec/data/1/remoteRef/key
        value: apps/netbird
      - op: replace
        path: /spec/data/2/remoteRef/key
        value: apps/netbird
      - op: replace
        path: /spec/data/3/remoteRef/key
        value: apps/netbird
      - op: replace
        path: /spec/data/4/remoteRef/key
        value: apps/netbird
      - op: replace
        path: /spec/data/5/remoteRef/key
        value: apps/netbird
      - op: replace
        path: /spec/data/6/remoteRef/key
        value: apps/netbird
      - op: replace
        path: /spec/data/7/remoteRef/key
        value: apps/netbird
      - op: replace
        path: /spec/data/8/remoteRef/key
        value: apps/netbird
      - op: replace
        path: /spec/data/9/remoteRef/key
        value: apps/netbird
      - op: replace
        path: /spec/data/10/remoteRef/key
        value: apps/netbird
    target:
      kind: ExternalSecret
      name: netbird-secrets
  - patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: ceph-rbd
    target:
      kind: StatefulSet
      name: netbird-management
  - patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: ceph-rbd
    target:
      kind: StatefulSet
      name: netbird-signal
  - path: statefulset-management-ingress-patch.yaml
    target:
      kind: StatefulSet
      name: netbird-management
  - path: statefulset-signal-ingress-patch.yaml
    target:
      kind: StatefulSet
      name: netbird-signal
  - path: deployment-dashboard-ingress-patch.yaml
    target:
      kind: Deployment
      name: netbird-dashboard
  - path: deployment-relay-ingress-patch.yaml
    target:
      kind: Deployment
      name: netbird-relay
  - path: service-netbird-management-ingress-patch.yaml
    target:
      kind: Service
      name: netbird-management
  - path: service-netbird-signal-ingress-patch.yaml
    target:
      kind: Service
      name: netbird-signal
  - path: service-netbird-dashboard-ingress-patch.yaml
    target:
      kind: Service
      name: netbird-dashboard
  - path: service-netbird-relay-ingress-patch.yaml
    target:
      kind: Service
      name: netbird-relay
  # readOnlyRootFilesystem hardening (SEC-4): both are Go binaries; data on PVC/emptyDir.
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/securityContext/readOnlyRootFilesystem
        value: true
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: tmp
          mountPath: /tmp
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: tmp
          emptyDir: {}
    target:
      kind: StatefulSet
      name: netbird-management
