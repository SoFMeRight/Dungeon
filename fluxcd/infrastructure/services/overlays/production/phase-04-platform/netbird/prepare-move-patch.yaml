# Namespace move, step 1 (namespace-moves.md, CNPG): management off and netbird-postgres
# down to its primary, so the move commit re-binds one volume. The move removes this.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: netbird-management
spec:
  replicas: 0
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: netbird-postgres
spec:
  instances: 1
