# Namespace move to optcp-remote-access (namespace-moves.md, CNPG): management and signal stay
# off, so no claim is provisioned before their volumes re-bind, and the backup schedule waits
# for the Cluster. The next commit removes this.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: netbird-management
spec:
  replicas: 0
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: netbird-signal
spec:
  replicas: 0
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: netbird-postgres-daily
spec:
  suspend: true
