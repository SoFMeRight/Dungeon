apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gossip-stone
resources:
  - ../../../../base/vmalert
  - configmap-vmalert-rules.yaml
  - configmap-alertmanager.yaml
  - externalsecret-ntfy.yaml
patches:
  - path: service-gatus-patch.yaml
  - target:
      kind: Deployment
      name: vmalert
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: docker.io/victoriametrics/vmalert:v1.97.1
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "20m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "64Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "200m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "256Mi"
  - target:
      kind: StatefulSet
      name: alertmanager
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: quay.io/prometheus/alertmanager:v0.28.1
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "10m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "32Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "100m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "128Mi"
