# syslog.prplanit.com resolves only on the LAN (AdGuard rewrite to the alloy-syslog VIP);
# the DNS-01 challenge needs no public record, and devices trust Let's Encrypt out of the box.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: alloy-syslog-tls
spec:
  secretName: alloy-syslog-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - "syslog.prplanit.com"
