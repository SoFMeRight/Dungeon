apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy-syslog
spec:
  template:
    spec:
      containers:
        - name: alloy
          image: docker.io/grafana/alloy:v1.20.1
          env:
            - name: LOKI_PUSH_URL
              value: http://loki.gossip-stone.svc.cluster.local:3100/loki/api/v1/push
            - name: WAZUH_SYSLOG_HOST
              value: wazuh-manager.lens-of-truth.svc.cluster.local
