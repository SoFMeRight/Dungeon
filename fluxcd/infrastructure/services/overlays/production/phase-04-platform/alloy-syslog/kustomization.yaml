apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: lakitu

resources:
  - ../../../../base/alloy-syslog

patches:
  - path: deployment-patch.yaml
    target:
      kind: Deployment
      name: alloy-syslog
  - path: service-patch.yaml
    target:
      kind: Service
      name: alloy-syslog
