apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
spec:
  values:
    # Pod labels for Istio AuthorizationPolicy opt-in
    podLabels:
      policy.prplanit.com/ingress: "true"
      policy.prplanit.com/metrics: "true"
      policy.prplanit.com/cap.postgres: "true"
      policy.prplanit.com/access-scope-postgres: gossip-stone.grafana.postgres
      # Grafana does server-side OIDC token/userinfo exchange with Zitadel
      # (sso.prplanit.com) — needs the cell-membrane gateway hairpin allow.
      policy.prplanit.com/cap.oidc: "true"

    # Prometheus scraping
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "3000"
      backup.velero.io/backup-volumes-excludes: grafana-plugins-shared

    # HA configuration
    replicas: 3

    # Gives the alerting replicas stable per-pod addresses to gossip over; without
    # it ha_peers has nothing to resolve.
    headlessService: true

    # Override liveness probe — alerting provisioning + plugin install can take minutes
    livenessProbe:
      httpGet:
        path: /api/health
        port: 3000
      initialDelaySeconds: 120
      periodSeconds: 10
      failureThreshold: 15
      timeoutSeconds: 10

    # Disable built-in persistence - using PostgreSQL instead
    persistence:
      enabled: false

    # Configure PostgreSQL database
    grafana.ini:
      server:
        root_url: "https://grafana.pcfae.com"
        serve_from_sub_path: false
      database:
        type: postgres
        host: grafana-postgres-rw.gossip-stone.svc.cluster.local:5432
        name: grafana
        ssl_mode: disable
      unified_alerting:
        enabled: true
        # Three replicas each evaluate every rule. Without a gossip ring they each
        # notify as well, so one alert arrived three times -- the exact noise the
        # tier scheme exists to avoid. These make the replicas agree on who sends.
        # POD_IP is already in the pod env; the peers are resolved through the
        # headless service enabled below.
        ha_listen_address: "${POD_IP}:9094"
        ha_advertise_address: "${POD_IP}:9094"
        ha_peers: "grafana-headless.gossip-stone.svc.cluster.local:9094"
      # Zitadel SSO (generic OAuth). client_id/secret come from env
      # (GF_AUTH_GENERIC_OAUTH_CLIENT_ID/SECRET) so they stay out of values.
      auth.generic_oauth:
        enabled: true
        name: PrPlanIT SSO
        allow_sign_up: true
        scopes: "openid profile email offline_access"
        auth_url: "https://sso.prplanit.com/oauth/v2/authorize"
        token_url: "https://sso.prplanit.com/oauth/v2/token"
        api_url: "https://sso.prplanit.com/oidc/v1/userinfo"
        use_pkce: true
        # Use Zitadel preferred_username (e.g. "kai") as the Grafana login,
        # not the email — avoids colliding with the built-in admin account
        # whose login was renamed to the same email.
        login_attribute_path: preferred_username
        # Role comes ONLY from the Zitadel-assigned role (flattened into the
        # `roles` claim by the flatRoles action); users with no Admin/Editor/
        # Viewer role are denied (strict), never auto-assigned.
        role_attribute_strict: true
        role_attribute_path: "contains(roles[*], 'Admin') && 'Admin' || contains(roles[*], 'Editor') && 'Editor' || contains(roles[*], 'Viewer') && 'Viewer' || 'None'"
      # Link an SSO login to the matching existing local account by (verified)
      # email, so ONE Grafana user signs in via both SSO and username/password.
      # Safe here: single trusted IdP (Zitadel) with email_verified=true.
      auth:
        oauth_allow_insecure_email_lookup: true

    # Map secret keys to Grafana environment variables
    envValueFrom:
      GF_DATABASE_USER:
        secretKeyRef:
          name: grafana-postgres-credentials
          key: username
      GF_DATABASE_PASSWORD:
        secretKeyRef:
          name: grafana-postgres-credentials
          key: password
      NTFY_TOKEN:
        secretKeyRef:
          name: grafana-ntfy-token
          key: token
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID:
        secretKeyRef:
          name: grafana-oidc
          key: client_id
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
        secretKeyRef:
          name: grafana-oidc
          key: client_secret

    # Datasource provisioning
    datasources:
      datasources.yaml:
        apiVersion: 1
        deleteDatasources:
          - name: VictoriaMetrics
            orgId: 1
          - name: Loki
            orgId: 1
        datasources:
          - name: VictoriaMetrics
            uid: victoriametrics
            type: prometheus
            access: proxy
            url: http://vmselect.gossip-stone.svc.cluster.local:8481/select/0/prometheus
            isDefault: true
            editable: false
            jsonData:
              timeInterval: 30s
              httpMethod: POST
          - name: Loki
            uid: loki
            type: loki
            access: proxy
            url: http://loki.gossip-stone.svc.cluster.local:3100
            editable: false
            jsonData:
              maxLines: 1000
          # vmalert's alerts and Alertmanager's silences, shown on Grafana's alerting
          # page. Grafana's own rules still notify through its contact points.
          - name: Alertmanager
            uid: alertmanager
            type: alertmanager
            access: proxy
            url: http://alertmanager.gossip-stone.svc.cluster.local:9093
            editable: false
            jsonData:
              implementation: prometheus
              handleGrafanaManagedAlerts: false

    # Dashboard provisioning
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: 'kubernetes'
            orgId: 1
            folder: 'Kubernetes'
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/kubernetes
          - name: 'system'
            orgId: 1
            folder: 'System'
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/system
          - name: 'monitoring'
            orgId: 1
            folder: 'Monitoring'
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/monitoring
          - name: 'infrastructure'
            orgId: 1
            folder: 'Infrastructure'
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/infrastructure
          - name: 'docker'
            orgId: 1
            folder: 'Docker'
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/docker
          - name: 'logs'
            orgId: 1
            folder: 'Logs'
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/logs

    # Mount dashboards from ConfigMaps (split to stay under 1MB limit)
    dashboardsConfigMaps:
      kubernetes: grafana-dashboards-kubernetes
      system: grafana-dashboards-system
      monitoring: grafana-dashboards-monitoring
      infrastructure: grafana-dashboards-infrastructure
      docker: grafana-dashboards-docker
      logs: grafana-dashboards-logs

    # Override default plugins volume with RWX PVC
    # sidecar is used to override the default emptyDir plugins volume
    sidecar:
      plugins:
        enabled: false  # Disable sidecar plugin loader to avoid conflicts
      dashboards:
        enabled: false  # Using provisioning instead

    # Add RWX volume for shared plugins
    extraVolumes:
      - name: grafana-plugins-shared
        existingClaim: gossip-stone-grafana-plugins

    extraVolumeMounts:
      - name: grafana-plugins-shared
        mountPath: /var/lib/grafana/plugins

    # Alerting provisioning — Phase 5 operational security guardrails
    alerting:
      contactpoints.yaml:
        apiVersion: 1
        contactPoints:
          # Topics are named <Estate>-<Domain>-<Class>, and the class is the
          # interrupt tier. Naming the tier in the topic is what keeps the priority
          # honest: a publisher cannot send routine traffic at 5 without the topic
          # contradicting it, which is how the estate ended up with a channel that
          # alerted on every flap and so was never read.
          - orgId: 1
            name: ntfy-prod-warn
            receivers:
              - uid: ntfy-prod-warn
                type: webhook
                settings:
                  # Priority rides in the query string because the webhook integration
                  # has no field for extra headers -- an X-Priority header is silently
                  # dropped, as httpHeaderName1/2 were: those are datasource fields,
                  # not contact-point ones, so Grafana ignored them and posted with no
                  # Authorization at all. ntfy answers that with 403, which is why
                  # nothing has ever arrived on a Grafana topic.
                  # Everything rides in the query string because the webhook
                  # integration has no field for extra headers. Without tpl, ntfy
                  # renders the raw Grafana JSON -- one tier arrived as an
                  # "attachment.json" file, the other as a wall of JSON.
                  #
                  # tpl=yes takes the title and message Grafana already composes and
                  # uses them as the notification, and p carries the tier priority; a
                  # named template such as template=grafana formats well but drops
                  # priority entirely, which is the one thing the tier must keep.
                  #
                  # The braces are percent-encoded, so the chart's tpl pass never sees
                  # a template action here and nothing has to be escaped against it.
                  url: "http://ntfy.delivery-bag.svc.cluster.local/Arbitorium-Prod-Warn?tpl=yes\
                    &t=%7B%7Bif+eq+.status+%22resolved%22%7D%7D%7B%7B%28index+.alerts+0%29.annotations.resolved_title%7D%7D%7B%7Belse%7D%7D%7B%7B.groupLabels.alertname%7D%7D%7B%7Bend%7D%7D\
                    &m=%7B%7Brange+.alerts%7D%7D%7B%7Bif+eq+.status+%22resolved%22%7D%7D%7B%7Bif+.annotations.resolved%7D%7D%7B%7B.annotations.resolved%7D%7D%7B%7Belse%7D%7DBack+to+normal.%7B%7Bend%7D%7D%7B%7Belse%7D%7D%7B%7B.annotations.summary%7D%7D%7B%7Bend%7D%7D%0A%7B%7Bend%7D%7D\
                    &p=4"
                  httpMethod: POST
                  authorization_scheme: Bearer
                  authorization_credentials: ${NTFY_TOKEN}
                disableResolveMessage: false
          - orgId: 1
            name: ntfy-prod-alert
            receivers:
              - uid: ntfy-prod-alert
                type: webhook
                settings:
                  # Priority rides in the query string because the webhook integration
                  # has no field for extra headers -- an X-Priority header is silently
                  # dropped, as httpHeaderName1/2 were: those are datasource fields,
                  # not contact-point ones, so Grafana ignored them and posted with no
                  # Authorization at all. ntfy answers that with 403, which is why
                  # nothing has ever arrived on a Grafana topic.
                  # Everything rides in the query string because the webhook
                  # integration has no field for extra headers. Without tpl, ntfy
                  # renders the raw Grafana JSON -- one tier arrived as an
                  # "attachment.json" file, the other as a wall of JSON.
                  #
                  # tpl=yes takes the title and message Grafana already composes and
                  # uses them as the notification, and p carries the tier priority; a
                  # named template such as template=grafana formats well but drops
                  # priority entirely, which is the one thing the tier must keep.
                  #
                  # The braces are percent-encoded, so the chart's tpl pass never sees
                  # a template action here and nothing has to be escaped against it.
                  url: "http://ntfy.delivery-bag.svc.cluster.local/Arbitorium-Prod-Alert?tpl=yes\
                    &t=%7B%7Bif+eq+.status+%22resolved%22%7D%7D%7B%7B%28index+.alerts+0%29.annotations.resolved_title%7D%7D%7B%7Belse%7D%7D%7B%7B.groupLabels.alertname%7D%7D%7B%7Bend%7D%7D\
                    &m=%7B%7Brange+.alerts%7D%7D%7B%7Bif+eq+.status+%22resolved%22%7D%7D%7B%7Bif+.annotations.resolved%7D%7D%7B%7B.annotations.resolved%7D%7D%7B%7Belse%7D%7DBack+to+normal.%7B%7Bend%7D%7D%7B%7Belse%7D%7D%7B%7B.annotations.summary%7D%7D%7B%7Bend%7D%7D%0A%7B%7Bend%7D%7D\
                    &p=5"
                  httpMethod: POST
                  authorization_scheme: Bearer
                  authorization_credentials: ${NTFY_TOKEN}
                disableResolveMessage: false
      policies.yaml:
        apiVersion: 1
        policies:
          - orgId: 1
            receiver: ntfy-prod-warn
            group_by: ['grafana_folder', 'alertname']
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 4h
            # Warn is the default tier, so a rule that says nothing still lands
            # somewhere read. Reaching the paging tier is opt-in, by severity.
            routes:
              - receiver: ntfy-prod-alert
                # =~ rather than =: kustomize re-serialises the matcher into block
                # style and drops the quotes, and a bare = on its own line is YAML's
                # value tag rather than the string. Anchored regex, same meaning, and
                # it survives the round trip. A matcher that fails to parse would
                # leave a critical rule on the warn tier.
                object_matchers:
                  - ['severity', '=~', 'critical']
                group_by: ['grafana_folder', 'alertname']
                group_wait: 30s
                group_interval: 5m
                repeat_interval: 1h
      rules.yaml:
        apiVersion: 1
        groups:
          # Metric alerts live in vmalert (base/vmalert, overlay phase-04-platform/vmalert);
          # only rules that query Loki remain here.
          - orgId: 1
            name: Security Guardrails
            folder: Security
            interval: 1m
            rules:
              - uid: ztunnel-deny-spike
                title: Network is blocking traffic
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: loki
                    model:
                      refId: A
                      expr: 'sum(count_over_time({app="ztunnel"} |= "denied" != "handling RBAC" [5m]))'
                      queryType: instant
                      intervalMs: 1000
                      maxDataPoints: 43200
                  - refId: B
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: "__expr__"
                    model:
                      refId: B
                      type: threshold
                      expression: A
                      conditions:
                        - evaluator:
                            type: gt
                            params:
                              - 10
                          operator:
                            type: and
                          query:
                            params:
                              - B
                          reducer:
                            type: last
                            params: []
                for: 5m
                noDataState: OK
                execErrState: Error
                labels:
                  severity: warning
                annotations:
                  summary: "The mesh is refusing an unusual amount of traffic"
                  resolved: "The mesh has stopped refusing traffic"
                  resolved_title: Network traffic is normal
        # Provisioning never removes a rule that leaves this file; these moved to vmalert.
        deleteRules:
          - orgId: 1
            uid: cnpg-backup-stale
          - orgId: 1
            uid: flux-resource-not-ready
          - orgId: 1
            uid: breakglass-cluster-gate
          - orgId: 1
            uid: breakglass-namespace-gate
          - orgId: 1
            uid: kyverno-webhook-missing
          - orgId: 1
            uid: kyverno-policy-violations
          - orgId: 1
            uid: default-sa-enforcement-suspended
          - orgId: 1
            uid: cert-client-expiring
          - orgId: 1
            uid: cert-client-expiring-critical
          - orgId: 1
            uid: cert-kubelet-rotation-stalled
