apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
spec:
  values:
    # Pod labels for Istio AuthorizationPolicy opt-in
    podLabels:
      policy.prplanit.com/ingress: "true"
      policy.prplanit.com/metrics: "true"
      policy.prplanit.com/cap.postgres: "true"
      policy.prplanit.com/access-scope-postgres: gossip-stone.grafana.postgres
      # Grafana does server-side OIDC token/userinfo exchange with Zitadel
      # (sso.prplanit.com) — needs the cell-membrane gateway hairpin allow.
      policy.prplanit.com/cap.oidc: "true"

    # Prometheus scraping
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "3000"

    # HA configuration
    replicas: 3

    # Override liveness probe — alerting provisioning + plugin install can take minutes
    livenessProbe:
      httpGet:
        path: /api/health
        port: 3000
      initialDelaySeconds: 120
      periodSeconds: 10
      failureThreshold: 15
      timeoutSeconds: 10

    # Disable built-in persistence - using PostgreSQL instead
    persistence:
      enabled: false

    # Configure PostgreSQL database
    grafana.ini:
      server:
        root_url: "https://grafana.pcfae.com"
        serve_from_sub_path: false
      database:
        type: postgres
        host: grafana-postgres-rw.gossip-stone.svc.cluster.local:5432
        name: grafana
        ssl_mode: disable
      unified_alerting:
        enabled: true
      # Zitadel SSO (generic OAuth). client_id/secret come from env
      # (GF_AUTH_GENERIC_OAUTH_CLIENT_ID/SECRET) so they stay out of values.
      auth.generic_oauth:
        enabled: true
        name: PrPlanIT SSO
        allow_sign_up: true
        scopes: "openid profile email offline_access"
        auth_url: "https://sso.prplanit.com/oauth/v2/authorize"
        token_url: "https://sso.prplanit.com/oauth/v2/token"
        api_url: "https://sso.prplanit.com/oidc/v1/userinfo"
        use_pkce: true
        # Role comes ONLY from the Zitadel-assigned role (flattened into the
        # `roles` claim by the flatRoles action); users with no Admin/Editor/
        # Viewer role are denied (strict), never auto-assigned.
        role_attribute_strict: true
        role_attribute_path: "contains(roles[*], 'Admin') && 'Admin' || contains(roles[*], 'Editor') && 'Editor' || contains(roles[*], 'Viewer') && 'Viewer' || 'None'"

    # Map secret keys to Grafana environment variables
    envValueFrom:
      GF_DATABASE_USER:
        secretKeyRef:
          name: grafana-postgres-credentials
          key: username
      GF_DATABASE_PASSWORD:
        secretKeyRef:
          name: grafana-postgres-credentials
          key: password
      NTFY_TOKEN:
        secretKeyRef:
          name: grafana-ntfy-token
          key: token
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID:
        secretKeyRef:
          name: grafana-oidc
          key: client_id
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
        secretKeyRef:
          name: grafana-oidc
          key: client_secret

    # Datasource provisioning
    datasources:
      datasources.yaml:
        apiVersion: 1
        deleteDatasources:
          - name: VictoriaMetrics
            orgId: 1
          - name: Loki
            orgId: 1
        datasources:
          - name: VictoriaMetrics
            uid: victoriametrics
            type: prometheus
            access: proxy
            url: http://vmselect.gossip-stone.svc.cluster.local:8481/select/0/prometheus
            isDefault: true
            editable: false
            jsonData:
              timeInterval: 30s
              httpMethod: POST
          - name: Loki
            uid: loki
            type: loki
            access: proxy
            url: http://loki.gossip-stone.svc.cluster.local:3100
            editable: false
            jsonData:
              maxLines: 1000

    # Dashboard provisioning
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: 'kubernetes'
            orgId: 1
            folder: 'Kubernetes'
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/kubernetes
          - name: 'system'
            orgId: 1
            folder: 'System'
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/system
          - name: 'monitoring'
            orgId: 1
            folder: 'Monitoring'
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/monitoring
          - name: 'infrastructure'
            orgId: 1
            folder: 'Infrastructure'
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/infrastructure
          - name: 'docker'
            orgId: 1
            folder: 'Docker'
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/docker
          - name: 'logs'
            orgId: 1
            folder: 'Logs'
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/logs

    # Mount dashboards from ConfigMaps (split to stay under 1MB limit)
    dashboardsConfigMaps:
      kubernetes: grafana-dashboards-kubernetes
      system: grafana-dashboards-system
      monitoring: grafana-dashboards-monitoring
      infrastructure: grafana-dashboards-infrastructure
      docker: grafana-dashboards-docker
      logs: grafana-dashboards-logs

    # Override default plugins volume with RWX PVC
    # sidecar is used to override the default emptyDir plugins volume
    sidecar:
      plugins:
        enabled: false  # Disable sidecar plugin loader to avoid conflicts
      dashboards:
        enabled: false  # Using provisioning instead

    # Add RWX volume for shared plugins
    extraVolumes:
      - name: grafana-plugins-shared
        existingClaim: gossip-stone-grafana-plugins

    extraVolumeMounts:
      - name: grafana-plugins-shared
        mountPath: /var/lib/grafana/plugins

    # Alerting provisioning — Phase 5 operational security guardrails
    alerting:
      contactpoints.yaml:
        apiVersion: 1
        contactPoints:
          - orgId: 1
            name: ntfy-security
            receivers:
              - uid: ntfy-security
                type: webhook
                settings:
                  url: "https://ntfy.pcfae.com/grafana-security-alerts"
                  httpMethod: POST
                  httpHeaderName1: "Authorization"
                  httpHeaderValue1: "Bearer ${NTFY_TOKEN}"
                disableResolveMessage: false
      policies.yaml:
        apiVersion: 1
        policies:
          - orgId: 1
            receiver: ntfy-security
            group_by: ['grafana_folder', 'alertname']
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 4h
      rules.yaml:
        apiVersion: 1
        groups:
          - orgId: 1
            name: Security Guardrails
            folder: Security
            interval: 1m
            rules:
              - uid: breakglass-cluster-gate
                title: Breakglass Cluster Gate Active
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      refId: A
                      expr: 'kube_namespace_labels{namespace="kube-system",label_zt_breakglass_active="true"}'
                      instant: true
                      intervalMs: 1000
                      maxDataPoints: 43200
                  - refId: B
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: "__expr__"
                    model:
                      refId: B
                      type: threshold
                      expression: A
                      conditions:
                        - evaluator:
                            type: gt
                            params:
                              - 0
                          operator:
                            type: and
                          query:
                            params:
                              - B
                          reducer:
                            type: last
                            params: []
                for: 0s
                noDataState: OK
                execErrState: Error
                labels:
                  severity: critical
                annotations:
                  summary: "Breakglass cluster gate (kube-system zt.breakglass/active=true) is active — emergency mesh bypass enabled cluster-wide"
              - uid: breakglass-namespace-gate
                title: Breakglass Namespace Gate Active
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      refId: A
                      expr: 'kube_namespace_labels{label_zt_breakglass_namespace="true"}'
                      instant: true
                      intervalMs: 1000
                      maxDataPoints: 43200
                  - refId: B
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: "__expr__"
                    model:
                      refId: B
                      type: threshold
                      expression: A
                      conditions:
                        - evaluator:
                            type: gt
                            params:
                              - 0
                          operator:
                            type: and
                          query:
                            params:
                              - B
                          reducer:
                            type: last
                            params: []
                for: 0s
                noDataState: OK
                execErrState: Error
                labels:
                  severity: warning
                annotations:
                  summary: "Breakglass namespace gate active — a namespace has zt.breakglass/namespace=true for emergency mesh bypass"
              - uid: kyverno-webhook-missing
                title: Kyverno Webhook Missing
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      refId: A
                      expr: 'absent(kube_validatingwebhookconfiguration_info{validatingwebhookconfiguration=~"kyverno.*"})'
                      instant: true
                      intervalMs: 1000
                      maxDataPoints: 43200
                  - refId: B
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: "__expr__"
                    model:
                      refId: B
                      type: threshold
                      expression: A
                      conditions:
                        - evaluator:
                            type: gt
                            params:
                              - 0
                          operator:
                            type: and
                          query:
                            params:
                              - B
                          reducer:
                            type: last
                            params: []
                for: 2m
                noDataState: Alerting
                execErrState: Error
                labels:
                  severity: critical
                annotations:
                  summary: "Kyverno validating webhook configuration is missing — admission enforcement is down"
              - uid: kyverno-policy-violations
                title: Kyverno Policy Violations
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      refId: A
                      expr: 'sum(rate(kyverno_policy_results_total{rule_result="fail"}[5m]))'
                      instant: true
                      intervalMs: 1000
                      maxDataPoints: 43200
                  - refId: B
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: "__expr__"
                    model:
                      refId: B
                      type: threshold
                      expression: A
                      conditions:
                        - evaluator:
                            type: gt
                            params:
                              - 0
                          operator:
                            type: and
                          query:
                            params:
                              - B
                          reducer:
                            type: last
                            params: []
                for: 5m
                noDataState: OK
                execErrState: Error
                labels:
                  severity: warning
                annotations:
                  summary: "Kyverno is reporting policy violations — review with kubectl get policyreport -A"
              - uid: ztunnel-deny-spike
                title: ztunnel Deny Spike
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: loki
                    model:
                      refId: A
                      expr: 'sum(count_over_time({app="ztunnel"} |= "denied" |!= "handling RBAC" [5m]))'
                      queryType: instant
                      intervalMs: 1000
                      maxDataPoints: 43200
                  - refId: B
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: "__expr__"
                    model:
                      refId: B
                      type: threshold
                      expression: A
                      conditions:
                        - evaluator:
                            type: gt
                            params:
                              - 10
                          operator:
                            type: and
                          query:
                            params:
                              - B
                          reducer:
                            type: last
                            params: []
                for: 5m
                noDataState: OK
                execErrState: Error
                labels:
                  severity: warning
                annotations:
                  summary: "ztunnel is denying traffic at elevated rate (>10 denies in 5m, excluding RBAC handling) — check for policy drift"
              - uid: default-sa-enforcement-suspended
                title: Default SA Enforcement Suspended
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      refId: A
                      expr: 'kube_namespace_labels{label_policy_prplanit_com_restrict_default_sa="suspended"}'
                      instant: true
                      intervalMs: 1000
                      maxDataPoints: 43200
                  - refId: B
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: "__expr__"
                    model:
                      refId: B
                      type: threshold
                      expression: A
                      conditions:
                        - evaluator:
                            type: gt
                            params:
                              - 0
                          operator:
                            type: and
                          query:
                            params:
                              - B
                          reducer:
                            type: last
                            params: []
                for: 0s
                noDataState: OK
                execErrState: Error
                labels:
                  severity: warning
                annotations:
                  summary: "restrict-default-sa enforcement is suspended for one or more namespaces — burn down SA violations and remove the label"
