apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
spec:
  values:
    # Pod labels for Istio AuthorizationPolicy opt-in
    podLabels:
      policy.prplanit.com/ingress: "true"
      policy.prplanit.com/metrics: "true"
      policy.prplanit.com/cap.postgres: "true"
      policy.prplanit.com/access-scope-postgres: gossip-stone.grafana.postgres
      # Grafana does server-side OIDC token/userinfo exchange with Zitadel
      # (sso.prplanit.com) — needs the cell-membrane gateway hairpin allow.
      policy.prplanit.com/cap.oidc: "true"

    # Prometheus scraping
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "3000"

    # HA configuration
    replicas: 3

    # Override liveness probe — alerting provisioning + plugin install can take minutes
    livenessProbe:
      httpGet:
        path: /api/health
        port: 3000
      initialDelaySeconds: 120
      periodSeconds: 10
      failureThreshold: 15
      timeoutSeconds: 10

    # Disable built-in persistence - using PostgreSQL instead
    persistence:
      enabled: false

    # Configure PostgreSQL database
    grafana.ini:
      server:
        root_url: "https://grafana.pcfae.com"
        serve_from_sub_path: false
      database:
        type: postgres
        host: grafana-postgres-rw.gossip-stone.svc.cluster.local:5432
        name: grafana
        ssl_mode: disable
      unified_alerting:
        enabled: true
      # Zitadel SSO (generic OAuth). client_id/secret come from env
      # (GF_AUTH_GENERIC_OAUTH_CLIENT_ID/SECRET) so they stay out of values.
      auth.generic_oauth:
        enabled: true
        name: PrPlanIT SSO
        allow_sign_up: true
        scopes: "openid profile email offline_access"
        auth_url: "https://sso.prplanit.com/oauth/v2/authorize"
        token_url: "https://sso.prplanit.com/oauth/v2/token"
        api_url: "https://sso.prplanit.com/oidc/v1/userinfo"
        use_pkce: true
        # Use Zitadel preferred_username (e.g. "kai") as the Grafana login,
        # not the email — avoids colliding with the built-in admin account
        # whose login was renamed to the same email.
        login_attribute_path: preferred_username
        # Role comes ONLY from the Zitadel-assigned role (flattened into the
        # `roles` claim by the flatRoles action); users with no Admin/Editor/
        # Viewer role are denied (strict), never auto-assigned.
        role_attribute_strict: true
        role_attribute_path: "contains(roles[*], 'Admin') && 'Admin' || contains(roles[*], 'Editor') && 'Editor' || contains(roles[*], 'Viewer') && 'Viewer' || 'None'"
      # Link an SSO login to the matching existing local account by (verified)
      # email, so ONE Grafana user signs in via both SSO and username/password.
      # Safe here: single trusted IdP (Zitadel) with email_verified=true.
      auth:
        oauth_allow_insecure_email_lookup: true

    # Map secret keys to Grafana environment variables
    envValueFrom:
      GF_DATABASE_USER:
        secretKeyRef:
          name: grafana-postgres-credentials
          key: username
      GF_DATABASE_PASSWORD:
        secretKeyRef:
          name: grafana-postgres-credentials
          key: password
      NTFY_TOKEN:
        secretKeyRef:
          name: grafana-ntfy-token
          key: token
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID:
        secretKeyRef:
          name: grafana-oidc
          key: client_id
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
        secretKeyRef:
          name: grafana-oidc
          key: client_secret

    # Datasource provisioning
    datasources:
      datasources.yaml:
        apiVersion: 1
        deleteDatasources:
          - name: VictoriaMetrics
            orgId: 1
          - name: Loki
            orgId: 1
        datasources:
          - name: VictoriaMetrics
            uid: victoriametrics
            type: prometheus
            access: proxy
            url: http://vmselect.gossip-stone.svc.cluster.local:8481/select/0/prometheus
            isDefault: true
            editable: false
            jsonData:
              timeInterval: 30s
              httpMethod: POST
          - name: Loki
            uid: loki
            type: loki
            access: proxy
            url: http://loki.gossip-stone.svc.cluster.local:3100
            editable: false
            jsonData:
              maxLines: 1000

    # Dashboard provisioning
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: 'kubernetes'
            orgId: 1
            folder: 'Kubernetes'
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/kubernetes
          - name: 'system'
            orgId: 1
            folder: 'System'
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/system
          - name: 'monitoring'
            orgId: 1
            folder: 'Monitoring'
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/monitoring
          - name: 'infrastructure'
            orgId: 1
            folder: 'Infrastructure'
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/infrastructure
          - name: 'docker'
            orgId: 1
            folder: 'Docker'
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/docker
          - name: 'logs'
            orgId: 1
            folder: 'Logs'
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/logs

    # Mount dashboards from ConfigMaps (split to stay under 1MB limit)
    dashboardsConfigMaps:
      kubernetes: grafana-dashboards-kubernetes
      system: grafana-dashboards-system
      monitoring: grafana-dashboards-monitoring
      infrastructure: grafana-dashboards-infrastructure
      docker: grafana-dashboards-docker
      logs: grafana-dashboards-logs

    # Override default plugins volume with RWX PVC
    # sidecar is used to override the default emptyDir plugins volume
    sidecar:
      plugins:
        enabled: false  # Disable sidecar plugin loader to avoid conflicts
      dashboards:
        enabled: false  # Using provisioning instead

    # Add RWX volume for shared plugins
    extraVolumes:
      - name: grafana-plugins-shared
        existingClaim: gossip-stone-grafana-plugins

    extraVolumeMounts:
      - name: grafana-plugins-shared
        mountPath: /var/lib/grafana/plugins

    # Alerting provisioning — Phase 5 operational security guardrails
    alerting:
      contactpoints.yaml:
        apiVersion: 1
        contactPoints:
          # Topics are named <Estate>-<Domain>-<Class>, and the class is the
          # interrupt tier. Naming the tier in the topic is what keeps the priority
          # honest: a publisher cannot send routine traffic at 5 without the topic
          # contradicting it, which is how the estate ended up with a channel that
          # alerted on every flap and so was never read.
          - orgId: 1
            name: ntfy-prod-warn
            receivers:
              - uid: ntfy-prod-warn
                type: webhook
                settings:
                  # Priority rides in the query string because the webhook integration
                  # has no field for extra headers -- an X-Priority header is silently
                  # dropped, as httpHeaderName1/2 were: those are datasource fields,
                  # not contact-point ones, so Grafana ignored them and posted with no
                  # Authorization at all. ntfy answers that with 403, which is why
                  # nothing has ever arrived on a Grafana topic.
                  url: "http://ntfy.delivery-bag.svc.cluster.local/Arbitorium-Prod-Warn?priority=4"
                  httpMethod: POST
                  authorization_scheme: Bearer
                  authorization_credentials: ${NTFY_TOKEN}
                disableResolveMessage: false
          - orgId: 1
            name: ntfy-prod-alert
            receivers:
              - uid: ntfy-prod-alert
                type: webhook
                settings:
                  # Priority rides in the query string because the webhook integration
                  # has no field for extra headers -- an X-Priority header is silently
                  # dropped, as httpHeaderName1/2 were: those are datasource fields,
                  # not contact-point ones, so Grafana ignored them and posted with no
                  # Authorization at all. ntfy answers that with 403, which is why
                  # nothing has ever arrived on a Grafana topic.
                  url: "http://ntfy.delivery-bag.svc.cluster.local/Arbitorium-Prod-Alert?priority=5"
                  httpMethod: POST
                  authorization_scheme: Bearer
                  authorization_credentials: ${NTFY_TOKEN}
                disableResolveMessage: false
      policies.yaml:
        apiVersion: 1
        policies:
          - orgId: 1
            receiver: ntfy-prod-warn
            group_by: ['grafana_folder', 'alertname']
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 4h
            # Warn is the default tier, so a rule that says nothing still lands
            # somewhere read. Reaching the paging tier is opt-in, by severity.
            routes:
              - receiver: ntfy-prod-alert
                # =~ rather than =: kustomize re-serialises the matcher into block
                # style and drops the quotes, and a bare = on its own line is YAML's
                # value tag rather than the string. Anchored regex, same meaning, and
                # it survives the round trip. A matcher that fails to parse would
                # leave a critical rule on the warn tier.
                object_matchers:
                  - ['severity', '=~', 'critical']
                group_by: ['grafana_folder', 'alertname']
                group_wait: 30s
                group_interval: 5m
                repeat_interval: 1h
      rules.yaml:
        apiVersion: 1
        groups:
          - orgId: 1
            name: Backup Health
            folder: Operations
            interval: 5m
            rules:
              - uid: cnpg-backup-stale
                title: CNPG Backup Overdue
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 900
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      refId: A
                      # Hours since the last backup barman can actually see in the
                      # object store, per cluster. Read from the archive rather than
                      # from Backup objects: those have gone missing before while the
                      # backups themselves were fine, so they are the wrong thing to
                      # judge recoverability by.
                      #
                      # label_replace turns the pod name into a cluster name so three
                      # instances raise one alert. max picks the freshest instance:
                      # they all report the same archive, and a lagging replica should
                      # not read as a missed backup. Alloy scrapes each pod once per
                      # container, so the container label is aggregated away too.
                      expr: '(time() - max by (cluster) (label_replace(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp,
                        "cluster", "$1", "pod", "(.+)-[0-9]+"))) / 3600'
                      instant: true
                      intervalMs: 1000
                      maxDataPoints: 43200
                  - refId: B
                    relativeTimeRange:
                      from: 900
                      to: 0
                    datasourceUid: "__expr__"
                    model:
                      refId: B
                      type: threshold
                      expression: A
                      conditions:
                        - evaluator:
                            type: gt
                            # Backups are nightly and staggered across 22:00-00:10, so
                            # a healthy cluster peaks just under 24h immediately before
                            # its own slot. 26 leaves two hours of grace for a slow run
                            # without letting a genuinely missed night pass unreported.
                            params:
                              - 26
                          operator:
                            type: and
                          query:
                            params:
                              - B
                          reducer:
                            type: last
                            params: []
                # An hour, not five minutes: a backup that is late is still late an
                # hour later, and this must not fire on the gap while one is running.
                for: 1h
                # A cluster that stops reporting has a bigger problem than a stale
                # backup and should be said out loud rather than resolved quietly.
                noDataState: Alerting
                execErrState: Error
                labels:
                  severity: warning
                annotations:
                  # The chart runs tpl over this whole block, so Helm evaluates any
                  # {{ }} before Grafana ever sees it and the release fails to render.
                  # Only the braces are quoted, never the expression: toYaml rewraps
                  # long lines, and a newline landing inside a Go string literal is an
                  # unterminated quoted string. Two-character literals cannot be split.
                  summary: '{{ "{{" }} $labels.cluster {{ "}}" }} has no backup in over 26h - check the ObjectStore recoveryWindow and pg_stat_archiver'
          - orgId: 1
            name: Flux Health
            folder: Operations
            interval: 5m
            rules:
              - uid: flux-resource-not-ready
                title: Flux Resource Not Ready
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 900
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      refId: A
                      # gotk_resource_info comes from kube-state-metrics reading the
                      # Flux CRs, not from the controllers: v2.7.5 publishes no
                      # readiness metric of its own, which is why three releases could
                      # fail for weeks unnoticed.
                      #
                      # ready="False" only. Unknown is the normal state mid-reconcile
                      # and a slow chart can hold it past the for window, so including
                      # it would trade a real signal for noise.
                      #
                      # suspended is absent rather than "false" when spec.suspend is
                      # unset, so this excludes the truthy value instead of requiring
                      # the falsy one. A deliberately paused resource is not an alert.
                      #
                      # One series per resource, so each failing release raises its own
                      # instance rather than collapsing into a single count.
                      expr: 'gotk_resource_info{ready="False", suspended!="true"}'
                      instant: true
                      intervalMs: 1000
                      maxDataPoints: 43200
                  - refId: B
                    relativeTimeRange:
                      from: 900
                      to: 0
                    datasourceUid: __expr__
                    model:
                      refId: B
                      type: threshold
                      expression: A
                      conditions:
                        - evaluator:
                            type: gt
                            params:
                              - 0
                          operator:
                            type: and
                          query:
                            params:
                              - B
                          reducer:
                            type: last
                            params: []
                # Long enough that an ordinary upgrade finishes inside it; short enough
                # that a stalled release is caught the same morning.
                for: 15m
                # No data means kube-state-metrics stopped publishing, which hides every
                # Flux failure at once. That is worth knowing, so it is not OK.
                noDataState: Alerting
                execErrState: Error
                labels:
                  severity: warning
                annotations:
                  summary: '{{ "{{" }} $labels.customresource_kind {{ "}}" }}
                    {{ "{{" }} $labels.exported_namespace {{ "}}" }}/{{ "{{" }} $labels.name {{ "}}" }}
                    has been not-Ready for 15m - check its conditions and helm history'
          - orgId: 1
            name: Security Guardrails
            folder: Security
            interval: 1m
            rules:
              - uid: breakglass-cluster-gate
                title: Breakglass Cluster Gate Active
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      refId: A
                      expr: 'kube_namespace_labels{exported_namespace="kube-system",label_zt_breakglass_active="true"}'
                      instant: true
                      intervalMs: 1000
                      maxDataPoints: 43200
                  - refId: B
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: "__expr__"
                    model:
                      refId: B
                      type: threshold
                      expression: A
                      conditions:
                        - evaluator:
                            type: gt
                            params:
                              - 0
                          operator:
                            type: and
                          query:
                            params:
                              - B
                          reducer:
                            type: last
                            params: []
                for: 0s
                noDataState: OK
                execErrState: Error
                labels:
                  severity: critical
                annotations:
                  summary: "Breakglass cluster gate (kube-system zt.breakglass/active=true) is active — emergency mesh bypass enabled cluster-wide"
              - uid: breakglass-namespace-gate
                title: Breakglass Namespace Gate Active
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      refId: A
                      expr: 'kube_namespace_labels{label_zt_breakglass_namespace="true"}'
                      instant: true
                      intervalMs: 1000
                      maxDataPoints: 43200
                  - refId: B
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: "__expr__"
                    model:
                      refId: B
                      type: threshold
                      expression: A
                      conditions:
                        - evaluator:
                            type: gt
                            params:
                              - 0
                          operator:
                            type: and
                          query:
                            params:
                              - B
                          reducer:
                            type: last
                            params: []
                for: 0s
                noDataState: OK
                execErrState: Error
                labels:
                  severity: warning
                annotations:
                  summary: "Breakglass namespace gate active — a namespace has zt.breakglass/namespace=true for emergency mesh bypass"
              - uid: kyverno-webhook-missing
                title: Kyverno Webhook Missing
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      refId: A
                      expr: 'absent(kube_validatingwebhookconfiguration_info{validatingwebhookconfiguration=~"kyverno.*"})'
                      instant: true
                      intervalMs: 1000
                      maxDataPoints: 43200
                  - refId: B
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: "__expr__"
                    model:
                      refId: B
                      type: threshold
                      expression: A
                      conditions:
                        - evaluator:
                            type: gt
                            params:
                              - 0
                          operator:
                            type: and
                          query:
                            params:
                              - B
                          reducer:
                            type: last
                            params: []
                for: 2m
                noDataState: Alerting
                execErrState: Error
                labels:
                  severity: critical
                annotations:
                  summary: "Kyverno validating webhook configuration is missing — admission enforcement is down"
              - uid: kyverno-policy-violations
                title: Kyverno Policy Violations
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      refId: A
                      expr: 'sum(rate(kyverno_policy_results_total{rule_result="fail",policy_validation_mode="enforce"}[5m]))'
                      instant: true
                      intervalMs: 1000
                      maxDataPoints: 43200
                  - refId: B
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: "__expr__"
                    model:
                      refId: B
                      type: threshold
                      expression: A
                      conditions:
                        - evaluator:
                            type: gt
                            # enforce-mode failures sit at about 0.067/s steady, so a
                            # threshold of zero alerts on the normal rate of blocked
                            # admissions. 0.5/s is roughly 150 rejections in the five
                            # minutes this must hold for, which is a rate no ordinary
                            # deployment produces.
                            params:
                              - 0.5
                          operator:
                            type: and
                          query:
                            params:
                              - B
                          reducer:
                            type: last
                            params: []
                for: 5m
                noDataState: OK
                execErrState: Error
                labels:
                  severity: warning
                annotations:
                  summary: "Kyverno is reporting policy violations — review with kubectl get policyreport -A"
              - uid: ztunnel-deny-spike
                title: ztunnel Deny Spike
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: loki
                    model:
                      refId: A
                      expr: 'sum(count_over_time({app="ztunnel"} |= "denied" != "handling RBAC" [5m]))'
                      queryType: instant
                      intervalMs: 1000
                      maxDataPoints: 43200
                  - refId: B
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: "__expr__"
                    model:
                      refId: B
                      type: threshold
                      expression: A
                      conditions:
                        - evaluator:
                            type: gt
                            params:
                              - 10
                          operator:
                            type: and
                          query:
                            params:
                              - B
                          reducer:
                            type: last
                            params: []
                for: 5m
                noDataState: OK
                execErrState: Error
                labels:
                  severity: warning
                annotations:
                  summary: "ztunnel is denying traffic at elevated rate (>10 denies in 5m, excluding RBAC handling) — check for policy drift"
              - uid: default-sa-enforcement-suspended
                title: Default SA Enforcement Suspended
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      refId: A
                      expr: 'kube_namespace_labels{label_policy_prplanit_com_restrict_default_sa="suspended",
                        exported_namespace!~"gorons-bracelet|hookshot|hyrule-castle|temple-of-time|tingle-tuner|training-dummy"}'
                      instant: true
                      intervalMs: 1000
                      maxDataPoints: 43200
                  - refId: B
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: "__expr__"
                    model:
                      refId: B
                      type: threshold
                      expression: A
                      conditions:
                        - evaluator:
                            type: gt
                            params:
                              - 0
                          operator:
                            type: and
                          query:
                            params:
                              - B
                          reducer:
                            type: last
                            params: []
                for: 0s
                noDataState: OK
                execErrState: Error
                labels:
                  severity: warning
                annotations:
                  summary: "restrict-default-sa enforcement is suspended for one or more namespaces — burn down SA violations and remove the label"
