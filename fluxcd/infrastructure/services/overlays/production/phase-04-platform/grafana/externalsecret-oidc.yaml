apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oidc
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-zeldas-letter
    kind: ClusterSecretStore
  target:
    name: grafana-oidc
    creationPolicy: Owner
  data:
    - secretKey: client_id
      remoteRef:
        key: apps/grafana
        property: OIDC_CLIENT_ID
    - secretKey: client_secret
      remoteRef:
        key: apps/grafana
        property: OIDC_CLIENT_SECRET
