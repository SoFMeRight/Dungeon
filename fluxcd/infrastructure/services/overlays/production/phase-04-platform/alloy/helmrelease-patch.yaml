apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
spec:
  targetNamespace: lakitu
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: DaemonSet
              name: alloy
            patch: |
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: alloy
              spec:
                template:
                  metadata:
                    labels:
                      policy.prplanit.com/metrics: "true"
  values:
    alloy:
      extraAnnotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "12345"
      configMap:
        create: false
        name: "alloy-config"
      clustering:
        enabled: true
      extraEnv:
        - name: VM_AUTH_USERNAME
          valueFrom:
            secretKeyRef:
              name: alloy-ingest-auth
              key: username
      mounts:
        extra:
          - name: vm-auth
            mountPath: /run/secrets
            readOnly: true
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: "6130m"
          memory: 2Gi
    configReloader:
      resources:
        limits:
          cpu: 1570m
          memory: 112Mi
    controller:
      # The control-plane nodes run alloy-control-plane (helmrelease-control-plane.yaml).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      volumes:
        extra:
          - name: vm-auth
            secret:
              secretName: alloy-ingest-auth
              items:
                - key: password
                  path: vm_password
