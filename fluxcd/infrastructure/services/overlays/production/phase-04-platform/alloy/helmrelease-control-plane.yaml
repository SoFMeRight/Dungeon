# alloy on the control-plane nodes, with its own CPU limit; same chart, config, auth and mounts as
# the main alloy. Clustering is off, and ALLOY_CLUSTERWIDE_TARGETS drops the cluster-wide scrapes,
# which the main alloy owns.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy-control-plane
spec:
  releaseName: alloy-control-plane
  targetNamespace: lakitu
  interval: 30m
  chartRef:
    kind: HelmChart
    name: alloy
    namespace: flux-system
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: DaemonSet
              name: alloy-control-plane
            patch: |
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: alloy-control-plane
              spec:
                template:
                  metadata:
                    labels:
                      policy.prplanit.com/metrics: "true"
  values:
    fullnameOverride: "alloy-control-plane"
    image:
      registry: docker.io
      repository: grafana/alloy
      tag: "v1.21.2"
    alloy:
      extraAnnotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "12345"
      configMap:
        create: false
        name: "alloy-config"
      clustering:
        enabled: false
      extraEnv:
        - name: VM_AUTH_USERNAME
          valueFrom:
            secretKeyRef:
              name: alloy-ingest-auth
              key: username
        - name: ALLOY_CLUSTERWIDE_TARGETS
          value: "^$"
      mounts:
        varlog: true
        dockercontainers: false
        extra:
          - name: vm-auth
            mountPath: /run/secrets
            readOnly: true
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 708m
          memory: 2Gi
    configReloader:
      resources:
        requests:
          cpu: 10m
          memory: 50Mi
        limits:
          cpu: 555m
          memory: 50Mi
    controller:
      type: 'daemonset'
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      volumes:
        extra:
          - name: vm-auth
            secret:
              secretName: alloy-ingest-auth
              items:
                - key: password
                  path: vm_password
    serviceAccount:
      create: true
    rbac:
      create: true
