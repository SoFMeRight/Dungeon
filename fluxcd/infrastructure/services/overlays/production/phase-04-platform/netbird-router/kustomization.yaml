apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The NetBird in-cluster subnet router has its own namespace, apart from the netbird
# control plane: it needs NET_ADMIN/MKNOD, which baseline PodSecurity forbids, so its
# privileged namespace holds nothing else.
namespace: optcp-vpn
resources:
  - ../../../../base/netbird-router
patches:
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: docker.io/netbirdio/netbird:0.78.1
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: https://vpn.optcp.com
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: ceph-rbd
    target:
      kind: StatefulSet
      name: netbird-router-dungeon
