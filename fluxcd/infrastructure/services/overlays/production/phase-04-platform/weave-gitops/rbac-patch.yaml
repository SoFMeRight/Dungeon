# Weave impersonates the raw `roles` claim; group is unprefixed `operator`, not `prplanit-sso:`.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: weave-gitops-oidc-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: weave-gitops-reconciler
subjects:
  - kind: Group
    name: operator
    apiGroup: rbac.authorization.k8s.io
