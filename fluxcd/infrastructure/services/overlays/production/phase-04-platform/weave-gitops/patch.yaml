apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: weave-gitops
spec:
  targetNamespace: gossip-stone
  valuesFrom:
    - kind: ConfigMap
      name: weave-gitops-values
      valuesKey: values.yaml
  values:
    podLabels:
      policy.prplanit.com/ingress: "true"
      policy.prplanit.com/metrics: "true"
      # weave-gitops validates OIDC tokens against Zitadel (sso.prplanit.com)
      # server-side — needs the cell-membrane gateway hairpin allow.
      policy.prplanit.com/cap.oidc: "true"
    service:
      type: ClusterIP
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        cpu: 1
        memory: 512Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
