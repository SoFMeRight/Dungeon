apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ./alloy
  - ./crowdsec
  - ./gatus
  - ./grafana
  - ./graphite-exporter-truenas
  - ./kube-state-metrics
  - ./loki
  - ./node-exporter
  - ./victoria-metrics
  - ./netbird
  - ./netbird-router
  - ./ntfy
  - ./nutify
  - ./prometheus-exporter-eaton-ups
  - ./prometheus-exporter-pve
  - ./searxng
  - ./stunner
  - ./uptime-kuma
  - ./vaultwarden
  - ./wazuh
  - ./weave-gitops
  - ./boundary
  - ./unifi
  - ./netconsole-collector

patches:
  # Durable resilience: every HelmRelease auto-retries a transient upgrade failure
  # (e.g. a readiness-wait timeout during cluster churn) instead of latching
  # UpgradeFailed until a manual force. retries:3 matches the house convention;
  # new HRs in this overlay inherit it automatically.
  - target:
      kind: HelmRelease
    patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: all-helmreleases
      spec:
        upgrade:
          remediation:
            retries: 3
