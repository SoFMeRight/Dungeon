# Shared by the alloy and alloy-control-plane HelmReleases; bump the version here only.
# Outside alloy/ (namespace: lakitu): a HelmChart must sit in its HelmRepository's namespace.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmChart
metadata:
  name: alloy
  namespace: flux-system
spec:
  chart: alloy
  version: "1.13.1"
  sourceRef:
    kind: HelmRepository
    name: grafana
  interval: 12h
  reconcileStrategy: ChartVersion
