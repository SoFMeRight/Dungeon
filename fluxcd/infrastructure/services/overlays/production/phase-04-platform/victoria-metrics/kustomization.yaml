apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gossip-stone
resources:
  - ../../../../base/victoria-metrics
  - httproute-ingest.yaml
patches:
  - target:
      kind: StatefulSet
      name: vmstorage
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: docker.io/victoriametrics/vmstorage:v1.97.1-cluster
      # CPU request from 7d usage (2026-10-27): p99 279m.
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "300m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "2Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "2"
      # Memory limit from 30d usage (2026-10-27): working-set peak 4047Mi (RSS 2850Mi) against
      # the previous 4Gi; peak x 1.15.
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "5Gi"
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: "ceph-rbd-hdd"
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: "128Gi"
  - target:
      kind: Deployment
      name: vminsert
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: docker.io/victoriametrics/vminsert:v1.97.1-cluster
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "200m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "512Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "544Mi"
      - op: add
        path: /spec/template/metadata/labels/policy.prplanit.com~1ingress
        value: "true"
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: "-httpAuth.username=$(VM_AUTH_USERNAME)"
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: "-httpAuth.password=$(VM_AUTH_PASSWORD)"
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: VM_AUTH_USERNAME
            valueFrom:
              secretKeyRef:
                name: vminsert-basic-auth
                key: username
          - name: VM_AUTH_PASSWORD
            valueFrom:
              secretKeyRef:
                name: vminsert-basic-auth
                key: password
  - target:
      kind: Deployment
      name: vmselect
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: docker.io/victoriametrics/vmselect:v1.97.1-cluster
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "200m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "512Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "2Gi"
  - target:
      kind: Deployment
      name: vmauth
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: docker.io/victoriametrics/vmauth:v1.97.1
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "50m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "64Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "200m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "128Mi"
