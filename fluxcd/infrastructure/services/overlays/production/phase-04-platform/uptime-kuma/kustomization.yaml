apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: optcp-gossip-stone
resources:
  - ../../../../base/uptime-kuma
  - httproute-xylem.yaml
# Held at zero for the volume re-bind into optcp-gossip-stone.
replicas:
  - name: uptime-kuma
    count: 0

patches:
  - path: statefulset-patch.yaml
  - path: httproute-patch.yaml
  - path: service-patch.yaml
    target:
      kind: Service
      name: uptime-kuma
  - path: service-uptime-kuma-ingress-patch.yaml
    target:
      kind: Service
      name: uptime-kuma
