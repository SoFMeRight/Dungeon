apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: crowdsec
spec:
  replicas: 1
  template:
    metadata:
      labels:
        # Policy Contract Standard: client capability + instance scope for its postgres.
        policy.prplanit.com/cap.postgres: "true"
        policy.prplanit.com/access-scope-postgres: lens-of-truth.crowdsec.postgres
    spec:
      containers:
        - name: crowdsec
          image: ghcr.io/crowdsecurity/crowdsec:v1.8.1
          env:
            - name: CUSTOM_HOSTNAME
              value: "dungeon-k8s"
            - name: CROWDSEC_API_PORT
              value: "3403"
            - name: ENROLL_KEY
              value: "cm9ntuqmc000jjx08n5r84rtt"
            - name: ENROLL_INSTANCE_NAME
              value: "Dungeon"
            - name: ENROLL_TAGS
              value: "k8s linux production"
            # Bouncer + machine identities/credentials — all Vault-backed, consumed by the
            # postStart hook below. crowdsec has no native env to register a named bouncer or a
            # remote machine from values, so name/key/pass are passed through and registered there.
            - name: BOUNCER_CLOUDFLARE_NAME
              valueFrom:
                secretKeyRef:
                  name: crowdsec-secrets
                  key: BOUNCER_CLOUDFLARE_NAME
            - name: BOUNCER_CLOUDFLARE_LAPI_KEY
              valueFrom:
                secretKeyRef:
                  name: crowdsec-secrets
                  key: BOUNCER_CLOUDFLARE_LAPI_KEY
            - name: BOUNCER_SHIELD_GENERATOR_NAME
              valueFrom:
                secretKeyRef:
                  name: crowdsec-secrets
                  key: BOUNCER_SHIELD_GENERATOR_NAME
            - name: BOUNCER_SHIELD_GENERATOR_LAPI_KEY
              valueFrom:
                secretKeyRef:
                  name: crowdsec-secrets
                  key: BOUNCER_SHIELD_GENERATOR_LAPI_KEY
            - name: BOUNCER_SHIELD_REGENERATOR_NAME
              valueFrom:
                secretKeyRef:
                  name: crowdsec-secrets
                  key: BOUNCER_SHIELD_REGENERATOR_NAME
            - name: BOUNCER_SHIELD_REGENERATOR_LAPI_KEY
              valueFrom:
                secretKeyRef:
                  name: crowdsec-secrets
                  key: BOUNCER_SHIELD_REGENERATOR_LAPI_KEY
            - name: MACHINE_SHIELD_GENERATOR_NAME
              valueFrom:
                secretKeyRef:
                  name: crowdsec-secrets
                  key: MACHINE_SHIELD_GENERATOR_NAME
            - name: MACHINE_SHIELD_GENERATOR_PASS
              valueFrom:
                secretKeyRef:
                  name: crowdsec-secrets
                  key: MACHINE_SHIELD_GENERATOR_PASS
            - name: MACHINE_SHIELD_REGENERATOR_NAME
              valueFrom:
                secretKeyRef:
                  name: crowdsec-secrets
                  key: MACHINE_SHIELD_REGENERATOR_NAME
            - name: MACHINE_SHIELD_REGENERATOR_PASS
              valueFrom:
                secretKeyRef:
                  name: crowdsec-secrets
                  key: MACHINE_SHIELD_REGENERATOR_PASS
          volumeMounts:
            - name: lens-of-truth-crowdsec-data
              mountPath: /var/lib/crowdsec/data
            - name: lens-of-truth-crowdsec-config
              mountPath: /etc/crowdsec
            # config.yaml.local (db_config -> postgres) deep-merges over the persisted
            # config.yaml. crowdsec v1.8.1 ignores DB_* env against an existing config.yaml,
            # so this override is what actually points it at crowdsec-postgres.
            - name: config-local
              mountPath: /etc/crowdsec/config.yaml.local
              subPath: config.yaml.local
              readOnly: true
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - |
                    # Register all bouncers + log-processor machines from Vault-backed env.
                    # cscli writes straight to the DB (no LAPI needed). Bouncers have no --force
                    # so delete-then-add (also self-heals a rotated/typo'd key); machines use
                    # --force. -f /dev/null keeps the local agent creds untouched. Best-effort so
                    # a transient failure never blocks crowdsec from starting.
                    for i in $(seq 1 60); do cscli bouncers list >/dev/null 2>&1 && break; sleep 2; done
                    cscli bouncers delete "$BOUNCER_CLOUDFLARE_NAME" >/dev/null 2>&1 || true
                    cscli bouncers add "$BOUNCER_CLOUDFLARE_NAME" -k "$BOUNCER_CLOUDFLARE_LAPI_KEY" >/dev/null 2>&1 || true
                    cscli bouncers delete "$BOUNCER_SHIELD_GENERATOR_NAME" >/dev/null 2>&1 || true
                    cscli bouncers add "$BOUNCER_SHIELD_GENERATOR_NAME" -k "$BOUNCER_SHIELD_GENERATOR_LAPI_KEY" >/dev/null 2>&1 || true
                    cscli bouncers delete "$BOUNCER_SHIELD_REGENERATOR_NAME" >/dev/null 2>&1 || true
                    cscli bouncers add "$BOUNCER_SHIELD_REGENERATOR_NAME" -k "$BOUNCER_SHIELD_REGENERATOR_LAPI_KEY" >/dev/null 2>&1 || true
                    cscli machines add "$MACHINE_SHIELD_GENERATOR_NAME" --password "$MACHINE_SHIELD_GENERATOR_PASS" -f /dev/null --force || true
                    cscli machines add "$MACHINE_SHIELD_REGENERATOR_NAME" --password "$MACHINE_SHIELD_REGENERATOR_PASS" -f /dev/null --force || true
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
      volumes:
        - name: config-local
          secret:
            secretName: crowdsec-config-local
  volumeClaimTemplates:
    # volumeClaimTemplates has no strategic-merge key, so this list REPLACES the base's
    # -- the config claim must be restated here or it is silently dropped.
    - metadata:
        name: lens-of-truth-crowdsec-config
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ceph-rbd
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: lens-of-truth-crowdsec-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ceph-rbd
        resources:
          requests:
            storage: 10Gi
