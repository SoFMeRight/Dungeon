apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: crowdsec
spec:
  replicas: 1
  template:
    metadata:
      labels:
        # Policy Contract Standard: client capability + instance scope for its postgres.
        policy.prplanit.com/cap.postgres: "true"
        policy.prplanit.com/access-scope-postgres: lens-of-truth.crowdsec.postgres
    spec:
      containers:
        - name: crowdsec
          image: ghcr.io/crowdsecurity/crowdsec:v1.8.1
          env:
            - name: CUSTOM_HOSTNAME
              value: "dungeon-k8s"
            - name: CROWDSEC_API_PORT
              value: "3403"
            - name: ENROLL_KEY
              value: "cm9ntuqmc000jjx08n5r84rtt"
            - name: ENROLL_INSTANCE_NAME
              value: "Dungeon"
            - name: ENROLL_TAGS
              value: "k8s linux production"
            # Postgres backend (replaces SQLite). CrowdSec's entrypoint writes these into
            # db_config on each start. sslmode=disable — the hop is mTLS-encrypted in-mesh.
            - name: DB_TYPE
              value: "postgresql"
            - name: DB_HOST
              value: "crowdsec-postgres"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: "crowdsec"
            - name: DB_NAME
              value: "crowdsec"
            - name: DB_SSLMODE
              value: "disable"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: crowdsec-secrets
                  key: CROWDSEC_DB_PASSWORD
            # Re-register the cloudflare-bouncer on the fresh DB with its existing LAPI key
            # (Vault-backed; reference only, no secret in git).
            - name: BOUNCER_KEY_cloudflare
              valueFrom:
                secretKeyRef:
                  name: crowdsec-secrets
                  key: CROWDSEC_LAPI_KEY
          volumeMounts:
            - name: lens-of-truth-crowdsec-data
              mountPath: /var/lib/crowdsec/data
            - name: lens-of-truth-crowdsec-config
              mountPath: /etc/crowdsec
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
  volumeClaimTemplates:
    # volumeClaimTemplates has no strategic-merge key, so this list REPLACES the base's
    # -- the config claim must be restated here or it is silently dropped.
    - metadata:
        name: lens-of-truth-crowdsec-config
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ceph-rbd
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: lens-of-truth-crowdsec-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ceph-rbd
        resources:
          requests:
            storage: 10Gi
