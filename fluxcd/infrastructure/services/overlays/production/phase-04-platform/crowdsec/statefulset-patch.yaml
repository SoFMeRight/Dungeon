apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: crowdsec
spec:
  replicas: 1
  template:
    metadata:
      labels:
        # Policy Contract Standard: client capability + instance scope for its postgres.
        policy.prplanit.com/cap.postgres: "true"
        policy.prplanit.com/access-scope-postgres: lens-of-truth.crowdsec.postgres
    spec:
      initContainers:
        # Seed the crowdsec Postgres DB with the Vault-declared bouncers + log-processor
        # machines BEFORE crowdsec starts. cscli writes straight to the DB (needs only Postgres,
        # not the LAPI), via a standalone db_config, so it never depends on the main container's
        # generated config or on crowdsec being up. Waits out transient startup DNS; best-effort
        # (exit 0) so it can never block or crashloop crowdsec. Re-runs on every pod start, which
        # is when fresh Vault values arrive — so it re-converges to the declared state.
        - name: pfsense-registrar
          image: ghcr.io/crowdsecurity/crowdsec:v1.8.1
          command:
            - sh
            - -c
            - |
              mkdir -p /tmp/registrar-data
              C="cscli -c /registrar-config/config.yaml"
              for i in $(seq 1 40); do $C bouncers list >/dev/null 2>&1 && break; sleep 3; done
              reg() { $C bouncers delete "$1" >/dev/null 2>&1 || true; $C bouncers add "$1" -k "$2" >/dev/null 2>&1 || true; }
              reg "$BOUNCER_CLOUDFLARE_NAME" "$BOUNCER_CLOUDFLARE_LAPI_KEY"
              reg "$BOUNCER_SHIELD_GENERATOR_NAME" "$BOUNCER_SHIELD_GENERATOR_LAPI_KEY"
              reg "$BOUNCER_SHIELD_REGENERATOR_NAME" "$BOUNCER_SHIELD_REGENERATOR_LAPI_KEY"
              $C machines add "$MACHINE_SHIELD_GENERATOR_NAME" --password "$MACHINE_SHIELD_GENERATOR_PASS" -f /dev/null --force >/dev/null 2>&1 || true
              $C machines add "$MACHINE_SHIELD_REGENERATOR_NAME" --password "$MACHINE_SHIELD_REGENERATOR_PASS" -f /dev/null --force >/dev/null 2>&1 || true
              exit 0
          env:
            - name: BOUNCER_CLOUDFLARE_NAME
              valueFrom:
                secretKeyRef:
                  name: crowdsec-secrets
                  key: BOUNCER_CLOUDFLARE_NAME
            - name: BOUNCER_CLOUDFLARE_LAPI_KEY
              valueFrom:
                secretKeyRef:
                  name: crowdsec-secrets
                  key: BOUNCER_CLOUDFLARE_LAPI_KEY
            - name: BOUNCER_SHIELD_GENERATOR_NAME
              valueFrom:
                secretKeyRef:
                  name: crowdsec-secrets
                  key: BOUNCER_SHIELD_GENERATOR_NAME
            - name: BOUNCER_SHIELD_GENERATOR_LAPI_KEY
              valueFrom:
                secretKeyRef:
                  name: crowdsec-secrets
                  key: BOUNCER_SHIELD_GENERATOR_LAPI_KEY
            - name: BOUNCER_SHIELD_REGENERATOR_NAME
              valueFrom:
                secretKeyRef:
                  name: crowdsec-secrets
                  key: BOUNCER_SHIELD_REGENERATOR_NAME
            - name: BOUNCER_SHIELD_REGENERATOR_LAPI_KEY
              valueFrom:
                secretKeyRef:
                  name: crowdsec-secrets
                  key: BOUNCER_SHIELD_REGENERATOR_LAPI_KEY
            - name: MACHINE_SHIELD_GENERATOR_NAME
              valueFrom:
                secretKeyRef:
                  name: crowdsec-secrets
                  key: MACHINE_SHIELD_GENERATOR_NAME
            - name: MACHINE_SHIELD_GENERATOR_PASS
              valueFrom:
                secretKeyRef:
                  name: crowdsec-secrets
                  key: MACHINE_SHIELD_GENERATOR_PASS
            - name: MACHINE_SHIELD_REGENERATOR_NAME
              valueFrom:
                secretKeyRef:
                  name: crowdsec-secrets
                  key: MACHINE_SHIELD_REGENERATOR_NAME
            - name: MACHINE_SHIELD_REGENERATOR_PASS
              valueFrom:
                secretKeyRef:
                  name: crowdsec-secrets
                  key: MACHINE_SHIELD_REGENERATOR_PASS
          volumeMounts:
            - name: registrar-config
              mountPath: /registrar-config
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
      containers:
        - name: crowdsec
          image: ghcr.io/crowdsecurity/crowdsec:v1.8.1
          env:
            - name: CUSTOM_HOSTNAME
              value: "dungeon-k8s"
            - name: CROWDSEC_API_PORT
              value: "3403"
            - name: ENROLL_KEY
              value: "cm9ntuqmc000jjx08n5r84rtt"
            - name: ENROLL_INSTANCE_NAME
              value: "Dungeon"
            - name: ENROLL_TAGS
              value: "k8s linux production"
          volumeMounts:
            - name: lens-of-truth-crowdsec-data
              mountPath: /var/lib/crowdsec/data
            - name: lens-of-truth-crowdsec-config
              mountPath: /etc/crowdsec
            # config.yaml.local (db_config -> postgres) deep-merges over the persisted
            # config.yaml. crowdsec v1.8.1 ignores DB_* env against an existing config.yaml,
            # so this override is what actually points it at crowdsec-postgres.
            - name: config-local
              mountPath: /etc/crowdsec/config.yaml.local
              subPath: config.yaml.local
              readOnly: true
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
      volumes:
        - name: config-local
          secret:
            secretName: crowdsec-config-local
        - name: registrar-config
          secret:
            secretName: crowdsec-registrar-config
  volumeClaimTemplates:
    # volumeClaimTemplates has no strategic-merge key, so this list REPLACES the base's
    # -- the config claim must be restated here or it is silently dropped.
    - metadata:
        name: lens-of-truth-crowdsec-config
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ceph-rbd
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: lens-of-truth-crowdsec-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ceph-rbd
        resources:
          requests:
            storage: 10Gi
