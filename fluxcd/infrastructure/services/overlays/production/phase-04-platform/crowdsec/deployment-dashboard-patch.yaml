apiVersion: apps/v1
kind: Deployment
metadata:
  name: crowdsec-dashboard
spec:
  # Held at zero for the volume re-bind into optcp-ids-ips.
  replicas: 0
  template:
    metadata:
      labels:
        policy.prplanit.com/ingress: "true"
    spec:
      imagePullSecrets:
        - name: pull-secret-cr-optcp-optcp-k8s-dungeon-public
      containers:
        - name: dashboard
          image: cr.optcp.com/prplanit/crowdsec-dashboard@sha256:d0655b736f3a33ec92fe081691de53010f7349470d8490f082bb078b53801b59
          resources:
            requests:
              cpu: 48m
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
