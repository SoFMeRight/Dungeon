apiVersion: v1
kind: ConfigMap
metadata:
  name: crowdsec-acquis-vaultwarden
data:
  80-vaultwarden-loki.yaml: |
    source: loki
    url: http://loki.gossip-stone.svc.cluster.local:3100
    limit: 1000
    query: |
      {service_name="vaultwarden"} |= "[ERROR]"
    labels:
      type: vaultwarden
    wait_for_ready: 10s
