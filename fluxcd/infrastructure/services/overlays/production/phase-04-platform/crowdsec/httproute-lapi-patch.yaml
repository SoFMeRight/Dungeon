---
# xylem is the internal-only gateway (*.pcfae.com, no pfSense port forward), which is
# what keeps the LAPI off the internet while still giving pfSense a TLS endpoint on a
# publicly-valid certificate.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: crowdsec-lapi
  annotations:
    gatus.home-operations.com/endpoint: |
      group: "Security & IoT (Lens of Truth🔍)"
spec:
  parentRefs:
    - name: xylem-gateway
      # arylls-lookout, where the Gateway actually lives. The neighbouring dashboard
      # route says king-of-red-lions and has never attached because of it -- that goes
      # unnoticed only because crowdsec.pcfae.com resolves somewhere else entirely.
      namespace: arylls-lookout
  hostnames:
    - "crowdsec-lapi.pcfae.com"
