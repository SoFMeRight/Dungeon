apiVersion: v1
kind: ConfigMap
metadata:
  name: crowdsec-acquis-mealie
data:
  60-mealie-loki.yaml: |
    source: loki
    url: http://loki.gossip-stone.svc.cluster.local:3100
    limit: 1000
    query: |
      {service_name="mealie"} |= "Incorrect username or password"
    labels:
      type: mealie
    wait_for_ready: 10s
