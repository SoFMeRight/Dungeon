apiVersion: v1
kind: ConfigMap
metadata:
  name: crowdsec-cloudflare-bouncer
data:
  # cs-cloudflare-worker-bouncer config. Free-tier: local decisions only (no CAPI
  # blocklist), default_action ban, Turnstile disabled, one wildcard route per zone.
  # ${...} rendered by the config-substitution initContainer from Vault-backed env.
  crowdsec-cloudflare-worker-bouncer.yaml: |
    crowdsec_config:
      lapi_url: http://crowdsec:8080/
      lapi_key: ${BOUNCER_CLOUDFLARE_LAPI_KEY}
      update_frequency: 10s
      include_scenarios_containing: []
      exclude_scenarios_containing: []
      # Local decisions only — CAPI community blocklist (10k+ IPs) would blow the
      # free Workers-KV write quota. This is the free-tier lever.
      only_include_decisions_from: ["cscli", "crowdsec"]
    cloudflare_config:
      accounts:
        - id: 2e7f5ce244fda519fd6c25bd13b58148
          account_name: pcfae
          token: ${CLOUDFLARE_TOKEN}
          ip_list_prefix: crowdsec
          default_action: ban
          total_ip_list_capacity: 5000
          zones:
            - zone_id: 29785be48310fd9a7f53331cb9cc350e  # arbitorium.com
              actions: [ban]
              default_action: ban
              routes_to_protect:
                - "*arbitorium.com/*"
              turnstile:
                enabled: false
            - zone_id: 91bc8ef52ef90553b7392fc1b8ff6be3  # astralfocal.com
              actions: [ban]
              default_action: ban
              routes_to_protect:
                - "*astralfocal.com/*"
              turnstile:
                enabled: false
