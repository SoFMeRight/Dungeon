apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: lens-of-truth

resources:
  - ../../../../base/crowdsec
  - statefulset-postgres.yaml
  - externalsecret-config-local.yaml
  - externalsecret-registrar-config.yaml
  - externalsecret-blocklist.yaml

patches:
  # StatefulSet patches
  - path: statefulset-patch.yaml
  # Dashboard patches
  - path: deployment-dashboard-patch.yaml
  # Cloudflare bouncer patches
  - path: statefulset-cloudflare-bouncer-patch.yaml
  # PVC patches
  - path: pvc-dashboard-patch.yaml
  # Service patches
  - path: service-crowdsec-gatus-patch.yaml
    target:
      kind: Service
      name: crowdsec
  # ConfigMap patches
  - path: configmap-acquis-nginx-patch.yaml
  - path: configmap-acquis-bitwarden-patch.yaml
  - path: configmap-acquis-home-assistant-patch.yaml
  - path: configmap-acquis-nextcloud-patch.yaml
  - path: configmap-acquis-mealie-patch.yaml
  - path: configmap-acquis-jellyfin-patch.yaml
  - path: configmap-acquis-vaultwarden-patch.yaml
  - path: configmap-acquis-gitlab-patch.yaml
  - path: configmap-acquis-netbox-patch.yaml
  - path: configmap-cloudflare-bouncer-patch.yaml
  # ExternalSecret patch
  - path: externalsecret-patch.yaml
  # HTTPRoute patches
  - path: httproute-patch.yaml
    target:
      kind: HTTPRoute
      name: crowdsec-dashboard
  - path: httproute-lapi-patch.yaml
    target:
      kind: HTTPRoute
      name: crowdsec-lapi
  - path: service-crowdsec-dashboard-ingress-patch.yaml
    target:
      kind: Service
      name: crowdsec-dashboard
