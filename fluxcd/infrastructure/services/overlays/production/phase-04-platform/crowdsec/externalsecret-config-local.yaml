apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crowdsec-config-local
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-zeldas-letter
  target:
    name: crowdsec-config-local
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # CrowdSec deep-merges config.yaml.local over config.yaml — this overrides the
        # persisted SQLite db_config with Postgres. Password from Vault apps/crowdsec.
        config.yaml.local: |
          db_config:
            type: postgresql
            user: crowdsec
            password: "{{ .CROWDSEC_DB_PASSWORD }}"
            db_name: crowdsec
            host: crowdsec-postgres
            port: 5432
            sslmode: disable
  data:
    - secretKey: CROWDSEC_DB_PASSWORD
      remoteRef:
        key: apps/crowdsec
        property: CROWDSEC_DB_PASSWORD
