apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crowdsec-config-local
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-zeldas-letter
  target:
    name: crowdsec-config-local
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # CrowdSec deep-merges config.yaml.local over config.yaml — this overrides the
        # persisted SQLite db_config with Postgres. Password from Vault apps/crowdsec.
        config.yaml.local: |
          db_config:
            type: postgresql
            user: crowdsec
            password: "{{ .POSTGRES_PASSWORD }}"
            db_name: crowdsec
            host: crowdsec-postgres
            port: 5432
            sslmode: disable
          # Bouncers/agents reaching the LAPI through the xylem gateway arrive with a rotating
          # mesh pod IP as their L4 source, so crowdsec recorded them as name@<rotating-ip>
          # (list churn). Trust X-Forwarded-For from the in-cluster gateway/mesh (pod CIDR) so
          # crowdsec uses the real client IP the gateway forwards (e.g. the pfSense boxes,
          # preserved by Cilium DSR) — one stable entry per bouncer. trusted_proxies (XFF
          # trust), NOT trusted_ips (admin access).
          api:
            server:
              use_forwarded_for_headers: true
              trusted_proxies:
                - "192.168.144.0/20"
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: apps/crowdsec
        property: POSTGRES_PASSWORD
