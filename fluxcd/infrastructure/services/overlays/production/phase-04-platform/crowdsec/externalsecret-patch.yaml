apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crowdsec-secrets
spec:
  secretStoreRef:
    name: openbao-zeldas-letter
  data:
    # Every in-cluster secret key matches its Vault (apps/crowdsec) key 1:1.
    # Cloudflare bouncer's LAPI key (authenticates the bouncer to OUR crowdsec LAPI).
    - secretKey: BOUNCER_CLOUDFLARE_LAPI_KEY
      remoteRef:
        key: apps/crowdsec
        property: BOUNCER_CLOUDFLARE_LAPI_KEY
    # Cloudflare API token (authenticates to Cloudflare, not to our LAPI).
    - secretKey: CLOUDFLARE_TOKEN
      remoteRef:
        key: apps/crowdsec
        property: CLOUDFLARE_TOKEN
    # Postgres password (crowdsec + crowdsec-postgres).
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: apps/crowdsec
        property: POSTGRES_PASSWORD
    # pfSense HA firewall bouncers — one LAPI key per box, declarative-registered via the
    # BOUNCER_KEY_shield_* env on the crowdsec StatefulSet.
    - secretKey: BOUNCER_SHIELD_GENERATOR_LAPI_KEY
      remoteRef:
        key: apps/crowdsec
        property: BOUNCER_SHIELD_GENERATOR_LAPI_KEY
    - secretKey: BOUNCER_SHIELD_REGENERATOR_LAPI_KEY
      remoteRef:
        key: apps/crowdsec
        property: BOUNCER_SHIELD_REGENERATOR_LAPI_KEY
    # pfSense HA log-processor machine credentials (user + pass per box). CrowdSec has no
    # env to auto-register remote machines, so the crowdsec StatefulSet's postStart hook
    # registers them from these values (cscli writes straight to the DB, restart-durable).
    - secretKey: MACHINE_SHIELD_GENERATOR_USER
      remoteRef:
        key: apps/crowdsec
        property: MACHINE_SHIELD_GENERATOR_USER
    - secretKey: MACHINE_SHIELD_GENERATOR_PASS
      remoteRef:
        key: apps/crowdsec
        property: MACHINE_SHIELD_GENERATOR_PASS
    - secretKey: MACHINE_SHIELD_REGENERATOR_USER
      remoteRef:
        key: apps/crowdsec
        property: MACHINE_SHIELD_REGENERATOR_USER
    - secretKey: MACHINE_SHIELD_REGENERATOR_PASS
      remoteRef:
        key: apps/crowdsec
        property: MACHINE_SHIELD_REGENERATOR_PASS
