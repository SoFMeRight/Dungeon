apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crowdsec-registrar-config
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-zeldas-letter
  target:
    name: crowdsec-registrar-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Standalone cscli config for the pfsense-registrar initContainer. It talks ONLY to
        # Postgres (cscli writes bouncers/machines straight to the DB), so it never depends on
        # the main crowdsec container's generated config or on the LAPI being up. api.server +
        # profiles_path are required by cscli's config loader even for DB-only operations.
        config.yaml: |
          common:
            log_media: stdout
            log_level: info
          config_paths:
            config_dir: /registrar-config/
            data_dir: /tmp/registrar-data/
          db_config:
            type: postgresql
            host: crowdsec-postgres
            port: 5432
            user: crowdsec
            password: "{{ .POSTGRES_PASSWORD }}"
            db_name: crowdsec
            sslmode: disable
          api:
            server:
              listen_uri: 127.0.0.1:8080
              profiles_path: /registrar-config/profiles.yaml
        profiles.yaml: |
          name: default_ip_remediation
          filters:
            - Alert.Remediation == true && Alert.GetScope() == "Ip"
          decisions:
            - type: ban
              duration: 4h
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: apps/crowdsec
        property: POSTGRES_PASSWORD
