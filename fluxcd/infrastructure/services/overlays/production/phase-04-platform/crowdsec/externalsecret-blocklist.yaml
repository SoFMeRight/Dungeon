apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crowdsec-blocklist-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-zeldas-letter
  target:
    name: crowdsec-blocklist-secrets
    creationPolicy: Owner
  data:
    # OTX (AlienVault/LevelBlue) API key for pulling subscribed-pulse IPv4 indicators.
    - secretKey: OTX_KEY
      remoteRef:
        key: apps/crowdsec
        property: OTX_KEY
