apiVersion: v1
kind: ConfigMap
metadata:
  name: crowdsec-acquis-netbox
data:
  95-netbox-loki.yaml: |
    source: loki
    url: http://loki.gossip-stone.svc.cluster.local:3100
    limit: 1000
    query: |
      {service_name="netbox-server"} |= "Failed login attempt"
    labels:
      type: netbox
    wait_for_ready: 10s
