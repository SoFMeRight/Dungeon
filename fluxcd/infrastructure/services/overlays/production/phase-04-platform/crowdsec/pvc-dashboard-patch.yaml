apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: crowdsec-dashboard-data
spec:
  # Pinned to its volume so the claim re-binds to its data wherever it is created.
  volumeName: pvc-91d8f53a-aaae-4c52-a16e-39c9e4986033-rook
  storageClassName: ceph-rbd
  resources:
    requests:
      storage: 5Gi
