apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: optcp-gossip-stone
resources:
  - ../../../../base/nutify
  - httproute-xylem.yaml
# Held at zero for the volume re-bind into optcp-gossip-stone.
replicas:
  - name: nutify
    count: 0

patches:
  - path: service-patch.yaml
    target:
      kind: Service
      name: nutify
  - path: statefulset-patch.yaml
    target:
      kind: StatefulSet
      name: nutify
  - path: service-nutify-ingress-patch.yaml
    target:
      kind: Service
      name: nutify
