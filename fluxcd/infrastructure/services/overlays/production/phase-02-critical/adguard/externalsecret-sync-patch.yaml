apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: adguardhome-sync-config
spec:
  secretStoreRef:
    name: openbao-optcp
    kind: ClusterSecretStore
  target:
    template:
      data:
        # The cluster AdGuard (rendered from git) is the origin; the DNS VMs (dns1, dns2) are
        # the replicas, so a rewrite reaches them within one cron run. adguard-1 loads the same
        # file from git, so it needs no sync.
        adguardhome-sync.yaml: |
          cron: "*/10 * * * *"
          runOnStart: true

          origin:
            url: http://adguard-web-0.compass.svc.cluster.local:8080
            username: {{ .originUsername }}
            password: {{ .originPassword }}

          replicas:
            - url: http://dns1.prplanit.internal
              username: {{ .dns1Username }}
              password: {{ .dns1Password }}
            - url: http://dns2.prplanit.internal
              username: {{ .dns2Username }}
              password: {{ .dns2Password }}

          api:
            port: 8080
            username: {{ .apiUsername }}
            password: {{ .apiPassword }}
  dataFrom: null
  data:
    - secretKey: originUsername
      remoteRef: {key: apps/adguardhome-sync/adguard-origin, property: USERNAME}
    - secretKey: originPassword
      remoteRef: {key: apps/adguardhome-sync/adguard-origin, property: PASSWORD}
    - secretKey: dns1Username
      remoteRef: {key: apps/adguardhome-sync/adguard-dns1, property: USERNAME}
    - secretKey: dns1Password
      remoteRef: {key: apps/adguardhome-sync/adguard-dns1, property: PASSWORD}
    - secretKey: dns2Username
      remoteRef: {key: apps/adguardhome-sync/adguard-dns2, property: USERNAME}
    - secretKey: dns2Password
      remoteRef: {key: apps/adguardhome-sync/adguard-dns2, property: PASSWORD}
    - secretKey: apiUsername
      remoteRef: {key: apps/adguardhome-sync/app, property: API_USERNAME}
    - secretKey: apiPassword
      remoteRef: {key: apps/adguardhome-sync/app, property: API_PASSWORD}
