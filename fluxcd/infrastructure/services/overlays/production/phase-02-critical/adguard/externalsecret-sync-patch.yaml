apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: adguardhome-sync-config
spec:
  secretStoreRef:
    name: openbao-zeldas-letter
    kind: ClusterSecretStore
  target:
    template:
      data:
        # The cluster AdGuard (rendered from git) is the origin; the DNS VMs are replicas, so a
        # rewrite reaches them within one cron run. Credential keys in apps/adguardhome-sync:
        # cluster_* is the cluster AdGuard; origin_* is dns.pcfae.com and replica_* is
        # dns2.pcfae.com, named for the direction they synced in before.
        adguardhome-sync.yaml: |
          cron: "*/10 * * * *"
          runOnStart: true

          origin:
            url: http://adguard-web-0.compass.svc.cluster.local:8080
            username: {{ .cluster_username }}
            password: {{ .cluster_password }}

          replicas:
            - url: https://dns.pcfae.com
              username: {{ .origin_username }}
              password: {{ .origin_password }}
            - url: https://dns2.pcfae.com
              username: {{ .replica_username }}
              password: {{ .replica_password }}

          api:
            port: 8080
            username: {{ .api_username }}
            password: {{ .api_password }}
  dataFrom:
  - extract:
      key: apps/adguardhome-sync
