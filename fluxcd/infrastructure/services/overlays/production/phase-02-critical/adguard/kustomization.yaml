apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: compass

resources:
  - ../../../../base/adguard
  - cilium-network-policy.yaml
  - httproute-primary.yaml
  - httproute-replica.yaml

patches:
  - path: statefulset-patch.yaml
    target:
      kind: StatefulSet
      name: adguard
  - path: service-dns-patch.yaml
    target:
      kind: Service
      name: adguard-dns
  - path: service-external-traffic-policy-local.yaml
    target:
      kind: Service
      name: adguard-dns
  - path: pvc-patch.yaml
    target:
      kind: PersistentVolumeClaim
      name: adguard-data-adguard-0
  - path: pvc-patch.yaml
    target:
      kind: PersistentVolumeClaim
      name: adguard-conf-adguard-0
  - path: deployment-sync-patch.yaml
    target:
      kind: Deployment
      name: adguardhome-sync
  - path: externalsecret-sync-patch.yaml
    target:
      kind: ExternalSecret
      name: adguardhome-sync-config
  - path: service-adguard-web-ingress-patch.yaml
    target:
      kind: Service
      name: adguard-web
  # The base ConfigMap is a seed-only template; adguard-gitops-config replaces it.
  - target:
      kind: ConfigMap
      name: adguard-config
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: adguard-config

# The cluster AdGuard is the DNS source of truth: the copy-config init container writes this
# file over the live config on every start, the generated name's hash rolls the pods whenever
# it changes, and adguardhome-sync pushes the result to the DNS VMs (dns1, dns2.prplanit.internal).
configMapGenerator:
  - name: adguard-gitops-config
    files:
      - AdGuardHome.yaml
