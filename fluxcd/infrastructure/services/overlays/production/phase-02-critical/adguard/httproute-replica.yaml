apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: adguard-replica
  annotations:
    gatus.home-operations.com/endpoint: |
      group: "DNS & Network (Compass🧭)"
spec:
  parentRefs:
    - name: phloem-gateway
      namespace: prelude-of-light
  # adguardhome-sync replica → pinned to adguard-1 (stable login session).
  hostnames:
    - "dns2.pcfae.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: adguard-web-1
          port: 8080
