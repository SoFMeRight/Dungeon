# The bcrypt hash of adguardhome-sync's login on this AdGuard. The copy-config init container
# reads it optionally, so AdGuard still starts, without that user, when OpenBao is down.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: adguard-sync-user
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-optcp
    kind: ClusterSecretStore
  target:
    name: adguard-sync-user
    creationPolicy: Owner
  data:
    - secretKey: sync-password
      remoteRef:
        key: apps/adguard/adguardhome-sync
        property: PASSWORD_HASH
