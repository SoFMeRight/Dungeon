apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: adguard
spec:
  replicas: 2
  template:
    metadata:
      labels:
        policy.prplanit.com/ingress: "true"
    spec:
      imagePullSecrets:
        - name: pull-secret-cr-optcp-optcp-k8s-dungeon-public
      initContainers:
        - name: copy-config
          image: docker.io/busybox:1.38
          command:
            - sh
            - -c
            - |
              # Git is the source of truth: write the declared config over the live one on
              # every start. UI edits do not survive a restart; change AdGuardHome.yaml.
              sed "s|ADGUARD_PASSWORD_PLACEHOLDER|${ADGUARD_PASSWORD}|g" /tmp/config/AdGuardHome.yaml > /tmp/processed-config.yaml
              # adguardhome-sync logs in as its own user; its bcrypt hash is the SOPS secret
              # adguard-sync-user (sync-password).
              if [ -n "${SYNC_PASSWORD}" ]; then
                awk 'BEGIN{h=ENVIRON["SYNC_PASSWORD"]} {print} /^users:$/{print "  - name: adguardhome-sync"; print "    password: " h}' /tmp/processed-config.yaml > /tmp/with-sync.yaml
                mv /tmp/with-sync.yaml /tmp/processed-config.yaml
              fi
              cp /tmp/processed-config.yaml /opt/adguardhome/conf/AdGuardHome.yaml
          env:
            - name: ADGUARD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: adguard-secret
                  key: admin-password
            - name: SYNC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: adguard-sync-user
                  key: sync-password
                  optional: true
          volumeMounts:
            - name: config-template
              mountPath: /tmp/config
            - name: adguard-conf
              mountPath: /opt/adguardhome/conf
      containers:
        - name: adguard
          image: docker.io/adguard/adguardhome:v0.107.79
          # AdGuardHome runs as root throughout (no user drop) and binds privileged :53/:80/:443/
          # :853/:784/:5443. DHCP is disabled → no NET_RAW. Partial hardening: drop ALL + NET_BIND_SERVICE.
          securityContext:
            seccompProfile:
              type: RuntimeDefault
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
      volumes:
        - name: config-template
          configMap:
            name: adguard-gitops-config
  volumeClaimTemplates:
    - metadata:
        name: adguard-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: ceph-rbd
        resources:
          requests:
            storage: 5Gi
    - metadata:
        name: adguard-conf
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: ceph-rbd
        resources:
          requests:
            storage: 1Gi
