apiVersion: v1
kind: ConfigMap
metadata:
  name: adguard-config
data:
  AdGuardHome.yaml: |
    http:
      pprof:
        port: 6060
        enabled: false
      doh:
        routes:
          - GET /dns-query
          - POST /dns-query
          - GET /dns-query/{ClientID}
          - POST /dns-query/{ClientID}
        insecure_enabled: false
      address: 0.0.0.0:80
      session_ttl: 30d
    users:
      - name: kai
        password: ADGUARD_PASSWORD_PLACEHOLDER
    auth_attempts: 5
    block_auth_min: 15
    http_proxy: ""
    language: ""
    theme: auto
    dns:
      bind_hosts:
        - 0.0.0.0
        - '::'
      port: 53
      anonymize_client_ip: false
      ratelimit: 20
      ratelimit_subnet_len_ipv4: 24
      ratelimit_subnet_len_ipv6: 56
      ratelimit_whitelist:
        - 172.22.144.150
        - 172.22.144.151
        - 172.22.144.152
        - 172.22.144.153
        - 172.22.144.154
        - 172.22.144.170
        - 172.22.144.171
        - 172.22.144.172
        - 172.22.144.173
        - 172.22.144.174
      refuse_any: true
      upstream_dns:
        - '[/prplanit.internal/]10.0.0.22'
        - 10.0.0.22
      upstream_dns_file: ""
      bootstrap_dns:
        - 9.9.9.10
        - 149.112.112.10
      fallback_dns:
        - 10.0.0.22
      upstream_mode: load_balance
      fastest_timeout: 1s
      allowed_clients: []
      disallowed_clients: []
      blocked_hosts:
        - version.bind
        - id.server
        - hostname.bind
      trusted_proxies:
        - 127.0.0.0/8
        - ::1/128
      cache_enabled: true
      cache_size: 4194304
      cache_ttl_min: 0
      cache_ttl_max: 0
      cache_optimistic: false
      cache_optimistic_answer_ttl: 30s
      cache_optimistic_max_age: 12h
      bogus_nxdomain: []
      aaaa_disabled: true
      enable_dnssec: false
      edns_client_subnet:
        custom_ip: ""
        enabled: false
        use_custom: false
      max_goroutines: 300
      handle_ddr: true
      ipset: []
      ipset_file: ""
      bootstrap_prefer_ipv6: false
      upstream_timeout: 3s
      private_networks: []
      use_private_ptr_resolvers: true
      local_ptr_upstreams:
        - 10.0.0.22
      use_dns64: false
      dns64_prefixes: []
      serve_http3: false
      use_http3_upstreams: false
      serve_plain_dns: true
      hostsfile_enabled: true
      pending_requests:
        enabled: true
    tls:
      enabled: false
      server_name: ""
      force_https: false
      port_https: 443
      port_dns_over_tls: 853
      port_dns_over_quic: 853
      port_dnscrypt: 0
      dnscrypt_config_file: ""
      certificate_chain: ""
      private_key: ""
      certificate_path: ""
      private_key_path: ""
      strict_sni_check: false
    querylog:
      dir_path: ""
      ignored: []
      interval: 30d
      size_memory: 1000
      enabled: true
      ignored_enabled: false
      file_enabled: true
    statistics:
      dir_path: ""
      ignored: []
      interval: 1d
      enabled: true
      ignored_enabled: false
    filters:
      - enabled: true
        url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt
        name: AdGuard DNS filter
        id: 1
      - enabled: false
        url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_2.txt
        name: AdAway Default Blocklist
        id: 2
      - enabled: true
        url: https://raw.githubusercontent.com/Ruddernation-Designs/Adobe-URL-Block-List/refs/heads/master/hosts
        name: Adobe Blocklist
        id: 1763345095
    whitelist_filters: []
    user_rules:
      - '||_VLMCS._tcp.ad.prplanit.com^$dnsrewrite=NOERROR;SRV;0 0 1688 pirates-wdda'
      - '||_VLMCS._tcp^$dnsrewrite=NOERROR;SRV;0 0 1688 pirates-wdda'
      - '||_ceph-mon._tcp.prplanit.internal^$dnsrewrite=NOERROR;SRV; 10 60 6789 Avocado'
      - '||_ceph-mon._tcp.prplanit.internal^$dnsrewrite=NOERROR;SRV; 10 60 6789 Bamboo'
      - '||_ceph-mon._tcp.prplanit.internal^$dnsrewrite=NOERROR;SRV; 10 60 6789 Cosmos'
      - '||v10.events.data.microsoft.com^$important'
      - '||settings-win.data.microsoft.com^$important'
      - ""
    dhcp:
      enabled: false
      interface_name: ""
      local_domain_name: lan
      dhcpv4:
        gateway_ip: ""
        subnet_mask: ""
        range_start: ""
        range_end: ""
        lease_duration: 86400
        icmp_timeout_msec: 1000
        options: []
      dhcpv6:
        range_start: ""
        lease_duration: 86400
        ra_slaac_only: false
        ra_allow_slaac: false
    filtering:
      blocking_ipv4: ""
      blocking_ipv6: ""
      blocked_services:
        schedule:
          time_zone: UTC
        ids: []
      protection_disabled_until: null
      safe_search:
        enabled: false
        bing: true
        duckduckgo: true
        ecosia: true
        google: true
        pixabay: true
        yandex: true
        youtube: true
      blocking_mode: default
      parental_block_host: family-block.dns.adguard.com
      safebrowsing_block_host: standard-block.dns.adguard.com
      rewrites:
