apiVersion: apps/v1
kind: Deployment
metadata:
  name: adguardhome-sync
spec:
  # Held at zero until adguard is back in optcp-network-services.
  replicas: 0
  template:
    spec:
      imagePullSecrets:
        - name: pull-secret-cr-optcp-optcp-k8s-dungeon-public
      containers:
        - name: adguardhome-sync
          image: docker.io/linuxserver/adguardhome-sync:v0.9.6-ls181
          # LSIO/s6-overlay; setuid-drops to PUID/PGID on :8080 (unprivileged). Partial hardening:
          # keep root, drop ALL, add back s6's file-perm + setuid caps.
          securityContext:
            seccompProfile:
              type: RuntimeDefault
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - SETUID
                - SETGID
