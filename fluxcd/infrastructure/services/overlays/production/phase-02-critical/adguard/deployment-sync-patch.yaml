apiVersion: apps/v1
kind: Deployment
metadata:
  name: adguardhome-sync
spec:
  replicas: 1
  template:
    spec:
      imagePullSecrets:
        - name: cr-pcfae-admin-pull-secret
      containers:
        - name: adguardhome-sync
          image: docker.io/linuxserver/adguardhome-sync:0.9.2
          # LSIO/s6-overlay; setuid-drops to PUID/PGID on :8080 (unprivileged). Partial hardening:
          # keep root, drop ALL, add back s6's file-perm + setuid caps.
          securityContext:
            seccompProfile:
              type: RuntimeDefault
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - SETUID
                - SETGID
