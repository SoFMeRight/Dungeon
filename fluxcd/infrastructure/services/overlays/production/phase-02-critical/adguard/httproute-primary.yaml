apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: adguard-primary
  annotations:
    gatus.home-operations.com/endpoint: |
      group: "DNS & Network (Compass🧭)"
spec:
  parentRefs:
    - name: phloem-ingress-gateway
      namespace: optcp-ingress-internal
  # Primary / adguardhome-sync origin → pinned to adguard-0 (stable login session).
  hostnames:
    - "dns.pcfae.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: adguard-web-0
          port: 8080
