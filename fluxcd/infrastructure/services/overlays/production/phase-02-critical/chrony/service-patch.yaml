apiVersion: v1
kind: Service
metadata:
  name: chrony
  annotations:
    # Dual-stack VIP on the shared compass VIP (.122 + ::122) so NTP answers over v6.
    lbipam.cilium.io/ips: "172.22.30.122,fc00:f1:ada:30::122"
    lbipam.cilium.io/sharing-key: compass
    lbipam.cilium.io/sharing-cross-namespace: "*"
    gatus.home-operations.com/endpoint: |
      group: "DNS & Network (Compass🧭)"
      url: http://chrony.compass.svc.cluster.local:8080
      interval: 60s
      conditions:
        - "[STATUS] == 200"
spec:
  ipFamilyPolicy: PreferDualStack
  ipFamilies:
    - IPv4
    - IPv6
