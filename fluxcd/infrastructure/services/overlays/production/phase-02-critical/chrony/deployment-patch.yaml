apiVersion: apps/v1
kind: Deployment
metadata:
  name: chrony
spec:
  replicas: 1
  template:
    metadata:
      labels:
        policy.prplanit.com/probe: "true"
    spec:
      imagePullSecrets:
        - name: cr-pcfae-admin-pull-secret
      containers:
        - name: chrony
          image: docker.io/simonrupf/chronyd:0.9.1
        - name: ntp-healthcheck
          image: docker.io/simonrupf/chronyd:0.9.1
