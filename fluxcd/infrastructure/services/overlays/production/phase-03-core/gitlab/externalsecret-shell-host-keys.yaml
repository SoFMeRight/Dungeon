# GitLab's SSH host identity: regenerated, every client sees a changed host key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-gitlab-shell-host-keys
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-optcp
    kind: ClusterSecretStore
  target:
    name: gitlab-gitlab-shell-host-keys
    creationPolicy: Owner
  data:
    - secretKey: ssh_host_ecdsa_key
      remoteRef:
        key: apps/gitlab/app
        property: ssh_host_ecdsa_key
    - secretKey: ssh_host_ecdsa_key.pub
      remoteRef:
        key: apps/gitlab/app
        property: ssh_host_ecdsa_key.pub
    - secretKey: ssh_host_ed25519_key
      remoteRef:
        key: apps/gitlab/app
        property: ssh_host_ed25519_key
    - secretKey: ssh_host_ed25519_key.pub
      remoteRef:
        key: apps/gitlab/app
        property: ssh_host_ed25519_key.pub
    - secretKey: ssh_host_rsa_key
      remoteRef:
        key: apps/gitlab/app
        property: ssh_host_rsa_key
    - secretKey: ssh_host_rsa_key.pub
      remoteRef:
        key: apps/gitlab/app
        property: ssh_host_rsa_key.pub
