apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: gitlab-postgresql
spec:
  # Shutdown has to fit the node's grace budget: 150s total, 30s reserved for
  # critical pods, so 120s for ordinary ones. Postgres does not checkpoint until
  # the smart phase stops waiting for clients to disconnect, so a long smart
  # timeout means the SIGKILL lands before anything is flushed. Short smart, then
  # fast shutdown does the checkpoint well inside the remaining budget.
  smartShutdownTimeout: 10
  stopDelay: 60
  inheritedMetadata:
    labels:
      policy.prplanit.com/cnpg: "managed"
      policy.prplanit.com/access-class: postgres
      policy.prplanit.com/service-scope: hyrule-castle.gitlab.postgres
      policy.prplanit.com/cap.s3: "true"
      policy.prplanit.com/access-scope-s3: gorons-bracelet.rgw

  storage:
    storageClass: ceph-rbd-retain
    size: 50Gi
  postgresql:
    parameters:
      # WAL retention for replica catchup during outages
      # Consistent with other CNPG clusters (vaultwarden, calcom, zitadel)
      wal_keep_size: "512MB"
      max_slot_wal_keep_size: "1600MB"
  backup:
    barmanObjectStore:
      endpointURL: https://s3.pcfae.com
