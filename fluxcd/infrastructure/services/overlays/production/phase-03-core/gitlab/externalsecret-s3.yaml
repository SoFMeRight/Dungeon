apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-s3-storage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-precisionplanit
    kind: ClusterSecretStore
  target:
    name: gitlab-s3-storage
    creationPolicy: Owner
    template:
      data:
        connection: |
          provider: AWS
          region: us-east-1
          aws_access_key_id: {{ .access_key }}
          aws_secret_access_key: {{ .secret_key }}
          host: s3.pcfae.com
          endpoint: https://s3.pcfae.com
          path_style: true
        # Container Registry storage — the registry uses the Docker distribution
        # S3 driver format (top-level s3:), NOT the appConfig "connection" format.
        # Required since the GitLab chart 9.x->10.x major dropped bundled object
        # storage for the registry and hard-fails the upgrade without this.
        config: |
          s3:
            bucket: gitlab-registry
            accesskey: {{ .access_key }}
            secretkey: {{ .secret_key }}
            region: us-east-1
            regionendpoint: https://s3.pcfae.com
            v4auth: true
            pathstyle: true
  data:
    - secretKey: access_key
      remoteRef:
        key: apps/gitlab
        property: s3_access_key
    - secretKey: secret_key
      remoteRef:
        key: apps/gitlab
        property: s3_secret_key
