apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gitlab
  annotations:
    gatus.home-operations.com/endpoint: |
      group: "Business Apps (Hyrule Castle🏰)"
spec:
  parentRefs:
    - name: cell-membrane-ingress-gateway
      namespace: optcp-ingress-public
      sectionName: https-prplanit
  hostnames:
    - git.prplanit.com
  rules:
    - backendRefs:
        - name: gitlab-webservice-default
          port: 8181
