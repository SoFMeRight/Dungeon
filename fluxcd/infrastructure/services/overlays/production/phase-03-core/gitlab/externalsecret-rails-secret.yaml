# Rails encrypts database columns with this (CI variables, 2FA, tokens): a regenerated
# one leaves them unreadable, so it lives in OpenBao, not only in the namespace.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-rails-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-optcp
    kind: ClusterSecretStore
  target:
    name: gitlab-rails-secret
    creationPolicy: Owner
  data:
    - secretKey: secrets.yml
      remoteRef:
        key: apps/gitlab/app
        property: secrets.yml
