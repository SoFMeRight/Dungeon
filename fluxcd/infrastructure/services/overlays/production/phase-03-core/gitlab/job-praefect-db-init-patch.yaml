apiVersion: batch/v1
kind: Job
metadata:
  name: gitlab-praefect-db-init
spec:
  template:
    spec:
      imagePullSecrets:
        - name: pull-secret-cr-optcp-optcp-k8s-dungeon-public
      containers:
        - name: init-praefect-db
          image: docker.io/alpine/k8s:1.37.1
          env:
            - name: PGHOST
              value: gitlab-postgresql-rw.optcp-supply-chain.svc.cluster.local
