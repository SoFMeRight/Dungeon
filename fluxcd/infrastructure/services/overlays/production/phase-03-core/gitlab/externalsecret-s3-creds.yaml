apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-s3-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-optcp
    kind: ClusterSecretStore
  target:
    name: gitlab-s3-credentials
    creationPolicy: Owner
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: apps/gitlab/s3-gringotts
        property: ACCESS_KEY
    - secretKey: SECRET_ACCESS_KEY
      remoteRef:
        key: apps/gitlab/s3-gringotts
        property: SECRET_KEY
