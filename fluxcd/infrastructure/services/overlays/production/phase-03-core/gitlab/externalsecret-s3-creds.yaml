apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-s3-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-precisionplanit
    kind: ClusterSecretStore
  target:
    name: gitlab-s3-credentials
    creationPolicy: Owner
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: apps/gitlab
        property: BACKUP_GRINGOTTS_S3_ACCESS_KEY
    - secretKey: SECRET_ACCESS_KEY
      remoteRef:
        key: apps/gitlab
        property: BACKUP_GRINGOTTS_S3_SECRET_KEY
