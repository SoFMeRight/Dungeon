apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: apt-cacher-ng
spec:
  replicas: 1
  template:
    metadata:
      labels:
        policy.prplanit.com/ingress: "true"
      annotations:
        backup.velero.io/backup-volumes-excludes: hyrule-castle-apt-cacher-ng-cache,hyrule-castle-apt-cacher-ng-logs
    spec:
      initContainers:
        - name: init
          image: docker.io/hlhd/apt-cacher-ng:v3.7.5@sha256:e21d1b390d3428ad0c74848eae78d424a2d1830d7dd54ce0998426f4d5336aad
      containers:
        - name: apt-cacher-ng
          image: docker.io/hlhd/apt-cacher-ng:v3.7.5@sha256:e21d1b390d3428ad0c74848eae78d424a2d1830d7dd54ce0998426f4d5336aad
          env:
            - name: MAX_THREADS
              value: "30"
            - name: NETWORK_TIMEOUT
              value: "120"
            # acng 3.7.5's DNS cache never expires an entry (clean_dns_cache() tests expiry
            # backwards and Resolve() ignores it), so one failed lookup 503s that mirror until
            # restart. CoreDNS and ztunnel already cache DNS.
            - name: DNS_CACHE_SECONDS
              value: "0"
          resources:
            limits:
              memory: 96Mi
              cpu: 39m
            requests:
              memory: 16Mi
              cpu: 2m
          volumeMounts:
            - name: hyrule-castle-apt-cacher-ng-cache
              mountPath: /var/cache/apt-cacher-ng
            - name: hyrule-castle-apt-cacher-ng-logs
              mountPath: /var/log/apt-cacher-ng
  volumeClaimTemplates:
    - metadata:
        name: hyrule-castle-apt-cacher-ng-cache
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: ceph-rbd
        resources:
          requests:
            storage: 100Gi
    - metadata:
        name: hyrule-castle-apt-cacher-ng-logs
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: ceph-rbd
        resources:
          requests:
            storage: 10Gi
