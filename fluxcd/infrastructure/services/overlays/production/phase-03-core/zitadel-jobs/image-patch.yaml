---
apiVersion: batch/v1
kind: Job
metadata:
  name: zitadel-init
spec:
  template:
    spec:
      initContainers:
        - name: wait-for-postgres
          image: docker.io/postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h zitadel-postgres-rw.zeldas-lullaby.svc.cluster.local -p 5432 -U postgres; do
                echo "waiting for postgres"
                sleep 2
              done
      containers:
        - name: zitadel-init
          image: ghcr.io/homelabhd/zitadel:dev-df4dbc1@sha256:18bf4c669116a9a8cdd5f902671268a16d4c0d9e8970857034490caee28c0883
---
apiVersion: batch/v1
kind: Job
metadata:
  name: zitadel-setup
spec:
  template:
    spec:
      initContainers:
        - name: wait-for-db
          image: docker.io/alpine/k8s:1.37.0
      containers:
        - name: zitadel-setup
          image: ghcr.io/homelabhd/zitadel:dev-df4dbc1@sha256:18bf4c669116a9a8cdd5f902671268a16d4c0d9e8970857034490caee28c0883
        - name: machinekey-writer
          image: docker.io/alpine/k8s:1.37.0
        - name: machine-pat-writer
          image: docker.io/alpine/k8s:1.37.0
        - name: login-client-pat-writer
          image: docker.io/alpine/k8s:1.37.0
---
apiVersion: batch/v1
kind: Job
metadata:
  name: zitadel-admin-sa-to-openbao
spec:
  template:
    spec:
      initContainers:
        - name: wait-for-secret
          image: docker.io/alpine/k8s:1.37.0
      containers:
        - name: sync-to-vault
          image: docker.io/alpine/k8s:1.37.0
