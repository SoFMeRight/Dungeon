apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisReplication
metadata:
  name: harbor-redis
spec:
  kubernetesConfig:
    image: quay.io/opstree/redis:v7.4.11
  storage:
    volumeClaimTemplate:
      spec:
        storageClassName: ceph-rbd-retain
        resources:
          requests:
            storage: 10Gi
---
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisSentinel
metadata:
  name: harbor-sentinel
spec:
  kubernetesConfig:
    image: quay.io/opstree/redis-sentinel:v7.4.11
