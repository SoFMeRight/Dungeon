apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-optcp
    kind: ClusterSecretStore
  target:
    name: harbor-secrets
    creationPolicy: Owner
  data:
    - secretKey: postgres_password
      remoteRef:
        key: apps/harbor/postgres
        property: PASSWORD
    - secretKey: s3_accesskey
      remoteRef:
        key: apps/harbor/s3-active
        property: ACCESS_KEY
    - secretKey: s3_secretkey
      remoteRef:
        key: apps/harbor/s3-active
        property: SECRET_KEY
    - secretKey: admin_password
      remoteRef:
        key: apps/harbor/app
        property: ADMIN_PASSWORD
    - secretKey: oidc_client_id
      remoteRef:
        key: apps/harbor/oidc
        property: CLIENT_ID
    - secretKey: oidc_client_secret
      remoteRef:
        key: apps/harbor/oidc
        property: CLIENT_SECRET
