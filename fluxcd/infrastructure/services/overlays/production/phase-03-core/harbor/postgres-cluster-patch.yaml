apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: harbor-postgres
spec:
  # Shutdown has to fit the node's grace budget: 150s total, 30s reserved for
  # critical pods, so 120s for ordinary ones. Postgres does not checkpoint until
  # the smart phase stops waiting for clients to disconnect, so a long smart
  # timeout means the SIGKILL lands before anything is flushed. Short smart, then
  # fast shutdown does the checkpoint well inside the remaining budget.
  smartShutdownTimeout: 10
  stopDelay: 60
  # Requests lift this out of BestEffort so the kubelet does not reclaim the database
  # first under node pressure. Sized from observed use (~167Mi resident): memory is what
  # drives eviction, so the request carries the headroom.
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "768Mi"
      cpu: "1000m"

  inheritedMetadata:
    labels:
      policy.prplanit.com/cnpg: "managed"
      policy.prplanit.com/access-class: postgres
      policy.prplanit.com/service-scope: hyrule-castle.harbor.postgres
      policy.prplanit.com/cap.s3-nas: "true"
      policy.prplanit.com/access-scope-s3-nas: gringotts.seaweedfs

  instances: 3

  imageName: ghcr.io/cloudnative-pg/postgresql:17.11-system-trixie

  bootstrap:
    initdb:
      database: registry
      owner: harbor
      secret:
        name: harbor-postgres-credentials
      postInitApplicationSQL:
        - CREATE DATABASE notaryserver OWNER harbor;
        - CREATE DATABASE notarysigner OWNER harbor;

  storage:
    storageClass: ceph-rbd-retain
    size: 20Gi

  backup:
    barmanObjectStore:
      destinationPath: s3://prplanit/dungeon/cnpg/harbor
      endpointURL: http://172.22.150.101:8333
