apiVersion: apps/v1
kind: Deployment
metadata:
  name: harbor-proxy-cache-proxy
  labels:
    app: harbor-proxy-cache-proxy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: harbor-proxy-cache-proxy
  template:
    metadata:
      labels:
        app: harbor-proxy-cache-proxy
        policy.prplanit.com/ingress: "true"
    spec:
      serviceAccountName: harbor-proxy-cache-proxy
      # Full non-root: openresty routing proxy on the unprivileged :8080 (config points logs at the
      # stderr keyword + temp/pid at /tmp), run as nobody with a read-only rootfs.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: openresty
          image: docker.io/openresty/openresty:1.31.1.1-alpine
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /usr/local/openresty/nginx/conf/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: harbor-proxy-cache-nginx
        - name: tmp
          emptyDir: {}
