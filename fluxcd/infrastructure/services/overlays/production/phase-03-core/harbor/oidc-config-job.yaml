apiVersion: v1
kind: ServiceAccount
metadata:
  name: harbor-oidc-config
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: harbor-oidc-config
spec:
  backoffLimit: 30
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: harbor-oidc-config
    spec:
      restartPolicy: OnFailure
      serviceAccountName: harbor-oidc-config
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 100
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: config
          image: docker.io/curlimages/curl:8.11.1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: harbor-secrets
                  key: admin_password
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: harbor-secrets
                  key: oidc_client_id
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: harbor-secrets
                  key: oidc_client_secret
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              HARBOR="http://harbor"
              echo "Waiting for Harbor API..."
              until curl -sf -o /dev/null "$HARBOR/api/v2.0/health"; do sleep 5; done
              echo "Harbor is up. Applying OIDC (auth_mode=oidc_auth)..."
              BODY=$(cat <<JSON
              {
                "auth_mode": "oidc_auth",
                "oidc_name": "zitadel",
                "oidc_endpoint": "https://sso.prplanit.com",
                "oidc_client_id": "$OIDC_CLIENT_ID",
                "oidc_client_secret": "$OIDC_CLIENT_SECRET",
                "oidc_scope": "openid,profile,email,offline_access",
                "oidc_verify_cert": true,
                "oidc_auto_onboard": true,
                "oidc_user_claim": "preferred_username"
              }
              JSON
              )
              CODE=$(curl -s -o /tmp/resp -w "%{http_code}" -u "admin:$ADMIN_PASSWORD" \
                -X PUT "$HARBOR/api/v2.0/configurations" \
                -H "Content-Type: application/json" -d "$BODY")
              echo "PUT /configurations -> HTTP $CODE"
              cat /tmp/resp 2>/dev/null || true
              echo
              # 200 = applied. Harbor validates the OIDC endpoint on save, so a
              # failure here usually means core can't reach sso yet — the Job
              # retries (backoffLimit) until core has cap.oidc and it succeeds.
              [ "$CODE" = "200" ] || { echo "config not applied yet, will retry"; exit 1; }
              echo "OIDC auth configured."
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
