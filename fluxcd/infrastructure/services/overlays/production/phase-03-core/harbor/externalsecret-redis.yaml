# Harbor's Redis password, and the authenticated URLs Harbor's components read it through.
# The chart renders the Redis password into plain ConfigMaps (core, jobservice, registry),
# so Harbor is rendered without one and helmrelease-patch.yaml's postRenderers hand these
# keys to the containers as env, which overrides the ConfigMap values. The URLs must match
# the chart's own (redis.external in helmrelease-patch.yaml): sentinels, master set, db.
# The password applies to the master only; the sentinels take none.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-redis-password
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-optcp
    kind: ClusterSecretStore
  target:
    name: harbor-redis-password
    creationPolicy: Owner
    template:
      data:
        password: "{{ .password }}"
        core-url: "redis+sentinel://:{{ .password }}@harbor-sentinel-sentinel:26379/harbor-redis/0?idle_timeout_seconds=30"
        jobservice-url: "redis+sentinel://:{{ .password }}@harbor-sentinel-sentinel:26379/harbor-redis/1"
        registry-url: "redis+sentinel://:{{ .password }}@harbor-sentinel-sentinel:26379/harbor-redis/2?idle_timeout_seconds=30"
  data:
    - secretKey: password
      remoteRef:
        key: apps/harbor/redis
        property: PASSWORD
