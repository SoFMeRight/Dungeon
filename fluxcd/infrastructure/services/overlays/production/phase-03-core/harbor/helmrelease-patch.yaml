apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: harbor
spec:
  targetNamespace: optcp-supply-chain
  install:
    timeout: 15m
  valuesFrom:
    - kind: Secret
      name: harbor-secrets
      valuesKey: postgres_password
      targetPath: database.external.password
    - kind: Secret
      name: harbor-secrets
      valuesKey: s3_accesskey
      targetPath: persistence.imageChartStorage.s3.accesskey
    - kind: Secret
      name: harbor-secrets
      valuesKey: s3_secretkey
      targetPath: persistence.imageChartStorage.s3.secretkey
    - kind: Secret
      name: harbor-secrets
      valuesKey: secret_key
      targetPath: secretKey
  values:
    # External URL
    externalURL: https://cr.optcp.com

    # Harbor components - 3 replicas for HA with fully qualified images
    portal:
      replicas: 3
      resources:
        requests:
          cpu: 2m
          memory: 28Mi
        limits:
          cpu: 182m
          memory: 28Mi
      image:
        repository: docker.io/goharbor/harbor-portal

    core:
      replicas: 3
      resources:
        requests:
          cpu: 62m
          memory: 193Mi
        limits:
          cpu: 617m
          memory: 193Mi
      podLabels:
        policy.prplanit.com/cap.postgres: "true"
        policy.prplanit.com/access-scope-postgres: optcp-supply-chain.harbor.postgres
        policy.prplanit.com/cap.redis: "true"
        policy.prplanit.com/access-scope-redis: optcp-supply-chain.harbor.redis
        policy.prplanit.com/cap.ceph: "true"
        policy.prplanit.com/access-scope-ceph: "optcp-operators-privileged.rgw"
        # core validates OIDC tokens against Zitadel (sso.optcp.com) — needs
        # the cell-membrane gateway hairpin allow.
        policy.prplanit.com/cap.oidc: "true"
      image:
        repository: docker.io/goharbor/harbor-core

    jobservice:
      replicas: 3
      resources:
        requests:
          cpu: 10m
          memory: 63Mi
        limits:
          cpu: 1069m
          memory: 63Mi
      podLabels:
        policy.prplanit.com/cap.redis: "true"
        policy.prplanit.com/access-scope-redis: optcp-supply-chain.harbor.redis
        policy.prplanit.com/cap.ceph: "true"
        policy.prplanit.com/access-scope-ceph: "optcp-operators-privileged.rgw"
      image:
        repository: docker.io/goharbor/harbor-jobservice

    registry:
      replicas: 3
      podLabels:
        policy.prplanit.com/cap.ceph: "true"
        policy.prplanit.com/access-scope-ceph: "optcp-operators-privileged.rgw"
      registry:
        resources:
          requests:
            cpu: 187m
            memory: 252Mi
          limits:
            cpu: 1041m
            memory: 252Mi
        image:
          repository: docker.io/goharbor/registry-photon
      controller:
        resources:
          requests:
            cpu: 2m
            memory: 41Mi
          limits:
            cpu: 196m
            memory: 41Mi
        image:
          repository: docker.io/goharbor/harbor-registryctl

    # Expose via ClusterIP - TLS terminated at xylem gateway
    expose:
      type: clusterIP
      tls:
        enabled: false

    nginx:
      resources:
        requests:
          cpu: 23m
          memory: 134Mi
        limits:
          cpu: 252m
          memory: 134Mi
      podLabels:
        policy.prplanit.com/ingress: "true"
      image:
        repository: docker.io/goharbor/nginx-photon

    # External PostgreSQL via CloudNativePG
    database:
      type: external
      external:
        host: harbor-postgres-rw
        port: 5432
        username: harbor
        password: ""  # Injected by valuesFrom
        coreDatabase: registry
        notaryServerDatabase: notaryserver
        notarySignerDatabase: notarysigner

    # External Redis through its sentinels: whichever replica the sentinels name master is the
    # one Harbor uses, so no single Redis pod is a dependency of Harbor starting.
    redis:
      type: external
      external:
        # The operator's Service fronts whichever sentinels are ready; a per-pod name would
        # not resolve while its pod is down.
        addr: harbor-sentinel-sentinel:26379
        sentinelMasterSet: harbor-redis

    # Storage configuration - Ceph RGW (S3 compatible)
    persistence:
      enabled: true
      persistentVolumeClaim:
        registry:
          storageClass: ceph-rbd-retain
          size: 50Gi
        jobservice:
          jobLog:
            # Use CephFS (RWX) for multi-replica jobservice
            existingClaim: optcp-supply-chain-harbor-jobservice
            storageClass: ""
            size: ""
      imageChartStorage:
        type: s3
        s3:
          region: us-east-1
          bucket: harbor-registry
          regionendpoint: http://ceph-rgw.optcp-operators-privileged.svc.cluster.local
          forcepathstyle: true
        disableredirect: true
    # Admin password from existing secret
    existingSecretAdminPassword: harbor-secrets
    existingSecretAdminPasswordKey: admin_password

    # Disable Trivy and Notary for now
    trivy:
      enabled: false

    notary:
      enabled: false

  # Harbor's Redis password, as env from harbor-redis-password (externalsecret-redis.yaml):
  # env overrides the chart's ConfigMap values, which carry no password.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: harbor-core
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: harbor-core
              spec:
                template:
                  spec:
                    containers:
                      - name: core
                        env:
                          - name: _REDIS_URL_CORE
                            valueFrom:
                              secretKeyRef:
                                name: harbor-redis-password
                                key: core-url
                          - name: _REDIS_URL_REG
                            valueFrom:
                              secretKeyRef:
                                name: harbor-redis-password
                                key: registry-url
          - target:
              kind: Deployment
              name: harbor-jobservice
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: harbor-jobservice
              spec:
                template:
                  spec:
                    containers:
                      - name: jobservice
                        env:
                          - name: JOB_SERVICE_POOL_REDIS_URL
                            valueFrom:
                              secretKeyRef:
                                name: harbor-redis-password
                                key: jobservice-url
          - target:
              kind: Deployment
              name: harbor-registry
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: harbor-registry
              spec:
                template:
                  spec:
                    containers:
                      - name: registry
                        env:
                          - name: REGISTRY_REDIS_PASSWORD
                            valueFrom:
                              secretKeyRef:
                                name: harbor-redis-password
                                key: password
                      - name: registryctl
                        env:
                          - name: REGISTRY_REDIS_PASSWORD
                            valueFrom:
                              secretKeyRef:
                                name: harbor-redis-password
                                key: password
