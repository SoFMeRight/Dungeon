---
# Docker Hub proxy cache — all routing handled by nginx proxy
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: harbor-proxy-cache-docker
  annotations:
    gatus.home-operations.com/endpoint: |
      group: "Business Apps (Hyrule Castle🏰)"
      # A registry answers 404 at the root; /v2/ returning an auth challenge is
      # what proves the proxy cache is actually serving.
      url: https://docker.cr.optcp.com/v2/
      conditions:
        - "[STATUS] == 401"
spec:
  parentRefs:
    - name: phloem-gateway
      namespace: optcp-gateway-phloem
  hostnames:
    - "docker.cr.optcp.com"
  rules:
    - backendRefs:
        - name: harbor-proxy-cache-proxy
          port: 8080
