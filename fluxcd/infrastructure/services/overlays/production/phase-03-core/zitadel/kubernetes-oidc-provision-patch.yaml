---
# Instance-specific wiring for the Kubernetes OIDC provisioner (base is templated):
# concrete image + this Zitadel instance's URL and the project name to provision into.
# Keyed by NAME: on this instance it reuses the existing "Container Orchestration"
# project (where weave-gitops already lives); on a fresh bootstrap it creates it.
apiVersion: batch/v1
kind: Job
metadata:
  name: kubernetes-oidc-provision
spec:
  template:
    spec:
      initContainers:
        - name: wait-for-secret
          image: docker.io/alpine/k8s:1.37.1
      containers:
        - name: provision
          image: docker.io/alpine/k8s:1.37.1
          env:
            # Endpoint (domain + svc/port) is discovered from the zitadel HTTPRoute at runtime,
            # so only the intent values live here.
            - name: PROJECT_NAME
              value: Container Orchestration
            # Cluster-specific app name (house pattern: env/cluster on the app, like "DD-UI (prod)").
            # Quoted because the ": " would otherwise read as a YAML mapping.
            - name: K8S_APP_NAME
              value: "Kubernetes: Dungeon"
