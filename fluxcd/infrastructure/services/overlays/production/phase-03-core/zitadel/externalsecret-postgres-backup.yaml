# Credential for the zitadel-postgres archive on the NAS object store.
# Separate from the app's live object-storage credential on purpose: the backup
# must not be readable with the same key that serves user data.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-postgres-backup-s3
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-optcp
  target:
    name: zitadel-postgres-backup-s3
    creationPolicy: Owner
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: apps/zitadel/s3-backup
        property: ACCESS_KEY
    - secretKey: SECRET_ACCESS_KEY
      remoteRef:
        key: apps/zitadel/s3-backup
        property: SECRET_KEY
