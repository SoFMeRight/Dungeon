# Read-only Zitadel token flatroles uses to map each client ID to its project. The
# zitadel-configuration Job mints it for the flatroles-directory machine user
# (IAM_OWNER_VIEWER) and writes it to Vault apps/zitadel:FLATROLES_DIRECTORY_TOKEN.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-flatroles-directory
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-zeldas-letter
  target:
    name: zitadel-flatroles-directory
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: apps/zitadel
        property: FLATROLES_DIRECTORY_TOKEN
