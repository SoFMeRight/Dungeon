---
# Instance-specific wiring for the configuration Job (base is templated): concrete
# image + the intent values. Endpoint/domain are discovered from the zitadel
# HTTPRoute at runtime; the project is keyed by NAME (reuses the existing
# "Container Orchestration" project where weave-gitops lives; creates it on a
# fresh bootstrap); the app name carries the cluster per house style ("DD-UI (prod)").
apiVersion: batch/v1
kind: Job
metadata:
  name: zitadel-configuration
spec:
  template:
    spec:
      initContainers:
        - name: wait-for-bootstrap
          image: docker.io/alpine/k8s:1.37.1
          resources:
            requests:
              memory: 16Mi
              cpu: 10m
            limits:
              memory: 64Mi
      containers:
        - name: configure
          image: ghcr.io/homelabhd/ansible:v2.21.5@sha256:9130d35313d7117085b015d2ef6708436377f09ab16dfe4933a76fcc91f2b0f2
          resources:
            requests:
              memory: 64Mi
              cpu: 10m
            limits:
              memory: 256Mi
              cpu: 500m
          env:
            - name: PROJECT_NAME
              value: Container Orchestration
            - name: K8S_APP_NAME
              value: "Kubernetes: Dungeon"
            # Security (Wazuh): the role ladder plus one scope key per wazuh tenant group.
            - name: PROJECT_ROLES
              value: >-
                [{"project": "Security", "roles": [
                  {"key": "operator", "name": "Operator", "group": "Operators"},
                  {"key": "admin", "name": "Administrator", "group": "Administration"},
                  {"key": "developer", "name": "Developer", "group": "Developers"},
                  {"key": "user", "name": "User", "group": "Users"},
                  {"key": "group-optcp", "name": "Scope: OPTCP", "group": "Tenant scopes"},
                  {"key": "group-prplanit", "name": "Scope: PrPlanIT", "group": "Tenant scopes"},
                  {"key": "group-arbitorium", "name": "Scope: Arbitorium", "group": "Tenant scopes"}]}]
