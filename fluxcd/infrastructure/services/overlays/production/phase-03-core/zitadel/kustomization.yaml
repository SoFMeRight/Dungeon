apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: zeldas-lullaby

resources:
  - ../../../../base/zitadel
  - ../../../../base/zitadel-jobs  # one-shot init/setup/admin-sa Jobs (per-resource force-annotated; folded back from the retired infra-zitadel-jobs Kustomization)
  - httproute.yaml
  - login-v2-httproute.yaml
  - externalsecret-postgres-backup.yaml

patches:
  - path: image-patch.yaml
  - path: command-patches.yaml
  # Job-half patches, folded in from the retired zitadel-jobs overlay:
  - path: jobs-image-patch.yaml
  - path: jobs-command-patches.yaml
  - path: zitadel-configuration-patch.yaml
  - path: setup-job-env-patch.yaml
    target:
      kind: Job
      name: zitadel-setup
  - path: statefulset-patch.yaml
    target:
      kind: StatefulSet
      name: zitadel
  - path: postgres-cluster-patch.yaml
    target:
      kind: Cluster
      name: zitadel-postgres
  - path: objectstore-postgres-patch.yaml
    target:
      kind: ObjectStore
      name: zitadel-postgres-store
  - path: objectstore-postgres-prior-patch.yaml
    target:
      kind: ObjectStore
      name: zitadel-postgres-prior
  - path: service-patch.yaml
    target:
      kind: Service
      name: zitadel
  - path: login-v2-deployment-patch.yaml
    target:
      kind: Deployment
      name: zitadel-login-v2
  - path: redis-replication-patch.yaml
    target:
      kind: RedisReplication
      name: zitadel-redis
  - path: externalsecret-redis-patch.yaml
    target:
      kind: ExternalSecret
      name: zitadel-redis-password
