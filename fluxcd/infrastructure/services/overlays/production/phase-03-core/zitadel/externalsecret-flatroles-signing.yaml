# Per-target HMAC signing key for the flatRoles Actions-v2 target. The zitadel-configuration
# Job mints/regenerates it in Zitadel and writes it to Vault apps/zitadel:FLATROLES_SIGNING_KEY;
# this syncs it into the Secret the flatroles Deployment consumes as SIGNING_KEY (optional).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-flatroles-signing
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-zeldas-letter
  target:
    name: zitadel-flatroles-signing
    creationPolicy: Owner
  data:
    - secretKey: signing_key
      remoteRef:
        key: apps/zitadel
        property: FLATROLES_SIGNING_KEY
