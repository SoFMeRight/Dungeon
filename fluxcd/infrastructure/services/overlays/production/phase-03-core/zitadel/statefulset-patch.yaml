apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zitadel
  annotations:
    configmap.reloader.stakater.com/reload: zitadel-config
spec:
  replicas: 3
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: "2026-11-01T20:30:00Z"
      labels:
        policy.prplanit.com/ingress: "true"
        policy.prplanit.com/cap.postgres: "true"
        policy.prplanit.com/access-scope-postgres: optcp-identity.zitadel.postgres
        policy.prplanit.com/cap.redis: "true"
        policy.prplanit.com/access-scope-redis: optcp-identity.zitadel.redis
    spec:
      containers:
        - name: zitadel
          securityContext:
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # readOnlyRootFilesystem: zitadel is DB-backed (postgres + redis) with config read-only
        # from a configMap; /tmp is defensive scratch.
        - name: tmp
          emptyDir: {}
