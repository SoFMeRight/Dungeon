---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zitadel
spec:
  template:
    spec:
      initContainers:
        - name: wait-for-setup
          image: docker.io/alpine/k8s:1.37.1
          command:
            - sh
            - -c
            - |
              echo "Waiting for setup job to complete..."
              until [ "$(kubectl get job zitadel-setup -n optcp-identity -o jsonpath='{.status.succeeded}' 2>/dev/null)" = "1" ]; do
                echo "Setup job not complete yet, waiting..."
                sleep 5
              done
              echo "Setup job completed! Starting Zitadel..."
      containers:
        - name: zitadel
          image: ghcr.io/homelabhd/zitadel:v4.20.2@sha256:eb28517ac625bae62aafbde743712ed11c1218d4cbaac23fd37094b99c8e4d8b
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zitadel-flatroles
spec:
  template:
    spec:
      containers:
        - name: flatroles
          image: ghcr.io/prplanit/zitadel-flatroles:v0.2.0
