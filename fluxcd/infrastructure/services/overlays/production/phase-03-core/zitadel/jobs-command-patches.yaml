---
# Patch init job init container command with actual Postgres hostname
# Base already has correct 'zitadel init' command (reads ZITADEL_MASTERKEY env automatically)
apiVersion: batch/v1
kind: Job
metadata:
  name: zitadel-init
spec:
  template:
    spec:
      initContainers:
        - name: wait-for-postgres
          command:
            - sh
            - -c
            - until pg_isready -h zitadel-postgres-rw.optcp-identity.svc.cluster.local -p 5432 -U postgres; do echo waiting for postgres; sleep 2; done
---
# Patch setup job sidecar containers to replace PLACEHOLDER_NAMESPACE with actual namespace
apiVersion: batch/v1
kind: Job
metadata:
  name: zitadel-setup
spec:
  template:
    spec:
      containers:
        - name: machine-pat-writer
          command:
            - sh
            - -c
            - |
              set -e
              echo "Waiting for setup container to terminate..."
              until [ ! -z "$(kubectl get pod ${POD_NAME} -n optcp-identity -o jsonpath='{.status.containerStatuses[?(@.name=='\''zitadel-setup'\'')].state.terminated}' 2>/dev/null)" ]; do
                sleep 5
              done
              if [ ! -s /machinekey/pat ]; then
                echo "Setup wrote no /machinekey/pat; secret zitadel-k8s-admin-sa left unchanged."
                exit 0
              fi
              echo "Setup container terminated. Extracting PAT..."
              kubectl create secret generic zitadel-k8s-admin-sa \
                --from-file=pat=/machinekey/pat \
                --dry-run=client -o yaml | kubectl apply -f -
              echo "Secret zitadel-k8s-admin-sa applied."
        - name: login-client-pat-writer
          command:
            - sh
            - -c
            - |
              set -e
              echo "Waiting for setup container to terminate..."
              until [ ! -z "$(kubectl get pod ${POD_NAME} -n optcp-identity -o jsonpath='{.status.containerStatuses[?(@.name=='\''zitadel-setup'\'')].state.terminated}' 2>/dev/null)" ]; do
                sleep 5
              done
              if [ ! -s /login-client/pat ]; then
                echo "Setup wrote no /login-client/pat; secret zitadel-login-client left unchanged."
                exit 0
              fi
              echo "Setup container terminated. Extracting login client PAT..."
              kubectl create secret generic zitadel-login-client \
                --from-file=pat=/login-client/pat \
                --dry-run=client -o yaml | kubectl apply -f -
              echo "Secret zitadel-login-client applied."
