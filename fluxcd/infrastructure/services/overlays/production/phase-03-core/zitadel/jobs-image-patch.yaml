---
apiVersion: batch/v1
kind: Job
metadata:
  name: zitadel-init
spec:
  template:
    spec:
      initContainers:
        - name: wait-for-postgres
          image: docker.io/postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h zitadel-postgres-rw.optcp-identity.svc.cluster.local -p 5432 -U postgres; do
                echo "waiting for postgres"
                sleep 2
              done
      containers:
        - name: zitadel-init
          image: ghcr.io/homelabhd/zitadel:v4.20.2@sha256:eb28517ac625bae62aafbde743712ed11c1218d4cbaac23fd37094b99c8e4d8b
---
apiVersion: batch/v1
kind: Job
metadata:
  name: zitadel-setup
spec:
  template:
    spec:
      initContainers:
        - name: wait-for-db
          image: docker.io/alpine/k8s:1.37.1
      containers:
        - name: zitadel-setup
          image: ghcr.io/homelabhd/zitadel:v4.20.2@sha256:eb28517ac625bae62aafbde743712ed11c1218d4cbaac23fd37094b99c8e4d8b
        - name: machine-pat-writer
          image: docker.io/alpine/k8s:1.37.1
        - name: login-client-pat-writer
          image: docker.io/alpine/k8s:1.37.1
