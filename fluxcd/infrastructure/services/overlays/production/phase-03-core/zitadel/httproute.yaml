apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zitadel
  annotations:
    gatus.home-operations.com/endpoint: |
      group: "Administration (Zelda's Lullaby🎵)"
spec:
  parentRefs:
    - name: cell-membrane-ingress-gateway
      namespace: optcp-ingress-public
      sectionName: https-optcp
    - name: cell-membrane-ingress-gateway
      namespace: optcp-ingress-public
      sectionName: https-prplanit
  hostnames:
    - sso.optcp.com
    - sso.prplanit.com
  rules:
    - backendRefs:
        - name: zitadel
          port: 8174
