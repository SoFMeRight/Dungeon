apiVersion: v1
kind: Service
metadata:
  name: alloy-syslog
  labels:
    app: alloy-syslog
spec:
  type: LoadBalancer
  selector:
    app: alloy-syslog
  ports:
    - name: syslog
      port: 514
      targetPort: syslog
      protocol: UDP
    - name: syslog-rfc5424
      port: 5424
      targetPort: syslog-rfc5424
      protocol: UDP
