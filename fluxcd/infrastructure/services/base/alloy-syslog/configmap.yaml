# The estate's syslog intake. Devices that can only speak syslog (pfSense, switches,
# appliances) send here, over TLS where the device supports it; every message lands in
# Loki first, where Grafana and CrowdSec read it like any other log, and a copy is relayed
# to the Wazuh manager for detection.
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-syslog-config
data:
  config.alloy: |
    // RFC 5424 carries a zoned timestamp and the sender's hostname; prefer it (pfSense).
    otelcol.receiver.syslog "rfc5424" {
      protocol = "rfc5424"
      udp {
        listen_address = "0.0.0.0:5424"
      }
      output {
        logs = [otelcol.processor.attributes.loki_labels.input, otelcol.exporter.syslog.wazuh.input]
      }
    }

    // RFC 3164 timestamps have no zone; devices that only speak it log in local time.
    otelcol.receiver.syslog "rfc3164" {
      protocol = "rfc3164"
      location = "America/Los_Angeles"
      udp {
        listen_address = "0.0.0.0:5514"
      }
      output {
        logs = [otelcol.processor.attributes.loki_labels.input, otelcol.exporter.syslog.wazuh.input]
      }
    }

    // RFC 5425: RFC 5424 over TLS, octet-counted frames on TCP (TrueNAS, Eaton).
    // UDP above stays for senders that cannot do TLS (pfSense).
    otelcol.receiver.syslog "rfc5425_tls" {
      protocol              = "rfc5424"
      enable_octet_counting = true
      tcp {
        listen_address = "0.0.0.0:6514"
        // TrueNAS counts each frame's trailing newline in its octet count; trimming it
        // would leave the parser one byte short.
        preserve_trailing_whitespaces = true
        tls {
          cert_file = "/etc/alloy/tls/tls.crt"
          key_file  = "/etc/alloy/tls/tls.key"
          // Picks up cert-manager renewals without a restart.
          reload_interval = "1h"
        }
      }
      output {
        logs = [otelcol.processor.attributes.loki_labels.input, otelcol.exporter.syslog.wazuh.input]
      }
    }

    otelcol.processor.attributes "loki_labels" {
      action {
        key    = "loki.attribute.labels"
        action = "insert"
        value  = "hostname, appname"
      }
      output {
        logs = [otelcol.exporter.loki.default.input]
      }
    }

    otelcol.exporter.loki "default" {
      forward_to = [loki.process.syslog.receiver]
    }

    // The exporter wraps each record as OTLP JSON; Loki keeps the original syslog line.
    loki.process "syslog" {
      stage.json {
        expressions = { body = "body" }
      }
      stage.output {
        source = "body"
      }
      stage.label_drop {
        values = ["exporter"]
      }
      stage.static_labels {
        values = { job = "syslog" }
      }
      forward_to = [loki.write.default.receiver]
    }

    loki.write "default" {
      endpoint {
        url = env("LOKI_PUSH_URL")
      }
    }

    otelcol.exporter.syslog "wazuh" {
      endpoint = env("WAZUH_SYSLOG_HOST")
      port     = 514
      network  = "udp"
      protocol = "rfc3164"
    }
