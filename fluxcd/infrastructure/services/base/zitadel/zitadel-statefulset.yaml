apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zitadel
spec:
  replicas: PLACEHOLDER_REPLICAS
  serviceName: zitadel
  selector:
    matchLabels:
      app: zitadel
  template:
    metadata:
      labels:
        app: zitadel
    spec:
      serviceAccountName: zitadel
      # zitadel image already runs as the non-root 'zitadel' user (uid 1000); formalize it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-setup
          image: PLACEHOLDER_KUBECTL_IMAGE
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - sh
            - -c
            - |
              echo "Waiting for setup job to complete..."
              until [ "$(kubectl get job zitadel-setup -n PLACEHOLDER_NAMESPACE -o jsonpath='{.status.succeeded}' 2>/dev/null)" = "1" ]; do
                echo "Setup job not complete yet, waiting..."
                sleep 5
              done
              echo "Setup job completed! Starting Zitadel..."
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "50m"
      containers:
        - name: zitadel
          image: PLACEHOLDER_IMAGE
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: ZITADEL_MASTERKEY
              valueFrom:
                secretKeyRef:
                  name: zitadel-masterkey
                  key: masterkey
            - name: ZITADEL_DATABASE_POSTGRES_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zitadel-secrets
                  key: ZITADEL_DATABASE_POSTGRES_USER_PASSWORD
            - name: ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zitadel-postgres-superuser
                  key: password
            - name: ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: zitadel-secrets
                  key: SMTP_USER
            - name: ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zitadel-secrets
                  key: SMTP_PASSWORD
            # Redis cache password
            - name: ZITADEL_CACHES_CONNECTORS_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zitadel-redis-password
                  key: password
            # LoginV2 feature configuration
            - name: ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED
              value: "true"
            - name: ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI
              value: "http://zitadel-login-v2:3000"
            # Kubernetes integration
            - name: KUBERNETES_SERVICE_HOST
              value: "kubernetes.default.svc"
            - name: KUBERNETES_SERVICE_PORT
              value: "443"
            - name: ZITADEL_PORT
              value: "8080"
            - name: ZITADEL_EXTERNALPORT
              value: "443"
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          command:
            - /app/zitadel
            - start
            - --config
            - /config/zitadel-config.yaml
            - --masterkeyFromEnv
            - --tlsMode
            - external
          volumeMounts:
            - name: zitadel-config
              mountPath: /config
              readOnly: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "60m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /debug/healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /debug/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: zitadel-config
          configMap:
            name: zitadel-config
