# Base backups. WAL archiving alone cannot restore anything -- it is a diff with
# no starting point -- so this is what makes zitadel-postgres actually recoverable.
# The cluster's retentionPolicy prunes both base backups and the WAL between them.
#
# schedule is SIX fields: seconds first (robfig/cron), not the Kubernetes five.
# Runs at 22:00, staggered ten minutes from its neighbours and clear of the
# velero window, which occupies roughly 02:00-05:00.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: zitadel-postgres-daily
spec:
  cluster:
    name: zitadel-postgres
  schedule: "0 0 22 * * *"
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  # Take one on creation: recoverability should start now, not tomorrow night.
  immediate: true
  # Read from a replica where there is one, so the primary is not loaded.
  # Falls back to the primary on single-instance clusters.
  target: prefer-standby
  backupOwnerReference: self
