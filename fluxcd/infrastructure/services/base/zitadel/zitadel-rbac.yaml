apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zitadel
rules:
  # For storing generated secrets (machine keys, PATs)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
  # For pod information/discovery and exec
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  # For checking job status
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list"]
  # For checking StatefulSet readiness in init containers
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get"]
  # Lets the configuration Job roll the flatroles Deployment after (re)writing its signing
  # key, so the pods pick up SIGNING_KEY (Reloader is reloadOnCreate=false, so a freshly
  # created key-Secret does not auto-restart it).
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
    resourceNames: ["zitadel-flatroles"]
  # For service account token creation (K8s auth)
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]
  # Lets provisioning Jobs self-configure the Zitadel endpoint from its own HTTPRoute
  # (external domain + backend service/port) instead of baking instance literals.
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get"]
    resourceNames: ["zitadel"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zitadel
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: zitadel
subjects:
  - kind: ServiceAccount
    name: zitadel
