# Generated once in-cluster, never read from OpenBao: Redis is a cache, so a regenerated
# password costs only a Redis and Zitadel restart.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: zitadel-redis-password
spec:
  length: 48
  digits: 12
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-redis-password
spec:
  refreshPolicy: CreatedOnce
  target:
    name: zitadel-redis-password
    creationPolicy: Owner
    template:
      data:
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: zitadel-redis-password
