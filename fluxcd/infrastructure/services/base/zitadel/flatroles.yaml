# flatRoles as an Actions v2 target: Zitadel calls this endpoint on preuserinfo /
# preaccesstoken and the response appends the flat `roles` claim: the role keys the user
# is granted in the requesting application's own project. This claim is LOAD-BEARING for
# cluster authentication: the kube-apiserver maps it to prplanit-sso:-prefixed groups.
# The target is the PrPlanIT/zitadel-flatroles Go binary (image set in the overlay); the
# zitadel-configuration Job wires the Zitadel side (directory token, target, executions)
# and self-tests it before retiring the legacy v1 Action.
#
# Caller authn: the AuthorizationPolicy allow-zitadel-to-flatroles restricts ingress to
# sa/zitadel via the ambient mesh, and the binary verifies the ZITADEL-Signature payload
# HMAC with SIGNING_KEY once the configuration Job has minted it.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: zitadel-flatroles
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zitadel-flatroles
  annotations:
    # Restart to pick up SIGNING_KEY / ZITADEL_TOKEN when ESO (re)writes either Secret.
    secret.reloader.stakater.com/reload: zitadel-flatroles-signing,zitadel-flatroles-directory
spec:
  # Two replicas: this sits on the login path. A total outage does not block logins
  # (the target is registered interruptOnError=false) but drops the roles claim,
  # which empties every user's groups until it returns.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: zitadel-flatroles
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zitadel-flatroles
    spec:
      serviceAccountName: zitadel-flatroles
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: flatroles
          image: PLACEHOLDER_IMAGE
          env:
            # When ESO has populated the signing-key Secret, the binary verifies the
            # ZITADEL-Signature HMAC; absent (e.g. fresh bootstrap before the key exists)
            # it starts with verification off and relies on the mesh AuthorizationPolicy.
            - name: SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: zitadel-flatroles-signing
                  key: signing_key
                  optional: true
            # Roles come only from the requesting application's own project. The client ->
            # project directory is read through the Zitadel API with a read-only token the
            # zitadel-configuration Job mints; flatroles stays unready until it has synced.
            - name: MODE
              value: PLACEHOLDER_FLATROLES_MODE
            - name: ZITADEL_API_URL
              value: http://zitadel:8174
            - name: ZITADEL_HOST
              value: PLACEHOLDER_ZITADEL_HOST
            - name: ZITADEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: zitadel-flatroles-directory
                  key: token
                  optional: true
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: zitadel-flatroles
spec:
  selector:
    app.kubernetes.io/name: zitadel-flatroles
  ports:
    - name: http
      port: 8080
      targetPort: http
