# flatRoles as an Actions v2 target: Zitadel calls this endpoint on preuserinfo /
# preaccesstoken and the response appends the flat `roles` claim: every role key in the
# grants Zitadel sends, which are only the user's active grants on the token's role
# audience (the requesting app's project, plus any project it requests). This claim is
# LOAD-BEARING for cluster authentication: the kube-apiserver maps it to
# prplanit-sso:-prefixed groups. The target is the PrPlanIT/zitadel-flatroles Go binary
# (image set in the overlay); the zitadel-configuration Job wires the Zitadel side (target
# + executions) and self-tests it before retiring the legacy v1 Action.
#
# Caller authn: the AuthorizationPolicy allow-zitadel-to-flatroles restricts ingress to
# sa/zitadel via the ambient mesh, and the binary verifies the ZITADEL-Signature payload
# HMAC with SIGNING_KEY once the configuration Job has minted it.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: zitadel-flatroles
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zitadel-flatroles
  annotations:
    # Restart to pick up SIGNING_KEY when ESO (re)writes the signing-key Secret.
    secret.reloader.stakater.com/reload: zitadel-flatroles-signing
spec:
  # Two replicas: this sits on the login path. A total outage does not block logins
  # (the target is registered interruptOnError=false) but drops the roles claim,
  # which empties every user's groups until it returns.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: zitadel-flatroles
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zitadel-flatroles
    spec:
      serviceAccountName: zitadel-flatroles
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: flatroles
          image: PLACEHOLDER_IMAGE
          env:
            # When ESO has populated the signing-key Secret, the binary verifies the
            # ZITADEL-Signature HMAC; absent (e.g. fresh bootstrap before the key exists)
            # it starts with verification off and relies on the mesh AuthorizationPolicy.
            - name: SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: zitadel-flatroles-signing
                  key: signing_key
                  optional: true
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 2m
              memory: 18Mi
            limits:
              cpu: 1279m
              memory: 80Mi
---
apiVersion: v1
kind: Service
metadata:
  name: zitadel-flatroles
spec:
  selector:
    app.kubernetes.io/name: zitadel-flatroles
  ports:
    - name: http
      port: 8080
      targetPort: http
