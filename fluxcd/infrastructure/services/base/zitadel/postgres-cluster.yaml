apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: zitadel-postgres
spec:
  instances: 3

  imageName: ghcr.io/cloudnative-pg/postgresql:16.15

  affinity:
    podAntiAffinityType: required

  bootstrap:
    initdb:
      database: zitadel
      owner: zitadel
      secret:
        name: zitadel-secrets

  enableSuperuserAccess: true

  # pvcTemplate for static PVCs with named RBDs
  # If PVCs already exist, CloudNativePG will use them instead of creating new ones
  storage:
    pvcTemplate:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: PLACEHOLDER_STORAGE_SIZE
      storageClassName: PLACEHOLDER_STORAGE_CLASS

  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "128MB"
      effective_cache_size: "512MB"
      maintenance_work_mem: "32MB"
      checkpoint_completion_target: "0.9"
      wal_buffers: "8MB"
      default_statistics_target: "100"
      random_page_cost: "1.1"
      effective_io_concurrency: "200"
      work_mem: "1310kB"
      min_wal_size: "512MB"
      max_wal_size: "2GB"
      max_slot_wal_keep_size: "800MB"
      # A replica reports which row versions its running queries still need, so the
      # primary does not vacuum them away mid-query. Without it a read on a replica
      # that outlives max_standby_streaming_delay (30s) is cancelled with "User query
      # might have needed to see row versions that must be removed" — which is what
      # stops a pg_dump of eventstore.events2 from ever completing on a replica.
      # The primary retains dead tuples only for the life of an actual replica query,
      # and a disconnected replica sends no feedback, so the bloat exposure is the
      # duration of the query rather than of the outage.
      hot_standby_feedback: "on"

  resources:
    requests:
      memory: "256Mi"
      cpu: "35m"
    limits:
      memory: "512Mi"
      cpu: "100m"
  # Archive to the NAS object store. destinationPath and endpointURL are supplied
  # by the environment overlay: the path carries the cluster name and the endpoint
  # is that environment's store. Everything else is the same wherever this runs.
  backup:
    barmanObjectStore:
      s3Credentials:
        accessKeyId:
          name: zitadel-postgres-backup-s3
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: zitadel-postgres-backup-s3
          key: SECRET_ACCESS_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
    retentionPolicy: "30d"
