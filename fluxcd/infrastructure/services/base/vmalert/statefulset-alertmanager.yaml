# Routes vmalert's alerts to ntfy. Two instances gossip silences and the notification
# log over 9094, so either can be lost without missing or duplicating a notification.
# Their state lives in an emptyDir and is rebuilt from the surviving peer.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: alertmanager
  annotations:
    configmap.reloader.stakater.com/reload: alertmanager-config
    secret.reloader.stakater.com/reload: alertmanager-ntfy-token
spec:
  serviceName: alertmanager-headless
  replicas: 2
  podManagementPolicy: Parallel
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
        policy.prplanit.com/probe: "true"
    spec:
      serviceAccountName: alertmanager
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: alertmanager
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alertmanager
          image: PLACEHOLDER_IMAGE
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
            - --web.listen-address=:9093
            - --cluster.listen-address=0.0.0.0:9094
            - --cluster.advertise-address=$(POD_IP):9094
            - --cluster.peer=alertmanager-0.alertmanager-headless:9094
            - --cluster.peer=alertmanager-1.alertmanager-headless:9094
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - containerPort: 9093
              name: http
            - containerPort: 9094
              name: cluster
              protocol: TCP
            - containerPort: 9094
              name: cluster-udp
              protocol: UDP
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 30
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
              readOnly: true
            - name: ntfy-token
              mountPath: /etc/alertmanager-secrets/ntfy
              readOnly: true
            - name: data
              mountPath: /alertmanager
          resources:
            requests:
              cpu: PLACEHOLDER_CPU
              memory: PLACEHOLDER_MEMORY
            limits:
              cpu: PLACEHOLDER_CPU_LIMIT
              memory: PLACEHOLDER_MEMORY_LIMIT
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: ntfy-token
          secret:
            secretName: alertmanager-ntfy-token
        - name: data
          emptyDir: {}
