# Logic only; every name, URL and filter arrives as an environment variable from the overlay.
apiVersion: v1
kind: ConfigMap
metadata:
  name: boundary-configuration
data:
  configure.sh: |
    #!/bin/sh
    set -eu
    for v in BOUNDARY_ADDR OIDC_ISSUER OIDC_API_URL_PREFIX OIDC_AUTH_METHOD_NAME OIDC_AUTH_METHOD_DESCRIPTION \
             ADMIN_LOGIN_NAME MANAGED_GROUP_NAME MANAGED_GROUP_FILTER ADMIN_ROLE_NAME \
             ORG_NAME PROJECT_NAME TARGETS WORKER_NAMES OIDC_CLIENT_ID OIDC_CLIENT_SECRET ADMIN_PASSWORD; do
      eval "[ -n \"\${$v:-}\" ]" || { echo "$v is not set"; exit 1; }
    done
    export BOUNDARY_ADDR
    # anon: before login; b: the session token is passed explicitly from a variable the CLI never reads on its own.
    anon() { boundary "$@" -keyring-type none -format json; }
    b() { boundary "$@" -token env://SESSION_TOKEN -keyring-type none -format json; }
    ids() { grep -o "\"id\":\"$1_[^\"]*\"" | cut -d'"' -f4; }
    # Finds a resource by name: $1 kind, $2 id prefix, $3 name, rest list arguments.
    by_name() {
      kind=$1; prefix=$2; name=$3; shift 3
      for id in $(b "$kind" list "$@" | ids "$prefix" || true); do
        b "$kind" read -id "$id" | grep -q "\"name\":\"$name\"" && { echo "$id"; return 0; }
      done
      return 0
    }

    echo "=== Waiting for the controller API ==="
    n=0; until anon auth-methods list -scope-id global >/dev/null 2>&1; do
      n=$((n+1)); [ "$n" -gt 60 ] && { echo "controller not answering at $BOUNDARY_ADDR"; exit 1; }; sleep 5
    done
    echo "=== Authenticating ==="
    # The initial login role lets anyone list global auth methods; the password one is found by type.
    PW_AM_ID=$(anon auth-methods list -scope-id global | ids ampw | head -1 || true)
    [ -n "$PW_AM_ID" ] || { echo "no password auth method in the global scope"; exit 1; }
    AUTH=$(anon authenticate password -auth-method-id "$PW_AM_ID" -login-name "$ADMIN_LOGIN_NAME" \
      -password env://ADMIN_PASSWORD)
    SESSION_TOKEN=$(printf '%s' "$AUTH" | grep -o '"token":"[^"]*"' | cut -d'"' -f4)
    SESSION_TOKEN_ID=$(printf '%s' "$AUTH" | grep -o '"id":"at_[^"]*"' | head -1 | cut -d'"' -f4)
    unset AUTH
    [ -n "$SESSION_TOKEN" ] && [ -n "$SESSION_TOKEN_ID" ] || { echo "admin login returned no token"; exit 1; }
    export SESSION_TOKEN
    # Every run logs in afresh, so the run revokes its own session on any exit; left alive, each one
    # would stay a usable admin credential for the token lifetime.
    trap 'b auth-tokens delete -id "$SESSION_TOKEN_ID" >/dev/null 2>&1 && echo "revoked session $SESSION_TOKEN_ID"' EXIT

    echo "=== Auth method '$OIDC_AUTH_METHOD_NAME' ==="
    OIDC_AM_ID=$(b scopes read -id global | grep -o '"primary_auth_method_id":"amoidc_[^"]*"' | cut -d'"' -f4 || true)
    if [ -n "$OIDC_AM_ID" ]; then
      b auth-methods update oidc -id "$OIDC_AM_ID" -issuer "$OIDC_ISSUER" -client-id "$OIDC_CLIENT_ID" \
        -client-secret "$OIDC_CLIENT_SECRET" -api-url-prefix "$OIDC_API_URL_PREFIX" \
        -name "$OIDC_AUTH_METHOD_NAME" -description "$OIDC_AUTH_METHOD_DESCRIPTION" >/dev/null
    else
      OIDC_AM_ID=$(b auth-methods create oidc -scope-id global -issuer "$OIDC_ISSUER" -client-id "$OIDC_CLIENT_ID" \
        -client-secret "$OIDC_CLIENT_SECRET" -signing-algorithm RS256 -api-url-prefix "$OIDC_API_URL_PREFIX" \
        -name "$OIDC_AUTH_METHOD_NAME" -description "$OIDC_AUTH_METHOD_DESCRIPTION" | ids amoidc | head -1)
    fi
    echo "auth method $OIDC_AM_ID"
    b auth-methods list -scope-id global | ids amoidc | grep -v "^$OIDC_AM_ID$" \
      | sed 's/^/WARN: extra OIDC auth method, not managed here: /' || true
    b auth-methods change-state oidc -id "$OIDC_AM_ID" -state active-public >/dev/null
    b scopes update -id global -primary-auth-method-id "$OIDC_AM_ID" >/dev/null

    echo "=== Managed group '$MANAGED_GROUP_NAME' in role '$ADMIN_ROLE_NAME' ==="
    MG_ID=$(by_name managed-groups mgoidc "$MANAGED_GROUP_NAME" -auth-method-id "$OIDC_AM_ID")
    if [ -n "$MG_ID" ]; then
      b managed-groups update oidc -id "$MG_ID" -filter "$MANAGED_GROUP_FILTER" >/dev/null
    else
      MG_ID=$(b managed-groups create oidc -auth-method-id "$OIDC_AM_ID" -name "$MANAGED_GROUP_NAME" \
        -filter "$MANAGED_GROUP_FILTER" | ids mgoidc | head -1)
    fi
    ADMIN_ROLE=$(by_name roles r "$ADMIN_ROLE_NAME" -scope-id global)
    [ -n "$ADMIN_ROLE" ] || { echo "no role named '$ADMIN_ROLE_NAME' in the global scope"; exit 1; }
    b roles read -id "$ADMIN_ROLE" | grep -q "\"$MG_ID\"" \
      || b roles add-principals -id "$ADMIN_ROLE" -principal "$MG_ID" >/dev/null
    echo "managed group $MG_ID is a principal of $ADMIN_ROLE"

    echo "=== Targets in '$ORG_NAME' / '$PROJECT_NAME' ==="
    # Sessions carry the person's own SSH certificate (OpenBao optcp-ssh/sign/operator), so a
    # target is an address and a port and nothing else: no credential sources, no stores.
    ORG_ID=$(by_name scopes o "$ORG_NAME" -scope-id global)
    [ -n "$ORG_ID" ] || { echo "no org named '$ORG_NAME'"; exit 1; }
    PROJECT_ID=$(by_name scopes p "$PROJECT_NAME" -scope-id "$ORG_ID")
    [ -n "$PROJECT_ID" ] || PROJECT_ID=$(b scopes create -scope-id "$ORG_ID" -name "$PROJECT_NAME" | ids p | head -1)
    KEEP=""
    printf '%s\n' "$TARGETS" > /tmp/targets
    while read -r name address port; do
      [ -n "$name" ] || continue
      TID=$(by_name targets ttcp "$name" -scope-id "$PROJECT_ID")
      if [ -n "$TID" ]; then
        b targets update tcp -id "$TID" -address "$address" -default-port "$port" >/dev/null
      else
        TID=$(b targets create tcp -scope-id "$PROJECT_ID" -name "$name" -address "$address" -default-port "$port" | ids ttcp | head -1)
      fi
      for src in $(b targets read -id "$TID" | grep -o '"brokered_credential_source_ids":\[[^]]*\]' | grep -o 'cl[a-z]*_[A-Za-z0-9]*' || true); do
        b targets remove-credential-sources -id "$TID" -brokered-credential-source "$src" >/dev/null && echo "target $TID: removed credential source $src"
      done
      KEEP="$KEEP $TID"
      echo "target $TID $name $address:$port"
    done < /tmp/targets
    for t in $(b targets list -scope-id "$PROJECT_ID" | ids ttcp || true); do
      case " $KEEP " in *" $t "*) ;; *) b targets delete -id "$t" >/dev/null && echo "removed undeclared target $t" ;; esac
    done
    for cs in $(b credential-stores list -scope-id global -recursive | ids 'cs[a-z]*' || true); do
      b credential-stores delete -id "$cs" >/dev/null && echo "removed credential store $cs"
    done

    echo "=== Workers: $WORKER_NAMES ==="
    KEEP=""
    for name in $WORKER_NAMES; do
      id=$(by_name workers w "$name")
      [ -n "$id" ] && { KEEP="$KEEP $id"; echo "worker $id is $name"; } || echo "worker $name has not registered yet"
    done
    for w in $(b workers list | ids w || true); do
      case " $KEEP " in *" $w "*) ;; *) b workers delete -id "$w" >/dev/null && echo "removed undeclared worker $w" ;; esac
    done
    echo "=== Done ==="
