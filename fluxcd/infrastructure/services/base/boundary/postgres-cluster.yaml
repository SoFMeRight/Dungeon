apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: boundary-postgres
spec:
  instances: PLACEHOLDER_INSTANCES

  affinity:
    podAntiAffinityType: required

  postgresql:
    parameters:
      shared_buffers: "PLACEHOLDER_SHARED_BUFFERS"
      max_connections: "100"

  bootstrap:
    initdb:
      database: boundary
      owner: boundary
      secret:
        name: boundary-postgres-credentials

  storage:
    storageClass: PLACEHOLDER_STORAGE_CLASS
    size: PLACEHOLDER_STORAGE_SIZE
  # Archive to the NAS object store. destinationPath and endpointURL are supplied
  # by the environment overlay: the path carries the cluster name and the endpoint
  # is that environment's store. Everything else is the same wherever this runs.
  # Archiving is done by the barman-cloud plugin, configured in the ObjectStore of
  # the same name. isWALArchiver makes this plugin the one that ships WAL; exactly
  # one plugin may claim it.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: boundary-postgres-store
