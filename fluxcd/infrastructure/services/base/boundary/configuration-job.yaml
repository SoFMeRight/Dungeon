# Reconciles Boundary's auth method, admin managed group, targets and workers from the
# overlay's values; re-runs when its spec changes.
apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/force: "Enabled"  # immutable one-shot Job: force-replace on image bump, not wedge
  name: boundary-configuration
spec:
  # An hour: sbom-operator scans hourly and must see the finished pod.
  ttlSecondsAfterFinished: 3600
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: boundary
        app.kubernetes.io/component: configuration
    spec:
      serviceAccountName: boundary-controller
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: configure
          image: PLACEHOLDER_BOUNDARY_IMAGE
          command: ["/bin/sh", "/scripts/configure.sh"]
          env:
            - name: BOUNDARY_ADDR
              value: PLACEHOLDER_BOUNDARY_ADDR
            - name: OIDC_ISSUER
              value: PLACEHOLDER_OIDC_ISSUER
            - name: OIDC_API_URL_PREFIX
              value: PLACEHOLDER_OIDC_API_URL_PREFIX
            - name: OIDC_AUTH_METHOD_NAME
              value: PLACEHOLDER_OIDC_AUTH_METHOD_NAME
            - name: OIDC_AUTH_METHOD_DESCRIPTION
              value: PLACEHOLDER_OIDC_AUTH_METHOD_DESCRIPTION
            - name: ADMIN_LOGIN_NAME
              value: PLACEHOLDER_ADMIN_LOGIN_NAME
            - name: MANAGED_GROUP_NAME
              value: PLACEHOLDER_MANAGED_GROUP_NAME
            - name: MANAGED_GROUP_FILTER
              value: PLACEHOLDER_MANAGED_GROUP_FILTER
            - name: ADMIN_ROLE_NAME
              value: PLACEHOLDER_ADMIN_ROLE_NAME
            - name: ORG_NAME
              value: PLACEHOLDER_ORG_NAME
            - name: PROJECT_NAME
              value: PLACEHOLDER_PROJECT_NAME
            # One target per line: name address port.
            - name: TARGETS
              value: PLACEHOLDER_TARGETS
            - name: WORKER_NAMES
              value: PLACEHOLDER_WORKER_NAMES
            - name: HOME
              value: /tmp
          envFrom:
            - secretRef:
                name: boundary-oidc
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: scripts
          configMap:
            name: boundary-configuration
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
