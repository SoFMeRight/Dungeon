apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: boundary-controller
  labels:
    app.kubernetes.io/name: boundary
    app.kubernetes.io/component: controller
spec:
  # Controllers are active/active (coordination state lives in postgres) —
  # one serving controller keeps Boundary online. Involuntary-failure
  # tolerance comes from the replica count; the PDB only forbids a drain
  # from taking the last one.
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: boundary
      app.kubernetes.io/component: controller
