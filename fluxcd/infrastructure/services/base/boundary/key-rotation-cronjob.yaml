# Rotates the SSH key Boundary brokers for each target host: a new pair per run, the
# private half to OpenBao for the credential library, the public half to the host's
# authorized_keys restricted to the Boundary workers. See key-rotation-script.yaml.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: boundary-key-rotation
  labels:
    app.kubernetes.io/name: boundary-key-rotation
spec:
  schedule: PLACEHOLDER_SCHEDULE
  timeZone: PLACEHOLDER_TIMEZONE
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      # A day: sbom-operator scans hourly and must see the finished pod.
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: boundary-key-rotation
        spec:
          serviceAccountName: boundary-key-rotation
          restartPolicy: Never
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: rotate
              image: PLACEHOLDER_IMAGE
              command: ["/bin/sh", "/scripts/rotate.sh"]
              env:
                - name: REPO_URL
                  value: PLACEHOLDER_REPO_URL
                - name: PLAYBOOK
                  value: PLACEHOLDER_PLAYBOOK
                - name: TARGET_GROUP
                  value: PLACEHOLDER_TARGET_GROUP
                - name: WORKER_GROUP
                  value: PLACEHOLDER_WORKER_GROUP
                - name: SECRET_MOUNT
                  value: PLACEHOLDER_SECRET_MOUNT
                - name: SECRET_PATH
                  value: PLACEHOLDER_SECRET_PATH
                - name: BAO_ADDR
                  value: PLACEHOLDER_BAO_ADDR
                - name: BAO_ROLE
                  value: PLACEHOLDER_BAO_ROLE
                - name: SSH_SIGN_PATH
                  value: PLACEHOLDER_SSH_SIGN_PATH
                - name: SSH_PRINCIPAL
                  value: PLACEHOLDER_SSH_PRINCIPAL
                - name: HOME
                  value: /tmp
                - name: ANSIBLE_LOCAL_TEMP
                  value: /tmp/.ansible
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: script
              configMap:
                name: boundary-key-rotation
            - name: tmp
              emptyDir: {}
