# A session is proxied by exactly one worker, and every connection of that session
# must reach the same one, so each worker has its own name and public address:
# <PUBLIC_HOST>:<PUBLIC_PORT_BASE + ordinal * PUBLIC_PORT_STEP>, served by the
# overlay's per-pod Services. Never a load balancer across workers.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: boundary-worker
  labels:
    app.kubernetes.io/name: boundary
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  serviceName: boundary-worker-headless
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: boundary
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: boundary
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: boundary-worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: render-config
          image: docker.io/prplanit/oh-ci:0.0.1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -euo pipefail
              ordinal="${POD_NAME##*-}"
              export WORKER_NAME="$POD_NAME"
              export PUBLIC_ADDR="${PUBLIC_HOST}:$((PUBLIC_PORT_BASE + ordinal * PUBLIC_PORT_STEP))"
              envsubst < /boundary-template/worker.hcl > /boundary/worker.hcl
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: PUBLIC_HOST
              value: PLACEHOLDER_PUBLIC_HOST
            - name: PUBLIC_PORT_BASE
              value: PLACEHOLDER_PUBLIC_PORT_BASE
            - name: PUBLIC_PORT_STEP
              value: PLACEHOLDER_PUBLIC_PORT_STEP
          envFrom:
            - secretRef:
                name: boundary-kms-keys
          volumeMounts:
            - name: template
              mountPath: /boundary-template
            - name: config
              mountPath: /boundary
      containers:
        - name: boundary
          image: PLACEHOLDER_IMAGE
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command: ["boundary", "server", "-config", "/boundary/worker.hcl"]
          ports:
            - name: proxy
              containerPort: 9202
              protocol: TCP
            - name: ops
              containerPort: 9203
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /boundary
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health
              port: ops
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: ops
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 627m
              memory: 144Mi
      volumes:
        - name: template
          configMap:
            name: boundary-worker
        - name: config
          emptyDir: {}
        - name: tmp
          emptyDir: {}
