# Which revision Flux applied, so the rotation runs the play the cluster runs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: boundary-key-rotation
  labels:
    app.kubernetes.io/name: boundary-key-rotation
rules:
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [gitrepositories]
    resourceNames: [flux-system]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: boundary-key-rotation
  labels:
    app.kubernetes.io/name: boundary-key-rotation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: boundary-key-rotation
subjects:
  - kind: ServiceAccount
    name: boundary-key-rotation
    namespace: PLACEHOLDER_NAMESPACE
