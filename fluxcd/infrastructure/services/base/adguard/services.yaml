apiVersion: v1
kind: Service
metadata:
  name: adguard-dns
spec:
  type: LoadBalancer
  ports:
    - port: 53
      targetPort: 53
      protocol: TCP
      name: dns-tcp
    - port: 53
      targetPort: 53
      protocol: UDP
      name: dns-udp
    - port: 853
      targetPort: 853
      protocol: TCP
      name: dns-tls
  selector:
    app: adguard
---
apiVersion: v1
kind: Service
metadata:
  name: adguard-web
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 80
      protocol: TCP
      name: web
  selector:
    app: adguard
---
# Per-pod web services: the AdGuard admin UI keeps its login session on the pod that
# served the login (each replica has its own sessions.db), and adguardhome-sync needs a
# stable origin vs replica. These pin one hostname to one pod (adguard-0 = primary/origin,
# adguard-1 = replica) instead of round-robining the shared adguard-web service.
apiVersion: v1
kind: Service
metadata:
  name: adguard-web-0
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 80
      protocol: TCP
      name: web
  selector:
    app: adguard
    statefulset.kubernetes.io/pod-name: adguard-0
---
apiVersion: v1
kind: Service
metadata:
  name: adguard-web-1
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 80
      protocol: TCP
      name: web
  selector:
    app: adguard
    statefulset.kubernetes.io/pod-name: adguard-1
