apiVersion: apps/v1
kind: Deployment
metadata:
  name: netconsole-collector
  labels:
    app: netconsole-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netconsole-collector
  template:
    metadata:
      labels:
        app: netconsole-collector
    spec:
      serviceAccountName: netconsole-collector
      # Deliberately unpinned: no hostNetwork, no nodeSelector. netconsole does
      # need a literal destination IP and MAC, but those are the LoadBalancer VIP
      # and the DEFAULT GATEWAY's MAC - not this pod's node. The VIP is on a
      # different subnet to the nodes, so netpoll hands the frame to the router
      # and the router delivers it to whichever node currently holds the VIP.
      #
      # That indirection is what makes scheduling dynamic: the collector may move
      # freely and the senders never change. It also closes the self-capture gap,
      # since a node's own frame leaves for the router rather than needing to
      # reach a specific peer.
      #
      # The gateway MAC is a VRRP virtual address (00:00:5e:00:01:xx), so it
      # survives a router failover as well.
      containers:
        - name: collector
          image: PLACEHOLDER_SOCAT_IMAGE
          # Datagrams in, stdout out. Nothing else: stdout is the whole point,
          # because the pod_logs pipeline already carries it to Loki, so panic
          # output lands in the same place as every other log and is queryable
          # and alertable without any new ingest path or credential.
          args:
            - -u
            - UDP-RECV:6666,reuseaddr
            - "-"
          ports:
            - name: netconsole
              containerPort: 6666
              protocol: UDP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
