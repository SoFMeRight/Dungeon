# Each reads only its own entries, as its consumer's ServiceAccount.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-vaultwarden
spec:
  provider:
    vault:
      server: "http://openbao.optcp-secrets.svc.cluster.local:8200"
      path: "optcp"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "vaultwarden"
          serviceAccountRef:
            name: vaultwarden
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-vaultwarden-postgres
spec:
  provider:
    vault:
      server: "http://openbao.optcp-secrets.svc.cluster.local:8200"
      path: "optcp"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "vaultwarden-postgres"
          serviceAccountRef:
            name: vaultwarden-postgres
