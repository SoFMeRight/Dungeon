apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: vaultwarden-postgres
spec:
  instances: 3

  imageName: PLACEHOLDER_POSTGRES_IMAGE

  affinity:
    podAntiAffinityType: required

  bootstrap:
    initdb:
      database: vaultwarden
      owner: vaultwarden
      secret:
        name: vaultwarden-secrets

  storage:
    storageClass: PLACEHOLDER_STORAGE_CLASS
    size: PLACEHOLDER_POSTGRES_STORAGE_SIZE

  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "128MB"
      effective_cache_size: "512MB"
      maintenance_work_mem: "32MB"
      checkpoint_completion_target: "0.9"
      wal_buffers: "8MB"
      default_statistics_target: "100"
      random_page_cost: "1.1"
      effective_io_concurrency: "200"
      work_mem: "1310kB"
      min_wal_size: "512MB"
      max_wal_size: "2GB"
      max_slot_wal_keep_size: "800MB"

  resources:
    requests:
      memory: "128Mi"
      cpu: "25m"
    limits:
      memory: "256Mi"
      cpu: "100m"
  # Archive to the NAS object store. destinationPath and endpointURL are supplied
  # by the environment overlay: the path carries the cluster name and the endpoint
  # is that environment's store. Everything else is the same wherever this runs.
  # Archiving is done by the barman-cloud plugin, configured in the ObjectStore of
  # the same name. isWALArchiver makes this plugin the one that ships WAL; exactly
  # one plugin may claim it.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: vaultwarden-postgres-store
