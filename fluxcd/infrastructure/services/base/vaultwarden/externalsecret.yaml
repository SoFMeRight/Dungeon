apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vaultwarden-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-vaultwarden
    kind: SecretStore
  target:
    name: vaultwarden-secrets
    creationPolicy: Owner
  data:
    - secretKey: ADMIN_TOKEN
      remoteRef:
        key: apps/vaultwarden/app
        property: ADMIN_TOKEN
    - secretKey: SMTP_HOST
      remoteRef:
        key: apps/vaultwarden/smtp
        property: HOST
    - secretKey: SMTP_FROM
      remoteRef:
        key: apps/vaultwarden/smtp
        property: FROM
    - secretKey: SMTP_PORT
      remoteRef:
        key: apps/vaultwarden/smtp
        property: PORT
    - secretKey: SMTP_SECURITY
      remoteRef:
        key: apps/vaultwarden/smtp
        property: SECURITY
    - secretKey: SMTP_USERNAME
      remoteRef:
        key: apps/vaultwarden/smtp
        property: USERNAME
    - secretKey: SMTP_PASSWORD
      remoteRef:
        key: apps/vaultwarden/smtp
        property: PASSWORD
    - secretKey: SSO_CLIENT_ID
      remoteRef:
        key: apps/vaultwarden/oidc
        property: CLIENT_ID
    - secretKey: SSO_CLIENT_SECRET
      remoteRef:
        key: apps/vaultwarden/oidc
        property: CLIENT_SECRET
