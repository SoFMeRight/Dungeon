apiVersion: v1
kind: ConfigMap
metadata:
  name: crowdsec-acquis-netbox
data:
  # NetBox auth-failure acquisition. Filtered to the failure line to keep volume low;
  # type: netbox -> evt.Parsed.program (built-in non-syslog) so prplanit/netbox-logs matches.
  # url patched to the real Loki endpoint in the overlay.
  95-netbox-loki.yaml: |
    source: loki
    url: PLACEHOLDER_LOKI_URL
    limit: 1000
    query: |
      {service_name="netbox-server"} |= "Failed login attempt"
    labels:
      type: netbox
    wait_for_ready: 10s
