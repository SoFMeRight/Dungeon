apiVersion: v1
kind: ConfigMap
metadata:
  name: crowdsec-acquis-jellyfin
data:
  # Jellyfin auth-failure acquisition. Filtered to the denial line to keep volume low;
  # type: jellyfin -> evt.Parsed.program (built-in non-syslog) so prplanit/jellyfin-logs matches.
  # url patched to the real Loki endpoint in the overlay.
  70-jellyfin-loki.yaml: |
    source: loki
    url: PLACEHOLDER_LOKI_URL
    limit: 1000
    query: |
      {service_name="jellyfin"} |= "has been denied"
    labels:
      type: jellyfin
    wait_for_ready: 10s
