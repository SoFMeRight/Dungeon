apiVersion: v1
kind: ConfigMap
metadata:
  name: crowdsec-jellyseerr-scenario
data:
  # Jellyseerr DOES self-report failed logins natively — "[warn][API]: Failed sign-in attempt
  # using invalid Jellyseerr password {"ip":...,"email":...}" — BUT its logged IP is SPOOFABLE:
  # trustProxy=true makes Express take the leftmost X-Forwarded-For, and cell-membrane does not
  # strip a client-supplied XFF. Verified empirically: a request with `X-Forwarded-For:
  # 203.0.113.66` was logged as ip=203.0.113.66. Using that IP to ban would let an attacker forge
  # XFF and ban innocents, so the app-log fails the "real client IP" bar. Detect at the gateway
  # instead: the Envoy access log (istio-gw acquisition + prplanit/istio-gateway-logs parser)
  # carries direct_remote_ip — the real TCP source, CF-aware, header-unspoofable.
  #
  # FP-safe by endpoint scoping: POST /api/v1/auth/local is login-ONLY (success = 200). Verified
  # empirically that a 403 there is EXCLUSIVELY an auth failure — bad credentials return 403,
  # while a malformed/missing body returns 400 and wrong method (GET) returns 405. Bad user and
  # bad password both return the same 403 (no user-enumeration leak at the gateway). The leaky
  # bucket (5 / 20s) tolerates a human fumbling a password; trusted sources (LAN/WAN) are already
  # whitelisted. source_ip is the gateway-derived real client (spoofable: 0).
  jellyseerr-bf.yaml: |
    type: leaky
    name: prplanit/jellyseerr-bf
    description: "Jellyseerr login brute-force (cell-membrane gateway access log)"
    filter: "evt.Parsed.verb == 'POST' && evt.Parsed.target_fqdn == 'jseer.optcp.com' && evt.Parsed.request matches '^/api/v1/auth/local/?$' && evt.Parsed.status == '403'"
    groupby: evt.Meta.source_ip
    capacity: 5
    leakspeed: 20s
    blackhole: 1m
    labels:
      service: jellyseerr
      behavior: "http:bruteforce"
      classification:
        - attack.T1110
      spoofable: 0
      confidence: 3
      label: "Jellyseerr Login Bruteforce"
      remediation: true
