apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crowdsec-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: PLACEHOLDER_SECRET_STORE
  data:
    # In-cluster secret key names mirror the Vault key names 1:1.
    # Cloudflare bouncer's LAPI key (bouncer -> our crowdsec LAPI).
    - secretKey: BOUNCER_CLOUDFLARE_LAPI_KEY
      remoteRef:
        key: PLACEHOLDER_VAULT_KEY
        property: BOUNCER_CLOUDFLARE_LAPI_KEY
    # Cloudflare API token (bouncer -> Cloudflare API).
    - secretKey: CLOUDFLARE_TOKEN
      remoteRef:
        key: PLACEHOLDER_VAULT_KEY
        property: CLOUDFLARE_TOKEN
    # Postgres password (crowdsec + its postgres both read this).
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: PLACEHOLDER_VAULT_KEY
        property: POSTGRES_PASSWORD
    # pfSense HA firewall bouncers — one LAPI key per box.
    - secretKey: BOUNCER_SHIELD_GENERATOR_LAPI_KEY
      remoteRef:
        key: PLACEHOLDER_VAULT_KEY
        property: BOUNCER_SHIELD_GENERATOR_LAPI_KEY
    - secretKey: BOUNCER_SHIELD_REGENERATOR_LAPI_KEY
      remoteRef:
        key: PLACEHOLDER_VAULT_KEY
        property: BOUNCER_SHIELD_REGENERATOR_LAPI_KEY
    # pfSense HA log-processor machine credentials (user + pass per box). Registered on
    # crowdsec startup via a postStart hook (cscli writes straight to the DB).
    - secretKey: MACHINE_SHIELD_GENERATOR_USER
      remoteRef:
        key: PLACEHOLDER_VAULT_KEY
        property: MACHINE_SHIELD_GENERATOR_USER
    - secretKey: MACHINE_SHIELD_GENERATOR_PASS
      remoteRef:
        key: PLACEHOLDER_VAULT_KEY
        property: MACHINE_SHIELD_GENERATOR_PASS
    - secretKey: MACHINE_SHIELD_REGENERATOR_USER
      remoteRef:
        key: PLACEHOLDER_VAULT_KEY
        property: MACHINE_SHIELD_REGENERATOR_USER
    - secretKey: MACHINE_SHIELD_REGENERATOR_PASS
      remoteRef:
        key: PLACEHOLDER_VAULT_KEY
        property: MACHINE_SHIELD_REGENERATOR_PASS
