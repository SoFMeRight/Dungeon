apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crowdsec-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: PLACEHOLDER_SECRET_STORE
  data:
    # In-cluster secret key names mirror the Vault key names 1:1. Bouncers + machines are
    # registered by the crowdsec StatefulSet's postStart hook from these name/key/pass values.
    # Cloudflare bouncer (name + LAPI key + Cloudflare API token).
    - secretKey: BOUNCER_CLOUDFLARE_NAME
      remoteRef:
        key: PLACEHOLDER_VAULT_KEY
        property: BOUNCER_CLOUDFLARE_NAME
    - secretKey: BOUNCER_CLOUDFLARE_LAPI_KEY
      remoteRef:
        key: PLACEHOLDER_VAULT_KEY
        property: BOUNCER_CLOUDFLARE_LAPI_KEY
    - secretKey: CLOUDFLARE_TOKEN
      remoteRef:
        key: PLACEHOLDER_VAULT_KEY
        property: CLOUDFLARE_TOKEN
    # Postgres password (crowdsec + its postgres both read this).
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: PLACEHOLDER_VAULT_KEY
        property: POSTGRES_PASSWORD
    # pfSense HA firewall bouncers (name + LAPI key per box).
    - secretKey: BOUNCER_SHIELD_GENERATOR_NAME
      remoteRef:
        key: PLACEHOLDER_VAULT_KEY
        property: BOUNCER_SHIELD_GENERATOR_NAME
    - secretKey: BOUNCER_SHIELD_GENERATOR_LAPI_KEY
      remoteRef:
        key: PLACEHOLDER_VAULT_KEY
        property: BOUNCER_SHIELD_GENERATOR_LAPI_KEY
    - secretKey: BOUNCER_SHIELD_REGENERATOR_NAME
      remoteRef:
        key: PLACEHOLDER_VAULT_KEY
        property: BOUNCER_SHIELD_REGENERATOR_NAME
    - secretKey: BOUNCER_SHIELD_REGENERATOR_LAPI_KEY
      remoteRef:
        key: PLACEHOLDER_VAULT_KEY
        property: BOUNCER_SHIELD_REGENERATOR_LAPI_KEY
    # pfSense HA log-processor machines (name = login + password per box).
    - secretKey: MACHINE_SHIELD_GENERATOR_NAME
      remoteRef:
        key: PLACEHOLDER_VAULT_KEY
        property: MACHINE_SHIELD_GENERATOR_NAME
    - secretKey: MACHINE_SHIELD_GENERATOR_PASS
      remoteRef:
        key: PLACEHOLDER_VAULT_KEY
        property: MACHINE_SHIELD_GENERATOR_PASS
    - secretKey: MACHINE_SHIELD_REGENERATOR_NAME
      remoteRef:
        key: PLACEHOLDER_VAULT_KEY
        property: MACHINE_SHIELD_REGENERATOR_NAME
    - secretKey: MACHINE_SHIELD_REGENERATOR_PASS
      remoteRef:
        key: PLACEHOLDER_VAULT_KEY
        property: MACHINE_SHIELD_REGENERATOR_PASS
