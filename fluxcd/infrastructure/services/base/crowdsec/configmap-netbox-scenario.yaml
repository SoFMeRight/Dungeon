apiVersion: v1
kind: ConfigMap
metadata:
  name: crowdsec-netbox-scenario
data:
  # Custom scenarios (no hub collection). Brute-force + user-enumeration leaky buckets over
  # prplanit/netbox-logs, grouped by the real client source_ip.
  netbox-bf.yaml: |
    type: leaky
    name: prplanit/netbox-bf
    description: "NetBox login brute-force"
    filter: "evt.Meta.log_type == 'netbox_failed_auth'"
    groupby: evt.Meta.source_ip
    capacity: 5
    leakspeed: 20s
    blackhole: 1m
    labels:
      service: netbox
      behavior: "http:bruteforce"
      classification:
        - attack.T1110
      spoofable: 0
      confidence: 3
      label: "NetBox Bruteforce"
      remediation: true
    ---
    type: leaky
    name: prplanit/netbox-bf_user-enum
    description: "NetBox user-enumeration brute-force"
    filter: "evt.Meta.log_type == 'netbox_failed_auth'"
    groupby: evt.Meta.source_ip
    distinct: evt.Meta.username
    capacity: 5
    leakspeed: 1m
    blackhole: 1m
    labels:
      service: netbox
      behavior: "http:bruteforce"
      classification:
        - attack.T1589
        - attack.T1110
      spoofable: 0
      confidence: 3
      label: "NetBox User Enumeration"
      remediation: true
