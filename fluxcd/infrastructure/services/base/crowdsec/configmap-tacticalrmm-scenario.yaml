apiVersion: v1
kind: ConfigMap
metadata:
  name: crowdsec-tacticalrmm-scenario
data:
  # TacticalRMM (Django) records a failed login as a DB AuditLog row
  # (AuditLog.audit_user_failed_login → AuditLog.objects.create, with the client IP in
  # debug_info) — there is NO log line/stream to parse, same as Zitadel/NetBird. So detect at
  # the cell-membrane gateway: the Envoy access log (istio-gw acquisition +
  # prplanit/istio-gateway-logs parser) carries direct_remote_ip — the real client, now
  # header-unspoofable after the gateway realip normalization. No app changes.
  #
  # FP-safe by endpoint scoping: POST /v2/checkcreds/ is the login credential check
  # (success = 200 with a token/totp flag). Verified empirically that a 400 there is
  # EXCLUSIVELY an auth failure — bad credentials return 400 notify_error("Bad credentials"),
  # while a malformed/missing body returns 500 and wrong method (GET) returns 405. Bad user and
  # bad password both return the same 400 (no user-enumeration leak). TacticalRMM also self-
  # defends (CheckCredsMin/DayThrottle → 429); this scenario adds fleet-wide banning on top.
  # High value: RMM compromise = control of every managed endpoint. source_ip is the
  # gateway-derived real client (spoofable: 0).
  tacticalrmm-bf.yaml: |
    type: leaky
    name: prplanit/tacticalrmm-bf
    description: "TacticalRMM login brute-force (cell-membrane gateway access log)"
    filter: "evt.Parsed.verb == 'POST' && evt.Parsed.target_fqdn == 'trmm-api.prplanit.com' && evt.Parsed.request matches '^/v2/checkcreds/?$' && evt.Parsed.status == '400'"
    groupby: evt.Meta.source_ip
    capacity: 5
    leakspeed: 20s
    blackhole: 1m
    labels:
      service: tacticalrmm
      behavior: "http:bruteforce"
      classification:
        - attack.T1110
      spoofable: 0
      confidence: 3
      label: "TacticalRMM Login Bruteforce"
      remediation: true
