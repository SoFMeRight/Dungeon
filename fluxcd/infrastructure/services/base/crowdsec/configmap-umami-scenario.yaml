apiVersion: v1
kind: ConfigMap
metadata:
  name: crowdsec-umami-scenario
data:
  # Umami (Next.js) is silent — it emits no per-request/auth log at any level — and its login
  # is a REST endpoint, so detect at the cell-membrane gateway: the Envoy access log (already
  # ingested by the istio-gw acquisition and parsed by prplanit/istio-gateway-logs) carries the
  # real, unspoofable client IP (direct_remote_ip, CF-aware) + method + path + status. No umami
  # changes, no new acquisition/parser.
  #
  # FP-safe by endpoint scoping: POST /api/auth/login is login-ONLY (success = 200). Verified
  # empirically that a 401 there is EXCLUSIVELY an auth failure — bad credentials return 401,
  # while an empty/malformed body returns 400 and wrong method (GET) returns 405. There is no
  # benign 401 on this endpoint. The leaky bucket (5 / 20s) tolerates a human fumbling a
  # password; trusted sources (LAN/WAN) are already whitelisted. source_ip is the
  # gateway-derived real client (spoofable: 0).
  umami-bf.yaml: |
    type: leaky
    name: prplanit/umami-bf
    description: "Umami login brute-force (cell-membrane gateway access log)"
    filter: "evt.Parsed.verb == 'POST' && evt.Parsed.target_fqdn == 'analytics.prplanit.com' && evt.Parsed.request matches '^/api/auth/login/?$' && evt.Parsed.status == '401'"
    groupby: evt.Meta.source_ip
    capacity: 5
    leakspeed: 20s
    blackhole: 1m
    labels:
      service: umami
      behavior: "http:bruteforce"
      classification:
        - attack.T1110
      spoofable: 0
      confidence: 3
      label: "Umami Login Bruteforce"
      remediation: true
