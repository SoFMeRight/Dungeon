apiVersion: v1
kind: ConfigMap
metadata:
  name: crowdsec-acquis-home-assistant
data:
  # Home Assistant auth-failure acquisition. Loki-filtered to the http.ban logger
  # (the auth-failure events) to keep volume low; the `type: home-assistant` label is
  # mapped to evt.Parsed.program by crowdsec's built-in non-syslog parser, so the
  # official crowdsecurity/home-assistant-logs parser + home-assistant-bf scenario fire.
  # url is patched to the real Loki endpoint in the overlay.
  40-home-assistant-loki.yaml: |
    source: loki
    url: PLACEHOLDER_LOKI_URL
    limit: 1000
    query: |
      {service_name="home-assistant"} |= "homeassistant.components.http.ban"
    labels:
      type: home-assistant
    wait_for_ready: 10s
