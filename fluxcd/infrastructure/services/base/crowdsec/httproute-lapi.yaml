---
# The LAPI, reachable by bouncers that are not pods -- pfSense in particular.
#
# Routed through the gateway rather than given its own LoadBalancer so that TLS is
# terminated in front of the LAPI instead of inside it. Setting api.server.tls would have
# forced TLS on EVERY client: the local agent and the cloudflare bouncer both speak
# plaintext to crowdsec:8080 today and would have broken, and their traffic is already
# encrypted by the ambient mesh, so the app-level certificate would have been a second
# layer doing the mesh's job while breaking the clients it was supposed to protect.
#
# This does NOT put the LAPI on the internet. The LAPI registers machines and issues
# decisions -- it is a control plane and must stay internal. xylem carries the
# internal-only *.pcfae.com set and has no pfSense port forward (CLAUDE.md, Gateway
# Architecture), so exposure remains a firewall decision made per gateway IP, and this
# route inherits the same posture as crowdsec.pcfae.com beside it.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: crowdsec-lapi
spec:
  parentRefs:
    - name: PLACEHOLDER_GATEWAY_NAME
      namespace: king-of-red-lions
  hostnames:
    - "PLACEHOLDER_LAPI_HOSTNAME"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        # The existing ClusterIP service — no new service, no StatefulSet change.
        - name: crowdsec
          port: 8080
