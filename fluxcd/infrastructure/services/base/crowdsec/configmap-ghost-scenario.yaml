apiVersion: v1
kind: ConfigMap
metadata:
  name: crowdsec-ghost-scenario
data:
  # Ghost (official image) cannot emit a usable auth log — its stdout carries no client IP
  # and no failed-login message, only status codes. So detect admin brute-force at the
  # cell-membrane gateway instead: the Envoy access log (already ingested by the istio-gw
  # acquisition and parsed by prplanit/istio-gateway-logs) carries the real, unspoofable
  # client IP + method + path + status. No Ghost changes, no new acquisition/parser.
  #
  # FP-safe by endpoint scoping, not by guessing one code: /ghost/api/admin/session is a
  # login-ONLY endpoint (success = 201), so every 4xx on a POST there IS a failed login —
  # 401 wrong password, 404 unknown user (Ghost: "no user with that email address"),
  # 422 malformed. There is no innocent 4xx on this endpoint (unlike 401/403 on real
  # resources). The session *check* is a GET, excluded by the POST gate. The leaky bucket
  # (5 / 20s) tolerates a human fumbling a password; source_ip is the gateway-derived real
  # client (spoofable: 0). Catches both password-guessing (401) and username-spraying (404).
  ghost-bf.yaml: |
    type: leaky
    name: prplanit/ghost-bf
    description: "Ghost admin login brute-force (cell-membrane gateway access log)"
    filter: "evt.Parsed.verb == 'POST' && evt.Parsed.target_fqdn == 'blog.sofmeright.com' && evt.Parsed.request matches '^/ghost/api/admin/session/?$' && evt.Parsed.status in ['401', '404', '422']"
    groupby: evt.Meta.source_ip
    capacity: 5
    leakspeed: 20s
    blackhole: 1m
    labels:
      service: ghost
      behavior: "http:bruteforce"
      classification:
        - attack.T1110
      spoofable: 0
      confidence: 3
      label: "Ghost Admin Bruteforce"
      remediation: true
