apiVersion: v1
kind: ConfigMap
metadata:
  name: crowdsec-cloudflare-bouncer
data:
  # cs-cloudflare-worker-bouncer config template. ${...} are rendered from env by the
  # config-substitution initContainer; account/zones are patched in the overlay.
  crowdsec-cloudflare-worker-bouncer.yaml: |
    crowdsec_config:
      lapi_url: http://crowdsec:8080/
      lapi_key: ${BOUNCER_CLOUDFLARE_LAPI_KEY}
      update_frequency: 10s
      include_scenarios_containing: []
      exclude_scenarios_containing: []
      only_include_decisions_from: ["cscli", "crowdsec"]
    cloudflare_config:
      accounts:
        - id: PLACEHOLDER_CLOUDFLARE_ACCOUNT_ID
          account_name: PLACEHOLDER_CLOUDFLARE_ACCOUNT_NAME
          token: ${CLOUDFLARE_TOKEN}
          ip_list_prefix: crowdsec
          default_action: ban
          total_ip_list_capacity: 5000
          zones: PLACEHOLDER_CLOUDFLARE_ZONES
    log_mode: stdout
    log_level: info
    prometheus:
      enabled: true
      listen_addr: 127.0.0.1
      listen_port: "2112"
