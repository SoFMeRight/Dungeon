apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: crowdsec
  labels:
    app: crowdsec
    component: engine
spec:
  revisionHistoryLimit: 5
  serviceName: crowdsec
  replicas: PLACEHOLDER_REPLICAS
  selector:
    matchLabels:
      app: crowdsec
      component: engine
  template:
    metadata:
      labels:
        app: crowdsec
        component: engine
    spec:
      serviceAccountName: crowdsec
      # Root-required: the entrypoint rsyncs default config into the image-owned /etc/crowdsec at
      # startup ("mkstemp /etc/crowdsec/.simulation.yaml: Permission denied" as non-root). Partial:
      # drop ALL + seccomp, stays root.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # A fresh PVC mounts EMPTY over the image's /etc/crowdsec, which ships the default
        # config, hub index and collection layout. Seed it once; the marker makes every
        # later start a no-op so operator edits and the registered CAPI credentials are
        # never overwritten.
        - name: seed-config
          image: PLACEHOLDER_CROWDSEC_IMAGE
          command:
            - /bin/sh
            - -ec
            - |
              if [ ! -f /seed/.seeded ]; then
                cp -a /etc/crowdsec/. /seed/
                touch /seed/.seeded
                echo "seeded /etc/crowdsec"
              else
                echo "already seeded; config and credentials left untouched"
              fi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: PLACEHOLDER_NAMESPACE-crowdsec-config
              mountPath: /seed
      containers:
        - name: crowdsec
          image: PLACEHOLDER_CROWDSEC_IMAGE
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: api
              containerPort: 8080
              protocol: TCP
            - name: prometheus
              containerPort: 6060
              protocol: TCP
          env:
            - name: COLLECTIONS
              value: "crowdsecurity/traefik crowdsecurity/http-cve crowdsecurity/whitelist-good-actors crowdsecurity/iptables crowdsecurity/linux crowdsecurity/nginx crowdsecurity/sshd"
            - name: GID
              value: "1000"
            - name: CUSTOM_HOSTNAME
              value: PLACEHOLDER_HOSTNAME
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
          volumeMounts:
            - name: PLACEHOLDER_NAMESPACE-crowdsec-data
              mountPath: /var/lib/crowdsec/data
            # /etc/crowdsec must PERSIST. The entrypoint decides whether to register a
            # new CAPI machine by checking whether config.yaml names a credentials_path
            # -- NOT whether the credentials file exists. config.yaml lived on the image's
            # ephemeral filesystem, so every restart reset it, re-ran `cscli capi
            # register`, and minted a new machine id that the console lists as another
            # security engine. One per restart, forever.
            - name: PLACEHOLDER_NAMESPACE-crowdsec-config
              mountPath: /etc/crowdsec
            - name: acquis-nginx
              mountPath: /etc/crowdsec/acquis.d/10-nginx-loki.yaml
              subPath: 10-nginx-loki.yaml
            - name: acquis-bitwarden
              mountPath: /etc/crowdsec/acquis.d/20-bitwarden-loki.yaml
              subPath: 20-bitwarden-loki.yaml
            - name: whitelist
              mountPath: /etc/crowdsec/parsers/s02-enrich/whitelists.yaml
              subPath: whitelists.yaml
            - name: bitwarden-parser
              mountPath: /etc/crowdsec/parsers/s01-parse/prplanit/bitwarden.yaml
              subPath: bitwarden.yaml
            - name: bitwarden-scenario
              mountPath: /etc/crowdsec/scenarios/prplanit/bitwarden-bf.yaml
              subPath: bitwarden-bf.yaml
          resources:
            requests:
              cpu: PLACEHOLDER_CPU_REQUEST
              memory: PLACEHOLDER_MEMORY_REQUEST
            limits:
              cpu: PLACEHOLDER_CPU_LIMIT
              memory: PLACEHOLDER_MEMORY_LIMIT
      volumes:
        - name: acquis-nginx
          configMap:
            name: crowdsec-acquis-nginx
        - name: acquis-bitwarden
          configMap:
            name: crowdsec-acquis-bitwarden
        - name: whitelist
          configMap:
            name: crowdsec-whitelist
        - name: bitwarden-parser
          configMap:
            name: crowdsec-bitwarden-parser
        - name: bitwarden-scenario
          configMap:
            name: crowdsec-bitwarden-scenario
  volumeClaimTemplates:
    - metadata:
        name: PLACEHOLDER_NAMESPACE-crowdsec-config
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: PLACEHOLDER_STORAGE_CLASS
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: PLACEHOLDER_NAMESPACE-crowdsec-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: PLACEHOLDER_STORAGE_CLASS
        resources:
          requests:
            storage: PLACEHOLDER_STORAGE_SIZE
