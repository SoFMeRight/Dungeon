apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: crowdsec
  labels:
    app: crowdsec
    component: engine
spec:
  revisionHistoryLimit: 5
  serviceName: crowdsec
  replicas: PLACEHOLDER_REPLICAS
  selector:
    matchLabels:
      app: crowdsec
      component: engine
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "6060"
        prometheus.io/path: /metrics
      labels:
        app: crowdsec
        component: engine
        # gates allow-gateway-ingress-xylem and allow-prometheus-scrape; without them
        # the mesh denies and the gateway returns 503
        policy.prplanit.com/ingress: "true"
        policy.prplanit.com/metrics: "true"
    spec:
      serviceAccountName: crowdsec
      # Root-required: the entrypoint rsyncs default config into the image-owned /etc/crowdsec at
      # startup ("mkstemp /etc/crowdsec/.simulation.yaml: Permission denied" as non-root). Partial:
      # drop ALL + seccomp, stays root.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: crowdsec
          image: PLACEHOLDER_CROWDSEC_IMAGE
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: api
              containerPort: 8080
              protocol: TCP
            - name: prometheus
              containerPort: 6060
              protocol: TCP
          env:
            - name: COLLECTIONS
              value: >-
                crowdsecurity/traefik crowdsecurity/http-cve
                crowdsecurity/whitelist-good-actors crowdsecurity/iptables
                crowdsecurity/linux crowdsecurity/nginx crowdsecurity/sshd
                crowdsecurity/home-assistant crowdsecurity/nextcloud
            - name: GID
              value: "1000"
            - name: CUSTOM_HOSTNAME
              value: PLACEHOLDER_HOSTNAME
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
          volumeMounts:
            - name: PLACEHOLDER_NAMESPACE-crowdsec-data
              mountPath: /var/lib/crowdsec/data
            # /etc/crowdsec must PERSIST. The image ships its defaults in
            # /staging/etc/crowdsec and the entrypoint rsyncs them in with
            # --ignore-existing, so an empty PVC is populated on first boot and never
            # overwritten afterwards -- no seeding of our own is needed or wanted. The entrypoint decides whether to register a
            # new CAPI machine by checking whether config.yaml names a credentials_path
            # -- NOT whether the credentials file exists. config.yaml lived on the image's
            # ephemeral filesystem, so every restart reset it, re-ran `cscli capi
            # register`, and minted a new machine id that the console lists as another
            # security engine. One per restart, forever.
            - name: PLACEHOLDER_NAMESPACE-crowdsec-config
              mountPath: /etc/crowdsec
            - name: acquis-nginx
              mountPath: /etc/crowdsec/acquis.d/10-nginx-loki.yaml
              subPath: 10-nginx-loki.yaml
            - name: acquis-bitwarden
              mountPath: /etc/crowdsec/acquis.d/20-bitwarden-loki.yaml
              subPath: 20-bitwarden-loki.yaml
            - name: whitelist
              mountPath: /etc/crowdsec/parsers/s02-enrich/whitelists.yaml
              subPath: whitelists.yaml
            - name: bitwarden-parser
              mountPath: /etc/crowdsec/parsers/s01-parse/prplanit/bitwarden.yaml
              subPath: bitwarden.yaml
            - name: bitwarden-scenario
              mountPath: /etc/crowdsec/scenarios/prplanit/bitwarden-bf.yaml
              subPath: bitwarden-bf.yaml
            - name: acquis-istio
              mountPath: /etc/crowdsec/acquis.d/30-istio-loki.yaml
              subPath: 30-istio-loki.yaml
            - name: istio-parser
              mountPath: /etc/crowdsec/parsers/s01-parse/prplanit/istio-gateway.yaml
              subPath: istio-gateway.yaml
            # Home Assistant auth-failure logs. No custom parser/shim: the built-in
            # non-syslog parser sets program from the `type` label, so the official
            # crowdsecurity/home-assistant-logs parser (gates on program) fires natively.
            - name: acquis-home-assistant
              mountPath: /etc/crowdsec/acquis.d/40-home-assistant-loki.yaml
              subPath: 40-home-assistant-loki.yaml
            # Nextcloud app auth logs. Nextcloud emits clean nextcloud.log JSON to stderr
            # (log_type=errorlog + apache ErrorLogFormat "%M"), so the official
            # crowdsecurity/nextcloud-logs parser (JsonExtract on the message) fires natively.
            - name: acquis-nextcloud
              mountPath: /etc/crowdsec/acquis.d/50-nextcloud-loki.yaml
              subPath: 50-nextcloud-loki.yaml
            # Mealie: real app-log auth-failure parsing (vendored Jgigantino31/mealie).
            # Mealie logs "Incorrect username or password from <real client IP>" to stdout.
            - name: acquis-mealie
              mountPath: /etc/crowdsec/acquis.d/60-mealie-loki.yaml
              subPath: 60-mealie-loki.yaml
            - name: mealie-parser
              mountPath: /etc/crowdsec/parsers/s01-parse/prplanit/mealie.yaml
              subPath: mealie.yaml
            - name: mealie-scenario
              mountPath: /etc/crowdsec/scenarios/prplanit/mealie-bf.yaml
              subPath: mealie-bf.yaml
            # Jellyfin: real app-log auth-failure parsing (vendored LePresidente/jellyfin).
            # KnownProxies set on jellyfin so it logs the real client IP.
            - name: acquis-jellyfin
              mountPath: /etc/crowdsec/acquis.d/70-jellyfin-loki.yaml
              subPath: 70-jellyfin-loki.yaml
            - name: jellyfin-parser
              mountPath: /etc/crowdsec/parsers/s01-parse/prplanit/jellyfin.yaml
              subPath: jellyfin.yaml
            - name: jellyfin-scenario
              mountPath: /etc/crowdsec/scenarios/prplanit/jellyfin-bf.yaml
              subPath: jellyfin-bf.yaml
            # Vaultwarden: real app-log auth-failure parsing (vendored Dominic-Wagner/vaultwarden).
            # IP_HEADER=X-Forwarded-For set so it logs the real client IP.
            - name: acquis-vaultwarden
              mountPath: /etc/crowdsec/acquis.d/80-vaultwarden-loki.yaml
              subPath: 80-vaultwarden-loki.yaml
            - name: vaultwarden-parser
              mountPath: /etc/crowdsec/parsers/s01-parse/prplanit/vaultwarden.yaml
              subPath: vaultwarden.yaml
            - name: vaultwarden-scenario
              mountPath: /etc/crowdsec/scenarios/prplanit/vaultwarden-bf.yaml
              subPath: vaultwarden-bf.yaml
            # GitLab: real app-log auth-failure parsing (vendored timokoessler/gitlab) off the
            # webservice production_json.log. GitLab logs the real client IP (XFF) natively.
            - name: acquis-gitlab
              mountPath: /etc/crowdsec/acquis.d/90-gitlab-loki.yaml
              subPath: 90-gitlab-loki.yaml
            - name: gitlab-parser
              mountPath: /etc/crowdsec/parsers/s01-parse/prplanit/gitlab.yaml
              subPath: gitlab.yaml
            - name: gitlab-scenario
              mountPath: /etc/crowdsec/scenarios/prplanit/gitlab-bf.yaml
              subPath: gitlab-bf.yaml
            # NetBox: real app-log auth-failure parsing (custom parser; netbox.auth.login signal).
            # NetBox logs the real client IP (HTTP_CLIENT_IP_HEADERS incl. X-Forwarded-For).
            - name: acquis-netbox
              mountPath: /etc/crowdsec/acquis.d/95-netbox-loki.yaml
              subPath: 95-netbox-loki.yaml
            - name: netbox-parser
              mountPath: /etc/crowdsec/parsers/s01-parse/prplanit/netbox.yaml
              subPath: netbox.yaml
            - name: netbox-scenario
              mountPath: /etc/crowdsec/scenarios/prplanit/netbox-bf.yaml
              subPath: netbox-bf.yaml
            # Joplin: real app-log auth-failure parsing (custom parser; login/api-session 403).
            # Real client IP via X-Real-Ip injected at the xylem gateway (envoyfilter-joplin-realip-xylem).
            - name: acquis-joplin
              mountPath: /etc/crowdsec/acquis.d/96-joplin-loki.yaml
              subPath: 96-joplin-loki.yaml
            - name: joplin-parser
              mountPath: /etc/crowdsec/parsers/s01-parse/prplanit/joplin.yaml
              subPath: joplin.yaml
            - name: joplin-scenario
              mountPath: /etc/crowdsec/scenarios/prplanit/joplin-bf.yaml
              subPath: joplin-bf.yaml
            # osTicket: real app-log auth-failure parsing (custom parser; JSON login_failed line).
            # Real client IP via X-Real-Ip (envoyfilter-osticket-realip-* + TRUSTED_PROXIES env).
            - name: acquis-osticket
              mountPath: /etc/crowdsec/acquis.d/97-osticket-loki.yaml
              subPath: 97-osticket-loki.yaml
            - name: osticket-parser
              mountPath: /etc/crowdsec/parsers/s01-parse/prplanit/osticket.yaml
              subPath: osticket.yaml
            - name: osticket-scenario
              mountPath: /etc/crowdsec/scenarios/prplanit/osticket-bf.yaml
              subPath: osticket-bf.yaml
            # Ghost: gateway-log brute-force detection (scenario only; reuses the istio-gw
            # acquisition + prplanit/istio-gateway-logs parser — Ghost can't self-report auth).
            - name: ghost-scenario
              mountPath: /etc/crowdsec/scenarios/prplanit/ghost-bf.yaml
              subPath: ghost-bf.yaml
            # ntfy: gateway-log brute-force detection (scenario only; reuses the istio-gw
            # acquisition + prplanit/istio-gateway-logs parser — ntfy's own visitor_ip is not
            # CF-aware, so the gateway is the authority on the real client).
            - name: ntfy-scenario
              mountPath: /etc/crowdsec/scenarios/prplanit/ntfy-bf.yaml
              subPath: ntfy-bf.yaml
            # Uptime-Kuma: real app-log auth-failure parsing (Trust Proxy → real client IP).
            - name: acquis-uptime-kuma
              mountPath: /etc/crowdsec/acquis.d/98-uptime-kuma-loki.yaml
              subPath: 98-uptime-kuma-loki.yaml
            - name: uptime-kuma-parser
              mountPath: /etc/crowdsec/parsers/s01-parse/prplanit/uptime-kuma.yaml
              subPath: uptime-kuma.yaml
            - name: uptime-kuma-scenario
              mountPath: /etc/crowdsec/scenarios/prplanit/uptime-kuma-bf.yaml
              subPath: uptime-kuma-bf.yaml
          resources:
            requests:
              cpu: PLACEHOLDER_CPU_REQUEST
              memory: PLACEHOLDER_MEMORY_REQUEST
            limits:
              cpu: PLACEHOLDER_CPU_LIMIT
              memory: PLACEHOLDER_MEMORY_LIMIT
      volumes:
        - name: acquis-nginx
          configMap:
            name: crowdsec-acquis-nginx
        - name: acquis-bitwarden
          configMap:
            name: crowdsec-acquis-bitwarden
        - name: whitelist
          configMap:
            name: crowdsec-whitelist
        - name: bitwarden-parser
          configMap:
            name: crowdsec-bitwarden-parser
        - name: bitwarden-scenario
          configMap:
            name: crowdsec-bitwarden-scenario
        - name: acquis-istio
          configMap:
            name: crowdsec-acquis-istio
        - name: istio-parser
          configMap:
            name: crowdsec-istio-parser
        - name: acquis-home-assistant
          configMap:
            name: crowdsec-acquis-home-assistant
        - name: acquis-nextcloud
          configMap:
            name: crowdsec-acquis-nextcloud
        - name: acquis-mealie
          configMap:
            name: crowdsec-acquis-mealie
        - name: mealie-parser
          configMap:
            name: crowdsec-mealie-parser
        - name: mealie-scenario
          configMap:
            name: crowdsec-mealie-scenario
        - name: acquis-jellyfin
          configMap:
            name: crowdsec-acquis-jellyfin
        - name: jellyfin-parser
          configMap:
            name: crowdsec-jellyfin-parser
        - name: jellyfin-scenario
          configMap:
            name: crowdsec-jellyfin-scenario
        - name: acquis-vaultwarden
          configMap:
            name: crowdsec-acquis-vaultwarden
        - name: vaultwarden-parser
          configMap:
            name: crowdsec-vaultwarden-parser
        - name: vaultwarden-scenario
          configMap:
            name: crowdsec-vaultwarden-scenario
        - name: acquis-gitlab
          configMap:
            name: crowdsec-acquis-gitlab
        - name: gitlab-parser
          configMap:
            name: crowdsec-gitlab-parser
        - name: gitlab-scenario
          configMap:
            name: crowdsec-gitlab-scenario
        - name: acquis-netbox
          configMap:
            name: crowdsec-acquis-netbox
        - name: netbox-parser
          configMap:
            name: crowdsec-netbox-parser
        - name: netbox-scenario
          configMap:
            name: crowdsec-netbox-scenario
        - name: acquis-joplin
          configMap:
            name: crowdsec-acquis-joplin
        - name: joplin-parser
          configMap:
            name: crowdsec-joplin-parser
        - name: joplin-scenario
          configMap:
            name: crowdsec-joplin-scenario
        - name: acquis-osticket
          configMap:
            name: crowdsec-acquis-osticket
        - name: osticket-parser
          configMap:
            name: crowdsec-osticket-parser
        - name: osticket-scenario
          configMap:
            name: crowdsec-osticket-scenario
        - name: ghost-scenario
          configMap:
            name: crowdsec-ghost-scenario
        - name: ntfy-scenario
          configMap:
            name: crowdsec-ntfy-scenario
        - name: acquis-uptime-kuma
          configMap:
            name: crowdsec-acquis-uptime-kuma
        - name: uptime-kuma-parser
          configMap:
            name: crowdsec-uptime-kuma-parser
        - name: uptime-kuma-scenario
          configMap:
            name: crowdsec-uptime-kuma-scenario
  volumeClaimTemplates:
    - metadata:
        name: PLACEHOLDER_NAMESPACE-crowdsec-config
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: PLACEHOLDER_STORAGE_CLASS
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: PLACEHOLDER_NAMESPACE-crowdsec-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: PLACEHOLDER_STORAGE_CLASS
        resources:
          requests:
            storage: PLACEHOLDER_STORAGE_SIZE
