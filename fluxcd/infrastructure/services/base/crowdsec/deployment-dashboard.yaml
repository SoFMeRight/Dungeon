apiVersion: apps/v1
kind: Deployment
metadata:
  name: crowdsec-dashboard
  labels:
    app: crowdsec-dashboard
    component: dashboard
spec:
  revisionHistoryLimit: 5
  replicas: PLACEHOLDER_REPLICAS
  selector:
    matchLabels:
      app: crowdsec-dashboard
      component: dashboard
  template:
    metadata:
      labels:
        app: crowdsec-dashboard
        component: dashboard
    spec:
      serviceAccountName: crowdsec-dashboard
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: PLACEHOLDER_DASHBOARD_IMAGE
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: MB_DB_FILE
              value: /data/metabase.db
            - name: MGID
              value: "1000"
          volumeMounts:
            - name: dashboard-data
              mountPath: /data
            - name: metabase-data
              mountPath: /metabase-data
          resources:
            requests:
              cpu: PLACEHOLDER_CPU_REQUEST
              memory: PLACEHOLDER_MEMORY_REQUEST
            limits:
              cpu: PLACEHOLDER_CPU_LIMIT
              memory: PLACEHOLDER_MEMORY_LIMIT
      volumes:
        - name: dashboard-data
          persistentVolumeClaim:
            claimName: crowdsec-dashboard-data
        - name: metabase-data
          persistentVolumeClaim:
            claimName: crowdsec-metabase-data
