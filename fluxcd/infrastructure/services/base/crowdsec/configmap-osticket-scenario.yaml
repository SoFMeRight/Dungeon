apiVersion: v1
kind: ConfigMap
metadata:
  name: crowdsec-osticket-scenario
data:
  # Custom scenarios (no hub collection). Brute-force + user-enumeration leaky buckets over
  # prplanit/osticket-logs, grouped by the real client source_ip. spoofable: 0 because X-Real-Ip
  # is gateway-set (envoyfilter-osticket-realip-* replaces it from the downstream address).
  osticket-bf.yaml: |
    type: leaky
    name: prplanit/osticket-bf
    description: "osTicket login brute-force"
    filter: "evt.Meta.log_type == 'osticket_failed_auth'"
    groupby: evt.Meta.source_ip
    capacity: 5
    leakspeed: 20s
    blackhole: 1m
    labels:
      service: osticket
      behavior: "http:bruteforce"
      classification:
        - attack.T1110
      spoofable: 0
      confidence: 3
      label: "osTicket Bruteforce"
      remediation: true
    ---
    type: leaky
    name: prplanit/osticket-bf_user-enum
    description: "osTicket user-enumeration brute-force"
    filter: "evt.Meta.log_type == 'osticket_failed_auth'"
    groupby: evt.Meta.source_ip
    distinct: evt.Meta.username
    capacity: 5
    leakspeed: 1m
    blackhole: 1m
    labels:
      service: osticket
      behavior: "http:bruteforce"
      classification:
        - attack.T1589
        - attack.T1110
      spoofable: 0
      confidence: 3
      label: "osTicket User Enumeration"
      remediation: true
