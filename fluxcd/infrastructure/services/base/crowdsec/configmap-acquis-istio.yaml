apiVersion: v1
kind: ConfigMap
metadata:
  name: crowdsec-acquis-istio
data:
  # Public-edge detection: the cell-membrane, xylem and phloem istio gateways front public
  # traffic.
  # Pull their Envoy access logs from Loki (filtered to request lines) and tag them
  # type=istio-gw so prplanit/istio-gateway-logs parses them.
  #
  # Both gateways must emit the JSON access-log provider for this to parse — the parser
  # reads fields with JsonExtract, so a gateway left on istio's stock text format is
  # acquired and then silently unparsed.
  30-istio-loki.yaml: |
    source: loki
    url: http://loki.gossip-stone.svc.cluster.local:3100
    limit: 1000
    query: |
      {namespace=~"arylls-lookout|prelude-of-light|pedestal-of-time", pod=~"(cell-membrane|xylem|phloem)-gateway-istio-.*"} |= "HTTP/"
    labels:
      type: istio-gw
    wait_for_ready: 10s
