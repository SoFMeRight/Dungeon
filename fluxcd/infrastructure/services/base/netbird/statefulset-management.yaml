apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: netbird-management
spec:
  revisionHistoryLimit: 5
  serviceName: netbird-management
  # NetBird OSS Management is a stateful singleton — active-active HA (shared server
  # key + cross-instance peer coordination) is an Enterprise-only feature. Running >1
  # replica gives each pod its own WireGuard server key, so load-balanced gRPC calls
  # (GetServerKey on one pod, Login on another) fail to decrypt. Keep at 1.
  replicas: 1
  selector:
    matchLabels:
      app: netbird
      component: management
  template:
    metadata:
      labels:
        app: netbird
        component: management
        policy.prplanit.com/cap.oidc: "true"
    spec:
      serviceAccountName: netbird-management
      # Non-root: fsGroup 65532 makes the /var/lib/netbird PVC and the generated-config
      # emptyDir writable for uid 65532; --port 10000 moves the API off the privileged :80.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: config-generator
          image: docker.io/busybox:1.38.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command: ["/bin/sh", "-c"]
          args:
            - |
              cat > /etc/netbird/config.json <<EOF
              {
                "Stuns": [
                  {
                    "Proto": "udp",
                    "URI": "stun:turn.prplanit.com:3478",
                    "Username": "",
                    "Password": ""
                  }
                ],
                "TURNConfig": {
                  "TimeBasedCredentials": false,
                  "CredentialsTTL": "12h0m0s",
                  "Secret": "secret",
                  "Turns": [
                    {
                      "Proto": "udp",
                      "URI": "turn:turn.prplanit.com:3478",
                      "Username": "${COTURN_USER}",
                      "Password": "${COTURN_PASS}"
                    }
                  ]
                },
                "Relay": {
                  "Addresses": ["rels://netbird.prplanit.com:443"],
                  "CredentialsTTL": "24h0m0s",
                  "Secret": "${NETBIRD_RELAY_AUTH_SECRET}"
                },
                "Signal": {
                  "Proto": "https",
                  "URI": "netbird.prplanit.com:443",
                  "Username": "",
                  "Password": ""
                },
                "Datadir": "/var/lib/netbird/",
                "DataStoreEncryptionKey": "${DATASTORE_ENCRYPTION_KEY}",
                "HttpConfig": {
                  "LetsEncryptDomain": "",
                  "CertFile": "",
                  "CertKey": "",
                  "AuthAudience": "${AUTH_CLIENT_ID}",
                  "AuthIssuer": "https://sso.prplanit.com",
                  "AuthUserIDClaim": "",
                  "AuthKeysLocation": "https://sso.prplanit.com/oauth/v2/keys",
                  "OIDCConfigEndpoint": "https://sso.prplanit.com/.well-known/openid-configuration",
                  "IdpSignKeyRefreshEnabled": true,
                  "ExtraAuthAudience": ""
                },
                "IdpManagerConfig": {
                  "ManagerType": "zitadel",
                  "ClientConfig": {
                    "Issuer": "https://sso.prplanit.com",
                    "TokenEndpoint": "https://sso.prplanit.com/oauth/v2/token",
                    "ClientID": "${IDP_MGMT_CLIENT_ID}",
                    "ClientSecret": "${AUTH_CLIENT_SECRET}",
                    "GrantType": "client_credentials"
                  },
                  "ExtraConfig": {
                    "ManagementEndpoint": "https://sso.prplanit.com/management/v1"
                  },
                  "Auth0ClientCredentials": null,
                  "AzureClientCredentials": null,
                  "KeycloakClientCredentials": null,
                  "ZitadelClientCredentials": null
                },
                "DeviceAuthorizationFlow": {
                  "Provider": "hosted",
                  "ProviderConfig": {
                    "ClientID": "${AUTH_CLIENT_ID}",
                    "ClientSecret": "",
                    "Domain": "sso.prplanit.com",
                    "Audience": "${AUTH_CLIENT_ID}",
                    "TokenEndpoint": "https://sso.prplanit.com/oauth/v2/token",
                    "DeviceAuthEndpoint": "https://sso.prplanit.com/oauth/v2/device_authorization",
                    "AuthorizationEndpoint": "",
                    "Scope": "openid",
                    "UseIDToken": false,
                    "RedirectURLs": null
                  }
                },
                "PKCEAuthorizationFlow": {
                  "ProviderConfig": {
                    "ClientID": "${AUTH_CLIENT_ID}",
                    "ClientSecret": "",
                    "Domain": "",
                    "Audience": "${AUTH_CLIENT_ID}",
                    "TokenEndpoint": "https://sso.prplanit.com/oauth/v2/token",
                    "DeviceAuthEndpoint": "",
                    "AuthorizationEndpoint": "https://sso.prplanit.com/oauth/v2/authorize",
                    "Scope": "openid profile email offline_access api",
                    "UseIDToken": false,
                    "RedirectURLs": [
                      "http://localhost:53000/",
                      "http://localhost:54000/",
                      "https://netbird.prplanit.com/auth",
                      "https://netbird.prplanit.com/silent-auth"
                    ]
                  }
                },
                "StoreConfig": {
                  "Engine": "postgres"
                },
                "ReverseProxy": {
                  "TrustedHTTPProxies": [],
                  "TrustedHTTPProxiesCount": 0,
                  "TrustedPeers": ["0.0.0.0/0"]
                }
              }
              EOF

              # Substitute environment variables
              sed -i "s|\${AUTH_CLIENT_ID}|${AUTH_CLIENT_ID}|g" /etc/netbird/config.json
              sed -i "s|\${AUTH_CLIENT_SECRET}|${AUTH_CLIENT_SECRET}|g" /etc/netbird/config.json
              sed -i "s|\${IDP_MGMT_CLIENT_ID}|${IDP_MGMT_CLIENT_ID}|g" /etc/netbird/config.json
              sed -i "s|\${COTURN_USER}|${COTURN_USER}|g" /etc/netbird/config.json
              sed -i "s|\${COTURN_PASS}|${COTURN_PASS}|g" /etc/netbird/config.json
              sed -i "s|\${NETBIRD_RELAY_AUTH_SECRET}|${NETBIRD_RELAY_AUTH_SECRET}|g" /etc/netbird/config.json
              sed -i "s|\${DATASTORE_ENCRYPTION_KEY}|${DATASTORE_ENCRYPTION_KEY}|g" /etc/netbird/config.json

              echo "Config generated successfully"
              ls -la /etc/netbird/
          env:
            - name: AUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: netbird-secrets
                  key: AUTH_CLIENT_ID
            - name: AUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: netbird-secrets
                  key: AUTH_CLIENT_SECRET
            - name: IDP_MGMT_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: netbird-secrets
                  key: IDP_MGMT_CLIENT_ID
            - name: COTURN_USER
              valueFrom:
                secretKeyRef:
                  name: netbird-secrets
                  key: COTURN_USER
            - name: COTURN_PASS
              valueFrom:
                secretKeyRef:
                  name: netbird-secrets
                  key: COTURN_PASS
            - name: NETBIRD_RELAY_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: netbird-secrets
                  key: NETBIRD_RELAY_AUTH_SECRET
            - name: DATASTORE_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: netbird-secrets
                  key: DATASTORE_ENCRYPTION_KEY
          volumeMounts:
            - name: generated-config
              mountPath: /etc/netbird
      containers:
        - name: management
          image: PLACEHOLDER_IMAGE
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          args:
            - --config
            - /etc/netbird/config.json
            - --port
            - "10000"
            - --log-file
            - console
          ports:
            - containerPort: 10000
              name: http
          env:
            - name: NETBIRD_STORE_ENGINE
              value: postgres
            - name: NETBIRD_STORE_ENGINE_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: netbird-secrets
                  key: POSTGRES_DSN
            - name: NETBIRD_MGMT_IDP
              value: zitadel
            - name: NETBIRD_METRICS_INTERVAL_IN_SECONDS
              value: "43200"
            # netbird's own default (1ms). Set explicitly so the network-map controller
            # doesn't parse an empty string on boot and log a strconv.Atoi warning.
            - name: NB_PEER_UPDATE_INTERVAL_MS
              value: "1"
            - name: NETBIRD_IDP_MGMT_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: netbird-secrets
                  key: AUTH_CLIENT_ID
            - name: NETBIRD_IDP_MGMT_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: netbird-secrets
                  key: AUTH_CLIENT_SECRET
          volumeMounts:
            - name: management-data
              mountPath: /var/lib/netbird
            - name: generated-config
              mountPath: /etc/netbird
          resources:
            # Single-replica NetBird Management (OSS isn't HA) carries all peer sync +
            # dashboard + IdP-sync load. The old 40Mi/10m limits (survivable when split
            # across 3 replicas) OOMKill and CPU-throttle one instance — throttling made
            # outbound calls (GitHub version check, IdP) time out and the whole thing lag.
            requests:
              memory: "128Mi"
              cpu: "10m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
      volumes:
        - name: generated-config
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: management-data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: PLACEHOLDER_STORAGE_CLASS
        resources:
          requests:
            storage: 5Gi
