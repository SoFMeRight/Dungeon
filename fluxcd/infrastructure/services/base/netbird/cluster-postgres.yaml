apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: netbird-postgres
spec:
  # Shutdown has to fit the node's grace budget: 150s total, 30s reserved for
  # critical pods, so 120s for ordinary ones. Postgres does not checkpoint until
  # the smart phase stops waiting for clients to disconnect, so a long smart
  # timeout means the SIGKILL lands before anything is flushed. Short smart, then
  # fast shutdown does the checkpoint well inside the remaining budget.
  smartShutdownTimeout: 10
  stopDelay: 60
  # Requests lift this out of BestEffort so the kubelet does not reclaim the database
  # first under node pressure. Sized from observed use (~126Mi resident): memory is what
  # drives eviction, so the request carries the headroom.
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "768Mi"
      cpu: "1000m"

  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:16.15

  enableSuperuserAccess: false
  enablePDB: true

  affinity:
    podAntiAffinityType: required

  bootstrap:
    initdb:
      database: netbird
      owner: netbird
      encoding: UTF8
      localeCollate: C
      localeCType: C
      secret:
        name: netbird-secrets

  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: 256MB
      effective_cache_size: 1GB
      maintenance_work_mem: 64MB
      checkpoint_completion_target: "0.9"
      wal_buffers: 16MB
      default_statistics_target: "100"
      random_page_cost: "1.1"
      effective_io_concurrency: "200"
      work_mem: 2MB
      min_wal_size: 1GB
      max_wal_size: 4GB
      max_slot_wal_keep_size: "1600MB"

  storage:
    size: 20Gi
    storageClass: PLACEHOLDER_STORAGE_CLASS

  monitoring:
    enablePodMonitor: true
  backup:
    barmanObjectStore:
      s3Credentials:
        accessKeyId:
          name: netbird-postgres-backup-s3
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: netbird-postgres-backup-s3
          key: SECRET_ACCESS_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
    retentionPolicy: "30d"
