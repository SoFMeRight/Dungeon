apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: netbird-postgres
spec:
  # Requests lift this out of BestEffort so the kubelet does not reclaim the database
  # first under node pressure. Sized from observed use (~126Mi resident): memory is what
  # drives eviction, so the request carries the headroom.
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "768Mi"
      cpu: "1000m"

  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:16.1

  enableSuperuserAccess: false
  enablePDB: true

  affinity:
    podAntiAffinityType: required

  bootstrap:
    initdb:
      database: netbird
      owner: netbird
      encoding: UTF8
      localeCollate: C
      localeCType: C
      secret:
        name: netbird-secrets

  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: 256MB
      effective_cache_size: 1GB
      maintenance_work_mem: 64MB
      checkpoint_completion_target: "0.9"
      wal_buffers: 16MB
      default_statistics_target: "100"
      random_page_cost: "1.1"
      effective_io_concurrency: "200"
      work_mem: 2MB
      min_wal_size: 1GB
      max_wal_size: 4GB
      max_slot_wal_keep_size: "1600MB"

  storage:
    size: 20Gi
    storageClass: PLACEHOLDER_STORAGE_CLASS

  monitoring:
    enablePodMonitor: true
