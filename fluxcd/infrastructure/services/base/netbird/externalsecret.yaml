apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbird-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-netbird
    kind: SecretStore
  target:
    name: netbird-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # username/password: netbird-postgres's initdb owner (CNPG bootstrap secret).
        username: "{{ .postgresUser }}"
        password: "{{ .postgresPassword }}"
        POSTGRES_DSN: "postgresql://{{ .postgresUser }}:{{ .postgresPassword }}@netbird-postgres-rw:5432/netbird?sslmode=disable"
        # The dashboard's OIDC client: public (PKCE), so it has no secret.
        AUTH_CLIENT_ID: "{{ .oidcClientId }}"
        # Zitadel's netbird machine user, which management's IdP manager signs in as.
        # Management only: never give it to the dashboard, which publishes its settings.
        IDP_MGMT_CLIENT_ID: "{{ .zitadelClientId }}"
        IDP_MGMT_CLIENT_SECRET: "{{ .zitadelClientSecret }}"
        NETBIRD_RELAY_AUTH_SECRET: "{{ .relayAuthSecret }}"
        DATASTORE_ENCRYPTION_KEY: "{{ .datastoreEncryptionKey }}"
  data:
    - secretKey: postgresUser
      remoteRef:
        key: apps/netbird/postgres
        property: USER
    - secretKey: postgresPassword
      remoteRef:
        key: apps/netbird/postgres
        property: PASSWORD
    - secretKey: oidcClientId
      remoteRef:
        key: apps/netbird/oidc
        property: CLIENT_ID
    - secretKey: zitadelClientId
      remoteRef:
        key: apps/netbird/zitadel
        property: CLIENT_ID
    - secretKey: zitadelClientSecret
      remoteRef:
        key: apps/netbird/zitadel
        property: CLIENT_SECRET
    - secretKey: relayAuthSecret
      remoteRef:
        key: apps/netbird/app
        property: RELAY_AUTH_SECRET
    - secretKey: datastoreEncryptionKey
      remoteRef:
        key: apps/netbird/app
        property: DATASTORE_ENCRYPTION_KEY
