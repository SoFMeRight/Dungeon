apiVersion: v1
kind: Service
metadata:
  name: netbird-signal
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 10000
      name: http
      # Signal serves the gRPC SignalExchange service; h2c so istio speaks HTTP/2 upstream.
      appProtocol: kubernetes.io/h2c
  selector:
    app: netbird
    component: signal
