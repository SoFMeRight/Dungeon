apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: netbird-signal
spec:
  revisionHistoryLimit: 5
  serviceName: netbird-signal
  # NetBird OSS Signal is a stateful singleton (peer-relay streams are per-instance);
  # active-active HA is Enterprise-only. Keep at 1.
  replicas: 1
  selector:
    matchLabels:
      app: netbird
      component: signal
  template:
    metadata:
      labels:
        app: netbird
        component: signal
    spec:
      serviceAccountName: netbird-signal
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: signal
          image: PLACEHOLDER_IMAGE
          # Listen on an unprivileged port so the process runs non-root (it can't bind
          # :80); the Service remaps :80 -> :10000, so routing is unchanged. Log to
          # stdout so a read-only root filesystem needs no /var/log write.
          args: ["run", "--port", "10000", "--log-file", "console"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 10000
              name: http
          volumeMounts:
            - name: signal-data
              mountPath: /var/lib/netbird
          resources:
            # Single-replica Signal is light (no peer-state) but signaling spikes during
            # mass peer reconnects; the old 16Mi/10m could OOM/throttle under a storm.
            # Modest requests, generous burst ceiling (lighter than Management's).
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "256Mi"
              cpu: "500m"
  volumeClaimTemplates:
    - metadata:
        name: signal-data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: PLACEHOLDER_STORAGE_CLASS
        resources:
          requests:
            storage: 1Gi
