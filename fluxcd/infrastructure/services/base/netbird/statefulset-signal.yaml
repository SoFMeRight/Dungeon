apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: netbird-signal
spec:
  revisionHistoryLimit: 5
  serviceName: netbird-signal
  replicas: 3
  selector:
    matchLabels:
      app: netbird
      component: signal
  template:
    metadata:
      labels:
        app: netbird
        component: signal
    spec:
      serviceAccountName: netbird-signal
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
        sysctls:
          # A non-root process can't use NET_BIND_SERVICE (the cap isn't in the ambient
          # set after exec), so binding :80 needs this SAFE, namespaced sysctl instead.
          - name: net.ipv4.ip_unprivileged_port_start
            value: "0"
      containers:
        - name: signal
          image: PLACEHOLDER_IMAGE
          ports:
            - containerPort: 80
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: signal-data
              mountPath: /var/lib/netbird
          resources:
            requests:
              memory: "12Mi"
              cpu: "2m"
            limits:
              memory: "16Mi"
              cpu: "10m"
  volumeClaimTemplates:
    - metadata:
        name: signal-data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: PLACEHOLDER_STORAGE_CLASS
        resources:
          requests:
            storage: 1Gi
