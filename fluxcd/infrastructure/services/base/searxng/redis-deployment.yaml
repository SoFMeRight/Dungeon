apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng-redis
spec:
  replicas: PLACEHOLDER_REPLICAS
  selector:
    matchLabels:
      app: searxng-redis
  template:
    metadata:
      labels:
        app: searxng-redis
    spec:
      serviceAccountName: searxng-redis
      # Hard spread: one replica per node (matches kimai) — survives node loss; a replica
      # stays Pending if fewer eligible nodes are free (acceptable on a 5-worker cluster).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          # Count only same-revision pods so a rolling update doesn't stall on old pods.
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app: searxng-redis
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: redis
          image: PLACEHOLDER_IMAGE
          ports:
            - containerPort: 6379
              name: redis
          command:
            - valkey-server
          args:
            - --save
            - "30"
            - "1"
            - --loglevel
            - warning
          volumeMounts:
            - name: redis-data
              mountPath: /data
          resources:
            requests:
              memory: "32Mi"
              cpu: "6m"
            limits:
              memory: "128Mi"
              cpu: "10m"
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: searxng-redis-data
