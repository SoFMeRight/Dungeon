apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vmstorage
spec:
  revisionHistoryLimit: 5
  serviceName: vmstorage
  replicas: 3
  selector:
    matchLabels:
      app: vmstorage
  template:
    metadata:
      labels:
        app: vmstorage
    spec:
      serviceAccountName: vmstorage
      # Hard spread: one replica per node (matches kimai) — survives node loss; a replica
      # stays Pending if fewer eligible nodes are free (acceptable on a 5-worker cluster).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          # StatefulSet revision label (not pod-template-hash): count only same-revision
          # pods so a rolling update doesn't stall on the old replica.
          matchLabelKeys:
            - controller-revision-hash
          labelSelector:
            matchLabels:
              app: vmstorage
      containers:
        - name: vmstorage
          image: PLACEHOLDER_IMAGE
          args:
            - -storageDataPath=/storage
            - -retentionPeriod=30d
            - -httpListenAddr=:8482
            - -vminsertAddr=:8400
            - -vmselectAddr=:8401
          ports:
            - containerPort: 8482
              name: http
            - containerPort: 8400
              name: vminsert
            - containerPort: 8401
              name: vmselect
          volumeMounts:
            - name: storage
              mountPath: /storage
          resources:
            requests:
              cpu: PLACEHOLDER_CPU
              memory: PLACEHOLDER_MEMORY
            limits:
              cpu: PLACEHOLDER_CPU_LIMIT
              memory: PLACEHOLDER_MEMORY_LIMIT
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: PLACEHOLDER_STORAGE_CLASS
        resources:
          requests:
            storage: PLACEHOLDER_STORAGE_SIZE
