apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmauth
spec:
  revisionHistoryLimit: 5
  replicas: 2
  selector:
    matchLabels:
      app: vmauth
  template:
    metadata:
      labels:
        app: vmauth
    spec:
      serviceAccountName: vmauth
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vmauth
          image: PLACEHOLDER_IMAGE
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          args:
            - -auth.config=/config/auth.yml
            - -httpListenAddr=:8427
          ports:
            - containerPort: 8427
              name: http
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: PLACEHOLDER_CPU
              memory: PLACEHOLDER_MEMORY
            limits:
              cpu: PLACEHOLDER_CPU_LIMIT
              memory: PLACEHOLDER_MEMORY_LIMIT
      volumes:
        - name: config
          configMap:
            name: vmauth
        - name: tmp
          emptyDir: {}
