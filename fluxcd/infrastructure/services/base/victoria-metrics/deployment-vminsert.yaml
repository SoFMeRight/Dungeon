apiVersion: apps/v1
kind: Deployment
metadata:
  name: vminsert
spec:
  revisionHistoryLimit: 5
  replicas: 2
  selector:
    matchLabels:
      app: vminsert
  template:
    metadata:
      labels:
        app: vminsert
    spec:
      serviceAccountName: vminsert
      # Hard spread: one replica per node (matches kimai) — survives node loss; a replica
      # stays Pending if fewer eligible nodes are free (acceptable on a 5-worker cluster).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: vminsert
      containers:
        - name: vminsert
          image: PLACEHOLDER_IMAGE
          args:
            - -storageNode=vmstorage-0.vmstorage:8400,vmstorage-1.vmstorage:8400,vmstorage-2.vmstorage:8400
            - -httpListenAddr=:8480
            - -replicationFactor=2
          ports:
            - containerPort: 8480
              name: http
          resources:
            requests:
              cpu: PLACEHOLDER_CPU
              memory: PLACEHOLDER_MEMORY
            limits:
              cpu: PLACEHOLDER_CPU_LIMIT
              memory: PLACEHOLDER_MEMORY_LIMIT
