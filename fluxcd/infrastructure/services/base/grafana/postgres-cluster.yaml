apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: grafana-postgres
spec:
  instances: PLACEHOLDER_INSTANCES

  affinity:
    podAntiAffinityType: required

  postgresql:
    parameters:
      shared_buffers: "PLACEHOLDER_SHARED_BUFFERS"
      max_connections: "PLACEHOLDER_MAX_CONNECTIONS"

  bootstrap:
    initdb:
      database: PLACEHOLDER_DB_NAME
      owner: PLACEHOLDER_DB_USER
      secret:
        name: grafana-postgres-credentials

  storage:
    storageClass: PLACEHOLDER_STORAGE_CLASS
    size: PLACEHOLDER_STORAGE_SIZE
  # Archive to the NAS object store. destinationPath and endpointURL are supplied
  # by the environment overlay: the path carries the cluster name and the endpoint
  # is that environment's store. Everything else is the same wherever this runs.
  backup:
    barmanObjectStore:
      s3Credentials:
        accessKeyId:
          name: grafana-postgres-backup-s3
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: grafana-postgres-backup-s3
          key: SECRET_ACCESS_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
    retentionPolicy: "30d"
