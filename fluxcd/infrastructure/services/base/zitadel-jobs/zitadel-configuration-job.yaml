# The ONE post-bootstrap configuration Job: everything declarative that happens to a
# running Zitadel via its admin API or Vault lives here as an ensure-state step, so a
# config change is a push (Flux force-replaces the Job) and a fresh bootstrap converges
# identically. The logic is an Ansible playbook (configuration-playbook.yml, mounted from
# a ConfigMap) run on the HomeLabHD ansible image; its steps: (1) admin-SA PAT -> Vault,
# (2) instance features, (3) kubernetes OIDC project/roles/app + clientId -> Vault, (4)
# flatRoles Actions-v2 target + signing key -> Vault, executions, retire v1. Add future
# configuration as plays/tasks, not as new Jobs. The bootstrap pair (zitadel-init/
# zitadel-setup, the vendor's own lifecycle commands) stays separate.
apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/force: "Enabled"  # immutable one-shot Job: force-replace on change, not wedge
  name: zitadel-configuration
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zitadel-configuration
    spec:
      serviceAccountName: zitadel
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-bootstrap
          image: PLACEHOLDER_K8S_IMAGE
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ZITADEL_ROUTE
              value: zitadel
          command:
            - sh
            - -c
            - |
              echo "Waiting for the admin PAT secret (written by zitadel-setup) and the Zitadel HTTPRoute..."
              until kubectl get secret zitadel-k8s-admin-sa -n "$NAMESPACE" >/dev/null 2>&1 \
                 && kubectl get httproute "$ZITADEL_ROUTE" -n "$NAMESPACE" >/dev/null 2>&1; do
                echo "not ready yet, waiting..."
                sleep 5
              done
              echo "ready"
      containers:
        - name: configure
          image: PLACEHOLDER_K8S_IMAGE
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ZITADEL_ROUTE
              value: zitadel
            - name: VAULT_ADDR
              value: http://openbao.zeldas-lullaby.svc.cluster.local:8200
            - name: VAULT_ROLE
              value: zitadel-vault-sync
            - name: VAULT_PATH
              value: zeldas-letter/data/apps/zitadel
            # Ansible (uid 1000) needs a writable HOME for its local tmp/control path.
            - name: HOME
              value: /tmp
            # Project keyed by NAME (bootstrap-safe: reuse if present, create if absent);
            # app name carries the cluster per house style. Instance-specific -> overlay.
            - name: PROJECT_NAME
              value: PLACEHOLDER_PROJECT_NAME
            - name: K8S_APP_NAME
              value: PLACEHOLDER_K8S_APP_NAME
          command: ["ansible-playbook", "-i", "localhost,", "/ansible/zitadel-configuration.yml"]
          volumeMounts:
            - name: playbook
              mountPath: /ansible
              readOnly: true
      volumes:
        - name: playbook
          configMap:
            name: zitadel-configuration-playbook
