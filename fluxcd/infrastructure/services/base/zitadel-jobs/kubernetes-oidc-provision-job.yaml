apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/force: "Enabled"  # immutable one-shot Job: force-replace on image bump, not wedge
  name: kubernetes-oidc-provision
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubernetes-oidc-provision
    spec:
      serviceAccountName: zitadel
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-secret
          image: PLACEHOLDER_K8S_IMAGE
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          command:
            - sh
            - -c
            - |
              echo "Waiting for zitadel-k8s-admin-sa (admin PAT) secret..."
              until kubectl get secret zitadel-k8s-admin-sa -n "$NAMESPACE" >/dev/null 2>&1; do
                echo "not found yet, waiting..."
                sleep 5
              done
              echo "found"
      containers:
        - name: provision
          image: PLACEHOLDER_K8S_IMAGE
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: VAULT_ADDR
              value: http://openbao.zeldas-lullaby.svc.cluster.local:8200
            - name: VAULT_ROLE
              value: zitadel-vault-sync
            - name: VAULT_PATH
              value: zeldas-letter/data/apps/zitadel
            - name: K8S_APP_NAME
              value: kubernetes
            # ZITADEL_URL + PROJECT_ID are instance-specific -> set in the overlay patch
            - name: ZITADEL_URL
              value: PLACEHOLDER_ZITADEL_URL
            - name: PROJECT_ID
              value: PLACEHOLDER_PROJECT_ID
          command:
            - bash
            - -c
            - |
              set -euo pipefail

              : "${ZITADEL_URL:?}" "${PROJECT_ID:?}" "${NAMESPACE:?}"
              : "${VAULT_ADDR:?}" "${VAULT_ROLE:?}" "${VAULT_PATH:?}" "${K8S_APP_NAME:?}"
              MGMT="${ZITADEL_URL}/management/v1"

              echo "=== Provisioning Kubernetes OIDC in project ${PROJECT_ID} ==="

              PAT="$(kubectl get secret zitadel-k8s-admin-sa -n "$NAMESPACE" -o jsonpath='{.data.token}' | base64 -d)"
              [ -n "$PAT" ] || { echo "ERROR: empty admin PAT"; exit 1; }

              api() { curl -sf -H "Authorization: Bearer ${PAT}" -H "Content-Type: application/json" "$@"; }

              # --- 1. Ensure project roles (idempotent: create only if the key is absent) ---
              ensure_role() {
                key="$1"; name="$2"; group="$3"
                have="$(api -X POST "${MGMT}/projects/${PROJECT_ID}/roles/_search" -d '{}' \
                  | jq -r --arg k "$key" '.result[]? | select(.key==$k) | .key')"
                if [ "$have" = "$key" ]; then
                  echo "  role '${key}' already present - leaving as-is"
                else
                  echo "  creating role '${key}'"
                  api -X POST "${MGMT}/projects/${PROJECT_ID}/roles" \
                    -d "{\"roleKey\":\"${key}\",\"displayName\":\"${name}\",\"group\":\"${group}\"}" >/dev/null
                fi
              }
              ensure_role user      "User"      "Kubernetes"
              ensure_role developer "Developer" "Kubernetes"
              ensure_role operator  "Operator"  "Kubernetes"
              # 'admin' already exists (weave binds it); do NOT recreate/clobber it.

              # --- 2. Ensure the kubernetes OIDC app (public/PKCE for kubelogin) ---
              APP_ID="$(api -X POST "${MGMT}/projects/${PROJECT_ID}/apps/_search" -d '{}' \
                | jq -r --arg n "$K8S_APP_NAME" '.result[]? | select(.name==$n) | .id' | head -n1)"
              if [ -z "$APP_ID" ] || [ "$APP_ID" = "null" ]; then
                echo "  creating OIDC app '${K8S_APP_NAME}'"
                RESP="$(api -X POST "${MGMT}/projects/${PROJECT_ID}/apps/oidc" -d "{
                  \"name\": \"${K8S_APP_NAME}\",
                  \"redirectUris\": [\"http://localhost:8000\", \"http://127.0.0.1:18000\"],
                  \"responseTypes\": [\"OIDC_RESPONSE_TYPE_CODE\"],
                  \"grantTypes\": [\"OIDC_GRANT_TYPE_AUTHORIZATION_CODE\", \"OIDC_GRANT_TYPE_REFRESH_TOKEN\"],
                  \"appType\": \"OIDC_APP_TYPE_NATIVE\",
                  \"authMethodType\": \"OIDC_AUTH_METHOD_TYPE_NONE\",
                  \"accessTokenType\": \"OIDC_TOKEN_TYPE_BEARER\",
                  \"accessTokenRoleAssertion\": true,
                  \"idTokenRoleAssertion\": true,
                  \"idTokenUserinfoAssertion\": true
                }")"
                CLIENT_ID="$(echo "$RESP" | jq -r '.clientId')"
              else
                echo "  OIDC app '${K8S_APP_NAME}' already present (${APP_ID}) - reading clientId"
                CLIENT_ID="$(api -X GET "${MGMT}/projects/${PROJECT_ID}/apps/${APP_ID}" \
                  | jq -r '.app.oidcConfig.clientId // .oidcConfig.clientId // empty')"
              fi
              [ -n "$CLIENT_ID" ] && [ "$CLIENT_ID" != "null" ] || { echo "ERROR: no clientId resolved"; exit 1; }
              echo "  clientId = ${CLIENT_ID}"

              # --- 3. Publish the clientId to Vault (apiserver audience + kubelogin/Headlamp consume it) ---
              SA_TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
              VT="$(curl -sf "${VAULT_ADDR}/v1/auth/kubernetes/login" \
                -d "{\"jwt\":\"${SA_TOKEN}\",\"role\":\"${VAULT_ROLE}\"}" | jq -r '.auth.client_token')"
              [ -n "$VT" ] && [ "$VT" != "null" ] || { echo "ERROR: Vault auth failed"; exit 1; }
              curl -sf -X PATCH "${VAULT_ADDR}/v1/${VAULT_PATH}" \
                -H "X-Vault-Token: ${VT}" \
                -H "Content-Type: application/merge-patch+json" \
                -d "{\"data\":{\"k8s-oidc-client-id\":\"${CLIENT_ID}\"}}" >/dev/null
              echo "  stored 'k8s-oidc-client-id' in Vault at ${VAULT_PATH}"

              echo "=== done (roles ensured, app '${K8S_APP_NAME}' clientId published) ==="
