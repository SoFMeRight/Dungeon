apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/force: "Enabled"  # immutable one-shot Job: force-replace on image bump, not wedge
  name: kubernetes-oidc-provision
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubernetes-oidc-provision
    spec:
      serviceAccountName: zitadel
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-secret
          image: PLACEHOLDER_K8S_IMAGE
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ZITADEL_ROUTE
              value: zitadel
          command:
            - sh
            - -c
            - |
              echo "Waiting for the admin PAT secret and the Zitadel HTTPRoute..."
              until kubectl get secret zitadel-k8s-admin-sa -n "$NAMESPACE" >/dev/null 2>&1 \
                 && kubectl get httproute "$ZITADEL_ROUTE" -n "$NAMESPACE" >/dev/null 2>&1; do
                echo "not ready yet, waiting..."
                sleep 5
              done
              echo "ready"
      containers:
        - name: provision
          image: PLACEHOLDER_K8S_IMAGE
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: VAULT_ADDR
              value: http://openbao.zeldas-lullaby.svc.cluster.local:8200
            - name: VAULT_ROLE
              value: zitadel-vault-sync
            - name: VAULT_PATH
              value: zeldas-letter/data/apps/zitadel
            - name: K8S_APP_NAME
              value: kubernetes
            # The Zitadel endpoint is DISCOVERED at runtime from its HTTPRoute (ZITADEL_ROUTE):
            # external domain = .spec.hostnames[0]; backend svc/port = .spec.rules[0].backendRefs[0].
            # Reached in-cluster (pods can't hairpin the public LB IP) with that domain as the Host
            # header so Zitadel resolves the instance. Nothing instance-specific is baked here;
            # NAMESPACE comes from the downward API. ZITADEL_ROUTE is the route name convention.
            - name: ZITADEL_ROUTE
              value: zitadel
            # Project is keyed by NAME (not a baked ID) so the Job is bootstrap-safe: it reuses
            # the project if present and creates it if a from-scratch Zitadel doesn't have it yet.
            - name: PROJECT_NAME
              value: PLACEHOLDER_PROJECT_NAME
          command:
            - bash
            - -c
            - |
              set -euo pipefail

              : "${ZITADEL_ROUTE:?}" "${PROJECT_NAME:?}" "${NAMESPACE:?}"
              : "${VAULT_ADDR:?}" "${VAULT_ROLE:?}" "${VAULT_PATH:?}" "${K8S_APP_NAME:?}"

              echo "=== Provisioning Kubernetes OIDC into project '${PROJECT_NAME}' ==="

              # Discover the Zitadel endpoint from its own HTTPRoute (single source of truth):
              #   ZITADEL_HOST = external domain (Host header resolves the instance)
              #   svc/port     = the route backend, reached in-cluster (pods can't hairpin the LB)
              HR="$(kubectl get httproute "$ZITADEL_ROUTE" -n "$NAMESPACE" -o json)"
              ZITADEL_HOST="$(echo "$HR" | jq -r '.spec.hostnames[0] // empty')"
              SVC="$(echo "$HR" | jq -r '.spec.rules[0].backendRefs[0].name // empty')"
              PORT="$(echo "$HR" | jq -r '.spec.rules[0].backendRefs[0].port // empty')"
              [ -n "$ZITADEL_HOST" ] || { echo "ERROR: no hostname on HTTPRoute '$ZITADEL_ROUTE'"; exit 1; }
              [ -n "$SVC" ] && [ -n "$PORT" ] || { echo "ERROR: no backend on HTTPRoute '$ZITADEL_ROUTE'"; exit 1; }
              MGMT="http://${SVC}.${NAMESPACE}.svc.cluster.local:${PORT}/management/v1"
              echo "  endpoint ${MGMT}  (Host: ${ZITADEL_HOST})"

              PAT="$(kubectl get secret zitadel-k8s-admin-sa -n "$NAMESPACE" -o jsonpath='{.data.token}' | base64 -d)"
              [ -n "$PAT" ] || { echo "ERROR: empty admin PAT"; exit 1; }

              # Host header pins the Zitadel instance when talking to the in-cluster service.
              api() { curl -sf -H "Host: ${ZITADEL_HOST}" -H "Authorization: Bearer ${PAT}" -H "Content-Type: application/json" "$@"; }

              # --- 0. Ensure the project (idempotent + bootstrap-safe): reuse by name, create if absent ---
              FOUND="$(api -X POST "${MGMT}/projects/_search" \
                -d "{\"queries\":[{\"nameQuery\":{\"name\":\"${PROJECT_NAME}\",\"method\":\"TEXT_QUERY_METHOD_EQUALS\"}}]}" \
                | jq -r '.result[]? | .id')"
              N="$(printf '%s\n' "$FOUND" | grep -c . || true)"
              if [ "$N" -gt 1 ]; then
                echo "ERROR: ${N} projects named '${PROJECT_NAME}' exist - refusing to guess which"; exit 1
              elif [ "$N" -eq 1 ]; then
                PROJECT_ID="$FOUND"
                echo "  project '${PROJECT_NAME}' already present (${PROJECT_ID}) - reusing"
              else
                echo "  project '${PROJECT_NAME}' absent - creating it"
                PROJECT_ID="$(api -X POST "${MGMT}/projects" \
                  -d "{\"name\":\"${PROJECT_NAME}\",\"projectRoleAssertion\":true,\"projectRoleCheck\":true,\"hasProjectCheck\":true}" \
                  | jq -r '.id')"
              fi
              [ -n "$PROJECT_ID" ] && [ "$PROJECT_ID" != "null" ] || { echo "ERROR: could not resolve project id"; exit 1; }

              # --- 1. Ensure project roles (idempotent: create only if the key is absent) ---
              ensure_role() {
                key="$1"; name="$2"; group="$3"
                have="$(api -X POST "${MGMT}/projects/${PROJECT_ID}/roles/_search" -d '{}' \
                  | jq -r --arg k "$key" '.result[]? | select(.key==$k) | .key')"
                if [ "$have" = "$key" ]; then
                  echo "  role '${key}' already present - leaving as-is"
                else
                  echo "  creating role '${key}'"
                  api -X POST "${MGMT}/projects/${PROJECT_ID}/roles" \
                    -d "{\"roleKey\":\"${key}\",\"displayName\":\"${name}\",\"group\":\"${group}\"}" >/dev/null
                fi
              }
              ensure_role user      "User"      "Kubernetes"
              ensure_role developer "Developer" "Kubernetes"
              ensure_role operator  "Operator"  "Kubernetes"
              # 'admin' already exists (weave binds it); do NOT recreate/clobber it.

              # --- 2. Ensure the kubernetes OIDC app (public/PKCE for kubelogin) ---
              APP_ID="$(api -X POST "${MGMT}/projects/${PROJECT_ID}/apps/_search" -d '{}' \
                | jq -r --arg n "$K8S_APP_NAME" '.result[]? | select(.name==$n) | .id' | head -n1)"
              if [ -z "$APP_ID" ] || [ "$APP_ID" = "null" ]; then
                echo "  creating OIDC app '${K8S_APP_NAME}'"
                RESP="$(api -X POST "${MGMT}/projects/${PROJECT_ID}/apps/oidc" -d "{
                  \"name\": \"${K8S_APP_NAME}\",
                  \"redirectUris\": [\"http://localhost:8000\", \"http://127.0.0.1:18000\"],
                  \"responseTypes\": [\"OIDC_RESPONSE_TYPE_CODE\"],
                  \"grantTypes\": [\"OIDC_GRANT_TYPE_AUTHORIZATION_CODE\", \"OIDC_GRANT_TYPE_REFRESH_TOKEN\", \"OIDC_GRANT_TYPE_DEVICE_CODE\"],
                  \"appType\": \"OIDC_APP_TYPE_NATIVE\",
                  \"authMethodType\": \"OIDC_AUTH_METHOD_TYPE_NONE\",
                  \"accessTokenType\": \"OIDC_TOKEN_TYPE_BEARER\",
                  \"accessTokenRoleAssertion\": true,
                  \"idTokenRoleAssertion\": true,
                  \"idTokenUserinfoAssertion\": true
                }")"
                CLIENT_ID="$(echo "$RESP" | jq -r '.clientId')"
              else
                echo "  OIDC app '${K8S_APP_NAME}' already present (${APP_ID}) - reading clientId"
                CLIENT_ID="$(api -X GET "${MGMT}/projects/${PROJECT_ID}/apps/${APP_ID}" \
                  | jq -r '.app.oidcConfig.clientId // .oidcConfig.clientId // empty')"
              fi
              [ -n "$CLIENT_ID" ] && [ "$CLIENT_ID" != "null" ] || { echo "ERROR: no clientId resolved"; exit 1; }
              echo "  clientId = ${CLIENT_ID}"

              # --- 3. Publish the clientId to Vault (apiserver audience + kubelogin/Headlamp consume it) ---
              SA_TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
              VT="$(curl -sf "${VAULT_ADDR}/v1/auth/kubernetes/login" \
                -d "{\"jwt\":\"${SA_TOKEN}\",\"role\":\"${VAULT_ROLE}\"}" | jq -r '.auth.client_token')"
              [ -n "$VT" ] && [ "$VT" != "null" ] || { echo "ERROR: Vault auth failed"; exit 1; }
              curl -sf -X PATCH "${VAULT_ADDR}/v1/${VAULT_PATH}" \
                -H "X-Vault-Token: ${VT}" \
                -H "Content-Type: application/merge-patch+json" \
                -d "{\"data\":{\"k8s-oidc-client-id\":\"${CLIENT_ID}\"}}" >/dev/null
              echo "  stored 'k8s-oidc-client-id' in Vault at ${VAULT_PATH}"

              echo "=== done (roles ensured, app '${K8S_APP_NAME}' clientId published) ==="
