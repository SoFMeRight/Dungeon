# Reads only netbird-router's entries, as the router's ServiceAccount.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-netbird-router
spec:
  provider:
    vault:
      server: "http://openbao.optcp-secrets.svc.cluster.local:8200"
      path: "optcp"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "netbird-router"
          serviceAccountRef:
            name: netbird-router-dungeon
