apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbird-router
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: PLACEHOLDER_SECRET_STORE
    kind: ClusterSecretStore
  target:
    name: netbird-router
    creationPolicy: Owner
  data:
    # Reusable, non-ephemeral routing-peer setup key. Minted in the NetBird dashboard/API
    # (there is no way to declare setup keys in Git) and stored in OpenBao apps/netbird.
    - secretKey: NB_SETUP_KEY
      remoteRef:
        key: PLACEHOLDER_VAULT_PATH
        property: ROUTING_PEER_SETUP_KEY
