apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbird-router-dungeon
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-netbird-router
    kind: SecretStore
  target:
    name: netbird-router-dungeon
    creationPolicy: Owner
  data:
    # Reusable, non-ephemeral routing-peer setup key. Minted in the NetBird dashboard/API
    # (there is no way to declare setup keys in Git); NetBird issues it, so it is filed
    # under netbird.
    - secretKey: NB_SETUP_KEY
      remoteRef:
        key: apps/netbird-router/netbird
        property: SETUP_KEY
