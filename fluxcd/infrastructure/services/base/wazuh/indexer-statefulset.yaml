apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wazuh-indexer
spec:
  serviceName: wazuh-indexer
  replicas: 1
  selector:
    matchLabels:
      app: wazuh-indexer
  template:
    metadata:
      labels:
        app: wazuh-indexer
        policy.prplanit.com/cap.oidc: "true"
    spec:
      serviceAccountName: wazuh-indexer
      hostname: wazuh-indexer
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # The security plugin requires owner-only certs and configs, but k8s mounts
        # them root-owned and world-readable with 0777 mount dirs the indexer user
        # cannot chmod. This init (root, then the app runs non-root) stages certs and
        # configs into emptyDirs owned by the indexer user at 0700 dirs / 0600 files.
        - name: stage-secure-config
          image: PLACEHOLDER_IMAGE
          command:
            - sh
            - -c
            - |
              set -e
              mkdir -p /certs/node /certs/admin /cfg
              cp -L /src/node/ca.crt /src/node/tls.crt /src/node/tls.key /certs/node/
              cp -L /src/admin/tls.crt /src/admin/tls.key /certs/admin/
              cp -L /src-cfg/wazuh.indexer.yml /cfg/opensearch.yml
              cp -L /src-cfg/internal_users.yml /cfg/internal_users.yml
              cp -L /src-seccfg/config.yml /cfg/config.yml
              chown -R 1000:1000 /certs /cfg
              chmod 700 /certs /certs/node /certs/admin /cfg
              chmod 600 /certs/node/* /certs/admin/* /cfg/*
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - FOWNER
                - DAC_OVERRIDE
          volumeMounts:
            - name: indexer-certs
              mountPath: /src/node
              readOnly: true
            - name: admin-certs
              mountPath: /src/admin
              readOnly: true
            - name: indexer-config
              mountPath: /src-cfg
              readOnly: true
            - name: indexer-security-config
              mountPath: /src-seccfg
              readOnly: true
            - name: indexer-certs-secure
              mountPath: /certs
            - name: indexer-config-secure
              mountPath: /cfg
      containers:
        - name: wazuh-indexer
          image: PLACEHOLDER_IMAGE
          ports:
            - containerPort: 9200
              name: http
              protocol: TCP
          envFrom:
            - secretRef:
                name: PLACEHOLDER_ENV_SECRET
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - IPC_LOCK
                - SYS_RESOURCE
          resources:
            requests:
              cpu: PLACEHOLDER_CPU
              memory: PLACEHOLDER_MEMORY
            limits:
              cpu: PLACEHOLDER_CPU_LIMIT
              memory: PLACEHOLDER_MEMORY_LIMIT
          volumeMounts:
            - name: wazuh-indexer-data
              mountPath: /var/lib/wazuh-indexer
            - name: indexer-config-secure
              mountPath: /usr/share/wazuh-indexer/config/opensearch.yml
              subPath: opensearch.yml
              readOnly: true
            - name: indexer-config-secure
              mountPath: /usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml
              subPath: internal_users.yml
              readOnly: true
            - name: indexer-config-secure
              mountPath: /usr/share/wazuh-indexer/config/opensearch-security/config.yml
              subPath: config.yml
              readOnly: true
            - name: indexer-certs-secure
              mountPath: /usr/share/wazuh-indexer/config/certs
              readOnly: true
      volumes:
        - name: indexer-config
          configMap:
            name: PLACEHOLDER_INDEXER_CONFIG
        - name: indexer-security-config
          configMap:
            name: PLACEHOLDER_INDEXER_SECURITY_CONFIG
        - name: indexer-certs
          secret:
            secretName: wazuh-indexer-tls
        - name: admin-certs
          secret:
            secretName: wazuh-admin-tls
        - name: indexer-certs-secure
          emptyDir: {}
        - name: indexer-config-secure
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: wazuh-indexer-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: PLACEHOLDER_STORAGE_CLASS
        resources:
          requests:
            storage: PLACEHOLDER_STORAGE_SIZE
