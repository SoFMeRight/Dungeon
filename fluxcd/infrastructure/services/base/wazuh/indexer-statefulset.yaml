apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wazuh-indexer
spec:
  serviceName: wazuh-indexer
  replicas: 1
  selector:
    matchLabels:
      app: wazuh-indexer
  template:
    metadata:
      labels:
        app: wazuh-indexer
        policy.prplanit.com/cap.oidc: "true"
    spec:
      serviceAccountName: wazuh-indexer
      hostname: wazuh-indexer
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # cert-manager mounts certs world-readable and root-owned; the security
        # plugin wants owner-only certs. Copy them into an emptyDir owned by the
        # indexer user at 0700/0600.
        - name: fix-cert-perms
          image: PLACEHOLDER_IMAGE
          command:
            - sh
            - -c
            - |
              set -e
              mkdir -p /certs/node /certs/admin
              cp -L /src/node/ca.crt /src/node/tls.crt /src/node/tls.key /certs/node/
              cp -L /src/admin/tls.crt /src/admin/tls.key /certs/admin/
              chmod 700 /certs/node /certs/admin
              chmod 600 /certs/node/* /certs/admin/*
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: indexer-certs
              mountPath: /src/node
              readOnly: true
            - name: admin-certs
              mountPath: /src/admin
              readOnly: true
            - name: indexer-certs-secure
              mountPath: /certs
      containers:
        - name: wazuh-indexer
          image: PLACEHOLDER_IMAGE
          ports:
            - containerPort: 9200
              name: http
              protocol: TCP
          envFrom:
            - secretRef:
                name: PLACEHOLDER_ENV_SECRET
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - IPC_LOCK
                - SYS_RESOURCE
          resources:
            requests:
              cpu: PLACEHOLDER_CPU
              memory: PLACEHOLDER_MEMORY
            limits:
              cpu: PLACEHOLDER_CPU_LIMIT
              memory: PLACEHOLDER_MEMORY_LIMIT
          volumeMounts:
            - name: wazuh-indexer-data
              mountPath: /var/lib/wazuh-indexer
            - name: indexer-config
              mountPath: /usr/share/wazuh-indexer/config/opensearch.yml
              subPath: wazuh.indexer.yml
            - name: indexer-config
              mountPath: /usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml
              subPath: internal_users.yml
            - name: indexer-security-config
              mountPath: /usr/share/wazuh-indexer/config/opensearch-security/config.yml
              subPath: config.yml
            - name: indexer-certs-secure
              mountPath: /usr/share/wazuh-indexer/config/certs
              readOnly: true
      volumes:
        - name: indexer-config
          configMap:
            name: PLACEHOLDER_INDEXER_CONFIG
        - name: indexer-security-config
          configMap:
            name: PLACEHOLDER_INDEXER_SECURITY_CONFIG
        - name: indexer-certs
          secret:
            secretName: wazuh-indexer-tls
        - name: admin-certs
          secret:
            secretName: wazuh-admin-tls
        - name: indexer-certs-secure
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: wazuh-indexer-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: PLACEHOLDER_STORAGE_CLASS
        resources:
          requests:
            storage: PLACEHOLDER_STORAGE_SIZE
