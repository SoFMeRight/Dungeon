apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wazuh-ssl-certs
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: PLACEHOLDER_SECRET_STORE
  target:
    name: wazuh-ssl-certs
    # Select ONLY the TLS material out of the shared apps/wazuh bag. Without this
    # template the extract dumps every key (app creds, OIDC client secret) into the
    # cert Secret. The template's keys are the whole output (default Replace policy),
    # so wazuh-ssl-certs carries certs and nothing else. Dotted key names require the
    # index function rather than dot access.
    template:
      engineVersion: v2
      data:
        root-ca.pem: '{{ index . "root-ca.pem" }}'
        root-ca.key: '{{ index . "root-ca.key" }}'
        root-ca-manager.pem: '{{ index . "root-ca-manager.pem" }}'
        root-ca-manager.key: '{{ index . "root-ca-manager.key" }}'
        admin.pem: '{{ index . "admin.pem" }}'
        admin-key.pem: '{{ index . "admin-key.pem" }}'
        wazuh.indexer.pem: '{{ index . "wazuh.indexer.pem" }}'
        wazuh.indexer-key.pem: '{{ index . "wazuh.indexer-key.pem" }}'
        wazuh.manager.pem: '{{ index . "wazuh.manager.pem" }}'
        wazuh.manager-key.pem: '{{ index . "wazuh.manager-key.pem" }}'
        wazuh.dashboard.pem: '{{ index . "wazuh.dashboard.pem" }}'
        wazuh.dashboard-key.pem: '{{ index . "wazuh.dashboard-key.pem" }}'
  dataFrom:
    - extract:
        key: PLACEHOLDER_VAULT_PATH_SSL
