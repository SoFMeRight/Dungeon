apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wazuh-manager-authd
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: PLACEHOLDER_SECRET_STORE
  target:
    name: wazuh-manager-authd
    template:
      engineVersion: v2
      data:
        authd.pass: "{{ .ENROLLMENT_PASSWORD }}"
  data:
    - secretKey: ENROLLMENT_PASSWORD
      remoteRef:
        key: PLACEHOLDER_VAULT_PATH
        property: ENROLLMENT_PASSWORD
