apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wazuh-dashboard-secrets
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: PLACEHOLDER_SECRET_STORE
  target:
    name: wazuh-dashboard-secrets
    template:
      engineVersion: v2
      data:
        INDEXER_URL: "https://wazuh-indexer:9200"
        INDEXER_USERNAME: "{{ .INDEXER_USERNAME }}"
        INDEXER_PASSWORD: "{{ .INDEXER_PASSWORD }}"
        DASHBOARD_USERNAME: "{{ .DASHBOARD_USERNAME }}"
        DASHBOARD_PASSWORD: "{{ .DASHBOARD_PASSWORD }}"
        API_USERNAME: "{{ .API_USERNAME }}"
        API_PASSWORD: "{{ .API_PASSWORD }}"
        OIDC_CLIENT_ID: "{{ .OIDC_CLIENT_ID }}"
        OIDC_CLIENT_SECRET: "{{ .OIDC_CLIENT_SECRET }}"
        wazuh.yml: |
          hosts:
            - PLACEHOLDER_API_ID:
                url: "https://wazuh-manager"
                port: 55000
                username: {{ .API_USERNAME }}
                password: "{{ .API_PASSWORD }}"
                run_as: false
        opensearch_dashboards.yml: |
          server.host: 0.0.0.0
          server.port: 5601
          opensearch.hosts: https://wazuh-indexer:9200
          opensearch.username: "{{ .DASHBOARD_USERNAME }}"
          opensearch.password: "{{ .DASHBOARD_PASSWORD }}"
          opensearch.ssl.verificationMode: certificate
          opensearch.requestHeadersWhitelist: ["securitytenant","Authorization"]
          opensearch_security.multitenancy.enabled: false
          opensearch_security.readonly_mode.roles: ["kibana_read_only"]
          opensearch_security.auth.type: ["basicauth","openid"]
          opensearch_security.auth.multiple_auth_enabled: true
          opensearch_security.openid.connect_url: https://sso.prplanit.com/.well-known/openid-configuration
          # Public origin: TLS terminates at the gateway, not this listener.
          opensearch_security.openid.base_redirect_url: https://siem.pcfae.com
          opensearch_security.openid.client_id: "{{ .OIDC_CLIENT_ID }}"
          opensearch_security.openid.client_secret: "{{ .OIDC_CLIENT_SECRET }}"
          opensearch_security.openid.scope: "openid profile email"
          opensearch_security.openid.refresh_tokens: true
          opensearch_security.openid.logout_url: https://sso.prplanit.com/oidc/v1/end_session
          server.ssl.enabled: false
          opensearch.ssl.certificateAuthorities: ["/usr/share/wazuh-dashboard/certs/root-ca.pem"]
          uiSettings.overrides.defaultRoute: /app/wazuh
  dataFrom:
    - extract:
        key: PLACEHOLDER_VAULT_PATH
