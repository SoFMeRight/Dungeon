apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - serviceaccounts.yaml
  - manager-statefulset.yaml
  - manager-service.yaml
  - manager-config.yaml
  - manager-externalsecret.yaml
  - manager-authd-externalsecret.yaml
  - indexer-statefulset.yaml
  - indexer-service.yaml
  - indexer-config.yaml
  - indexer-security-config.yaml
  - dashboard-statefulset.yaml
  - dashboard-service.yaml
  - dashboard-externalsecret.yaml
  - certificates.yaml
  - configuration-job.yaml

# Hash-suffixed so a playbook edit changes the Job template and Flux reruns it.
configMapGenerator:
  - name: wazuh-configuration-playbook
    files:
      - configuration-playbook.yml
