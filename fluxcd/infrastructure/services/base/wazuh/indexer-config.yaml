apiVersion: v1
data:
  internal_users.yml: |-
    ---
    # This is the internal user database
    # The hash value is a bcrypt hash and can be generated with plugin/tools/hash.sh

    _meta:
      type: "internalusers"
      config_version: 2

    # Define your internal users here

    admin:
      hash: "$2a$12$S9EjQJA4hj7w/bmgBKjgIey9vsu8eJHyB7hr2B42YUVSx0tdSPo5i"
      reserved: true
      backend_roles:
      - "internal-admin"
      description: "Internal superuser for filebeat and the dashboard's plugin checks"

    kibanaserver:
      hash: "$2a$12$ufdDGUes2vhDChfis4SGqe9QzDz0iQGOFuTjwc5kN3.agJ8RvgDrG"
      reserved: true
      description: "OpenSearch Dashboards server user"
  wazuh.indexer.yml: |-
    network.host: "0.0.0.0"
    node.name: "wazuh.indexer"
    cluster.name: "wazuh-cluster"
    path.data: /var/lib/wazuh-indexer
    path.logs: /var/log/wazuh-indexer
    discovery.type: single-node
    http.port: 9200-9299
    transport.tcp.port: 9300-9399
    compatibility.override_main_response_version: true
    plugins.security.ssl.http.pemcert_filepath: /usr/share/wazuh-indexer/config/certs/node/tls.crt
    plugins.security.ssl.http.pemkey_filepath: /usr/share/wazuh-indexer/config/certs/node/tls.key
    plugins.security.ssl.http.pemtrustedcas_filepath: /usr/share/wazuh-indexer/config/certs/node/ca.crt
    plugins.security.ssl.transport.pemcert_filepath: /usr/share/wazuh-indexer/config/certs/node/tls.crt
    plugins.security.ssl.transport.pemkey_filepath: /usr/share/wazuh-indexer/config/certs/node/tls.key
    plugins.security.ssl.transport.pemtrustedcas_filepath: /usr/share/wazuh-indexer/config/certs/node/ca.crt
    plugins.security.ssl.http.enabled: true
    plugins.security.ssl.http.enabled_ciphers:
      - "TLS_AES_256_GCM_SHA384"
      - "TLS_CHACHA20_POLY1305_SHA256"
      - "TLS_AES_128_GCM_SHA256"
    plugins.security.ssl.http.enabled_protocols:
      - "TLSv1.3"
    plugins.security.ssl.transport.enabled_ciphers:
      - "TLS_AES_256_GCM_SHA384"
      - "TLS_CHACHA20_POLY1305_SHA256"
      - "TLS_AES_128_GCM_SHA256"
    plugins.security.ssl.transport.enabled_protocols:
      - "TLSv1.3"
    plugins.security.ssl.transport.enforce_hostname_verification: false
    plugins.security.ssl.transport.resolve_hostname: false
    plugins.security.authcz.admin_dn:
    - "CN=admin,OU=Wazuh,O=Wazuh,L=California,C=US"
    plugins.security.check_snapshot_restore_write_privileges: true
    plugins.security.enable_snapshot_restore_privilege: true
    plugins.security.nodes_dn:
    - "CN=wazuh-indexer,OU=Wazuh,O=Wazuh,L=California,C=US"
    - "CN=wazuh-manager,OU=Wazuh,O=Wazuh,L=California,C=US"
    plugins.security.restapi.roles_enabled:
    - "all_access"
    - "security_rest_api_access"
    plugins.security.system_indices.enabled: true
    plugins.security.system_indices.indices:
      - ".opendistro-alerting-config"
      - ".opendistro-alerting-alert*"
      - ".opendistro-anomaly-results*"
      - ".opendistro-anomaly-detector*"
      - ".opendistro-anomaly-checkpoints"
      - ".opendistro-anomaly-detection-state"
      - ".opendistro-reports-*"
      - ".opendistro-notifications-*"
      - ".opendistro-notebooks"
      - ".opensearch-observability"
      - ".opendistro-asynchronous-search-response*"
      - ".replication-metadata-store"
    plugins.security.allow_default_init_securityindex: true
    cluster.routing.allocation.disk.threshold_enabled: false
kind: ConfigMap
metadata:
  name: wazuh-indexer-config
