# wazuh's certificates come from optcp's issuing CA (optcp-pki-int) in OpenBao, through
# the Vault Issuer below, so the CA the indexer, manager, dashboard and agents trust lives
# outside this namespace and survives a move or rebuild of it. Each secret's ca.crt is
# optcp's root. Subjects reproduce the DNs OpenSearch matches in nodes_dn / admin_dn;
# OpenBao's wazuh role sets them. Every leaf carries digitalSignature so ECDHE works.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wazuh-pki
---
# cert-manager logs in to OpenBao as wazuh-pki with a token it requests for the Issuer.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wazuh-pki-token
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["wazuh-pki"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wazuh-pki-token
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: wazuh-pki-token
subjects:
  - kind: ServiceAccount
    name: cert-manager
    namespace: optcp-service-mesh
---
# Reached through phloem at secrets.optcp.com: cert-manager runs outside the mesh, and
# OpenBao admits the gateway's identity.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: optcp-pki
spec:
  vault:
    server: https://secrets.optcp.com
    path: optcp-pki-int/sign/wazuh
    auth:
      kubernetes:
        role: cert-manager-wazuh
        mountPath: /v1/auth/kubernetes
        serviceAccountRef:
          name: wazuh-pki
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wazuh-admin
spec:
  secretName: wazuh-admin-tls
  duration: 8760h # 1y
  renewBefore: 720h # 30d
  commonName: admin
  subject:
    organizationalUnits: ["Wazuh"]
    organizations: ["Wazuh"]
    localities: ["California"]
    countries: ["US"]
  usages: ["client auth", "digital signature"]
  privateKey:
    algorithm: ECDSA
    size: 384
    encoding: PKCS8
  issuerRef:
    name: optcp-pki
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wazuh-indexer
spec:
  secretName: wazuh-indexer-tls
  duration: 8760h # 1y
  renewBefore: 720h # 30d
  commonName: wazuh-indexer
  subject:
    organizationalUnits: ["Wazuh"]
    organizations: ["Wazuh"]
    localities: ["California"]
    countries: ["US"]
  dnsNames: ["wazuh-indexer", "localhost"]
  ipAddresses: ["127.0.0.1"]
  usages: ["server auth", "client auth", "digital signature"]
  privateKey:
    algorithm: ECDSA
    size: 384
    encoding: PKCS8
  issuerRef:
    name: optcp-pki
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wazuh-manager
spec:
  secretName: wazuh-manager-tls
  duration: 8760h # 1y
  renewBefore: 720h # 30d
  commonName: wazuh-manager
  subject:
    organizationalUnits: ["Wazuh"]
    organizations: ["Wazuh"]
    localities: ["California"]
    countries: ["US"]
  dnsNames: ["wazuh-manager", "localhost"]
  ipAddresses: ["127.0.0.1"]
  usages: ["server auth", "client auth", "digital signature"]
  privateKey:
    algorithm: ECDSA
    size: 384
    encoding: PKCS8
  issuerRef:
    name: optcp-pki
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wazuh-dashboard
spec:
  secretName: wazuh-dashboard-tls
  duration: 8760h # 1y
  renewBefore: 720h # 30d
  commonName: wazuh-dashboard
  subject:
    organizationalUnits: ["Wazuh"]
    organizations: ["Wazuh"]
    localities: ["California"]
    countries: ["US"]
  dnsNames: ["wazuh-dashboard", "localhost"]
  ipAddresses: ["127.0.0.1"]
  usages: ["server auth", "client auth", "digital signature"]
  privateKey:
    algorithm: ECDSA
    size: 384
    encoding: PKCS8
  issuerRef:
    name: optcp-pki
    kind: Issuer
