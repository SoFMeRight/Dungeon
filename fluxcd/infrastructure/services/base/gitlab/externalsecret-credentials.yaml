apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-postgresql-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: PLACEHOLDER_SECRET_STORE
    kind: ClusterSecretStore
  target:
    name: gitlab-postgresql-credentials
    creationPolicy: Owner
    template:
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: apps/gitlab/postgres
        property: USER
    - secretKey: password
      remoteRef:
        key: apps/gitlab/postgres
        property: PASSWORD
