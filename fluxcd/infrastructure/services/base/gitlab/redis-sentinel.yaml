apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisSentinel
metadata:
  name: gitlab-sentinel
spec:
  clusterSize: 3
  serviceAccountName: gitlab-sentinel
  # Hard spread: one sentinel per node so a single node loss can't take 2/3 of the
  # sentinel quorum (matches the kimai one-replica-per-node intent).
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app: gitlab-sentinel-sentinel
          topologyKey: kubernetes.io/hostname
  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  kubernetesConfig:
    image: quay.io/opstree/redis-sentinel:v7.4.8
    imagePullPolicy: IfNotPresent
    redisSecret:
      name: gitlab-redis-password
      key: password
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
  redisSentinelConfig:
    redisReplicationName: gitlab-redis
    masterGroupName: gitlab-redis
    redisPort: "6379"
    quorum: "2"
    parallelSyncs: "1"
    failoverTimeout: "180000"
    downAfterMilliseconds: "30000"
    redisReplicationPassword:
      secretKeyRef:
        name: gitlab-redis-password
        key: password
