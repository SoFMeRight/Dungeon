apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: gatus-postgres
  labels:
    app.kubernetes.io/name: gatus
spec:
  instances: PLACEHOLDER_INSTANCES

  affinity:
    podAntiAffinityType: preferred

  postgresql:
    parameters:
      shared_buffers: "128MB"
      max_connections: "100"

  bootstrap:
    initdb:
      database: gatus
      owner: gatus

  storage:
    storageClass: PLACEHOLDER_STORAGE_CLASS
    size: PLACEHOLDER_STORAGE_SIZE
  # Archive to the NAS object store. destinationPath and endpointURL are supplied
  # by the environment overlay: the path carries the cluster name and the endpoint
  # is that environment's store. Everything else is the same wherever this runs.
  backup:
    barmanObjectStore:
      s3Credentials:
        accessKeyId:
          name: gatus-postgres-backup-s3
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: gatus-postgres-backup-s3
          key: SECRET_ACCESS_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
    retentionPolicy: "30d"
