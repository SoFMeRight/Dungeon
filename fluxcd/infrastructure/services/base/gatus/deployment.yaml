apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatus
  labels:
    app.kubernetes.io/name: gatus
spec:
  revisionHistoryLimit: 5
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gatus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gatus
    spec:
      serviceAccountName: gatus
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: init-config
          image: docker.io/busybox:1.38.0
          command: ["sh", "-c", "cp /configmap/* /config/"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: configmap
              mountPath: /configmap
            - name: config
              mountPath: /config
      containers:
        - name: gatus
          image: ghcr.io/twin/gatus:PLACEHOLDER_VERSION
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: GATUS_CONFIG_PATH
              value: /config
            - name: POSTGRES_HOST
              value: gatus-postgres-rw
            - name: POSTGRES_DB
              value: gatus
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: gatus-postgres-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gatus-postgres-credentials
                  key: password
          volumeMounts:
            - name: config
              mountPath: /config
          resources:
            requests:
              cpu: PLACEHOLDER_CPU_REQUEST
              memory: PLACEHOLDER_MEMORY_REQUEST
            limits:
              cpu: PLACEHOLDER_CPU_LIMIT
              memory: PLACEHOLDER_MEMORY_LIMIT
        - name: gatus-sidecar
          image: ghcr.io/home-operations/gatus-sidecar:PLACEHOLDER_SIDECAR_VERSION
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          args:
            - --auto-httproute
            - --auto-service
            # gatus-sidecar names an auto-discovered endpoint after the resource, and gatus
            # keys an endpoint by group+name and PANICS on a duplicate — taking every check
            # down, not just the offending one. 60 apps here have a same-named HTTPRoute and
            # Service, so the only thing keeping them apart was that each route carried a
            # group annotation while the service had none. One app added without that
            # annotation (headlamp) killed all uptime monitoring.
            #
            # Prefixing the service kind makes the two names distinct at the source, so the
            # collision is impossible rather than merely avoided by convention. Only the
            # service kind is prefixed: prefixing routes would rename all 177 curated
            # endpoints and reset their uptime history.
            - --prefix-service=svc/
            - --output=/config/endpoints.yaml
          volumeMounts:
            - name: config
              mountPath: /config
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: configmap
          configMap:
            name: gatus-config
        - name: config
          emptyDir: {}
