apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus-config
  labels:
    app.kubernetes.io/name: gatus
data:
  config.yaml: |
    storage:
      type: postgres
      path: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/${POSTGRES_DB}?sslmode=disable"
    ui:
      title: PLACEHOLDER_UI_TITLE
      header: PLACEHOLDER_UI_HEADER
      # Opens on the grouped view. A browser that has already chosen a sort keeps
      # its own — gatus treats this as the default for visitors without a stored
      # preference, not as an enforced setting.
      default-sort-by: group
    # Endpoints are auto-generated by gatus-sidecar
