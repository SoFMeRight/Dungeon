# Identity the openbao-snapshot helper authenticates to OpenBao as (kubernetes auth
# role `openbao-snapshot`, policy `snapshot` — read-only on sys/storage/raft/snapshot).
# The SA token is mounted so the `bao` CLI can log in; it grants no secret access.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-snapshot
automountServiceAccountToken: true
