apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: uptime-kuma
spec:
  parentRefs:
    - name: PLACEHOLDER_GATEWAY
      namespace: PLACEHOLDER_GATEWAY_NAMESPACE
  hostnames:
    - PLACEHOLDER_HOSTNAME
  rules:
    - backendRefs:
        - name: uptime-kuma
          # The production overlay serves this on the container's own port; the xylem
          # route already names it.
          port: 3001
