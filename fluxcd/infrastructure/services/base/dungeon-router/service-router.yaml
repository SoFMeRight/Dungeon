apiVersion: v1
kind: Service
metadata:
  name: dungeon-router
spec:
  # Headless service backing the StatefulSet's stable peer identities. Nothing in-cluster
  # connects TO the router (it initiates outbound to management + WireGuard peers), so this
  # exists only to satisfy the StatefulSet serviceName / give the pods stable DNS names.
  clusterIP: None
  selector:
    app: netbird
    component: router
  ports:
    - name: wireguard
      protocol: UDP
      port: 51820
