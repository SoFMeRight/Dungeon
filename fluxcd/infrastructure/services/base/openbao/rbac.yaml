apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openbao-secrets-reader
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openbao-secrets-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openbao-secrets-reader
subjects:
  - kind: ServiceAccount
    name: default
  - kind: ServiceAccount
    name: openbao
