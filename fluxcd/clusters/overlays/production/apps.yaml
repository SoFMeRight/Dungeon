apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 10m0s
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: infra-configs
    - name: infra-controllers
    # Apps are saturated with infra deps: ESO/vault (secrets + cr-pcfae pull secret),
    # ceph storage (PVCs), CNPG/ESO operators, and OIDC against zitadel. phase-03
    # transitively guarantees operators → phase-01(ceph) → phase-02(vault) → phase-03
    # (zitadel) are all Ready first, so apps stop racing infrastructure on a cold boot.
    # NOT phase-04 (pure observability — apps don't need it to run).
    - name: infra-services-phase-03
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./fluxcd/apps/overlays/production
  prune: true
