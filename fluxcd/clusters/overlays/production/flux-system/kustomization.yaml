apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gotk-components.yaml
  - gotk-sync.yaml
patches:
  - path: sops-patch.yaml
    target:
      kind: Kustomization
      name: flux-system
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 1423m
    target:
      kind: Deployment
      name: notification-controller
