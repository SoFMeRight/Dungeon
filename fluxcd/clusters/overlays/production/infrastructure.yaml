apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-api-crds
  namespace: flux-system
spec:
  dependsOn:
    - name: namespaces
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./fluxcd/infrastructure/operators/overlays/production/gateway-api-crds
  prune: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-controllers
  namespace: flux-system
spec:
  dependsOn:
    - name: gateway-api-crds
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./fluxcd/infrastructure/controllers/overlays/production
  prune: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-configs
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-controllers
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./fluxcd/infrastructure/configs/overlays/production
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-operators
  namespace: flux-system
spec:
  dependsOn:
    - name: gateway-api-crds
    - name: infra-configs
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./fluxcd/infrastructure/operators/overlays/production
  prune: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-services-phase-01
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-operators
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./fluxcd/infrastructure/services/overlays/production/phase-01-storage
  prune: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-services-phase-02
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-services-phase-01
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./fluxcd/infrastructure/services/overlays/production/phase-02-critical
  prune: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-services-phase-03
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-services-phase-02
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./fluxcd/infrastructure/services/overlays/production/phase-03-core
  prune: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-zitadel-jobs
  namespace: flux-system
spec:
  # zitadel's one-shot bootstrap Jobs, reconciled separately with force:true so their
  # immutable templates are replaced (not blocked) on image bumps. Durable zitadel
  # resources (Cluster, PVCs, StatefulSet, Deployments) stay in infra-services-phase-03
  # under fail-closed reconciliation.
  #
  # dependsOn phase-02, NOT phase-03: the jobs self-order via their init containers
  # (init waits for postgres, setup waits for init, the StatefulSet waits for setup).
  # Depending on phase-03 would deadlock — phase-03's StatefulSet never becomes Ready
  # until the setup Job here completes.
  dependsOn:
    - name: infra-services-phase-02
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  force: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./fluxcd/infrastructure/services/overlays/production/phase-03-core/zitadel-jobs
  prune: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-services-phase-04
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-services-phase-03
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./fluxcd/infrastructure/services/overlays/production/phase-04-platform
  prune: true
